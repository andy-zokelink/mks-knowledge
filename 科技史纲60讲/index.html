<!DOCTYPE html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>科技史纲60讲 · 文明引擎</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0a0a0f;color:#c0b8a8;min-height:100vh;overflow-x:hidden}

/* 背景齿轮纹理 */
.bg-gears{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:.03}
.bg-gears svg{width:100%;height:100%}

main{max-width:860px;margin:0 auto;padding:60px 24px 80px;position:relative;z-index:1}

/* 双螺旋标题 */
.hero{text-align:center;padding:40px 0 50px}
.hero .icon{font-size:52px;margin-bottom:14px;animation:pulse 3s ease-in-out infinite}
.hero h1{font-size:36px;font-weight:700;color:#d0c0a0;margin-bottom:8px}
.hero .sub{color:#887050;font-size:15px;margin-bottom:20px}
.helix{display:flex;justify-content:center;align-items:center;gap:12px}
.helix .strand{font-size:13px;font-weight:700;letter-spacing:2px;padding:6px 18px;border-radius:20px}
.helix .energy{background:rgba(220,140,40,.1);color:#d09040;border:1px solid rgba(220,140,40,.2)}
.helix .info{background:rgba(80,140,200,.1);color:#7098c0;border:1px solid rgba(80,140,200,.2)}
.helix .times{color:#504030;font-size:20px;font-weight:700;animation:spin 4s linear infinite}
@keyframes pulse{0%,100%{opacity:.8}50%{opacity:1}}
@keyframes spin{to{transform:rotate(180deg)}}

.divider{display:flex;align-items:center;gap:16px;margin:0 auto 48px;max-width:400px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(180,140,80,.25),transparent)}
.divider span{color:rgba(180,140,80,.3);font-size:18px}

/* 时间线引擎 */
.timeline{display:flex;flex-direction:column;gap:20px;margin-bottom:48px}
.era{display:flex;gap:20px;align-items:stretch}
.era .node{width:48px;flex-shrink:0;display:flex;flex-direction:column;align-items:center}
.era .dot{width:14px;height:14px;border-radius:50%;margin-top:20px;flex-shrink:0}
.era .line{flex:1;width:1px;background:rgba(100,80,60,.2)}
.era:last-child .line{background:transparent}
.era .card{flex:1;background:linear-gradient(135deg,rgba(20,18,14,.95),rgba(30,25,18,.9));border:1px solid rgba(120,90,50,.12);border-radius:14px;padding:24px;text-decoration:none;color:inherit;transition:all .3s;position:relative}
.era .card:hover{transform:translateX(6px);border-color:rgba(200,150,80,.25);box-shadow:0 6px 24px rgba(0,0,0,.4)}
.era .card .era-label{font-size:11px;font-weight:700;letter-spacing:3px;margin-bottom:8px}
.era .card h2{font-size:19px;font-weight:700;margin-bottom:4px}
.era .card .meta{font-size:12px;color:#6a5a3a;margin-bottom:8px}
.era .card .desc{font-size:14px;color:#a09078;line-height:1.7}

/* 各时代颜色 */
.e1 .dot{background:#d08040;box-shadow:0 0 12px rgba(200,120,40,.4)}
.e1 .era-label{color:#c08040}
.e1 h2{color:#e0b060}
.e2 .dot{background:#6090b0;box-shadow:0 0 12px rgba(80,140,180,.4)}
.e2 .era-label{color:#6090b0}
.e2 h2{color:#80b0d0}

.footer{text-align:center;padding:20px;border-top:1px solid rgba(80,60,30,.15)}
.footer a{color:rgba(140,120,80,.35);font-size:12px;text-decoration:none;transition:color .3s}
.footer a:hover{color:rgba(180,150,100,.6)}

@media(max-width:500px){
  .hero h1{font-size:24px}
}
</style>

<main>
  <div class="hero">
    <div class="icon">⚙️</div>
    <h1>文明引擎</h1>
    <p class="sub">吴军 · 科技史纲60讲 · 最小知识集</p>
    <div class="helix">
      <span class="strand energy">能 量</span>
      <span class="times">×</span>
      <span class="strand info">信 息</span>
    </div>
  </div>

  <div class="divider"><span>◎</span></div>

  <div class="timeline">
    <div class="era e1">
      <div class="node">
        <div class="dot"></div>
        <div class="line"></div>
      </div>
      <a class="card" href="1-文明底层与古代技术.html">
        <div class="era-label">第一纪元</div>
        <h2>🔥 文明底层与古代技术</h2>
        <div class="meta">32 篇笔记</div>
        <div class="desc">从火的使用到农耕革命、冶金术、文字诞生——能量与信息双螺旋如何驱动文明从零到一。四大古文明的技术基石在此铺就。</div>
      </a>
    </div>

    <div class="era e2">
      <div class="node">
        <div class="dot"></div>
        <div class="line"></div>
      </div>
      <a class="card" href="2-科学革命到信息前沿.html">
        <div class="era-label">第二纪元</div>
        <h2>⚡ 科学革命到信息前沿</h2>
        <div class="meta">27 篇笔记</div>
        <div class="desc">文艺复兴唤醒理性，蒸汽机释放能量，电磁波承载信息，量子力学打开微观之门——五百年科技爆炸的壮阔征途。</div>
      </a>
    </div>
  </div>

  <div class="footer">
    <a href="../index.html">← 返回知识主板</a>
  </div>
</main>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>概念卡片池 · 水面捞出</title>
<style>
/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --water-1: #d8f0f8;
  --water-2: #c8e6e0;
  --water-3: #d4edf4;
  --text-primary: #1a2a3a;
  --text-secondary: #4a6070;
  --text-muted: #7a8a96;
  --card-bg: rgba(255, 255, 255, 0.52);
  --card-bg-hover: rgba(255, 255, 255, 0.88);
  --shadow-card: 0 2px 8px rgba(60, 100, 130, 0.07);
  --shadow-hover: 0 10px 30px rgba(60, 100, 130, 0.13);
  --shadow-pop: 0 24px 64px rgba(0, 0, 0, 0.16);
  --radius-card: 14px;
  --radius-detail: 20px;
  --font-stack: 'PingFang SC', 'Noto Sans SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
  --ease-card: 280ms cubic-bezier(0.4, 0, 0.2, 1);
  --ease-pop: 380ms cubic-bezier(0.22, 0.98, 0.36, 1.02);
  --ease-close: 280ms cubic-bezier(0.4, 0, 0.6, 1);
}

html { font-size: 16px; }

body {
  font-family: var(--font-stack);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

body.overlay-open { overflow: hidden; }

/* ===== Water Background ===== */
.water-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  background:
    linear-gradient(172deg,
      #d8f0f8 0%,
      #c8e8e0 16%,
      #d4edf4 32%,
      #e2f2f0 48%,
      #cce8e8 64%,
      #daf0f5 82%,
      #d0eaf2 100%
    );
}

/* Caustics — large slow blobs */
.water-bg::before {
  content: '';
  position: absolute;
  inset: -35%;
  background:
    radial-gradient(ellipse 600px 400px at 18% 28%, rgba(255,255,255,0.22) 0%, transparent 60%),
    radial-gradient(ellipse 500px 350px at 72% 18%, rgba(255,255,255,0.17) 0%, transparent 55%),
    radial-gradient(ellipse 520px 380px at 48% 68%, rgba(255,255,255,0.19) 0%, transparent 58%),
    radial-gradient(ellipse 420px 300px at 82% 72%, rgba(255,255,255,0.13) 0%, transparent 50%),
    radial-gradient(ellipse 360px 280px at 28% 78%, rgba(255,255,255,0.15) 0%, transparent 52%);
  animation: caustics-drift 14s ease-in-out infinite;
}

/* Caustics — smaller faster highlights */
.water-bg::after {
  content: '';
  position: absolute;
  inset: -25%;
  background:
    radial-gradient(ellipse 300px 200px at 22% 42%, rgba(255,255,255,0.11) 0%, transparent 50%),
    radial-gradient(ellipse 260px 180px at 62% 32%, rgba(255,255,255,0.09) 0%, transparent 48%),
    radial-gradient(ellipse 280px 190px at 44% 74%, rgba(255,255,255,0.10) 0%, transparent 52%),
    radial-gradient(ellipse 240px 160px at 78% 58%, rgba(255,255,255,0.08) 0%, transparent 50%);
  animation: caustics-drift 9s ease-in-out infinite reverse;
}

/* Extra caustics overlay for more light play */
.caustics-extra {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: 0.35;
  background:
    radial-gradient(ellipse 380px 240px at 30% 35%, rgba(200,235,250,0.25) 0%, transparent 55%),
    radial-gradient(ellipse 340px 200px at 65% 55%, rgba(200,235,250,0.20) 0%, transparent 50%),
    radial-gradient(ellipse 300px 220px at 50% 20%, rgba(220,245,255,0.22) 0%, transparent 52%);
  animation: caustics-drift 12s ease-in-out infinite;
}

@keyframes caustics-drift {
  0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
  18%      { transform: translate(2.8%, 1.8%) rotate(0.7deg) scale(1.03); }
  38%      { transform: translate(-1.2%, 2.2%) rotate(-0.5deg) scale(0.97); }
  58%      { transform: translate(1.8%, -1.6%) rotate(0.4deg) scale(1.02); }
  78%      { transform: translate(-2.2%, -1.2%) rotate(-0.6deg) scale(0.98); }
}

/* Subtle light rays overlay */
.light-rays {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  opacity: 0.30;
  background:
    repeating-linear-gradient(
      108deg,
      transparent,
      transparent 140px,
      rgba(255,255,255,0.035) 140px,
      rgba(255,255,255,0.07) 143px,
      transparent 143px
    );
  animation: rays-shift 22s linear infinite;
}

@keyframes rays-shift {
  0%   { transform: translateX(-6%) skewX(-2deg); }
  50%  { transform: translateX(6%) skewX(2deg); }
  100% { transform: translateX(-6%) skewX(-2deg); }
}

/* ===== Legend Panel — Top Left Fixed ===== */
.legend-panel {
  position: fixed;
  top: 16px;
  left: 16px;
  z-index: 50;
  pointer-events: none;
  background: rgba(255, 255, 255, 0.65);
  backdrop-filter: blur(18px) saturate(1.4);
  -webkit-backdrop-filter: blur(18px) saturate(1.4);
  border: 1px solid rgba(255, 255, 255, 0.6);
  border-radius: 16px;
  padding: 16px 20px 18px;
  box-shadow: 0 4px 28px rgba(60, 110, 140, 0.12);
  width: 260px;
  max-width: calc(100vw - 32px);
  transition: all 0.35s ease;
  overflow: hidden;
}

/* Water reflection line at top */
.legend-panel::before {
  content: '';
  position: absolute;
  top: 0;
  left: 16px;
  right: 16px;
  height: 2px;
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(140, 200, 225, 0.5) 15%,
    rgba(200, 230, 245, 0.8) 35%,
    rgba(255, 255, 255, 0.9) 50%,
    rgba(200, 230, 245, 0.8) 65%,
    rgba(140, 200, 225, 0.5) 85%,
    transparent 100%
  );
  border-radius: 1px;
}

.legend-panel .legend-title {
  font-size: 0.88rem;
  font-weight: 800;
  color: #1a3040;
  margin-bottom: 2px;
  letter-spacing: 0.05em;
}

.legend-panel .legend-subtitle {
  font-size: 0.65rem;
  color: #5a7888;
  margin-bottom: 8px;
  font-weight: 500;
}

.legend-panel .legend-divider {
  border: none;
  border-top: 1px dashed rgba(120, 170, 195, 0.25);
  margin: 0 0 8px 0;
}

.legend-panel .legend-cats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2px 10px;
  font-size: 0.65rem;
  color: #4a6678;
  line-height: 1.6;
}

.legend-panel .legend-cat-item {
  white-space: nowrap;
  display: flex;
  justify-content: space-between;
  gap: 4px;
}

.legend-panel .legend-cat-num {
  font-weight: 700;
  color: #2a5068;
  min-width: 20px;
  text-align: right;
}

/* ===== Mouse Ripple Canvas ===== */
#rippleCanvas {
  position: fixed;
  inset: 0;
  z-index: 5;
  pointer-events: none;
}

/* ===== Raindrops ===== */
.raindrop-container {
  position: fixed;
  inset: 0;
  z-index: 3;
  pointer-events: none;
}

.raindrop {
  position: absolute;
  width: 5px;
  height: 8px;
  background: linear-gradient(180deg,
    rgba(180, 220, 240, 0.7) 0%,
    rgba(140, 200, 225, 0.5) 100%
  );
  border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
  pointer-events: none;
  filter: drop-shadow(0 0 2px rgba(160, 210, 235, 0.5));
}

.raindrop.falling {
  animation: raindrop-fall var(--fall-duration, 0.6s) ease-in forwards;
}

@keyframes raindrop-fall {
  0%   { transform: translateY(0); opacity: 0.7; }
  70%  { opacity: 0.6; }
  100% { transform: translateY(var(--fall-distance, 300px)); opacity: 0.3; }
}

/* Rain ripple — expands from impact point */
.rain-ripple {
  position: fixed;
  pointer-events: none;
  z-index: 4;
  border-radius: 50%;
  border: 1.5px solid rgba(180, 215, 235, 0.55);
  background: radial-gradient(circle, rgba(190, 220, 240, 0.15) 0%, transparent 65%);
  transform: translate(-50%, -50%);
}

.rain-ripple.animating {
  animation: rain-ripple-expand 1.6s ease-out forwards;
}

@keyframes rain-ripple-expand {
  0%   { width: 6px; height: 6px; opacity: 0.7; }
  100% { width: 140px; height: 140px; opacity: 0; }
}

/* ===== Bubbles ===== */
.bubble-container {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
}

.bubble {
  position: absolute;
  bottom: -20px;
  border-radius: 50%;
  background: radial-gradient(
    circle at 35% 35%,
    rgba(220, 240, 250, 0.45) 0%,
    rgba(140, 200, 225, 0.12) 60%,
    rgba(140, 200, 225, 0.03) 100%
  );
  border: 1px solid rgba(180, 215, 235, 0.25);
  pointer-events: none;
  animation: bubble-rise var(--bubble-dur, 7s) ease-in-out var(--bubble-delay, 0s) infinite;
}

@keyframes bubble-rise {
  0% {
    transform: translateY(0) translateX(0) scale(0.6);
    opacity: 0;
  }
  8% {
    opacity: 0.55;
  }
  40% {
    transform: translateY(calc(-40vh)) translateX(var(--wobble-1, 8px)) scale(1);
    opacity: 0.45;
  }
  70% {
    transform: translateY(calc(-75vh)) translateX(var(--wobble-2, -6px)) scale(0.9);
    opacity: 0.25;
  }
  100% {
    transform: translateY(calc(-105vh)) translateX(var(--wobble-3, 4px)) scale(0.5);
    opacity: 0;
  }
}

/* ===== Seaweed silhouettes ===== */
.seaweed-container {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 0;
  pointer-events: none;
  height: 160px;
}

.seaweed {
  position: absolute;
  bottom: 0;
  opacity: 0.08;
  transform-origin: bottom center;
  animation: seaweed-sway var(--sway-dur, 7s) ease-in-out var(--sway-delay, 0s) infinite;
}

.seaweed svg {
  display: block;
}

@keyframes seaweed-sway {
  0%, 100% { transform: rotate(0deg) scaleY(1); }
  25%      { transform: rotate(1.5deg) scaleY(1.02); }
  50%      { transform: rotate(-1deg) scaleY(0.99); }
  75%      { transform: rotate(1.2deg) scaleY(1.01); }
}

/* ===== Page ===== */
.page {
  position: relative;
  z-index: 2;
  min-height: 100vh;
  padding: 24px 20px 48px;
}

/* Remove the old centered title — legend panel replaces it */
.page-title {
  display: none;
}

/* ===== Card Grid ===== */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(108px, 1fr));
  gap: 6px;
  max-width: 100%;
  margin: 8px auto 0;
  padding: 0 2px;
}

/* ===== Individual Card (Underwater) ===== */
.card {
  position: relative;
  background: var(--card-bg);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  border-radius: 12px;
  padding: 10px 6px 10px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  min-height: 82px;
  border: 1px solid rgba(255, 255, 255, 0.45);
  box-shadow: var(--shadow-card);
  filter: blur(1.0px);
  opacity: 0.70;
  user-select: none;
  transition:
    transform var(--ease-card),
    opacity var(--ease-card),
    filter var(--ease-card),
    box-shadow var(--ease-card),
    background var(--ease-card);
  animation: underwater-sway 5s ease-in-out infinite;
  animation-delay: var(--sway-delay, 0s);
}

/* Underwater sway */
@keyframes underwater-sway {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  14%      { transform: translateY(-2.6px) rotate(0.25deg); }
  32%      { transform: translateY(1.2px) rotate(-0.20deg); }
  52%      { transform: translateY(-1.6px) rotate(0.14deg); }
  74%      { transform: translateY(2.0px) rotate(-0.22deg); }
}

/* Hover — float up, clear up */
.card:hover {
  transform: translateY(-7px) scale(1.04);
  filter: blur(0px);
  opacity: 1;
  background: var(--card-bg-hover);
  box-shadow: var(--shadow-hover);
  z-index: 10;
  animation-play-state: paused;
}

.card:active {
  transform: translateY(-3px) scale(0.97);
  transition: transform 100ms ease-out;
}

/* Retrieved — ghost in grid */
.card.retrieved {
  opacity: 0.15;
  filter: blur(3px);
  pointer-events: none;
  transform: scale(0.95);
  animation-play-state: paused;
  transition: opacity 350ms ease, filter 350ms ease, transform 350ms ease;
}

/* Hover ripple ring */
.card::after {
  content: '';
  position: absolute;
  inset: -5px;
  border-radius: 18px;
  border: 2px solid rgba(140, 200, 220, 0.28);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}

.card:hover::after {
  opacity: 1;
  animation: hover-ripple 1.8s ease-out infinite;
}

@keyframes hover-ripple {
  0%   { inset: -3px; opacity: 0.45; border-color: rgba(140,200,220,0.35); }
  100% { inset: -18px; opacity: 0; border-color: rgba(140,200,220,0); }
}

/* ===== Card inner content ===== */
.card-category {
  font-size: 0.56rem;
  font-weight: 500;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  margin-bottom: 3px;
  opacity: 0.75;
}

.card-name {
  font-size: 0.78rem;
  font-weight: 700;
  line-height: 1.25;
  color: var(--text-primary);
  margin-bottom: 2px;
}

.card-type {
  font-size: 0.58rem;
  color: var(--text-muted);
  background: rgba(90, 130, 150, 0.08);
  padding: 1px 8px;
  border-radius: 20px;
}

/* ===== Overlay ===== */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.30s ease;
}

.overlay.active {
  pointer-events: auto;
  opacity: 1;
}

.overlay-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(8, 28, 40, 0.42);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

/* ===== Detail Card ===== */
.detail-card {
  position: relative;
  z-index: 1;
  width: 92vw;
  max-width: 960px;
  max-height: 85vh;
  overflow-y: auto;
  background: #fff;
  border-radius: var(--radius-detail);
  box-shadow: var(--shadow-pop);
}

.detail-card-inner {
  padding: 32px 36px 36px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: auto auto auto;
  gap: 0 36px;
}

.detail-card-inner .detail-header {
  grid-column: 1 / -1;
  margin-bottom: 18px;
}

.detail-card-inner .detail-body {
  grid-column: 1;
}

.detail-card-inner .detail-body-extras {
  grid-column: 2;
}

/* Scrollbar */
.detail-card::-webkit-scrollbar { width: 5px; }
.detail-card::-webkit-scrollbar-track { background: transparent; margin: 16px 0; }
.detail-card::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.10); border-radius: 10px; }

/* ===== Detail Header ===== */
.detail-header { margin-bottom: 24px; }

.detail-tags {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}

.tag {
  display: inline-block;
  font-size: 0.74rem;
  font-weight: 600;
  padding: 5px 14px;
  border-radius: 20px;
  letter-spacing: 0.03em;
}
.tag-category { background: #e3f2fd; color: #1e6fa0; }
.tag-type     { background: #e8f5e9; color: #2e7d32; }

.detail-name {
  font-size: 1.75rem;
  font-weight: 800;
  line-height: 1.25;
  color: #0d2137;
  letter-spacing: 0.02em;
  word-break: break-word;
}

/* ===== Detail Body ===== */
.detail-body section { margin-bottom: 22px; }
.detail-body section:last-child { margin-bottom: 0; }

.detail-body h3 {
  font-size: 0.76rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: #889aaa;
  margin-bottom: 8px;
  padding-bottom: 4px;
  border-bottom: 1px solid #eef3f6;
}

.detail-body p {
  font-size: 0.94rem;
  line-height: 1.72;
  color: #334455;
}

.analogy-text {
  font-style: italic;
  color: #3a6070 !important;
  background: #f5f9fb;
  padding: 12px 16px;
  border-radius: 10px;
  border-left: 3px solid #b5d6e8;
}

.detail-body ul { list-style: none; padding: 0; }
.detail-body li {
  font-size: 0.91rem;
  line-height: 1.6;
  color: #445566;
  padding: 5px 0 5px 16px;
  position: relative;
}
.detail-body li::before {
  content: '•';
  position: absolute;
  left: 0;
  color: #99bbcc;
  font-weight: bold;
}
.counter-list li { color: #7a6a5a !important; }
.counter-list li::before {
  color: #d4b896 !important;
  content: '✗';
  font-size: 0.68rem;
}

.detail-source p { font-size: 0.84rem !important; color: #889aaa !important; }

/* ===== Related Concepts ===== */
.related-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.related-tag {
  display: inline-block;
  font-size: 0.80rem;
  padding: 6px 14px;
  border-radius: 20px;
  background: #f0f4f7;
  color: #556677;
  border: 1px solid #e0e8ee;
  cursor: default;
  transition: all 0.2s;
}

.related-tag.clickable {
  cursor: pointer;
  background: #e8f0f6;
  color: #2a6080;
  border-color: #c8dae8;
}
.related-tag.clickable:hover {
  background: #d0e4f2;
  border-color: #90c0d8;
  color: #1a4a66;
  transform: translateY(-1px);
}

/* ===== Close Button ===== */
.close-btn {
  position: fixed;
  top: 22px;
  right: 22px;
  z-index: 110;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: none;
  background: rgba(255, 255, 255, 0.82);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  box-shadow: 0 2px 12px rgba(0,0,0,0.10);
  font-size: 1.15rem;
  color: #556;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  opacity: 0;
  transform: scale(0.8);
  transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.close-btn.visible {
  pointer-events: auto;
  opacity: 1;
  transform: scale(1);
}

.close-btn:hover {
  background: #fff;
  box-shadow: 0 4px 16px rgba(0,0,0,0.16);
  transform: scale(1.08);
}

.close-btn:active { transform: scale(0.94); }

/* ===== Splash ===== */
.splash {
  position: fixed;
  pointer-events: none;
  z-index: 150;
  border-radius: 50%;
  border: 2px solid rgba(180, 210, 225, 0.45);
  background: radial-gradient(circle, rgba(190, 220, 235, 0.18) 0%, transparent 70%);
  transform: translate(-50%, -50%);
}

.splash.animate {
  animation: splash-expand 0.72s ease-out forwards;
}

@keyframes splash-expand {
  0%   { width: 16px; height: 16px; opacity: 0.75; }
  100% { width: 220px; height: 220px; opacity: 0; }
}

/* ===== Responsive ===== */
@media (max-width: 768px) {
  .card-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 5px; }
  .card { min-height: 76px; padding: 10px 6px 10px; }
  .card-name { font-size: 0.70rem; }
  .card-category { font-size: 0.50rem; }
  .card-type { font-size: 0.52rem; }
  .detail-card { width: 94vw; max-width: 94vw; max-height: 84vh; }
  .detail-card-inner { padding: 28px 22px 24px; grid-template-columns: 1fr; gap: 0; }
  .detail-card-inner .detail-body-extras { grid-column: 1; }
  .detail-name { font-size: 1.45rem; }
  .legend-panel {
    width: 220px;
    padding: 12px 14px 14px;
    top: 8px;
    left: 8px;
  }
  .legend-panel .legend-title { font-size: 0.78rem; }
  .legend-panel .legend-subtitle { font-size: 0.60rem; }
  .legend-panel .legend-cats { font-size: 0.60rem; }
}

@media (max-width: 480px) {
  .page { padding: 8px 2px 20px; }
  .card-grid { grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 4px; }
  .card {
    min-height: 68px;
    padding: 8px 4px 8px;
    border-radius: 10px;
    filter: blur(0.8px);
    opacity: 0.72;
  }
  .card-name { font-size: 0.65rem; }
  .card-category { font-size: 0.48rem; }
  .card-type { font-size: 0.50rem; padding: 1px 6px; }
  .detail-card { width: 96vw; max-width: 96vw; max-height: 80vh; border-radius: 16px; }
  .detail-card-inner { padding: 24px 18px 20px; }
  .detail-name { font-size: 1.30rem; }
  .close-btn { top: 14px; right: 14px; width: 36px; height: 36px; font-size: 1rem; }
  .legend-panel {
    width: 180px;
    padding: 10px 12px 12px;
    top: 6px;
    left: 6px;
    border-radius: 12px;
  }
  .legend-panel .legend-title { font-size: 0.72rem; }
  .legend-panel .legend-subtitle { font-size: 0.56rem; }
  .legend-panel .legend-cats { font-size: 0.56rem; gap: 1px 6px; }
}
</style>
</head>
<body>

<div class="water-bg"></div>
<div class="caustics-extra"></div>
<div class="light-rays"></div>
<canvas id="rippleCanvas"></canvas>

<!-- Raindrops + ripples container -->
<div class="raindrop-container" id="raindropContainer"></div>

<!-- Bubbles container -->
<div class="bubble-container" id="bubbleContainer"></div>

<!-- Seaweed silhouettes at pool bottom -->
<div class="seaweed-container" id="seaweedContainer"></div>

<!-- Legend Panel — fixed top-left -->
<div class="legend-panel" id="legendPanel">
  <div class="legend-title">概念卡片池</div>
  <div class="legend-subtitle"><span id="legendTotal">238</span> 个核心概念 · <span id="legendCatCount">15</span> 个类别</div>
  <hr class="legend-divider">
  <div class="legend-cats" id="legendCats"></div>
</div>

<div class="page">
  <div class="card-grid" id="cardGrid"></div>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-backdrop"></div>
  <div class="detail-card" id="detailCard">
    <div class="detail-card-inner" id="detailInner"></div>
  </div>
</div>

<button class="close-btn" id="closeBtn" aria-label="关闭">✕</button>

<script src="data/concepts_enriched.js?v=2"></script>
<script>
(function() {
  'use strict';

  // ── Data ───────────────────────────────────────────────
  const CONCEPTS = window.CONCEPTS || [];
  const conceptMap = Object.fromEntries(CONCEPTS.map(c => [c.name, c]));

  // ── State ──────────────────────────────────────────────
  let activeConcept = null;
  let activeCardEl  = null;
  let isAnimating   = false;

  // ── DOM ────────────────────────────────────────────────
  const grid        = document.getElementById('cardGrid');
  const overlay     = document.getElementById('overlay');
  const detailCard  = document.getElementById('detailCard');
  const detailInner = document.getElementById('detailInner');
  const closeBtn    = document.getElementById('closeBtn');

  // ── Build card grid ────────────────────────────────────
  function renderGrid() {
    grid.innerHTML = '';
    CONCEPTS.forEach(function(concept, i) {
      var card = document.createElement('div');
      card.className = 'card';
      card.dataset.conceptId = concept.id;
      card.style.setProperty('--sway-delay', (i * 0.37).toFixed(2) + 's');
      card.innerHTML =
        '<span class="card-category">' + escHtml(concept.category) + '</span>' +
        '<h3 class="card-name">' + escHtml(concept.name) + '</h3>' +
        '<span class="card-type">' + escHtml(concept.type) + '</span>';
      card.addEventListener('click', function(e) {
        e.stopPropagation();
        if (isAnimating) return;
        if (activeConcept && activeConcept.id === concept.id) return;
        openCard(concept, card);
      });
      grid.appendChild(card);
    });
  }

  // ── Render detail view ─────────────────────────────────
  function renderDetail(concept) {
    var relatedHtml = concept.related_concepts.map(function(rc) {
      var exists = rc in conceptMap;
      return '<span class="related-tag' + (exists ? ' clickable' : '') + '"' +
             ' data-concept-name="' + escHtml(rc) + '"' +
             (exists ? ' tabindex="0" role="button"' : '') + '>' +
             escHtml(rc) + '</span>';
    }).join('');

    var counterHtml = '';
    if (concept.counter_examples && concept.counter_examples.length) {
      counterHtml =
        '<section>' +
        '<h3>反例 / 常见误解</h3>' +
        '<ul class="counter-list">' +
        concept.counter_examples.map(function(e) { return '<li>' + escHtml(e) + '</li>'; }).join('') +
        '</ul>' +
        '</section>';
    }

    detailInner.innerHTML =
      '<div class="detail-header">' +
        '<div class="detail-tags">' +
          '<span class="tag tag-category">' + escHtml(concept.category) + '</span>' +
          '<span class="tag tag-type">' + escHtml(concept.type) + '</span>' +
        '</div>' +
        '<h1 class="detail-name">' + escHtml(concept.name) + '</h1>' +
      '</div>' +
      '<div class="detail-body">' +
        '<section>' +
          '<h3>定义</h3>' +
          '<p>' + escHtml(concept.definition) + '</p>' +
        '</section>' +
        '<section>' +
          '<h3>类比</h3>' +
          '<p class="analogy-text">' + escHtml(concept.analogy) + '</p>' +
        '</section>' +
      '</div>' +
      '<div class="detail-body-extras">' +
        '<section>' +
          '<h3>事例</h3>' +
          '<ul>' + concept.examples.map(function(e) { return '<li>' + escHtml(e) + '</li>'; }).join('') + '</ul>' +
        '</section>' +
        counterHtml +
        '<section class="detail-source">' +
          '<h3>来源</h3>' +
          '<p>' + escHtml(concept.source.course) + ' · ' + escHtml(concept.source.letter) + '</p>' +
        '</section>' +
        '<section>' +
          '<h3>关联概念</h3>' +
          '<div class="related-tags">' + relatedHtml + '</div>' +
        '</section>' +
      '</div>';

    // Bind related-concept clicks
    var clickables = detailInner.querySelectorAll('.related-tag.clickable');
    clickables.forEach(function(tag) {
      tag.addEventListener('click', function(e) {
        e.stopPropagation();
        var name = tag.dataset.conceptName;
        var target = conceptMap[name];
        if (target) switchToConcept(target);
      });
    });

    detailCard.scrollTop = 0;
  }

  // ── Open card (FLIP animation) ─────────────────────────
  function openCard(concept, cardEl) {
    if (activeConcept) {
      closeCardInstant();
    }

    isAnimating = true;

    var cardRect = cardEl.getBoundingClientRect();
    var vw = window.innerWidth;
    var vh = window.innerHeight;
    var cx = vw / 2;
    var cy = vh / 2;
    var cardCX = cardRect.left + cardRect.width / 2;
    var cardCY = cardRect.top + cardRect.height / 2;
    var dx = cardCX - cx;
    var dy = cardCY - cy;
    var detailW = Math.min(560, vw * 0.92);
    var scaleFrom = Math.min(cardRect.width / detailW, 0.42);

    // Build detail content
    renderDetail(concept);

    // Position the detail card at the grid card's location
    detailCard.style.transition = 'none';
    detailCard.style.transform = 'translate(' + dx + 'px, ' + dy + 'px) scale(' + scaleFrom + ')';
    detailCard.style.opacity = '0.55';

    // Show overlay
    overlay.classList.add('active');
    closeBtn.classList.add('visible');
    document.body.classList.add('overlay-open');

    // Splash at clicked position
    createSplash(cardCX, cardCY);

    // Force reflow
    detailCard.offsetHeight;

    // Animate to center
    detailCard.style.transition =
      'transform 380ms cubic-bezier(0.22, 0.98, 0.36, 1.02), opacity 300ms ease-out';
    detailCard.style.transform = 'translate(0, 0) scale(1)';
    detailCard.style.opacity = '1';

    cardEl.classList.add('retrieved');
    activeConcept = concept;
    activeCardEl  = cardEl;

    setTimeout(function() { isAnimating = false; }, 400);
  }

  // ── Close card ─────────────────────────────────────────
  function closeCard(instant) {
    if (!activeConcept) return;

    if (instant) {
      closeCardInstant();
      return;
    }

    isAnimating = true;

    var cardEl   = activeCardEl;
    var cardRect = cardEl.getBoundingClientRect();
    var vw = window.innerWidth;
    var vh = window.innerHeight;
    var cx = vw / 2;
    var cy = vh / 2;
    var cardCX = cardRect.left + cardRect.width / 2;
    var cardCY = cardRect.top + cardRect.height / 2;
    var dx = cardCX - cx;
    var dy = cardCY - cy;
    var detailW = Math.min(560, vw * 0.92);
    var scaleTo = Math.min(cardRect.width / detailW, 0.42);

    // Animate back to grid position
    detailCard.style.transition =
      'transform 280ms cubic-bezier(0.4, 0, 0.6, 1), opacity 220ms ease-in';
    detailCard.style.transform = 'translate(' + dx + 'px, ' + dy + 'px) scale(' + scaleTo + ')';
    detailCard.style.opacity = '0.35';

    // Fade overlay
    overlay.style.transition = 'opacity 280ms ease';
    overlay.style.opacity = '0';

    createSplash(cardCX, cardCY);

    var el = activeCardEl;
    setTimeout(function() {
      overlay.classList.remove('active');
      overlay.style.transition = '';
      overlay.style.opacity = '';
      closeBtn.classList.remove('visible');
      document.body.classList.remove('overlay-open');
      detailCard.style.transition = 'none';
      detailCard.style.transform = '';
      detailCard.style.opacity = '';
      el.classList.remove('retrieved');
      activeConcept = null;
      activeCardEl  = null;
      isAnimating = false;
    }, 300);
  }

  function closeCardInstant() {
    overlay.classList.remove('active');
    overlay.style.transition = '';
    overlay.style.opacity = '';
    closeBtn.classList.remove('visible');
    document.body.classList.remove('overlay-open');
    detailCard.style.transition = 'none';
    detailCard.style.transform = '';
    detailCard.style.opacity = '';
    if (activeCardEl) activeCardEl.classList.remove('retrieved');
    activeConcept = null;
    activeCardEl  = null;
    isAnimating = false;
  }

  // ── Switch concept (from related link) ─────────────────
  function switchToConcept(concept) {
    if (isAnimating) return;
    isAnimating = true;

    var newCardEl = grid.querySelector('[data-concept-id="' + concept.id + '"]');

    // Shrink
    detailCard.style.transition = 'transform 160ms ease-in, opacity 120ms ease-in';
    detailCard.style.transform = 'scale(0.92)';
    detailCard.style.opacity = '0.25';

    setTimeout(function() {
      renderDetail(concept);
      detailCard.scrollTop = 0;

      if (activeCardEl) activeCardEl.classList.remove('retrieved');
      if (newCardEl) newCardEl.classList.add('retrieved');

      activeConcept = concept;
      activeCardEl  = newCardEl;

      // Expand
      detailCard.style.transition =
        'transform 220ms cubic-bezier(0.34, 1.56, 0.64, 1), opacity 200ms ease-out';
      detailCard.style.transform = 'scale(1)';
      detailCard.style.opacity = '1';

      setTimeout(function() { isAnimating = false; }, 250);
    }, 170);
  }

  // ── Splash ─────────────────────────────────────────────
  function createSplash(x, y) {
    var splash = document.createElement('div');
    splash.className = 'splash';
    splash.style.left = x + 'px';
    splash.style.top  = y + 'px';
    document.body.appendChild(splash);

    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        splash.classList.add('animate');
      });
    });

    splash.addEventListener('animationend', function() { splash.remove(); });
    setTimeout(function() { if (splash.parentNode) splash.remove(); }, 800);
  }

  // ── Events ─────────────────────────────────────────────
  closeBtn.addEventListener('click', function() { closeCard(false); });

  overlay.addEventListener('click', function(e) {
    if (e.target === overlay || e.target.classList.contains('overlay-backdrop')) {
      closeCard(false);
    }
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && activeConcept && !isAnimating) {
      closeCard(false);
    }
  });

  var resizeTimer;
  window.addEventListener('resize', function() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function() {
      if (activeConcept) closeCardInstant();
    }, 300);
  });

  // ── Helpers ────────────────────────────────────────────
  // ── Render legend panel ────────────────────────────────
  function renderLegend() {
    var cats = {};
    CONCEPTS.forEach(function(c) {
      cats[c.category] = (cats[c.category] || 0) + 1;
    });
    var sorted = Object.entries(cats).sort(function(a, b) { return b[1] - a[1]; });
    var html = '';
    sorted.forEach(function(pair) {
      html += '<span class="legend-cat-item"><span>' + escHtml(pair[0]) + '</span><span class="legend-cat-num">' + pair[1] + '</span></span>';
    });
    document.getElementById('legendCats').innerHTML = html;
    document.getElementById('legendTotal').textContent = CONCEPTS.length;
    document.getElementById('legendCatCount').textContent = sorted.length;
  }

  function escHtml(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ── Mouse Ripple Trail (Enhanced) ──────────────────────
  (function() {
    var canvas = document.getElementById('rippleCanvas');
    var ctx = canvas.getContext('2d');
    var ripples = [];
    var mouseX = -100, mouseY = -100;
    var lastRippleTime = 0;
    var prevMouseX = -100, prevMouseY = -100;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    document.addEventListener('mousemove', function(e) {
      prevMouseX = mouseX;
      prevMouseY = mouseY;
      mouseX = e.clientX;
      mouseY = e.clientY;
      var now = Date.now();
      if (now - lastRippleTime > 40) {  // was 60ms — denser ripples
        ripples.push({ x: mouseX, y: mouseY, r: 0, opacity: 0.55, life: 1 });
        lastRippleTime = now;
        if (ripples.length > 60) ripples.shift();  // was 40 — keep more
      }
    });

    // Also leave a trail when mouse is between grid updates
    document.addEventListener('mouseleave', function() {
      mouseX = -100;
      mouseY = -100;
    });

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Persistent glow at mouse position — larger, more visible
      if (mouseX > 0 && mouseY > 0) {
        var glow = ctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, 140);
        glow.addColorStop(0, 'rgba(180, 220, 240, 0.34)');
        glow.addColorStop(0.3, 'rgba(155, 215, 235, 0.20)');
        glow.addColorStop(0.6, 'rgba(140, 200, 225, 0.08)');
        glow.addColorStop(1, 'rgba(140, 200, 225, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(mouseX, mouseY, 140, 0, Math.PI * 2);
        ctx.fill();

        // Inner brighter core
        var coreGlow = ctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, 40);
        coreGlow.addColorStop(0, 'rgba(210, 240, 250, 0.40)');
        coreGlow.addColorStop(0.5, 'rgba(180, 225, 240, 0.15)');
        coreGlow.addColorStop(1, 'rgba(150, 210, 230, 0)');
        ctx.fillStyle = coreGlow;
        ctx.beginPath();
        ctx.arc(mouseX, mouseY, 40, 0, Math.PI * 2);
        ctx.fill();
      }

      // Animate ripples — expand further, higher opacity
      for (var i = ripples.length - 1; i >= 0; i--) {
        var r = ripples[i];
        r.r += 1.5;  // faster expansion
        r.life -= 0.010;  // slower fade → larger max radius
        r.opacity = r.life * 0.55;
        if (r.life <= 0) { ripples.splice(i, 1); continue; }

        // Main ring
        ctx.beginPath();
        ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(150, 210, 235,' + (r.opacity * 0.7) + ')';
        ctx.lineWidth = 1.6;
        ctx.stroke();

        // Inner softer ring
        ctx.beginPath();
        ctx.arc(r.x, r.y, r.r * 0.55, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(180, 220, 240,' + (r.opacity * 0.5) + ')';
        ctx.lineWidth = 1.0;
        ctx.stroke();

        // Outer faint ring
        ctx.beginPath();
        ctx.arc(r.x, r.y, r.r * 1.4, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(170, 215, 235,' + (r.opacity * 0.25) + ')';
        ctx.lineWidth = 0.7;
        ctx.stroke();
      }

      requestAnimationFrame(draw);
    }
    draw();
  })();

  // ── Raindrop System ─────────────────────────────────────
  (function() {
    var container = document.getElementById('raindropContainer');
    var maxDrops = 8;
    var activeDrops = 0;
    var dropIndex = 0;

    function createRaindrop() {
      if (activeDrops >= maxDrops) return;
      activeDrops++;

      var x = Math.random() * window.innerWidth;
      // Water surface level — where the drop hits (varies slightly)
      var surfaceY = window.innerHeight * (0.4 + Math.random() * 0.45);
      var fallDistance = surfaceY + 10; // start just above visible area

      var drop = document.createElement('div');
      drop.className = 'raindrop falling';
      drop.style.left = x + 'px';
      drop.style.top = '-12px';
      drop.style.setProperty('--fall-distance', surfaceY + 'px');
      drop.style.setProperty('--fall-duration', (0.45 + Math.random() * 0.35) + 's');
      drop.dataset.surfaceY = surfaceY;
      drop.dataset.dropX = x;
      container.appendChild(drop);

      // When the drop finishes falling, create ripple at impact point
      drop.addEventListener('animationend', function() {
        drop.remove();
        // Create ripple at impact point
        createRainRipple(parseFloat(drop.dataset.dropX), parseFloat(drop.dataset.surfaceY));
        activeDrops--;
      });

      // Fallback cleanup
      var dur = parseFloat(drop.style.getPropertyValue('--fall-duration')) * 1000 + 200;
      setTimeout(function() {
        if (drop.parentNode) {
          createRainRipple(parseFloat(drop.dataset.dropX), parseFloat(drop.dataset.surfaceY));
          drop.remove();
          activeDrops--;
        }
      }, dur);
    }

    function createRainRipple(x, y) {
      var ripple = document.createElement('div');
      ripple.className = 'rain-ripple animating';
      ripple.style.left = x + 'px';
      ripple.style.top = y + 'px';
      document.body.appendChild(ripple);

      ripple.addEventListener('animationend', function() { ripple.remove(); });
      // Fallback
      setTimeout(function() { if (ripple.parentNode) ripple.remove(); }, 1800);
    }

    // Spawn raindrops at random intervals
    function scheduleNext() {
      var delay = 1200 + Math.random() * 2200;
      setTimeout(function() {
        createRaindrop();
        scheduleNext();
      }, delay);
    }

    // Start with 2 drops immediately for quick visual feedback
    setTimeout(function() { createRaindrop(); }, 400);
    setTimeout(function() { createRaindrop(); }, 900);
    scheduleNext();
  })();

  // ── Bubble System ──────────────────────────────────────
  (function() {
    var container = document.getElementById('bubbleContainer');
    var bubbleCount = 18;

    for (var i = 0; i < bubbleCount; i++) {
      var bubble = document.createElement('div');
      bubble.className = 'bubble';
      var size = 4 + Math.random() * 14;
      bubble.style.width = size + 'px';
      bubble.style.height = size + 'px';
      bubble.style.left = (Math.random() * 94) + '%';
      bubble.style.setProperty('--bubble-dur', (6 + Math.random() * 12) + 's');
      bubble.style.setProperty('--bubble-delay', (Math.random() * 14) + 's');
      bubble.style.setProperty('--wobble-1', ((Math.random() - 0.5) * 20) + 'px');
      bubble.style.setProperty('--wobble-2', ((Math.random() - 0.5) * 16) + 'px');
      bubble.style.setProperty('--wobble-3', ((Math.random() - 0.5) * 12) + 'px');
      container.appendChild(bubble);
    }
  })();

  // ── Seaweed Silhouettes ────────────────────────────────
  (function() {
    var container = document.getElementById('seaweedContainer');
    // Generate simple SVG seaweed shapes
    var seaweedDefs = [
      { x: '5%', w: 20, h: 90, swayDur: '6s', swayDelay: '0s', opacity: 0.10 },
      { x: '14%', w: 14, h: 70, swayDur: '7.5s', swayDelay: '-2s', opacity: 0.08 },
      { x: '22%', w: 24, h: 110, swayDur: '5.5s', swayDelay: '-4s', opacity: 0.11 },
      { x: '35%', w: 16, h: 60, swayDur: '8s', swayDelay: '-1s', opacity: 0.07 },
      { x: '48%', w: 18, h: 85, swayDur: '6.5s', swayDelay: '-3s', opacity: 0.10 },
      { x: '60%', w: 22, h: 100, swayDur: '7s', swayDelay: '-5s', opacity: 0.09 },
      { x: '72%', w: 15, h: 75, swayDur: '5.8s', swayDelay: '-2.5s', opacity: 0.08 },
      { x: '82%', w: 20, h: 95, swayDur: '6.8s', swayDelay: '-1.5s', opacity: 0.10 },
      { x: '92%', w: 12, h: 55, swayDur: '7.2s', swayDelay: '-3.5s', opacity: 0.07 },
    ];

    seaweedDefs.forEach(function(def) {
      var weed = document.createElement('div');
      weed.className = 'seaweed';
      weed.style.left = def.x;
      weed.style.setProperty('--sway-dur', def.swayDur);
      weed.style.setProperty('--sway-delay', def.swayDelay);
      weed.style.opacity = def.opacity;

      // Simple blade-of-grass SVG
      var svg = '<svg width="' + (def.w * 2) + '" height="' + def.h + '" viewBox="0 0 ' + (def.w * 2) + ' ' + def.h + '">' +
        '<ellipse cx="' + def.w + '" cy="' + (def.h * 0.85) + '" rx="' + (def.w * 0.25) + '" ry="' + (def.h * 0.8) + '" fill="#5a8a6a" opacity="0.6"/>' +
        '<ellipse cx="' + (def.w * 0.65) + '" cy="' + (def.h * 0.75) + '" rx="' + (def.w * 0.18) + '" ry="' + (def.h * 0.6) + '" fill="#4a7a5a" opacity="0.5"/>' +
        '<ellipse cx="' + (def.w * 1.35) + '" cy="' + (def.h * 0.8) + '" rx="' + (def.w * 0.2) + '" ry="' + (def.h * 0.7) + '" fill="#5a8a6a" opacity="0.5"/>' +
        '</svg>';
      weed.innerHTML = svg;
      container.appendChild(weed);
    });
  })();

  // ── Init ───────────────────────────────────────────────
  if (CONCEPTS.length > 0) {
    renderGrid();
    renderLegend();
  } else {
    grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:#889;padding:60px 0;">概念数据加载中…</p>';
    window.addEventListener('load', function() {
      if (window.CONCEPTS && window.CONCEPTS.length > 0 && !grid.children.length) {
        renderGrid();
        renderLegend();
      }
    });
  }
})();
</script>
</body>
</html>

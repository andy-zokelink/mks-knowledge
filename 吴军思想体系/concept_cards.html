<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>概念卡片池 · 水面捞出 v2</title>
<style>
/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --water-1: #d8f0f8;
  --water-2: #c8e6e0;
  --water-3: #d4edf4;
  --text-primary: #1a2a3a;
  --text-secondary: #4a6070;
  --text-muted: #7a8a96;
  --shadow-card: 0 2px 8px rgba(60, 100, 130, 0.07);
  --shadow-hover: 0 10px 30px rgba(60, 100, 130, 0.13);
  --shadow-pop: 0 24px 64px rgba(0, 0, 0, 0.16);
  --radius-card: 14px;
  --radius-detail: 20px;
  --font-stack: 'PingFang SC', 'Noto Sans SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
  --ease-card: 280ms cubic-bezier(0.4, 0, 0.2, 1);
  --ease-pop: 380ms cubic-bezier(0.22, 0.98, 0.36, 1.02);
  --ease-close: 280ms cubic-bezier(0.4, 0, 0.6, 1);
}

html { font-size: 16px; }

body {
  font-family: var(--font-stack);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

body.overlay-open { overflow: hidden; }

/* ===== Water Background ===== */
.water-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  background:
    linear-gradient(172deg,
      #d8f0f8 0%,
      #c8e8e0 16%,
      #d4edf4 32%,
      #e2f2f0 48%,
      #cce8e8 64%,
      #daf0f5 82%,
      #d0eaf2 100%
    );
}

.water-bg::before {
  content: '';
  position: absolute;
  inset: -35%;
  background:
    radial-gradient(ellipse 600px 400px at 18% 28%, rgba(255,255,255,0.22) 0%, transparent 60%),
    radial-gradient(ellipse 500px 350px at 72% 18%, rgba(255,255,255,0.17) 0%, transparent 55%),
    radial-gradient(ellipse 520px 380px at 48% 68%, rgba(255,255,255,0.19) 0%, transparent 58%),
    radial-gradient(ellipse 420px 300px at 82% 72%, rgba(255,255,255,0.13) 0%, transparent 50%),
    radial-gradient(ellipse 360px 280px at 28% 78%, rgba(255,255,255,0.15) 0%, transparent 52%);
  animation: caustics-drift 14s ease-in-out infinite;
}

.water-bg::after {
  content: '';
  position: absolute;
  inset: -25%;
  background:
    radial-gradient(ellipse 300px 200px at 22% 42%, rgba(255,255,255,0.11) 0%, transparent 50%),
    radial-gradient(ellipse 260px 180px at 62% 32%, rgba(255,255,255,0.09) 0%, transparent 48%),
    radial-gradient(ellipse 280px 190px at 44% 74%, rgba(255,255,255,0.10) 0%, transparent 52%),
    radial-gradient(ellipse 240px 160px at 78% 58%, rgba(255,255,255,0.08) 0%, transparent 50%);
  animation: caustics-drift 9s ease-in-out infinite reverse;
}

.caustics-extra {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: 0.35;
  background:
    radial-gradient(ellipse 380px 240px at 30% 35%, rgba(200,235,250,0.25) 0%, transparent 55%),
    radial-gradient(ellipse 340px 200px at 65% 55%, rgba(200,235,250,0.20) 0%, transparent 50%),
    radial-gradient(ellipse 300px 220px at 50% 20%, rgba(220,245,255,0.22) 0%, transparent 52%);
  animation: caustics-drift 12s ease-in-out infinite;
}

@keyframes caustics-drift {
  0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
  18%      { transform: translate(2.8%, 1.8%) rotate(0.7deg) scale(1.03); }
  38%      { transform: translate(-1.2%, 2.2%) rotate(-0.5deg) scale(0.97); }
  58%      { transform: translate(1.8%, -1.6%) rotate(0.4deg) scale(1.02); }
  78%      { transform: translate(-2.2%, -1.2%) rotate(-0.6deg) scale(0.98); }
}

.light-rays {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  opacity: 0.30;
  background:
    repeating-linear-gradient(
      108deg,
      transparent,
      transparent 140px,
      rgba(255,255,255,0.035) 140px,
      rgba(255,255,255,0.07) 143px,
      transparent 143px
    );
  animation: rays-shift 22s linear infinite;
}

@keyframes rays-shift {
  0%   { transform: translateX(-6%) skewX(-2deg); }
  50%  { transform: translateX(6%) skewX(2deg); }
  100% { transform: translateX(-6%) skewX(-2deg); }
}

/* ===== Legend Panel — Draggable, Floating ===== */
.legend-panel {
  position: absolute;
  top: 16px;
  right: 16px;
  z-index: 50;
  background: rgba(255, 255, 255, 0.58);
  backdrop-filter: blur(22px) saturate(1.6);
  -webkit-backdrop-filter: blur(22px) saturate(1.6);
  border: 1px solid rgba(255, 255, 255, 0.55);
  border-radius: 16px;
  padding: 0;
  box-shadow:
    0 8px 40px rgba(60, 110, 140, 0.16),
    0 2px 8px rgba(60, 110, 140, 0.08);
  width: 250px;
  max-width: calc(100vw - 32px);
  overflow: hidden;
  animation: legend-float 4s ease-in-out infinite;
  user-select: none;
  transition: box-shadow 0.3s ease;
}

.legend-panel.dragging {
  animation-play-state: paused;
  box-shadow:
    0 16px 56px rgba(60, 110, 140, 0.24),
    0 4px 16px rgba(60, 110, 140, 0.12);
  cursor: grabbing;
}

@keyframes legend-float {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-6px); }
}

/* Water reflection line at top */
.legend-panel::before {
  content: '';
  display: block;
  height: 2px;
  margin: 0 16px;
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(140, 200, 225, 0.5) 15%,
    rgba(200, 230, 245, 0.8) 35%,
    rgba(255, 255, 255, 0.9) 50%,
    rgba(200, 230, 245, 0.8) 65%,
    rgba(140, 200, 225, 0.5) 85%,
    transparent 100%
  );
  border-radius: 1px;
}

.legend-title-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 16px 8px;
  cursor: grab;
  touch-action: none;
}

.legend-title-bar:active { cursor: grabbing; }

.legend-drag-handle {
  font-size: 0.9rem;
  color: #90b8c8;
  line-height: 1;
  flex-shrink: 0;
}

.legend-title {
  font-size: 0.85rem;
  font-weight: 800;
  color: #1a3040;
  letter-spacing: 0.05em;
}

.legend-body {
  padding: 0 16px 14px;
}

.legend-subtitle {
  font-size: 0.63rem;
  color: #5a7888;
  margin-bottom: 8px;
  font-weight: 500;
}

.legend-divider {
  border: none;
  border-top: 1px dashed rgba(120, 170, 195, 0.25);
  margin: 0 0 8px 0;
}

.legend-cats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px 10px;
  font-size: 0.63rem;
  color: #4a6678;
  line-height: 1.5;
}

.legend-cat-item {
  white-space: nowrap;
  display: flex;
  justify-content: space-between;
  gap: 4px;
  align-items: center;
}

.legend-cat-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-right: 4px;
  flex-shrink: 0;
}

.legend-cat-name {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
}

.legend-cat-num {
  font-weight: 700;
  color: #2a5068;
  min-width: 18px;
  text-align: right;
}

/* ===== Mouse Ripple Canvas ===== */
#rippleCanvas {
  position: fixed;
  inset: 0;
  z-index: 5;
  pointer-events: none;
}

/* ===== Constellation Lines Canvas ===== */
#constellationCanvas {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
}

/* ===== Raindrops ===== */
.raindrop-container {
  position: fixed;
  inset: 0;
  z-index: 3;
  pointer-events: none;
}

.raindrop {
  position: absolute;
  width: 5px;
  height: 8px;
  background: linear-gradient(180deg,
    rgba(180, 220, 240, 0.7) 0%,
    rgba(140, 200, 225, 0.5) 100%
  );
  border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
  pointer-events: none;
  filter: drop-shadow(0 0 2px rgba(160, 210, 235, 0.5));
}

.raindrop.falling {
  animation: raindrop-fall var(--fall-duration, 0.6s) ease-in forwards;
}

@keyframes raindrop-fall {
  0%   { transform: translateY(0); opacity: 0.7; }
  70%  { opacity: 0.6; }
  100% { transform: translateY(var(--fall-distance, 300px)); opacity: 0.3; }
}

.rain-ripple {
  position: fixed;
  pointer-events: none;
  z-index: 4;
  border-radius: 50%;
  border: 1.5px solid rgba(180, 215, 235, 0.55);
  background: radial-gradient(circle, rgba(190, 220, 240, 0.15) 0%, transparent 65%);
  transform: translate(-50%, -50%);
}

.rain-ripple.animating {
  animation: rain-ripple-expand 1.6s ease-out forwards;
}

@keyframes rain-ripple-expand {
  0%   { width: 6px; height: 6px; opacity: 0.7; }
  100% { width: 140px; height: 140px; opacity: 0; }
}

/* ===== Bubbles ===== */
.bubble-container {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
}

.bubble {
  position: absolute;
  bottom: -20px;
  border-radius: 50%;
  background: radial-gradient(
    circle at 35% 35%,
    rgba(220, 240, 250, 0.45) 0%,
    rgba(140, 200, 225, 0.12) 60%,
    rgba(140, 200, 225, 0.03) 100%
  );
  border: 1px solid rgba(180, 215, 235, 0.25);
  pointer-events: none;
  animation: bubble-rise var(--bubble-dur, 7s) ease-in-out var(--bubble-delay, 0s) infinite;
}

@keyframes bubble-rise {
  0% {
    transform: translateY(0) translateX(0) scale(0.6);
    opacity: 0;
  }
  8%  { opacity: 0.55; }
  40% {
    transform: translateY(calc(-40vh)) translateX(var(--wobble-1, 8px)) scale(1);
    opacity: 0.45;
  }
  70% {
    transform: translateY(calc(-75vh)) translateX(var(--wobble-2, -6px)) scale(0.9);
    opacity: 0.25;
  }
  100% {
    transform: translateY(calc(-105vh)) translateX(var(--wobble-3, 4px)) scale(0.5);
    opacity: 0;
  }
}

/* ===== Seaweed silhouettes ===== */
.seaweed-container {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 0;
  pointer-events: none;
  height: 160px;
}

.seaweed {
  position: absolute;
  bottom: 0;
  opacity: 0.08;
  transform-origin: bottom center;
  animation: seaweed-sway var(--sway-dur, 7s) ease-in-out var(--sway-delay, 0s) infinite;
}

.seaweed svg { display: block; }

@keyframes seaweed-sway {
  0%, 100% { transform: rotate(0deg) scaleY(1); }
  25%      { transform: rotate(1.5deg) scaleY(1.02); }
  50%      { transform: rotate(-1deg) scaleY(0.99); }
  75%      { transform: rotate(1.2deg) scaleY(1.01); }
}

/* ===== Pool — Card Container ===== */
.pool {
  position: relative;
  z-index: 2;
  min-height: 100vh;
  margin: 0 auto;
}

/* ===== Individual Card (Underwater) ===== */
.card {
  position: absolute;
  background: var(--card-gradient, linear-gradient(160deg, rgba(255,255,255,0.52) 0%, rgba(255,255,255,0.52) 100%));
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  border-radius: var(--radius-card);
  padding: 10px 6px 10px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  width: 110px;
  min-height: 82px;
  border: 1px solid rgba(255, 255, 255, 0.45);
  box-shadow: var(--shadow-card);
  filter: blur(1.0px);
  opacity: 0.70;
  user-select: none;
  transition:
    transform var(--ease-card),
    opacity var(--ease-card),
    filter var(--ease-card),
    box-shadow var(--ease-card),
    background var(--ease-card);
  animation: underwater-sway 5s ease-in-out infinite;
  animation-delay: var(--sway-delay, 0s);
  z-index: 3;
}

/* Underwater sway */
@keyframes underwater-sway {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  14%      { transform: translateY(-2.6px) rotate(0.25deg); }
  32%      { transform: translateY(1.2px) rotate(-0.20deg); }
  52%      { transform: translateY(-1.6px) rotate(0.14deg); }
  74%      { transform: translateY(2.0px) rotate(-0.22deg); }
}

/* Mandala slow rotation on the entire pool */
.pool.pattern-mandala {
  animation: mandala-pool-spin 200s linear infinite;
  transform-origin: center center;
}

@keyframes mandala-pool-spin {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}

/* Hover — float up, clear up */
.card:hover {
  transform: translateY(-7px) scale(1.04);
  filter: blur(0px);
  opacity: 1;
  background: var(--card-gradient-hover, linear-gradient(160deg, rgba(255,255,255,0.88) 0%, rgba(255,255,255,0.88) 100%));
  box-shadow: var(--shadow-hover);
  z-index: 10;
  animation-play-state: paused;
}

.card:active {
  transform: translateY(-3px) scale(0.97);
  transition: transform 100ms ease-out;
}

/* Retrieved — ghost in pool */
.card.retrieved {
  opacity: 0.15;
  filter: blur(3px);
  pointer-events: none;
  transform: scale(0.95);
  animation-play-state: paused;
  transition: opacity 350ms ease, filter 350ms ease, transform 350ms ease;
}

/* Hover ripple ring */
.card::after {
  content: '';
  position: absolute;
  inset: -5px;
  border-radius: 18px;
  border: 2px solid rgba(140, 200, 220, 0.28);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}

.card:hover::after {
  opacity: 1;
  animation: hover-ripple 1.8s ease-out infinite;
}

@keyframes hover-ripple {
  0%   { inset: -3px; opacity: 0.45; border-color: rgba(140,200,220,0.35); }
  100% { inset: -18px; opacity: 0; border-color: rgba(140,200,220,0); }
}

/* ===== Card inner content ===== */
.card-category {
  font-size: 0.56rem;
  font-weight: 500;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  margin-bottom: 3px;
  opacity: 0.75;
}

.card-name {
  font-size: 0.78rem;
  font-weight: 700;
  line-height: 1.25;
  color: var(--text-primary);
  margin-bottom: 2px;
}

.card-type {
  font-size: 0.58rem;
  color: var(--text-muted);
  background: rgba(90, 130, 150, 0.08);
  padding: 1px 8px;
  border-radius: 20px;
}

/* ===== Overlay ===== */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.30s ease;
}

.overlay.active {
  pointer-events: auto;
  opacity: 1;
}

.overlay-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(8, 28, 40, 0.42);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

/* ===== Detail Card ===== */
.detail-card {
  position: relative;
  z-index: 1;
  width: 92vw;
  max-width: 960px;
  max-height: 85vh;
  overflow-y: auto;
  background: #fff;
  border-radius: var(--radius-detail);
  box-shadow: var(--shadow-pop);
}

.detail-card-inner {
  padding: 32px 36px 36px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: auto auto auto;
  gap: 0 36px;
}

.detail-card-inner .detail-header { grid-column: 1 / -1; margin-bottom: 18px; }
.detail-card-inner .detail-body { grid-column: 1; }
.detail-card-inner .detail-body-extras { grid-column: 2; }

.detail-card::-webkit-scrollbar { width: 5px; }
.detail-card::-webkit-scrollbar-track { background: transparent; margin: 16px 0; }
.detail-card::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.10); border-radius: 10px; }

/* Detail Header */
.detail-header { margin-bottom: 24px; }

.detail-tags {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}

.tag {
  display: inline-block;
  font-size: 0.74rem;
  font-weight: 600;
  padding: 5px 14px;
  border-radius: 20px;
  letter-spacing: 0.03em;
}
.tag-category { background: #e3f2fd; color: #1e6fa0; }
.tag-type     { background: #e8f5e9; color: #2e7d32; }

.detail-name {
  font-size: 1.75rem;
  font-weight: 800;
  line-height: 1.25;
  color: #0d2137;
  letter-spacing: 0.02em;
  word-break: break-word;
}

/* Detail Body */
.detail-body section { margin-bottom: 22px; }
.detail-body section:last-child { margin-bottom: 0; }

.detail-body h3 {
  font-size: 0.76rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: #889aaa;
  margin-bottom: 8px;
  padding-bottom: 4px;
  border-bottom: 1px solid #eef3f6;
}

.detail-body p {
  font-size: 0.94rem;
  line-height: 1.72;
  color: #334455;
}

.analogy-text {
  font-style: italic;
  color: #3a6070 !important;
  background: #f5f9fb;
  padding: 12px 16px;
  border-radius: 10px;
  border-left: 3px solid #b5d6e8;
}

.detail-body ul { list-style: none; padding: 0; }
.detail-body li {
  font-size: 0.91rem;
  line-height: 1.6;
  color: #445566;
  padding: 5px 0 5px 16px;
  position: relative;
}
.detail-body li::before {
  content: '•';
  position: absolute;
  left: 0;
  color: #99bbcc;
  font-weight: bold;
}
.counter-list li { color: #7a6a5a !important; }
.counter-list li::before {
  color: #d4b896 !important;
  content: '✗';
  font-size: 0.68rem;
}

.detail-source p { font-size: 0.84rem !important; color: #889aaa !important; }

/* Related Concepts */
.related-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.related-tag {
  display: inline-block;
  font-size: 0.80rem;
  padding: 6px 14px;
  border-radius: 20px;
  background: #f0f4f7;
  color: #556677;
  border: 1px solid #e0e8ee;
  cursor: default;
  transition: all 0.2s;
}

.related-tag.clickable {
  cursor: pointer;
  background: #e8f0f6;
  color: #2a6080;
  border-color: #c8dae8;
}
.related-tag.clickable:hover {
  background: #d0e4f2;
  border-color: #90c0d8;
  color: #1a4a66;
  transform: translateY(-1px);
}

/* ===== Close Button ===== */
.close-btn {
  position: fixed;
  top: 22px;
  right: 22px;
  z-index: 110;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: none;
  background: rgba(255, 255, 255, 0.82);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  box-shadow: 0 2px 12px rgba(0,0,0,0.10);
  font-size: 1.15rem;
  color: #556;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  opacity: 0;
  transform: scale(0.8);
  transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.close-btn.visible {
  pointer-events: auto;
  opacity: 1;
  transform: scale(1);
}

.close-btn:hover {
  background: #fff;
  box-shadow: 0 4px 16px rgba(0,0,0,0.16);
  transform: scale(1.08);
}

.close-btn:active { transform: scale(0.94); }

/* ===== Splash ===== */
.splash {
  position: fixed;
  pointer-events: none;
  z-index: 150;
  border-radius: 50%;
  border: 2px solid rgba(180, 210, 225, 0.45);
  background: radial-gradient(circle, rgba(190, 220, 235, 0.18) 0%, transparent 70%);
  transform: translate(-50%, -50%);
}

.splash.animate {
  animation: splash-expand 0.72s ease-out forwards;
}

@keyframes splash-expand {
  0%   { width: 16px; height: 16px; opacity: 0.75; }
  100% { width: 220px; height: 220px; opacity: 0; }
}

/* ===== Responsive ===== */
@media (max-width: 768px) {
  .card {
    width: 96px;
    min-height: 72px;
    padding: 8px 4px 8px;
    border-radius: 11px;
  }
  .card-name { font-size: 0.68rem; }
  .card-category { font-size: 0.48rem; }
  .card-type { font-size: 0.50rem; }
  .detail-card { width: 94vw; max-width: 94vw; max-height: 84vh; }
  .detail-card-inner { padding: 28px 22px 24px; grid-template-columns: 1fr; gap: 0; }
  .detail-card-inner .detail-body-extras { grid-column: 1; }
  .detail-name { font-size: 1.45rem; }
  .legend-panel {
    width: 220px;
    top: 8px;
    right: 8px;
  }
  .legend-title { font-size: 0.76rem; }
  .legend-subtitle { font-size: 0.58rem; }
  .legend-cats { font-size: 0.58rem; }
}

@media (max-width: 480px) {
  .card {
    width: 80px;
    min-height: 64px;
    padding: 6px 3px 6px;
    border-radius: 10px;
    filter: blur(0.8px);
    opacity: 0.72;
  }
  .card-name { font-size: 0.62rem; }
  .card-category { font-size: 0.45rem; }
  .card-type { font-size: 0.46rem; padding: 1px 5px; }
  .detail-card { width: 96vw; max-width: 96vw; max-height: 80vh; border-radius: 16px; }
  .detail-card-inner { padding: 24px 18px 20px; }
  .detail-name { font-size: 1.30rem; }
  .close-btn { top: 14px; right: 14px; width: 36px; height: 36px; font-size: 1rem; }
  .legend-panel {
    width: 175px;
    top: 6px;
    right: 6px;
    border-radius: 12px;
  }
  .legend-title { font-size: 0.70rem; }

  .legend-cats { font-size: 0.54rem; gap: 1px 5px; }
}
</style>

  </div>
</div>

<script src="data/concepts_enriched.js?v=2"></script>
<script>
(function() {
  'use strict';

  // ── Data ───────────────────────────────────────────────
  const CONCEPTS = window.CONCEPTS || [];
  const conceptMap = Object.fromEntries(CONCEPTS.map(c => [c.name, c]));

  // ── Category Colors ────────────────────────────────────
  const CATEGORY_COLORS = {
    '经济学': { bg: '#f5e8d8', dot: '#c8a87c' },
    '方法论': { bg: '#d8efe8', dot: '#6aab9a' },
    '科技':   { bg: '#d8e4f0', dot: '#6a8eb8' },
    '历史':   { bg: '#f0e4d4', dot: '#b8966a' },
    '教育':   { bg: '#daf0da', dot: '#7aaa6a' },
    '科学':   { bg: '#e0e0f0', dot: '#8a8ac0' },
    '人物':   { bg: '#f0dce8', dot: '#b87a9a' },
    '社会':   { bg: '#f0e0d8', dot: '#b88a7a' },
    '心理学': { bg: '#e8dcf0', dot: '#9a7ab8' },
    '哲学':   { bg: '#e8d8f0', dot: '#8a6ab8' },
    '管理':   { bg: '#e8f0d8', dot: '#8aaa6a' },
    '数学':   { bg: '#d8f0f0', dot: '#6aaaaa' },
    '商业':   { bg: '#f0ecd8', dot: '#b8aa6a' },
    '文化':   { bg: '#f0dcd4', dot: '#b88a7a' },
    '艺术':   { bg: '#f0d8e4', dot: '#b87a9a' }
  };

  function getCatColor(category) {
    return CATEGORY_COLORS[category] || { bg: '#e8e8e8', dot: '#999' };
  }

  // ── State ──────────────────────────────────────────────
  let activeConcept = null;
  let activeCardEl  = null;
  let isAnimating   = false;
  let currentPattern = -1; // 0-5, set on init

  // ── DOM ────────────────────────────────────────────────
  const pool         = document.getElementById('pool');
  const overlay      = document.getElementById('overlay');
  const detailCard   = document.getElementById('detailCard');
  const detailInner  = document.getElementById('detailInner');
  const closeBtn     = document.getElementById('closeBtn');
  const legendPanel  = document.getElementById('legendPanel');
  const legendTitleBar = document.getElementById('legendTitleBar');

  // ── Helpers ────────────────────────────────────────────
  function escHtml(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ── Pattern Names ──────────────────────────────────────
  var PATTERN_NAMES = ['galactic', 'constellation', 'helix', 'rings', 'schools', 'mandala'];

  // ═══════════════════════════════════════════════════════
  //  LAYOUT ENGINES
  // ═══════════════════════════════════════════════════════

  function computeCardSize() {
    var vw = window.innerWidth;
    if (vw <= 480) return { w: 80, h: 68, gapX: 4, gapY: 4 };
    if (vw <= 768) return { w: 96, h: 76, gapX: 6, gapY: 6 };
    return { w: 110, h: 86, gapX: 8, gapY: 10 };
  }

  // --- Version 1: Galactic Spiral ---
  function layoutSpiral(concepts) {
    var cs = computeCardSize();
    var count = concepts.length;
    // Sort by category so related concepts cluster on the spiral
    var sorted = concepts.slice().sort(function(a, b) {
      return a.category.localeCompare(b.category) || a.name.localeCompare(b.name);
    });

    var goldenAngle = Math.PI * (3 - Math.sqrt(5)); // ~2.4 rad = ~137.5°
    var a = 60;  // start radius
    var b = 11;  // spread per radian
    var maxR = a + b * count * goldenAngle / (2 * Math.PI);

    var poolSize = Math.max(1400, Math.ceil(maxR * 2 + cs.w + 120));
    var cx = poolSize / 2;
    var cy = poolSize / 2;

    var positions = [];
    sorted.forEach(function(concept, i) {
      var theta = i * goldenAngle;
      var r = a + b * theta / (2 * Math.PI);
      positions.push({
        concept: concept,
        x: cx + r * Math.cos(theta) - cs.w / 2,
        y: cy + r * Math.sin(theta) - cs.h / 2
      });
    });

    return { positions: positions, poolW: poolSize, poolH: poolSize };
  }

  // --- Version 2: Constellation ---
  function layoutConstellation(concepts) {
    var cs = computeCardSize();
    var poolW = 1400, poolH = 2000;

    // Merge small categories into 6 clusters
    var groups = {};
    concepts.forEach(function(c) {
      if (!groups[c.category]) groups[c.category] = [];
      groups[c.category].push(c);
    });

    var entries = Object.entries(groups).sort(function(a, b) { return b[1].length - a[1].length; });

    // Distribute into 6 mega-clusters
    var clusters = [[], [], [], [], [], []];
    entries.forEach(function(entry, i) {
      clusters[i % 6].push.apply(clusters[i % 6], entry[1]);
    });

    // Define 6 cluster centers spread across the pool
    var centers = [
      { cx: poolW * 0.25, cy: poolH * 0.18 },
      { cx: poolW * 0.72, cy: poolH * 0.14 },
      { cx: poolW * 0.15, cy: poolH * 0.48 },
      { cx: poolW * 0.78, cy: poolH * 0.42 },
      { cx: poolW * 0.45, cy: poolH * 0.72 },
      { cx: poolW * 0.55, cy: poolH * 0.88 }
    ];

    var positions = [];
    clusters.forEach(function(clusterConcepts, ci) {
      var center = centers[ci];
      var n = clusterConcepts.length;
      // Ellipse radii proportional to cluster size
      var rx = Math.max(80, Math.min(280, n * 12));
      var ry = Math.max(60, Math.min(220, n * 9));

      clusterConcepts.forEach(function(concept, i) {
        // Use sunflower distribution within ellipse
        var phi = i * Math.PI * (3 - Math.sqrt(5));
        var rad = Math.sqrt((i + 0.5) / n);
        var x = center.cx + rad * rx * Math.cos(phi) - cs.w / 2;
        var y = center.cy + rad * ry * Math.sin(phi) - cs.h / 2;
        // Add small random jitter
        x += (Math.random() - 0.5) * 14;
        y += (Math.random() - 0.5) * 10;
        positions.push({ concept: concept, x: x, y: y, cluster: ci, cx: center.cx, cy: center.cy });
      });
    });

    return { positions: positions, poolW: poolW, poolH: poolH };
  }

  // --- Version 3: Double Helix ---
  function layoutDoubleHelix(concepts) {
    var cs = computeCardSize();
    var theoryTypes = ['概念', '定律', '原理', '模型', '框架'];
    var strand1 = concepts.filter(function(c) { return theoryTypes.indexOf(c.type) !== -1; });
    var strand2 = concepts.filter(function(c) { return theoryTypes.indexOf(c.type) === -1; });

    var poolW = 1200, poolH = Math.max(2600, Math.max(strand1.length, strand2.length) * 22 + 200);
    var cx = poolW / 2, cyCenter = poolH / 2;
    var amplitude = poolW * 0.38;
    var verticalSpacing = Math.max(18, Math.min(28, poolH / Math.max(strand1.length, strand2.length)));

    function placeStrand(cards, phase) {
      var positions = [];
      var startY = 80;
      cards.forEach(function(concept, i) {
        var y = startY + i * verticalSpacing;
        var x = cx + Math.sin(y * 0.008 + phase) * amplitude;
        positions.push({
          concept: concept,
          x: x - cs.w / 2,
          y: y - cs.h / 2,
          strand: phase === 0 ? 1 : 2
        });
      });
      return positions;
    }

    var allPositions = placeStrand(strand1, 0).concat(placeStrand(strand2, Math.PI));
    return { positions: allPositions, poolW: poolW, poolH: poolH };
  }

  // --- Version 4: Concentric Rings ---
  function layoutRings(concepts) {
    var cs = computeCardSize();
    var core = concepts.filter(function(c) { return c.importance === 'core'; });
    var secondary = concepts.filter(function(c) { return c.importance === 'secondary'; });

    var poolSize = 1700;
    var cx = poolSize / 2, cy = poolSize / 2;

    // Split core into inner and middle
    var coreInner = core.slice(0, Math.ceil(core.length / 2));
    var coreOuter = core.slice(Math.ceil(core.length / 2));

    var rings = [
      { cards: coreInner, radius: poolSize * 0.14 },
      { cards: coreOuter, radius: poolSize * 0.28 },
      { cards: secondary, radius: poolSize * 0.44 }
    ];

    var positions = [];
    rings.forEach(function(ring) {
      var n = ring.cards.length;
      ring.cards.forEach(function(concept, i) {
        var angle = (2 * Math.PI * i) / n - Math.PI / 2;
        // Add small random perturbation
        var r = ring.radius + (Math.random() - 0.5) * 20;
        var x = cx + r * Math.cos(angle) - cs.w / 2;
        var y = cy + r * Math.sin(angle) - cs.h / 2;
        positions.push({ concept: concept, x: x, y: y, ring: ring.radius });
      });
    });

    return { positions: positions, poolW: poolSize, poolH: poolSize };
  }

  // --- Version 5: Fish Schools ---
  function layoutFishSchools(concepts) {
    var cs = computeCardSize();
    var poolW = 1400, poolH = 2400;

    // Group by category
    var groups = {};
    concepts.forEach(function(c) {
      if (!groups[c.category]) groups[c.category] = [];
      groups[c.category].push(c);
    });

    var catEntries = Object.entries(groups);
    // Place schools in a grid-like arrangement
    var cols = 4;
    var rows = Math.ceil(catEntries.length / cols);
    var cellW = poolW / cols;
    var cellH = poolH / rows;

    var positions = [];
    catEntries.forEach(function(entry, gi) {
      var catConcepts = entry[1];
      var col = gi % cols;
      var row = Math.floor(gi / cols);
      var centerX = cellW * col + cellW / 2;
      var centerY = cellH * row + cellH / 2;

      // Ellipse for the school
      var count = catConcepts.length;
      var rx = Math.max(60, Math.min(180, count * 8));
      var ry = Math.max(40, Math.min(130, count * 5.5));

      // Direction angle for this school (for visual coherence)
      var dirAngle = (Math.random() * 0.6) - 0.3; // small angle variation

      catConcepts.forEach(function(concept, i) {
        // Sunflower within ellipse
        var phi = i * Math.PI * (3 - Math.sqrt(5));
        var rad = Math.sqrt((i + 0.5) / count);
        var x = centerX + rad * rx * Math.cos(phi) - cs.w / 2;
        var y = centerY + rad * ry * Math.sin(phi) - cs.h / 2;
        // Random jitter
        x += (Math.random() - 0.5) * 18;
        y += (Math.random() - 0.5) * 12;

        positions.push({
          concept: concept,
          x: x, y: y,
          school: gi,
          driftX: Math.cos(dirAngle) * (4 + Math.random() * 10),
          driftY: Math.sin(dirAngle) * (3 + Math.random() * 8)
        });
      });
    });

    return { positions: positions, poolW: poolW, poolH: poolH };
  }

  // --- Version 6: Mandala ---
  function layoutMandala(concepts) {
    var cs = computeCardSize();
    var poolSize = 1600;
    var cx = poolSize / 2, cy = poolSize / 2;
    var centerGap = 100; // blank center

    // Group by category
    var groups = {};
    concepts.forEach(function(c) {
      if (!groups[c.category]) groups[c.category] = [];
      groups[c.category].push(c);
    });

    var catEntries = Object.entries(groups);
    var numSectors = 12;
    var sectorAngle = (2 * Math.PI) / numSectors;

    // Assign categories to sectors
    var sectorAssign = {};
    var sectorCards = {};
    catEntries.forEach(function(entry, i) {
      var sector = i % numSectors;
      sectorAssign[entry[0]] = sector;
      if (!sectorCards[sector]) sectorCards[sector] = [];
      sectorCards[sector].push.apply(sectorCards[sector], entry[1]);
    });

    var positions = [];
    var maxR = poolSize * 0.45;

    Object.keys(sectorCards).forEach(function(sectorStr) {
      var sector = parseInt(sectorStr);
      var cards = sectorCards[sector];
      var n = cards.length;
      var startAngle = sector * sectorAngle;

      cards.forEach(function(concept, i) {
        // Place cards radially within the sector
        var r = centerGap + (maxR - centerGap) * ((i + 0.5) / n);
        // Slight angular spread within sector
        var spreadAngle = sectorAngle * 0.7;
        var angle = startAngle + spreadAngle * (0.15 + 0.7 * (i / n));
        var x = cx + r * Math.cos(angle) - cs.w / 2;
        var y = cy + r * Math.sin(angle) - cs.h / 2;
        positions.push({ concept: concept, x: x, y: y, sector: sector, r: r });
      });
    });

    return { positions: positions, poolW: poolSize, poolH: poolSize, cx: cx, cy: cy };
  }

  // ── Layout Dispatcher ──────────────────────────────────
  function computeLayout(patternIndex) {
    switch (patternIndex) {
      case 0: return layoutSpiral(CONCEPTS);
      case 1: return layoutConstellation(CONCEPTS);
      case 2: return layoutDoubleHelix(CONCEPTS);
      case 3: return layoutRings(CONCEPTS);
      case 4: return layoutFishSchools(CONCEPTS);
      case 5: return layoutMandala(CONCEPTS);
      default: return layoutSpiral(CONCEPTS);
    }
  }

  // ═══════════════════════════════════════════════════════
  //  RENDER
  // ═══════════════════════════════════════════════════════

  var layoutData = null; // { positions, poolW, poolH, ... }

  function renderPool() {
    pool.innerHTML = '';
    // Re-create constellation canvas
    var newCanvas = document.createElement('canvas');
    newCanvas.id = 'constellationCanvas';
    pool.appendChild(newCanvas);
    layoutData = computeLayout(currentPattern);
    var patternName = PATTERN_NAMES[currentPattern];

    pool.className = 'pool pattern-' + patternName;
    pool.style.width = layoutData.poolW + 'px';
    pool.style.height = layoutData.poolH + 'px';
    pool.style.minHeight = layoutData.poolH + 'px';

    // Setup constellation canvas
    var cnv = newCanvas;
    cnv.width = layoutData.poolW;
    cnv.height = layoutData.poolH;
    cnv.style.width = layoutData.poolW + 'px';
    cnv.style.height = layoutData.poolH + 'px';
    var cnvCtx = cnv.getContext('2d');

    // Create cards
    layoutData.positions.forEach(function(pos, i) {
      var concept = pos.concept;
      var catColor = getCatColor(concept.category);

      var card = document.createElement('div');
      card.className = 'card';
      card.dataset.conceptId = concept.id;
      card.dataset.category = concept.category;
      card.dataset.cluster = pos.cluster !== undefined ? pos.cluster : '';
      card.dataset.school = pos.school !== undefined ? pos.school : '';
      card.dataset.sector = pos.sector !== undefined ? pos.sector : '';

      // Position
      card.style.left = pos.x + 'px';
      card.style.top = pos.y + 'px';
      card.style.width = computeCardSize().w + 'px';
      card.style.minHeight = computeCardSize().h + 'px';

      // Category color gradient
      var bgGradient = 'linear-gradient(160deg, ' + catColor.bg + ' 0%, rgba(255,255,255,0.58) 100%)';
      var bgGradientHover = 'linear-gradient(160deg, ' + catColor.bg + ' 0%, rgba(255,255,255,0.32) 100%)';
      card.style.setProperty('--card-gradient', bgGradient);
      card.style.setProperty('--card-gradient-hover', bgGradientHover);

      // Sway delay
      card.style.setProperty('--sway-delay', (i * 0.37).toFixed(2) + 's');

      card.innerHTML =
        '<span class="card-category">' + escHtml(concept.category) + '</span>' +
        '<h3 class="card-name">' + escHtml(concept.name) + '</h3>' +
        '<span class="card-type">' + escHtml(concept.type) + '</span>';

      card.addEventListener('click', function(e) {
        e.stopPropagation();
        if (isAnimating) return;
        if (activeConcept && activeConcept.id === concept.id) return;
        openCard(concept, card);
      });

      // Constellation hover: show connection lines
      if (currentPattern === 1) {
        card.addEventListener('mouseenter', function() {
          drawConstellationLines(concept, pos, cnvCtx);
        });
        card.addEventListener('mouseleave', function() {
          cnvCtx.clearRect(0, 0, cnv.width, cnv.height);
        });
      }

      // Fish school: use staggered animation delays for organic school movement
      if (currentPattern === 4 && pos.driftX !== undefined) {
        // Vary animation duration per school for organic feel
        var schoolDur = 4.5 + (pos.school % 5) * 0.8;
        card.style.animationDuration = schoolDur + 's';
        // Stagger within school based on radial position
        card.style.animationDelay = ((pos.school * 0.3) + (i * 0.05) % 1.5).toFixed(2) + 's';
      }

      pool.appendChild(card);
    });
  }

  // ── Constellation Lines ────────────────────────────────
  function drawConstellationLines(hoveredConcept, hoveredPos, cnvCtx) {
    cnvCtx.clearRect(0, 0, cnvCtx.canvas.width, cnvCtx.canvas.height);

    var cluster = hoveredPos.cluster;
    if (cluster === undefined) return;

    // Find all cards in the same cluster
    var clusterCards = layoutData.positions.filter(function(p) {
      return p.cluster === cluster && p.concept.name !== hoveredConcept.name;
    });

    // Draw lines to related concepts in same cluster
    var relatedNames = hoveredConcept.related_concepts || [];
    clusterCards.forEach(function(p) {
      if (relatedNames.indexOf(p.concept.name) === -1) return;

      var cs = computeCardSize();
      var x1 = hoveredPos.x + cs.w / 2;
      var y1 = hoveredPos.y + cs.h / 2;
      var x2 = p.x + cs.w / 2;
      var y2 = p.y + cs.h / 2;

      cnvCtx.beginPath();
      cnvCtx.moveTo(x1, y1);
      cnvCtx.lineTo(x2, y2);
      cnvCtx.strokeStyle = 'rgba(140, 190, 210, 0.30)';
      cnvCtx.lineWidth = 0.8;
      cnvCtx.setLineDash([4, 6]);
      cnvCtx.stroke();

      // Small dot at the connected card
      cnvCtx.beginPath();
      cnvCtx.arc(x2, y2, 3, 0, Math.PI * 2);
      cnvCtx.fillStyle = 'rgba(140, 190, 210, 0.35)';
      cnvCtx.fill();
    });

    // Also draw faint lines to ALL cards in the same cluster (background network)
    clusterCards.forEach(function(p) {
      if (relatedNames.indexOf(p.concept.name) !== -1) return; // already drawn
      var cs = computeCardSize();
      var x1 = hoveredPos.x + cs.w / 2;
      var y1 = hoveredPos.y + cs.h / 2;
      var x2 = p.x + cs.w / 2;
      var y2 = p.y + cs.h / 2;

      cnvCtx.beginPath();
      cnvCtx.moveTo(x1, y1);
      cnvCtx.lineTo(x2, y2);
      cnvCtx.strokeStyle = 'rgba(160, 200, 220, 0.10)';
      cnvCtx.lineWidth = 0.4;
      cnvCtx.setLineDash([2, 10]);
      cnvCtx.stroke();
    });

    cnvCtx.setLineDash([]);
  }

  // ═══════════════════════════════════════════════════════
  //  RENDER LEGEND
  // ═══════════════════════════════════════════════════════

  function renderLegend() {
    var cats = {};
    CONCEPTS.forEach(function(c) {
      cats[c.category] = (cats[c.category] || 0) + 1;
    });
    var sorted = Object.entries(cats).sort(function(a, b) { return b[1] - a[1]; });
    var html = '';
    sorted.forEach(function(pair) {
      var catColor = getCatColor(pair[0]);
      html += '<span class="legend-cat-item">' +
        '<span class="legend-cat-dot" style="background:' + catColor.dot + ';"></span>' +
        '<span class="legend-cat-name">' + escHtml(pair[0]) + '</span>' +
        '<span class="legend-cat-num">' + pair[1] + '</span>' +
        '</span>';
    });
    document.getElementById('legendCats').innerHTML = html;
    document.getElementById('legendTotal').textContent = CONCEPTS.length;
    document.getElementById('legendCatCount').textContent = sorted.length;
  }

  // ═══════════════════════════════════════════════════════
  //  LEGEND DRAGGING
  // ═══════════════════════════════════════════════════════

  (function initLegendDrag() {
    var isDragging = false;
    var startX, startY, startLeft, startTop;

    function onPointerDown(e) {
      if (e.target.closest('.legend-cats') || e.target.closest('.legend-subtitle') ||
          e.target.closest('.legend-divider')) {
        // Allow text selection in body area, but start drag from title bar
        return;
      }
      isDragging = true;
      legendPanel.classList.add('dragging');
      legendPanel.style.animationPlayState = 'paused';
      legendPanel.setPointerCapture(e.pointerId);

      var rect = legendPanel.getBoundingClientRect();
      startX = e.clientX;
      startY = e.clientY;
      startLeft = rect.left;
      startTop = rect.top;

      // Switch from right-based to left-based positioning
      legendPanel.style.right = 'auto';
      legendPanel.style.left = startLeft + 'px';
      legendPanel.style.top = startTop + 'px';

      e.preventDefault();
    }

    function onPointerMove(e) {
      if (!isDragging) return;
      var dx = e.clientX - startX;
      var dy = e.clientY - startY;
      var newLeft = startLeft + dx;
      var newTop = startTop + dy;

      // Clamp to viewport
      var maxLeft = window.innerWidth - legendPanel.offsetWidth - 8;
      var maxTop = window.innerHeight - legendPanel.offsetHeight - 8;
      newLeft = Math.max(8, Math.min(newLeft, maxLeft));
      newTop = Math.max(8, Math.min(newTop, maxTop));

      legendPanel.style.left = newLeft + 'px';
      legendPanel.style.top = newTop + 'px';
    }

    function onPointerUp(e) {
      if (!isDragging) return;
      isDragging = false;
      legendPanel.classList.remove('dragging');
      legendPanel.style.animationPlayState = 'running';
      legendPanel.releasePointerCapture(e.pointerId);
    }

    legendTitleBar.addEventListener('pointerdown', onPointerDown);
    document.addEventListener('pointermove', onPointerMove);
    document.addEventListener('pointerup', onPointerUp);
    document.addEventListener('pointercancel', onPointerUp);
  })();

  // ═══════════════════════════════════════════════════════
  //  DETAIL VIEW & FLIP ANIMATION
  // ═══════════════════════════════════════════════════════

  function renderDetail(concept) {
    var relatedHtml = concept.related_concepts.map(function(rc) {
      var exists = rc in conceptMap;
      return '<span class="related-tag' + (exists ? ' clickable' : '') + '"' +
             ' data-concept-name="' + escHtml(rc) + '"' +
             (exists ? ' tabindex="0" role="button"' : '') + '>' +
             escHtml(rc) + '</span>';
    }).join('');

    var counterHtml = '';
    if (concept.counter_examples && concept.counter_examples.length) {
      counterHtml =
        '<section>' +
        '<h3>反例 / 常见误解</h3>' +
        '<ul class="counter-list">' +
        concept.counter_examples.map(function(e) { return '<li>' + escHtml(e) + '</li>'; }).join('') +
        '</ul>' +
        '</section>';
    }

    detailInner.innerHTML =
      '<div class="detail-header">' +
        '<div class="detail-tags">' +
          '<span class="tag tag-category">' + escHtml(concept.category) + '</span>' +
          '<span class="tag tag-type">' + escHtml(concept.type) + '</span>' +
        '</div>' +
        '<h1 class="detail-name">' + escHtml(concept.name) + '</h1>' +
      '</div>' +
      '<div class="detail-body">' +
        '<section>' +
          '<h3>定义</h3>' +
          '<p>' + escHtml(concept.definition) + '</p>' +
        '</section>' +
        '<section>' +
          '<h3>类比</h3>' +
          '<p class="analogy-text">' + escHtml(concept.analogy) + '</p>' +
        '</section>' +
      '</div>' +
      '<div class="detail-body-extras">' +
        '<section>' +
          '<h3>事例</h3>' +
          '<ul>' + concept.examples.map(function(e) { return '<li>' + escHtml(e) + '</li>'; }).join('') + '</ul>' +
        '</section>' +
        counterHtml +
        '<section class="detail-source">' +
          '<h3>来源</h3>' +
          '<p>' + escHtml(concept.source.course) + ' · ' + escHtml(concept.source.letter) + '</p>' +
        '</section>' +
        '<section>' +
          '<h3>关联概念</h3>' +
          '<div class="related-tags">' + relatedHtml + '</div>' +
        '</section>' +
      '</div>';

    var clickables = detailInner.querySelectorAll('.related-tag.clickable');
    clickables.forEach(function(tag) {
      tag.addEventListener('click', function(e) {
        e.stopPropagation();
        var name = tag.dataset.conceptName;
        var target = conceptMap[name];
        if (target) switchToConcept(target);
      });
    });

    detailCard.scrollTop = 0;
  }

  function openCard(concept, cardEl) {
    if (activeConcept) {
      closeCardInstant();
    }

    isAnimating = true;

    var cardRect = cardEl.getBoundingClientRect();
    var vw = window.innerWidth;
    var vh = window.innerHeight;
    var cx = vw / 2;
    var cy = vh / 2;
    var cardCX = cardRect.left + cardRect.width / 2;
    var cardCY = cardRect.top + cardRect.height / 2;
    var dx = cardCX - cx;
    var dy = cardCY - cy;
    var detailW = Math.min(560, vw * 0.92);
    var scaleFrom = Math.min(cardRect.width / detailW, 0.42);

    renderDetail(concept);

    detailCard.style.transition = 'none';
    detailCard.style.transform = 'translate(' + dx + 'px, ' + dy + 'px) scale(' + scaleFrom + ')';
    detailCard.style.opacity = '0.55';

    overlay.classList.add('active');
    closeBtn.classList.add('visible');
    document.body.classList.add('overlay-open');

    createSplash(cardCX, cardCY);

    detailCard.offsetHeight; // force reflow

    detailCard.style.transition =
      'transform 380ms cubic-bezier(0.22, 0.98, 0.36, 1.02), opacity 300ms ease-out';
    detailCard.style.transform = 'translate(0, 0) scale(1)';
    detailCard.style.opacity = '1';

    cardEl.classList.add('retrieved');
    activeConcept = concept;
    activeCardEl  = cardEl;

    setTimeout(function() { isAnimating = false; }, 400);
  }

  function closeCard(instant) {
    if (!activeConcept) return;

    if (instant) {
      closeCardInstant();
      return;
    }

    isAnimating = true;

    var cardEl   = activeCardEl;
    var cardRect = cardEl.getBoundingClientRect();
    var vw = window.innerWidth;
    var vh = window.innerHeight;
    var cx = vw / 2;
    var cy = vh / 2;
    var cardCX = cardRect.left + cardRect.width / 2;
    var cardCY = cardRect.top + cardRect.height / 2;
    var dx = cardCX - cx;
    var dy = cardCY - cy;
    var detailW = Math.min(560, vw * 0.92);
    var scaleTo = Math.min(cardRect.width / detailW, 0.42);

    detailCard.style.transition =
      'transform 280ms cubic-bezier(0.4, 0, 0.6, 1), opacity 220ms ease-in';
    detailCard.style.transform = 'translate(' + dx + 'px, ' + dy + 'px) scale(' + scaleTo + ')';
    detailCard.style.opacity = '0.35';

    overlay.style.transition = 'opacity 280ms ease';
    overlay.style.opacity = '0';

    createSplash(cardCX, cardCY);

    var el = activeCardEl;
    setTimeout(function() {
      overlay.classList.remove('active');
      overlay.style.transition = '';
      overlay.style.opacity = '';
      closeBtn.classList.remove('visible');
      document.body.classList.remove('overlay-open');
      detailCard.style.transition = 'none';
      detailCard.style.transform = '';
      detailCard.style.opacity = '';
      el.classList.remove('retrieved');
      activeConcept = null;
      activeCardEl  = null;
      isAnimating = false;
    }, 300);
  }

  function closeCardInstant() {
    overlay.classList.remove('active');
    overlay.style.transition = '';
    overlay.style.opacity = '';
    closeBtn.classList.remove('visible');
    document.body.classList.remove('overlay-open');
    detailCard.style.transition = 'none';
    detailCard.style.transform = '';
    detailCard.style.opacity = '';
    if (activeCardEl) activeCardEl.classList.remove('retrieved');
    activeConcept = null;
    activeCardEl  = null;
    isAnimating = false;
  }

  function switchToConcept(concept) {
    if (isAnimating) return;
    isAnimating = true;

    var newCardEl = pool.querySelector('[data-concept-id="' + concept.id + '"]');

    detailCard.style.transition = 'transform 160ms ease-in, opacity 120ms ease-in';
    detailCard.style.transform = 'scale(0.92)';
    detailCard.style.opacity = '0.25';

    setTimeout(function() {
      renderDetail(concept);
      detailCard.scrollTop = 0;

      if (activeCardEl) activeCardEl.classList.remove('retrieved');
      if (newCardEl) newCardEl.classList.add('retrieved');

      activeConcept = concept;
      activeCardEl  = newCardEl;

      detailCard.style.transition =
        'transform 220ms cubic-bezier(0.34, 1.56, 0.64, 1), opacity 200ms ease-out';
      detailCard.style.transform = 'scale(1)';
      detailCard.style.opacity = '1';

      setTimeout(function() { isAnimating = false; }, 250);
    }, 170);
  }

  function createSplash(x, y) {
    var splash = document.createElement('div');
    splash.className = 'splash';
    splash.style.left = x + 'px';
    splash.style.top  = y + 'px';
    document.body.appendChild(splash);

    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        splash.classList.add('animate');
      });
    });

    splash.addEventListener('animationend', function() { splash.remove(); });
    setTimeout(function() { if (splash.parentNode) splash.remove(); }, 800);
  }

  // ═══════════════════════════════════════════════════════
  //  EVENTS
  // ═══════════════════════════════════════════════════════

  closeBtn.addEventListener('click', function() { closeCard(false); });

  overlay.addEventListener('click', function(e) {
    if (e.target === overlay || e.target.classList.contains('overlay-backdrop')) {
      closeCard(false);
    }
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && activeConcept && !isAnimating) {
      closeCard(false);
    }
  });

  var resizeTimer;
  window.addEventListener('resize', function() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function() {
      if (activeConcept) closeCardInstant();
      // Re-render pool with same pattern on resize
      renderPool();
    }, 400);
  });

  // ═══════════════════════════════════════════════════════
  //  MOUSE RIPPLE TRAIL
  // ═══════════════════════════════════════════════════════

  (function() {
    var rippleCanvas = document.getElementById('rippleCanvas');
    var rctx = rippleCanvas.getContext('2d');
    var ripples = [];
    var mouseX = -100, mouseY = -100;
    var lastRippleTime = 0;

    function resizeRipple() {
      rippleCanvas.width = window.innerWidth;
      rippleCanvas.height = window.innerHeight;
    }
    resizeRipple();
    window.addEventListener('resize', resizeRipple);

    document.addEventListener('mousemove', function(e) {
      mouseX = e.clientX;
      mouseY = e.clientY;
      var now = Date.now();
      if (now - lastRippleTime > 40) {
        ripples.push({ x: mouseX, y: mouseY, r: 0, opacity: 0.55, life: 1 });
        lastRippleTime = now;
        if (ripples.length > 60) ripples.shift();
      }
    });

    document.addEventListener('mouseleave', function() {
      mouseX = -100;
      mouseY = -100;
    });

    function drawRipples() {
      rctx.clearRect(0, 0, rippleCanvas.width, rippleCanvas.height);

      if (mouseX > 0 && mouseY > 0) {
        var glow = rctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, 140);
        glow.addColorStop(0, 'rgba(180, 220, 240, 0.34)');
        glow.addColorStop(0.3, 'rgba(155, 215, 235, 0.20)');
        glow.addColorStop(0.6, 'rgba(140, 200, 225, 0.08)');
        glow.addColorStop(1, 'rgba(140, 200, 225, 0)');
        rctx.fillStyle = glow;
        rctx.beginPath();
        rctx.arc(mouseX, mouseY, 140, 0, Math.PI * 2);
        rctx.fill();

        var coreGlow = rctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, 40);
        coreGlow.addColorStop(0, 'rgba(210, 240, 250, 0.40)');
        coreGlow.addColorStop(0.5, 'rgba(180, 225, 240, 0.15)');
        coreGlow.addColorStop(1, 'rgba(150, 210, 230, 0)');
        rctx.fillStyle = coreGlow;
        rctx.beginPath();
        rctx.arc(mouseX, mouseY, 40, 0, Math.PI * 2);
        rctx.fill();
      }

      for (var i = ripples.length - 1; i >= 0; i--) {
        var r = ripples[i];
        r.r += 1.5;
        r.life -= 0.010;
        r.opacity = r.life * 0.55;
        if (r.life <= 0) { ripples.splice(i, 1); continue; }

        rctx.beginPath();
        rctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
        rctx.strokeStyle = 'rgba(150, 210, 235,' + (r.opacity * 0.7) + ')';
        rctx.lineWidth = 1.6;
        rctx.stroke();

        rctx.beginPath();
        rctx.arc(r.x, r.y, r.r * 0.55, 0, Math.PI * 2);
        rctx.strokeStyle = 'rgba(180, 220, 240,' + (r.opacity * 0.5) + ')';
        rctx.lineWidth = 1.0;
        rctx.stroke();

        rctx.beginPath();
        rctx.arc(r.x, r.y, r.r * 1.4, 0, Math.PI * 2);
        rctx.strokeStyle = 'rgba(170, 215, 235,' + (r.opacity * 0.25) + ')';
        rctx.lineWidth = 0.7;
        rctx.stroke();
      }

      requestAnimationFrame(drawRipples);
    }
    drawRipples();
  })();

  // ═══════════════════════════════════════════════════════
  //  RAINDROP SYSTEM
  // ═══════════════════════════════════════════════════════

  (function() {
    var container = document.getElementById('raindropContainer');
    var maxDrops = 8;
    var activeDrops = 0;

    function createRaindrop() {
      if (activeDrops >= maxDrops) return;
      activeDrops++;

      var x = Math.random() * window.innerWidth;
      var surfaceY = window.innerHeight * (0.4 + Math.random() * 0.45);

      var drop = document.createElement('div');
      drop.className = 'raindrop falling';
      drop.style.left = x + 'px';
      drop.style.top = '-12px';
      drop.style.setProperty('--fall-distance', surfaceY + 'px');
      drop.style.setProperty('--fall-duration', (0.45 + Math.random() * 0.35) + 's');
      drop.dataset.surfaceY = surfaceY;
      drop.dataset.dropX = x;
      container.appendChild(drop);

      drop.addEventListener('animationend', function() {
        drop.remove();
        createRainRipple(parseFloat(drop.dataset.dropX), parseFloat(drop.dataset.surfaceY));
        activeDrops--;
      });

      var dur = parseFloat(drop.style.getPropertyValue('--fall-duration')) * 1000 + 200;
      setTimeout(function() {
        if (drop.parentNode) {
          createRainRipple(parseFloat(drop.dataset.dropX), parseFloat(drop.dataset.surfaceY));
          drop.remove();
          activeDrops--;
        }
      }, dur);
    }

    function createRainRipple(x, y) {
      var ripple = document.createElement('div');
      ripple.className = 'rain-ripple animating';
      ripple.style.left = x + 'px';
      ripple.style.top = y + 'px';
      document.body.appendChild(ripple);

      ripple.addEventListener('animationend', function() { ripple.remove(); });
      setTimeout(function() { if (ripple.parentNode) ripple.remove(); }, 1800);
    }

    function scheduleNext() {
      var delay = 1200 + Math.random() * 2200;
      setTimeout(function() {
        createRaindrop();
        scheduleNext();
      }, delay);
    }

    setTimeout(function() { createRaindrop(); }, 400);
    setTimeout(function() { createRaindrop(); }, 900);
    scheduleNext();
  })();

  // ═══════════════════════════════════════════════════════
  //  BUBBLE SYSTEM
  // ═══════════════════════════════════════════════════════

  (function() {
    var container = document.getElementById('bubbleContainer');
    var bubbleCount = 18;

    for (var i = 0; i < bubbleCount; i++) {
      var bubble = document.createElement('div');
      bubble.className = 'bubble';
      var size = 4 + Math.random() * 14;
      bubble.style.width = size + 'px';
      bubble.style.height = size + 'px';
      bubble.style.left = (Math.random() * 94) + '%';
      bubble.style.setProperty('--bubble-dur', (6 + Math.random() * 12) + 's');
      bubble.style.setProperty('--bubble-delay', (Math.random() * 14) + 's');
      bubble.style.setProperty('--wobble-1', ((Math.random() - 0.5) * 20) + 'px');
      bubble.style.setProperty('--wobble-2', ((Math.random() - 0.5) * 16) + 'px');
      bubble.style.setProperty('--wobble-3', ((Math.random() - 0.5) * 12) + 'px');
      container.appendChild(bubble);
    }
  })();

  // ═══════════════════════════════════════════════════════
  //  SEAWEED SILHOUETTES
  // ═══════════════════════════════════════════════════════

  (function() {
    var container = document.getElementById('seaweedContainer');
    var seaweedDefs = [
      { x: '5%', w: 20, h: 90, swayDur: '6s', swayDelay: '0s', opacity: 0.10 },
      { x: '14%', w: 14, h: 70, swayDur: '7.5s', swayDelay: '-2s', opacity: 0.08 },
      { x: '22%', w: 24, h: 110, swayDur: '5.5s', swayDelay: '-4s', opacity: 0.11 },
      { x: '35%', w: 16, h: 60, swayDur: '8s', swayDelay: '-1s', opacity: 0.07 },
      { x: '48%', w: 18, h: 85, swayDur: '6.5s', swayDelay: '-3s', opacity: 0.10 },
      { x: '60%', w: 22, h: 100, swayDur: '7s', swayDelay: '-5s', opacity: 0.09 },
      { x: '72%', w: 15, h: 75, swayDur: '5.8s', swayDelay: '-2.5s', opacity: 0.08 },
      { x: '82%', w: 20, h: 95, swayDur: '6.8s', swayDelay: '-1.5s', opacity: 0.10 },
      { x: '92%', w: 12, h: 55, swayDur: '7.2s', swayDelay: '-3.5s', opacity: 0.07 },
    ];

    seaweedDefs.forEach(function(def) {
      var weed = document.createElement('div');
      weed.className = 'seaweed';
      weed.style.left = def.x;
      weed.style.setProperty('--sway-dur', def.swayDur);
      weed.style.setProperty('--sway-delay', def.swayDelay);
      weed.style.opacity = def.opacity;

      var svg = '<svg width="' + (def.w * 2) + '" height="' + def.h + '" viewBox="0 0 ' + (def.w * 2) + ' ' + def.h + '">' +
        '<ellipse cx="' + def.w + '" cy="' + (def.h * 0.85) + '" rx="' + (def.w * 0.25) + '" ry="' + (def.h * 0.8) + '" fill="#5a8a6a" opacity="0.6"/>' +
        '<ellipse cx="' + (def.w * 0.65) + '" cy="' + (def.h * 0.75) + '" rx="' + (def.w * 0.18) + '" ry="' + (def.h * 0.6) + '" fill="#4a7a5a" opacity="0.5"/>' +
        '<ellipse cx="' + (def.w * 1.35) + '" cy="' + (def.h * 0.8) + '" rx="' + (def.w * 0.2) + '" ry="' + (def.h * 0.7) + '" fill="#5a8a6a" opacity="0.5"/>' +
        '</svg>';
      weed.innerHTML = svg;
      container.appendChild(weed);
    });
  })();

  // ═══════════════════════════════════════════════════════
  //  INIT
  // ═══════════════════════════════════════════════════════

  if (CONCEPTS.length > 0) {
    currentPattern = Math.floor(Math.random() * 6);
    renderPool();
    renderLegend();
  } else {
    pool.innerHTML = '<p style="text-align:center;color:#889;padding:60px 0;position:absolute;width:100%;">概念数据加载中…</p>';
    window.addEventListener('load', function() {
      if (window.CONCEPTS && window.CONCEPTS.length > 0 && !pool.querySelector('.card')) {
        currentPattern = Math.floor(Math.random() * 6);
        renderPool();
        renderLegend();
      }
    });
  }
})();
</script>

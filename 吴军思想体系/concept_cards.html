<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>概念卡片池 · 马赛克像素艺术 v4</title>
<style>
/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --water-1: #d8f0f8;
  --water-2: #c8e6e0;
  --water-3: #d4edf4;
  --text-primary: #1a2a3a;
  --text-secondary: #4a6070;
  --text-muted: #7a8a96;
  --shadow-card: 0 2px 8px rgba(60, 100, 130, 0.07);
  --shadow-hover: 0 10px 30px rgba(60, 100, 130, 0.13);
  --shadow-pop: 0 24px 64px rgba(0, 0, 0, 0.16);
  --radius-card: 14px;
  --radius-detail: 20px;
  --font-stack: 'PingFang SC', 'Noto Sans SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
  --ease-card: 280ms cubic-bezier(0.4, 0, 0.2, 1);
  --ease-pop: 380ms cubic-bezier(0.22, 0.98, 0.36, 1.02);
  --ease-close: 280ms cubic-bezier(0.4, 0, 0.6, 1);
}

html { font-size: 16px; }

body {
  font-family: var(--font-stack);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  background: #d4edf4;
}

body.overlay-open { overflow: hidden; }

/* ===== Water Background ===== */
.water-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  background:
    linear-gradient(172deg,
      #d8f0f8 0%,
      #c8e8e0 16%,
      #d4edf4 32%,
      #e2f2f0 48%,
      #cce8e8 64%,
      #daf0f5 82%,
      #d0eaf2 100%
    );
}

.water-bg::before {
  content: '';
  position: absolute;
  inset: -35%;
  background:
    radial-gradient(ellipse 600px 400px at 18% 28%, rgba(255,255,255,0.22) 0%, transparent 60%),
    radial-gradient(ellipse 500px 350px at 72% 18%, rgba(255,255,255,0.17) 0%, transparent 55%),
    radial-gradient(ellipse 520px 380px at 48% 68%, rgba(255,255,255,0.19) 0%, transparent 58%),
    radial-gradient(ellipse 420px 300px at 82% 72%, rgba(255,255,255,0.13) 0%, transparent 50%),
    radial-gradient(ellipse 360px 280px at 28% 78%, rgba(255,255,255,0.15) 0%, transparent 52%);
  animation: caustics-drift 14s ease-in-out infinite;
}

.water-bg::after {
  content: '';
  position: absolute;
  inset: -25%;
  background:
    radial-gradient(ellipse 300px 200px at 22% 42%, rgba(255,255,255,0.11) 0%, transparent 50%),
    radial-gradient(ellipse 260px 180px at 62% 32%, rgba(255,255,255,0.09) 0%, transparent 48%),
    radial-gradient(ellipse 280px 190px at 44% 74%, rgba(255,255,255,0.10) 0%, transparent 52%),
    radial-gradient(ellipse 240px 160px at 78% 58%, rgba(255,255,255,0.08) 0%, transparent 50%);
  animation: caustics-drift 9s ease-in-out infinite reverse;
}

.caustics-extra {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: 0.35;
  background:
    radial-gradient(ellipse 380px 240px at 30% 35%, rgba(200,235,250,0.25) 0%, transparent 55%),
    radial-gradient(ellipse 340px 200px at 65% 55%, rgba(200,235,250,0.20) 0%, transparent 50%),
    radial-gradient(ellipse 300px 220px at 50% 20%, rgba(220,245,255,0.22) 0%, transparent 52%);
  animation: caustics-drift 12s ease-in-out infinite;
}

@keyframes caustics-drift {
  0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
  18%      { transform: translate(2.8%, 1.8%) rotate(0.7deg) scale(1.03); }
  38%      { transform: translate(-1.2%, 2.2%) rotate(-0.5deg) scale(0.97); }
  58%      { transform: translate(1.8%, -1.6%) rotate(0.4deg) scale(1.02); }
  78%      { transform: translate(-2.2%, -1.2%) rotate(-0.6deg) scale(0.98); }
}

.light-rays {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  opacity: 0.30;
  background:
    repeating-linear-gradient(
      108deg,
      transparent,
      transparent 140px,
      rgba(255,255,255,0.035) 140px,
      rgba(255,255,255,0.07) 143px,
      transparent 143px
    );
  animation: rays-shift 22s linear infinite;
}

@keyframes rays-shift {
  0%   { transform: translateX(-6%) skewX(-2deg); }
  50%  { transform: translateX(6%) skewX(2deg); }
  100% { transform: translateX(-6%) skewX(-2deg); }
}

/* ===== Legend Panel — Draggable, Floating ===== */
.legend-panel {
  position: fixed;
  top: 60px;
  right: 16px;
  z-index: 50;
  background: rgba(255, 255, 255, 0.58);
  backdrop-filter: blur(22px) saturate(1.6);
  -webkit-backdrop-filter: blur(22px) saturate(1.6);
  border: 1px solid rgba(255, 255, 255, 0.55);
  border-radius: 16px;
  padding: 0;
  box-shadow:
    0 8px 40px rgba(60, 110, 140, 0.16),
    0 2px 8px rgba(60, 110, 140, 0.08);
  width: 250px;
  max-width: calc(100vw - 32px);
  overflow: hidden;
  user-select: none;
  transition: box-shadow 0.3s ease;
}

.legend-panel.dragging {
  box-shadow:
    0 16px 56px rgba(60, 110, 140, 0.24),
    0 4px 16px rgba(60, 110, 140, 0.12);
  cursor: grabbing;
}

.legend-panel::before {
  content: '';
  display: block;
  height: 2px;
  margin: 0 16px;
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(140, 200, 225, 0.5) 15%,
    rgba(200, 230, 245, 0.8) 35%,
    rgba(255, 255, 255, 0.9) 50%,
    rgba(200, 230, 245, 0.8) 65%,
    rgba(140, 200, 225, 0.5) 85%,
    transparent 100%
  );
  border-radius: 1px;
}

.legend-title-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 16px 8px;
  cursor: grab;
  touch-action: none;
}

.legend-title-bar:active { cursor: grabbing; }

.legend-drag-handle {
  font-size: 0.9rem;
  color: #90b8c8;
  line-height: 1;
  flex-shrink: 0;
}

.legend-title {
  font-size: 0.85rem;
  font-weight: 800;
  color: #1a3040;
  letter-spacing: 0.05em;
}

.legend-body {
  padding: 0 16px 14px;
}

.legend-subtitle {
  font-size: 0.63rem;
  color: #5a7888;
  margin-bottom: 8px;
  font-weight: 500;
}

.legend-divider {
  border: none;
  border-top: 1px dashed rgba(120, 170, 195, 0.25);
  margin: 0 0 8px 0;
}

.legend-cats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px 10px;
  font-size: 0.63rem;
  color: #4a6678;
  line-height: 1.5;
}

.legend-cat-item {
  white-space: nowrap;
  display: flex;
  justify-content: space-between;
  gap: 4px;
  align-items: center;
}

.legend-cat-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-right: 4px;
  flex-shrink: 0;
}

.legend-cat-name {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
}

.legend-cat-num {
  font-weight: 700;
  color: #2a5068;
  min-width: 18px;
  text-align: right;
}

.legend-pattern-badge {
  font-size: 0.58rem;
  color: #6a8898;
  margin-top: 6px;
  font-style: italic;
  text-align: center;
}

/* ===== Mouse Ripple Canvas ===== */
#rippleCanvas {
  position: fixed;
  inset: 0;
  z-index: 5;
  pointer-events: none;
}

/* ===== Raindrops ===== */
.raindrop-container {
  position: fixed;
  inset: 0;
  z-index: 3;
  pointer-events: none;
}

.raindrop {
  position: absolute;
  width: 5px;
  height: 8px;
  background: linear-gradient(180deg,
    rgba(180, 220, 240, 0.7) 0%,
    rgba(140, 200, 225, 0.5) 100%
  );
  border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
  pointer-events: none;
  filter: drop-shadow(0 0 2px rgba(160, 210, 235, 0.5));
}

.raindrop.falling {
  animation: raindrop-fall var(--fall-duration, 0.6s) ease-in forwards;
}

@keyframes raindrop-fall {
  0%   { transform: translateY(0); opacity: 0.7; }
  70%  { opacity: 0.6; }
  100% { transform: translateY(var(--fall-distance, 300px)); opacity: 0.3; }
}

.rain-ripple {
  position: fixed;
  pointer-events: none;
  z-index: 4;
  border-radius: 50%;
  border: 1.5px solid rgba(180, 215, 235, 0.55);
  background: radial-gradient(circle, rgba(190, 220, 240, 0.15) 0%, transparent 65%);
  transform: translate(-50%, -50%);
}

.rain-ripple.animating {
  animation: rain-ripple-expand 1.6s ease-out forwards;
}

@keyframes rain-ripple-expand {
  0%   { width: 6px; height: 6px; opacity: 0.7; }
  100% { width: 140px; height: 140px; opacity: 0; }
}

/* ===== Bubbles ===== */
.bubble-container {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
}

.bubble {
  position: absolute;
  bottom: -20px;
  border-radius: 50%;
  background: radial-gradient(
    circle at 35% 35%,
    rgba(220, 240, 250, 0.45) 0%,
    rgba(140, 200, 225, 0.12) 60%,
    rgba(140, 200, 225, 0.03) 100%
  );
  border: 1px solid rgba(180, 215, 235, 0.25);
  pointer-events: none;
  animation: bubble-rise var(--bubble-dur, 7s) ease-in-out var(--bubble-delay, 0s) infinite;
}

@keyframes bubble-rise {
  0% {
    transform: translateY(0) translateX(0) scale(0.6);
    opacity: 0;
  }
  8%  { opacity: 0.55; }
  40% {
    transform: translateY(calc(-40vh)) translateX(var(--wobble-1, 8px)) scale(1);
    opacity: 0.45;
  }
  70% {
    transform: translateY(calc(-75vh)) translateX(var(--wobble-2, -6px)) scale(0.9);
    opacity: 0.25;
  }
  100% {
    transform: translateY(calc(-105vh)) translateX(var(--wobble-3, 4px)) scale(0.5);
    opacity: 0;
  }
}

/* ===== Seaweed silhouettes ===== */
.seaweed-container {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 0;
  pointer-events: none;
  height: 160px;
}

.seaweed {
  position: absolute;
  bottom: 0;
  opacity: 0.08;
  transform-origin: bottom center;
  animation: seaweed-sway var(--sway-dur, 7s) ease-in-out var(--sway-delay, 0s) infinite;
}

.seaweed svg { display: block; }

@keyframes seaweed-sway {
  0%, 100% { transform: rotate(0deg) scaleY(1); }
  25%      { transform: rotate(1.5deg) scaleY(1.02); }
  50%      { transform: rotate(-1deg) scaleY(0.99); }
  75%      { transform: rotate(1.2deg) scaleY(1.01); }
}

/* ===== Pool — Mosaic CSS Grid Container ===== */
.pool {
  position: relative;
  z-index: 2;
  min-height: 100vh;
  margin: 0 auto;
  max-width: 1600px;
  padding: 24px 12px 60px;
  display: grid;
  grid-template-columns: repeat(16, 1fr);
  gap: 5px;
  align-items: start;
  justify-content: center;
}

/* ===== Individual Card ===== */
.card {
  background: linear-gradient(160deg, var(--card-bg, #e8e8e8) 0%, rgba(255,255,255,0.58) 100%);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  border-radius: var(--radius-card);
  padding: 8px 4px 8px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  min-height: 74px;
  aspect-ratio: 4 / 3;
  border: 1px solid rgba(255, 255, 255, 0.45);
  box-shadow: var(--shadow-card);
  filter: blur(1.0px);
  opacity: 0.70;
  user-select: none;
  transition:
    transform var(--ease-card),
    opacity var(--ease-card),
    filter var(--ease-card),
    box-shadow var(--ease-card),
    background var(--ease-card);
  z-index: 3;
}

.card:hover {
  transform: translateY(-7px) scale(1.04);
  filter: blur(0px);
  opacity: 1;
  background: linear-gradient(160deg, var(--card-bg, #e8e8e8) 0%, rgba(255,255,255,0.88) 100%);
  box-shadow: var(--shadow-hover);
  z-index: 10;
}

.card:active {
  transform: translateY(-3px) scale(0.97);
  transition: transform 100ms ease-out;
}

.card.retrieved {
  opacity: 0.15;
  filter: blur(3px);
  pointer-events: none;
  transform: scale(0.95);
  transition: opacity 350ms ease, filter 350ms ease, transform 350ms ease;
}

.card::after {
  content: '';
  position: absolute;
  inset: -5px;
  border-radius: 18px;
  border: 2px solid rgba(140, 200, 220, 0.28);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}

.card:hover::after {
  opacity: 1;
  animation: hover-ripple 1.8s ease-out infinite;
}

@keyframes hover-ripple {
  0%   { inset: -3px; opacity: 0.45; border-color: rgba(140,200,220,0.35); }
  100% { inset: -18px; opacity: 0; border-color: rgba(140,200,220,0); }
}

/* ===== Card inner content ===== */
.card-category {
  font-size: 0.56rem;
  font-weight: 500;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  margin-bottom: 3px;
  opacity: 0.75;
}

.card-name {
  font-size: 0.72rem;
  font-weight: 700;
  line-height: 1.25;
  color: var(--text-primary);
  margin-bottom: 2px;
}

.card-type {
  font-size: 0.55rem;
  color: var(--text-muted);
  background: rgba(90, 130, 150, 0.08);
  padding: 1px 8px;
  border-radius: 20px;
}

/* ===== Overlay ===== */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.30s ease;
}

.overlay.active {
  pointer-events: auto;
  opacity: 1;
}

.overlay-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(8, 28, 40, 0.42);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

/* ===== Detail Card ===== */
.detail-card {
  position: relative;
  z-index: 1;
  width: 92vw;
  max-width: 960px;
  max-height: 85vh;
  overflow-y: auto;
  background: #fff;
  border-radius: var(--radius-detail);
  box-shadow: var(--shadow-pop);
}

.detail-card-inner {
  padding: 32px 36px 36px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: auto auto auto;
  gap: 0 36px;
}

.detail-card-inner .detail-header { grid-column: 1 / -1; margin-bottom: 18px; }
.detail-card-inner .detail-body { grid-column: 1; }
.detail-card-inner .detail-body-extras { grid-column: 2; }

.detail-card::-webkit-scrollbar { width: 5px; }
.detail-card::-webkit-scrollbar-track { background: transparent; margin: 16px 0; }
.detail-card::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.10); border-radius: 10px; }

.detail-header { margin-bottom: 24px; }

.detail-tags {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}

.tag {
  display: inline-block;
  font-size: 0.74rem;
  font-weight: 600;
  padding: 5px 14px;
  border-radius: 20px;
  letter-spacing: 0.03em;
}
.tag-category { background: #e3f2fd; color: #1e6fa0; }
.tag-type     { background: #e8f5e9; color: #2e7d32; }

.detail-name {
  font-size: 1.75rem;
  font-weight: 800;
  line-height: 1.25;
  color: #0d2137;
  letter-spacing: 0.02em;
  word-break: break-word;
}

.detail-body section { margin-bottom: 22px; }
.detail-body section:last-child { margin-bottom: 0; }

.detail-body h3 {
  font-size: 0.76rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: #889aaa;
  margin-bottom: 8px;
  padding-bottom: 4px;
  border-bottom: 1px solid #eef3f6;
}

.detail-body p {
  font-size: 0.94rem;
  line-height: 1.72;
  color: #334455;
}

.analogy-text {
  font-style: italic;
  color: #3a6070 !important;
  background: #f5f9fb;
  padding: 12px 16px;
  border-radius: 10px;
  border-left: 3px solid #b5d6e8;
}

.detail-body ul { list-style: none; padding: 0; }
.detail-body li {
  font-size: 0.91rem;
  line-height: 1.6;
  color: #445566;
  padding: 5px 0 5px 16px;
  position: relative;
}
.detail-body li::before {
  content: '•';
  position: absolute;
  left: 0;
  color: #99bbcc;
  font-weight: bold;
}
.counter-list li { color: #7a6a5a !important; }
.counter-list li::before {
  color: #d4b896 !important;
  content: '✗';
  font-size: 0.68rem;
}

.detail-source p { font-size: 0.84rem !important; color: #889aaa !important; }

.related-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.related-tag {
  display: inline-block;
  font-size: 0.80rem;
  padding: 6px 14px;
  border-radius: 20px;
  background: #f0f4f7;
  color: #556677;
  border: 1px solid #e0e8ee;
  cursor: default;
  transition: all 0.2s;
}

.related-tag.clickable {
  cursor: pointer;
  background: #e8f0f6;
  color: #2a6080;
  border-color: #c8dae8;
}
.related-tag.clickable:hover {
  background: #d0e4f2;
  border-color: #90c0d8;
  color: #1a4a66;
  transform: translateY(-1px);
}

/* ===== Close Button ===== */
.close-btn {
  position: fixed;
  top: 22px;
  right: 22px;
  z-index: 110;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: none;
  background: rgba(255, 255, 255, 0.82);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  box-shadow: 0 2px 12px rgba(0,0,0,0.10);
  font-size: 1.15rem;
  color: #556;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  opacity: 0;
  transform: scale(0.8);
  transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.close-btn.visible {
  pointer-events: auto;
  opacity: 1;
  transform: scale(1);
}

.close-btn:hover {
  background: #fff;
  box-shadow: 0 4px 16px rgba(0,0,0,0.16);
  transform: scale(1.08);
}

.close-btn:active { transform: scale(0.94); }

/* ===== Splash ===== */
.splash {
  position: fixed;
  pointer-events: none;
  z-index: 150;
  border-radius: 50%;
  border: 2px solid rgba(180, 210, 225, 0.45);
  background: radial-gradient(circle, rgba(190, 220, 235, 0.18) 0%, transparent 70%);
  transform: translate(-50%, -50%);
}

.splash.animate {
  animation: splash-expand 0.72s ease-out forwards;
}

@keyframes splash-expand {
  0%   { width: 16px; height: 16px; opacity: 0.75; }
  100% { width: 220px; height: 220px; opacity: 0; }
}

/* ========== CATEGORY NAV BAR ========== */
.cat-nav {
  position: sticky; top: 0; z-index: 60;
  background: rgba(255,255,255,0.72);
  backdrop-filter: blur(16px) saturate(1.3);
  -webkit-backdrop-filter: blur(16px) saturate(1.3);
  border-bottom: 1px solid rgba(180,210,225,0.35);
  padding: 5px 0;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.cat-nav::-webkit-scrollbar { height: 2px; }
.cat-nav::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.08); border-radius: 4px; }
.cat-nav-inner {
  display: flex; align-items: center; gap: 3px;
  padding: 0 10px; min-width: max-content;
}
.cat-nav-btn {
  font-family: var(--font-stack);
  font-size: 0.70rem; font-weight: 500;
  padding: 5px 10px; border-radius: 14px;
  border: 1px solid transparent;
  background: transparent; color: var(--text-muted);
  cursor: pointer; white-space: nowrap;
  transition: all 0.2s;
}
.cat-nav-btn:hover { background: rgba(0,0,0,0.04); color: var(--text-primary); }
.cat-nav-btn.active { background: #d8efe8; color: #2a6a5a; font-weight: 600; border-color: rgba(106,171,154,0.3); }

/* Timer */
.cat-nav-timer {
  display: flex; align-items: center; gap: 5px;
  margin-left: 12px; padding: 4px 10px;
  border-radius: 14px; border: 1px solid rgba(180,210,225,0.4);
  background: rgba(255,255,255,0.5); flex-shrink: 0;
}
.timer-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: #6aab9a; animation: timer-pulse 1s ease-in-out infinite;
}
@keyframes timer-pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.7); }
}
.timer-text { font-size: 0.7rem; font-weight: 600; color: #4a7a6a; font-variant-numeric: tabular-nums; }

/* Card highlight/dim for patterns and category filter */

<script src="data/concepts_all.js?v=4"></script>
<script>
(function() {
  'use strict';

  // ── Data ───────────────────────────────────────────────
  // ALL_CONCEPTS is defined as global const in data/concepts_all.js
  const CONCEPTS = (typeof ALL_CONCEPTS !== 'undefined') ? ALL_CONCEPTS : [];
  const conceptMap = Object.fromEntries(CONCEPTS.map(function(c) { return [c.name, c]; }));

  const GRID_COLS = 16;
  const TOTAL_CARDS = CONCEPTS.length; // 1192

  // ── Display Category sort order ───────────────────────
  const CATEGORY_SORT_ORDER = [
    '概念/思想', '人物', '方法/框架', '事件/运动', '理论/定律',
    '发明/技术', '经济/商业', '教育/社会', '时代/时期'
  ];
  const CATEGORY_RANK = {};
  CATEGORY_SORT_ORDER.forEach(function(cat, i) { CATEGORY_RANK[cat] = i; });

  // ── Display Category Colors (9 categories) ────────────
  const CATEGORY_COLORS = {
    '人物':     { bg: '#f5e0e8', dot: '#d47088' },
    '事件/运动': { bg: '#f5e8d4', dot: '#d49560' },
    '理论/定律': { bg: '#d8e4f0', dot: '#6a8eb8' },
    '方法/框架': { bg: '#d4efe4', dot: '#5a9a82' },
    '概念/思想': { bg: '#e8dcf0', dot: '#9a7ab8' },
    '发明/技术': { bg: '#d4e4f4', dot: '#5a80b0' },
    '经济/商业': { bg: '#f0ecd8', dot: '#c8a840' },
    '教育/社会': { bg: '#d8f0e8', dot: '#5aaa8a' },
    '时代/时期': { bg: '#f0d8e0', dot: '#c87080' }
  };

  function getCatColor(displayCat) {
    return CATEGORY_COLORS[displayCat] || { bg: '#e8e8e8', dot: '#999' };
  }

  // ── State ──────────────────────────────────────────────
  let activeConcept = null;
  let activeCardEl  = null;
  let isAnimating   = false;
  let currentPattern = -1; // 0-5
  let currentFilter  = '*'; // current category filter
  let sortedConcepts = []; // fixed sorted order

  const PATTERN_NAMES = [
    '金字塔 · Pyramid',
    'DNA 双螺旋 · DNA Helix',
    '脑网络 · Brain Network',
    '知识树 · Knowledge Tree',
    '同心涟漪 · Concentric Ripples',
    '思想标志 · THOUGHT'
  ];

  // ── DOM ────────────────────────────────────────────────
  const pool         = document.getElementById('pool');
  const overlay      = document.getElementById('overlay');
  const detailCard   = document.getElementById('detailCard');
  const detailInner  = document.getElementById('detailInner');
  const closeBtn     = document.getElementById('closeBtn');
  const legendPanel  = document.getElementById('legendPanel');
  const legendTitleBar = document.getElementById('legendTitleBar');

  // ── Helpers ────────────────────────────────────────────
  function escHtml(str) {
    if (!str) return '';
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function rowCol(index) {
    return { row: Math.floor(index / GRID_COLS), col: index % GRID_COLS };
  }

  // ═══════════════════════════════════════════════════════
  //  MOSAIC PATTERN GENERATORS (for 75×16 grid, 1192 cards)
  //  Each returns flat array mask[i] = display_category
  // ═══════════════════════════════════════════════════════

  const ROWS = Math.ceil(TOTAL_CARDS / GRID_COLS); // 75
  const CX = (GRID_COLS - 1) / 2; // 7.5
  const CY = (ROWS - 1) / 2;     // 37

  // All 9 categories in display order
  const ALL_CATS = CATEGORY_SORT_ORDER.slice();


  // Pattern 1: PYRAMID (triangle stacking, apex top center, base full width)
  function generatePyramidMask() {
    var mask = new Array(TOTAL_CARDS);
    for (var i = 0; i < TOTAL_CARDS; i++) {
      var rc = rowCol(i);
      var r = rc.row, c = rc.col;
      // Half-width grows from 1 at top to 7.5 at bottom
      var halfW = 1 + 7 * r / (ROWS - 1);
      var inside = Math.abs(c - CX) <= halfW;

      if (inside) {
        // Pyramid layers — assign categories that roughly align with card blocks
        var progress = r / (ROWS - 1);
        if (progress < 0.13) {
          mask[i] = ALL_CATS[(c + r) % 2 === 0 ? 4 : 2]; // 理论/定律, 概念/思想
        } else if (progress < 0.26) {
          mask[i] = ALL_CATS[(c + r) % 3 === 0 ? 4 : ((c + r) % 3 === 1 ? 3 : 2)]; // 概念/思想, 方法/框架, 理论/定律
        } else if (progress < 0.40) {
          mask[i] = ALL_CATS[(c + r) % 3 === 0 ? 3 : ((c + r) % 3 === 1 ? 4 : 0)]; // 方法/框架, 概念/思想, 人物
        } else if (progress < 0.53) {
          mask[i] = ALL_CATS[(c + r) % 3 === 0 ? 1 : ((c + r) % 3 === 1 ? 0 : 3)]; // 人物, 事件/运动, 方法/框架
        } else if (progress < 0.67) {
          mask[i] = ALL_CATS[(c + r) % 3 === 0 ? 1 : ((c + r) % 3 === 1 ? 4 : 5)]; // 事件/运动, 概念/思想, 发明/技术
        } else if (progress < 0.80) {
          mask[i] = ALL_CATS[(c + r) % 3 === 0 ? 5 : ((c + r) % 3 === 1 ? 2 : 6)]; // 发明/技术, 理论/定律, 经济/商业
        } else if (progress < 0.93) {
          mask[i] = ALL_CATS[(c + r) % 3 === 0 ? 6 : ((c + r) % 3 === 1 ? 7 : 1)]; // 经济/商业, 教育/社会, 事件/运动
        } else {
          mask[i] = ALL_CATS[(c + r) % 3 === 0 ? 7 : ((c + r) % 3 === 1 ? 8 : 6)]; // 教育/社会, 时代/时期, 经济/商业
        }
      } else {
        // Outside pyramid — use categories that DON'T match the card blocks at this row
        // Card blocks go top→bottom: 概念/思想→人物→方法/框架→事件/运动→理论/定律→发明/技术→经济/商业→教育/社会→时代/时期
        var cardBlockAtRow;
        if (r < 22) cardBlockAtRow = 0;           // 概念/思想
        else if (r < 35) cardBlockAtRow = 1;       // 人物
        else if (r < 48) cardBlockAtRow = 2;       // 方法/框架
        else if (r < 58) cardBlockAtRow = 3;       // 事件/运动
        else if (r < 66) cardBlockAtRow = 4;       // 理论/定律
        else if (r < 71) cardBlockAtRow = 5;       // 发明/技术
        else if (r < 74) cardBlockAtRow = 6;       // 经济/商业
        else cardBlockAtRow = 7;                    // 教育/社会 + 时代/时期

        // Pick a category offset from the card block (to create dimming)
        var offsetCat = (cardBlockAtRow + 3 + (c % 3)) % 9;
        mask[i] = ALL_CATS[offsetCat];
      }
    }
    return mask;
  }

  // Pattern 2: DNA DOUBLE HELIX (two sine waves, 3 cycles)
  function generateDNAHelixMask() {
    var mask = new Array(TOTAL_CARDS);
    var cycles = 3.5;
    for (var i = 0; i < TOTAL_CARDS; i++) {
      var rc = rowCol(i);
      var r = rc.row, c = rc.col;
      var phase = 2 * Math.PI * cycles * r / (ROWS - 1);
      var strand1X = CX + 6.5 * Math.sin(phase);
      var strand2X = CX + 6.5 * Math.sin(phase + Math.PI);

      var d1 = Math.abs(c - strand1X);
      var d2 = Math.abs(c - strand2X);
      var onS1 = d1 < 1.3;
      var onS2 = d2 < 1.3;

      var cardBlockAtRow;
      if (r < 22) cardBlockAtRow = 0;
      else if (r < 35) cardBlockAtRow = 1;
      else if (r < 48) cardBlockAtRow = 2;
      else if (r < 58) cardBlockAtRow = 3;
      else if (r < 66) cardBlockAtRow = 4;
      else if (r < 71) cardBlockAtRow = 5;
      else if (r < 74) cardBlockAtRow = 6;
      else cardBlockAtRow = 7;

      if (onS1 && onS2) {
        // Crossing point — use special categories
        mask[i] = ALL_CATS[(r % 3 === 0) ? 8 : 4]; // 时代/时期, 概念/思想
      } else if (onS1) {
        // Strand 1 — analytical/cool categories
        mask[i] = ALL_CATS[[2, 3, 5][(r + Math.floor(c)) % 3]]; // 理论/定律, 方法/框架, 发明/技术
      } else if (onS2) {
        // Strand 2 — humanistic/warm categories
        mask[i] = ALL_CATS[[0, 1, 7][(r + Math.floor(c)) % 3]]; // 人物, 事件/运动, 教育/社会
      } else {
        // Background — mismatch with card blocks
        var off = (cardBlockAtRow + 4 + (c % 2)) % 9;
        mask[i] = ALL_CATS[off];
      }

      // Add horizontal "base pair" rungs periodically
      if (r % 13 < 2) {
        var bridgeCenter = (strand1X + strand2X) / 2;
        if (Math.abs(c - bridgeCenter) < 1.5) {
          mask[i] = ALL_CATS[6]; // 经济/商业
        }
      }
    }
    return mask;
  }

  // Pattern 3: BRAIN NETWORK (neuron connection network, center out)
  function generateBrainMask() {
    var mask = new Array(TOTAL_CARDS);
    // Use a modified center — slightly higher for more visual balance
    var bcx = CX;
    var bcy = CY - 5;

    // Precompute neuron node positions
    var nodes = [];
    var nodeCount = 28;
    for (var ni = 0; ni < nodeCount; ni++) {
      var angle = (ni / nodeCount) * Math.PI * 2;
      var rad = 4 + (ni % 4) * 6 + Math.sin(ni * 3.7) * 3;
      var nx = bcx + Math.cos(angle) * rad;
      var ny = bcy + Math.sin(angle) * rad * 0.7;
      nodes.push({ x: nx, y: ny, cat: ALL_CATS[ni % 9] });
    }
    // Add a few more in the core
    for (var ci = 0; ci < 6; ci++) {
      var ca = ci * Math.PI / 3;
      var cr = 2 + ci * 0.5;
      nodes.push({ x: bcx + Math.cos(ca) * cr, y: bcy + Math.sin(ca) * cr * 0.7, cat: ALL_CATS[(ci * 2) % 9] });
    }

    for (var i = 0; i < TOTAL_CARDS; i++) {
      var rc = rowCol(i);
      var r = rc.row, c = rc.col;
      var dx = c - bcx;
      var dy = r - bcy;
      var dist = Math.sqrt(dx * dx + dy * dy);

      // Find nearest node
      var minDist = Infinity;
      var nearestCat = ALL_CATS[0];
      for (var ni2 = 0; ni2 < nodes.length; ni2++) {
        var ndx = c - nodes[ni2].x;
        var ndy = r - nodes[ni2].y;
        var nd = Math.sqrt(ndx * ndx + ndy * ndy);
        if (nd < minDist) { minDist = nd; nearestCat = nodes[ni2].cat; }
      }

      if (dist < 3) {
        // Core cluster
        mask[i] = ALL_CATS[(Math.floor(dist) + Math.floor(c + r)) % 3 === 0 ? 4 : 2]; // 概念/思想, 理论/定律
      } else if (dist < 8 && minDist < 2.5) {
        // Near a node — use its category
        mask[i] = nearestCat;
      } else if (dist < 15) {
        // Inner zone
        if (c < bcx) {
          mask[i] = ALL_CATS[[0, 3, 7][(r + c) % 3]]; // 人物, 方法/框架, 教育/社会
        } else {
          mask[i] = ALL_CATS[[1, 5, 6][(r + c) % 3]]; // 事件/运动, 发明/技术, 经济/商业
        }
      } else if (dist < 25) {
        // Middle zone
        mask[i] = ALL_CATS[(r + c) % 9];
      } else {
        // Outer — diffusion
        mask[i] = ALL_CATS[((Math.floor(dist) % 3) * 3 + (r % 3)) % 9];
      }

      // Draw connections between close nodes as thin lines
      for (var ci2 = 0; ci2 < nodes.length && minDist > 2.5; ci2++) {
        var n1 = nodes[ci2];
        for (var cj = ci2 + 1; cj < nodes.length; cj++) {
          var n2 = nodes[cj];
          var nd2 = Math.sqrt((n1.x - n2.x) * (n1.x - n2.x) + (n1.y - n2.y) * (n1.y - n2.y));
          if (nd2 < 10) {
            // Point-to-segment distance
            var t = ((c - n1.x) * (n2.x - n1.x) + (r - n1.y) * (n2.y - n1.y)) / (nd2 * nd2);
            t = Math.max(0, Math.min(1, t));
            var px = n1.x + t * (n2.x - n1.x);
            var py = n1.y + t * (n2.y - n1.y);
            var pdist = Math.sqrt((c - px) * (c - px) + (r - py) * (r - py));
            if (pdist < 0.7) {
              mask[i] = ALL_CATS[((ci2 + cj) % 9)];
            }
          }
        }
      }
    }
    return mask;
  }

  // Pattern 4: KNOWLEDGE TREE (trunk + branches + canopy)
  function generateKnowledgeTreeMask() {
    var mask = new Array(TOTAL_CARDS);
    var trunkCX = CX;
    var trunkTop = 44;
    var trunkBot = ROWS - 1;

    for (var i = 0; i < TOTAL_CARDS; i++) {
      var rc = rowCol(i);
      var r = rc.row, c = rc.col;

      // Trunk region (rows 44-74, narrow center)
      if (r >= trunkTop) {
        var trunkHalfW = 1.5 + (r - trunkTop) * 0.08; // slightly wider at bottom
        var inTrunk = Math.abs(c - trunkCX) <= trunkHalfW;

        if (r >= 70) {
          // Roots — spread outward
          var rootHalfW = trunkHalfW + (r - 70) * 0.4;
          var inRoot = Math.abs(c - trunkCX) <= rootHalfW;
          mask[i] = inRoot ? ALL_CATS[(c % 2 === 0) ? 3 : 7] : ALL_CATS[(c + r) % 2 === 0 ? 6 : 8];
        } else {
          // Trunk
          mask[i] = inTrunk ? ALL_CATS[(r % 2 === 0) ? 2 : 3] : ALL_CATS[(c + Math.floor(r/3)) % 2 === 0 ? 1 : 7];
        }
      }
      // Branch zone (rows 15-43)
      else if (r >= 15) {
        var branchProgress = (r - 15) / (trunkTop - 15); // 0 at top, 1 at trunk
        // Major branches: 2-3 main branches
        var mainBranchOffsets = [-4, 0, 4];
        var closestBranch = Infinity;
        var mainBranchIdx = -1;

        for (var bi = 0; bi < mainBranchOffsets.length; bi++) {
          // Branch curves from trunk top to upper spread
          var branchSpread = mainBranchOffsets[bi] * (1 - branchProgress) * 1.8;
          var branchX = trunkCX + branchSpread;
          // Branch width decreases upward
          var branchHW = 1.8 - branchProgress * 1.0;
          var distToBranch = Math.abs(c - branchX);
          if (distToBranch < closestBranch) {
            closestBranch = distToBranch;
            mainBranchIdx = bi;
          }
        }

        if (closestBranch < 2.0) {
          // On a branch
          mask[i] = ALL_CATS[(mainBranchIdx + (r % 3)) % 3 === 0 ? 4 : ((mainBranchIdx + (r % 3)) % 3 === 1 ? 5 : 0)];
        } else {
          // Between branches — secondary branches
          var secondaryX = trunkCX + Math.sin(r * 0.8 + c * 0.3) * (8 * (1 - branchProgress));
          var secDist = Math.abs(c - secondaryX);
          mask[i] = secDist < 1.0 ? ALL_CATS[((r + c) % 9)] : ALL_CATS[(Math.floor(r/4) + 3 + c % 3) % 9];
        }
      }
      // Canopy (rows 0-14)
      else {
        var canopyProgress = r / 14; // 0 at top, 1 at branch start
        var canopyHW = 6 + canopyProgress * 4;
        var inCanopy = Math.abs(c - trunkCX) < canopyHW;

        if (inCanopy) {
          // Leaves — mix of categories
          mask[i] = ALL_CATS[[0, 1, 4, 5, 7, 8][(r + c) % 6]];
        } else {
          // Sky above canopy
          var skyCats = [1, 6, 8];
          mask[i] = ALL_CATS[skyCats[(r + c) % 3]];
        }
      }
    }
    return mask;
  }

  // Pattern 5: CONCENTRIC RIPPLES (Chebyshev distance rings)
  function generateConcentricRipplesMask() {
    var mask = new Array(TOTAL_CARDS);
    var rcx = CX;
    var rcy = CY + 2;

    // Define ring categories
    var rings = [
      { dist: 1.5,  cats: [ALL_CATS[4]] },                              // center: 概念/思想
      { dist: 3.5,  cats: [ALL_CATS[4], ALL_CATS[2]] },                  // 概念/思想, 理论/定律
      { dist: 6.5,  cats: [ALL_CATS[2], ALL_CATS[3]] },                  // 理论/定律, 方法/框架
      { dist: 9.5,  cats: [ALL_CATS[3], ALL_CATS[0]] },                  // 方法/框架, 人物
      { dist: 13,   cats: [ALL_CATS[0], ALL_CATS[1], ALL_CATS[5]] },     // 人物, 事件/运动, 发明/技术
      { dist: 17,   cats: [ALL_CATS[1], ALL_CATS[5], ALL_CATS[6]] },     // 事件/运动, 发明/技术, 经济/商业
      { dist: 21,   cats: [ALL_CATS[5], ALL_CATS[6], ALL_CATS[7]] },     // 发明/技术, 经济/商业, 教育/社会
      { dist: 26,   cats: [ALL_CATS[6], ALL_CATS[7], ALL_CATS[8]] },     // 经济/商业, 教育/社会, 时代/时期
      { dist: 32,   cats: ALL_CATS.slice() },                             // all
      { dist: 99,   cats: [ALL_CATS[4], ALL_CATS[0], ALL_CATS[2]] }      // far: 概念/思想, 人物, 理论/定律
    ];

    for (var i = 0; i < TOTAL_CARDS; i++) {
      var rc = rowCol(i);
      var r = rc.row, c = rc.col;
      var chebDist = Math.max(Math.abs(r - rcy), Math.abs(c - rcx));

      var assigned = ALL_CATS[0];
      for (var ri = 0; ri < rings.length; ri++) {
        if (chebDist <= rings[ri].dist + 0.3) {
          var ringCats = rings[ri].cats;
          assigned = ringCats[(r + c) % ringCats.length];
          break;
        }
      }
      mask[i] = assigned;
    }
    return mask;
  }

  // Pattern 6: THOUGHT VERTICAL — large letters stacked top to bottom
  function generateThoughtOSMask() {
    var mask = new Array(TOTAL_CARDS);

    // Background — mismatched categories for contrast
    for (var i = 0; i < TOTAL_CARDS; i++) {
      var rc = rowCol(i);
      var r = rc.row, c = rc.col;
      var blockIdx;
      if (r < 22) blockIdx = 0;
      else if (r < 35) blockIdx = 1;
      else if (r < 48) blockIdx = 2;
      else if (r < 58) blockIdx = 3;
      else if (r < 66) blockIdx = 4;
      else if (r < 71) blockIdx = 5;
      else if (r < 74) blockIdx = 6;
      else blockIdx = 7;
      mask[i] = ALL_CATS[(blockIdx + 4 + (c % 3)) % 9];
    }

    // Letter helper — returns true if cell (lr, lc) is part of the letter shape
    // lr: 0 to h-1, lc: 0 to w-1
    function isLetterPixel(letter, lr, lc, w, h) {
      var midCol = Math.floor(w / 2);
      var midRow = Math.floor(h / 2);

      switch (letter) {
        case 'T':
          // Top bar
          if (lr === 0) return lc >= 1 && lc <= w - 2;
          // Vertical stem
          return lc === midCol || (w % 2 === 0 && lc === midCol - 1);
        case 'H':
          // Left stem
          if (lc === 0 || lc === 1) return true;
          // Right stem
          if (lc === w - 1 || lc === w - 2) return true;
          // Crossbar
          if (lr === midRow || lr === midRow + 1) return lc > 1 && lc < w - 2;
          return false;
        case 'O':
          // Top and bottom edges
          if (lr === 0 || lr === h - 1) return lc > 0 && lc < w - 1;
          // Left and right edges
          return lc === 0 || lc === w - 1;
        case 'U':
          // Left edge
          if (lc === 0 || lc === 1) return lr < h - 2;
          // Right edge
          if (lc === w - 1 || lc === w - 2) return lr < h - 2;
          // Bottom
          if (lr >= h - 2) return lc > 1 && lc < w - 2;
          return false;
        case 'G':
          // Like C with a crossbar
          if (lc === 0 || lc === 1) return lr > 0 && lr < h - 1;
          if (lr === 0) return lc > 1;
          if (lr === h - 1) return lc > 1 && lc < w - 1;
          // Crossbar
          if (lr >= midRow && lr <= midRow + 1) return lc >= midCol;
          // Right edge lower half
          if ((lc === w - 1 || lc === w - 2) && lr >= midRow) return true;
          return false;
        default:
          return false;
      }
    }

    // Vertical THOUGHT: 7 letters, each 9 rows × 12 cols, stacked vertically
    var letterHeight = 9;
    var letterWidth = 12;
    var letterPadTop = 1;
    var totalLetterH = letterHeight + letterPadTop;
    var startRow = 6;
    var letterColStart = Math.floor((GRID_COLS - letterWidth) / 2); // center horizontally

    var word = 'THOUGHT';
    // Each letter gets a distinct category — use different ones from those nearby in card order
    var letterColors = [ALL_CATS[0], ALL_CATS[3], ALL_CATS[2], ALL_CATS[5], ALL_CATS[4], ALL_CATS[1], ALL_CATS[7]];

    for (var li = 0; li < word.length; li++) {
      var ch = word[li];
      var baseRow = startRow + li * totalLetterH;

      for (var lr = 0; lr < letterHeight; lr++) {
        for (var lc = 0; lc < letterWidth; lc++) {
          if (isLetterPixel(ch, lr, lc, letterWidth, letterHeight)) {
            var gr = baseRow + lr;
            var gc = letterColStart + lc;
            if (gr >= 0 && gr < ROWS && gc >= 0 && gc < GRID_COLS) {
              var gi = gr * GRID_COLS + gc;
              if (gi < TOTAL_CARDS) {
                mask[gi] = letterColors[li];
              }
            }
          }
        }
      }
    }

    // Decorative horizontal bands between letters
    for (var li2 = 0; li2 < word.length - 1; li2++) {
      var bandRow = startRow + li2 * totalLetterH + letterHeight;
      for (var bc = 0; bc < GRID_COLS; bc++) {
        var bi = bandRow * GRID_COLS + bc;
        if (bi < TOTAL_CARDS) {
          mask[bi] = ALL_CATS[8]; // 时代/时期
        }
      }
    }

    return mask;
  }

  // ═══════════════════════════════════════════════════════
  //  PATTERN DISPATCHER — deterministic mask for each pattern
  // ═══════════════════════════════════════════════════════

  // Cache masks (seeded by pattern index)
  var maskCache = {};

  function getMask(patternIndex) {
    if (maskCache[patternIndex]) return maskCache[patternIndex];
    // Use a deterministic seed per pattern for reproducibility
    var savedRandom = Math.random;
    var seed = patternIndex * 137 + 42;
    Math.random = function() {
      seed = (seed * 16807 + 0) % 2147483647;
      return (seed - 1) / 2147483646;
    };
    var mask;
    switch (patternIndex) {
      case 0: mask = generatePyramidMask(); break;
      case 1: mask = generateDNAHelixMask(); break;
      case 2: mask = generateBrainMask(); break;
      case 3: mask = generateKnowledgeTreeMask(); break;
      case 4: mask = generateConcentricRipplesMask(); break;
      case 5: mask = generateThoughtOSMask(); break;
      default: mask = generatePyramidMask();
    }
    Math.random = savedRandom;
    maskCache[patternIndex] = mask;
    return mask;
  }

  // ═══════════════════════════════════════════════════════
  //  SORT CONCEPTS — fixed order by display_category blocks
  // ═══════════════════════════════════════════════════════

  function sortConcepts() {
    var sorted = CONCEPTS.slice();
    sorted.sort(function(a, b) {
      var rankA = CATEGORY_RANK[a.display_category] != null ? CATEGORY_RANK[a.display_category] : 99;
      var rankB = CATEGORY_RANK[b.display_category] != null ? CATEGORY_RANK[b.display_category] : 99;
      if (rankA !== rankB) return rankA - rankB;
      // Within same category, sort by name
      return (a.name || '').localeCompare(b.name || '', 'zh');
    });
    return sorted;
  }

  // ═══════════════════════════════════════════════════════
  //  RENDER — one-time, all cards
  // ═══════════════════════════════════════════════════════

  function renderAllCards() {
    pool.innerHTML = '';
    sortedConcepts = sortConcepts();

    var fragment = document.createDocumentFragment();

    sortedConcepts.forEach(function(concept, i) {
      var catColor = getCatColor(concept.display_category);

      var card = document.createElement('div');
      card.className = 'card';
      card.dataset.conceptId = concept.id;
      card.dataset.displayCategory = concept.display_category;
      card.dataset.gridIndex = i;
      card.style.setProperty('--card-bg', catColor.bg);

      card.innerHTML =
        '<span class="card-category">' + escHtml(concept.display_category) + '</span>' +
        '<h3 class="card-name">' + escHtml(concept.name) + '</h3>' +
        '<span class="card-type">' + escHtml(concept.type) + '</span>';

      card.addEventListener('click', function(e) {
        e.stopPropagation();
        if (isAnimating) return;
        if (activeConcept && activeConcept.id === concept.id) return;
        openCard(concept, card);
      });

      fragment.appendChild(card);
    });

    pool.appendChild(fragment);
  }

  // ═══════════════════════════════════════════════════════
  //  APPLY PATTERN — CSS class changes only, no DOM rebuild
  // ═══════════════════════════════════════════════════════

  function applyPattern(patternIndex) {
    var mask = getMask(patternIndex);
    var cards = pool.querySelectorAll('.card');

    cards.forEach(function(card) {
      var idx = parseInt(card.dataset.gridIndex, 10);
      var cardCat = card.dataset.displayCategory;
      var maskCat = mask[idx];

      if (maskCat && cardCat === maskCat) {
        card.classList.add('highlighted');
        card.classList.remove('dimmed');
      } else {
        card.classList.add('dimmed');
        card.classList.remove('highlighted');
      }
    });
  }

  function clearPatternClasses() {
    var cards = pool.querySelectorAll('.card');
    cards.forEach(function(card) {
      card.classList.remove('highlighted', 'dimmed');
    });
  }

  // ═══════════════════════════════════════════════════════
  //  RENDER LEGEND
  // ═══════════════════════════════════════════════════════

  function renderLegend() {
    var cats = {};
    CONCEPTS.forEach(function(c) {
      if (!c || !c.display_category) return;
      cats[c.display_category] = (cats[c.display_category] || 0) + 1;
    });

    // Sort by display order
    var sorted = CATEGORY_SORT_ORDER.filter(function(cat) { return cats[cat]; }).map(function(cat) {
      return [cat, cats[cat]];
    });

    var html = '';
    sorted.forEach(function(pair) {
      var catColor = getCatColor(pair[0]);
      html += '<span class="legend-cat-item">' +
        '<span class="legend-cat-dot" style="background:' + catColor.dot + ';"></span>' +
        '<span class="legend-cat-name">' + escHtml(pair[0]) + '</span>' +
        '<span class="legend-cat-num">' + pair[1] + '</span>' +
        '</span>';
    });
    document.getElementById('legendCats').innerHTML = html;
    document.getElementById('legendTotal').textContent = CONCEPTS.length;
    document.getElementById('legendCatCount').textContent = sorted.length;
    document.getElementById('legendPatternBadge').textContent =
      '马赛克 · ' + PATTERN_NAMES[currentPattern];
  }

  // ═══════════════════════════════════════════════════════
  //  LEGEND DRAGGING (Pointer Events)
  // ═══════════════════════════════════════════════════════

  (function initLegendDrag() {
    var isDragging = false;
    var startX, startY, startLeft, startTop;
    var initialRight, initialTop;
    var wasPositioned = false;

    function onPointerDown(e) {
      if (e.target.closest('.legend-cats') || e.target.closest('.legend-subtitle') ||
          e.target.closest('.legend-divider') || e.target.closest('.legend-pattern-badge')) {
        return;
      }
      isDragging = true;
      legendPanel.classList.add('dragging');
      legendPanel.setPointerCapture(e.pointerId);

      var rect = legendPanel.getBoundingClientRect();
      startX = e.clientX;
      startY = e.clientY;

      if (!wasPositioned) {
        // First drag — switch from right/top to left/top
        legendPanel.style.right = 'auto';
        legendPanel.style.left = rect.left + 'px';
        legendPanel.style.top = rect.top + 'px';
        wasPositioned = true;
      }

      startLeft = parseFloat(legendPanel.style.left) || rect.left;
      startTop = parseFloat(legendPanel.style.top) || rect.top;

      e.preventDefault();
    }

    function onPointerMove(e) {
      if (!isDragging) return;
      var dx = e.clientX - startX;
      var dy = e.clientY - startY;
      var newLeft = startLeft + dx;
      var newTop = startTop + dy;

      var maxLeft = window.innerWidth - legendPanel.offsetWidth - 8;
      var maxTop = window.innerHeight - legendPanel.offsetHeight - 8;
      newLeft = Math.max(8, Math.min(newLeft, maxLeft));
      newTop = Math.max(50, Math.min(newTop, maxTop));

      legendPanel.style.left = newLeft + 'px';
      legendPanel.style.top = newTop + 'px';
    }

    function onPointerUp(e) {
      if (!isDragging) return;
      isDragging = false;
      legendPanel.classList.remove('dragging');
      legendPanel.releasePointerCapture(e.pointerId);
    }

    legendTitleBar.addEventListener('pointerdown', onPointerDown);
    document.addEventListener('pointermove', onPointerMove);
    document.addEventListener('pointerup', onPointerUp);
    document.addEventListener('pointercancel', onPointerUp);
  })();

  // ═══════════════════════════════════════════════════════
  //  DETAIL VIEW & FLIP ANIMATION
  // ═══════════════════════════════════════════════════════

  function renderDetail(concept) {
    var relatedHtml = (concept.related_concepts || []).map(function(rc) {
      var exists = rc in conceptMap;
      return '<span class="related-tag' + (exists ? ' clickable' : '') + '"' +
             ' data-concept-name="' + escHtml(rc) + '"' +
             (exists ? ' tabindex="0" role="button"' : '') + '>' +
             escHtml(rc) + '</span>';
    }).join('');

    var counterHtml = '';
    if (concept.counter_examples && concept.counter_examples.length) {
      counterHtml =
        '<section>' +
        '<h3>反例 / 常见误解</h3>' +
        '<ul class="counter-list">' +
        concept.counter_examples.map(function(e) { return '<li>' + escHtml(e) + '</li>'; }).join('') +
        '</ul>' +
        '</section>';
    }

    var sourceInfo = '';
    if (concept.source) {
      sourceInfo = (concept.source.course || '') + (concept.source.letter ? ' · ' + concept.source.letter : '');
    }

    detailInner.innerHTML =
      '<div class="detail-header">' +
        '<div class="detail-tags">' +
          '<span class="tag tag-category">' + escHtml(concept.display_category) + '</span>' +
          '<span class="tag tag-type">' + escHtml(concept.type) + '</span>' +
        '</div>' +
        '<h1 class="detail-name">' + escHtml(concept.name) + '</h1>' +
      '</div>' +
      '<div class="detail-body">' +
        '<section>' +
          '<h3>定义</h3>' +
          '<p>' + escHtml(concept.definition) + '</p>' +
        '</section>' +
        '<section>' +
          '<h3>类比</h3>' +
          '<p class="analogy-text">' + escHtml(concept.analogy) + '</p>' +
        '</section>' +
      '</div>' +
      '<div class="detail-body-extras">' +
        '<section>' +
          '<h3>事例</h3>' +
          '<ul>' + (concept.examples || []).map(function(e) { return '<li>' + escHtml(e) + '</li>'; }).join('') + '</ul>' +
        '</section>' +
        counterHtml +
        (sourceInfo ? '<section class="detail-source"><h3>来源</h3><p>' + escHtml(sourceInfo) + '</p></section>' : '') +
        '<section>' +
          '<h3>关联概念</h3>' +
          '<div class="related-tags">' + relatedHtml + '</div>' +
        '</section>' +
      '</div>';

    var clickables = detailInner.querySelectorAll('.related-tag.clickable');
    clickables.forEach(function(tag) {
      tag.addEventListener('click', function(e) {
        e.stopPropagation();
        var name = tag.dataset.conceptName;
        var target = conceptMap[name];
        if (target) switchToConcept(target);
      });
    });

    detailCard.scrollTop = 0;
  }

  function openCard(concept, cardEl) {
    if (activeConcept) {
      closeCardInstant();
    }

    isAnimating = true;

    var cardRect = cardEl.getBoundingClientRect();
    var vw = window.innerWidth;
    var vh = window.innerHeight;
    var cx = vw / 2;
    var cy = vh / 2;
    var cardCX = cardRect.left + cardRect.width / 2;
    var cardCY = cardRect.top + cardRect.height / 2;
    var dx = cardCX - cx;
    var dy = cardCY - cy;
    var detailW = Math.min(560, vw * 0.92);
    var scaleFrom = Math.min(cardRect.width / detailW, 0.42);

    renderDetail(concept);

    detailCard.style.transition = 'none';
    detailCard.style.transform = 'translate(' + dx + 'px, ' + dy + 'px) scale(' + scaleFrom + ')';
    detailCard.style.opacity = '0.55';

    overlay.classList.add('active');
    closeBtn.classList.add('visible');
    document.body.classList.add('overlay-open');

    createSplash(cardCX, cardCY);

    detailCard.offsetHeight;

    detailCard.style.transition =
      'transform 380ms cubic-bezier(0.22, 0.98, 0.36, 1.02), opacity 300ms ease-out';
    detailCard.style.transform = 'translate(0, 0) scale(1)';
    detailCard.style.opacity = '1';

    cardEl.classList.add('retrieved');
    activeConcept = concept;
    activeCardEl  = cardEl;

    setTimeout(function() { isAnimating = false; }, 400);
  }

  function closeCard(instant) {
    if (!activeConcept) return;

    if (instant) {
      closeCardInstant();
      return;
    }

    isAnimating = true;

    var cardEl   = activeCardEl;
    var cardRect = cardEl.getBoundingClientRect();
    var vw = window.innerWidth;
    var vh = window.innerHeight;
    var cx = vw / 2;
    var cy = vh / 2;
    var cardCX = cardRect.left + cardRect.width / 2;
    var cardCY = cardRect.top + cardRect.height / 2;
    var dx = cardCX - cx;
    var dy = cardCY - cy;
    var detailW = Math.min(560, vw * 0.92);
    var scaleTo = Math.min(cardRect.width / detailW, 0.42);

    detailCard.style.transition =
      'transform 280ms cubic-bezier(0.4, 0, 0.6, 1), opacity 220ms ease-in';
    detailCard.style.transform = 'translate(' + dx + 'px, ' + dy + 'px) scale(' + scaleTo + ')';
    detailCard.style.opacity = '0.35';

    overlay.style.transition = 'opacity 280ms ease';
    overlay.style.opacity = '0';

    createSplash(cardCX, cardCY);

    var el = activeCardEl;
    setTimeout(function() {
      overlay.classList.remove('active');
      overlay.style.transition = '';
      overlay.style.opacity = '';
      closeBtn.classList.remove('visible');
      document.body.classList.remove('overlay-open');
      detailCard.style.transition = 'none';
      detailCard.style.transform = '';
      detailCard.style.opacity = '';
      el.classList.remove('retrieved');
      activeConcept = null;
      activeCardEl  = null;
      isAnimating = false;
    }, 300);
  }

  function closeCardInstant() {
    overlay.classList.remove('active');
    overlay.style.transition = '';
    overlay.style.opacity = '';
    closeBtn.classList.remove('visible');
    document.body.classList.remove('overlay-open');
    detailCard.style.transition = 'none';
    detailCard.style.transform = '';
    detailCard.style.opacity = '';
    if (activeCardEl) activeCardEl.classList.remove('retrieved');
    activeConcept = null;
    activeCardEl  = null;
    isAnimating = false;
  }

  function switchToConcept(concept) {
    if (isAnimating) return;
    isAnimating = true;

    var newCardEl = pool.querySelector('[data-concept-id="' + concept.id + '"]');

    detailCard.style.transition = 'transform 160ms ease-in, opacity 120ms ease-in';
    detailCard.style.transform = 'scale(0.92)';
    detailCard.style.opacity = '0.25';

    setTimeout(function() {
      renderDetail(concept);
      detailCard.scrollTop = 0;

      if (activeCardEl) activeCardEl.classList.remove('retrieved');
      if (newCardEl) newCardEl.classList.add('retrieved');

      activeConcept = concept;
      activeCardEl  = newCardEl;

      detailCard.style.transition =
        'transform 220ms cubic-bezier(0.34, 1.56, 0.64, 1), opacity 200ms ease-out';
      detailCard.style.transform = 'scale(1)';
      detailCard.style.opacity = '1';

      setTimeout(function() { isAnimating = false; }, 250);
    }, 170);
  }

  function createSplash(x, y) {
    var splash = document.createElement('div');
    splash.className = 'splash';
    splash.style.left = x + 'px';
    splash.style.top  = y + 'px';
    document.body.appendChild(splash);

    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        splash.classList.add('animate');
      });
    });

    splash.addEventListener('animationend', function() { splash.remove(); });
    setTimeout(function() { if (splash.parentNode) splash.remove(); }, 800);
  }

  // ═══════════════════════════════════════════════════════
  //  EVENTS
  // ═══════════════════════════════════════════════════════

  closeBtn.addEventListener('click', function() { closeCard(false); });

  overlay.addEventListener('click', function(e) {
    if (e.target === overlay || e.target.classList.contains('overlay-backdrop')) {
      closeCard(false);
    }
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && activeConcept && !isAnimating) {
      closeCard(false);
    }
  });

  var resizeTimer;
  window.addEventListener('resize', function() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function() {
      if (activeConcept) closeCardInstant();
      // Re-apply current pattern (no DOM rebuild needed)
      if (currentPattern >= 0) {
        applyPattern(currentPattern);
      }
    }, 400);
  });

  // ═══════════════════════════════════════════════════════
  //  CATEGORY FILTER
  // ═══════════════════════════════════════════════════════

  function filterCategory(cat, btn) {
    currentFilter = cat;

    // Update active button
    document.querySelectorAll('.cat-nav-btn').forEach(function(b) { b.classList.remove('active'); });
    if (btn) btn.classList.add('active');

    var cards = pool.querySelectorAll('.card');
    if (cat === '*') {
      // Show all — re-apply current pattern
      cards.forEach(function(c) { c.classList.remove('dimmed', 'highlighted'); });
      if (currentPattern >= 0) {
        applyPattern(currentPattern);
      }
      return;
    }

    // Filter by display_category
    cards.forEach(function(c) {
      if (c.dataset.displayCategory === cat) {
        c.classList.add('highlighted');
        c.classList.remove('dimmed');
      } else {
        c.classList.add('dimmed');
        c.classList.remove('highlighted');
      }
    });

    // Scroll to first highlighted
    var first = pool.querySelector('.card.highlighted');
    if (first) {
      first.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }
  window.filterCategory = filterCategory;

  // ═══════════════════════════════════════════════════════
  //  MOUSE RIPPLE TRAIL
  // ═══════════════════════════════════════════════════════

  (function() {
    var rippleCanvas = document.getElementById('rippleCanvas');
    var rctx = rippleCanvas.getContext('2d');
    var ripples = [];
    var mouseX = -100, mouseY = -100;
    var lastRippleTime = 0;

    function resizeRipple() {
      rippleCanvas.width = window.innerWidth;
      rippleCanvas.height = window.innerHeight;
    }
    resizeRipple();
    window.addEventListener('resize', resizeRipple);

    document.addEventListener('mousemove', function(e) {
      mouseX = e.clientX;
      mouseY = e.clientY;
      var now = Date.now();
      if (now - lastRippleTime > 40) {
        ripples.push({ x: mouseX, y: mouseY, r: 0, opacity: 0.55, life: 1 });
        lastRippleTime = now;
        if (ripples.length > 60) ripples.shift();
      }
    });

    document.addEventListener('mouseleave', function() {
      mouseX = -100;
      mouseY = -100;
    });

    function drawRipples() {
      rctx.clearRect(0, 0, rippleCanvas.width, rippleCanvas.height);

      if (mouseX > 0 && mouseY > 0) {
        var glow = rctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, 140);
        glow.addColorStop(0, 'rgba(180, 220, 240, 0.34)');
        glow.addColorStop(0.3, 'rgba(155, 215, 235, 0.20)');
        glow.addColorStop(0.6, 'rgba(140, 200, 225, 0.08)');
        glow.addColorStop(1, 'rgba(140, 200, 225, 0)');
        rctx.fillStyle = glow;
        rctx.beginPath();
        rctx.arc(mouseX, mouseY, 140, 0, Math.PI * 2);
        rctx.fill();

        var coreGlow = rctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, 40);
        coreGlow.addColorStop(0, 'rgba(210, 240, 250, 0.40)');
        coreGlow.addColorStop(0.5, 'rgba(180, 225, 240, 0.15)');
        coreGlow.addColorStop(1, 'rgba(150, 210, 230, 0)');
        rctx.fillStyle = coreGlow;
        rctx.beginPath();
        rctx.arc(mouseX, mouseY, 40, 0, Math.PI * 2);
        rctx.fill();
      }

      for (var i = ripples.length - 1; i >= 0; i--) {
        var r = ripples[i];
        r.r += 1.5;
        r.life -= 0.010;
        r.opacity = r.life * 0.55;
        if (r.life <= 0) { ripples.splice(i, 1); continue; }

        rctx.beginPath();
        rctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
        rctx.strokeStyle = 'rgba(150, 210, 235,' + (r.opacity * 0.7) + ')';
        rctx.lineWidth = 1.6;
        rctx.stroke();

        rctx.beginPath();
        rctx.arc(r.x, r.y, r.r * 0.55, 0, Math.PI * 2);
        rctx.strokeStyle = 'rgba(180, 220, 240,' + (r.opacity * 0.5) + ')';
        rctx.lineWidth = 1.0;
        rctx.stroke();

        rctx.beginPath();
        rctx.arc(r.x, r.y, r.r * 1.4, 0, Math.PI * 2);
        rctx.strokeStyle = 'rgba(170, 215, 235,' + (r.opacity * 0.25) + ')';
        rctx.lineWidth = 0.7;
        rctx.stroke();
      }

      requestAnimationFrame(drawRipples);
    }
    drawRipples();
  })();

  // ═══════════════════════════════════════════════════════
  //  RAINDROP SYSTEM
  // ═══════════════════════════════════════════════════════

  (function() {
    var container = document.getElementById('raindropContainer');
    var maxDrops = 8;
    var activeDrops = 0;

    function createRaindrop() {
      if (activeDrops >= maxDrops) return;
      activeDrops++;

      var x = Math.random() * window.innerWidth;
      var surfaceY = window.innerHeight * (0.4 + Math.random() * 0.45);

      var drop = document.createElement('div');
      drop.className = 'raindrop falling';
      drop.style.left = x + 'px';
      drop.style.top = '-12px';
      drop.style.setProperty('--fall-distance', surfaceY + 'px');
      drop.style.setProperty('--fall-duration', (0.45 + Math.random() * 0.35) + 's');
      drop.dataset.surfaceY = surfaceY;
      drop.dataset.dropX = x;
      container.appendChild(drop);

      drop.addEventListener('animationend', function() {
        drop.remove();
        createRainRipple(parseFloat(drop.dataset.dropX), parseFloat(drop.dataset.surfaceY));
        activeDrops--;
      });

      var dur = parseFloat(drop.style.getPropertyValue('--fall-duration')) * 1000 + 200;
      setTimeout(function() {
        if (drop.parentNode) {
          createRainRipple(parseFloat(drop.dataset.dropX), parseFloat(drop.dataset.surfaceY));
          drop.remove();
          activeDrops--;
        }
      }, dur);
    }

    function createRainRipple(x, y) {
      var ripple = document.createElement('div');
      ripple.className = 'rain-ripple animating';
      ripple.style.left = x + 'px';
      ripple.style.top = y + 'px';
      document.body.appendChild(ripple);

      ripple.addEventListener('animationend', function() { ripple.remove(); });
      setTimeout(function() { if (ripple.parentNode) ripple.remove(); }, 1800);
    }

    function scheduleNext() {
      var delay = 1200 + Math.random() * 2200;
      setTimeout(function() {
        createRaindrop();
        scheduleNext();
      }, delay);
    }

    setTimeout(function() { createRaindrop(); }, 400);
    setTimeout(function() { createRaindrop(); }, 900);
    scheduleNext();
  })();

  // ═══════════════════════════════════════════════════════
  //  BUBBLE SYSTEM
  // ═══════════════════════════════════════════════════════

  (function() {
    var container = document.getElementById('bubbleContainer');
    var bubbleCount = 18;

    for (var i = 0; i < bubbleCount; i++) {
      var bubble = document.createElement('div');
      bubble.className = 'bubble';
      var size = 4 + Math.random() * 14;
      bubble.style.width = size + 'px';
      bubble.style.height = size + 'px';
      bubble.style.left = (Math.random() * 94) + '%';
      bubble.style.setProperty('--bubble-dur', (6 + Math.random() * 12) + 's');
      bubble.style.setProperty('--bubble-delay', (Math.random() * 14) + 's');
      bubble.style.setProperty('--wobble-1', ((Math.random() - 0.5) * 20) + 'px');
      bubble.style.setProperty('--wobble-2', ((Math.random() - 0.5) * 16) + 'px');
      bubble.style.setProperty('--wobble-3', ((Math.random() - 0.5) * 12) + 'px');
      container.appendChild(bubble);
    }
  })();

  // ═══════════════════════════════════════════════════════
  //  SEAWEED SILHOUETTES
  // ═══════════════════════════════════════════════════════

  (function() {
    var container = document.getElementById('seaweedContainer');
    var seaweedDefs = [
      { x: '5%', w: 20, h: 90, swayDur: '6s', swayDelay: '0s', opacity: 0.10 },
      { x: '14%', w: 14, h: 70, swayDur: '7.5s', swayDelay: '-2s', opacity: 0.08 },
      { x: '22%', w: 24, h: 110, swayDur: '5.5s', swayDelay: '-4s', opacity: 0.11 },
      { x: '35%', w: 16, h: 60, swayDur: '8s', swayDelay: '-1s', opacity: 0.07 },
      { x: '48%', w: 18, h: 85, swayDur: '6.5s', swayDelay: '-3s', opacity: 0.10 },
      { x: '60%', w: 22, h: 100, swayDur: '7s', swayDelay: '-5s', opacity: 0.09 },
      { x: '72%', w: 15, h: 75, swayDur: '5.8s', swayDelay: '-2.5s', opacity: 0.08 },
      { x: '82%', w: 20, h: 95, swayDur: '6.8s', swayDelay: '-1.5s', opacity: 0.10 },
      { x: '92%', w: 12, h: 55, swayDur: '7.2s', swayDelay: '-3.5s', opacity: 0.07 },
    ];

    seaweedDefs.forEach(function(def) {
      var weed = document.createElement('div');
      weed.className = 'seaweed';
      weed.style.left = def.x;
      weed.style.setProperty('--sway-dur', def.swayDur);
      weed.style.setProperty('--sway-delay', def.swayDelay);
      weed.style.opacity = def.opacity;

      var svg = '<svg width="' + (def.w * 2) + '" height="' + def.h + '" viewBox="0 0 ' + (def.w * 2) + ' ' + def.h + '">' +
        '<ellipse cx="' + def.w + '" cy="' + (def.h * 0.85) + '" rx="' + (def.w * 0.25) + '" ry="' + (def.h * 0.8) + '" fill="#5a8a6a" opacity="0.6"/>' +
        '<ellipse cx="' + (def.w * 0.65) + '" cy="' + (def.h * 0.75) + '" rx="' + (def.w * 0.18) + '" ry="' + (def.h * 0.6) + '" fill="#4a7a5a" opacity="0.5"/>' +
        '<ellipse cx="' + (def.w * 1.35) + '" cy="' + (def.h * 0.8) + '" rx="' + (def.w * 0.2) + '" ry="' + (def.h * 0.7) + '" fill="#5a8a6a" opacity="0.5"/>' +
        '</svg>';
      weed.innerHTML = svg;
      container.appendChild(weed);
    });
  })();

  // ═══════════════════════════════════════════════════════
  //  AUTO-ROTATION TIMER (60s, last 15s red countdown)
  // ═══════════════════════════════════════════════════════

  var ROTATE_SECONDS = 60;
  var rotateTimer = ROTATE_SECONDS;
  var rotateInterval = null;

  function startRotationTimer() {
    rotateTimer = ROTATE_SECONDS;
    updateTimerDisplay();
    if (rotateInterval) clearInterval(rotateInterval);
    rotateInterval = setInterval(function() {
      rotateTimer--;
      updateTimerDisplay();
      if (rotateTimer <= 0) {
        rotateTimer = ROTATE_SECONDS;
        currentPattern = (currentPattern + 1) % 6;

        // Switch to new pattern with "全部" filter (no DOM rebuild)
        clearPatternClasses();
        applyPattern(currentPattern);
        currentFilter = '*';

        // Update nav button state
        document.querySelectorAll('.cat-nav-btn').forEach(function(b) { b.classList.remove('active'); });
        var allBtn = document.querySelector('.cat-nav-btn[data-cat="*"]');
        if (allBtn) allBtn.classList.add('active');

        renderLegend();
      }
    }, 1000);
  }

  function updateTimerDisplay() {
    var el = document.getElementById('timerText');
    if (el) el.textContent = rotateTimer + 's';
    var timer = document.getElementById('catNavTimer');
    if (timer) {
      timer.style.borderColor = rotateTimer <= 15 ? 'rgba(220,100,80,0.5)' : 'rgba(180,210,225,0.4)';
      var dot = timer.querySelector('.timer-dot');
      if (dot) dot.style.background = rotateTimer <= 15 ? '#d06050' : '#6aab9a';
    }
  }

  // ═══════════════════════════════════════════════════════
  //  INIT
  // ═══════════════════════════════════════════════════════

  if (CONCEPTS.length > 0) {
    currentPattern = Math.floor(Math.random() * 6);
    renderAllCards();
    applyPattern(currentPattern);
    renderLegend();
    startRotationTimer();
  } else {
    pool.innerHTML = '<p style="text-align:center;color:#889;padding:60px 0;grid-column:1/-1;">概念数据加载中…</p>';
    window.addEventListener('load', function() {
      if (typeof ALL_CONCEPTS !== 'undefined' && ALL_CONCEPTS.length > 0 && !pool.querySelector('.card')) {
        // Re-initialize since CONCEPTS was captured as empty
        window.location.reload();
      }
    });
  }
})();
</script>

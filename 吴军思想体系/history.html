1851年伦敦第一届世界博览会以蒸汽动力机械为主要展品，而外国多为农产品和手工产品。 - 经济地位：英国成为世界经济中心，但面临工业品销售问题，需解决\"商品卖给谁\"的核心矛盾。 - 政策转向：为应对销售压力，英国放弃实行两百多年的重商主义，转向自由贸易政策，通过开放自身市场换取国外市场，推动建立自由主义经济体系。 🧠 亚当·斯密的经济学奠基（理论核心） (一) 人物与著作地位 - 亚当·斯密：苏格兰经济学家、启蒙思想家，被誉为\"现代经济学之父\"，其理论对近代及当代社会影响深远。 - 《国富论》：经济学界的《自然哲学的数学原理》（牛顿），核心建立在对人性的深刻洞察上，因人性本质未变而长期被奉为经典。 - 思想传承：马克思、凯恩斯等后世经济学家的理论均建立在《国富论》基础之上。 (二) 《国富论》的三大核心理论 例证/影响 : 自利驱动论 需求大于供应时，价格和利润上升→资源倾斜→供求平衡，形成高效资源分配 分工是提高劳动生产率的关键 | 无分工时1人1天难生产10只针；10人分工协作的小作坊1天可生产48000根针 | (三) 劳动价值论与自由贸易策略 - 劳动价值论：明确财富由劳动创造（非资本或土地），国家富强的关键是创造财富的能力，而非黄金白银储备。后续美", "e": "enlightenment", "tp": "institution", "ax": "both"}, "31": {"t": "蒸汽时代：机械思维如何改变人类的生活？｜《吴军来信·世界文明史》年度专栏", "c": "🏭 工业革命的双重本质（引言） 核心定义 第一次工业革命本质上是动力革命与思维革命的结合： - 动力维度：蒸汽动力取代人力/畜力，推动商品大规模生产，全球生活水平显著提升。 - 思维维度：机械思维成为主流，将复杂问题转化为可通过力学/机械学解决的标准化问题，催生大量发明。 时代背景 18世纪末至19世纪中期，人类进入\"蒸汽时代\"，蒸汽船、火车等关键发明至今仍影响现代社会。 🚢 蒸汽船：跨洋运输的革命性突破 (一) 发明者与关键经历 - 罗伯特·富尔顿（Robert Fulton，1765-1815）：美国画家转型发明家，关键转折点包括： - 1786年在英国结识瓦特（工业革命核心人物），系统学习数学/化学。 - 为工厂主罗伯特·欧文设计机械，积累实践经验。 (二) 技术演进与挑战 结果 : 1798年 法国放弃，被嘲讽为\"富尔顿的蠢物\" 在美国利文斯顿支持下，\"克莱蒙特\"号试航 1812年 🚂 火车：陆地交通的范式转移 (一) 史蒂芬森父子的贡献 - 乔治·史蒂芬森（英国工匠）：煤矿夜校学习→矿上技师→1810年开始研制蒸汽机车。 - 关键成就：1825年设计的火车以24公里/小时时速，运载450人完成30多千米旅程，首次实现蒸汽动力超越畜力。 (二) 铁路的社会经济影响 - 英国：利物浦-曼彻斯特铁路引发\"铁路热\"，改变经济地理格局。 - 美国：连接五大湖与东北部沿海，形成统一大", "e": "enlightenment", "tp": "technology", "ax": "energy"}, "33": {"t": "独立：拉丁美洲是如何推翻殖民统治的？｜《吴军来信·世界文明史》年度专栏", "c": "🌍 拉丁美洲独立运动背景与概念界定 核心背景 - 殖民格局：美国以南的美洲地区（拉丁美洲）主要为西班牙、葡萄牙殖民地，部分为法国殖民地，语言属拉丁语系。 - 统治时长：欧洲宗主国统治超过两个世纪，殖民地民众（含欧洲移民后裔）对宗主国认同度大幅下降。 - 社会矛盾：非洲黑奴反抗白人统治，阶级与种族矛盾激化。 🔥 海地革命：拉丁美洲独立运动的开端 (一) 革命前的圣多明各 - 地理与经济地位：位于加勒比海伊斯帕尼奥拉岛西部（今海地），法国殖民地，世界重要蔗糖、咖啡、棉花产地，贡献法国外贸收入三分之一，为当时全球最富有殖民地之一。 - 人口结构：以非洲黑奴为主要劳动力，欧洲移民因气候原因不愿从事农业生产，奴隶与白人庄园主冲突频繁。 - 反抗基础：逃跑奴隶在偏远地区建立社区，频繁袭击种植园获取物资。 (二) 革命导火索与进程 - 外部影响：北美独立运动（法国派圣多明各混血后裔参战，带回民主思想）和法国大革命（法国无力管理殖民地）直接引发动荡。 - 内部冲突：1791年白人谋求自治但反对给予混血人和奴隶权利，引发白人与混血人战争，进而升级为奴隶起义（超10万奴隶参与）。 - 国际干涉：1792年法国派军镇压，英国、西班牙趁机介入。 (三) 黑人领袖杜桑·卢维杜尔的作用 (四) 海地独立 - 后续斗争：卢维杜尔继任者德萨林利用黄热病（黑人有抵抗力）击败法国远征军。 - 建国：1804年宣布独立", "e": "enlightenment", "tp": "civilization", "ax": "both"}, "24": {"t": "补充：那些我们课程里没有涉及的历史内容｜《吴军来信·世界文明史》年度专栏", "c": "🌍 引言：文明探索的宏观视角 本文为吴军课程加餐内容，旨在通过串点成线的方式，从政治制度变革、民族国家形成及科学文化发展三个维度，系统梳理18-19世纪世界主要文明地区的历史变迁，为后续深入研究提供参考框架。课程将20世纪排除在历史讨论范围外，因其属于部分人的亲历时代。 🔍 东方文明的政治转型：从历史循环到外部冲击 (一) 传统政治循环的特征 - 历史重复现象：以中国二十四史为例，封建王朝在相同发展阶段重复相似历史轨迹，人物传记跨朝代替换亦无违和感，文明呈螺旋式缓慢上升。 - 地域普遍性：朝鲜半岛、日本、越南等中华文明圈地区及印度均存在类似循环。 (二) 外来影响与制度演变 关键制度变革 : : 蒙古族建立元朝 第一次：全面学习中华文明；第二次：成立德川幕府，与中华文明渐行渐远 印度 为印度文明圈分裂（印度、巴基斯坦、孟加拉）埋下伏笔 形成背景 : 德国 首次成为统一国家 罗马帝国解体后长期分裂 19世纪初反抗奥斯曼斗争 匈牙利 与奥地利组成奥匈帝国（二元帝国，各自拥有独立议会） | (三) 美洲民族国家的独立运动 - 独立特征：与殖民地脱离欧洲宗主国运动重合，多由欧洲移民后裔领导（如巴西独立由葡萄牙王储主导）。 - 联合尝试失败案例：中美洲联邦共和国仅存在18年，分裂为7个国家，根源在于地区发展不平衡和政治理念差异。 - 历史意义：标志欧洲对美洲影响力衰弱，美洲作为独立政治力量登", "e": "industrial", "tp": "civilization", "ax": "information"}, "30": {"t": "第二次工业革命：电力如何改变世界？｜《吴军来信·世界文明史》年度专栏", "c": "⚡ 电力革命的文明意义（引言） 核心定位：电的使用对文明的影响远超蒸汽机。蒸汽机仅提供动力，而电改造了几乎所有产业和人类生活方式。 - 历史对比：人类文明98%的时间不依赖电，仅2%的时间实现了电力驱动的文明变革。 - 产业影响：80-90%的传统产业通过电力实现脱胎换骨，以崭新形式重新出现。 🏭 电力对社会的全方位改造（影响） 🔬 电力的探索与技术突破（历程） (一) 早期认知与基础研究 - 自然现象阶段：雷电等自然电现象长期未被理解（古希腊、古代中国已有探索）。 - 富兰克林的贡献： - 通过风筝实验证实雷电与电的统一性 - 提出电流单向流动理论（修正双向流动误解） - 定义正电与负电概念 - 发明避雷针并在费城普及，后推广至全球 (二) 电能生产的关键突破 1. 伏特：发明电池，首次实现稳定电能供应（为电报等早期电器提供动力）。 2. 电磁学理论奠基： - 奥斯特（丹麦）、安培（法国）、亨利（美国）、法拉第（英国）的实验研究 - 麦克斯韦（英国）：建立统一电磁学理论，提出电磁波预言 3. 发电机的诞生： - 西门子（德国）：1866年设计并制造世界第一台实用交流发电机 - 特斯拉（美国）：发明多相交流发电机，1881年由西屋电气公司用于全美供电 🌟 第二次工业革命的核心人物（代表） (一) 爱迪生：务实的发明体系构建者 - 标签澄清：“自学成才”意义有限，“晚年保守”为误解，", "e": "industrial", "tp": "event", "ax": "energy"}, "75": {"t": "欧洲重商主义：早期的近代工商业是如何发展的？｜《吴军来信·世界文明史》年度专栏", "c": "🌍 重商主义的起源与定义（基础认知） 概念辨析 - 名称由来：\"重商主义\"一词出自亚当·斯密的《国富论》，但实践早于理论，文艺复兴时期的威尼斯、热那亚等海洋城市共和国已出现早期实践。 - 核心误解：并非单纯\"重视商业\"，更侧重工业生产，是国家主导的经济发展策略。 四大核心要点 1. 硬通货储备：保障基础建设与对外扩张的资金需求 2. 贸易顺差导向：在国际贸易中保持出口大于进口 3. 高附加值劳动：重点发展加工业等增值产业 4. 国家质量监督：通过政府介入保证商品国际竞争力 🇬🇧 英国重商主义的崛起逻辑（历史背景） 关键驱动因素 - 财务困境：伊丽莎白一世即位时继承历代国王债务，黑死病导致王室与民间资金匮乏 - 后发劣势：无法复制西班牙、葡萄牙的金银掠夺模式，也缺乏荷兰的市民集资能力 - 路径创新：转向内部工业化，以可持续生产替代短期掠夺 与西葡模式的对比优势 英国重商主义模式 : 核心策略 可持续的生产性收入 成为英国商品消费者 | 控制高附加值产业链 | 🏭 英国重商主义的实践措施（执行细节） (一) 产业发展 - 核心产业：以纺织业为代表的手工业，尤其是呢绒制造 - 原材料保障：通过圈地运动（莱斯特郡两年内圈地10万英亩，占该郡土地2%）将荒地、教会土地及部分耕地转为牧场，保障羊毛供应 (二) 质量管控 - 设立专门官员定期检查呢绒厂质量 - 颁布法规明确质量标准，对劣质产品制", "e": "industrial", "tp": "institution", "ax": "energy"}, "216": {"t": "科学与哲学，是一朵文明中相伴相生的并蒂莲嘛？｜《吴军来信·世界文明史》年度专栏", "c": "🧠 天才能力的数量级差异（核心观点一） 核心论断：人群中存在能力的数量级差异（非百分之十/二十的差距），部分个体能以一己之力完成成百上千专业人士无法达成的成就。 (一) 理论依据 - 朗道物理学家分级：将物理学家分为五级，一级物理学家贡献是五级的一万倍，且五级未必能理解一级的想法。 - 差异成因：智力、专注力、效率、天赋及个人兴趣发展等多维度因素共同作用，且这种差距难以逾越。 (二) 历史案例 特点 : 牛顿 成就产出量高，思想领先时代 艺术、科学、工程、解剖学等跨学科贡献 冯·诺依曼 🔍 认知局限与信息差（核心观点二） 核心论断：“我们往往只能理解我们能理解的事情”，当现实与认知不符时，应优先审视自身是否忽视关键信息。 (一) 案例解析 - 毕加索绘画理解：未经绘画训练者难以理解其作品“粗糙”的合理性，需通过解读线条、结构规则才能把握细节逻辑，否则无法理解他人对其作品的痴迷。 - 现实认知原则：遇到“匪夷所思”的现象时，首先考虑信息缺失而非否定现实。 🔗 科学与哲学的历史交织（核心观点三） (一) 早期融合阶段（古希腊-中世纪） - 词源与定义：哲学（Philosophy）由“热爱”+“智慧”构成，毕达哥拉斯时期哲学与自然科学不分家（如“万物皆数”的世界本源观）。 - 亚里士多德的划分：将哲学分为形而上（哲学与方法论）和形而下（物理学，即自然科学），但未完全割裂研究。 - 中世纪", "e": "industrial", "tp": "civilization", "ax": "information"}, "229": {"t": "中国古代的禅让传说和甲骨文从哪来？｜《吴军来信·世界文明史》年度专栏", "c": "🏺 禅让传说的历史真相（上） (一) 传统认知与历史记载的矛盾 - 普遍认知：尧→舜→禹的禅让制度是中国原始社会\"选贤与能\"的权力继承典范，直至禹传子启才进入\"家天下\"。 - 《史记》的家族继承线索：根据《史记∙五帝本纪》记载，从黄帝到尧的权力传递实际为家族内部传承： - 黄帝→孙子颛顼→堂侄帝喾（高辛）→帝喾之子挚→帝喾之子尧 - 关键点：舜（颛顼后代）、禹（颛顼后代，舜的叔叔辈）仍属同一家族，所谓\"禅让\"本质是家族内权力转移。 (二) 禅让传说的质疑与佐证 原文引用 : 《竹书纪年》 \"夫曰尧舜禅让，是虚言也\" 权力更迭含暴力成分 曹丕 🔍 禅让神话的起源与思想演变（下） (一) 墨家的禅让学说建构 - 顾颉刚研究结论：禅让传说起源于墨家（《禅让传说起于墨家考》，1936年）。 - 墨家动机： - 墨家内部采用\"选贤任能\"的掌门继承制 - 创始人墨子为宋国公子目夷后代（殷商遗民），因受歧视而强调贤能优先于血统。 (二) 儒家对禅让的态度 - 孟子的务实解读： - 学生万章问\"尧以天下与舜\"，孟子否定：\"天子不能以天下与人\" - 舜得位本质：\"尧使舜摄行天子政二十有八载\"（架空尧），\"天与之\"实为权力实际掌控的结果。 📜 甲骨文的发现与早期文字探索 (一) 甲骨文发现历程 1. 初始发现（1899年）：国子监祭酒王懿荣在\"龙骨\"（中药）上发现刻痕，鉴定为殷商文字。 2. 传承与研", "e": "industrial", "tp": "civilization", "ax": "both"}, "106": {"t": "四种文明的比较（上）：中世纪的启示｜《吴军来信·世界文明史》年度专栏", "c": "🏛️ 引言：文明对比的意义与框架 本文旨在从政治维度对比中世纪四大主要文明拜占庭文明、西欧基督文明、伊斯兰文明和东亚中华文明的核心特征。通过分析其权力结构、继承制度及政教关系，揭示不同文明形态的生命力差异。对比将围绕权力核心、继承方式、地方治理、政教关系四大关键要素展开。 1. 拜占庭文明：罗马遗产的专制延续 (一) 权力结构 - 核心特征：政教合一，以世俗权力为核心，神权服务于政权。 - 皇帝角色：集最高政治领袖、军事领袖、最高法官和宗教领袖于一身，自诩为“罗马人的皇帝”及“耶稣在尘世的代理人”，不承认罗马教宗权威。 - 中央机构：设“共治皇帝”（皇储），宫廷部门类似中国六部，设监察官作为皇帝耳目，无制衡皇权的元老院。 (二) 地方治理 - 早期：全国分四大区，由总督管理。 - 7世纪后：因军事失败取消大区制，改为军区制，将军权力类似唐朝藩镇节度使。 (三) 继承制度 - 名义原则：长子继承制，但皇帝实行一夫一妻制，导致皇长子常缺位。 - 实际情况：90余位皇帝中仅20余位以皇长子（含养子）身份继位，其余由兄弟、侄甥、配偶等亲戚继承，形成扩大化的家天下继承。 - 女性继承权：法律承认女性继承权，存在女皇帝（如狄奥多拉皇后）。 (四) 制度风险与优势 - 风险：绝对君主制下皇帝能力难以保障。 - 优势：权力传递相对稳定，法统正当性避免罗马后期频繁更迭。 2. 中华文明：科举制支撑的", "e": "modern", "tp": "civilization", "ax": "energy"}, "222": {"t": "标点符号是什么时候开始使用的？｜《吴军来信·世界文明史》年度专栏", "c": "📚 标点符号的起源与演变 (一) 无标点时代的阅读困境 - 共同特征：东西方早期文字均无标点符号，书写连成一片，依赖读者\"识文断字\"自行断句。 - 典型案例：中文典籍如\"下雨天留客天留我不留\"因断句不同产生多重含义，体现语言二义性问题。 (二) 中文标点符号的近代确立 - 关键节点：1919年，钱玄同、刘复、周作人、胡适等学者联名提出《请颁行新式标点符号议案》。 - 日本影响：借鉴明治维新后形成的现代日文标点体系，而非直接采用西方符号。 - 首次应用：1920年，汪原在陈独秀、胡适支持下，标点出版《水浒传》，成为中国首部使用标点的古典书籍。 (三) 西方标点符号的中世纪起源 - 诞生背景：中世纪加洛林文艺复兴时期，查理曼大帝（扑克牌红桃K人物）组织学者规范化拉丁文。 - 核心成果：制定标点符号系统，规定句子首字母大写，后续经多次演变形成现代体系。 💼 古代文明的财富创造与黄金时代 (一) 雅典的财富积累模式 - 经济基础：依靠工商业而非农业，粮食依赖进口，城邦通过节制消费实现福利发放（给穷人发福利、给官员发补贴）。 - 兴衰转折：伯罗奔尼撒战争后期因战争消耗导致经济入不敷出，但穷人不愿减少福利，成为战败原因之一。 (二) 中国历史上的工商业案例 核心措施 : : 管仲治齐 城市化水平高，基础设施完备 | 出现养老院、消防局等现代服务机构，百姓生活富裕 | (三) 中国古代黄金时代的", "e": "modern", "tp": "civilization", "ax": "information"}, "248": {"t": "印度的种姓制度是怎么回事？ ｜《吴军来信·世界文明史》年度专栏", "c": "🌍 种姓制度的普遍性（引言） 种姓制度并非印度独有，在东亚、东南亚、西亚及西非等地区均存在类似社会划分： - 古代波斯：与印度同源（雅利安人后代），分为僧侣、武士、文官、平民四等级，前三者为外来雅利安人，平民为原住民。 - 古代朝鲜（11世纪-近代）：六等级制度，从高到低为两班（文班/武班贵族）、中人（富裕阶层）、常民（有产农民/市民）、贱民（无产者）、白丁（赤贫者）、奴婢（无自由）。 - 古代中国：虽存在\"士农工商\"或\"公侯伯子男\"等划分，阶层有一定流动性（如农民可通过科举成为士绅），但整体仍具固化特征。 📜 种姓制度的核心特征（理论框架） 印度社会学家古里（Govind Sadashiv Ghurye） 总结广义种姓制度的六大核心特征： 1. 按出生划分阶层：身份先天决定，不可变更 2. 等级森严：各阶层有明确高低之分 3. 社交限制：不同阶层间交往受严格约束 4. 居住隔离：各阶层有专属居住区 5. 职业世袭：子承父业，职业固定化 6. 禁止跨阶层通婚：维护阶层纯洁性 🇮🇳 印度种姓制度详解（主体内容） (一) 瓦尔那制度四等级结构 构成人群 : : 最高 贵族/武士 吠舍 农民/牧民/商人，需交税；属于\"再生族\"（经婆罗门主持入法礼获得精神重生） 最低 (二) 种姓制度的历史演变 - 早期阶段（吠陀文明时期）：差异主要体现在职业而非社会地位，种姓划分更多是理想社会构想。 -", "e": "modern", "tp": "institution", "ax": "energy"}, "323": {"t": "33｜如果可以选择，你想成为爱迪生还是特斯拉？", "c": "⚡ 核心命题引入（背景） 选择的时代变迁 - 30年前：99%以上的人倾向选择爱迪生（传统发明家典范）。 - 当下：受特斯拉公司创始人马斯克影响，特斯拉被神化，成为“酷”的象征。 - 课程目标：从商业角度剖析两人人生道路，理解技术变革时代的个人竞争力提升策略。 🔬 爱迪生：科技与商业的结合者（人物分析） (一) 历史定位与贡献 - 电气时代开启者：创立企业研究实验室，首次实现科技与商业的紧密结合。 - 第二次工业革命推动者：推动资本介入科技研发，加速发明成果商业化，使技术快速惠及生活。 (二) 成功核心要素 - 科学方法：强调“1%的灵感+99%的汗水”，但更注重结构化实验（如灯丝研发中系统测试不同品种、产区的竹子，优化摆放角度与真空效果）。 - 资本运作能力：发明白炽灯时同步建设发电站与输电网络，借助金融投资实现技术普及。 🔭 特斯拉：超越时代的理想主义者（人物分析） (一) 技术特质 - 科学家思维：研究方向过于超前（如长距离无线输电，现代仅实现短距离小功率应用）。 - 专利成就：拥有交流输电、发电机等核心专利，但商业化能力薄弱。 (二) 人生坎坷的关键原因 - 资金管理问题：将专利转让收入投入无法实现的技术研究，导致无法完成投资人要求的产品，失去资金支持。 - 专利纠纷：无线电专利被美国专利局撤销（1904年），后虽由最高法院重新认定有效（1943年），但已去世，未获当时认可", "e": "modern", "tp": "event", "ax": "energy"}, "324": {"t": "46｜青霉素：发明不是从0到1", "c": "🔍 核心观点：发明的本质是从0到N 对\"从0到1\"的批判性思考 - 背景：彼得·蒂尔（PayPal创始CEO、马斯克首任老板）所著《从0到1》在中国科技界和企业界广受追捧，其核心观点将创新分为\"从无到有（0→1）\"和\"从少到多（1→N）\"，并认为硅谷擅长前者、中国擅长后者。 - 作者反驳：硅谷实际很少有真正的\"从0到1\"发明，更多是完成技术从1到N的转化（详见《硅谷来信》第56封信）。 - 核心论点：重大发明的关键在于从0到N的全过程，而非单一的0→1突破。 💊 青霉素的革命性意义 - 寿命影响：抗生素使人类平均寿命增加15岁。 - 认知转变：从\"生病即死亡\"到\"相信医生能治愈\"的心理变革，消除了人类对疾病的恐惧。 🧪 青霉素发现的常见误区 (一) 弗莱明的\"偶然发现\"叙事 - 教科书版本：英国医生弗莱明在培养葡萄球菌时，偶然发现污染霉菌（青霉）周围的细菌被杀死，从而\"发现青霉素\"。 - 教育导向：强调\"灵机一动的发明需要有准备的头脑\"，但忽略了关键背景和后续发展。 (二) 被忽视的历史前提 局限性 : 科赫（德国，细菌学之父） 无法解释原理，未推广，浓度太低无法治疗重大伤病 1928年正式观察到青霉抑制葡萄球菌现象并发表论文 | 不懂化学和制药学，无法提纯有效成分；培养液浓度仅2单位/升（远低于临床需求的60万-80万单位/天）；缺乏研究经费 | 🚀 青霉素从天然物到药物的8大突", "e": "modern", "tp": "technology", "ax": "energy"}, "155": {"t": "约翰·霍普金斯大学毕业演讲：我的三堂人生课｜《吴军来信·世界文明史》年度专栏", "c": "🎓 演讲背景与核心主旨 基本信息 - 演讲者：吴军（计算机科学家，前Google高级研究员）。 - 场合：约翰·霍普金斯大学怀廷工学院博士生毕业典礼。 - 时间：2023年5月22日（周一）。 - 核心目的：分享三堂“受益终身的人生课”，为毕业生提供职业与人生发展的启示。 📚 第一堂课：关于运气与准备的辩证关系 (一) 布莱迪校长的启示 - 核心观点：每个人都会经历好运气与坏运气，两者可能相互转化，需保持谦卑与敬畏，并时刻做好准备。 - 引用来源：哈里·杜鲁门总统的故事。 (二) 个人经历验证 关键教训 : 顺境期（1999-2000） 坏运气中保持行动，通过网络搜索发现Google招聘机会 认真准备Google面试，3天后获聘；同期大公司重新抛来橄榄枝，但选择加入Google | 运气垂青有准备的人，小公司机会可能带来更大回报 | (三) 对毕业生的建议 - 面对坏运气：不要绝望，好运气可能比预期来得快，唯一能做的就是准备好。 - 面对成功：避免狂妄自大，坏运气可能在暗处等待。 - 创业者视角：成功的创业者多归因于运气，失败的创业者多抱怨运气，但运气只垂青谦卑且敬畏命运的人。 🌍 第二堂课：关注世界需求，追求广泛影响力 (一) Google上级的启发 - 关键人物：阿米特·辛格（Amit Singhal）、阿兰·尤斯塔斯（Alan Eustace）、埃里克·施密特（Eric Sc", "e": "contemporary", "tp": "civilization", "ax": "information"}, "188": {"t": "文明图景：古典时代城市建设的顶峰什么样？｜《吴军来信·世界文明史》年度专栏", "c": "🏙️ 城市发展与基础设施（核心载体） (一) 城市分布与规模 - 核心城市带：集中在意大利（罗马）、希腊、安纳托利亚和古埃及地区，代表城市包括罗马、亚历山大、安条克、迦太基和以弗所。 - 罗马城地位：帝国财富与人才聚集地，人口达百万，是当时最繁荣的城市。 (二) 城市生活水平 - 基础设施：引水渠（山泉水供应）、供水/排水系统、公共浴池、运动场、竞技场（如罗马斗兽场，公元80年建成，容纳数万人）、剧院。 - 生活水平基准：欧洲同等规模城市的市民生活水平直到19世纪工业革命后才超过罗马帝国时期。 🛣️ 交通网络与信息传递（连接纽带） (一) 道路网络体系 规模/作用 : 全国性干道 延伸至城镇和村庄，辅助区域联系 | (二) 邮政系统 - 传递效率：信件传递速度可达每天80公里，为当时世界领先水平。 📈 商业与经济形态（动力引擎） (一) 国内贸易 - 农产品商品化：农民从自给自足转向利润导向，主要商品包括： - 希腊：橄榄油、葡萄酒 - 叙利亚/巴勒斯坦：水果、干果、羊毛纺织品 - 高卢：谷物 - 销售网络：依托道路系统实现帝国范围内流通。 (二) 国际贸易 - 区域覆盖：通过地中海和红海港口，贸易延伸至印度，并间接与中国建立联系。 - 文明意义：形成全球化雏形。 💧 水利工程与城市服务（技术支撑） (一) 水利设施建设 - 工程类型：水坝（伊比利亚半岛70余座，部分仍在使用）、引", "e": "contemporary", "tp": "civilization", "ax": "energy"}, "302": {"t": "迷思：为什么一直有人觉得金字塔是外星人造的？｜《吴军来信·世界文明史》年度专栏", "c": "🏛️ 核心概况与历史地位 基本参数 - 高度：建成时146米（相当于40-50层楼），埃菲尔铁塔前世界最高人造建筑。 - 保持纪录时长：数千年（期间林肯大教堂曾短暂超过，因雷击顶部受损后纪录回归）。 - 底座规模：正方形边长230米，面积约5-6个足球场。 - 重量：约600万吨，至今保持全球最重建筑纪录（第二名400万吨，第三名200万吨）。 - 建造年代：约4600年前，古埃及第四王朝时期。 🔨 建筑技术与结构特点 (一) 石材与砌筑工艺 - 石材用量：约230万块石灰岩巨石，平均重量2.5吨，最大达百吨级。 - 砌筑方式：无水泥或灰浆粘连，仅靠石块叠压；石缝填充石膏（非粘连作用，仅用于密封），严丝合缝至刀片无法插入。 (二) 结构设计智慧 - 入口设计：离地13米高，采用三角形石门结构，从力学角度可承受金字塔巨大重量（优于四边形等其他几何形状）。 - 稳定性：4600年屹立不倒，印证古埃及人对几何学和力学的深入理解与应用。 ❓ 建造谜团与科学解答 (一) 石料来源与开采 - 采石地点：主流观点认为来自尼罗河东岸（非希罗多德所说的西奈半岛\"阿拉伯山\"）。 - 开采方法： - 青铜器凿子打眼→插入木楔→灌水膨胀→岩石裂开（实验证明可行）。 - 石灰岩加工：青铜锯子和凿子（古埃及壁画有记载）。 - 花岗岩加工：石英砂粘铜锯表面（石英摩氏硬度7，高于花岗岩的6，类似金刚砂砂轮原理）。", "e": "contemporary", "tp": "civilization", "ax": "both"}, "326": {"t": "吴军科技史纲60讲｜59 量子通信到底是怎么回事？", "c": "🏆 中国量子通信的里程碑突破 潘建伟团队获奖事件 - 时间：2019年1月31日，美国科学促进会（AAAS）宣布。 - 奖项：2018年度克利夫兰奖（《科学》杂志年度奖）。 - 贡献：实现千公里级星地双向量子通信实验。 - 意义：该奖设立90多年来，中国科学家在本土完成的科研成果首次获奖。 🔒 量子通信的核心驱动力：信息安全需求 (一) 传统加密技术的局限性 - 安全时效性有限：基于公开密钥的加密方式，在计算机速度足够快时可被破译（如速度提高一百万倍）。 - 无法实现绝对安全：仅能保证有限时间内的保密，非理论上不可破解。 (二) 理想加密方案：一次性密码 - 理论基础：信息论发明人香农指出，一次性密码在理论上永远安全。 - 核心难题：密码本身的安全传输问题（传统方式无法解决）。 💡 量子通信的原理与实现 (一) 核心概念辨析 - 量子纠缠：一对纠缠粒子状态相互影响，但当前量子通信并非直接利用此特性，而是借用概念。 - 本质：一种特殊的激光通信，利用光子的偏振特性传递一次性加密密码。 (二) 光子偏振特性与通信机制 接收结果 : : 水平/垂直 随机（50%正确） 45度/135度 - 45度/135度 - 关键特性：若接收端方向与发送端不一致，错误率为25%（50%选错方向概率 × 50%猜错结果概率）。 (三) 量子密钥分发（QKD）过程 1. 密钥传输：发送端发送带偏振信息的光", "e": "contemporary", "tp": "event", "ax": "information"}, "328": {"t": "吴军科技史纲60讲｜57 基因编辑和修复离我们还有多远？", "c": "🔬 基因编辑技术的发展背景 关键事件引发争议 - 2018年底基因编辑婴儿事件：中国南方科技大学副教授对双胞胎胚胎细胞进行基因改造，使其获得可遗传的部分艾滋病免疫力，引发学术界和全社会争议。 - 学术界态度：以“得到”专栏《生命科学50讲》主理人王立铭教授为代表，学术界普遍持反对和谴责态度，认为此举打开“潘多拉盒子”，风险未评估且伦理问题未解决。 技术发展脉络 技术意义 : 发现限制酶时期 首次实现人工基因改造的实际应用 孟山都培养出第一株转基因植物 20世纪90年代 📌 基因编辑的核心技术与应用 CRISPR-Cas9技术原理 - 核心思想：类比文本编辑中的“字符串替换”，针对基因中由AGCT（四种核苷酸碱基）组成的序列进行精准修改。 - 技术来源：源于细菌（和古菌）的免疫系统修复机理，当病毒DNA入侵并嫁接到细菌染色体后，Cas9酶会将目标DNA切除。 - 发展历程：2010年起，詹妮弗·杜德纳、埃马纽埃尔·卡彭蒂和美籍华裔科学家张锋独立探索；2013年张锋的研究被《科学》评为当年十大科技突破之首。 商业前景与资本关注 - Editas医药公司：张锋等人2013年成立，专注技术服务，2017年上市时市值达20亿美元，反映全球对基因编辑技术前景的高度看好。 ⚖️ 基因编辑的伦理规范与争议 学术界共识原则 违反案例 : 14天规则 直接编辑受精卵导致基因可遗传，违反非遗传原则 | ", "e": "contemporary", "tp": "event", "ax": "both"}, "39": {"t": "七周年记：成长的三个维度｜《吴军来信·世界文明史》年度专栏", "c": "🎯 开篇：七年之约与成长命题 背景与核心议题 - 时间节点：2016-2023年（7年周期），《硅谷来信》及相关课程总结。 - 核心问题：聚焦社会属性成长（区别于生理成长），探讨如何实现\"更高、更远的目标\"而非短期速度竞争。 - 自然周期隐喻：野兔数量波动周期为7年，引出人生七年阶段划分的社会学视角。 🔄 人生七年周期理论 社会学家将人生划分为多个七年阶段，关键节点特征如下： 核心特征 : 0-6岁 对世界充满好奇 青春叛逆期 21-27岁 结婚生子，养育后代 迷茫期 43-49岁 逐渐看开，对应孔子\"五十而知天命\" 大众反应 : 90年代末互联网泡沫 人性的贪婪与恐惧 彻底规避股票 大量买入优质资产 | 市场情绪≠市场本质 | - 关键结论：巴菲特的投资策略核心在于对人性本质的洞察，而非技术或信息优势。 (三) 看得开：放下执念的智慧 - 现代社会两大痛点： 1. 对小事看不开：家长因孩子考试失利焦虑、年轻人因工作未获肯定心灰意冷、商人因失去生意长期郁闷。 2. 过度关注他人评价：英若诚\"柜子藏人\"典故显示，个人在他人眼中的分量常被高估。 - 境界的重要性：\"看得远、看得透、看得开\"的人，生活与事业更易成功；反之，即便拥有财富、学识和资源，也未必幸福或成事。 💎 成长的进阶要求：自我高标准 - 三大核心品质： 1. 诚信：使用盗版软件/书籍即不符合标准。 2. 谦恭：有成绩即沾沾", "e": "digital_age", "tp": "civilization", "ax": "energy"}, "184": {"t": "职业选手和业余选手的差距在哪里？｜《吴军来信·世界文明史》年度专栏", "c": "🏌️ 引言：专业与业余的本质差距 吴军通过与中国职业高尔夫选手袁也淳（美巡赛会员、全运会冠军、奥运选手）和杨慕天（美巡赛中国赛昆明/株洲站冠军）的近距离接触，揭示了职业选手与业余人士的全方位差距，以及如何将一件事做到极致的核心逻辑。 📊 业余与职业选手的四大差距维度 (一) 绝对水平差距 - 量化对比：吴军击球距离约240码，职业选手可达340码，看似100码（40%）的差距，实际需10倍以上努力才能弥补（每提升20码需付出翻倍努力）。 - 本质：绝对能力的数量级差异，非简单训练可跨越。 (二) 稳定性差距 - 核心区别：业余人士难以保证每次表现一致，而专业人士需在关键领域（如金融、医疗、法律）维持稳定输出。 - 行业类比：外科医生不能手术成功率波动，投资人不能\"时不时赔钱\"，稳定性是专业的基础门槛。 (三) 意外处理能力差距 - 专业优势：职业选手面对界外球、沙坑等意外时，具备系统化补救 const starCanvas = document.getElementById('starfield');
const starCtx = starCanvas.getContext('2d');
let stars = [];

function initStars(){
  const W = window.innerWidth, H = window.innerHeight;
  const count = Math.floor(W * H / 800);
  stars = [];
  for(let i=0;i<count;i++){
    stars.push({
      x: Math.random()*W, y: Math.random()*H,
      r: Math.random()*1.3+0.2,
      a: Math.random()*0.6+0.2,
      twinkle: Math.random()*Math.PI*2,
      speed: Math.random()*0.02+0.005,
    });
  }
}

function drawStars(time){
  const W = starCanvas.width, H = starCanvas.height;
  starCtx.clearRect(0,0,W,H);

  // Deep space gradient
  const grad = starCtx.createRadialGradient(W/2,H/2,0, W/2,H/2,W*0.6);
  grad.addColorStop(0,'#0a0a18');
  grad.addColorStop(0.5,'#070712');
  grad.addColorStop(1,'#04040a');
  starCtx.fillStyle = grad;
  starCtx.fillRect(0,0,W,H);

  for(const s of stars){
    const alpha = s.a + Math.sin(time*0.001*s.speed + s.twinkle)*0.15;
    starCtx.beginPath();
    starCtx.arc(s.x,s.y,s.r,0,Math.PI*2);
    starCtx.fillStyle = `rgba(180,200,230,${Math.max(0.05,alpha)})`;
    starCtx.fill();
  }
}

// ============================================================
// HELIX CANVAS (Main)
// ============================================================
const canvas = document.getElementById('helix-canvas');
const ctx = canvas.getContext('2d');
let W,H,dpr;

function resizeAll(){
  dpr = Math.min(window.devicePixelRatio||1,2);
  W = window.innerWidth;
  H = window.innerHeight;
  [starCanvas,canvas].forEach(c=>{
    c.width = W*dpr; c.height = H*dpr;
    c.style.width = W+'px'; c.style.height = H+'px';
  });
  starCanvas.getContext('2d').setTransform(1,0,0,1,0,0);
  starCanvas.getContext('2d').scale(dpr,dpr);
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(dpr,dpr);
  initStars();
}
resizeAll();
window.addEventListener('resize',resizeAll);

// ============================================================
// STATE
// ============================================================
let mode = 'river';
let camX=0, camY=0, targetCamX=0, targetCamY=0;
let zoom=0.7, targetZoom=0.7;
let mx=0, my=0;
let dragging=false, dsx,dsy, dcx,dcy;
let hovered=null;
let activeCard=null;
let time=0;
let selectedNodeForNav=null;

// ============================================================
// NODE POSITIONING
// ============================================================
function totalWidth(){ return W * 5; }

function nodeX(node){
  const tw = totalWidth();
  const eraIdx = ERA_ORDER.indexOf(node.e);
  const baseX = (eraIdx / Math.max(ERA_ORDER.length-1,1)) * tw;
  const seed = node.id * 7.391;
  const jitterX = (Math.sin(seed)*0.5+0.5) * (tw/ERA_ORDER.length)*0.5;
  return baseX + jitterX;
}

function nodeY(node){
  const x = nodeX(node);
  const amp = H * 0.3;
  const freq = 0.0008;
  let phase = 0;
  if(node.ax === 'energy') phase = 0;
  else if(node.ax === 'information') phase = Math.PI;
  else phase = Math.PI/2;
  const seed = node.id * 3.719;
  const jitterY = (Math.cos(seed)*0.5+0.5) * H*0.08 - H*0.04;
  return H/2 + Math.sin(x*freq + phase)*amp + jitterY;
}

function screenPos(node){
  return {
    x: nodeX(node) - camX,
    y: nodeY(node) - camY,
  };
}

function hitTest(mx,my,node,threshold=22){
  const p = screenPos(node);
  const dx = mx-p.x, dy = my-p.y;
  return Math.sqrt(dx*dx+dy*dy) < threshold/zoom;
}

// Highlight node set for fast lookup
const highlightIds = new Set(Object.keys(HIGHLIGHTS).map(Number));

// ============================================================
// RENDER
// ============================================================
function drawHelix(){
  ctx.save();

  const amp = H*0.3, freq=0.0008;
  const startX = -W*0.5, endX = totalWidth() + W*0.5;

  // Energy strand
  ctx.beginPath();
  for(let x=startX; x<=endX; x+=3){
    const y = H/2 + Math.sin((x+camX)*freq)*amp - camY;
    if(x===startX) ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
  }
  ctx.strokeStyle = 'rgba(240,160,64,0.08)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Energy glow
  ctx.beginPath();
  for(let x=startX; x<=endX; x+=3){
    const y = H/2 + Math.sin((x+camX)*freq)*amp - camY;
    if(x===startX) ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
  }
  ctx.strokeStyle = 'rgba(240,160,64,0.03)';
  ctx.lineWidth = 5;
  ctx.stroke();

  // Info strand
  ctx.beginPath();
  for(let x=startX; x<=endX; x+=3){
    const y = H/2 + Math.sin((x+camX)*freq+Math.PI)*amp - camY;
    if(x===startX) ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
  }
  ctx.strokeStyle = 'rgba(64,192,232,0.08)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Info glow
  ctx.beginPath();
  for(let x=startX; x<=endX; x+=3){
    const y = H/2 + Math.sin((x+camX)*freq+Math.PI)*amp - camY;
    if(x===startX) ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
  }
  ctx.strokeStyle = 'rgba(64,192,232,0.03)';
  ctx.lineWidth = 5;
  ctx.stroke();

  ctx.restore();
}

function drawEraMarkers(){
  ctx.save();

  for(let i=0; i<ERA_ORDER.length; i++){
    const ek = ERA_ORDER[i];
    const ei = ERAS[ek];
    const x = (i/Math.max(ERA_ORDER.length-1,1))*totalWidth() - camX;
    const y = H - 25;

    if(x < -80 || x > W+80) continue;

    // Vertical tick
    ctx.beginPath();
    ctx.moveTo(x, y-6);
    ctx.lineTo(x, y+6);
    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Label
    ctx.fillStyle = 'rgba(180,180,200,0.45)';
    ctx.font = '11px ' + getComputedStyle(document.body).fontFamily;
    ctx.textAlign = 'center';
    ctx.fillText(ei.name, x, y+20);

    // Count
    ctx.fillStyle = 'rgba(180,180,200,0.18)';
    ctx.font = '9px ' + getComputedStyle(document.body).fontFamily;
    ctx.fillText(ei.total+'', x, y+34);
  }

  ctx.restore();
}

function drawNodes(){
  ctx.save();

  for(const node of ALL_NODES){
    const p = screenPos(node);
    if(p.x<-20||p.x>W+20||p.y<-20||p.y>H+20) continue;

    const isHighlight = highlightIds.has(node.id);
    const isHovered = hovered && hovered.id===node.id;
    const isInsight = node.tp==='insight';

    // Node size
    let size;
    if(isHovered) size = 8;
    else if(isInsight) size = 5.5;
    else if(isHighlight) size = 4.5;
    else size = 2.2;

    const alpha = isHighlight || isInsight ? 0.85 : 0.45;

    // Color
    let color;
    if(node.ax==='energy') color = [240,160,64];
    else if(node.ax==='information') color = [64,192,232];
    else color = [190,170,140];

    // Glow for important nodes
    if(isHovered || isInsight){
      const glowAlpha = isHovered ? 0.4 : 0.2;
      ctx.beginPath();
      ctx.arc(p.x, p.y, size*3, 0, Math.PI*2);
      ctx.fillStyle = `rgba(${color[0]},${color[1]},${color[2]},${glowAlpha})`;
      ctx.fill();
    }

    // Node body
    ctx.beginPath();
    ctx.arc(p.x, p.y, size, 0, Math.PI*2);
    ctx.fillStyle = `rgba(${color[0]},${color[1]},${color[2]},${alpha})`;
    ctx.fill();

    // Ring for insights
    if(isInsight && !isHovered){
      ctx.beginPath();
      ctx.arc(p.x, p.y, size+3, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(${color[0]},${color[1]},${color[2]},0.4)`;
      ctx.lineWidth = 0.8;
      ctx.stroke();
    }

    // Pulse for hovered
    if(isHovered){
      const pulse = Math.sin(time*0.005)*0.3+0.7;
      ctx.beginPath();
      ctx.arc(p.x, p.y, size+6*pulse, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(${color[0]},${color[1]},${color[2]},${0.5*pulse})`;
      ctx.lineWidth = 1.2;
      ctx.stroke();
    }
  }

  ctx.restore();
}

function drawNowMarker(){
  const nowIdx = ERA_ORDER.indexOf('digital_age');
  const x = (nowIdx/Math.max(ERA_ORDER.length-1,1))*totalWidth() - camX;
  const y = H/2 - camY;

  if(x<-80||x>W+80) return;

  ctx.save();
  const pulse = Math.sin(time*0.0025)*0.3+0.7;

  // === CONVERGENCE ZONE ===
  // Energy and information strands visibly converge at the present moment
  const amp = H*0.3, freq = 0.0008;

  // Draw converging strands
  for(let d=0; d<80; d+=1){
    const t = d/80;
    const alpha = (1-t)*0.25*pulse;

    // Energy strand bending toward center
    const ex = x - 60 + d*0.7;
    const ey = H/2 + Math.sin((ex+camX)*freq)*(amp*(1-t*0.5)) - camY;

    // Info strand bending toward center
    const ix = x - 60 + d*0.7;
    const iy = H/2 + Math.sin((ix+camX)*freq+Math.PI)*(amp*(1-t*0.5)) - camY;

    if(d%3===0){
      ctx.beginPath();
      ctx.arc(ex, ey, 1, 0, Math.PI*2);
      ctx.fillStyle = `rgba(240,160,64,${alpha})`;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(ix, iy, 1, 0, Math.PI*2);
      ctx.fillStyle = `rgba(64,192,232,${alpha})`;
      ctx.fill();
    }
  }

  // Convergence point glow
  const grad = ctx.createRadialGradient(x, y, 0, x, y, 50);
  grad.addColorStop(0, `rgba(255,255,255,${0.5*pulse})`);
  grad.addColorStop(0.3, `rgba(200,180,140,${0.2*pulse})`);
  grad.addColorStop(1, 'rgba(200,180,140,0)');
  ctx.beginPath();
  ctx.arc(x, y, 50, 0, Math.PI*2);
  ctx.fillStyle = grad;
  ctx.fill();

  // Pulsing rings
  for(let r=0; r<3; r++){
    const radius = 18 + r*14 + Math.sin(time*0.004+r)*4;
    const alpha = (0.4-r*0.12)*pulse;
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI*2);
    ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
    ctx.lineWidth = 1.5-r*0.3;
    ctx.stroke();
  }

  // Energy-Info convergence symbol (small double helix icon)
  const iconR = 12;
  for(let a=0; a<Math.PI*2; a+=0.15){
    const ex2 = x + Math.cos(a)*iconR;
    const ey2 = y + Math.sin(a)*iconR*0.5 - 5;
    const ix2 = x + Math.cos(a+Math.PI)*iconR;
    const iy2 = y + Math.sin(a+Math.PI)*iconR*0.5 + 5;

    ctx.beginPath();
    ctx.arc(ex2, ey2, 0.8, 0, Math.PI*2);
    ctx.fillStyle = `rgba(240,160,64,${0.5*pulse})`;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(ix2, iy2, 0.8, 0, Math.PI*2);
    ctx.fillStyle = `rgba(64,192,232,${0.5*pulse})`;
    ctx.fill();
  }

  // Label
  ctx.fillStyle = `rgba(255,255,255,${0.8*pulse})`;
  ctx.font = 'bold 12px ' + getComputedStyle(document.body).fontFamily;
  ctx.textAlign = 'center';
  ctx.fillText('当下', x, y-50);

  ctx.fillStyle = `rgba(200,200,220,${0.5*pulse})`;
  ctx.font = '10px ' + getComputedStyle(document.body).fontFamily;
  ctx.fillText('能量×信息前所未有地交汇', x, y-36);

  // "GPT" hint
  ctx.fillStyle = `rgba(120,180,220,${0.35*pulse})`;
  ctx.font = '9px ' + getComputedStyle(document.body).fontFamily;
  ctx.fillText('GPT · AI · 智能革命', x, y+55);

  ctx.restore();
}

function drawInsightConnections(){
  // Connect insight nodes across eras to show the "backbone" of thought
  const insights = ALL_NODES.filter(n=>n.tp==='insight');
  if(insights.length<2) return;

  ctx.save();
  ctx.globalAlpha = 0.15;

  for(let i=0;i<insights.length-1;i++){
    const a=insights[i], b=insights[i+1];
    if(a.era===b.era) continue;
    const pa=screenPos(a), pb=screenPos(b);
    if(Math.abs(pa.x-pb.x)>W*1.2) continue;
    ctx.beginPath();
    ctx.moveTo(pa.x,pa.y);
    ctx.lineTo(pb.x,pb.y);
    ctx.strokeStyle = '#c8b48c';
    ctx.lineWidth = 0.6;
    ctx.stroke();
  }

  ctx.restore();
}

function drawEraLabelsTop(){
  // Update DOM-based era labels
  const container = document.getElementById('era-labels');
  let html = '';
  for(let i=0;i<ERA_ORDER.length;i++){
    const ek = ERA_ORDER[i];
    const ei = ERAS[ek];
    const x = (i/Math.max(ERA_ORDER.length-1,1))*totalWidth() - camX;
    const leftPct = (x/W*100).toFixed(1);
    const visible = x>-60 && x<W+60;
    if(visible){
      const nearCenter = Math.abs(x-W/2) < W*0.12;
      html += `<div class="era-label${nearCenter?' highlight':''}" style="left:${leftPct}%">${ei.name}</div>`;
    }
  }

  // Only update every so often for performance
  if(Math.floor(time/200) !== Math.floor((time-16)/200)){
    container.innerHTML = html;
  }
}

function render(ts){
  time = ts;
  ctx.clearRect(0,0,W,H);

  // Smooth camera
  camX += (targetCamX-camX)*0.07;
  camY += (targetCamY-camY)*0.07;
  zoom += (targetZoom-zoom)*0.07;

  ctx.save();
  ctx.translate(W/2, H/2);
  ctx.scale(zoom, zoom);
  ctx.translate(-W/2, -H/2);

  drawHelix();
  drawInsightConnections();
  drawEraMarkers();
  drawNowMarker();
  drawNodes();

  ctx.restore();

  drawEraLabelsTop();

  // Update node count
  const inView = ALL_NODES.filter(n=>{
    const p=screenPos(n);
    return p.x>-20&&p.x<W+20&&p.y>-20&&p.y<H+20;
  }).length;
  document.getElementById('node-count').innerHTML =
    `视野中 <strong style="color:var(--accent)">${inView}</strong> 节点<br><span style="font-size:0.6rem">共 ${ALL_NODES.length} 个时空坐标</span>`;
}

// ============================================================
// INTERACTION
// ============================================================
canvas.addEventListener('mousedown',e=>{
  dragging=true;
  dsx=e.clientX; dsy=e.clientY;
  dcx=camX; dcy=camY;
  canvas.style.cursor='grabbing';
});

canvas.addEventListener('mousemove',e=>{
  mx=e.clientX; my=e.clientY;

  if(dragging){
    camX=dcx+(dsx-e.clientX)/zoom;
    camY=dcy+(dsy-e.clientY)/zoom;
    targetCamX=camX; targetCamY=camY;
    return;
  }

  // Hit test
  let newHover=null;
  // Check highlights + nearby nodes first
  const candidates = ALL_NODES.filter(n=>{
    const p=screenPos(n);
    return Math.abs(p.x-mx)<40 && Math.abs(p.y-my)<40;
  });
  for(const n of candidates){
    if(hitTest(mx,my,n,highlightIds.has(n.id)?26:18)){
      newHover=n;
      break;
    }
  }

  if(newHover!==hovered){
    hovered=newHover;
    updateTooltip(e);
    canvas.style.cursor=hovered?'pointer':'grab';
  }else if(hovered){
    updateTooltip(e);
  }
});

window.addEventListener('mouseup',()=>{
  if(dragging){
    const dx=Math.abs(mx-dsx), dy=Math.abs(my-dsy);
    if(dx<3&&dy<3&&hovered){
      openCard(hovered);
    }
  }
  dragging=false;
  canvas.style.cursor=hovered?'pointer':'grab';
});

canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  const factor = e.deltaY>0?0.9:1.1;
  // Zoom toward mouse
  const newZoom = Math.max(0.2,Math.min(3,targetZoom*factor));
  const mxNorm = (e.clientX-W/2)/targetZoom;
  const myNorm = (e.clientY-H/2)/targetZoom;
  targetCamX += mxNorm*(targetZoom-newZoom);
  targetCamY += myNorm*(targetZoom-newZoom);
  targetZoom = newZoom;
},{passive:false});

// Touch
canvas.addEventListener('touchstart',e=>{
  if(e.touches.length===1){
    dragging=true;
    dsx=e.touches[0].clientX; dsy=e.touches[0].clientY;
    dcx=camX; dcy=camY;
  }
});
canvas.addEventListener('touchmove',e=>{
  if(dragging&&e.touches.length===1){
    camX=dcx+(dsx-e.touches[0].clientX)/zoom;
    camY=dcy+(dsy-e.touches[0].clientY)/zoom;
    targetCamX=camX; targetCamY=camY;
  }
});
canvas.addEventListener('touchend',()=>{dragging=false;});

function updateTooltip(e){
  const tt=document.getElementById('tooltip');
  if(!hovered){tt.style.opacity='0';return;}

  const axLabel = hovered.ax==='energy'?'能量链':hovered.ax==='information'?'信息链':'能量×信息';
  const axCls = hovered.ax;
  const eraName = ERAS[hovered.e] ? ERAS[hovered.e].name : '';

  tt.innerHTML=`
    <div class="tt-era">${eraName} · ${axLabel}${hovered.tp==='insight'?' · 核心洞见':''}</div>
    <div class="tt-title">${escapeHtml(hovered.t)}</div>
    <span class="tt-tag ${axCls}">${
      hovered.tp==='insight'?'核心洞见':
      hovered.tp==='technology'?'技术/发明':
      hovered.tp==='institution'?'制度创新':
      hovered.tp==='idea'?'思想/科学':
      hovered.tp==='civilization'?'文明兴衰':'历史事件'
    }</span>
  `;
  tt.style.left=(e.clientX+22)+'px';
  tt.style.top=(e.clientY-50)+'px';
  tt.style.opacity='1';
}

function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ============================================================
// CARD
// ============================================================
function openCard(node){
  activeCard = node;
  const axLabel = node.ax==='energy'?'能量链':node.ax==='information'?'信息链':'能量×信息';
  const axCls = node.ax;
  const eraName = ERAS[node.e] ? ERAS[node.e].name : '';
  const typeLabels = {
    insight:'核心洞见', technology:'技术/发明', institution:'制度创新',
    idea:'思想/科学', civilization:'文明兴衰', event:'历史事件'
  };

  document.getElementById('c-era').textContent = eraName;
  document.getElementById('c-title').textContent = node.t;

  let tagsHtml = `<span class="c-tag ${axCls}">${axLabel}</span>`;
  tagsHtml += `<span class="c-tag insight">${typeLabels[node.tp]||'事件'}</span>`;
  document.getElementById('c-tags').innerHTML = tagsHtml;

  // Get full content if it's a highlight
  let bodyHtml = '';
  if(highlightIds.has(node.id) && HIGHLIGHTS[node.id]){
    const hc = HIGHLIGHTS[node.id];
    bodyHtml = `<p>${escapeHtml(hc.c)}</p>`;
    bodyHtml += `<p style="margin-top:16px;font-size:0.7rem;color:var(--text-dim)">📖 摘自吴军笔记 #${node.id}</p>`;
  } else {
    bodyHtml = `<p>${escapeHtml(node.ex)}</p>`;
    bodyHtml += `<p style="margin-top:16px;font-size:0.7rem;color:var(--text-dim)">📍 这是545篇历史笔记中的一个节点。缩放探索更多。</p>`;
  }

  document.getElementById('c-body').innerHTML = bodyHtml;
  document.getElementById('card-overlay').classList.add('open');
}

function closeCard(){
  document.getElementById('card-overlay').classList.remove('open');
  activeCard=null;
}
window.closeCard = closeCard;

// ============================================================
// SEARCH
// ============================================================
function doSearch(){
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  const resultsEl = document.getElementById('search-results');

  if(!q || q.length<1){
    resultsEl.classList.remove('show');
    return;
  }

  const matches = ALL_NODES.filter(n=>
    n.t.toLowerCase().includes(q) || n.ex.toLowerCase().includes(q)
  ).slice(0,20);

  if(matches.length===0){
    resultsEl.innerHTML = '<div class="sr-item" style="color:var(--text-dim)">未找到匹配节点</div>';
  } else {
    resultsEl.innerHTML = matches.map(n=>{
      const eraName = ERAS[n.e]?ERAS[n.e].name:'';
      return `<div class="sr-item" onmousedown="event.preventDefault()" onclick="navigateToNode(${n.id})">
        <div class="sri-era">${eraName}</div>
        <div>${escapeHtml(n.t)}</div>
      </div>`;
    }).join('');
  }
  resultsEl.classList.add('show');
}

function navigateToNode(id){
  const node = ALL_NODES.find(n=>n.id===id);
  if(!node) return;
  const p = screenPos(node);
  targetCamX = nodeX(node) - W/2;
  targetCamY = nodeY(node) - H/2;
  targetZoom = 1.5;
  document.getElementById('search-results').classList.remove('show');
  document.getElementById('search-input').value = '';
  setTimeout(()=>{
    hovered = node;
    openCard(node);
  }, 400);
}
window.navigateToNode = navigateToNode;

// ============================================================
// MODES
// ============================================================
document.querySelectorAll('.mode-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const newMode = btn.dataset.mode;

    if(newMode==='search'){
      const sb = document.getElementById('search-box');
      sb.classList.toggle('visible');
      if(sb.classList.contains('visible')){
        document.getElementById('search-input').focus();
      }
      return;
    }

    document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    mode = newMode;

    switch(mode){
      case 'river':
        targetZoom=0.7; targetCamX=totalWidth()*0.3; targetCamY=0;
        break;
      case 'lookback':
        targetZoom=1.2;
        const ci=ERA_ORDER.indexOf('classical');
        targetCamX=(ci/Math.max(ERA_ORDER.length-1,1))*totalWidth()-W/2;
        targetCamY=0;
        break;
      case 'birdseye':
        targetZoom=0.35; targetCamX=totalWidth()*0.3; targetCamY=H*0.08;
        break;
      case 'now':
        targetZoom=1.5;
        const ni=ERA_ORDER.indexOf('digital_age');
        targetCamX=(ni/Math.max(ERA_ORDER.length-1,1))*totalWidth()-W/2;
        targetCamY=0;
        break;
    }
  });
});

// ============================================================
// KEYBOARD
// ============================================================
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeCard();return;}
  if(e.target.tagName==='INPUT') return;
  if(e.key==='/'){e.preventDefault();document.getElementById('search-box').classList.add('visible');document.getElementById('search-input').focus();}
  if(e.key==='ArrowLeft') targetCamX-=100/zoom;
  if(e.key==='ArrowRight') targetCamX+=100/zoom;
  if(e.key==='ArrowUp') targetCamY-=100/zoom;
  if(e.key==='ArrowDown') targetCamY+=100/zoom;
  if(e.key==='+'||e.key==='=') targetZoom=Math.min(3,targetZoom*1.12);
  if(e.key==='-') targetZoom=Math.max(0.2,targetZoom*0.88);
  if(e.key==='0'){targetZoom=0.7;targetCamX=totalWidth()*0.3;targetCamY=0;}
  if(e.key==='f'){targetZoom=1.2;targetCamX=nodeX(ALL_NODES[0])-W/2;targetCamY=nodeY(ALL_NODES[0])-H/2;}
  if(e.key==='l'){const li=ALL_NODES.length-1;targetZoom=1.2;targetCamX=nodeX(ALL_NODES[li])-W/2;targetCamY=nodeY(ALL_NODES[li])-H/2;}
});

// ============================================================
// INTRO
// ============================================================
let introActive = true;
let quoteIndex = 0;
const quotesContainer = document.getElementById('quotes-container');

// Build quote elements
QUOTES.forEach((q,i)=>{
  const el = document.createElement('div');
  el.className = 'quote';
  el.innerHTML = `「${escapeHtml(q.text)}」<span class="src">—— ${escapeHtml(q.source)}</span>`;
  el.style.transitionDelay = (i*0.15)+'s';
  quotesContainer.appendChild(el);
});

function showNextQuote(){
  const quotes = quotesContainer.querySelectorAll('.quote');
  if(quoteIndex < quotes.length){
    quotes[quoteIndex].classList.add('visible');
    quoteIndex++;
    if(quoteIndex < quotes.length){
      setTimeout(showNextQuote, 800);
    } else {
      // Show enter button
      setTimeout(()=>{
        document.getElementById('enter-btn').classList.add('visible');
      }, 400);
    }
  }
}

// Start quote sequence
setTimeout(showNextQuote, 400);

function enterExperience(){
  introActive = false;
  document.getElementById('intro').classList.add('fade');
  // Auto-hide hint after some time
  setTimeout(()=>{
    document.getElementById('hint').style.opacity='0';
  }, 12000);
}
window.enterExperience = enterExperience;

// Allow clicking anywhere on intro to enter
document.getElementById('intro').addEventListener('click',function(e){
  if(e.target===this && introActive){
    enterExperience();
  }
});

// ============================================================
// MAIN LOOP
// ============================================================
function animate(ts){
  drawStars(ts);
  if(!introActive){
    render(ts);
  }
  requestAnimationFrame(animate);
}

// Initial camera position
targetCamX = totalWidth() * 0.3;
targetCamY = H * 0.04;
camX = targetCamX;
camY = targetCamY;

requestAnimationFrame(animate);

// Handle resize
window.addEventListener('resize',()=>{
  resizeAll();
  initStars();
});
</script>
</body>

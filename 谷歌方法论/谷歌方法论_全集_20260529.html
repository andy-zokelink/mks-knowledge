&lt;!-- ========== TAB 8: 案例分析 ========== --&gt;
&lt;div class=&quot;tab-content&quot; data-tab=&quot;7&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h2&gt;案例分析：俾斯麦与德意志统一&lt;/h2&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;
  &lt;div class=&quot;case-section&quot;&gt;
    &lt;h4&gt;【核心事件】&lt;/h4&gt;
    &lt;p&gt;1862-1871年，普鲁士首相俾斯麦通过三场精心设计的外交战——普丹战争（1864）、普奥战争（1866）、普法战争（1870-71）——完成德意志统一。他的真实风格并非&quot;铁血&quot;，而是&quot;外交优先、功利务实&quot;。&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;case-section&quot;&gt;
    &lt;h4&gt;【MKS 四维度拆解】&lt;/h4&gt;
    &lt;p&gt;&lt;strong&gt;能量维度：&lt;/strong&gt;普鲁士的军事工业与铁路系统构成了统一的&quot;能量基础&quot;——高效动员军队、快速运输物资的能力远超对手。&lt;/p&gt;
    &lt;p&gt;&lt;strong&gt;信息维度：&lt;/strong&gt;俾斯麦精通多门外语（英法俄波意），长期外交经历使他能精准把握各国意图。每次战前都确保英法俄中立，通过信息优势隔离敌人。&lt;/p&gt;
    &lt;p&gt;&lt;strong&gt;合作维度：&lt;/strong&gt;非零和博弈的经典实践。普奥战争中击败奥地利后制止进军维也纳，签订宽容和约——不是消灭对手，而是留作未来合作伙伴。&lt;/p&gt;
    &lt;p&gt;&lt;strong&gt;规则维度：&lt;/strong&gt;统一后制定全球首个劳工立法，打压左派的同时建立规则——实现&quot;自上而下的改良&quot;而非革命。&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;case-section&quot;&gt;
    &lt;h4&gt;【核心启示】&lt;/h4&gt;
    &lt;p&gt;俾斯麦的三大核心智慧——强目的性（不做无目标之事）、功利原则（不做对德国长期无益之举）、避免冲突（尽量外交解决）——是一切重大决策的通用方法论。&lt;/p&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

  {q:&quot;俾斯麦的三大核心智慧是什么？对现代管理有何启示？&quot;, ans:&quot;1.强目的性：做任何事都有明确目标，不逞一时之快。2.功利原则：不做对德国长期无好处的事，动武时避免画蛇添足。3.避免冲突：尽量通过外交手段达成目的，减少撕破脸。现代管理启示：聚焦核心目标、追求长期利益而非短期胜利、优先沟通协调而非正面冲突。&quot;},
  {q:&quot;吴军如何评价俄罗斯和印度的未来前景？核心判断依据是什么？&quot;, ans:&quot;俄罗斯前景暗淡：地理边缘化、可利用土地有限、经济结构单一（资源依赖）、缺乏劳动改变经济地位的动力、工业创新滞后。印度有望打破G2：人口年轻（未来劳动力大国）、藏富于民、数理人才丰富、地理位置优越、历史上长期为全球GDP第二。核心判断依据是国民是否有&#x27;通过劳动改变经济地位的原动力&#x27;。&quot;},
  {q:&quot;日神精神与酒神精神的关系是什么？为什么创造力需要酒神精神？&quot;, ans:&quot;二者互补而非对立，共同构成完整人性。日神（阿波罗）代表理性、秩序、节制；酒神（狄奥尼索斯）代表生命力、迷狂、突破禁忌。创造力需要酒神精神因为真正的突破往往需要打破常规——梵高的绘画、乔布斯的创新、王羲之醉写《兰亭序》都是酒神驱动的。尼采认为纯理性文化会导致僵化，需要酒神精神来复活创造力。&quot;},
  {q:&quot;从&#x27;文明起源&#x27;的土匪故事中，能得出什么关于规则制定的核心启示？&quot;, ans:&quot;1.看似不合理的&#x27;一刀切&#x27;规则往往是复杂条件下维持秩序的唯一可行方案（如高考统一分数录取确保基本公平）；2.规则一旦被破坏，恢复平衡需漫长时间，可能反复推倒重来；3.长期利益导向比短期利益最大化更重要——土匪征5%税率是因为&#x27;无法迁移只能可持续掠夺&#x27;，而国民政府预征百年税款则失去民心。&quot;},
  {q:&quot;信息论如何帮助人们应对不确定性的世界？&quot;, ans:&quot;香农揭示不确定性与信息量的等价关系。核心方法论：利用信息消除不确定性。具体而言：1.排除噪音提取有效信息（科学决策）；2.平衡资源分配增加沟通带宽（放大影响力）；3.掌握信息应用逻辑与通信趋势（抓住新机遇）。大数据思维、AI、5G等技术本质上都是信息论方法论的应用。&quot;},
  {q:&quot;分别从&#x27;能量&#x27;和&#x27;信息&#x27;两个维度分析全球化贸易的本质。&quot;, ans:&quot;能量维度：贸易本质是能量（资源、商品、劳动力）的跨地域流动与优化配置。瓷器、香料、石油的全球贸易都是能量载体的流通。信息维度：贸易依赖信息沟通——从丝绸之路的口耳相传到海运提单的标准化编码，再到区块链的数据确权。信息效率决定贸易效率。文明三公式中E=mc²揭示物质的能量本质，熵揭示信息的不确定性——全球化贸易既在交换能量，也在交换信息。&quot;}

let currentCard = 0;
let cardLearned = new Array(10).fill(false);

// ==================== UTILS ====================
function lsGet(k, def) { try { const v = localStorage.getItem(&#x27;mks_civ_&#x27;+k); return v !== null ? JSON.parse(v) : def; } catch(e) { return def; } }
function lsSet(k, v) { try { localStorage.setItem(&#x27;mks_civ_&#x27;+k, JSON.stringify(v)); } catch(e) {} }

function loadState() {
  cardLearned = lsGet(&#x27;cardLearned&#x27;, new Array(10).fill(false));
  totalAnswered = lsGet(&#x27;totalAnswered&#x27;, 0);
  totalCorrect = lsGet(&#x27;totalCorrect&#x27;, 0);
  wrongList = lsGet(&#x27;wrongList&#x27;, []);
  conceptWeak = lsGet(&#x27;conceptWeak&#x27;, {});
  const savedDays = lsGet(&#x27;studyDays&#x27;, {date:&#x27;&#x27;, count:1});
  const today = new Date().toDateString();
  if (savedDays.date !== today) { savedDays.date = today; savedDays.count++; lsSet(&#x27;studyDays&#x27;, savedDays); }
  document.getElementById(&#x27;statDays&#x27;).textContent = savedDays.count;
}

function saveState() { lsSet(&#x27;cardLearned&#x27;, cardLearned); lsSet(&#x27;totalAnswered&#x27;, totalAnswered); lsSet(&#x27;totalCorrect&#x27;, totalCorrect); lsSet(&#x27;wrongList&#x27;, wrongList); lsSet(&#x27;conceptWeak&#x27;, conceptWeak); }

// ==================== TAB NAV ====================
document.querySelectorAll(&#x27;.tab-btn&#x27;).forEach(btn =&gt; {
  btn.addEventListener(&#x27;click&#x27;, function() {
    document.querySelectorAll(&#x27;.tab-btn&#x27;).forEach(b =&gt; b.classList.remove(&#x27;active&#x27;));
    document.querySelectorAll(&#x27;.tab-content&#x27;).forEach(c =&gt; c.classList.remove(&#x27;active&#x27;));
    this.classList.add(&#x27;active&#x27;);
    var t = document.querySelector(&#x27;.tab-content[data-tab=&quot;&#x27; + this.dataset.tab + &#x27;&quot;]&#x27;);
    if (t) t.classList.add(&#x27;active&#x27;);
    if (this.dataset.tab === &#x27;2&#x27;) renderQuiz();
    if (this.dataset.tab === &#x27;4&#x27;) renderReview();
    if (this.dataset.tab === &#x27;6&#x27;) renderSocratic();
    if (this.dataset.tab === &#x27;8&#x27;) renderDecision();
  });
});

// ==================== FLASHCARD ====================
function updateFlashcard() {
  const d = flashcardData[currentCard];
  document.getElementById(&#x27;fcName&#x27;).textContent = d.name;
  document.getElementById(&#x27;fcBack&#x27;).innerHTML = &#x27;&lt;div class=&quot;dim&quot;&gt;&lt;strong&gt;定义：&lt;/strong&gt;&#x27;+d.def+&#x27;&lt;/div&gt;&lt;div class=&quot;dim&quot;&gt;&lt;strong&gt;类比（商业场景）：&lt;/strong&gt;&#x27;+d.analog+&#x27;&lt;/div&gt;&lt;div class=&quot;dim&quot;&gt;&lt;strong&gt;示例：&lt;/strong&gt;&#x27;+d.example+&#x27;&lt;/div&gt;&lt;div class=&quot;dim&quot;&gt;&lt;strong&gt;反例：&lt;/strong&gt;&#x27;+d.anti+&#x27;&lt;/div&gt;&#x27;;
  document.getElementById(&#x27;fcIndex&#x27;).textContent = (currentCard+1)+&#x27; / 10&#x27;;
  const lb = document.getElementById(&#x27;learnedBtn&#x27;);
  lb.textContent = cardLearned[currentCard] ? &#x27;✓ 已学习 ✓&#x27; : &#x27;✓ 已学习&#x27;;
  if (cardLearned[currentCard]) lb.classList.add(&#x27;learned&#x27;); else lb.classList.remove(&#x27;learned&#x27;);
  document.getElementById(&#x27;flashcard&#x27;).classList.remove(&#x27;flipped&#x27;);
}
function flipCard() { document.getElementById(&#x27;flashcard&#x27;).classList.toggle(&#x27;flipped&#x27;); }
function prevCard(e) { e.stopPropagation(); currentCard = (currentCard-1+10)%10; updateFlashcard(); }
function nextCard(e) { e.stopPropagation(); currentCard = (currentCard+1)%10; updateFlashcard(); }
function markLearned(e) { e.stopPropagation(); cardLearned[currentCard] = !cardLearned[currentCard]; updateFlashcard(); updateProgress(); saveState(); }
function updateProgress() {
  const n = cardLearned.filter(v=&gt;v).length;
  document.getElementById(&#x27;cardProgress&#x27;).textContent = n+&#x27; / 10&#x27;;
  document.getElementById(&#x27;cardProgressBar&#x27;).style.width = (n*10)+&#x27;%&#x27;;
  if (totalAnswered &gt; 0) {
    const rate = Math.round(totalCorrect/totalAnswered*100);
    document.getElementById(&#x27;quizProgress&#x27;).textContent = rate+&#x27;%&#x27;;
    document.getElementById(&#x27;quizProgressBar&#x27;).style.width = rate+&#x27;%&#x27;;
  }
}

    h += &#x27;&lt;div class=&quot;quiz-card&quot;&gt;&lt;div class=&quot;q-stem&quot;&gt;&#x27;+(i+1)+&#x27;. &#x27;+q.q+&#x27;&lt;/div&gt;&#x27;;
    q.opts.forEach((o,j) =&gt; {
      h += &#x27;&lt;div class=&quot;option&quot; onclick=&quot;selectMCQ(this,&#x27;+i+&#x27;,&#x27;+j+&#x27;)&quot;&gt;&#x27;+labels[j]+&#x27;. &#x27;+o+&#x27;&lt;/div&gt;&#x27;;
    });
    h += &#x27;&lt;div class=&quot;feedback&quot; id=&quot;fb&#x27;+i+&#x27;&quot; style=&quot;display:none&quot;&gt;&lt;/div&gt;&lt;/div&gt;&#x27;;
  });
  document.getElementById(&#x27;mcqContainer&#x27;).innerHTML = h;

  let sh = &#x27;&#x27;;
  saData.forEach((q,i) =&gt; {
    sh += &#x27;&lt;div class=&quot;sa-card&quot;&gt;&lt;div class=&quot;sa-q&quot;&gt;&#x27;+(i+1)+&#x27;. &#x27;+q.q+&#x27;&lt;/div&gt;&#x27;;
    sh += &#x27;&lt;textarea id=&quot;sa&#x27;+i+&#x27;&quot; placeholder=&quot;输入你的回答...&quot;&gt;&lt;/textarea&gt;&#x27;;
    sh += &#x27;&lt;div class=&quot;reveal-ans&quot; onclick=&quot;toggleAns(&#x27;+i+&#x27;)&quot;&gt;点击展开参考答案&lt;/div&gt;&#x27;;
    sh += &#x27;&lt;div class=&quot;ans-content&quot; id=&quot;ans&#x27;+i+&#x27;&quot;&gt;&#x27;+q.ans+&#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;
  });
  document.getElementById(&#x27;saContainer&#x27;).innerHTML = sh;
}

function selectMCQ(el, qi, oi) {
  const q = mcqData[qi];
  const fb = document.getElementById(&#x27;fb&#x27;+qi);
  if (el.parentElement.querySelector(&#x27;.correct&#x27;) || el.parentElement.querySelector(&#x27;.wrong&#x27;)) return;
  const opts = el.parentElement.querySelectorAll(&#x27;.option&#x27;);
  opts.forEach(o =&gt; o.classList.remove(&#x27;selected&#x27;));
  el.classList.add(&#x27;selected&#x27;);
  totalAnswered++;
  if (oi === q.ans) {
    el.classList.add(&#x27;correct&#x27;);
    fb.className = &#x27;feedback correct&#x27;;
    fb.textContent = &#x27;✅ 正确！&#x27;+q.exp;
    fb.style.display = &#x27;block&#x27;;
    totalCorrect++;
  } else {
    el.classList.add(&#x27;wrong&#x27;);
    opts[q.ans].classList.add(&#x27;correct&#x27;);
    fb.className = &#x27;feedback wrong&#x27;;
    const labels = [&#x27;A&#x27;,&#x27;B&#x27;,&#x27;C&#x27;,&#x27;D&#x27;];
    fb.textContent = &#x27;❌ 正确答案是 &#x27;+labels[q.ans]+&#x27;。&#x27;+q.exp;
    fb.style.display = &#x27;block&#x27;;
    wrongList.push({type:&#x27;mcq&#x27;, qi:qi, oi:oi, ans:q.ans, q:q.q, opts:q.opts, exp:q.exp});
    const conceptIdx = Math.floor(qi/2);
    conceptWeak[conceptIdx] = (conceptWeak[conceptIdx]||0)+1;
  }
  updateProgress();
  saveState();
}

function toggleAns(i) {
  document.getElementById(&#x27;ans&#x27;+i).classList.toggle(&#x27;show&#x27;);
}

// ==================== EXAM ====================
function startExam() {
  const mcqIndices = shuffle([...Array(20).keys()]).slice(0,7);
  const saIndices = shuffle([...Array(10).keys()]).slice(0,3);
  currentExam = {mcqIndices, saIndices, mcqAnswers:new Array(7).fill(-1), submitted:false};
  examTimeLeft = 900;
  document.getElementById(&#x27;examTimer&#x27;).style.display = &#x27;block&#x27;;
  document.getElementById(&#x27;examResult&#x27;).style.display = &#x27;none&#x27;;
  document.getElementById(&#x27;startExam&#x27;).style.display = &#x27;none&#x27;;
  renderExamContent();
  if (examTimerId) clearInterval(examTimerId);
  examTimerId = setInterval(tickExam, 1000);
}

function tickExam() {
  examTimeLeft--;
  const m = Math.floor(examTimeLeft/60), s = examTimeLeft%60;
  document.getElementById(&#x27;timeLeft&#x27;).textContent = m+&#x27;:&#x27;+String(s).padStart(2,&#x27;0&#x27;);
  if (examTimeLeft &lt;= 0) submitExam();
}

function renderExamContent() {
  let h = &#x27;&#x27;;
  const labels = [&#x27;A&#x27;,&#x27;B&#x27;,&#x27;C&#x27;,&#x27;D&#x27;];
  currentExam.mcqIndices.forEach((qi,i) =&gt; {
    const q = mcqData[qi];
    h += &#x27;&lt;div class=&quot;quiz-card&quot;&gt;&lt;div class=&quot;q-stem&quot;&gt;&#x27;+(i+1)+&#x27;. &#x27;+q.q+&#x27;&lt;/div&gt;&#x27;;
    q.opts.forEach((o,j) =&gt; {
      h += &#x27;&lt;div class=&quot;option&quot; id=&quot;exmcq&#x27;+i+&#x27;_&#x27;+j+&#x27;&quot; onclick=&quot;selectExamMCQ(&#x27;+i+&#x27;,&#x27;+j+&#x27;)&quot;&gt;&#x27;+labels[j]+&#x27;. &#x27;+o+&#x27;&lt;/div&gt;&#x27;;
    });
    h += &#x27;&lt;/div&gt;&#x27;;
  });
  currentExam.saIndices.forEach((qi,i) =&gt; {
    const q = saData[qi];
    h += &#x27;&lt;div class=&quot;sa-card&quot;&gt;&lt;div class=&quot;sa-q&quot;&gt;&#x27;+(8+i)+&#x27;. &#x27;+q.q+&#x27;&lt;/div&gt;&#x27;;
    h += &#x27;&lt;textarea id=&quot;exsa&#x27;+i+&#x27;&quot; placeholder=&quot;输入你的回答...&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;&#x27;;
  });
  h += &#x27;&lt;div style=&quot;text-align:center;margin-top:16px;&quot;&gt;&lt;button class=&quot;quiz-btn&quot; onclick=&quot;submitExam()&quot;&gt;提交试卷&lt;/button&gt;&lt;/div&gt;&#x27;;
  document.getElementById(&#x27;examContent&#x27;).innerHTML = h;
}

function selectExamMCQ(i, j) {
  if (currentExam.submitted) return;
  currentExam.mcqAnswers[i] = j;
  const card = document.getElementById(&#x27;exmcq&#x27;+i+&#x27;_0&#x27;).parentElement;
  card.querySelectorAll(&#x27;.option&#x27;).forEach(o=&gt;o.classList.remove(&#x27;selected&#x27;));
  document.getElementById(&#x27;exmcq&#x27;+i+&#x27;_&#x27;+j).classList.add(&#x27;selected&#x27;);
}

function submitExam() {
  if (currentExam.submitted) return;
  currentExam.submitted = true;
  if (examTimerId) { clearInterval(examTimerId); examTimerId = null; }
  let score = 0;
  currentExam.mcqIndices.forEach((qi,i) =&gt; {
    const q = mcqData[qi];
    const chosen = currentExam.mcqAnswers[i];
    if (chosen === q.ans) score++;
    else if (chosen &gt;= 0) {
      wrongList.push({type:&#x27;mcq&#x27;, qi:qi, oi:chosen, ans:q.ans, q:q.q, opts:q.opts, exp:q.exp});
      const conceptIdx = Math.floor(qi/2);
      conceptWeak[conceptIdx] = (conceptWeak[conceptIdx]||0)+1;
    }
    totalAnswered++;
    if (chosen === q.ans) totalCorrect++;
  });
  const elapsed = 900 - examTimeLeft;
  const resultHtml = &#x27;&lt;div class=&quot;exam-result&quot;&gt;&lt;div class=&quot;score&quot;&gt;&#x27;+score+&#x27; / 7&lt;/div&gt;&lt;p style=&quot;margin-top:8px;&quot;&gt;选择题得分（满分7分）&lt;/p&gt;&lt;p style=&quot;color:var(--text-light)&quot;&gt;用时 &#x27;+Math.floor(elapsed/60)+&#x27;分&#x27;+elapsed%60+&#x27;秒&lt;/p&gt;&lt;p style=&quot;margin-top:8px;color:var(--text-light)&quot;&gt;简答题请自行对照参考答案评分。总正确率已更新。&lt;/p&gt;&lt;/div&gt;&#x27;;
  document.getElementById(&#x27;examResult&#x27;).innerHTML = resultHtml;
  document.getElementById(&#x27;examResult&#x27;).style.display = &#x27;block&#x27;;
  document.getElementById(&#x27;examContent&#x27;).innerHTML = &#x27;&#x27;;
  document.getElementById(&#x27;startExam&#x27;).style.display = &#x27;inline-block&#x27;;
  updateProgress();
  saveState();
}

// ==================== REVIEW ====================
function renderReview() {
  document.getElementById(&#x27;statTotal&#x27;).textContent = totalAnswered;
  document.getElementById(&#x27;statCorrect&#x27;).textContent = totalCorrect;
  document.getElementById(&#x27;statRate&#x27;).textContent = totalAnswered&gt;0 ? Math.round(totalCorrect/totalAnswered*100)+&#x27;%&#x27; : &#x27;--&#x27;;
  const savedDays = lsGet(&#x27;studyDays&#x27;, {date:&#x27;&#x27;, count:1});
  document.getElementById(&#x27;statDays&#x27;).textContent = savedDays.count;

  if (wrongList.length === 0) {
    document.getElementById(&#x27;wrongBook&#x27;).innerHTML = &#x27;&lt;p style=&quot;color:var(--text-light);&quot;&gt;暂无错题，继续保持！&lt;/p&gt;&#x27;;
  } else {
    let h = &#x27;&#x27;;
    wrongList.forEach((w,i) =&gt; {
      const labels = [&#x27;A&#x27;,&#x27;B&#x27;,&#x27;C&#x27;,&#x27;D&#x27;];
      h += &#x27;&lt;div class=&quot;wrong-item&quot;&gt;&lt;strong&gt;#&#x27;+(i+1)+&#x27;&lt;/strong&gt; &#x27;+w.q+&#x27;&lt;br&gt;&lt;span style=&quot;color:#c0392b;&quot;&gt;你的答案: &#x27;+(w.oi&gt;=0?labels[w.oi]:&#x27;未作答&#x27;)+&#x27;&lt;/span&gt; | &lt;span style=&quot;color:#27ae60;&quot;&gt;正确: &#x27;+labels[w.ans]+&#x27;&lt;/span&gt;&lt;br&gt;&lt;span style=&quot;font-size:0.82rem;color:var(--text-light);&quot;&gt;&#x27;+w.exp+&#x27;&lt;/span&gt;&lt;/div&gt;&#x27;;
    });
    document.getElementById(&#x27;wrongBook&#x27;).innerHTML = h;
  }

  const conceptNames = [&#x27;文明三公式&#x27;,&#x27;非零和博弈&#x27;,&#x27;世界是能量的&#x27;,&#x27;农耕vs商业&#x27;,&#x27;日神与酒神&#x27;,&#x27;信息论&#x27;,&#x27;三大IT定律&#x27;,&#x27;规则与文明&#x27;,&#x27;旅行者困境&#x27;,&#x27;莎士比亚&#x27;];
  const keys = Object.keys(conceptWeak).sort((a,b)=&gt;conceptWeak[b]-conceptWeak[a]);
  if (keys.length === 0) {
    document.getElementById(&#x27;weakConcepts&#x27;).innerHTML = &#x27;&lt;p style=&quot;color:var(--text-light);&quot;&gt;尚无数据，做题后自动分析...&lt;/p&gt;&#x27;;
  } else {
    let h = &#x27;&#x27;;
    keys.forEach(k =&gt; {
      const n = conceptNames[parseInt(k)]||(&#x27;概念&#x27;+k);
      h += &#x27;&lt;div style=&quot;display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);&quot;&gt;&lt;span&gt;&#x27;+n+&#x27;&lt;/span&gt;&lt;span style=&quot;color:#c0392b;font-weight:bold;&quot;&gt;错误 &#x27;+conceptWeak[k]+&#x27; 次&lt;/span&gt;&lt;/div&gt;&#x27;;
    });
    document.getElementById(&#x27;weakConcepts&#x27;).innerHTML = h;
  }
}

function clearWrongBook() {
  wrongList = [];
  conceptWeak = {};
  saveState();
  renderReview();
}

// ==================== MINDMAP ====================
function toggleMindmap(el) {
  el.classList.toggle(&#x27;open&#x27;);
  const children = el.nextElementSibling;
  if (children &amp;&amp; children.classList.contains(&#x27;node-children&#x27;)) {
    children.classList.toggle(&#x27;open&#x27;);
  }
}

// ==================== SOCRATIC ====================
function renderSocratic() {
  let h = &#x27;&#x27;;
  socraticData.forEach((item,i) =&gt; {
    h += &#x27;&lt;div class=&quot;socratic-item&quot;&gt;&lt;div class=&quot;socratic-q&quot; onclick=&quot;toggleSocratic(&#x27;+i+&#x27;)&quot;&gt;&#x27;+(i+1)+&#x27;. &#x27;+item.q+&#x27;&lt;/div&gt;&#x27;;
    item.layers.forEach((layer,j) =&gt; {
      h += &#x27;&lt;div class=&quot;socratic-a&quot; id=&quot;soc&#x27;+i+&#x27;_&#x27;+j+&#x27;&quot;&gt;&#x27;+layer+&#x27;&lt;/div&gt;&#x27;;
    });
    h += &#x27;&lt;/div&gt;&#x27;;
  });
  document.getElementById(&#x27;socraticContainer&#x27;).innerHTML = h;
}
function toggleSocratic(i) {
  for (let j=0; j&lt;3; j++) {
    const el = document.getElementById(&#x27;soc&#x27;+i+&#x27;_&#x27;+j);
    if (el) el.classList.toggle(&#x27;show&#x27;);
  }
}

// ==================== DECISION ====================
function renderDecision() {
  let h = &#x27;&#x27;;
  decisionData.forEach(d =&gt; {
    h += &#x27;&lt;div class=&quot;decision-round&quot;&gt;&lt;div class=&quot;scenario&quot;&gt;&lt;strong&gt;第 &#x27;+d.round+&#x27; 轮：&lt;/strong&gt;&#x27;+d.scenario+&#x27;&lt;/div&gt;&#x27;;
    d.choices.forEach((c,ci) =&gt; {
      h += &#x27;&lt;button class=&quot;choice&quot; onclick=&quot;chooseDecision(this, \&#x27;&#x27;+d.round+&#x27;\&#x27;, &#x27;+ci+&#x27;)&quot;&gt;&#x27;+c.text+&#x27;&lt;/button&gt;&#x27;;
    });
    h += &#x27;&lt;div class=&quot;result&quot; id=&quot;decResult&#x27;+d.round+&#x27;&quot; style=&quot;background:#fffefb;&quot;&gt;&lt;/div&gt;&lt;/div&gt;&#x27;;
  });
  document.getElementById(&#x27;decisionContainer&#x27;).innerHTML = h;
}
function chooseDecision(el, round, ci) {
  const d = decisionData[round-1];
  const c = d.choices[ci];
  const result = document.getElementById(&#x27;decResult&#x27;+round);
  const fbColor = ci === 1 ? &#x27;#d5f5e3&#x27; : &#x27;#fff5f5&#x27;;
  result.style.display = &#x27;block&#x27;;
  result.style.background = fbColor;
  result.innerHTML = &#x27;&lt;p&gt;&lt;strong&gt;&#x27;+c.text.split(&#x27; &#x27;)[0]+&#x27;&lt;/strong&gt; &#x27;+c.fb+&#x27;&lt;/p&gt;&lt;p style=&quot;margin-top:6px;font-size:0.82rem;color:var(--accent);&quot;&gt;&lt;strong&gt;MKS分析：&lt;/strong&gt;&#x27;+c.mks+&#x27;&lt;/p&gt;&#x27;;
  el.parentElement.querySelectorAll(&#x27;.choice&#x27;).forEach(b =&gt; { b.style.opacity = &#x27;0.5&#x27;; b.style.pointerEvents = &#x27;none&#x27;; });
  el.style.opacity = &#x27;1&#x27;;
}

function shuffle(arr) { for (let i=arr.length-1;i&gt;0;i--) { const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }

.quiz-card .q-title { font-weight: bold; font-size: 0.95rem; margin-bottom: 12px; color: var(--text); }
.quiz-card .q-num { color: var(--accent); margin-right: 6px; }
.option { display: block; padding: 10px 14px; margin: 6px 0; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; transition: all 0.2s; font-size: 0.88rem; }
.option:hover { border-color: var(--accent); background: #fff8f6; }
.option.selected { background: #fef0ed; border-color: var(--accent); }
.option.correct { background: #e8f5e9; border-color: #4caf50; }
.option.wrong { background: #ffebee; border-color: var(--accent2); }
.quiz-feedback { margin-top: 10px; padding: 10px; border-radius: 8px; font-size: 0.85rem; display: none; }
.quiz-feedback.show { display: block; }
.quiz-feedback.ok { background: #e8f5e9; color: #2e7d32; }
.quiz-feedback.err { background: #ffebee; color: #c62828; }

.btn { padding: 10px 24px; border: none; border-radius: 20px; cursor: pointer; font-family: inherit; font-size: 0.88rem; transition: all 0.2s; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent2); }
.btn-outline { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
.btn-outline:hover { background: var(--accent); color: #fff; }
.btn-sm { padding: 5px 14px; font-size: 0.78rem; }
.btn-gold { background: var(--gold); color: #fff; }
.btn-gold:hover { opacity: 0.85; }

/* Mind map tree */
.tree { padding: 10px 0; }
.tree-node { margin-left: 0; }
.tree-label { cursor: pointer; padding: 6px 10px; border-radius: 6px; font-size: 0.88rem; display: inline-flex; align-items: center; gap: 6px; transition: background 0.15s; }
.tree-label:hover { background: #fef0ed; }
.tree-label .arr { font-size: 0.7rem; transition: transform 0.25s; display: inline-block; width: 14px; }
.tree-label .arr.open { transform: rotate(90deg); }
.tree-children { margin-left: 24px; overflow: hidden; transition: max-height 0.35s ease; }
.tree-children.collapsed { max-height: 0 !important; }
.tree-root &gt; .tree-label { font-weight: bold; color: var(--accent); font-size: 1rem; }

/* Socratic */
.socratic-item { margin-bottom: 14px; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--card); }
.socratic-q { padding: 14px 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 0.9rem; transition: background 0.15s; }
.socratic-q:hover { background: #fef8f5; }
.socratic-q .indicator { font-size: 1.1rem; color: var(--accent); transition: transform 0.25s; }
.socratic-q .indicator.open { transform: rotate(45deg); }
.socratic-a { padding: 0 16px; max-height: 0; overflow: hidden; transition: all 0.35s ease; }
.socratic-a.open { padding: 0 16px 16px; max-height: 500px; }
.socratic-a p { font-size: 0.85rem; line-height: 1.7; }

/* Case study */
.case-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.case-tab { padding: 8px 16px; border: 1px solid var(--border); background: var(--card); border-radius: 20px; cursor: pointer; font-size: 0.85rem; font-family: inherit; transition: all 0.2s; }
.case-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.case-content { display: none; animation: fadeIn 0.3s ease; }
.case-content.active { display: block; }
.case-choice { display: block; width: 100%; padding: 12px 16px; margin: 8px 0; border: 2px solid var(--border); border-radius: 10px; background: var(--card); cursor: pointer; text-align: left; font-family: inherit; font-size: 0.88rem; transition: all 0.2s; }
.case-choice:hover { border-color: var(--accent); }
.case-result { display: none; padding: 14px; border-radius: 8px; margin-top: 12px; font-size: 0.85rem; line-height: 1.7; }
.case-result.show { display: block; }

/* Stats */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px; }
.stat-item { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; text-align: center; }
.stat-item .val { font-size: 1.6rem; font-weight: bold; color: var(--accent); }
.stat-item .lbl { font-size: 0.78rem; color: var(--muted); margin-top: 4px; }

/* Table */
.tbl { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin: 12px 0; }
.tbl th { background: var(--accent); color: #fff; padding: 10px 12px; text-align: left; font-weight: normal; font-size: 0.82rem; }
.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
.tbl tr:nth-child(even) td { background: #fefaf7; }

/* Timer */
.timer { font-size: 1.2rem; font-weight: bold; color: var(--accent); text-align: center; margin: 12px 0; }
.timer.warn { color: #e67e22; animation: pulse 0.8s infinite; }
.timer.danger { color: var(--accent2); animation: pulse 0.4s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

/* Toast */
.toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #3d2f2f; color: #fff; padding: 10px 24px; border-radius: 24px; font-size: 0.85rem; z-index: 999; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
.toast.show { opacity: 1; }

/* Responsive */
@media (max-width: 600px) {
  .tab-bar { gap: 3px; padding: 6px 0 8px; }
  .tab-btn { padding: 5px 9px; font-size: 0.68rem; }
  .concept-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .flip-container { width: 240px; height: 300px; }
  .header h1 { font-size: 1.15rem; }
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
}

function toast(msg) {
  const t = document.getElementById(&#x27;toast&#x27;);
  t.textContent = msg; t.classList.add(&#x27;show&#x27;);
  clearTimeout(t._tid); t._tid = setTimeout(() =&gt; t.classList.remove(&#x27;show&#x27;), 1800);
}

function renderDashboard() {
  // Concept grid
  let cg = &#x27;&#x27;;
  concepts.forEach(c =&gt; {
    cg += &#x27;&lt;div class=&quot;concept-card&#x27; + (c.mks ? &#x27; mks&#x27; : &#x27;&#x27;) + &#x27;&quot; onclick=&quot;jumpToCard(&#x27; + c.id + &#x27;)&quot;&gt;&lt;div class=&quot;icon&quot;&gt;&#x27; + c.icon + &#x27;&lt;/div&gt;&lt;div class=&quot;name&quot;&gt;&#x27; + c.name + &#x27;&lt;/div&gt;&#x27; + (c.mks ? &#x27;&lt;div class=&quot;badge&quot;&gt;★ MKS&lt;/div&gt;&#x27; : &#x27;&#x27;) + &#x27;&lt;/div&gt;&#x27;;
  });
  document.getElementById(&#x27;conceptGrid&#x27;).innerHTML = cg;

  // MKS grid
  let mg = &#x27;&#x27;;
  concepts.filter(c =&gt; c.mks).forEach(c =&gt; {
    mg += &#x27;&lt;div class=&quot;concept-card mks&quot;&gt;&lt;div class=&quot;icon&quot;&gt;&#x27; + c.icon + &#x27;&lt;/div&gt;&lt;div class=&quot;name&quot;&gt;&#x27; + c.name + &#x27;&lt;/div&gt;&lt;div class=&quot;badge&quot;&gt;★ MKS&lt;/div&gt;&lt;/div&gt;&#x27;;
  });
  document.getElementById(&#x27;mksGrid&#x27;).innerHTML = mg;

  // Progress
  const pct = concepts.length ? Math.round(state.learnedConcepts.length / concepts.length * 100) : 0;
  document.getElementById(&#x27;progressPct&#x27;).textContent = pct + &#x27;%&#x27;;
  document.getElementById(&#x27;progressFill&#x27;).style.width = pct + &#x27;%&#x27;;

  // SVG
  renderSVG();
}

function jumpToCard(id) {
  state.cardIdx = id;
  document.querySelectorAll(&#x27;.tab-btn&#x27;).forEach(b =&gt; b.classList.remove(&#x27;active&#x27;));
  document.querySelectorAll(&#x27;.tab-panel&#x27;).forEach(p =&gt; p.classList.remove(&#x27;active&#x27;));
  document.querySelector(&#x27;[data-tab=&quot;1&quot;]&#x27;).classList.add(&#x27;active&#x27;);
  document.querySelector(&#x27;[data-panel=&quot;1&quot;]&#x27;).classList.add(&#x27;active&#x27;);
  renderCard();
  window.scrollTo({ top: 200, behavior: &#x27;smooth&#x27; });
}

// ============ FLIP CARDS (Tab 1) ============
function renderCard() {
  const c = concepts[state.cardIdx];
  document.getElementById(&#x27;fcIcon&#x27;).textContent = c.icon;
  document.getElementById(&#x27;fcName&#x27;).textContent = c.name;
  document.getElementById(&#x27;fcBack&#x27;).innerHTML = &#x27;&lt;div class=&quot;dim&quot;&gt;定义&lt;/div&gt;&lt;p&gt;&#x27; + c.def + &#x27;&lt;/p&gt;&lt;div class=&quot;dim&quot;&gt;类比（商业/财务场景）&lt;/div&gt;&lt;p&gt;&#x27; + c.analog + &#x27;&lt;/p&gt;&lt;div class=&quot;dim&quot;&gt;示例&lt;/div&gt;&lt;p&gt;&#x27; + c.example + &#x27;&lt;/p&gt;&lt;div class=&quot;dim&quot;&gt;反例（什么不是）&lt;/div&gt;&lt;p&gt;&#x27; + c.anti + &#x27;&lt;/p&gt;&#x27;;
  document.getElementById(&#x27;fcIndex&#x27;).textContent = (state.cardIdx + 1) + &#x27; / &#x27; + concepts.length;
  document.getElementById(&#x27;flipCard&#x27;).classList.remove(&#x27;flipped&#x27;);
}

function prevCard() { state.cardIdx = (state.cardIdx - 1 + concepts.length) % concepts.length; renderCard(); }
function nextCard() { state.cardIdx = (state.cardIdx + 1) % concepts.length; renderCard(); }

function markLearned() {
  const cid = concepts[state.cardIdx].id;
  if (!state.learnedConcepts.includes(cid)) {
    state.learnedConcepts.push(cid);
    toast(&#x27;★ 已标记：「&#x27; + concepts[state.cardIdx].name + &#x27;」学习完成&#x27;);
    saveState();
    if (document.querySelector(&#x27;[data-panel=&quot;0&quot;]&#x27;).classList.contains(&#x27;active&#x27;)) renderDashboard();
  } else {
    toast(&#x27;已学习过「&#x27; + concepts[state.cardIdx].name + &#x27;」&#x27;);
  }
}

function shuffleArr(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i &gt; 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function shuffleMCQ() {
  state.mcqOrder = shuffleArr([...Array(mcqBank.length).keys()]);
  state.mcqAnswered = {};
  renderMCQ();
  toast(&#x27;题目已随机排序&#x27;);
}

function renderMCQ() {
  if (!state.mcqOrder.length) shuffleMCQ();
  let h = &#x27;&#x27;;
  state.mcqOrder.forEach((qi, idx) =&gt; {
    const q = mcqBank[qi];
    h += &#x27;&lt;div class=&quot;quiz-card&quot;&gt;&lt;div class=&quot;q-title&quot;&gt;&lt;span class=&quot;q-num&quot;&gt;#&#x27; + (idx + 1) + &#x27;&lt;/span&gt;&#x27; + q.q + &#x27;&lt;/div&gt;&#x27;;
    q.opts.forEach((o, oi) =&gt; {
      let cls = &#x27;option&#x27;;
      if (state.mcqAnswered &amp;&amp; state.mcqAnswered[qi] !== undefined) {
        if (oi === q.ans) cls += &#x27; correct&#x27;;
        else if (oi === state.mcqAnswered[qi]) cls += &#x27; wrong&#x27;;
      }
      h += &#x27;&lt;div class=&quot;&#x27; + cls + &#x27;&quot; data-q=&quot;&#x27; + qi + &#x27;&quot; data-o=&quot;&#x27; + oi + &#x27;&quot; onclick=&quot;selectMCQ(this)&quot; style=&quot;pointer-events:&#x27; + (state.mcqAnswered &amp;&amp; state.mcqAnswered[qi] !== undefined ? &#x27;none&#x27; : &#x27;auto&#x27;) + &#x27;;&quot;&gt;&#x27; + String.fromCharCode(65 + oi) + &#x27;. &#x27; + o + &#x27;&lt;/div&gt;&#x27;;
    });
    if (state.mcqAnswered &amp;&amp; state.mcqAnswered[qi] !== undefined) {
      const ok = state.mcqAnswered[qi] === q.ans;
      h += &#x27;&lt;div class=&quot;quiz-feedback show &#x27; + (ok ? &#x27;ok&#x27; : &#x27;err&#x27;) + &#x27;&quot;&gt;&#x27; + (ok ? &#x27;✓ 正确！&#x27; : &#x27;✗ 错误。正确答案是 &#x27; + String.fromCharCode(65 + q.ans) + &#x27;. &#x27; + q.opts[q.ans]) + &#x27;&lt;/div&gt;&#x27;;
    }
    h += &#x27;&lt;/div&gt;&#x27;;
  });
  document.getElementById(&#x27;mcqList&#x27;).innerHTML = h;
  document.getElementById(&#x27;mcqScore&#x27;).textContent = &#x27;&#x27;;
}

function selectMCQ(el) {
  const qi = parseInt(el.dataset.q);
  const oi = parseInt(el.dataset.o);
  if (!state.mcqAnswered) state.mcqAnswered = {};
  // Deselect siblings
  const siblings = el.parentElement.querySelectorAll(&#x27;.option&#x27;);
  siblings.forEach(s =&gt; s.classList.remove(&#x27;selected&#x27;));
  el.classList.add(&#x27;selected&#x27;);
  state.mcqAnswered[qi] = oi;
}

function checkAllMCQ() {
  if (!state.mcqAnswered) { toast(&#x27;请先选择答案&#x27;); return; }
  let total = 0, correct = 0;
  state.mcqOrder.forEach(qi =&gt; {
    if (state.mcqAnswered[qi] !== undefined) {
      total++;
      const ok = state.mcqAnswered[qi] === mcqBank[qi].ans;
      if (ok) correct++;
      // Track wrong
      if (!ok &amp;&amp; !state.wrongMCQ.includes(qi)) state.wrongMCQ.push(qi);
      if (ok &amp;&amp; state.wrongMCQ.includes(qi)) state.wrongMCQ = state.wrongMCQ.filter(x =&gt; x !== qi);
      state.mcqHistory[qi] = ok;
    }
  });
  state.totalAnswered += total;
  state.totalCorrect += correct;
  if (total &gt; 0 &amp;&amp; !LS.get(&#x27;studiedToday&#x27;, false)) {
    state.studyDays++;
    LS.set(&#x27;studiedToday&#x27;, true);
  }
  saveState();
  document.getElementById(&#x27;mcqScore&#x27;).textContent = &#x27;得分：&#x27; + correct + &#x27;/&#x27; + total + &#x27;（正确率 &#x27; + (total ? Math.round(correct / total * 100) : 0) + &#x27;%）&#x27;;
  renderMCQ();
  toast(&#x27;提交完成！&#x27; + correct + &#x27;/&#x27; + total);
}

// ============ SA (Tab 3) ============
function renderSA() {
  let h = &#x27;&#x27;;
  saBank.forEach((q, i) =&gt; {
    h += &#x27;&lt;div class=&quot;socratic-item&quot;&gt;&lt;div class=&quot;socratic-q&quot; onclick=&quot;toggleSA(this)&quot;&gt;&lt;span&gt;#&#x27; + (i + 1) + &#x27; &#x27; + q.q + &#x27;&lt;/span&gt;&lt;span class=&quot;indicator&quot;&gt;+&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;socratic-a&quot;&gt;&lt;p&gt;&#x27; + q.a.replace(/\n/g, &#x27;&lt;br&gt;&#x27;) + &#x27;&lt;/p&gt;&lt;div style=&quot;margin-top:8px;display:flex;gap:8px;&quot;&gt;&lt;button class=&quot;btn btn-sm btn-outline&quot; onclick=&quot;markSACorrect(&#x27; + i + &#x27;)&quot;&gt;✓ 我答对了&lt;/button&gt;&lt;button class=&quot;btn btn-sm btn-outline&quot; onclick=&quot;markSAWrong(&#x27; + i + &#x27;)&quot; style=&quot;border-color:#e74c3c;color:#e74c3c;&quot;&gt;✗ 我答错了&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&#x27;;
  });
  document.getElementById(&#x27;saList&#x27;).innerHTML = h;
}

function toggleSA(el) {
  const answer = el.nextElementSibling;
  const indicator = el.querySelector(&#x27;.indicator&#x27;);
  const isOpen = answer.classList.contains(&#x27;open&#x27;);
  answer.classList.toggle(&#x27;open&#x27;);
  if (isOpen) { indicator.classList.remove(&#x27;open&#x27;); indicator.textContent = &#x27;+&#x27;; }
  else { indicator.classList.add(&#x27;open&#x27;); indicator.textContent = &#x27;−&#x27;; }
}

function markSACorrect(i) {
  if (state.wrongSA.includes(i)) state.wrongSA = state.wrongSA.filter(x =&gt; x !== i);
  state.saHistory[i] = true;
  state.totalAnswered++; state.totalCorrect++;
  saveState();
  toast(&#x27;✓ 已记录为正确&#x27;);
}

function markSAWrong(i) {
  if (!state.wrongSA.includes(i)) state.wrongSA.push(i);
  state.saHistory[i] = false;
  state.totalAnswered++;
  saveState();
  toast(&#x27;✗ 已加入错题本&#x27;);
}

// ============ EXAM (Tab 4) ============
function startExam() {
  if (state.examActive) { clearInterval(state.examTimerId); }
  state.examActive = true;
  // Pick 7 MCQ + 3 SA
  const mcqPool = shuffleArr([...Array(mcqBank.length).keys()]).slice(0, 7);
  const saPool = shuffleArr([...Array(saBank.length).keys()]).slice(0, 3);
  state.examData = { mcq: mcqPool, sa: saPool, mcqAns: {}, saNotes: &#x27;&#x27;, startTime: Date.now(), submitted: false };

  let h = &#x27;&lt;div style=&quot;text-align:left;&quot;&gt;&#x27;;
  mcqPool.forEach((qi, idx) =&gt; {
    const q = mcqBank[qi];
    h += &#x27;&lt;div class=&quot;quiz-card&quot;&gt;&lt;div class=&quot;q-title&quot;&gt;&lt;span class=&quot;q-num&quot;&gt;选#&#x27; + (idx + 1) + &#x27;&lt;/span&gt;&#x27; + q.q + &#x27;&lt;/div&gt;&#x27;;
    q.opts.forEach((o, oi) =&gt; {
      h += &#x27;&lt;div class=&quot;option&quot; data-eq=&quot;&#x27; + qi + &#x27;&quot; data-eo=&quot;&#x27; + oi + &#x27;&quot; onclick=&quot;selectExamMCQ(this)&quot;&gt;&#x27; + String.fromCharCode(65 + oi) + &#x27;. &#x27; + o + &#x27;&lt;/div&gt;&#x27;;
    });
    h += &#x27;&lt;/div&gt;&#x27;;
  });
  saPool.forEach((qi, idx) =&gt; {
    h += &#x27;&lt;div class=&quot;quiz-card&quot;&gt;&lt;div class=&quot;q-title&quot;&gt;&lt;span class=&quot;q-num&quot;&gt;简#&#x27; + (idx + 1) + &#x27;&lt;/span&gt;&#x27; + saBank[qi].q + &#x27;&lt;/div&gt;&lt;textarea style=&quot;width:100%;min-height:80px;border:1px solid var(--border);border-radius:8px;padding:10px;font-family:inherit;font-size:0.85rem;background:var(--bg);&quot; placeholder=&quot;输入你的回答...&quot; data-esaq=&quot;&#x27; + qi + &#x27;&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;&#x27;;
  });
  h += &#x27;&lt;/div&gt;&#x27;;
  document.getElementById(&#x27;examArea&#x27;).innerHTML = h;
  document.getElementById(&#x27;examStart&#x27;).style.display = &#x27;none&#x27;;
  document.getElementById(&#x27;examSubmit&#x27;).style.display = &#x27;inline-block&#x27;;
  document.getElementById(&#x27;examRetry&#x27;).style.display = &#x27;none&#x27;;
  document.getElementById(&#x27;examResult&#x27;).textContent = &#x27;&#x27;;

  // Timer
  let sec = 15 * 60;
  document.getElementById(&#x27;examTimer&#x27;).textContent = &#x27;15:00&#x27;;
  document.getElementById(&#x27;examTimer&#x27;).classList.remove(&#x27;warn&#x27;, &#x27;danger&#x27;);
  state.examTimerId = setInterval(() =&gt; {
    sec--;
    const m = Math.floor(sec / 60), s = sec % 60;
    document.getElementById(&#x27;examTimer&#x27;).textContent = m + &#x27;:&#x27; + (s &lt; 10 ? &#x27;0&#x27; : &#x27;&#x27;) + s;
    if (sec &lt;= 60) document.getElementById(&#x27;examTimer&#x27;).classList.add(&#x27;danger&#x27;);
    else if (sec &lt;= 180) document.getElementById(&#x27;examTimer&#x27;).classList.add(&#x27;warn&#x27;);
    if (sec &lt;= 0) { clearInterval(state.examTimerId); submitExam(); toast(&#x27;时间到！考试已自动提交&#x27;); }
  }, 1000);
}

function selectExamMCQ(el) {
  const qi = parseInt(el.dataset.eq);
  const oi = parseInt(el.dataset.eo);
  const siblings = el.parentElement.querySelectorAll(&#x27;.option&#x27;);
  siblings.forEach(s =&gt; s.classList.remove(&#x27;selected&#x27;));
  el.classList.add(&#x27;selected&#x27;);
  state.examData.mcqAns[qi] = oi;
}

function submitExam() {
  if (!state.examActive || state.examData.submitted) return;
  state.examData.submitted = true;
  clearInterval(state.examTimerId);
  state.examActive = false;

  // Collect SA answers
  document.querySelectorAll(&#x27;[data-esaq]&#x27;).forEach(ta =&gt; {
    state.examData.saNotes += &#x27;【&#x27; + saBank[parseInt(ta.dataset.esaq)].q + &#x27;】\n&#x27; + (ta.value || &#x27;(未作答)&#x27;) + &#x27;\n\n&#x27;;
  });

  // Score
  let mcqCorrect = 0;
  state.examData.mcq.forEach(qi =&gt; {
    if (state.examData.mcqAns[qi] === mcqBank[qi].ans) mcqCorrect++;
    else {
      if (!state.wrongMCQ.includes(qi)) state.wrongMCQ.push(qi);
    }
  });

  state.totalAnswered += 7;
  state.totalCorrect += mcqCorrect;
  saveState();

  // Show feedback
  let resultHtml = &#x27;&lt;div style=&quot;margin-top:12px;&quot;&gt;&lt;strong&gt;选择题得分：&#x27; + mcqCorrect + &#x27;/7&lt;/strong&gt;&#x27;;
  if (mcqCorrect &gt;= 6) resultHtml += &#x27;&lt;p style=&quot;color:#2e7d32;&quot;&gt;优秀！你对核心概念掌握扎实。&lt;/p&gt;&#x27;;
  else if (mcqCorrect &gt;= 4) resultHtml += &#x27;&lt;p style=&quot;color:#e67e22;&quot;&gt;良好，建议复习MKS骨架概念。&lt;/p&gt;&#x27;;
  else resultHtml += &#x27;&lt;p style=&quot;color:#c62828;&quot;&gt;需要加强，请从★MKS概念开始重新学习。&lt;/p&gt;&#x27;;

  if (mcqCorrect &lt; 7) {
    resultHtml += &#x27;&lt;p style=&quot;font-size:0.82rem;color:var(--muted);&quot;&gt;错题已加入错题本。薄弱概念：&#x27;;
    const weak = new Set();
    state.examData.mcq.forEach(qi =&gt; { if (state.examData.mcqAns[qi] !== mcqBank[qi].ans) weak.add(qi); });
    resultHtml += [...weak].map(qi =&gt; mcqBank[qi].q.substring(0, 20) + &#x27;...&#x27;).join(&#x27;、&#x27;) + &#x27;&lt;/p&gt;&#x27;;
  }
  resultHtml += &#x27;&lt;/div&gt;&#x27;;

  document.getElementById(&#x27;examResult&#x27;).innerHTML = resultHtml;
  document.getElementById(&#x27;examSubmit&#x27;).style.display = &#x27;none&#x27;;
  document.getElementById(&#x27;examRetry&#x27;).style.display = &#x27;inline-block&#x27;;
  document.getElementById(&#x27;examTimer&#x27;).classList.remove(&#x27;warn&#x27;, &#x27;danger&#x27;);

  // Highlight correct/wrong
  document.querySelectorAll(&#x27;[data-eq]&#x27;).forEach(el =&gt; {
    const qi = parseInt(el.dataset.eq);
    const oi = parseInt(el.dataset.eo);
    if (oi === mcqBank[qi].ans) el.classList.add(&#x27;correct&#x27;);
    else if (oi === state.examData.mcqAns[qi]) el.classList.add(&#x27;wrong&#x27;);
    el.style.pointerEvents = &#x27;none&#x27;;
  });
}

// ============ WRONG BOOK (Tab 5) ============
function renderWrongBook() {
  document.getElementById(&#x27;statsGrid&#x27;).innerHTML =
    &#x27;&lt;div class=&quot;stat-item&quot;&gt;&lt;div class=&quot;val&quot;&gt;&#x27; + state.totalAnswered + &#x27;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;总答题数&lt;/div&gt;&lt;/div&gt;&#x27; +
    &#x27;&lt;div class=&quot;stat-item&quot;&gt;&lt;div class=&quot;val&quot;&gt;&#x27; + (state.totalAnswered ? Math.round(state.totalCorrect / state.totalAnswered * 100) : 0) + &#x27;%&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;总正确率&lt;/div&gt;&lt;/div&gt;&#x27; +
    &#x27;&lt;div class=&quot;stat-item&quot;&gt;&lt;div class=&quot;val&quot;&gt;&#x27; + state.studyDays + &#x27;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;学习天数&lt;/div&gt;&lt;/div&gt;&#x27; +
    &#x27;&lt;div class=&quot;stat-item&quot;&gt;&lt;div class=&quot;val&quot;&gt;&#x27; + state.wrongMCQ.length + &#x27;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;错题数&lt;/div&gt;&lt;/div&gt;&#x27;;

  if (state.wrongMCQ.length === 0 &amp;&amp; state.wrongSA.length === 0) {
    document.getElementById(&#x27;wrongList&#x27;).innerHTML = &#x27;&lt;p style=&quot;color:var(--muted);text-align:center;padding:20px;&quot;&gt;暂无错题，继续保持！&lt;/p&gt;&#x27;;
    return;
  }

  let h = &#x27;&lt;h4 style=&quot;margin-bottom:8px;&quot;&gt;选择题错题（&#x27; + state.wrongMCQ.length + &#x27;道）&lt;/h4&gt;&#x27;;
  state.wrongMCQ.forEach(qi =&gt; {
    const q = mcqBank[qi];
    h += &#x27;&lt;div class=&quot;quiz-card&quot;&gt;&lt;div class=&quot;q-title&quot;&gt;&#x27; + q.q + &#x27;&lt;/div&gt;&#x27;;
    q.opts.forEach((o, oi) =&gt; {
      h += &#x27;&lt;div class=&quot;option&#x27; + (oi === q.ans ? &#x27; correct&#x27; : &#x27;&#x27;) + &#x27;&quot;&gt;&#x27; + String.fromCharCode(65 + oi) + &#x27;. &#x27; + o + &#x27;&lt;/div&gt;&#x27;;
    });
    h += &#x27;&lt;div class=&quot;quiz-feedback show ok&quot;&gt;正确答案：&#x27; + String.fromCharCode(65 + q.ans) + &#x27;. &#x27; + q.opts[q.ans] + &#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;
  });

  if (state.wrongSA.length &gt; 0) {
    h += &#x27;&lt;h4 style=&quot;margin-bottom:8px;&quot;&gt;简答题错题（&#x27; + state.wrongSA.length + &#x27;道）&lt;/h4&gt;&#x27;;
    state.wrongSA.forEach(qi =&gt; {
      h += &#x27;&lt;div class=&quot;socratic-item&quot;&gt;&lt;div class=&quot;socratic-q&quot; onclick=&quot;toggleSA(this)&quot;&gt;&lt;span&gt;&#x27; + saBank[qi].q + &#x27;&lt;/span&gt;&lt;span class=&quot;indicator&quot;&gt;+&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;socratic-a&quot;&gt;&lt;p&gt;&#x27; + saBank[qi].a.replace(/\n/g, &#x27;&lt;br&gt;&#x27;) + &#x27;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&#x27;;
    });
  }

  document.getElementById(&#x27;wrongList&#x27;).innerHTML = h;
}

function clearWrongBook() {
  if (confirm(&#x27;确定清空所有错题记录？&#x27;)) {
    state.wrongMCQ = []; state.wrongSA = []; saveState();
    renderWrongBook();
    toast(&#x27;错题本已清空&#x27;);
  }
}

function redoWrong() {
  if (state.wrongMCQ.length === 0) { toast(&#x27;没有错题可重做&#x27;); return; }
  state.mcqOrder = state.wrongMCQ.slice();
  state.mcqAnswered = {};
  document.querySelectorAll(&#x27;.tab-btn&#x27;).forEach(b =&gt; b.classList.remove(&#x27;active&#x27;));
  document.querySelectorAll(&#x27;.tab-panel&#x27;).forEach(p =&gt; p.classList.remove(&#x27;active&#x27;));
  document.querySelector(&#x27;[data-tab=&quot;2&quot;]&#x27;).classList.add(&#x27;active&#x27;);
  document.querySelector(&#x27;[data-panel=&quot;2&quot;]&#x27;).classList.add(&#x27;active&#x27;);
  renderMCQ();
  toast(&#x27;已加载&#x27; + state.mcqOrder.length + &#x27;道错题，请重新作答&#x27;);
}

function renderTree(node, isRoot) {
  let h = &#x27;&lt;div class=&quot;tree-node&#x27; + (isRoot ? &#x27;&#x27; : &#x27;&#x27;) + &#x27;&quot;&gt;&#x27;;
  if (node.children &amp;&amp; node.children.length) {
    const nid = &#x27;tn_&#x27; + Math.random().toString(36).substr(2, 6);
    h += &#x27;&lt;div class=&quot;tree-label&quot; onclick=&quot;toggleTree(\&#x27;&#x27; + nid + &#x27;\&#x27;)&quot;&gt;&lt;span class=&quot;arr open&quot; id=&quot;arr_&#x27; + nid + &#x27;&quot;&gt;▶&lt;/span&gt;&#x27; + node.label + &#x27;&lt;/div&gt;&#x27;;
    h += &#x27;&lt;div class=&quot;tree-children&quot; id=&quot;&#x27; + nid + &#x27;&quot; style=&quot;max-height:2000px;&quot;&gt;&#x27;;
    node.children.forEach(c =&gt; { h += renderTree(c, false); });
    h += &#x27;&lt;/div&gt;&#x27;;
  } else {
    h += &#x27;&lt;div class=&quot;tree-label&quot; style=&quot;cursor:default;&quot;&gt;&lt;span class=&quot;arr&quot; style=&quot;visibility:hidden;&quot;&gt;▶&lt;/span&gt;&#x27; + node.label + &#x27;&lt;/div&gt;&#x27;;
  }
  h += &#x27;&lt;/div&gt;&#x27;;
  return h;
}

function toggleTree(nid) {
  const el = document.getElementById(nid);
  const arr = document.getElementById(&#x27;arr_&#x27; + nid);
  if (el.classList.contains(&#x27;collapsed&#x27;)) {
    el.classList.remove(&#x27;collapsed&#x27;);
    el.style.maxHeight = el.scrollHeight + &#x27;px&#x27;;
    arr.classList.add(&#x27;open&#x27;);
  } else {
    el.style.maxHeight = el.scrollHeight + &#x27;px&#x27;;
    requestAnimationFrame(() =&gt; { el.classList.add(&#x27;collapsed&#x27;); el.style.maxHeight = &#x27;0px&#x27;; });
    arr.classList.remove(&#x27;open&#x27;);
  }
}

      { text: &#x27;B. 选技术扎实的协作型工程师&#x27;, fb: &#x27;⚠ 看似安全但可能是&quot;武大郎开店&quot;心态。如果你的目标是行业第一，&quot;够用&quot;的人才永远不够。参考奥格威定律：雇用比你小的人→矮人公司；雇用比你高大的人→巨人公司。&#x27;, level: &#x27;mid&#x27; },
      { text: &#x27;C. 选有从0到1经验的创业型人才&#x27;, fb: &#x27;✅ 公司当前阶段最需要的是&quot;攻城&quot;能力而非&quot;守城&quot;能力。从0到1的经验意味着候选人习惯在资源受限的条件下创新——这正是Google早期工程文化的核心（&quot;瑞士制造&quot;精神：花更少资源做出更好的东西）。&#x27;, level: &#x27;good&#x27; },
    ]
  },
  {
    title: &#x27;第3轮：产品定价策略&#x27;,
    desc: &#x27;你开发了一款企业级SaaS产品。竞品全部免费（开源替代品）。你的产品在可靠性和用户体验上显著优于竞品。你应该如何定价？&#x27;,
    choices: [
      { text: &#x27;A. 免费——先占领市场再考虑变现&#x27;, fb: &#x27;❌ &quot;超越免费&quot;的反面案例。免费获取的用户没有切换成本，随时可能流失。Red Hat的启示：Linux免费但Red Hat的安装手册卖1万美元——通过&quot;可靠性&quot;将免费品包装为付费品。&#x27;, level: &#x27;bad&#x27; },
      { text: &#x27;B. 按竞品价格的一半定价——用价格战取胜&#x27;, fb: &#x27;⚠ 价格战是零和博弈。你降价→竞品跟进→利润归零→所有人受损。参考&quot;旅行者困境&quot;：竞相降价最终导致双输。而且低价格会降低用户对产品价值的感知（&quot;便宜没好货&quot;的心理锚定）。&#x27;, level: &#x27;mid&#x27; },
      { text: &#x27;C. 按为用户创造的价值定价——远高于竞品&#x27;, fb: &#x27;✅ 这就是&quot;超越免费&quot;中&quot;可靠性+个性化&quot;策略。Red Hat和日本二手车的经验：为可靠性付费3000-5000美元，比免费的N手车划算。你的产品&quot;可靠性和体验显著优于竞品&quot;本身就是定价权。关键不是比竞品便宜，而是证明你的产品创造的价值远超价格。&#x27;, level: &#x27;good&#x27; },
    ]
  }
];

function renderDecisionSim() {
  const container = document.getElementById(&#x27;decisionSim&#x27;);
  if (!container) return;
  container.innerHTML = decisionScenarios.map((sc, si) =&gt; `
    &lt;div class=&quot;quiz-card&quot; style=&quot;margin-bottom:16px&quot;&gt;
      &lt;h3 style=&quot;color:var(--accent);margin-bottom:8px&quot;&gt;${sc.title}&lt;/h3&gt;
      &lt;p style=&quot;font-size:.85rem;margin-bottom:10px&quot;&gt;${sc.desc}&lt;/p&gt;
      ${sc.choices.map((ch, ci) =&gt; `&lt;button class=&quot;case-choice&quot; onclick=&quot;chooseDecisionSim(${si},${ci},this)&quot; style=&quot;display:block;width:100%;text-align:left;&quot;&gt;${ch.text}&lt;/button&gt;`).join(&#x27;&#x27;)}
      &lt;div class=&quot;case-result&quot; id=&quot;decSimRes_${si}&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
  `).join(&#x27;&#x27;);
}

function chooseDecisionSim(si, ci, btn) {
  const siblings = btn.parentElement.querySelectorAll(&#x27;.case-choice&#x27;);
  siblings.forEach(s =&gt; { s.style.pointerEvents = &#x27;none&#x27;; s.style.opacity = &#x27;0.6&#x27;; });
  const ch = decisionScenarios[si].choices[ci];
  btn.style.borderColor = ch.level === &#x27;good&#x27; ? &#x27;#4caf50&#x27; : ch.level === &#x27;mid&#x27; ? &#x27;#e67e22&#x27; : &#x27;#e74c3c&#x27;;
  const result = document.getElementById(&#x27;decSimRes_&#x27; + si);
  result.innerHTML = &#x27;&lt;strong&gt;&#x27; + ch.fb + &#x27;&lt;/strong&gt;&#x27;;
  result.classList.add(&#x27;show&#x27;);
  result.style.background = ch.level === &#x27;good&#x27; ? &#x27;#e8f5e9&#x27; : ch.level === &#x27;mid&#x27; ? &#x27;#fff3e0&#x27; : &#x27;#ffebee&#x27;;
}

// ============ INIT ============
function init() {
  // Track study day
  const today = new Date().toISOString().slice(0, 10);
  const lastStudy = LS.get(&#x27;lastStudy&#x27;, &#x27;&#x27;);
  if (lastStudy !== today) {
    LS.set(&#x27;studiedToday&#x27;, false);
    LS.set(&#x27;lastStudy&#x27;, today);
  }

  renderDashboard();
  renderCard();
  shuffleMCQ();
  renderMCQ();
  renderSA();
  buildMindMap();
  renderSocratic();
  renderCases();
  renderWrongBook();
  renderDecisionSim();

  // Ensure tab 0 visible
  document.querySelector(&#x27;[data-panel=&quot;0&quot;]&#x27;).classList.add(&#x27;active&#x27;);
}

init();
&lt;/script&gt;

&lt;script&gt;
// ======== DATA ========
const concepts = [
{id:0,name:&quot;递归思维&quot;,icon:&quot;🔄&quot;,brief:&quot;自顶向下分解，简单重复解决复杂问题——计算机与人类思维最大的不同&quot;,mks:true,long:&quot;递归是计算机科学的精髓：将大问题转化为相同结构的小问题，通过终止条件避免死循环。人类倾向自底向上的递推，计算机擅长自顶向下的递归。&quot;,analogy:&quot;公司管理：CEO不直接管理每个员工，而是通过总监→经理→组长层层授权，每一层做相似的管理动作。&quot;,example:&quot;阶乘 N! = N×(N-1)!，八皇后问题通过假设前7行已摆好来递归求解，倒推工作法从截止日倒逼关键节点。&quot;,counter:&quot;「从前有座山」故事形似递归实为死循环——缺少终止条件。恋爱中反复原谅无底线承诺也是递归陷阱——没有结束条件的重复不是递归。&quot;},
{id:1,name:&quot;分治策略&quot;,icon:&quot;🧩&quot;,brief:&quot;大问题拆小问题，各自击破再合并——效率提升的根本方法论&quot;,mks:true,long:&quot;分治(Divide and Conquer)将复杂任务拆分为独立子任务并行处理，最后合并结果。MapReduce是分治在分布式计算中的工程实现，以廉价服务器集群取代超级计算机。&quot;,analogy:&quot;写一本书：先定大纲（分治），各章独立撰写（并行），最后统稿（合并）。比从头到尾顺序写高效得多。&quot;,example:&quot;归并排序：将数组递归二分至2元素一组，排序后逐层合并——100万数据从1万亿次计算降至2000万次。Google索引全球网页也按分治分配到各服务器。&quot;,counter:&quot;试图一次性解决整个问题而不拆分——比如直接写完整程序而不先设计模块架构，结果2万行代码难以维护。&quot;},
{id:2,name:&quot;量级思维&quot;,icon:&quot;📐&quot;,brief:&quot;区分芝麻与西瓜——小数字世界经验无法迁移到大数世界&quot;,mks:true,long:&quot;量级是比数量级更大的概念差距。小量级事物在大问题面前可忽略不计。成就=成功率×事情的量级×做事的速度——量级突破比微调成功率重要百倍。&quot;,analogy:&quot;10双鞋随意放，100双需分类，10000双必须建索引。管理方式随量级而质变——雅虎用目录分类管理网页，当网页从百万到百亿时崩溃，Google的索引思维胜出。&quot;,example:&quot;排序1亿数据：冒泡排序需1亿亿次运算（一辈子），快速排序仅需几百亿次（几分钟）。药厂分析数千病例 vs 基于海量基因数据的个性化制药——量级差决定疗效上限。&quot;,counter:&quot;省几分钱物料成本而牺牲产品溢价空间——山寨思维用芝麻换芝麻。王健林「先挣1个亿」不是炫富，是理解了量级：100万和1亿是不同量级的游戏。&quot;},
{id:3,name:&quot;等价性问题&quot;,icon:&quot;🔗&quot;,brief:&quot;把未知复杂问题映射为已知可解问题——一通百通的智慧&quot;,mks:false,long:&quot;科学的艺术在于找到未知复杂问题的已知等价问题。语音识别=通信解码问题，机器翻译=编码-传输-解码，基因测序=语言文字识别——本质上都是同一数学模型。&quot;,analogy:&quot;拼写纠错和通信纠错看似无关，底层都是「从含噪声信号中还原原始信息」——维特比算法同时解决两者，如同同一把钥匙开多把锁。&quot;,example:&quot;语音识别 = 通信问题（贾里尼克用信息论模型将错误率从30%降至10%），机器翻译 = 信道解码（奥科用统计方法实现突破），股票预测 = 信号处理（文艺复兴公司用通信模型预测市场）。&quot;,counter:&quot;为每个具体问题从头发明独立方案——低效且无法复用。正确的做法是先问「这个问题和哪个已知问题本质上一样？」&quot;},
{id:4,name:&quot;信息论&quot;,icon:&quot;📡&quot;,brief:&quot;信息消除不确定性——新信息源比模型优化重要得多&quot;,mks:true,long:&quot;香农信息论证明：缺乏新信息时，不确定性无法仅通过算法优化消除。Google搜索90%的改进来自新信息的发现，仅10%来自模型参数调整。信息优先于算法。&quot;,analogy:&quot;医生诊断：老医生比年轻医生准确率高，不是因为更聪明，而是「见过更多病例」（拥有更多信息）。大数据医疗的本质就是用海量病例信息消除诊断不确定性。&quot;,example:&quot;语音识别引入「主题信息」「语法信息」后识别率质变。PageRank引入网页被引次数信息颠覆搜索。微软Bing重算法优化，Google重信息获取——后者胜出。&quot;,counter:&quot;在缺乏新数据的情况下反复调模型参数——如同在枯井里打水。辛格博士每天分析信息不足导致的搜索失败案例，而非只优化算法代码。&quot;},
{id:5,name:&quot;阿姆达尔法则&quot;,icon:&quot;⚖️&quot;,brief:&quot;系统优化的优先级原则——解决当前瓶颈而非面面俱到&quot;,mks:false,long:&quot;系统整体提升 S=1/((1-p)+p/s)，p为瓶颈占比，s为瓶颈提升倍数。优先优化占系统资源最大的瓶颈，解决后动态调整下一瓶颈。这是IT行业快速进步的战术核心。&quot;,analogy:&quot;赶飞机：如果堵车占整个行程时间的70%，优化值机流程（占5%）没有意义。先解决堵车问题（走高速vs普通路），再优化其他环节。&quot;,example:&quot;CPU占60%计算时间→优化CPU提升25%；之后内存成为瓶颈(20%)→优化内存提升20%。全球碳排放：中美占43%，欧洲5国仅6%——减排应优先聚焦中美。&quot;,counter:&quot;面面俱到地优化所有环节——如同阿姆达尔公司试图在IBM主导的大型机赛道全面竞争。先解决瓶颈再看下一个，是科学而非平均主义。&quot;},
{id:6,name:&quot;数据结构与算法&quot;,icon:&quot;🌳&quot;,brief:&quot;二叉树、堆栈、哈希——计算机组织信息的核心工具&quot;,mks:false,long:&quot;数组找得快插得慢，链表插得快找得慢，哈希表牺牲空间换时间，二叉树通过左右分叉实现高效比较和排序。选择数据结构就是选择权衡。&quot;,analogy:&quot;图书馆管理：书架按编号顺序排列=数组（找书快，插入新书架难），每本书用链条串联=链表（插入方便，找书需从头遍历），索书号索引=哈希表（最快定位，但占用卡片柜空间）。&quot;,example:&quot;Trie树支持输入联想（搜索引擎自动补全），堆排序找Top N无需全排序（找最近加油站），二叉树排序高效且可遍历（网站目录、公司组织架构）。&quot;,counter:&quot;用数组存储经常增删的数据导致大量移动操作，或用链表做频繁随机访问导致逐一遍历——不匹配的数据结构会消灭算法优势。&quot;},
{id:7,name:&quot;工程思维&quot;,icon:&quot;🔧&quot;,brief:&quot;边界内做事——科学求量级突破，工程在约束下求最优解&quot;,mks:false,long:&quot;科学关注「有没有」和量级突破（百倍千倍提升），工程关注「好不好」和实际问题解决。计算机不是万能的——图灵机划定了可计算问题的理论边界，工程思维在边界内寻找相对最优解。&quot;,analogy:&quot;盖房子：科学告诉你材料强度上限（不能造无限高的楼），工程在限高内设计最优户型、成本和施工方案。超越物理边界的「永动机」式方案是徒劳的。&quot;,example:&quot;iPhone不追求单项技术绝对领先，而是成熟技术+整体优化平衡；苹果采用成熟触屏技术而非等待未验证方案。GPS定位从原理可行到产品可用需消除5个数量级的误差。&quot;,counter:&quot;科学家创业不顾工程成本（教授创业成功率低于学生），或工程师忽视科学边界试图突破理论极限（如试图造永动机）。&quot;},
{id:8,name:&quot;索引与查找&quot;,icon:&quot;🔍&quot;,brief:&quot;编号→索引→二分查找→哈希定位——从大海捞针到精准定位&quot;,mks:false,long:&quot;计算机处理海量数据的第一步是编号（Addressing），然后建立索引（记录位置而非内容），二分查找将范围每次缩小一半（13亿人中找人仅需31步），哈希更进一步实现O(1)常数级定位。&quot;,analogy:&quot;字典：从A到Z顺序找=遍历（慢），翻到大致位置二分查找=快（每次排除一半），记住每个单词的页码=索引（最快）。Google为每个词建索引，1毫秒找到上百万文档。&quot;,example:&quot;北京市2000万人中找「李强」：用姓名索引直接定位到第200万号区间，无需遍历全库。Windows Vista失败的核心原因：本地搜索索引占用50%硬盘和大量CPU——为低频需求支付过高成本。&quot;,counter:&quot;为小数据集建复杂索引或为一次性查询排序全量数据——成本远超收益。方法的成本需根据场景和规模决定。&quot;},
{id:9,name:&quot;随机化与加密&quot;,icon:&quot;🎲&quot;,brief:&quot;伪随机数解决哈希冲突、实现加密安全——确定性之外的力量&quot;,mks:false,long:&quot;随机化将大空间映射到小空间（哈希），用伪随机数减少冲突。公开密钥加密的基础：私钥生成（保密）+公钥验证（公开），基于数学的非对称性——可以验证真伪但无法伪造。&quot;,analogy:&quot;酒店房间分配：房间号=直接映射（最理想），但房间有限。随机分配+解决冲突机制=实际可用方案。比特币私钥=你的房间钥匙（丢失则永远无法进入），公钥=前台验证你是否是该房间主人。&quot;,example:&quot;1000万姓名→随机函数分配地址→冲突时找最近空位（开放寻址法）。比特币：随机生成256位私钥（2^256种可能，宇宙级安全）→生成公钥用于交易验证。&quot;,counter:&quot;用确定性公式分配地址导致严重哈希碰撞——所有数据挤在同几个位置。FUD策略利用人对不确定性的恐惧来影响决策——随机性和不确定性的负面应用。&quot;}
];

function renderFlipCard(){
let c = allConcepts[currentCard];
document.getElementById(&#x27;flipFront&#x27;).innerHTML = `&lt;h3&gt;${c.icon} ${c.name}&lt;/h3&gt;&lt;p style=&quot;font-size:0.8rem;opacity:0.85;margin-top:8px&quot;&gt;点击翻转查看四维解析&lt;/p&gt;`;

&lt;h4&gt;📖 定义&lt;/h4&gt;&lt;p&gt;${c.long}&lt;/p&gt;
&lt;h4&gt;💼 类比（商业/财务场景）&lt;/h4&gt;&lt;p&gt;${c.analogy}&lt;/p&gt;
&lt;h4&gt;✅ 示例&lt;/h4&gt;&lt;p&gt;${c.example}&lt;/p&gt;
&lt;h4&gt;❌ 反例&lt;/h4&gt;&lt;p&gt;${c.counter}&lt;/p&gt;`;
document.getElementById(&#x27;flipCounter&#x27;).textContent = (currentCard+1)+&#x27;/&#x27;+allConcepts.length;
isFlipped = false;
document.getElementById(&#x27;flipCard&#x27;).classList.remove(&#x27;flipped&#x27;);
}

function flip(){
let fc = document.getElementById(&#x27;flipCard&#x27;);
isFlipped = !isFlipped;
fc.classList.toggle(&#x27;flipped&#x27;, isFlipped);
}

function prevCard(e){ e.stopPropagation(); currentCard = (currentCard-1+allConcepts.length)%allConcepts.length; renderFlipCard(); }
function nextCard(e){ e.stopPropagation(); currentCard = (currentCard+1)%allConcepts.length; renderFlipCard(); }

function markLearned(){
let cid = allConcepts[currentCard].id;
if(!appData.learned.includes(cid)){
appData.learned.push(cid);
saveData(appData);
updateProgress();
}
}

// ======== TAB 2: QUIZ ========
let mcAnswered = {};
let saAnswered = {};

function renderQuiz(){
let mcHtml = &#x27;&#x27;;
mcQuestions.forEach((q,i)=&gt;{
mcHtml += `&lt;div class=&quot;card&quot; style=&quot;margin-bottom:10px&quot; id=&quot;mc-${i}&quot;&gt;
&lt;p&gt;&lt;strong&gt;${i+1}.&lt;/strong&gt; ${q.q}&lt;/p&gt;`;
q.opts.forEach((o,j)=&gt;{
mcHtml += `&lt;button class=&quot;quiz-option&quot; id=&quot;mc-${i}-${j}&quot; onclick=&quot;answerMC(${i},${j})&quot;&gt;${&#x27;ABCD&#x27;[j]}. ${o}&lt;/button&gt;`;
});
mcHtml += `&lt;div class=&quot;quiz-feedback&quot; id=&quot;mc-fb-${i}&quot; style=&quot;display:none&quot;&gt;&lt;/div&gt;&lt;/div&gt;`;
});
document.getElementById(&#x27;mcQuestions&#x27;).innerHTML = mcHtml;

let saHtml = &#x27;&#x27;;
saQuestions.forEach((q,i)=&gt;{
saHtml += `&lt;div class=&quot;card&quot; style=&quot;margin-bottom:10px&quot;&gt;
&lt;p&gt;&lt;strong&gt;${i+1}.&lt;/strong&gt; ${q.q}&lt;/p&gt;
&lt;textarea class=&quot;short-answer-box&quot; id=&quot;sa-${i}&quot; placeholder=&quot;输入你的回答...&quot;&gt;&lt;/textarea&gt;
&lt;button class=&quot;btn btn-green mt-12&quot; onclick=&quot;checkSA(${i})&quot;&gt;对比参考答案&lt;/button&gt;
&lt;div class=&quot;quiz-feedback&quot; id=&quot;sa-fb-${i}&quot; style=&quot;display:none&quot;&gt;${q.ref}&lt;/div&gt;
&lt;/div&gt;`;
});
document.getElementById(&#x27;saQuestions&#x27;).innerHTML = saHtml;

// Restore state
Object.keys(mcAnswered).forEach(k=&gt;{
let btn = document.getElementById(&#x27;mc-&#x27;+k);
let fb = document.getElementById(&#x27;mc-fb-&#x27;+k);
if(btn &amp;&amp; fb &amp;&amp; mcAnswered[k]!==undefined){
let ans = mcAnswered[k];
let correct = mcQuestions[parseInt(k)].ans;
let btns = document.querySelectorAll(&#x27;#mc-&#x27;+k+&#x27; .quiz-option&#x27;);
btns.forEach(b=&gt;b.disabled=true);
if(btns[ans]) btns[ans].classList.add(ans===correct?&#x27;correct&#x27;:&#x27;wrong&#x27;);
if(btns[correct]) btns[correct].classList.add(&#x27;correct&#x27;);
fb.style.display=&#x27;block&#x27;;
fb.innerHTML = ans===correct ? &#x27;&lt;span style=&quot;color:var(--green)&quot;&gt;✓ 正确！&lt;/span&gt;&#x27; : &#x27;&lt;span style=&quot;color:var(--accent)&quot;&gt;✗ 错误。&lt;/span&gt; &#x27;+mcQuestions[parseInt(k)].exp;
}
});
}

function answerMC(qi,ans){
if(mcAnswered[qi]!==undefined) return;
mcAnswered[qi] = ans;
let q = mcQuestions[qi];
let correct = q.ans;
let btns = document.querySelectorAll(&#x27;#mc-&#x27;+qi+&#x27; .quiz-option&#x27;);
btns.forEach(b=&gt;b.disabled=true);
btns[ans].classList.add(ans===correct?&#x27;correct&#x27;:&#x27;wrong&#x27;);
if(ans!==correct) btns[correct].classList.add(&#x27;correct&#x27;);
let fb = document.getElementById(&#x27;mc-fb-&#x27;+qi);
fb.style.display=&#x27;block&#x27;;
fb.innerHTML = ans===correct ? &#x27;&lt;span style=&quot;color:var(--green)&quot;&gt;✓ 正确！&lt;/span&gt;&#x27; : &#x27;&lt;span style=&quot;color:var(--accent)&quot;&gt;✗ 错误。&lt;/span&gt; &#x27;+q.exp;

appData.totalAnswered++;
if(ans===correct) appData.totalCorrect++;
else appData.wrongIds.push(&#x27;mc-&#x27;+qi);
appData.mcHistory.push({qi,ans,correct:ans===correct,ts:Date.now()});
saveData(appData);
updateProgress();
}

function checkSA(i){
let fb = document.getElementById(&#x27;sa-fb-&#x27;+i);
fb.style.display = fb.style.display===&#x27;none&#x27;?&#x27;block&#x27;:&#x27;none&#x27;;
if(fb.style.display===&#x27;block&#x27;){
appData.saHistory.push({i,ts:Date.now()});
saveData(appData);
}
}

// ======== TAB 3: EXAM MODE ========
function startExam(){
document.getElementById(&#x27;startExamBtn&#x27;).style.display=&#x27;none&#x27;;
document.getElementById(&#x27;examResult&#x27;).style.display=&#x27;none&#x27;;
let ec = document.getElementById(&#x27;examContent&#x27;);
ec.style.display=&#x27;block&#x27;;
// Pick 7 MC + 3 SA randomly
let mcPool = [...Array(20).keys()].sort(()=&gt;Math.random()-0.5).slice(0,7);
let saPool = [...Array(10).keys()].sort(()=&gt;Math.random()-0.5).slice(0,3);
currentExam = {mc:mcPool, sa:saPool, mcAns:{}, startTime:Date.now(), submitted:false};
examTimeLeft = 900;
updateExamTimer();
if(examInterval) clearInterval(examInterval);
examInterval = setInterval(()=&gt;{
examTimeLeft--;
updateExamTimer();
if(examTimeLeft&lt;=0) submitExam();
},1000);

let html = &#x27;&#x27;;
mcPool.forEach((qi,i)=&gt;{
let q = mcQuestions[qi];
html += `&lt;div class=&quot;card&quot; style=&quot;margin-bottom:8px&quot;&gt;&lt;p&gt;&lt;strong&gt;${i+1}.&lt;/strong&gt; ${q.q}&lt;/p&gt;`;
q.opts.forEach((o,j)=&gt;{
html += `&lt;button class=&quot;quiz-option&quot; id=&quot;ex-mc-${qi}-${j}&quot; onclick=&quot;examAnswerMC(&#x27;${qi}&#x27;,${j})&quot;&gt;${&#x27;ABCD&#x27;[j]}. ${o}&lt;/button&gt;`;
});
html += `&lt;/div&gt;`;
});
saPool.forEach((qi,i)=&gt;{
html += `&lt;div class=&quot;card&quot; style=&quot;margin-bottom:8px&quot;&gt;&lt;p&gt;&lt;strong&gt;${i+7+1}.&lt;/strong&gt; ${saQuestions[qi].q}&lt;/p&gt;&lt;textarea class=&quot;short-answer-box&quot; id=&quot;ex-sa-${qi}&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;`;
});
html += `&lt;button class=&quot;btn btn-primary mt-12&quot; onclick=&quot;submitExam()&quot;&gt;提交答卷&lt;/button&gt;`;
ec.innerHTML = html;
}

function updateExamTimer(){
let m = Math.floor(examTimeLeft/60);
let s = examTimeLeft%60;
document.getElementById(&#x27;examTimer&#x27;).textContent = m+&#x27;:&#x27;+(s&lt;10?&#x27;0&#x27;:&#x27;&#x27;)+s;
if(examTimeLeft&lt;60) document.getElementById(&#x27;examTimer&#x27;).style.color=&#x27;#c0392b&#x27;;
}

function examAnswerMC(qi,ans){
if(currentExam.submitted) return;
currentExam.mcAns[qi] = ans;
let btns = document.querySelectorAll(&#x27;#ex-mc-&#x27;+qi+&#x27;-\\d+&#x27;);
document.querySelectorAll(&#x27;[id^=&quot;ex-mc-&#x27;+qi+&#x27;-&quot;]&#x27;).forEach(b=&gt;{
b.style.background=&#x27;var(--card)&#x27;;
b.style.color=&#x27;var(--text)&#x27;;
});
let btn = document.getElementById(&#x27;ex-mc-&#x27;+qi+&#x27;-&#x27;+ans);
if(btn){ btn.style.background=&#x27;var(--accent)&#x27;; btn.style.color=&#x27;#fff&#x27;; }
}

function submitExam(){
if(currentExam.submitted) return;
currentExam.submitted = true;
if(examInterval){ clearInterval(examInterval); examInterval=null; }
let score = 0;
let details = &#x27;&#x27;;
currentExam.mc.forEach(qi=&gt;{
let userAns = currentExam.mcAns[qi];
let q = mcQuestions[qi];
let correct = q.ans;
if(userAns===correct) score += 10;
else{
details += `&lt;p style=&quot;color:var(--accent)&quot;&gt;第${currentExam.mc.indexOf(qi)+1}题: 你的答案 ${userAns!==undefined?&#x27;ABCD&#x27;[userAns]:&#x27;未答&#x27;}，正确答案 ${&#x27;ABCD&#x27;[correct]}。${q.exp}&lt;/p&gt;`;
appData.wrongIds.push(&#x27;mc-&#x27;+qi);
}
});
// SA: self-evaluated, give 5 each
score += currentExam.sa.length * 5;
details += `&lt;p style=&quot;margin-top:8px&quot;&gt;简答题部分：每题5分（自评），共${currentExam.sa.length*5}分。&lt;/p&gt;`;
currentExam.sa.forEach(qi=&gt;{
details += `&lt;p&gt;简答参考：${saQuestions[qi].ref.substring(0,120)}...&lt;/p&gt;`;
});

appData.totalAnswered += currentExam.mc.length;
let mcCorrect = currentExam.mc.filter(qi=&gt;currentExam.mcAns[qi]===mcQuestions[qi].ans).length;
appData.totalCorrect += mcCorrect;
saveData(appData);

let er = document.getElementById(&#x27;examResult&#x27;);
er.style.display=&#x27;block&#x27;;
er.innerHTML = `&lt;div class=&quot;card&quot;&gt;&lt;h2&gt;考试成绩&lt;/h2&gt;
&lt;p style=&quot;font-size:clamp(1.5rem,3vw,2rem);color:var(--accent);text-align:center;font-weight:700&quot;&gt;${score}/100&lt;/p&gt;
&lt;p style=&quot;text-align:center&quot;&gt;选择题正确 ${mcCorrect}/7 | 简答 ${currentExam.sa.length} 题&lt;/p&gt;
&lt;div style=&quot;margin-top:12px&quot;&gt;${details}&lt;/div&gt;
&lt;/div&gt;`;
updateProgress();
}

// ======== TAB 4: REVIEW ========
function renderReview(){
// Wrong book
let wb = document.getElementById(&#x27;wrongBook&#x27;);
let wrongMC = appData.wrongIds.filter(id=&gt;id.startsWith(&#x27;mc-&#x27;)).map(id=&gt;parseInt(id.replace(&#x27;mc-&#x27;,&#x27;&#x27;)));
let unique = [...new Set(wrongMC)];
if(unique.length===0) wb.innerHTML = &#x27;&lt;p style=&quot;color:var(--sub)&quot;&gt;暂无错题，继续保持！&lt;/p&gt;&#x27;;
else{
wb.innerHTML = unique.map(qi=&gt;{
let q = mcQuestions[qi];
return `&lt;div class=&quot;card&quot; style=&quot;margin-bottom:8px&quot;&gt;
&lt;p&gt;&lt;strong&gt;${qi+1}.&lt;/strong&gt; ${q.q}&lt;/p&gt;
&lt;p style=&quot;color:var(--green)&quot;&gt;正确答案：${&#x27;ABCD&#x27;[q.ans]}. ${q.opts[q.ans]}&lt;/p&gt;
&lt;p style=&quot;color:var(--sub);font-size:0.82rem&quot;&gt;${q.exp}&lt;/p&gt;
&lt;/div&gt;`;
}).join(&#x27;&#x27;);
}

// Weak analysis
let wa = document.getElementById(&#x27;weakAnalysis&#x27;);
let conceptErrors = {};
allConcepts.forEach(c=&gt;conceptErrors[c.name]=0);
unique.forEach(qi=&gt;{
// Map question to concepts based on content
let q = mcQuestions[qi];
let qtext = q.q+q.exp;
allConcepts.forEach(c=&gt;{
if(qtext.includes(c.name) || qtext.includes(c.name.substring(0,2))) conceptErrors[c.name]++;
});
});
let sorted = Object.entries(conceptErrors).filter(([,v])=&gt;v&gt;0).sort((a,b)=&gt;b[1]-a[1]);
if(sorted.length===0) wa.innerHTML = &#x27;&lt;p style=&quot;color:var(--sub)&quot;&gt;无薄弱概念数据，完成更多题目后自动分析。&lt;/p&gt;&#x27;;
else{

function renderSocratic(){

{concept:&quot;递归思维&quot;,qs:[
{q:&quot;递归和简单的重复有什么区别？&quot;,a:&quot;递归有「终止条件」（base case）——当问题缩小到最基本单元时停止。没有终止条件的重复是死循环。就像「山上有座庙」的故事没有结局，而阶乘N!有明确的终止点0!=1。&quot;},
{q:&quot;为什么说递归是计算机思维和人类思维最大的不同？&quot;,a:&quot;人类天生习惯自底向上递推（1×2×3...），计算机擅长自顶向下递归（N!=N×(N-1)!）。这种差异源于计算机的堆栈机制可以自动管理层层展开和回溯，而人脑的短期记忆难以追踪多层嵌套。&quot;},
{q:&quot;如果用递归管理一个团队，具体怎么做？&quot;,a:&quot;每一层管理者只管理直接下属（只关心下一层），将相同的管理动作复制到各层。CEO不需要知道基层员工在做什么——这和递归「假设N-1层已解决，只需处理第N层」的逻辑完全一致。&quot;}
]},
{concept:&quot;量级思维&quot;,qs:[
{q:&quot;为什么小数字世界的经验在大数世界会失效？&quot;,a:&quot;10双鞋可以随意摆放，10000双鞋必须建索引系统。当规模跨越量级临界点后，问题的性质改变了——排序100个数字用任何算法都可以，排序1亿个数字时差算法比好算法慢百万倍。&quot;},
{q:&quot;量级提升和日常勤奋有什么区别？&quot;,a:&quot;勤奋是线性改进（多做1%、再努力一点），量级提升是阶跃——从「讲师」到「校长」，从「写10万支票」到「写100万支票」。前者是30%的提升，后者是1000%的扩展。俞敏洪不是靠更努力讲课成功的，而是靠转型为校长。&quot;},
{q:&quot;如何识别自己陷入了「小数字思维」？&quot;,a:&quot;三个信号：①做大决策时纠结于芝麻级别的性价比差异；②用管理10人团队的方法管理100人团队；③把偶然一次的成功当成可复制的规律——这些都是线性外推的陷阱。&quot;}
]},
{concept:&quot;信息论&quot;,qs:[
{q:&quot;为什么说「信息比算法更重要」？&quot;,a:&quot;香农从数学上证明：没有新信息，不确定性无法消除。Google搜索90%的改进来自发现新的信息源（如网页被引次数、语义搭配规律），而不是优化已有模型的参数——信息是原材料，算法是加工方法，没有好材料再好的加工也做不出好产品。&quot;},
{q:&quot;如果我是一家传统企业，如何用信息思维找到竞争优势？&quot;,a:&quot;你积累的行业专属数据（客户交易记录、供应链参数、设备运行数据）就是别人没有的「新信息源」——这是金饭碗。数字化转型的核心不是买最贵的软件，而是把已有的行业数据结构化、可计算化。&quot;},
{q:&quot;大数据和「信息消除不确定性」的关系是什么？&quot;,a:&quot;大数据提供了海量的新信息，从而能消除传统方法无法消除的不确定性。如个性化制药：过去分析几千病例找不到的规律，分析百万人的基因数据就能发现——这是量变到质变。&quot;}
]},
{concept:&quot;等价性问题&quot;,qs:[
{q:&quot;怎么训练「找等价问题」的能力？&quot;,a:&quot;三步法：①抽象本质——这个问题的数学结构是什么？（是图的最短路径？是概率估计？是分类问题？）②寻找已知解——哪个成熟领域已经解决了这个结构？③迁移验证——已知方案在约束条件下是否可迁移？奥科把机器翻译抽象为通信解码问题，然后直接套用信息论的全部工具。&quot;},
{q:&quot;为什么说等价性思维是「一通百通」的关键？&quot;,a:&quot;因为世界上的问题类型远少于具体问题数量。迷宫寻路、网页爬虫、社交网络找朋友、地铁换乘——本质都是图的路径搜索。掌握了图的遍历算法，这四个领域你都会了。不是学了四样东西，是学了一样东西看到了四个维度。&quot;}
]},
{concept:&quot;工程思维&quot;,qs:[
{q:&quot;「边界内做事」听起来保守，和创新的关系是什么？&quot;,a:&quot;边界是科学的结论，不是人的限制。真正的创新发生在知道边界之后——就像知道光速不可超越后，物理学在相对论框架内实现了巨大创新。不知道边界而去「突破」，往往是在造永动机。苹果的成功不是突破了触屏技术的上限，而是在已知成熟技术边界内做到了整体最优的整合。&quot;},
{q:&quot;科学和工程最大的分歧在哪？&quot;,a:&quot;科学追求100倍量级突破（如发明新算法），工程追求在约束下做到可用（如将内存从20MB优化到3MB）。前者关注「有没有」，后者关注「好不好」。很多教授创业失败就是因为用科学思维做工程——追求算法优雅而忽视产品稳定性。&quot;}
]},
{concept:&quot;阿姆达尔法则&quot;,qs:[
{q:&quot;阿姆达尔法则的最大误区是什么？&quot;,a:&quot;以为「一次性解决所有瓶颈」。实际上瓶颈是动态转移的——优化完CPU后内存变成新瓶颈，优化完内存后I/O变成新瓶颈。法则的精髓是持续识别当前最大瓶颈并优先投入资源。&quot;},
{q:&quot;用阿姆达尔法则分析一个人的职业发展瓶颈。&quot;,a:&quot;先量化度量——当前限制你晋升的主要因素是什么？p=60%是技术深度不足还是p=30%是沟通表达不足？如果技术是60%瓶颈，学再多管理课程（仅占10%瓶颈）对晋升帮助有限。解决当前最大瓶颈后再重新评估。&quot;}
]}
];

&#x27;0-0&#x27;:&#x27;&lt;p style=&quot;color:var(--accent)&quot;&gt;⚠️ &lt;strong&gt;小数字思维陷阱&lt;/strong&gt;：1000到100万是3个数量级的跃迁。快速上线的框架在小规模表现好，但可能在大数据量下崩溃——这正是本文反复警告的「小数字方法的局限性」。最优策略是B或C的折中——使用已验证的成熟方案但保留扩展接口。&lt;/p&gt;&lt;p style=&quot;color:var(--green)&quot;&gt;【MKS分析】量级思维：不同规模需要不同的技术方案，不能线性外推。&lt;/p&gt;&#x27;,
&#x27;0-1&#x27;:&#x27;&lt;p style=&quot;color:var(--green)&quot;&gt;✓ &lt;strong&gt;量级思维正确，但需注意工程约束&lt;/strong&gt;：你理解了规模变化需要不同架构，这正是计算机思维的核心。但需要注意：过度设计会让早期产品开发速度变慢——折中方案是使用支持水平扩展的成熟框架，而非从零构建分布式系统。&lt;/p&gt;&lt;p style=&quot;color:var(--green)&quot;&gt;【MKS分析】工程思维：在理论边界（可扩展性）与实际约束（开发速度）间找最优解。&lt;/p&gt;&#x27;,
&#x27;0-2&#x27;:&#x27;&lt;p style=&quot;color:var(--green)&quot;&gt;✓ &lt;strong&gt;务实的选择，接近最优&lt;/strong&gt;：选用行业验证方案是最稳妥的路径——你不会重复别人的错误。确保所选方案本身支持扩展（如支持分库分表、缓存层等），这样就兼顾了「快速上线」和「规模扩展」。&lt;/p&gt;&lt;p style=&quot;color:var(--green)&quot;&gt;【MKS分析】信息论思维：利用行业已验证的信息（最佳实践）消除技术选型的不确定性。&lt;/p&gt;&#x27;
};
fb.innerHTML = feedbacks[round+&#x27;-&#x27;+choice] || &#x27;&#x27;;
decisionState[round] = choice;
fb.innerHTML += &#x27;&lt;button class=&quot;btn btn-primary mt-12&quot; onclick=&quot;nextDecision()&quot;&gt;下一轮&lt;/button&gt;&#x27;;
}

&lt;p style=&quot;color:var(--accent);font-weight:700&quot;&gt;核心收获：每一轮决策的背后都是「量级思维」「信息论」「等价性」「工程边界」的组合运用——这不是单一技巧，而是一套完整的思维操作系统。&lt;/p&gt;
&lt;button class=&quot;btn btn-primary&quot; onclick=&quot;renderDecision()&quot;&gt;重新开始&lt;/button&gt;
&lt;/div&gt;`;

}
let scenarios = [
{title:&#x27;第2轮：人才战略决策&#x27;,desc:&#x27;你的公司从10人扩张到100人，需要招聘一位技术副总裁。你面试了两位候选人：&lt;br&gt;A. 一位在BAT有10年管理经验的技术VP，但要求的薪资会吃掉你1/3的预算。&lt;br&gt;B. 一位在大厂做了3年技术主管的年轻工程师，薪资只需A的1/4，潜力大但管理经验不足。&#x27;,opts:[&#x27;A. 选择经验丰富的VP，虽然贵但能搭好架构避免弯路&#x27;,&#x27;B. 选择年轻主管，给他机会成长，用低成本博高回报&#x27;,&#x27;C. 先不招VP，自己继续兼任，等公司再大一些再说&#x27;]},
{title:&#x27;第3轮：商业模式决策&#x27;,desc:&#x27;你的产品有两种变现路径：&lt;br&gt;A. 面向C端做大规模，依靠广告和增值服务（需要先烧钱获取亿级用户）。&lt;br&gt;B. 面向B端做企业服务，每单收入高但增速慢（年增长50%）。&lt;br&gt;你的资源只够选一条路。&#x27;,opts:[&#x27;A. C端路线——量大才能产生质变，量级决定天花板&#x27;,&#x27;B. B端路线——稳健增长，先活下来再谈理想&#x27;,&#x27;C. 两条腿走路——C端做品牌引流，B端做利润生存&#x27;]}
];
if(nextRound &lt; scenarios.length){

}

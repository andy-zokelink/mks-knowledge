    var compId = group.getAttribute(&#x27;data-id&#x27;);
    var comp = components.find(function(c){ return c.id === compId; });

    group.addEventListener(&#x27;mouseenter&#x27;, function(evt){
      if (comp) showTooltip(comp, evt);
    });
    group.addEventListener(&#x27;mousemove&#x27;, function(evt){
      if (activeTooltipComp === comp) positionTooltip(evt);
    });
    group.addEventListener(&#x27;mouseleave&#x27;, function(){
      hideTooltip();
    });
    group.addEventListener(&#x27;click&#x27;, function(evt){
      evt.stopPropagation();
      handleClick(compId);
    });
  });

  // Hide tooltip when leaving SVG
  var boardSvg = document.getElementById(&#x27;boardSvg&#x27;);
  boardSvg.addEventListener(&#x27;mouseleave&#x27;, function(){
    hideTooltip();
  });

  // ── Particle background ──
  var canvas = document.getElementById(&#x27;particlesCanvas&#x27;);
  var ctx = canvas.getContext(&#x27;2d&#x27;);
  var particles = [];
  var PARTICLE_COUNT = 50;

  function resizeCanvas(){
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
  }
  resizeCanvas();
  window.addEventListener(&#x27;resize&#x27;, resizeCanvas);

  function createParticle(){
    return {
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      vx: (Math.random() - 0.5) * 0.3,
      vy: (Math.random() - 0.5) * 0.3 - 0.1,
      size: Math.random() * 1.5 + 0.5,
      opacity: Math.random() * 0.4 + 0.1
    };
  }

  for (var i = 0; i &lt; PARTICLE_COUNT; i++) {
    particles.push(createParticle());
  }

  function animateParticles(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (var i = 0; i &lt; particles.length; i++) {
      var p = particles[i];
      p.x += p.vx;
      p.y += p.vy;

      // Wrap around
      if (p.x &lt; -10) p.x = canvas.width + 10;
      if (p.x &gt; canvas.width + 10) p.x = -10;
      if (p.y &lt; -10) p.y = canvas.height + 10;
      if (p.y &gt; canvas.height + 10) p.y = -10;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = &#x27;rgba(201,168,76,&#x27; + p.opacity + &#x27;)&#x27;;
      ctx.fill();

      // Draw connections between nearby particles
      for (var j = i + 1; j &lt; particles.length; j++) {
        var p2 = particles[j];
        var dx = p.x - p2.x;
        var dy = p.y - p2.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist &lt; 80) {
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.strokeStyle = &#x27;rgba(201,168,76,&#x27; + (0.08 * (1 - dist/80)) + &#x27;)&#x27;;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    }

    requestAnimationFrame(animateParticles);
  }
  animateParticles();

  // ── Mobile cards ──
  var mobileCards = document.getElementById(&#x27;mobileCards&#x27;);
  components.forEach(function(c, idx){
    var card = document.createElement(&#x27;div&#x27;);
    card.className = &#x27;mobile-card&#x27;;
    card.style.borderColor = c.color;
    card.style.boxShadow = &#x27;0 0 12px &#x27; + c.color + &#x27;22&#x27;;

    var dot = document.createElement(&#x27;div&#x27;);
    dot.className = &#x27;mc-dot&#x27;;
    dot.style.background = c.color;
    dot.style.boxShadow = &#x27;0 0 8px &#x27; + c.color;

    var info = document.createElement(&#x27;div&#x27;);
    info.className = &#x27;mc-info&#x27;;

    var label = document.createElement(&#x27;div&#x27;);
    label.className = &#x27;mc-label&#x27;;
    label.style.color = c.color;
    label.textContent = c.label;

    var topic = document.createElement(&#x27;div&#x27;);
    topic.className = &#x27;mc-topic&#x27;;
    topic.textContent = &#x27;专题：&#x27; + c.topic;

    var conceptsDiv = document.createElement(&#x27;div&#x27;);
    conceptsDiv.className = &#x27;mc-concepts&#x27;;
    c.concepts.forEach(function(cn){
      var span = document.createElement(&#x27;span&#x27;);
      span.className = &#x27;mc-concept&#x27;;
      span.textContent = cn;
      conceptsDiv.appendChild(span);
    });

    info.appendChild(label);
    info.appendChild(topic);
    info.appendChild(conceptsDiv);

    card.appendChild(dot);
    card.appendChild(info);

    card.addEventListener(&#x27;click&#x27;, function(){
      handleClick(c.id);
    });

    mobileCards.appendChild(card);

    // Connector between cards
    if (idx &lt; components.length - 1) {
      var connector = document.createElement(&#x27;div&#x27;);
      connector.className = &#x27;mobile-connector&#x27;;
      mobileCards.appendChild(connector);
    }
  });

  // ── Keyboard shortcut ──
  document.addEventListener(&#x27;keydown&#x27;, function(evt){
    // Ctrl+Shift+R: reset all visited states
    if (evt.ctrlKey &amp;&amp; evt.shiftKey &amp;&amp; evt.key === &#x27;R&#x27;) {
      evt.preventDefault();
      components.forEach(function(c){
        localStorage.removeItem(STORAGE_PREFIX + c.id);
      });
      updateAllLEDs();
      console.log(&#x27;[Board] All visit states reset.&#x27;);
    }
  });

})();
&lt;/script&gt;

{id:2, name:&#x27;洪堡专才教育&#x27;, desc:&#x27;普鲁士洪堡设计&quot;研究与教学合一、知识总和、专业精深&quot;三大原则。学生集中于单一专业达到精深水平，通过苏联影响中国1952年&quot;理工分校&quot;。优势是实用高效，劣势是知识面窄。&#x27;, mks:true},
{id:3, name:&#x27;吉尔曼与艾略特改革&#x27;, desc:&#x27;19世纪末美国高等教育转型的核心人物。吉尔曼创办约翰·霍普金斯，建立美国第一所研究生院；艾略特改造哈佛，引入科学研究、案例教学，使哈佛从教会学院蜕变为世界一流研究型大学。&#x27;, mks:true},
{id:4, name:&#x27;学院制与导师制&#x27;, desc:&#x27;牛津剑桥的核心制度：学院是独立的小型社会单元，拥有独立财务与管理；导师制要求教授对学生全面负责，涵盖学术指导与人格培养。普林斯顿、耶鲁深受影响，发展出住宿学院制。&#x27;, mks:false},
{id:5, name:&#x27;常青藤精英培养&#x27;, desc:&#x27;8所常青藤（哈佛/耶鲁/普林斯顿/哥伦比亚/宾大/康奈尔/达特茅斯/布朗）共享精英选拔传统。HYPMS超级五强代表美国最高水平。录取侧重&quot;未来潜力&quot;而非当前成绩，70%为特招生。&#x27;, mks:false},
{id:6, name:&#x27;法国精英大学校&#x27;, desc:&#x27;Grande Ecole体系独立于公立大学，规模极小、录取率低于5%。巴黎高师、综合理工、巴黎高商等培养国家领袖。预科班每周50小时强化训练，20岁的学校选择往往决定终身。&#x27;, mks:false},
{id:7, name:&#x27;德国教育衰落启示&#x27;, desc:&#x27;曾是19世纪世界高等教育样板（洪堡体系发源地），二战后因经费不足、过度公平化（缺乏精英培养）、学术体制僵化（论资排辈）而衰落。证明有钱的发达国家未必有一流大学。&#x27;, mks:false},
{id:8, name:&#x27;通识教育学科价值&#x27;, desc:&#x27;语文培养阅读理解与表达能力（一切学科的基础工具）；数学训练逻辑推理（从公理到定理的思维过程）；历史掌握时空全局思维；科学提供可叠加的进步方法论。四者共同构成通识教育骨架。&#x27;, mks:false},
{id:9, name:&#x27;中美教育路径对比&#x27;, desc:&#x27;中国侧重考试成绩、知识灌输、专业细分；美国侧重综合素质、批判性思维、通识教育。美国本科核心竞争力在于课外活动、社交网络与独立思考培养。选择路径取决于个人未来生活规划。&#x27;, mks:false},
{id:10, name:&#x27;大学捐赠与治理&#x27;, desc:&#x27;美国私立大学本质上是由董事会(Board of Trustees)管理的信托机构。达特茅斯案(1819)确立私立大学为独立法人。校友捐赠占预算20%-40%，普林斯顿校友捐赠率超60%。终身教职制度保障学术自由。&#x27;, mks:false},
{id:11, name:&#x27;MIT与加州理工&#x27;, desc:&#x27;MIT以培养工业界领袖为目标，强调工程思维，1/3毕业生成为高管。加州理工定位&quot;只培养少数天才科学家&quot;，诺奖密度全球第一(每千名毕业生1位)。MIT看70%成绩，Caltech只看天赋。&#x27;, mks:false},
{id:12, name:&#x27;哈佛标杆原理&#x27;, desc:&#x27;哈佛被公认为高等教育标杆——SAT满分者3/4被拒，仅7%新生是&quot;学霸&quot;，70%为特招生。课程强制少(仅写作课必修)，多数学生轻易得A。核心价值在于进入精英圈子和培养终身学习能力。&#x27;, mks:false},
{id:13, name:&#x27;普林斯顿本科教育&#x27;, desc:&#x27;坚持&quot;小而精&quot;，无医学院/法学院/商学院。通识教育要求文科生修数学+工程课，理工科修7门人文课。住宿学院按特长互补原则分配室友。大四必须完成独立毕业论文。&#x27;, mks:false},
{id:14, name:&#x27;耶鲁自由精神&#x27;, desc:&#x27;唯一靠文科支撑的世界一流大学。鼓励自由思考(越战招收逃兵役学生)，实行&quot;严进宽出&quot;，一半时间用于课外活动。强调社会责任感——纪念大厦刻有历次战争牺牲的毕业生姓名。&#x27;, mks:false},
{id:15, name:&#x27;哥伦比亚核心课程&#x27;, desc:&#x27;地处纽约曼哈顿核心区(仅200亩)，城市即校园。最早推行核心课程(Core Curriculum)，覆盖当代文明、文学人文、艺术人文、音乐人文、科学前沿等9门通识必修课。保持自由派传统，曾邀请伊朗总统内贾德演讲。&#x27;, mks:false},
{id:16, name:&#x27;宾大与达特茅斯&#x27;, desc:&#x27;宾大由富兰克林创办，常青藤中最务实——沃顿商学院60%本科生进入华尔街。达特茅斯保留&quot;学院&quot;名称，以本科教学为核心，新生需野外生存训练，盛产政治与金融精英。&#x27;, mks:false},
{id:17, name:&#x27;体育与人格教育&#x27;, desc:&#x27;美国私立大学录取中课外活动(尤其是运动)是关键因素。运动队培养六大能力：投入与承诺、时间管理、服从与团队精神、追求个人最佳、长期目标规划、沟通能力。高尔夫培养绝对诚信。&#x27;, mks:false},

{q:&#x27;美国大学董事会制度中，校董(Trustee)的法律定位是？&#x27;,opts:[&#x27;荣誉头衔，无实际责任&#x27;,&#x27;政府任命的监管者&#x27;,&#x27;由教授选举产生的代表&#x27;,&#x27;受托人，承担法律义务&#x27;],ans:3,exp:&#x27;Trustee本质是信托受托人，承担法律义务(如学校涉诉时承担失察责任)，区别于公司董事(Director)的咨询角色。&#x27;},
{q:&#x27;通识教育中，数学学习的核心价值不包括？&#x27;,opts:[&#x27;记忆大量公式和解题技巧&#x27;,&#x27;阅读理解暗喻信息的能力&#x27;,&#x27;逻辑推理从公理到定理&#x27;,&#x27;培养跨文化普适的量化思维&#x27;],ans:0,exp:&#x27;数学核心价值在于阅读理解(理解暗喻)、逻辑推理(从公理推导定理)、量化思维。题海战术和死记公式恰是当前教学的主要弊端。&#x27;},
{q:&#x27;历史学习的核心价值不包括？&#x27;,opts:[&#x27;掌握时空全局的思维方法&#x27;,&#x27;以史为鉴直接复制经验&#x27;,&#x27;培养客观公允的认知能力&#x27;,&#x27;训练研究与表达能力&#x27;],ans:1,exp:&#x27;作者明确反驳&quot;以史为鉴&quot;论点——历史不会简单重复，案例借鉴意义有限。核心价值在于时空全局思维、客观认知、研究表达能力。&#x27;},
{q:&#x27;吴军提出的大学&quot;五大补充训练&quot;不包括哪项？&#x27;,opts:[&#x27;看透钱(财富是媒介)&#x27;,&#x27;领导力(服从→合作→助手)&#x27;,&#x27;编程能力(掌握至少三门语言)&#x27;,&#x27;边界认知(防御/围棋/缓存思维)&#x27;],ans:2,exp:&#x27;五大补充训练：①看透钱②领导力③边界认知④健全人格⑤信仰树立。编程能力不在其列。&#x27;},
{q:&#x27;中美本科教育差异，以下哪项描述正确？&#x27;,opts:[&#x27;中国每学期4-5门课，美国10-13门&#x27;,&#x27;中国注重多元考核，美国注重期末考试&#x27;,&#x27;MIT最好的教授只教研究生课程&#x27;,&#x27;美国A率普遍高于中国大学&#x27;],ans:3,exp:&#x27;中国每学期10-13门课vs美国4-5门；中国重考试vs美国重多元考核；MIT要求最好的教授讲大一基础课。美国A率普遍高于中国(哈佛70%得A)。&#x27;},

// ============ TAB 1: FLIP CARDS ============
let flipIdx = 0;
function updateFlipCard(){
document.getElementById(&#x27;flipFront&#x27;).textContent = flipCards[flipIdx].front;
document.getElementById(&#x27;flipBack&#x27;).innerHTML = flipCards[flipIdx].back;
document.getElementById(&#x27;flipInner&#x27;).classList.remove(&#x27;flipped&#x27;);
document.getElementById(&#x27;flipProgress&#x27;).textContent = `${flipIdx+1}/${flipCards.length}`;
const learned = JSON.parse(localStorage.getItem(&#x27;mks_learned&#x27;)||&#x27;[]&#x27;);
const btn = document.getElementById(&#x27;learnedBtn&#x27;);
if(learned.includes(flipIdx)){
btn.textContent = &#x27;✓ 已学习 ✓&#x27;; btn.classList.add(&#x27;learned&#x27;);
} else {
btn.textContent = &#x27;✓ 已学习&#x27;; btn.classList.remove(&#x27;learned&#x27;);
}
}
function flipPrev(){flipIdx=(flipIdx-1+flipCards.length)%flipCards.length;updateFlipCard();}
function flipNext(){flipIdx=(flipIdx+1)%flipCards.length;updateFlipCard();}
function markLearned(){
let learned = JSON.parse(localStorage.getItem(&#x27;mks_learned&#x27;)||&#x27;[]&#x27;);
if(learned.includes(flipIdx)){learned=learned.filter(i=&gt;i!==flipIdx);}else{learned.push(flipIdx);}
localStorage.setItem(&#x27;mks_learned&#x27;,JSON.stringify(learned));
updateFlipCard();updateProgress();
}

// ============ TAB 2: QUIZ ============
let mcqAnswers = {}; let saqRevealed = {};
function renderMCQ(){
const container = document.getElementById(&#x27;mcqContainer&#x27;);
container.innerHTML = mcQuestions.map((q,i)=&gt;`
&lt;div class=&quot;quiz-card&quot;&gt;
&lt;span class=&quot;q-tag q-mc&quot;&gt;选择题 #${i+1}&lt;/span&gt;
&lt;div class=&quot;q-text&quot;&gt;${q.q}&lt;/div&gt;
${q.opts.map((o,j)=&gt;`&lt;div class=&quot;q-option&quot; onclick=&quot;selectMCQ(${i},${j})&quot; id=&quot;mcq${i}_${j}&quot;&gt;${&#x27;ABCD&#x27;[j]}. ${o}&lt;/div&gt;`).join(&#x27;&#x27;)}
&lt;div class=&quot;q-feedback&quot; id=&quot;mcqFb${i}&quot;&gt;&lt;/div&gt;
&lt;/div&gt;`).join(&#x27;&#x27;);
}
function renderSAQ(){
const container = document.getElementById(&#x27;saqContainer&#x27;);
container.innerHTML = saQuestions.map((q,i)=&gt;`
&lt;div class=&quot;quiz-card&quot;&gt;
&lt;span class=&quot;q-tag q-sa&quot;&gt;简答题 #${i+1}&lt;/span&gt;
&lt;div class=&quot;q-text&quot;&gt;${q.q}&lt;/div&gt;
&lt;textarea class=&quot;sa-input&quot; placeholder=&quot;输入你的答案...&quot; id=&quot;saInput${i}&quot;&gt;&lt;/textarea&gt;
&lt;button class=&quot;btn btn-sm&quot; style=&quot;margin-top:8px&quot; onclick=&quot;revealSAQ(${i})&quot;&gt;查看要点提示&lt;/button&gt;
&lt;div class=&quot;sa-reveal&quot; id=&quot;saRev${i}&quot;&gt;💡 &lt;strong&gt;要点：&lt;/strong&gt;${q.hint}&lt;/div&gt;
&lt;/div&gt;`).join(&#x27;&#x27;);
}
function selectMCQ(qi, optIdx){
if(mcqAnswers[qi]!==undefined) return;
mcqAnswers[qi] = optIdx;
const correct = mcQuestions[qi].ans;
const fb = document.getElementById(&#x27;mcqFb&#x27;+qi);
for(let j=0;j&lt;4;j++){
const el = document.getElementById(&#x27;mcq&#x27;+qi+&#x27;_&#x27;+j);
if(j===correct) el.classList.add(&#x27;correct&#x27;);
if(j===optIdx &amp;&amp; j!==correct) el.classList.add(&#x27;wrong&#x27;);
if(j===optIdx) el.classList.add(&#x27;selected&#x27;);
}
if(optIdx===correct){
fb.className=&#x27;q-feedback right show&#x27;;
fb.textContent=&#x27;✅ 正确！&#x27;+mcQuestions[qi].exp;
saveQuizResult(qi,true);
}else{
fb.className=&#x27;q-feedback wrong-msg show&#x27;;

let examActive = false, examTimer = null, examSeconds = 0, examQuestions = [];
function startExam(){
document.getElementById(&#x27;examStartBtn&#x27;).style.display=&#x27;none&#x27;;
examActive = true; examSeconds = 15*60;
examQuestions = [];
let mcPool = [...Array(mcQuestions.length).keys()];
let saPool = [...Array(saQuestions.length).keys()];
shuffle(mcPool); shuffle(saPool);
for(let i=0;i&lt;7;i++) examQuestions.push({type:&#x27;mc&#x27;,idx:mcPool[i]});
for(let i=0;i&lt;3;i++) examQuestions.push({type:&#x27;sa&#x27;,idx:saPool[i]});
shuffle(examQuestions);
renderExam();
examTimer = setInterval(()=&gt;{
examSeconds--;
const m = Math.floor(examSeconds/60), s = examSeconds%60;
const timerEl = document.getElementById(&#x27;examTimer&#x27;);
timerEl.textContent = `${m}:${String(s).padStart(2,&#x27;0&#x27;)}`;
if(examSeconds&lt;60) timerEl.classList.add(&#x27;warning&#x27;);
if(examSeconds&lt;=0){submitExam();}
},1000);
}
function renderExam(){
const area = document.getElementById(&#x27;examArea&#x27;);
area.innerHTML = examQuestions.map((eq,i)=&gt;{
if(eq.type===&#x27;mc&#x27;){
const q = mcQuestions[eq.idx];
return `&lt;div class=&quot;quiz-card&quot;&gt;&lt;span class=&quot;q-tag q-mc&quot;&gt;选择题 #${i+1}&lt;/span&gt;&lt;div class=&quot;q-text&quot;&gt;${q.q}&lt;/div&gt;
${q.opts.map((o,j)=&gt;`&lt;div class=&quot;q-option&quot; onclick=&quot;examMCQ(${i},${j})&quot; id=&quot;exam${i}_${j}&quot;&gt;${&#x27;ABCD&#x27;[j]}. ${o}&lt;/div&gt;`).join(&#x27;&#x27;)}
&lt;div class=&quot;q-feedback&quot; id=&quot;examFb${i}&quot;&gt;&lt;/div&gt;&lt;/div&gt;`;
}else{
const q = saQuestions[eq.idx];
return `&lt;div class=&quot;quiz-card&quot;&gt;&lt;span class=&quot;q-tag q-sa&quot;&gt;简答题 #${i+1}&lt;/span&gt;&lt;div class=&quot;q-text&quot;&gt;${q.q}&lt;/div&gt;
&lt;textarea class=&quot;sa-input&quot; id=&quot;examSA${i}&quot;&gt;(考试模式下快速写出要点)&lt;/textarea&gt;&lt;/div&gt;`;
}
}).join(&#x27;&#x27;);
document.getElementById(&#x27;examResult&#x27;).style.display=&#x27;none&#x27;;
}
let examAnswers = {};
function examMCQ(i, optIdx){
if(examAnswers[i]!==undefined) return;
examAnswers[i] = optIdx;
const q = mcQuestions[examQuestions[i].idx];
const fb = document.getElementById(&#x27;examFb&#x27;+i);
for(let j=0;j&lt;4;j++){
const el = document.getElementById(&#x27;exam&#x27;+i+&#x27;_&#x27;+j);
if(j===q.ans) el.classList.add(&#x27;correct&#x27;);
if(j===optIdx &amp;&amp; j!==q.ans) el.classList.add(&#x27;wrong&#x27;);
if(j===optIdx) el.classList.add(&#x27;selected&#x27;);
}
fb.className = &#x27;q-feedback show &#x27;+(optIdx===q.ans?&#x27;right&#x27;:&#x27;wrong-msg&#x27;);
fb.textContent = optIdx===q.ans?&#x27;✅ 正确&#x27;:&#x27;❌ 错误。答案：&#x27;+&#x27;ABCD&#x27;[q.ans];
}
function submitExam(){
clearInterval(examTimer); examActive = false;
const timerEl = document.getElementById(&#x27;examTimer&#x27;);
timerEl.textContent = &#x27;考试结束&#x27;; timerEl.classList.remove(&#x27;warning&#x27;);
const result = document.getElementById(&#x27;examResult&#x27;);
let score = 0, total = 7;
examQuestions.forEach((eq,i)=&gt;{
if(eq.type===&#x27;mc&#x27; &amp;&amp; examAnswers[i]===mcQuestions[eq.idx].ans) score++;
});
const m = Math.floor((900-examSeconds)/60), s = (900-examSeconds)%60;
result.style.display=&#x27;block&#x27;;
result.innerHTML = `&lt;div class=&quot;card&quot; style=&quot;text-align:center&quot;&gt;
&lt;h3&gt;考试结果&lt;/h3&gt;
&lt;div style=&quot;font-size:2.5rem;color:var(--accent);font-weight:700&quot;&gt;${score}/${total}&lt;/div&gt;
&lt;p style=&quot;color:var(--text2)&quot;&gt;选择题正确率：${Math.round(score/total*100)}%&lt;/p&gt;
&lt;p style=&quot;color:var(--text2)&quot;&gt;用时：${m}分${s}秒&lt;/p&gt;
&lt;p style=&quot;font-size:.82rem;color:var(--text2);margin-top:8px&quot;&gt;
${score&gt;=6?&#x27;🎉 你对大学教育体系的理解非常扎实！&#x27;:
score&gt;=4?&#x27;👍 基础不错，建议回顾错题加深理解。&#x27;:
&#x27;📚 建议返回&quot;知识卡片&quot;和&quot;思维导图&quot;系统学习后再试。&#x27;}
&lt;/p&gt;
&lt;button class=&quot;btn&quot; onclick=&quot;resetExam()&quot; style=&quot;margin-top:12px&quot;&gt;重新考试&lt;/button&gt;
&lt;/div&gt;`;
let examResults = JSON.parse(localStorage.getItem(&#x27;mks_examResults&#x27;)||&#x27;[]&#x27;);
examResults.push({score,total,time:Date.now(),seconds:900-examSeconds});
localStorage.setItem(&#x27;mks_examResults&#x27;,JSON.stringify(examResults));
// Save errors
examQuestions.forEach((eq,i)=&gt;{
if(eq.type===&#x27;mc&#x27; &amp;&amp; examAnswers[i]!==undefined &amp;&amp; examAnswers[i]!==mcQuestions[eq.idx].ans){
let errors = JSON.parse(localStorage.getItem(&#x27;mks_errorBook&#x27;)||&#x27;[]&#x27;);
errors.push({id:&#x27;exam_mc_&#x27;+eq.idx, time:Date.now()});
localStorage.setItem(&#x27;mks_errorBook&#x27;,JSON.stringify(errors));
}
});
updateProgress();
}
function resetExam(){
clearInterval(examTimer); examActive = false;
examAnswers = {}; examQuestions = [];
document.getElementById(&#x27;examStartBtn&#x27;).style.display=&#x27;inline-block&#x27;;
document.getElementById(&#x27;examResult&#x27;).style.display=&#x27;none&#x27;;

document.getElementById(&#x27;examTimer&#x27;).textContent=&#x27;15:00&#x27;;

}

}

const concepts = [
  {id:&#x27;c0&#x27;,name:&#x27;上帝喜欢笨人&#x27;,star:true,
   def:&#x27;以超额准备和系统化方法替代依赖天赋与临场发挥的长期主义原则。核心是承认自身能力边界，通过「结硬寨，打呆仗」将做事水平从90分提升到95-100分，实现效果的质变。&#x27;,
   analogy:&#x27;如同企业财务审计：聪明的CFO可能靠直觉做决策，而「笨人」CFO建立完整的对账流程、三重校验机制、风险预警系统。短期看笨办法耗时更多，长期却避免了重大财务漏洞。&#x27;,
   example:&#x27;威灵顿公爵每次战前事无巨细准备所有可能意外，滑铁卢战役以「守住阵地等盟军」为目标，最终击败天才拿破仑。库旦普教授为15分钟报告准备3-5倍内容，预设所有听众提问。&#x27;,
   anti:&#x27;中关村ABC公司销售经理自认聪明，想私吞5000元回扣差价，结果被「土老帽」骗走1.5万元现金。聪明反被聪明误——过度自信导致判断失误。&#x27;},
  {id:&#x27;c1&#x27;,name:&#x27;以正合以奇胜&#x27;,star:true,
   def:&#x27;乐观主义的做事方法论：以遵循规律的常规能力（正）为成功首要保障，以额外机动资源（奇）为辅助。长期剧变必然，但短期渐变是常态——实力派获胜是大概率事件。&#x27;,
   analogy:&#x27;如同投资组合管理：正合是核心资产配置（指数基金定投），确保长期稳健收益；奇胜是卫星仓位（少量高风险投资），在基础稳固时博取超额回报。孤注一掷的投机者（只靠奇）最终大概率归零。&#x27;,
   example:&#x27;华为超越朗讯/思科：靠产品性能稳步提升+价格优势的常规竞争（正合），而非弯道超车式的投机。奥斯特里茨战役中苏尔特正面抵御主力（正）的功劳大于贝尔纳多特预备队（奇）。&#x27;,
   anti:&#x27;退学创业的模仿者：盖茨和扎克伯格退学成功是因已具备赚钱能力（实力派），而非退学后才探索。只看表面形式忽视实力积累，是误解「奇胜」的典型。&#x27;},
  {id:&#x27;c2&#x27;,name:&#x27;超越免费&#x27;,star:true,
   def:&#x27;在免费成为行业默认模式的背景下，通过制造稀缺性超越免费竞争。五个维度：时效性（时间稀缺）、个性化（空间独特）、可用性（易理解）、可靠性（信任累积）、数据黏性（护城河）。&#x27;,
   analogy:&#x27;如同高端餐厅vs免费食堂：免费食堂解决温饱但无差异化，高端餐厅通过独家食材（时效性）、定制菜单（个性化）、稳定出品（可靠性）、熟客关系（数据黏性）创造超越免费的价值。&#x27;,
   example:&#x27;iPhone X因独特性引发排队购买，而iPhone 8因缺乏创新无人问津——产品层面的稀缺性制造。Skuchain公司利用区块链可跟踪技术实现合同执行数字化，牺牲去中心化换效率。&#x27;,
   anti:&#x27;微软2004-2010年每搜索一次奖励5美分试图竞争搜索市场，每年烧10几亿美元却未提升份额。倒贴钱无法替代真正的产品价值——人对白得的东西不珍惜。&#x27;},
  {id:&#x27;c3&#x27;,name:&#x27;众利勿为&#x27;,star:true,

   analogy:&#x27;如同股市热门板块：当菜市场大妈都在讨论某只股票时，往往已是行情尾声。巴菲特「别人恐惧时贪婪，别人贪婪时恐惧」是同一逻辑——真正的机会在争议中出现，而非一致看好时。&#x27;,
   example:&#x27;美国创业者倾向于差异化竞争：十字路口第一家开加油站，第二家开便利店，第三家开快餐店，第四家开咖啡店——避免同质化内卷。团购网站千团大战模仿Groupon，无一盈利。&#x27;,

  {id:&#x27;c4&#x27;,name:&#x27;谋事在人成事在天&#x27;,star:false,

   analogy:&#x27;如同农民种地：精心选种、施肥、灌溉（人事），但最终收成还取决于天气、病虫害、市场价格（天命）。智慧的农民不会因丰年自傲或荒年绝望，而是持续优化种植方法。&#x27;,
   example:&#x27;曾国藩承认不精通天文历算，让儿子曾纪泽学数学；不懂几何，推却《几何原本》作序请求。因知进退，成为古代功臣中罕见能全身而退者。肯尼迪提出登月愿景却未见证成功——尽人事的价值超越结果。&#x27;,
   anti:&#x27;中国散户将牛市偶然收益归结为自身能力，导致后续重大亏损。高考失利者50岁仍念叨「差2分考重点大学」——过度归因于个人努力而忽视运气因素。&#x27;},
  {id:&#x27;c5&#x27;,name:&#x27;分享利益&#x27;,star:false,
   def:&#x27;利益共享是职业人士的基本素质，也是组织形成合力的制度设计。在论文、专利、项目中主动添加合作者，公开感谢帮助者——直接影响团队凝聚力与个人职业发展。&#x27;,
   analogy:&#x27;如同开源社区：贡献代码的开发者看似免费付出，实则通过社区声望积累、代码被广泛使用、同行认可获得更高质量的职业机会。独自闭门造车的开发者反而成长受限。&#x27;,
   example:&#x27;贾里尼克教授规定同事工作帮助论文必须加入作者名单、非正式讨论必须在鸣谢中感谢。刘邦「不吝恩赐」得天下，项羽「舍不得封赏」失天下。Google专利申请中主动添加跨团队合作者名字。&#x27;,
   anti:&#x27;硅谷中国人晋升速度不及印度人的原因之一是利益分享与相互提携不足。中国同事发布新产品时遗漏跨团队贡献者，需高层出面道歉。Facebook前100名员工因小事离职，损失至少1亿美元期权。&#x27;},
  {id:&#x27;c6&#x27;,name:&#x27;独立决断&#x27;,star:false,
   def:&#x27;在征求关键意见、弥补遗漏后自行决策，无需追求所有人满意。核心逻辑是「没有最好，只有更好」——接受决策瑕疵，注重进步效率，避免过度会议和邮件抄送导致的组织低效。&#x27;,
   analogy:&#x27;如同外科手术主刀医生：术前会诊听取各科室意见（征求关键意见），但手术台上的最终决策必须由主刀独立做出。追求「所有人都同意」会导致贻误最佳治疗时机。&#x27;,
   example:&#x27;GE韦尔奇规定邮件收件人超过20人需特别确认，显著降低邮件量，助力GE市值从130亿增至4000亿美元。Facebook前副总裁魏小亮主动告知扎克伯格职业诉求，倒逼晋升机会。&#x27;,
   anti:&#x27;中国企业过度依赖会议与邮件抄送——无关邮件过多降低整体效率。GE改革前因「民主集中」式全员共识导致决策缓慢，错失市场机会。&#x27;},
  {id:&#x27;c7&#x27;,name:&#x27;悲观主义根源&#x27;,star:false,
   def:&#x27;悲观主义三大来源：过分自信与现实反差的认知偏差（高估自身能力导致失望）、坏消息的媒体放大效应（好事不出门坏事行千里）、信息论中的与众不同偏好（悲观观点信息量更大更易传播）。&#x27;,
   analogy:&#x27;如同天气预报：气象局预测「明天天气正常」毫无新闻价值，但预测「百年一遇暴雨」立刻成为头条——即使准确性存疑。长期如此导致公众对气候风险的感知严重失真。&#x27;,
   example:&#x27;中国拥有全球20条最长河流（&gt;2000公里），三五年出现一次「百年一遇洪水」属概率正常事件。因通信落后，1970年代驻马店洪灾（死亡2.6万-30万）未被广泛知晓，而今天每次洪水都被放大报道。&#x27;,
   anti:&#x27;鲁比尼2007年卖空股票后错失美股历史最大增长，后多次预测中国经济崩溃均失败——悲观判断即使错误，只要逻辑自洽仍获学术界容忍。莱斯特·布朗基于静态假设预测资源危机，忽视技术进步。&#x27;},
  {id:&#x27;c8&#x27;,name:&#x27;五级工程师&#x27;,star:false,
   def:&#x27;基于朗道物理学家等级的职业能力模型：第五级独立解决问题→第四级带领团队完成有影响力的工作→第三级独立设计产品获得市场成功→第二级创造前所未有的产品→第一级开创全新产业。每级能力差距为数量级（10倍）。&#x27;,
   analogy:&#x27;如同足球联赛体系：五级=职业球员（独立完成比赛）、四级=队长（带领团队赢球）、三级=教练兼球员（设计战术并执行）、二级=改变足球打法的人（如克鲁伊夫的全攻全守）、一级=创立现代足球规则的人。&#x27;,
   example:&#x27;京东工程师独立开发「情侣购书行为分析工具」=五级。Jeff Dean创立云计算技术=二级。爱迪生开创电力产业、福特开创汽车制造=一级。吴军自我定位为2.5级工程师。&#x27;,
   anti:&#x27;中国IT行业普遍存在「毕业即工程师」现象，实际仅为简单重复工作的「码农」，远未达到五级「独立解决问题」标准。头衔与能力脱节——工科毕业生需主动提升独立性。&#x27;},
  {id:&#x27;c9&#x27;,name:&#x27;人生五件事&#x27;,star:false,
   def:&#x27;人一生必须做的五件事：恋爱结婚生子（不可替代的个人生活体验）、尝试做喜欢的事（发现天赋、成为有趣味的人）、回馈（从现在开始身体力行）、有一个信仰（提供方向与勇气）、留下遗产（对世界产生影响）。&#x27;,
   analogy:&#x27;如同建造一座房子：婚恋是地基（情感支撑系统）、喜欢的事是装饰与花园（让房子有温度而非只是庇护所）、回馈是开放客厅招待他人、信仰是承重墙（支撑结构）、遗产是房子留给后人的印记。&#x27;,
   example:&#x27;老洛克菲勒从16岁第一份工作起捐出收入的6%，一生捐赠相当于今天1000亿美元，建立协和医院、芝加哥大学等。贾里尼克教授要求博士必须「对人类知识体系有所贡献」。小女儿经声乐老师发掘天赋，两次登上卡内基音乐厅。&#x27;,
   anti:&#x27;第一代炒股富豪因缺乏像样兴趣爱好（除看足球外多为嫖娼），最终结局多为破产、被抓或被杀。30岁未认真恋爱、沉溺二次元文化——「以后有时间」=「永远没有时间」。&#x27;},
  {id:&#x27;c10&#x27;,name:&#x27;勿因人之短护己之短&#x27;,star:false,
   def:&#x27;个人责任独立化原则：不以他人错误作为自身免责理由（勿因人之短护己之短），不以自身优势对比他人劣势来标榜能力（勿以人之短炫己之长）。核心是聚焦自身问题，追求专业深度而非错位比较。&#x27;,
   analogy:&#x27;如同交通执法：被交警拦下后辩称「别人也超速了」不会被采纳——讨论的是你的违规行为，他人的问题另案处理。同样，宣称「我是最会编程的产品经理」无法证明你作为产品经理的核心能力。&#x27;,
   example:&#x27;Google高情商员工强纳森被批评嗓门大时辩解「你那天讲话调门也很高」，总监戴维回应：「你提醒得很好，但今天你的调门确实高了，此事与他人无关。」分离责任，聚焦当前问题。&#x27;,
   anti:&#x27;某人宣称「赢了两位世界冠军」——在国际象棋上赢网球冠军，在网球上赢国际象棋冠军。本质是以自身优势对比他人劣势，无法证明真实能力，也不会获得真正认可。&#x27;},
  {id:&#x27;c11&#x27;,name:&#x27;朋友关系之道&#x27;,star:false,
   def:&#x27;朋友关系的核心是能提供的价值而非财富。合作型朋友需事前明确利益分配（避免谈利益伤感情的误区）、避免跨维度合作（如替朋友理财）、平等对待依靠型朋友。轻诺自己做不到的事等同于坑朋友。&#x27;,
   analogy:&#x27;如同商业合资企业：成功的合资企业在签约前就会明确股权、退出机制、决策权限。朋友合作同理——模糊的预期是关系破裂的最大隐患。好的关系像好的合同：条款清晰、双方满意、可预期。&#x27;,
   example:&#x27;方苞以布衣身份成为康雍乾三朝智囊，因能为皇帝提供智力价值而非依赖财富。Google同事明确可帮忙的边界，建立清晰预期。团队运动中队友在球场上的默契不跨界到生意场。&#x27;,
   anti:&#x27;中国上市民企共同创始人因利益分配反目不撕者凤毛麟角——有人因1亿元断绝数十年友谊。替朋友理财或大额借贷易导致「钱友两失」。条件优越的闺蜜过度付出，因地位差异使关系疏远。&#x27;}
];

    activeTab = parseInt(e.target.dataset.tab);
    document.querySelectorAll(&#x27;.tab-btn&#x27;).forEach(b=&gt;b.classList.remove(&#x27;active&#x27;));
    e.target.classList.add(&#x27;active&#x27;);
    document.querySelectorAll(&#x27;.tab-content&#x27;).forEach(c=&gt;c.classList.remove(&#x27;active&#x27;));
    document.getElementById(&#x27;tab&#x27;+activeTab).classList.add(&#x27;active&#x27;);
    if(activeTab===0) renderSVG();
    if(activeTab===4) renderReview();
    if(activeTab===5) renderMindmap();
    if(activeTab===6) renderSocratic();
    if(activeTab===7) renderCaseStudy();
    if(activeTab===8) renderSimGame();
  }
});

function switchTab(i) {
  document.querySelectorAll(&#x27;.tab-btn&#x27;).forEach(b=&gt;b.classList.remove(&#x27;active&#x27;));
  document.querySelector(&#x27;.tab-btn[data-tab=&quot;&#x27;+i+&#x27;&quot;]&#x27;).classList.add(&#x27;active&#x27;);
  document.querySelectorAll(&#x27;.tab-content&#x27;).forEach(c=&gt;c.classList.remove(&#x27;active&#x27;));
  document.getElementById(&#x27;tab&#x27;+i).classList.add(&#x27;active&#x27;);
  activeTab = i;
  if(i===4) renderReview();
  if(i===5) renderMindmap();
  if(i===6) renderSocratic();
  if(i===7) renderCaseStudy();
  if(i===8) renderSimGame();
}

// ── PROGRESS ──
function updateProgress() {
  const count = Object.keys(learned).length;
  const pct = Math.round(count/12*100);
  document.getElementById(&#x27;progressPct&#x27;).textContent = pct+&#x27;%&#x27;;
  document.getElementById(&#x27;progressFill&#x27;).style.width = pct+&#x27;%&#x27;;
  document.getElementById(&#x27;learnedCount&#x27;).textContent = count;
  updateLearnedBtn();
}
function updateLearnedBtn() {
  const btn = document.getElementById(&#x27;learnedBtn&#x27;);
  if(learned[concepts[cardIdx].id]) {
    btn.textContent = &#x27;✓ 已学习&#x27;;
    btn.classList.add(&#x27;marked&#x27;);
  } else {
    btn.textContent = &#x27;标记「已学习」&#x27;;
    btn.classList.remove(&#x27;marked&#x27;);
  }
}
function toggleLearned() {
  const id = concepts[cardIdx].id;
  if(learned[id]) { delete learned[id]; }
  else { learned[id] = true; }
  save(); updateProgress();
}

// ── FLIP CARDS ──
function showCard() {
  const c = concepts[cardIdx];
  document.getElementById(&#x27;flipTitle&#x27;).textContent = c.name;
  document.getElementById(&#x27;flipDef&#x27;).textContent = c.def;
  document.getElementById(&#x27;flipAnalogy&#x27;).textContent = c.analogy;
  document.getElementById(&#x27;flipExample&#x27;).textContent = c.example;
  document.getElementById(&#x27;flipAnti&#x27;).textContent = c.anti;
  document.getElementById(&#x27;cardIdx&#x27;).textContent = (cardIdx+1)+&#x27; / 12&#x27;;
  document.getElementById(&#x27;flipper&#x27;).classList.remove(&#x27;flipped&#x27;);
  updateLearnedBtn();
}
function prevCard() { cardIdx = (cardIdx-1+12)%12; showCard(); }
function nextCard() { cardIdx = (cardIdx+1)%12; showCard(); }
document.getElementById(&#x27;flipper&#x27;).addEventListener(&#x27;click&#x27;,function(){
  this.classList.toggle(&#x27;flipped&#x27;);
});

// ── QUIZ ──
function randomizeQuiz() {
  quizRandomOrder = mcQuestions.map((_,i)=&gt;i).sort(()=&gt;Math.random()-.5);
  renderQuiz();
}
function renderQuiz(filtered) {
  const ids = filtered || (quizRandomOrder.length ? quizRandomOrder : mcQuestions.map((_,i)=&gt;i));
  let html = &#x27;&#x27;;
  ids.forEach((idx,i)=&gt;{
    const q = mcQuestions[idx];
    html += &#x27;&lt;div class=&quot;quiz-card&quot; id=&quot;qcard&#x27;+idx+&#x27;&quot;&gt;&lt;h4&gt;&#x27;+(i+1)+&#x27;. &#x27;+q.q+&#x27;&lt;/h4&gt;&#x27;;
    q.opts.forEach((o,j)=&gt;{
      html += &#x27;&lt;div class=&quot;quiz-opt&quot; data-q=&quot;&#x27;+idx+&#x27;&quot; data-o=&quot;&#x27;+j+&#x27;&quot; onclick=&quot;selectMC(this)&quot;&gt;&#x27;+&#x27;ABCD&#x27;[j]+&#x27;. &#x27;+o+&#x27;&lt;/div&gt;&#x27;;
    });
    html += &#x27;&lt;div class=&quot;quiz-feedback&quot; id=&quot;qfb&#x27;+idx+&#x27;&quot;&gt;&lt;/div&gt;&lt;/div&gt;&#x27;;
  });
  document.getElementById(&#x27;quizMC&#x27;).innerHTML = html;
  renderSA();
}
function selectMC(el) {
  const qid = parseInt(el.dataset.q);
  const oid = parseInt(el.dataset.o);
  const card = document.getElementById(&#x27;qcard&#x27;+qid);
  if(card.querySelector(&#x27;.quiz-opt.correct&#x27;)||card.querySelector(&#x27;.quiz-opt.wrong&#x27;)) return;
  card.querySelectorAll(&#x27;.quiz-opt&#x27;).forEach(o=&gt;o.classList.remove(&#x27;selected&#x27;));
  el.classList.add(&#x27;selected&#x27;);
  const q = mcQuestions[qid];
  const fb = document.getElementById(&#x27;qfb&#x27;+qid);
  if(oid === q.ans) {
    el.classList.add(&#x27;correct&#x27;);
    fb.className = &#x27;quiz-feedback ok show&#x27;;
    fb.textContent = &#x27;✓ 正确！&#x27; + concepts[parseInt(q.concept.slice(1))].name;
  } else {
    el.classList.add(&#x27;wrong&#x27;);
    card.querySelectorAll(&#x27;.quiz-opt&#x27;)[q.ans].classList.add(&#x27;correct&#x27;);
    fb.className = &#x27;quiz-feedback err show&#x27;;
    fb.textContent = &#x27;✗ 错误。正确答案是 &#x27; + &#x27;ABCD&#x27;[q.ans] + &#x27;。来源：&#x27; + concepts[parseInt(q.concept.slice(1))].name;
    wrongBook.push({qid:qid,time:Date.now()});
    save();
  }
}
function renderSA() {
  let html = &#x27;&#x27;;
  saQuestions.forEach((q,i)=&gt;{
    html += &#x27;&lt;div class=&quot;quiz-card&quot;&gt;&lt;h4&gt;&#x27;+(i+1)+&#x27;. &#x27;+q.q+&#x27;&lt;/h4&gt;&#x27;;
    html += &#x27;&lt;textarea style=&quot;width:100%;min-height:80px;border:1px solid var(--border);border-radius:8px;padding:12px;font-family:inherit;font-size:14px;resize:vertical;background:#fff;&quot; placeholder=&quot;输入你的回答...&quot;&gt;&lt;/textarea&gt;&#x27;;
    html += &#x27;&lt;p style=&quot;font-size:12px;color:var(--sub);margin-top:4px;&quot;&gt;关联概念：&#x27;+concepts[parseInt(q.concept.slice(1))].name+&#x27;&lt;/p&gt;&lt;/div&gt;&#x27;;
  });
  document.getElementById(&#x27;quizSA&#x27;).innerHTML = html;
}

// ── EXAM ──
function startExam() {
  if(examActive) return;
  examActive = true; examSec = 900;
  document.getElementById(&#x27;startExamBtn&#x27;).style.display=&#x27;none&#x27;;
  document.getElementById(&#x27;examResult&#x27;).style.display=&#x27;none&#x27;;
  userAnswers = {};
  const selMC = mcQuestions.map((_,i)=&gt;i).sort(()=&gt;Math.random()-.5).slice(0,7);
  const selSA = saQuestions.map((_,i)=&gt;i).sort(()=&gt;Math.random()-.5).slice(0,3);
  let html = &#x27;&#x27;;
  selMC.forEach((idx,i)=&gt;{
    const q = mcQuestions[idx];
    html += &#x27;&lt;div class=&quot;quiz-card&quot; style=&quot;text-align:left&quot;&gt;&lt;h4&gt;选择&#x27;+(i+1)+&#x27;. &#x27;+q.q+&#x27;&lt;/h4&gt;&#x27;;
    q.opts.forEach((o,j)=&gt;{
      html += &#x27;&lt;div class=&quot;quiz-opt&quot; data-examq=&quot;mc_&#x27;+idx+&#x27;&quot; data-examo=&quot;&#x27;+j+&#x27;&quot; onclick=&quot;selectExam(this)&quot;&gt;&#x27;+&#x27;ABCD&#x27;[j]+&#x27;. &#x27;+o+&#x27;&lt;/div&gt;&#x27;;
    });
    html += &#x27;&lt;/div&gt;&#x27;;
  });
  selSA.forEach((idx,i)=&gt;{
    html += &#x27;&lt;div class=&quot;quiz-card&quot; style=&quot;text-align:left&quot;&gt;&lt;h4&gt;简答&#x27;+(i+1)+&#x27;. &#x27;+saQuestions[idx].q+&#x27;&lt;/h4&gt;&#x27;;
    html += &#x27;&lt;textarea data-examq=&quot;sa_&#x27;+idx+&#x27;&quot; style=&quot;width:100%;min-height:60px;border:1px solid var(--border);border-radius:8px;padding:12px;font-family:inherit;font-size:14px;resize:vertical;background:#fff;&quot;&gt;&lt;/textarea&gt;&#x27;;
    html += &#x27;&lt;/div&gt;&#x27;;
  });
  html += &#x27;&lt;button class=&quot;btn&quot; style=&quot;margin-top:16px;&quot; onclick=&quot;submitExam()&quot;&gt;提交试卷&lt;/button&gt;&#x27;;
  document.getElementById(&#x27;examArea&#x27;).innerHTML = html;
  updateExamTimer();
  examTimer = setInterval(function(){
    examSec--;
    updateExamTimer();
    if(examSec&lt;=0) { submitExam(); }
  },1000);
}
function updateExamTimer() {
  const m = Math.floor(examSec/60);
  const s = examSec%60;
  document.getElementById(&#x27;examTimer&#x27;).textContent = m+&#x27;:&#x27;+(s&lt;10?&#x27;0&#x27;:&#x27;&#x27;)+s;
  if(examSec&lt;60) document.getElementById(&#x27;examTimer&#x27;).style.color=&#x27;#e74c3c&#x27;;
}
function selectExam(el) {
  const card = el.parentElement;
  card.querySelectorAll(&#x27;.quiz-opt&#x27;).forEach(o=&gt;o.classList.remove(&#x27;selected&#x27;));
  el.classList.add(&#x27;selected&#x27;);
  userAnswers[el.dataset.examq] = parseInt(el.dataset.examo);
}
function submitExam() {
  clearInterval(examTimer); examActive = false;
  let score = 0; let totalMC = 0;
  document.querySelectorAll(&#x27;#examArea .quiz-card&#x27;).forEach(card=&gt;{
    const sel = card.querySelector(&#x27;.quiz-opt.selected&#x27;);
    if(sel) {
      const qkey = sel.dataset.examq;
      if(qkey.startsWith(&#x27;mc_&#x27;)) {
        totalMC++;
        const qid = parseInt(qkey.slice(3));
        const ans = mcQuestions[qid].ans;
        if(parseInt(sel.dataset.examo)===ans) score++;
        else { wrongBook.push({qid:qid,time:Date.now()}); save(); }
      }
    }
  });
  // Also collect textarea answers
  document.querySelectorAll(&#x27;#examArea textarea&#x27;).forEach(ta=&gt;{
    userAnswers[ta.dataset.examq] = ta.value;
  });
  save();
  const pct = totalMC&gt;0 ? Math.round(score/totalMC*100) : 0;
  document.getElementById(&#x27;examArea&#x27;).innerHTML = &#x27;&#x27;;
  document.getElementById(&#x27;examResult&#x27;).style.display = &#x27;block&#x27;;
  document.getElementById(&#x27;examResult&#x27;).innerHTML = &#x27;&lt;div class=&quot;card&quot; style=&quot;text-align:center&quot;&gt;&#x27;+
    &#x27;&lt;h3&gt;考试完成&lt;/h3&gt;&lt;p style=&quot;font-size:32px;color:var(--accent);font-weight:bold;margin:16px 0;&quot;&gt;&#x27;+score+&#x27; / &#x27;+totalMC+&#x27;&lt;/p&gt;&#x27;+
    &#x27;&lt;p&gt;正确率 &#x27;+pct+&#x27;%&lt;/p&gt;&#x27;+
    &#x27;&lt;p style=&quot;color:var(--sub);font-size:13px;&quot;&gt;简答题请自行对照概念卡片评估&lt;/p&gt;&#x27;+
    &#x27;&lt;button class=&quot;btn btn-outline&quot; style=&quot;margin-top:12px;&quot; onclick=&quot;startExam()&quot;&gt;重新考试&lt;/button&gt;&lt;/div&gt;&#x27;;
  document.getElementById(&#x27;startExamBtn&#x27;).style.display = &#x27;inline-block&#x27;;
}

// ── REVIEW ──
function renderReview() {
  // Stats
  const total = mcQuestions.length;
  const wrong = wrongBook.length;
  const correct = total - new Set(wrongBook.map(w=&gt;w.qid)).size;
  const days = Math.max(1,Math.ceil((Date.now()-Math.min(...wrongBook.map(w=&gt;w.time),Date.now()))/86400000));
  document.getElementById(&#x27;statsGrid&#x27;).innerHTML =
    &#x27;&lt;div class=&quot;stat-card&quot;&gt;&lt;div class=&quot;num&quot;&gt;&#x27;+total+&#x27;&lt;/div&gt;&lt;div class=&quot;label&quot;&gt;总题数&lt;/div&gt;&lt;/div&gt;&#x27;+
    &#x27;&lt;div class=&quot;stat-card&quot;&gt;&lt;div class=&quot;num&quot;&gt;&#x27;+(total-wrong)+&#x27;&lt;/div&gt;&lt;div class=&quot;label&quot;&gt;已掌握&lt;/div&gt;&lt;/div&gt;&#x27;+
    &#x27;&lt;div class=&quot;stat-card&quot;&gt;&lt;div class=&quot;num&quot;&gt;&#x27;+wrong+&#x27;&lt;/div&gt;&lt;div class=&quot;label&quot;&gt;错题次数&lt;/div&gt;&lt;/div&gt;&#x27;+
    &#x27;&lt;div class=&quot;stat-card&quot;&gt;&lt;div class=&quot;num&quot;&gt;&#x27;+Object.keys(learned).length+&#x27;/12&lt;/div&gt;&lt;div class=&quot;label&quot;&gt;概念已学&lt;/div&gt;&lt;/div&gt;&#x27;;

  // Wrong book
  let whtml = &#x27;&lt;p style=&quot;color:var(--sub);&quot;&gt;共 &#x27;+wrongBook.length+&#x27; 条错题记录&lt;/p&gt;&#x27;;
  const recentWrong = wrongBook.slice(-10).reverse();
  recentWrong.forEach(w=&gt;{
    const q = mcQuestions[w.qid];
    whtml += &#x27;&lt;div class=&quot;quiz-card&quot;&gt;&lt;p style=&quot;font-size:14px;&quot;&gt;&#x27;+q.q+&#x27;&lt;/p&gt;&#x27;;
    whtml += &#x27;&lt;p style=&quot;color:var(--green);font-size:13px;&quot;&gt;正确答案：&#x27;+&#x27;ABCD&#x27;[q.ans]+&#x27;. &#x27;+q.opts[q.ans]+&#x27;&lt;/p&gt;&#x27;;
    whtml += &#x27;&lt;p style=&quot;color:var(--sub);font-size:12px;&quot;&gt;&#x27;+new Date(w.time).toLocaleString()+&#x27; | &#x27;+concepts[parseInt(q.concept.slice(1))].name+&#x27;&lt;/p&gt;&lt;/div&gt;&#x27;;
  });
  document.getElementById(&#x27;wrongBook&#x27;).innerHTML = whtml || &#x27;&lt;p style=&quot;color:var(--sub);&quot;&gt;暂无错题记录&lt;/p&gt;&#x27;;

  // Weak concepts
  const conceptErrors = {};
  wrongBook.forEach(w=&gt;{
    const c = mcQuestions[w.qid].concept;
    conceptErrors[c] = (conceptErrors[c]||0)+1;
  });
  let chtml = &#x27;&#x27;;
  const sorted = Object.entries(conceptErrors).sort((a,b)=&gt;b[1]-a[1]);
  sorted.forEach(([cid,count])=&gt;{
    const c = concepts[parseInt(cid.slice(1))];
    chtml += &#x27;&lt;div class=&quot;card flex-between&quot;&gt;&lt;span&gt;&#x27;+c.name+&#x27;&lt;/span&gt;&lt;span class=&quot;tag tag-red&quot;&gt;&#x27;+count+&#x27; 次错误&lt;/span&gt;&lt;/div&gt;&#x27;;
  });
  document.getElementById(&#x27;weakConcepts&#x27;).innerHTML = chtml || &#x27;&lt;p style=&quot;color:var(--sub);&quot;&gt;暂无薄弱概念&lt;/p&gt;&#x27;;
}

function toggleNode(el) {
  el.classList.toggle(&#x27;open&#x27;);
  const children = el.nextElementSibling;
  if(children &amp;&amp; children.classList.contains(&#x27;children&#x27;)) {
    children.classList.toggle(&#x27;open&#x27;);
  }
}

// ── SOCRATIC ──
function renderSocratic() {
  const qas = [
    {q:&#x27;上帝喜欢&quot;笨人&quot;——这个&quot;笨&quot;到底是什么？&#x27;,a:&#x27;&lt;p&gt;这里的&quot;笨&quot;不是智力低下，而是&lt;strong&gt;承认自身能力边界、放弃小聪明、选择系统化方法的智慧&lt;/strong&gt;。威灵顿知道自己没有拿破仑的天赋和感召力，所以选择事无巨细的准备——把做事水平从90分提到95分。现实中多数聪明人恰恰因为高估自己而犯错（中关村ABC公司被骗案）。&lt;/p&gt;&lt;p&gt;追问自己：我最近一次&quot;耍小聪明&quot;是什么时候？结果如何？&lt;/p&gt;&#x27;},
    {q:&#x27;为什么&quot;以正合&quot;必须是首要的？只靠&quot;出奇制胜&quot;行不行？&#x27;,a:&#x27;&lt;p&gt;历史上多数成功源于&lt;strong&gt;正合优势&lt;/strong&gt;而非奇谋。奥斯特里茨战役中苏尔特正面抵御主力的功劳大于贝尔纳多特预备队。F1超车多在直道（靠性能与技术），而非弯道。&lt;/p&gt;&lt;p&gt;&quot;只靠奇&quot;的问题在于：①没有正面基础，奇兵无法发挥作用（苏尔特垮了，预备队也没用）；②投机心态忽视积累，最终实力不足。高三数学备考中确保会做的题不丢分（正），远重于攻克难题（奇）。&lt;/p&gt;&#x27;},
    {q:&#x27;在免费成为标配的时代，&quot;超越免费&quot;是不是一句空话？&#x27;,a:&#x27;&lt;p&gt;不是空话，因为&lt;strong&gt;稀缺性永远不会消失&lt;/strong&gt;。免费的吸引力恰恰源于物品的稀缺性——当稀缺性消失（如Google免费饮料随时可得），免费就失去了吸引力。&lt;/p&gt;&lt;p&gt;超越免费的关键是制造新的稀缺性：iPhone X独特性导致排队购买、医生专业诊断无法被免费信息替代、老中医的个性化诊疗、朋友间的信任资本——这些都是免费无法复制的。&lt;/p&gt;&#x27;},
    {q:&#x27;&quot;众利勿为&quot;会不会让我错过风口？&#x27;,a:&#x27;&lt;p&gt;这取决于你追求的是&lt;strong&gt;短期风口还是长期价值&lt;/strong&gt;。回顾历史：千团大战模仿Groupon无一盈利、大量山寨虚拟货币失败、共享单车市场中庸才和蠢才迅速淘汰——众人趋之若鹜的领域，往往已无利润空间。&lt;/p&gt;&lt;p&gt;真正的机会在&quot;部分人看好，部分人看不懂&quot;的领域出现。最佳投资时机往往在争议中出现，而非一致看好时。十字路口差异化开店（加油站→便利店→快餐店→咖啡店）才是可持续模式。&lt;/p&gt;&#x27;},
    {q:&#x27;&quot;谋事在人成事在天&quot;——这是不是消极不作为的借口？&#x27;,a:&#x27;&lt;p&gt;恰恰相反，这是&lt;strong&gt;最务实的积极态度&lt;/strong&gt;。它承认世界复杂性远超出个人认知——任何难事都涉及多维度因素，个人努力仅能控制部分。这不是放弃努力，而是避免两种陷阱：①成功后过度自傲（忽视运气因素）；②失败后过度自责（忽视不可控因素）。&lt;/p&gt;&lt;p&gt;肯尼迪批准阿波罗计划但未见证成功——尽人事的价值超越结果。真正的智慧是：尽最大努力做好自己能控制的部分，然后坦然接受任何结果。&lt;/p&gt;&#x27;}
  ];
  let html = &#x27;&#x27;;
  qas.forEach(qa=&gt;{
    html += &#x27;&lt;div class=&quot;socratic-q&quot; onclick=&quot;this.nextElementSibling.classList.toggle(\&#x27;open\&#x27;)&quot;&gt;&lt;h4&gt;&#x27;+qa.q+&#x27;&lt;/h4&gt;&lt;/div&gt;&#x27;;
    html += &#x27;&lt;div class=&quot;socratic-a&quot;&gt;&#x27;+qa.a+&#x27;&lt;/div&gt;&#x27;;
  });
  document.getElementById(&#x27;socratic&#x27;).innerHTML = html;
}

  &lt;p style=&quot;color:var(--sub);margin-bottom:16px;&quot;&gt;用MKS四维度拆解这场改变欧洲历史的战役，验证「上帝喜欢笨人」的核心逻辑&lt;/p&gt;

    &lt;tr&gt;&lt;th&gt;维度&lt;/th&gt;&lt;th&gt;威尔顿（笨人）&lt;/th&gt;&lt;th&gt;拿破仑（天才）&lt;/th&gt;&lt;th&gt;启示&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;认知框架&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;承认无拿破仑式天赋，依靠系统化准备&lt;/td&gt;&lt;td&gt;高度自信于军事天赋和战场临机应变能力&lt;/td&gt;&lt;td&gt;准确自我认知是决策质量的前提&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;行动方法&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;事无巨细的准备——以横制纵层层设防，目标仅为「守住阵地等盟军」&lt;/td&gt;&lt;td&gt;依赖战术天才和军队士气，启用平庸的格鲁西追击普军&lt;/td&gt;&lt;td&gt;超额准备弥补天赋差距；不做超越能力边界的事&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;价值判断&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;保守防御的价值 &gt; 气势如虹的胜利的价值（后者风险更高）&lt;/td&gt;&lt;td&gt;追求决定性胜利的荣誉和战略价值&lt;/td&gt;&lt;td&gt;在能力边界内定义成功标准，不追求「人间奇迹」&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;处世原则&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;从荷兰战败中吸取教训——战前组织混乱是致命伤，从此坚持系统化流程&lt;/td&gt;&lt;td&gt;对过往胜绩的路径依赖，未因应新形势调整&lt;/td&gt;&lt;td&gt;从失败中提炼原则并坚持执行，比依赖过往成功更可靠&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;
  &lt;p style=&quot;margin-top:16px;font-size:14px;line-height:1.7;&quot;&gt;&lt;strong&gt;MKS结论：&lt;/strong&gt;天才拿破仑一生指挥60+战役胜绩超过亚历山大、汉尼拔和凯撒总和，却在最关键一战输给「笨人」威灵顿。这不是偶然——&lt;strong&gt;长期来看，系统化的笨办法比依赖天赋的聪明办法有更高的概率正确性&lt;/strong&gt;。滑铁卢战役决定性的因素（法军人才缺失、天气限制炮兵、威灵顿的超额准备）全部指向一个结论：在复杂系统中，减少可避免的错误（笨办法的优势）比增加亮点操作（天才的优势）更能决定最终结果。&lt;/p&gt;&lt;/div&gt;`;
}

// ── DECISION SIM ──
function renderSimGame() {
  document.getElementById(&#x27;simGame&#x27;).innerHTML = `
&lt;div class=&quot;sim-scenario&quot; id=&quot;sim1&quot;&gt;
  &lt;h3&gt;第 1 轮：职业选择&lt;/h3&gt;
  &lt;p&gt;你是一名有3年经验的软件工程师，手头有两个offer：&lt;br&gt;A. 一家热门区块链创业公司，薪资+期权package高出30%，团队20人&lt;br&gt;B. 一家稳定的大型科技公司（类似Google），薪资一般但平台资源丰富&lt;/p&gt;
  &lt;div class=&quot;sim-options&quot;&gt;
    &lt;div class=&quot;sim-opt&quot; onclick=&quot;simChoose(this,&#x27;sim1&#x27;,&#x27;A&#x27;)&quot;&gt;A. 选区块链创业公司——风口上的机会不容错过&lt;/div&gt;
    &lt;div class=&quot;sim-opt&quot; onclick=&quot;simChoose(this,&#x27;sim1&#x27;,&#x27;B&#x27;)&quot;&gt;B. 选大型科技公司——平台和见识比短期薪资更重要&lt;/div&gt;
    &lt;div class=&quot;sim-opt&quot; onclick=&quot;simChoose(this,&#x27;sim1&#x27;,&#x27;C&#x27;)&quot;&gt;C. 都不选，继续寻找其他机会&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;sim-feedback&quot; id=&quot;sim1fb&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;sim-scenario&quot; id=&quot;sim2&quot; style=&quot;display:none;&quot;&gt;
  &lt;h3&gt;第 2 轮：合作困境&lt;/h3&gt;
  &lt;p&gt;你和大学好友合伙创业3年，公司估值已达5000万。好友提议引入他的表弟（能力一般）担任CTO，你不同意。好友说「不让我表弟加入就是不信任我」。&lt;/p&gt;
  &lt;div class=&quot;sim-options&quot;&gt;
    &lt;div class=&quot;sim-opt&quot; onclick=&quot;simChoose(this,&#x27;sim2&#x27;,&#x27;A&#x27;)&quot;&gt;A. 妥协同意——朋友关系比公司管理更重要&lt;/div&gt;
    &lt;div class=&quot;sim-opt&quot; onclick=&quot;simChoose(this,&#x27;sim2&#x27;,&#x27;B&#x27;)&quot;&gt;B. 坚持拒绝——事前明确利益分配和用人标准是合作的前提&lt;/div&gt;
    &lt;div class=&quot;sim-opt&quot; onclick=&quot;simChoose(this,&#x27;sim2&#x27;,&#x27;C&#x27;)&quot;&gt;C. 提出折中方案——让表弟先实习3个月再决定&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;sim-feedback&quot; id=&quot;sim2fb&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;sim-scenario&quot; id=&quot;sim3&quot; style=&quot;display:none;&quot;&gt;
  &lt;h3&gt;第 3 轮：投资决策&lt;/h3&gt;
  &lt;p&gt;你有一笔100万元的闲置资金。身边所有人都在谈论某只AI概念股，3个月涨了200%。你的理性分析认为估值已经过高，但身边买入的朋友都在赚钱。&lt;/p&gt;
  &lt;div class=&quot;sim-options&quot;&gt;
    &lt;div class=&quot;sim-opt&quot; onclick=&quot;simChoose(this,&#x27;sim3&#x27;,&#x27;A&#x27;)&quot;&gt;A. 跟风买入——大家都在赚钱我不能错过&lt;/div&gt;
    &lt;div class=&quot;sim-opt&quot; onclick=&quot;simChoose(this,&#x27;sim3&#x27;,&#x27;B&#x27;)&quot;&gt;B. 投资大盘指数基金——与市场长期趋势站在一起&lt;/div&gt;
    &lt;div class=&quot;sim-opt&quot; onclick=&quot;simChoose(this,&#x27;sim3&#x27;,&#x27;C&#x27;)&quot;&gt;C. 什么都不投，持币观望&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;sim-feedback&quot; id=&quot;sim3fb&quot;&gt;&lt;/div&gt;

}

function simChoose(el, simId, choice) {
  el.parentElement.querySelectorAll(&#x27;.sim-opt&#x27;).forEach(o=&gt;o.classList.remove(&#x27;chosen&#x27;));
  el.classList.add(&#x27;chosen&#x27;);
  const fb = document.getElementById(simId+&#x27;fb&#x27;);
  fb.classList.add(&#x27;show&#x27;);
  if(simId===&#x27;sim1&#x27;) {
    if(choice===&#x27;B&#x27;) {
      fb.className = &#x27;sim-feedback good show&#x27;;
      fb.innerHTML = &#x27;&lt;strong&gt;✓ 推荐选择。&lt;/strong&gt;依据「五级工程师」和「牛尾vs鸡首」原则：大平台提供更高的见识、格局和气度成长空间。区块链创业公司属于「众利」领域，大多数山寨公司已无利润空间。牛尾（大平台普通员工）可通过持续进步成为牛首；鸡首需所在组织成长为&quot;牛&quot;才有升级可能。&#x27;;
    } else if(choice===&#x27;A&#x27;) {
      fb.className = &#x27;sim-feedback meh show&#x27;;
      fb.innerHTML = &#x27;&lt;strong&gt;⚠ 有风险。&lt;/strong&gt;参照「众利勿为」原则——区块链技术因过度追捧，大多数公司难以颠覆现有巨头。千团大战的前车之鉴：盲目跟风最终相互碾压。除非你确信该公司具有真正的技术壁垒和差异化优势。&#x27;;
    } else {
      fb.className = &#x27;sim-feedback meh show&#x27;;
      fb.innerHTML = &#x27;&lt;strong&gt;⚠ 可以理解但不推荐。&lt;/strong&gt;完全放弃现有offer继续寻找，可能陷入「永远在找更好的」拖延陷阱。建议选择一个方向后踏实积累——「实力派获胜是大概率事件」。&#x27;;
    }
  } else if(simId===&#x27;sim2&#x27;) {
    if(choice===&#x27;B&#x27;) {
      fb.className = &#x27;sim-feedback good show&#x27;;
      fb.innerHTML = &#x27;&lt;strong&gt;✓ 正确。&lt;/strong&gt;依据「朋友关系之道」核心原则：合作前必须明确利益分配和用人标准。让能力不足的人担任CTO是跨维度合作——既损害公司利益，最终也会伤害朋友关系。轻诺自己做不到的事等同于坑朋友。真正的朋友能理解专业判断与个人关系的区分。&#x27;;
    } else if(choice===&#x27;A&#x27;) {
      fb.className = &#x27;sim-feedback bad show&#x27;;
      fb.innerHTML = &#x27;&lt;strong&gt;✗ 高风险。&lt;/strong&gt;参照中国上市民企共同创始人因利益分配反目的教训——因感情妥协而模糊专业标准，是关系破裂的最大隐患。今天因&quot;不信任&quot;而妥协，明天可能因公司失败而真正破裂。&#x27;;
    } else {
      fb.className = &#x27;sim-feedback meh show&#x27;;
      fb.innerHTML = &#x27;&lt;strong&gt;⚠ 折中但未解决根本问题。&lt;/strong&gt;实习3个月只是推迟了决策——核心是能力标准，而非时间问题。应在合作之初就明确告诉好友：CTO人选必须满足客观的能力标准，这与个人感情无关。&#x27;;
    }
  } else if(simId===&#x27;sim3&#x27;) {
    if(choice===&#x27;B&#x27;) {
      fb.className = &#x27;sim-feedback good show&#x27;;
      fb.innerHTML = &#x27;&lt;strong&gt;✓ 最优选择。&lt;/strong&gt;依据「不做空、不杠杆、指数投资」原则：与市场长期趋势站在一起。美国股市45年平均年复合增长6.7%，若错过25个涨幅最高日，总回报差距达19倍vs3.7倍。AI概念股已上涨200%属于「众利」——日中则移，月盈则亏。&#x27;;
    } else if(choice===&#x27;A&#x27;) {
      fb.className = &#x27;sim-feedback bad show&#x27;;
      fb.innerHTML = &#x27;&lt;strong&gt;✗ 危险。&lt;/strong&gt;依据「众利勿为」和做空的底层逻辑——虽然你不是做空，但追高买入已属「群体共识」的末端。当菜市场大妈都在讨论AI概念股时，往往已是行情尾声。散户将偶然成功归结为必然，易导致后续重大失败。&#x27;;
    } else {
      fb.className = &#x27;sim-feedback meh show&#x27;;
      fb.innerHTML = &#x27;&lt;strong&gt;⚠ 保守但合理。&lt;/strong&gt;持币观望比盲目追高好，但完全不做投资意味着错过市场的长期复利。建议至少配置一部分到指数基金——「以正合」（指数定投）是常规积累，「以奇胜」（个股选择）是额外加分。&#x27;;
    }
  }
  // Show next sim
  if(simId===&#x27;sim1&#x27;) document.getElementById(&#x27;sim2&#x27;).style.display=&#x27;block&#x27;;
  if(simId===&#x27;sim2&#x27;) document.getElementById(&#x27;sim3&#x27;).style.display=&#x27;block&#x27;;
}

{n:&#x27;最后发明家&#x27;,d:&#x27;发明的荣誉归于完成&quot;质变&quot;并实现社会价值的人，而非最早提出想法的人。&#x27;,a:&#x27;如同最后一棒接力选手——前几棒都重要，但公众记住的是冲线的那一位。&#x27;,e:&#x27;贝尔vs格雷：同一天提交电话专利，但贝尔2年内实现300公里长途通话。&#x27;,f:&#x27;穆奇1860年展示类似电话设备但声音不清，未实现实用化，公众认知薄弱。&#x27;},
{n:&#x27;双刃剑效应&#x27;,d:&#x27;任何一种发明的价值判断会随时间和认知深化而变化，需在利弊间动态权衡。&#x27;,a:&#x27;如同药物的&quot;治疗窗口&quot;——剂量过低无效，过高则中毒，需在两端之间找到平衡。&#x27;,e:&#x27;DDT：曾拯救5亿人免于疟疾，后因环境危害全球禁用，2006年有限回归非洲。&#x27;,f:&#x27;海洛因：最初作为安全镇痛药上市（&quot;英雄&quot;之意），后成为最危险毒品之一。&#x27;},
{n:&#x27;商业化能力&#x27;,d:&#x27;将技术转化为可规模生产、可盈利商品的能力，是发明产生社会价值的关键放大器。&#x27;,a:&#x27;如同将家庭菜谱变成连锁餐厅——会做菜和会开店是完全不同的能力。&#x27;,e:&#x27;爱迪生：不仅发明电灯，还建立发电厂、输电网络，构建完整电力商业系统。&#x27;,f:&#x27;协和式超音速客机：技术领先但商业化失败，因高票价+差体验无法持续运营。&#x27;},
{n:&#x27;跨领域迁移&#x27;,d:&#x27;将一个领域已解决的问题模式迁移到新领域，而非从零探索。&#x27;,a:&#x27;如同学会骑自行车后再学摩托车——平衡原理可迁移，只需适应新控制方式。&#x27;,e:&#x27;莱特兄弟：从自行车转弯的倾斜原理，悟出飞机横向控制（机翼翘曲）。&#x27;,f:&#x27;鸟飞派AI：试图模仿人类神经元工作方式，但当前成功的AI多基于统计学习。&#x27;},
{n:&#x27;从偶然到必然&#x27;,d:&#x27;把靠运气的单次成功，通过理解原理、建立流程、记录数据，转化为可重复的稳定产出。&#x27;,a:&#x27;如同从&quot;偶然做出好吃的菜&quot;到&quot;拥有标准菜谱和SOP的餐厅厨房&quot;。&#x27;,e:&#x27;中国草木灰上釉：从炭渣溅落偶然形成釉面，到主动浸泡草木灰浆实现可控上釉。&#x27;,f:&#x27;清代外贸瓷：缺乏质量标准，盒类变形、盘塌底，最终被日本瓷器取代。&#x27;}
];

const mcQuestions = [
{q:&#x27;瓷器发明的核心条件不包括哪一项？&#x27;,o:[&#x27;隔水技术&#x27;,&#x27;高温（1300℃+）&#x27;,&#x27;高岭土&#x27;,&#x27;上釉技术&#x27;],a:0,r:&#x27;隔水技术不是瓷器发明的核心条件。瓷器需要高温（1300℃+）、高岭土和上釉技术三大条件。&#x27;},
{q:&#x27;莱特兄弟成功的关键方法论是什么？&#x27;,o:[&#x27;模仿鸟类飞行&#x27;,&#x27;风洞试验+系统验证&#x27;,&#x27;更大的发动机功率&#x27;,&#x27;轻质材料&#x27;],a:1,r:&#x27;莱特兄弟打造风洞测试200多种翼形，进行上千次试验，而非依赖试飞或模仿鸟类。&#x27;},
{q:&#x27;瓦克斯曼在发现链霉素之前错过了几次关键机会？&#x27;,o:[&#x27;1次&#x27;,&#x27;2次&#x27;,&#x27;3次&#x27;,&#x27;4次&#x27;],a:2,r:&#x27;1923年发现放线菌杀菌现象、1932年观察到结核病人埋葬地无菌、1935年试管中结核菌被真菌杀死。&#x27;},
{q:&#x27;DDT的发明人穆勒获得了什么奖项？&#x27;,o:[&#x27;诺贝尔化学奖&#x27;,&#x27;诺贝尔和平奖&#x27;,&#x27;普利策奖&#x27;,&#x27;诺贝尔生理学或医学奖&#x27;],a:3,r:&#x27;1948年，瑞士化学家穆勒因发现DDT的杀虫高效性获得诺贝尔生理学或医学奖。&#x27;},
{q:&#x27;阿司匹林和海洛因的共同发明者是谁？&#x27;,o:[&#x27;霍夫曼&#x27;,&#x27;弗莱明&#x27;,&#x27;瓦克斯曼&#x27;,&#x27;诺伊斯&#x27;],a:0,r:&#x27;德国拜耳公司科学家霍夫曼在1897年8月先后发明了阿司匹林（8月10日）和海洛因（8月21日）。&#x27;},
{q:&#x27;仙童&quot;八叛徒&quot;融资成功的关键转折是什么？&#x27;,o:[&#x27;获得政府资助&#x27;,&#x27;找到菲尔柴尔德家族&#x27;,&#x27;申请银行贷款&#x27;,&#x27;向肖克利求助&#x27;],a:1,r:&#x27;初期联系30家传统企业均失败，最终通过阿瑟·洛克找到菲尔柴尔德家族（IBM最大股东），获150万美元。&#x27;},
{q:&#x27;在仙童公司完成集成电路发明的是谁？&#x27;,o:[&#x27;肖克利&#x27;,&#x27;基尔比&#x27;,&#x27;诺伊斯&#x27;,&#x27;张忠谋&#x27;],a:2,r:&#x27;诺伊斯在仙童公司完成基于硅晶片的集成电路发明；基尔比同期在德州仪器独立完成基于锗的版本。&#x27;},
{q:&#x27;欧洲再发明瓷器超越中国的核心方法论是什么？&#x27;,o:[&#x27;更优质的原料&#x27;,&#x27;更先进的窑炉&#x27;,&#x27;政府资金支持&#x27;,&#x27;系统实验+详细记录&#x27;],a:3,r:&#x27;伯特格尔4年完成3万次实验并用密码记录，实现可叠加进步；中国工匠凭经验无记录，技艺易失传。&#x27;},
{q:&#x27;马斯克特斯拉面临的第一轮&quot;轮盘赌&quot;是什么？&#x27;,o:[&#x27;押宝Roadster跑车&#x27;,&#x27;押宝Model S&#x27;,&#x27;押宝超级充电站&#x27;,&#x27;押宝Model 3&#x27;],a:0,r:&#x27;2004-2008年，马斯克投资特斯拉押宝Roadster（莲花跑车改装），经历交付危机后艰难存活。&#x27;},
{q:&#x27;链霉素争议中，1952年诺贝尔生理学或医学奖给了谁？&#x27;,o:[&#x27;沙茨&#x27;,&#x27;瓦克斯曼单独获得&#x27;,&#x27;沙茨和瓦克斯曼共同获得&#x27;,&#x27;弗莱明&#x27;],a:1,r:&#x27;瓦克斯曼单独获得诺贝尔奖；沙茨申诉未获支持，直到1994年罗格斯大学才授予其最高荣誉奖章。&#x27;},
{q:&#x27;青花瓷成功实现全球热销的核心原因是什么？&#x27;,o:[&#x27;中国政府的贸易政策&#x27;,&#x27;价格比竞争对手低&#x27;,&#x27;多元文化融合设计&#x27;,&#x27;产能规模优势&#x27;],a:2,r:&#x27;蒙古白色基底+伊斯兰蓝色纹饰+汉族传统图案+欧洲纯白审美=四重文化融合的全球产品。&#x27;},
{q:&#x27;张忠谋16字经营方针中不包括哪一项？&#x27;,o:[&#x27;锁定客户&#x27;,&#x27;坚守阵地&#x27;,&#x27;设置障碍&#x27;,&#x27;降低成本&#x27;],a:3,r:&#x27;张忠谋16字方针为&quot;锁定客户、坚守阵地、设置障碍，永远创新&quot;，未包含&quot;降低成本&quot;。&#x27;},
{q:&#x27;海洛因的命名源自什么语言？&#x27;,o:[&#x27;德语&quot;英雄&quot;&#x27;,&#x27;英语&quot;治愈&quot;&#x27;,&#x27;法语&quot;力量&quot;&#x27;,&#x27;拉丁语&quot;希望&quot;&#x27;],a:0,r:&#x27;源自德语&quot;Heroisch&quot;（英雄），因服用后产生&quot;英雄般兴奋感&quot;而命名。&#x27;},
{q:&#x27;自动驾驶L5级别的定义是什么？&#x27;,o:[&#x27;高速公路辅助驾驶&#x27;,&#x27;全场景无人工干预&#x27;,&#x27;城市道路自动驾驶&#x27;,&#x27;自动泊车功能&#x27;],a:1,r:&#x27;L5是完全无人驾驶，全场景无人工干预，无方向盘和刹车。Waymo已实现L5级商业运营。&#x27;},
{q:&#x27;美国阿波罗登月计划使用的火箭是？&#x27;,o:[&#x27;猎鹰重型&#x27;,&#x27;N-1火箭&#x27;,&#x27;土星五号&#x27;,&#x27;R-7火箭&#x27;],a:2,r:&#x27;冯·布劳恩设计的土星五号，迄今人类最大的火箭，1967-1973年发射13次全部成功。&#x27;},
{q:&#x27;莱特兄弟之前最重要的滑翔机研究先驱是谁？&#x27;,o:[&#x27;达·芬奇&#x27;,&#x27;凯利爵士&#x27;,&#x27;博雷利&#x27;,&#x27;李林塔尔&#x27;],a:3,r:&#x27;李林塔尔完成2000多次滑翔飞行并留下大量实验数据，其升力数据（虽有60%误差）成为莱特兄弟的起点。&#x27;},
{q:&#x27;凯利爵士对飞行理论的核心贡献是什么？&#x27;,o:[&#x27;升力与推力机理分离&#x27;,&#x27;内燃机轻量化&#x27;,&#x27;风洞测试方法&#x27;,&#x27;机翼材料选择&#x27;],a:0,r:&#x27;凯利提出升力（由固定机翼提供）与推力（由动力装置提供）分离理论，成为航空学经典。&#x27;},
{q:&#x27;&quot;最后发明家&quot;理论的核心原因是什么？&#x27;,o:[&#x27;专利制度的偏向性&#x27;,&#x27;完成质变并实现社会价值&#x27;,&#x27;媒体的选择性报道&#x27;,&#x27;政府支持力度不同&#x27;],a:1,r:&#x27;发明是量变→质变的过程，公众记住的是完成质变并使其普及的&quot;最后发明家&quot;（如贝尔vs穆奇）。&#x27;},
{q:&#x27;FDA三期临床试验的核心验证方法是什么？&#x27;,o:[&#x27;单盲测试&#x27;,&#x27;专家评审&#x27;,&#x27;双盲测试&#x27;,&#x27;市场反馈&#x27;],a:2,r:&#x27;三期临床试验采用双盲测试：实验组给药、对照组给安慰剂，医患均不知分组，排除主观偏见。&#x27;},
{q:&#x27;对SpaceX&quot;重型猎鹰&quot;火箭的技术评价，行业共识是什么？&#x27;,o:[&#x27;世界第一的航天技术&#x27;,&#x27;超越土星五号&#x27;,&#x27;中国航天的主要竞争对手&#x27;,&#x27;三流技术，一流公关&#x27;],a:3,r:&#x27;行业评价&quot;三流的技术，二流的财务，一流的公关&quot;——核心发动机性能远低于中俄主力引擎。&#x27;}
];

// Short answer questions
const saQuestions = [
{q:&#x27;简述&quot;从发现到发明&quot;的核心区别，并以青霉素为例说明。&#x27;,r:&#x27;发现是识别现象（弗莱明发现青霉菌杀菌），发明是将发现转化为可用产品（弗洛里和钱恩提取出可注射的青霉素药品）。发现是0→1，发明是1→N的全过程：优化、量产、临床试验、商业化，缺一不可。&#x27;},
{q:&#x27;为什么说&quot;系统性方法&quot;是发明可重复成功的核心？&#x27;,r:&#x27;系统性方法将发明从&quot;碰运气&quot;转化为&quot;可规划&quot;：通过结构流程设计、详细实验记录、可叠加的知识传承，实现可复制的成功。欧洲再发明瓷器（4年3万次记录实验）vs中国瓷器（工匠经验易失传）是最好的对比。&#x27;},
{q:&#x27;莱特兄弟相比李林塔尔，在方法论上有什么根本不同？&#x27;,r:&#x27;李林塔尔主要依赖试飞和经验积累，莱特兄弟则采用科学方法：打造风洞测试200多种翼形、进行上千次地面试验、修正前人的升力计算错误、先完成滑翔验证再启动动力研发。从&quot;模仿鸟类&quot;到&quot;原理创新&quot;的思维转变。&#x27;},
{q:&#x27;为什么DDT的认知经历了&quot;神药→毒药→有限回归&quot;的过程？&#x27;,r:&#x27;最初因杀虫高效和疟疾防控（拯救5亿人）被视为神药；1962年《寂静的春天》揭示其食物链富集危害和环境持久性（半衰期15-150年）；2006年联合国因非洲疟疾失控允许有限回归，反映&quot;双刃剑效应&quot;的动态权衡。&#x27;},
{q:&#x27;仙童公司的集成电路发明给今天的创新者哪些启示？&#x27;,r:&#x27;①功能封装降低下游门槛；②继承是颠覆的基础（诺伊斯继承并改进肖克利技术）；③精准融资决定成败（找对理解技术的投资者）；④高效沟通能力（诺伊斯一句话打动菲尔柴尔德家族）。&#x27;},
{q:&#x27;马斯克的&quot;俄罗斯轮盘赌&quot;模式对创业者的核心警示是什么？&#x27;,r:&#x27;脱离自身能力边界的冒险等同于自杀式轮盘赌。马斯克能四轮存活依赖三大独特要素：超高资源效率、关键节点的运气、极端决断力。简单复制模式而忽视创始人能力+历史机遇+资源效率的差异，会导致&quot;形似神不似&quot;。&#x27;},
{q:&#x27;为什么日本瓷器能在17-19世纪取代中国瓷器在欧洲的市场地位？&#x27;,r:&#x27;①品质稳定性：日本工艺精细、质量稳定 vs 中国清代外贸瓷存在变形、厚薄不均等问题；②品牌建设：&quot;有田烧&quot;成为欧洲知名品牌 vs 中国失去品牌优势；③创新能力：从仿制快速进入原创（赤绘瓷器）。&#x27;},
{q:&#x27;张忠谋&quot;半导体设计与制造分离&quot;模式为什么改变了全球半导体产业？&#x27;,r:&#x27;该模式降低行业门槛，催生大量专注于芯片设计的创业公司（无晶圆厂模式），加速了全球半导体技术创新。台积电通过极致化运营（高成品率、持续研发投入）维持40%以上毛利率，证明了这一模式的商业可行性。&#x27;},
{q:&#x27;青花瓷和iPhone在&quot;全球化产品&quot;设计上有什么共通逻辑？&#x27;,r:&#x27;两者都是多元文化融合的产物——青花瓷融合蒙古（白色）、伊斯兰（蓝色）、汉文化（纹饰）、欧洲（纯白审美）四重元素；iPhone融合东方禅宗（&quot;少即是多&quot;）、德国工业设计、全球极简审美。均通过开放的文化态度打破地域限制，无需强制灌输即获得全球接受。&#x27;},
{q:&#x27;为什么说&quot;可叠加进步&quot;比&quot;创新速度&quot;更重要？&#x27;,r:&#x27;可叠加进步确保每次创新都成为后续发展的台阶，形成知识复利效应。中国瓷器虽有先发优势，但因缺乏记录导致技艺失传、出现退步；欧洲瓷器通过系统记录和科学方法，50年即超越中国千年积累。长期看，可持续的叠加进步比追求速度更高效。&#x27;}
];

}

function buildTree(node,level){
let h=`&lt;li&gt;&lt;span class=&quot;toggle${node.c?&#x27; open&#x27;:&#x27;&#x27;}&quot; onclick=&quot;toggleTree(this)&quot;&gt;${node.c?&#x27;&#x27;:&#x27;&#x27;}&lt;/span&gt;${node.n}`;
if(node.c){
h+=`&lt;ul class=&quot;children open&quot;&gt;${node.c.map(c=&gt;buildTree(c,level+1)).join(&#x27;&#x27;)}&lt;/ul&gt;`;
}
h+=&#x27;&lt;/li&gt;&#x27;;
return h;
}

function renderSocratic(){
const qs=[
{concept:&#x27;系统性方法&#x27;,layers:[
{q:&#x27;为什么&quot;多做实验&quot;不等于系统性方法？&#x27;,a:&#x27;系统性方法的核心在于&quot;结构化&quot;——每个实验有明确假设、控制变量、可量化结果和可追溯记录。盲目试错（如美第奇家族造瓷百年失败）缺乏方向，是低效的。系统方法让每个失败都有价值——它告诉你哪条路不通，而不仅仅是&quot;这次没成功&quot;。&#x27;},
{q:&#x27;如果系统性方法这么好，为什么中国古代工匠不用？&#x27;,a:&#x27;不是因为&quot;笨&quot;，而是因为知识传承的社会结构不同。中国古代瓷器工匠依赖师徒口传心授，配方保密是竞争壁垒。欧洲启蒙运动后形成的科学共同体文化——公开、同行评议、优先权竞争——催生了系统性记录的动力。方法的差异本质上是制度的差异。&#x27;},
{q:&#x27;系统性方法会扼杀创造力吗？&#x27;,a:&#x27;恰恰相反。系统性方法是创造力的&quot;脚手架&quot;——它消除了低水平的重复试错，把精力留给真正需要灵感的部分。莱特兄弟用风洞系统测试200多种翼形，正是这种&quot;枯燥&quot;的系统工作，让他们在关键的控制问题上做出了革命性的创新。&#x27;}
]},
{concept:&#x27;从发现到发明&#x27;,layers:[
{q:&#x27;弗莱明发现了青霉素，为什么不是他获得诺贝尔奖？（实际他获得了）&#x27;,a:&#x27;弗莱明确实获得了1945年诺贝尔奖（与弗洛里、钱恩共享）。但关键是：弗莱明1928年的发现只是&quot;0到1&quot;，之后他未能提取出可用的青霉素。弗洛里和钱恩花了10年才完成&quot;1到N&quot;——提取、纯化、量产。诺奖同时授予三人，正是对&quot;全链条&quot;的认可。&#x27;},
{q:&#x27;在创业语境中，&quot;从发现到发明&quot;对应什么常见错误？&#x27;,a:&#x27;最常见的错误是&quot;点子迷信&quot;——认为有一个好想法就等于成功。实际上，想法（发现）的价值接近于零，执行（发明）才是一切。Airbnb的想法很多人都有过，但只有Brian Chesky团队完成了从&quot;出租气垫床&quot;到全球住宿平台的系统工程。&#x27;}
]},
{concept:&#x27;可叠加进步&#x27;,layers:[
{q:&#x27;可叠加进步和&quot;站在巨人肩膀上&quot;有什么区别？&#x27;,a:&#x27;&quot;站在巨人肩膀上&quot;是一种结果描述；可叠加进步是一种方法论——它要求你主动创造&quot;可被叠加&quot;的条件：记录、标准化、开放知识、建立可引用的知识体系。中国也有&quot;巨人&quot;（如汝窑工匠），但后人站不上去，因为技艺随人消亡。可叠加进步是&quot;让肩膀可站上去&quot;的工程。&#x27;},
{q:&#x27;为什么说可叠加进步比&quot;颠覆式创新&quot;更重要？&#x27;,a:&#x27;颠覆是结果，叠加是过程。真正改变世界的创新很少是凭空而来的&quot;颠覆&quot;——iPhone的触屏技术积累了几十年，集成电路是晶体管自然演化的产物。追求可叠加进步意味着每一步都在为未来铺路，长期复利远超偶尔的&quot;颠覆性突破&quot;。&#x27;}
]},
{concept:&#x27;最后发明家&#x27;,layers:[
{q:&#x27;这个概念是否对早期探索者不公平？&#x27;,a:&#x27;从个体角度看确实&quot;不公平&quot;——格雷只比贝尔晚半天提交专利。但从社会角度看，这个规则有它的合理性：荣誉信号的激励应该指向&quot;把事情做成&quot;而非&quot;想到&quot;。如果&quot;想到&quot;就能获得同等荣誉，就没有人愿意投入资源去&quot;做到&quot;。专利制度正是用&quot;先到先得&quot;来鼓励&quot;快速执行&quot;。&#x27;},
{q:&#x27;如何在团队中避免&quot;最后发明家困境&quot;——即只有最后集成的人获得认可？&#x27;,a:&#x27;这是管理问题而非发明规律。莱特兄弟的做法是典范：两兄弟共享荣誉，不区分个人贡献。在组织中，可以通过透明的贡献记录、合理的署名权分配、以及&quot;全链条&quot;的考核机制来确保每个阶段的贡献都被看见。&#x27;}
]}
];
let h=&#x27;&#x27;;
qs.forEach((item,i)=&gt;{
h+=`&lt;div class=&quot;card&quot; style=&quot;padding:14px&quot;&gt;&lt;h4 style=&quot;color:var(--accent);margin-bottom:8px&quot;&gt;${item.concept}&lt;/h4&gt;`;
item.layers.forEach((l,j)=&gt;{
h+=`&lt;div class=&quot;socratic-q&quot; onclick=&quot;this.nextElementSibling.classList.toggle(&#x27;open&#x27;)&quot;&gt;
&lt;div class=&quot;q&quot;&gt;第${j+1}层：${l.q}&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;socratic-a&quot;&gt;${l.a}&lt;/div&gt;`;
});
h+=`&lt;/div&gt;`;
});
document.getElementById(&#x27;socraticQuestions&#x27;).innerHTML=h;
}

.exam-result .score{font-size:2.4rem;font-weight:700;color:var(--accent)}
.exam-result .grade{font-size:1.1rem;margin:6px 0;color:var(--text2)}

/* Mindmap */
.mindmap-tree{font-size:.85rem;padding-left:8px}
.mindmap-node{margin:3px 0}
.mindmap-toggle{cursor:pointer;user-select:none;color:var(--accent);font-weight:700}
.mindmap-toggle::before{content:&#x27;▸ &#x27;;display:inline-block;transition:transform .2s;font-size:.75rem}
.mindmap-toggle.open::before{transform:rotate(90deg)}
.mindmap-children{display:none;padding-left:20px;border-left:2px solid var(--border);margin-left:8px}
.mindmap-children.open{display:block}
.mindmap-leaf{color:var(--text2);padding:2px 0}

/* Socratic */
.socratic-item{margin-bottom:10px}
.socratic-q{
  background:var(--card);border:1px solid var(--border);border-radius:8px;
  padding:10px 14px;cursor:pointer;font-size:.88rem;font-weight:600;
  display:flex;justify-content:space-between;align-items:center;transition:all .2s;
}
.socratic-q:hover{border-color:var(--accent)}
.socratic-q.open{border-color:var(--accent);border-radius:8px 8px 0 0}
.socratic-a{
  display:none;background:var(--tag-bg);border:1px solid var(--border);
  border-top:none;border-radius:0 0 8px 8px;padding:12px 14px;font-size:.83rem;
}
.socratic-a.open{display:block}

/* Decision sim */
.sim-scenario{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:14px}
.sim-scenario h3{color:var(--accent);margin-bottom:8px}
.sim-choices{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.sim-choice{
  padding:10px 14px;border:1px solid var(--border);border-radius:8px;
  cursor:pointer;font-size:.85rem;transition:all .15s
}
.sim-choice:hover{background:var(--tag-bg);border-color:var(--accent)}
.sim-choice.chosen{border-color:var(--accent);background:var(--tag-bg)}
.sim-feedback{font-size:.85rem;padding:12px;border-radius:8px;margin-top:8px;display:none}
.sim-feedback.show{display:block}
.sim-feedback.good{background:#e8f8ef;border:1px solid var(--green)}
.sim-feedback.mid{background:#fef9e7;border:1px solid var(--gold)}
.sim-feedback.bad{background:#fef0f0;border:1px solid var(--accent)}

/* Stat table */
.stat-table{width:100%;border-collapse:collapse;font-size:.83rem;margin:8px 0}
.stat-table th,.stat-table td{padding:8px 10px;border:1px solid var(--border);text-align:left}
.stat-table th{background:var(--tag-bg);font-weight:600;color:var(--accent)}
.stat-table tr:nth-child(even){background:var(--card)}

/* Boundary table */
.boundary-table{width:100%;border-collapse:collapse;font-size:.82rem}
.boundary-table td{padding:6px 10px;border:1px solid var(--border)}
.boundary-table td:first-child{font-weight:600;color:var(--accent);white-space:nowrap}

/* Button */
.btn{
  display:inline-block;padding:8px 20px;border-radius:20px;border:none;
  background:var(--accent);color:#fff;font-size:.88rem;cursor:pointer;
  transition:all .2s;text-align:center;
}
.btn:hover{background:var(--accent2);transform:translateY(-1px)}
.btn-outline{background:transparent;border:1.5px solid var(--accent);color:var(--accent)}
.btn-outline:hover{background:var(--accent);color:#fff}
.btn-sm{padding:5px 14px;font-size:.78rem}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* Tags */
.tag{display:inline-block;background:var(--tag-bg);color:var(--accent);font-size:.75rem;padding:2px 8px;border-radius:10px;margin:2px}

/* Footer */
.footer{text-align:center;padding:30px 0 20px;font-size:.78rem;color:var(--text2);border-top:1px solid var(--border);margin-top:30px}

/* Mobile */
@media(max-width:600px){
  .concept-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .flip-inner,.flip-front,.flip-back{min-height:320px}
  .tab-btn{padding:5px 10px;font-size:.75rem}
}

   def:&#x27;由美国政治学家伊恩·布雷默提出：横轴为改革程度，纵轴为期望结果。改革初期因打破原有平衡出现短期衰退（下行段），但坚持越过拐点后进入持续上升通道（上行段），整体呈J形。&#x27;,
   analogy:&#x27;如同健身减肥——开始运动后肌肉增加、脂肪减少，体重不降反升（下行段），很多人因此放弃。坚持3个月后体型明显改善（上行段）。&#x27;,
   example:&#x27;中国改革开放初期物价上涨、社会抱怨（下行段），坚持后实现持续经济腾飞（上行段）。日本足球专注学习巴西模式20年，不频繁换教练，完成J曲线跃迁。&#x27;,

  {id:&#x27;stoploss&#x27;,name:&#x27;止损——斩断厄运链&#x27;,icon:&#x27;✂️&#x27;,brief:&#x27;接受局部损失避免更大灾难，拒绝&quot;堤内损失堤外补&quot;的侥幸心理&#x27;,core:true,
   def:&#x27;面对坏运气或决策失误时，接受已发生的损失，避免为补救小错而引发更大连锁灾难。核心是认知到&quot;厄运会被错误应对方式放大&quot;。&#x27;,
   analogy:&#x27;如同拔牙——蛀牙初期处理很简单，拖延不治会导致感染扩散，最终需要根管治疗甚至拔掉多颗牙。止损就是&quot;第一次牙痛就去看牙医&quot;。&#x27;,
   example:&#x27;淮海战役国民党为救44军→赔上5个兵团→失去长江以北。巴菲特强调&quot;永远不要用杠杆投资&quot;就是为了预防被迫平仓的厄运链。&#x27;,
   counter:&#x27;伯奇尔香肠事件——为晾香肠开窗→引海鸥→扔鞋驱鸟→吹风机短路→禁入酒店17年。每一步都可用&quot;止损&quot;中止。&#x27;},
  {id:&#x27;drucker&#x27;,name:&#x27;德鲁克定律&#x27;,icon:&#x27;🎯&#x27;,brief:&#x27;用&quot;贡献&quot;替代&quot;成就&quot;，关注对客户、员工、股东的长期价值&#x27;,core:true,
   def:&#x27;彼得·德鲁克的核心管理定律：从词汇中删除&quot;成就&quot;（Achievement），代之以&quot;贡献&quot;（Contribution）。企业贡献的三大对象：客户（创造和留住顾客）、员工（提供发展机会）、股东（带来长期回报）。&#x27;,
   analogy:&#x27;如同种树——成就是&quot;今天摘了多少果子&quot;（短期），贡献是&quot;这片林十年后能养活多少人&quot;（长期）。只顾摘果子会把树枝折断。&#x27;,
   example:&#x27;Google&quot;公民奖&quot;奖励帮助他人项目解决技术问题的员工；贝恩研究显示用户留存率每提高5%利润提升25-95%——老客户的价值远超新客户。&#x27;,
   counter:&#x27;雅虎/MSN仅关注用户绝对数量（成就指标），忽视用户粘性和满意度（贡献指标），最终被市场淘汰。中国大学教授量化考核（论文数、经费额）导致短期主义。&#x27;},
  {id:&#x27;ogilvy&#x27;,name:&#x27;奥格威定律&#x27;,icon:&#x27;🏢&#x27;,brief:&#x27;雇用比自已更强的人才能建巨人公司，避免&quot;武大郎开店&quot;&#x27;,core:false,
   def:&#x27;大卫·奥格威提出：&quot;如果我们每个人都雇用比我们小的人，我们将成为矮人公司。但如果我们每个人都雇用比我们更高大的人，我们将成为巨人公司。&quot;核心是管理者格局决定组织高度。&#x27;,
   analogy:&#x27;如同组建球队——如果队长只招比自己差的球员（怕被抢风头），球队成绩一定垫底。冠军球队的队长一定是&quot;我宁愿传球给你让你得分&quot;的人。&#x27;,
   example:&#x27;奥美公司流传&quot;俄罗斯套娃&quot;传统，最小娃娃内含奥格威手写纸条；Google早期要求&quot;推荐人必须推荐比自己更强的人&quot;，半数员工来自熟人推荐。&#x27;,
   counter:&#x27;&quot;武大郎开店&quot;——管理者压制比自己高的人，最终组织沦为平庸。Google后期因世界顶级人才数量有限，逐渐成为&quot;整体水平较高但平均水平相对平庸&quot;的公司。&#x27;},
  {id:&#x27;matrix&#x27;,name:&#x27;矩阵式管理&#x27;,icon:&#x27;🔀&#x27;,brief:&#x27;动态项目团队+稳定人事部门，员工双重汇报，适应信息时代快速变化&#x27;,core:false,
   def:&#x27;源自二战后美国研究型大学的管理架构：教授同时隶属院系（人事管理）和实验室（科研活动）。企业版：员工有人事经理（行政培养）和技术经理（项目指导）双重汇报关系。&#x27;,
   analogy:&#x27;如同医院——医生属于科室（如内科，管职称晋升），但参与跨科室会诊（如内科+外科+放射科共同处理一个病例）。病人获得最合适的治疗，医生保持专业深度。&#x27;,
   example:&#x27;Google将人事部门定位为&quot;资源池&quot;（负责培养人才、评估项目），产品部门为&quot;动态团队&quot;（负责项目执行），有效避免部门山头化。麻省理工学院CSAIL实验室规模超1000人跨多系运作。&#x27;,
   counter:&#x27;中国矩阵式管理难以实施——因工业时代&quot;指挥服从关系&quot;思维定式，员工对双重领导天然抵触（&quot;两个老板听谁的&quot;），未完成向&quot;协商-合作&quot;的文化转型。&#x27;},
  {id:&#x27;money&#x27;,name:&#x27;货币本质&#x27;,icon:&#x27;💵&#x27;,brief:&#x27;货币是记账与交换工具，信用重于抵押，形式随时代演进&#x27;,core:false,
   def:&#x27;货币的核心功能是记账和交换媒介，存储功能随经济发展逐渐弱化。金本位→信用货币→电子货币→数字货币的演进路径，本质是&quot;信任基础&quot;从实物抵押→政府信用→算法信任的转移。&#x27;,
   analogy:&#x27;如同微信群积分——群主发的积分本身没有价值，但因为大家都认可它可以在群内兑换福利，它就具备了&quot;货币&quot;功能。信用的本质是&quot;共同想象&quot;。&#x27;,
   example:&#x27;雅浦岛费币（巨石货币）：实物不移动，仅交割所有权，与美联储金库黄金结算原理一致。宋代交子是真正意义的纸币：存款凭证+流通性。&#x27;,
   counter:&#x27;比特币因去中心化验证导致交易成本高达20美元（对比信用卡3美分）、时间2小时-2天，不适合日常交易。且日波动率可达10%，无法满足国际贸易结算需求。&#x27;},
  {id:&#x27;blockchain&#x27;,name:&#x27;区块链&#x27;,icon:&#x27;⛓️&#x27;,brief:&#x27;新型生产关系，重构信任机制与利益分配，AI+IoT+区块链=超级智能&#x27;,core:false,
   def:&#x27;区块链是去中心化的分布式账本技术，被定位为&quot;新型生产关系&quot;而非生产力工具。AI=大脑（决策）、IoT=感官（数据采集）、区块链=神经系统（信任传导）。&#x27;,
   analogy:&#x27;如同微信群聊记录——每个人手机上都存有完整聊天记录（分布式），无法单方面篡改（说到做到）。智能合约就是&quot;群公告自动执行&quot;——发了红包自动分给符合条件的人。&#x27;,
   example:&#x27;Skuchain利用区块链智能合约解决三角债问题：合同签订后资金自动流向供应商，避免挪用。Dfinity将交易效率从比特币的1小时提升至1秒。&#x27;,
   counter:&#x27;99%的虚拟货币为诈骗工具。区块链的&quot;去中心化&quot;导致成本高、效率低——比特币交易成本比信用卡高600倍以上。当前技术初级阶段，需在去中心化和效率之间妥协。&#x27;},
  {id:&#x27;corecomp&#x27;,name:&#x27;核心竞争力&#x27;,icon:&#x27;⚡&#x27;,brief:&#x27;核心技术≠核心竞争力，真正的竞争力是整合资源的能力&#x27;,core:false,
   def:&#x27;企业的核心竞争力不一定是拥有核心技术，而是&quot;整合资源、把事情做好的能力&quot;。德国汽车（保时捷、宝马）变速箱依赖日本Aisin，徕卡/哈苏相机感光器件依赖索尼，但仍然是行业顶尖企业。&#x27;,
   analogy:&#x27;如同厨师的竞争力不是&quot;自己种菜&quot;——米其林大厨的厉害之处是选材眼光和烹饪技艺，而不是拥有菜地和养猪场。万事不求人是农耕思维。&#x27;,
   example:&#x27;小米不拥有手机核心技术（处理器用高通、系统用安卓），但通过&quot;硬件+新零售+互联网服务&quot;铁人三项模式，7年突破千亿营收。核心竞争力是商业模式和用户运营。&#x27;,
   counter:&#x27;董明珠认为小米是&quot;三无公司&quot;（无核心技术、无生产线、无元器件制造），但小米的IoT生态布局远超格力，证明&quot;整合力&gt;自有技术&quot;。格力盲目进入半导体领域恰恰犯了忽视自身特长的错误。&#x27;},
  {id:&#x27;doerr&#x27;,name:&#x27;约翰·杜尔投资哲学&#x27;,icon:&#x27;🔭&#x27;,brief:&#x27;投资未来影响力，选人看四大能力，找潜行公司，构建生态网络&#x27;,core:false,
   def:&#x27;风投之王约翰·杜尔的四维投资框架：①投资对世界有正面影响力的项目（&quot;两年后世界会有什么不同？&quot;）②创始人的四大能力（生意设计运营/盈利与风险管理/机会洞察/资源整合判断）③寻找&quot;潜行&quot;阶段的项目 ④投后构建被投企业互助网络。&#x27;,
   analogy:&#x27;如同电影制片人——不只看剧本（商业计划），更看重导演和演员（创始人团队），在最合适的时候投入资金（不是最早也不是最晚），并通过自己的资源网络帮电影宣发（投后管理）。&#x27;,
   example:&#x27;杜尔问创业者的三个经典问题：&quot;两年后世界会有什么不同？&quot;&quot;为什么Google不做？&quot;&quot;你的壁垒在哪？&quot;成功投资了Google、亚马逊、网景、赛门铁克等。&#x27;,
   counter:&#x27;杜尔的失败案例：赛格威（Segway）售价6000美元，速度安全性矛盾，续航仅20-30公里。新能源基金受戈尔游说投资太阳能，因效率、储电等问题满盘皆输。&#x27;}
];

function renderQuiz(){
  const container=document.getElementById(&#x27;quizList&#x27;);
  container.innerHTML=quizData.map((q,i)=&gt;{
    const done=state.quizDone[i];
    let html=`&lt;div class=&quot;quiz-card${done?done.correct?&#x27; correct&#x27;:&#x27; wrong&#x27;:&#x27;&#x27;}&quot; id=&quot;quizCard${i}&quot;&gt;`;
    html+=`&lt;div class=&quot;quiz-q&quot;&gt;${i+1}. ${q.q}&lt;/div&gt;`;
    q.opts.forEach((opt,j)=&gt;{
      let cls=&#x27;quiz-opt&#x27;;
      if(done){
        if(j===q.ans)cls+=&#x27; correct-ans&#x27;;
        else if(j===done.chosen&amp;&amp;!done.correct)cls+=&#x27; wrong&#x27;;
      }
      html+=`&lt;div class=&quot;${cls}&quot; onclick=&quot;answerQuiz(${i},${j})&quot;&gt;${&#x27;ABCD&#x27;[j]}. ${opt}&lt;/div&gt;`;
    });
    if(done){
      html+=`&lt;div class=&quot;quiz-fb ${done.correct?&#x27;right&#x27;:&#x27;wrong-fb&#x27;}&quot;&gt;${done.correct?&#x27;✓ 正确！&#x27;:&#x27;✗ 错误。&#x27;} ${q.exp}&lt;/div&gt;`;
    }
    html+=&#x27;&lt;/div&gt;&#x27;;
    return html;
  }).join(&#x27;&#x27;);
}

function answerQuiz(qIdx,chosen){
  if(state.quizDone[qIdx])return;
  const q=quizData[qIdx];
  const correct=chosen===q.ans;
  state.quizDone[qIdx]={chosen,correct};
  if(!correct)state.wrongList.push({type:&#x27;mc&#x27;,idx:qIdx,q:q.q,chosen:q.opts[chosen],correctAns:q.opts[q.ans],exp:q.exp,time:Date.now()});
  saveState(state);
  renderQuiz();
  updateProgress();
}
document.getElementById(&#x27;quizReset&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{
  state.quizDone={};state.wrongList=[];saveState(state);renderQuiz();renderReview();
});

let examInterval=null,examSeconds=0,examQuestions=[],examActive=false;
function resetExam(){
  clearInterval(examInterval);examActive=false;examSeconds=0;
  document.getElementById(&#x27;examTimer&#x27;).textContent=&#x27;15:00&#x27;;
  document.getElementById(&#x27;examTimer&#x27;).classList.remove(&#x27;warning&#x27;);
  document.getElementById(&#x27;examContent&#x27;).innerHTML=&#x27;&#x27;;
  document.getElementById(&#x27;examResult&#x27;).style.display=&#x27;none&#x27;;
  document.getElementById(&#x27;examStart&#x27;).style.display=&#x27;&#x27;;
}
document.getElementById(&#x27;examStart&#x27;).addEventListener(&#x27;click&#x27;,startExam);

function startExam(){
  // Pick 7 random MCQs + 3 random short answers
  const mcIndices=shuffleArr([...Array(quizData.length).keys()]).slice(0,7);
  const saIndices=shuffleArr([...Array(shortAnswerData.length).keys()]).slice(0,3);
  examQuestions=[...mcIndices.map(i=&gt;({type:&#x27;mc&#x27;,idx:i,...quizData[i]})),...saIndices.map(i=&gt;({type:&#x27;sa&#x27;,idx:i,...shortAnswerData[i]}))];
  examQuestions=shuffleArr(examQuestions);
  examSeconds=15*60;examActive=true;
  document.getElementById(&#x27;examStart&#x27;).style.display=&#x27;none&#x27;;
  document.getElementById(&#x27;examResult&#x27;).style.display=&#x27;none&#x27;;
  renderExamContent();
  examInterval=setInterval(()=&gt;{
    examSeconds--;
    const m=Math.floor(examSeconds/60),s=examSeconds%60;
    document.getElementById(&#x27;examTimer&#x27;).textContent=m+&#x27;:&#x27;+String(s).padStart(2,&#x27;0&#x27;);
    if(examSeconds&lt;=120)document.getElementById(&#x27;examTimer&#x27;).classList.add(&#x27;warning&#x27;);
    if(examSeconds&lt;=0){submitExam();}
  },1000);
}

function renderExamContent(){
  const container=document.getElementById(&#x27;examContent&#x27;);
  container.innerHTML=examQuestions.map((q,i)=&gt;{
    let h=`&lt;div class=&quot;quiz-card&quot; id=&quot;examQ${i}&quot;&gt;&lt;div class=&quot;quiz-q&quot;&gt;${i+1}. ${q.q}&lt;/div&gt;`;
    if(q.type===&#x27;mc&#x27;){
      q.opts.forEach((opt,j)=&gt;{
        h+=`&lt;div class=&quot;quiz-opt&quot; onclick=&quot;selectExamOpt(${i},${j})&quot; id=&quot;examOpt${i}_${j}&quot;&gt;${&#x27;ABCD&#x27;[j]}. ${opt}&lt;/div&gt;`;
      });
    }else{
      h+=`&lt;textarea id=&quot;examSA${i}&quot; style=&quot;width:100%;min-height:80px;border:1px solid var(--border);border-radius:6px;padding:8px;font-size:.85rem;font-family:inherit&quot; placeholder=&quot;请输入你的答案...&quot;&gt;&lt;/textarea&gt;`;
    }
    h+=&#x27;&lt;/div&gt;&#x27;;
    return h;
  }).join(&#x27;&#x27;);
  container.innerHTML+=`&lt;button class=&quot;btn&quot; onclick=&quot;submitExam()&quot; style=&quot;margin-top:12px&quot;&gt;提交试卷&lt;/button&gt;`;
}

const examAnswers={};
function selectExamOpt(qIdx,optIdx){
  if(!examActive)return;
  examAnswers[qIdx]=optIdx;
  examQuestions[qIdx].opts.forEach((_,j)=&gt;{
    const el=document.getElementById(&#x27;examOpt&#x27;+qIdx+&#x27;_&#x27;+j);
    if(el)el.classList.toggle(&#x27;selected&#x27;,j===optIdx);
  });
}

function submitExam(){
  clearInterval(examInterval);examActive=false;
  let mcCorrect=0,mcTotal=0,saTotal=0;
  const results=[];
  examQuestions.forEach((q,i)=&gt;{
    if(q.type===&#x27;mc&#x27;){
      mcTotal++;
      const chosen=examAnswers[i];
      const correct=chosen===q.ans;
      if(correct)mcCorrect++;
      results.push({q:q.q,correct,chosen:chosen!==undefined?q.opts[chosen]:&#x27;未作答&#x27;,correctAns:q.opts[q.ans]});
      if(!correct&amp;&amp;chosen!==undefined){
        state.wrongList.push({type:&#x27;mc&#x27;,idx:q.idx,q:q.q,chosen:q.opts[chosen],correctAns:q.opts[q.ans],exp:q.exp,time:Date.now()});
      }
    }else{
      saTotal++;
    }
  });
  const score=mcCorrect;
  const total=mcTotal;
  saveState(state);

  const pct=Math.round(score/total*100);
  let grade=&#x27;&#x27;,suggestion=&#x27;&#x27;;
  if(pct&gt;=85){grade=&#x27;优秀&#x27;;suggestion=&#x27;概念掌握扎实，继续保持！&#x27;;}
  else if(pct&gt;=60){grade=&#x27;良好&#x27;;suggestion=&#x27;建议复习错题对应的核心概念。&#x27;;}
  else{grade=&#x27;需加强&#x27;;suggestion=&#x27;建议回到知识卡片模式系统学习。&#x27;;}

  const weakConcepts=[...new Set(results.filter(r=&gt;!r.correct).map(r=&gt;r.q))].slice(0,3).join(&#x27;、&#x27;);

  document.getElementById(&#x27;examContent&#x27;).innerHTML=&#x27;&#x27;;
  document.getElementById(&#x27;examResult&#x27;).style.display=&#x27;block&#x27;;
  document.getElementById(&#x27;examResult&#x27;).innerHTML=`
    &lt;div class=&quot;score&quot;&gt;${score} / ${total}&lt;/div&gt;
    &lt;div class=&quot;grade&quot;&gt;评级：${grade}（正确率 ${pct}%）&lt;/div&gt;
    &lt;p style=&quot;font-size:.88rem;color:var(--text2);margin:8px 0&quot;&gt;${suggestion}&lt;/p&gt;
    ${weakConcepts?`&lt;p style=&quot;font-size:.83rem;color:var(--accent)&quot;&gt;薄弱概念：${weakConcepts}&lt;/p&gt;`:&#x27;&#x27;}
    &lt;p style=&quot;font-size:.78rem;color:var(--text2)&quot;&gt;简答题请对照参考答案自行评估（答对要点即得分）&lt;/p&gt;
    &lt;button class=&quot;btn btn-outline btn-sm&quot; onclick=&quot;switchTab(4)&quot;&gt;查看错题&lt;/button&gt;
    &lt;h3 style=&quot;margin-top:16px&quot;&gt;题目解析&lt;/h3&gt;
    ${results.map((r,i)=&gt;`&lt;div style=&quot;text-align:left;font-size:.83rem;padding:6px 0;border-bottom:1px solid var(--border)&quot;&gt;${i+1}. ${r.q}&lt;br&gt;&lt;span style=&quot;color:${r.correct?&#x27;var(--green)&#x27;:&#x27;var(--accent)&#x27;}&quot;&gt;${r.correct?&#x27;✓&#x27;:&#x27;✗&#x27;} 正确答案：${r.correctAns}&lt;/span&gt;${!r.correct&amp;&amp;r.exp?`&lt;br&gt;&lt;span style=&quot;color:var(--text2)&quot;&gt;${r.exp}&lt;/span&gt;`:&#x27;&#x27;}&lt;/div&gt;`).join(&#x27;&#x27;)}
    &lt;button class=&quot;btn&quot; style=&quot;margin-top:12px&quot; onclick=&quot;resetExam()&quot;&gt;重新考试&lt;/button&gt;
  `;
  state.examHistory.push({score,total,pct,date:Date.now()});
  saveState(state);
}

function renderReview(){
  // Wrong book

    wb.innerHTML=&#x27;&lt;p style=&quot;color:var(--text2)&quot;&gt;暂无错题记录。去题库练习吧！&lt;/p&gt;&#x27;;
  }else{
    wb.innerHTML=&#x27;&lt;button class=&quot;btn btn-sm btn-outline&quot; style=&quot;margin-bottom:10px&quot; onclick=&quot;state.wrongList=[];saveState(state);renderReview();renderQuiz();&quot;&gt;清空错题本&lt;/button&gt;&#x27;+state.wrongList.map((w,i)=&gt;`
      &lt;div class=&quot;quiz-card&quot; style=&quot;font-size:.83rem&quot;&gt;

      &lt;/div&gt;
    `).join(&#x27;&#x27;);
  }

  // Stats
  const sp=document.getElementById(&#x27;statsPanel&#x27;);

  const days=state.examHistory.length;
  sp.innerHTML=`
    &lt;div style=&quot;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px&quot;&gt;
      &lt;div class=&quot;card&quot; style=&quot;text-align:center&quot;&gt;&lt;div style=&quot;font-size:2rem;font-weight:700;color:var(--accent)&quot;&gt;${totalMC}&lt;/div&gt;&lt;div style=&quot;font-size:.78rem;color:var(--text2)&quot;&gt;总做题数&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot; style=&quot;text-align:center&quot;&gt;&lt;div style=&quot;font-size:2rem;font-weight:700;color:var(--accent)&quot;&gt;${accuracy}%&lt;/div&gt;&lt;div style=&quot;font-size:.78rem;color:var(--text2)&quot;&gt;正确率&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot; style=&quot;text-align:center&quot;&gt;&lt;div style=&quot;font-size:2rem;font-weight:700;color:var(--accent)&quot;&gt;${state.wrongList.length}&lt;/div&gt;&lt;div style=&quot;font-size:.78rem;color:var(--text2)&quot;&gt;错题数&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot; style=&quot;text-align:center&quot;&gt;&lt;div style=&quot;font-size:2rem;font-weight:700;color:var(--accent)&quot;&gt;${days}&lt;/div&gt;&lt;div style=&quot;font-size:.78rem;color:var(--text2)&quot;&gt;考试次数&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot; style=&quot;text-align:center&quot;&gt;&lt;div style=&quot;font-size:2rem;font-weight:700;color:var(--accent)&quot;&gt;${concepts.filter(c=&gt;state.learned[c.id]).length}/${concepts.length}&lt;/div&gt;&lt;div style=&quot;font-size:.78rem;color:var(--text2)&quot;&gt;已学概念&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  `;

  // Weak concepts
  const wc=document.getElementById(&#x27;weakConcepts&#x27;);
  const errorTopics={};
  state.wrongList.forEach(w=&gt;{
    const topic=w.q.split(&#x27;？&#x27;)[0].split(&#x27;的是&#x27;)[0].slice(0,15);
    errorTopics[topic]=(errorTopics[topic]||0)+1;
  });
  const sorted=Object.entries(errorTopics).sort((a,b)=&gt;b[1]-a[1]).slice(0,5);
  if(sorted.length===0){
    wc.innerHTML=&#x27;&lt;p style=&quot;color:var(--text2)&quot;&gt;暂无薄弱概念数据，多做几道题试试。&lt;/p&gt;&#x27;;
  }else{
    wc.innerHTML=sorted.map(([t,n])=&gt;`&lt;div class=&quot;card&quot; style=&quot;border-left:4px solid var(--accent);padding:10px 14px;margin:6px 0&quot;&gt;&lt;strong&gt;${t}&lt;/strong&gt; — 错误${n}次&lt;/div&gt;`).join(&#x27;&#x27;);
  }
}

function buildTree(nodes,depth=0){
  return nodes.map(n=&gt;{
    const hasChildren=n.children&amp;&amp;n.children.length&gt;0;
    const id=&#x27;mm_&#x27;+Math.random().toString(36).slice(2,8);
    if(hasChildren){
      return `&lt;div class=&quot;mindmap-node&quot;&gt;
        &lt;span class=&quot;mindmap-toggle&quot; onclick=&quot;toggleMindmap(&#x27;${id}&#x27;)&quot; id=&quot;${id}_tgl&quot;&gt;${n.label}&lt;/span&gt;
        &lt;div class=&quot;mindmap-children&quot; id=&quot;${id}&quot;&gt;${buildTree(n.children,depth+1)}&lt;/div&gt;
      &lt;/div&gt;`;
    }
    return `&lt;div class=&quot;mindmap-node&quot;&gt;&lt;span class=&quot;mindmap-leaf&quot;&gt;· ${n.label}&lt;/span&gt;&lt;/div&gt;`;
  }).join(&#x27;&#x27;);
}

function toggleMindmap(id){
  const children=document.getElementById(id);
  const toggle=document.getElementById(id+&#x27;_tgl&#x27;);
  children.classList.toggle(&#x27;open&#x27;);
  toggle.classList.toggle(&#x27;open&#x27;);
}

    {q:&#x27;为什么说&quot;高风险不一定带来高回报&quot;？&#x27;,layers:[
      &#x27;正向关系不成立：高风险项目因参与者少，资本可能获得更高议价权，但非必然。真正的高回报需要正确的判断——看对技术、看对人、看对时机。&#x27;,
      &#x27;更深一层：市场有效性会快速消除&quot;低风险高回报&quot;的套利机会，但&quot;高风险低回报&quot;的项目会一直存在，因为信息不对称和认知偏差让大量资本涌入劣质项目。&#x27;,
      &#x27;最底层：投资的本质不是&quot;承担风险&quot;而是&quot;识别风险&quot;。巴菲特和杜尔的超额回报不是因为承担了更多风险，而是因为他们比别人更准确地判断了哪些风险值得承担。&#x27;
    ]},
    {q:&#x27;如果区块链的去中心化导致效率低下，为什么还要研究它？&#x27;,layers:[
      &#x27;区块链的核心价值不在&quot;去中心化&quot;本身，而在&quot;无需信任第三方的信任机制&quot;。智能合约、溯源、数据确权等场景中，信任成本远高于效率成本。&#x27;,
      &#x27;更深一层：区块链的&quot;效率低下&quot;是当前技术阶段的问题，不是本质缺陷。Dfinity已将交易确认时间从1小时降至1秒——技术进步可以缩小效率差距。&#x27;,
      &#x27;最底层：区块链的真正意义是生产关系的重构——当AI替代了大量生产力工作后，人类社会需要新的利益分配机制。区块链提供了&quot;贡献可量化、分配可自动执行&quot;的可能。&#x27;
    ]},
    {q:&#x27;J曲线理论听起来很简单，为什么现实中大部分人仍然做不到？&#x27;,layers:[
      &#x27;因为人天生厌恶损失（损失厌恶偏差）。J曲线下行段的损失是即时、确定的，而上行段的收益是未来、不确定的——大脑的杏仁核会放大当前痛苦。&#x27;,
      &#x27;更深一层：社会评价体系强化了短期主义。资本市场看季度财报、职场看年度绩效、社交媒体追求即时反馈——这些制度性的&quot;反J曲线&quot;机制让坚持变得困难。&#x27;,
      &#x27;最底层：真正的J曲线坚持需要&quot;信念&quot;——不是盲目的固执，而是基于深度认知的确信。巴菲特几年研究一只股票，不是因为他比别人更有耐心，而是他的研究深度让他确信拐点一定会来。&#x27;
    ]},
    {q:&#x27;德鲁克定律说&quot;贡献&gt;成就&quot;，但绩效考核不都是看成就吗？这不矛盾吗？&#x27;,layers:[
      &#x27;德鲁克不是否定成就，而是指出&quot;只关注成就&quot;的管理方式会腐蚀组织的长期能力。成就导向导致抢功劳、短期主义、忽视客户留存——最终成就也会消失。&#x27;,
      &#x27;更深一层：贡献是可以体现在成就中的，但需要更长的评估周期和更多维度的指标。Google把&quot;公民奖&quot;和&quot;服务器90天无故障&quot;视为高绩效——这些都是贡献驱动成就的实践。&#x27;,
      &#x27;最底层：德鲁克定律的真正对象不是员工，而是管理者。管理者选择用什么标准评价人，就决定了组织文化。如果一个组织的管理者只看短期成就，再好的员工也会变成&quot;油滑的人&quot;。&#x27;
    ]},
    {q:&#x27;核心竞争力不是核心技术——那中国企业为什么还要投入芯片自研？&#x27;,layers:[
      &#x27;关键区别：当外部供应商愿意且能够提供一流技术时，自研不是必需的（德国汽车用日本变速箱）。但当供应商&quot;不愿意&quot;或&quot;不能&quot;提供时，自研就是核心竞争力的屏障。&#x27;,
      &#x27;更深一层：华为被断供芯片不是因为没有&quot;整合能力&quot;，而是因为地缘政治改变了供应商的意愿——这属于不可控的外部风险。自研在这种情况下不是效率选择，而是生存选择。&#x27;,
      &#x27;最底层：核心竞争力是动态的——在自由贸易时代整合力是核心竞争力，在技术封锁时代自主可控成为核心竞争力的一部分。小米模式的局限性在市场正常时看不见，在供应链断裂时才暴露。&#x27;
    ]}
  ];
  document.getElementById(&#x27;socraticList&#x27;).innerHTML=questions.map((sq,i)=&gt;`
    &lt;div class=&quot;socratic-item&quot;&gt;
      &lt;div class=&quot;socratic-q&quot; onclick=&quot;toggleSocratic(${i})&quot; id=&quot;sq_q_${i}&quot;&gt;
        &lt;span&gt;${i+1}. ${sq.q}&lt;/span&gt;&lt;span style=&quot;font-size:.75rem;color:var(--text2)&quot;&gt;▶&lt;/span&gt;

    &lt;/div&gt;
  `).join(&#x27;&#x27;);
}
function toggleSocratic(idx){
  const layers=document.querySelectorAll(`[id^=&quot;sq_a_${idx}_&quot;]`);
  const qEl=document.getElementById(&#x27;sq_q_&#x27;+idx);
  const isOpen=layers[0].classList.contains(&#x27;open&#x27;);
  layers.forEach(l=&gt;l.classList.toggle(&#x27;open&#x27;,!isOpen));
  qEl.classList.toggle(&#x27;open&#x27;,!isOpen);
}

    &lt;tr&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;夸克模型/高能物理&lt;/td&gt;&lt;td&gt;讨论物质本质与能量关系时引用&lt;/td&gt;&lt;/tr&gt;

    &lt;tr&gt;&lt;td&gt;4&lt;/td&gt;&lt;td&gt;冯·诺依曼体系结构&lt;/td&gt;&lt;td&gt;理解计算机思维边界限制&lt;/td&gt;&lt;/tr&gt;

&lt;div class=&quot;card&quot;&gt;
  &lt;h2&gt;学习路径（5阶段）&lt;/h2&gt;
  &lt;div class=&quot;path-steps&quot;&gt;
    &lt;div class=&quot;path-step&quot;&gt;
      &lt;div class=&quot;step-num&quot;&gt;1&lt;/div&gt;
      &lt;div class=&quot;step-content&quot;&gt;&lt;h4&gt;世界观奠基：理解文明三条主线&lt;/h4&gt;&lt;p&gt;先掌握「文明三公式」+「世界是能量的」+「非零和博弈」——这是所有内容的总纲。三条公式分别对应：抽象思维基础、物理世界本质、社会协作逻辑。&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;path-step&quot;&gt;
      &lt;div class=&quot;step-num&quot;&gt;2&lt;/div&gt;
      &lt;div class=&quot;step-content&quot;&gt;&lt;h4&gt;历史纵深：文明的起源与分化&lt;/h4&gt;&lt;p&gt;学习「文明的起源」（从掠夺到守规矩）、「农耕vs商业文明」的对比、希腊神话与欧洲文化原点，理解东西方文明分野的历史根源。&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;path-step&quot;&gt;
      &lt;div class=&quot;step-num&quot;&gt;3&lt;/div&gt;
      &lt;div class=&quot;step-content&quot;&gt;&lt;h4&gt;思维工具：信息论与博弈论&lt;/h4&gt;&lt;p&gt;掌握「信息论方法论」（不确定性应对）、「旅行者困境」（教育内卷的数学解释）、「日神与酒神」（创造力的人性基础）。&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;path-step&quot;&gt;
      &lt;div class=&quot;step-num&quot;&gt;4&lt;/div&gt;
      &lt;div class=&quot;step-content&quot;&gt;&lt;h4&gt;现代应用：全球化与IT时代&lt;/h4&gt;&lt;p&gt;理解「三大IT定律」、中美在哪生活更好的五维决策框架、俄罗斯vs印度的发展路径对比、莎士比亚与俾斯麦的历史智慧。&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;path-step&quot;&gt;
      &lt;div class=&quot;step-num&quot;&gt;5&lt;/div&gt;
      &lt;div class=&quot;step-content&quot;&gt;&lt;h4&gt;补完拓展：边界知识 + 审美素养&lt;/h4&gt;&lt;p&gt;冰岛/英伦/希腊旅游审美、歌剧与古典音乐、瓷器与全球化贸易史——这些「边界知识」在需要时快速查阅即可，但不必背诵。&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

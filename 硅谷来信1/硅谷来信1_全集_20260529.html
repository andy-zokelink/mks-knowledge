  cursor: pointer; transition: transform 0.2s;
}
.concept-card:hover { transform: translateY(-2px); }
.concept-card.star { border-left-color: var(--accent); }
.concept-card .num {
  display: inline-block; width: 26px; height: 26px; line-height: 26px;
  text-align: center; background: var(--accent2); color: #fff;
  border-radius: 50%; font-size: 13px; margin-right: 6px;
}
.concept-card.star .num { background: var(--accent); }
.concept-card .star-badge {
  display: inline-block; background: var(--accent); color: #fff;
  font-size: 11px; padding: 1px 6px; border-radius: 8px; margin-left: 4px;
  vertical-align: middle;
}

/* Progress bar */
.progress-wrap { margin: 10px 0; }
.progress-wrap .label { font-size: 13px; color: var(--text-light); margin-bottom: 4px; }
.progress-bar {
  height: 10px; background: var(--border); border-radius: 5px; overflow: hidden;
}
.progress-bar .fill {
  height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent));
  border-radius: 5px; transition: width 0.5s ease;
}

/* SVG container */
.svg-wrap { overflow-x: auto; margin: 10px 0; }
.svg-wrap svg { min-width: 700px; display: block; margin: 0 auto; }

/* Flip card */
.flip-container { perspective: 1000px; width: 100%; max-width: 480px; margin: 0 auto; }
.flipper {
  position: relative; width: 100%; min-height: 280px;
  transition: transform 0.6s; transform-style: preserve-3d;
}
.flipper.flipped { transform: rotateY(180deg); }
.flip-front, .flip-back {
  position: absolute; width: 100%; backface-visibility: hidden;
  border-radius: var(--radius); padding: 24px;
  background: var(--card); box-shadow: var(--shadow);
  border: 1px solid var(--border); min-height: 280px;
}
.flip-back { transform: rotateY(180deg); }
.flip-nav { display: flex; justify-content: center; align-items: center; gap: 16px; margin: 14px 0; }
.flip-nav button {
  padding: 8px 18px; border: 1px solid var(--accent); background: var(--card);
  color: var(--accent); border-radius: 20px; cursor: pointer; font-size: 14px;
  font-family: inherit; transition: all 0.2s;
}
.flip-nav button:hover { background: var(--accent); color: #fff; }
.flip-nav .learned-btn { background: #27ae60; color: #fff; border-color: #27ae60; }
.flip-nav .learned-btn.learned { background: #fff; color: #27ae60; }

/* Question styling */
.quiz-question { margin-bottom: 20px; }
.quiz-question .q-text { font-weight: 600; margin-bottom: 10px; }
.quiz-question .option {
  padding: 8px 14px; margin: 4px 0; border-radius: 6px;
  border: 1px solid var(--border); cursor: pointer; transition: all 0.2s;
  background: var(--card);
}
.quiz-question .option:hover { border-color: var(--accent2); background: #fef9f4; }
.quiz-question .option.selected { border-color: var(--accent); background: #fef5f0; }
.quiz-question .option.correct { border-color: #27ae60; background: #eafaf1; }
.quiz-question .option.wrong { border-color: #e74c3c; background: #fdedec; }

/* Timer */
.timer {
  font-size: 24px; font-weight: 700; color: var(--accent);
  text-align: center; padding: 8px;
}
.timer.warning { animation: pulse 0.5s infinite alternate; }
@keyframes pulse { from { opacity: 1; } to { opacity: 0.5; } }

/* Tree */
.tree { font-size: 14px; }
.tree ul { list-style: none; padding-left: 20px; }
.tree li { position: relative; padding: 4px 0; }
.tree .node { cursor: pointer; font-weight: 600; color: var(--accent); }
.tree .node::before { content: &quot;▸ &quot;; font-size: 10px; }
.tree .node.open::before { content: &quot;▾ &quot;; }
.tree .children { display: none; }
.tree .children.open { display: block; }

/* Socratic */
.socratic-q { margin-bottom: 12px; }
.socratic-q .question {
  padding: 10px 14px; background: var(--card); border-radius: var(--radius);
  border: 1px solid var(--border); cursor: pointer; font-weight: 600;
  transition: background 0.2s;
}
.socratic-q .question:hover { background: #fef9f4; }
.socratic-q .answer { display: none; padding: 10px 14px; color: var(--text-light); }
.socratic-q .answer.open { display: block; }

/* Decision */
.decision-option {
  padding: 12px 16px; margin: 6px 0; border-radius: var(--radius);
  border: 1px solid var(--border); cursor: pointer; transition: all 0.2s;
}
.decision-option:hover { border-color: var(--accent2); }
.decision-feedback { display: none; padding: 14px; margin-top: 8px; background: #fef9f4; border-radius: var(--radius); }

/* Table */
table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 13px; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); }
th { color: var(--accent); font-weight: 600; }

/* Buttons */
.btn {
  display: inline-block; padding: 10px 20px; border-radius: 22px;
  border: none; cursor: pointer; font-family: inherit; font-size: 14px;
  transition: all 0.2s;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { opacity: 0.9; }
.btn-outline { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
.btn-outline:hover { background: var(--accent); color: #fff; }

/* Stats */
.stat-box {
  display: inline-block; padding: 14px 20px; background: var(--card);
  border-radius: var(--radius); box-shadow: var(--shadow);
  text-align: center; margin: 6px; min-width: 100px;
}
.stat-box .num { font-size: 28px; font-weight: 700; color: var(--accent); }
.stat-box .lbl { font-size: 12px; color: var(--text-light); }

/* Responsive */
@media (max-width: 600px) {
  .container { padding: 0 8px 40px; }
  .card { padding: 14px; }
  .tab-bar button { padding: 6px 8px; font-size: 11px; }
  .flip-front, .flip-back { padding: 16px; min-height: 320px; }
}
&lt;/style&gt;

  { q: &quot;为什么吴军说&#x27;专利主要作用是防御，而非进攻&#x27;？&quot;, ref: &quot;创新高增长期的公司靠快速将技术转化为产品形成竞争优势（类似曼施坦因的闪电战），不需要依赖专利。只有当增长停滞、转入防御期时，专利才成为保护侧翼和后翼的工具。IBM几十年专利数量第一，但真正改变世界的创新大多来自其创新高增长期之前。&quot; },
  { q: &quot;简述&#x27;原有产业+新技术=新产业&#x27;这一公式的三次工业革命验证。&quot;, ref: &quot;第一次工业革命：瓷器制造+蒸汽机=新瓷器产业；第二次工业革命：冶铜业+电解技术=高纯度精铜；信息革命：银行业+互联网=在线银行、零售业+互联网=电商。规律是新技术改造而从不颠覆原有产业——被改造的产业变得更高效而非消失。&quot; },

  { q: &quot;吴军提出的&#x27;第三眼美女&#x27;产品理论中，三个阶段分别有何特点？&quot;, ref: &quot;第一阶段（第一眼美女）：技术先锋但功能不完善，仅技术精英关注（如施乐图形界面）。第二阶段（第二眼美女）：功能改善但价格高、兼容性差，仅高收入群体使用（如苹果Macintosh）。第三阶段（第三眼美女）：外观朴实但价格亲民、兼容性强、大众广泛接受（如微软Windows）。大多数产品三个阶段由不同公司领跑。&quot; },
  { q: &quot;为什么吴军认为&#x27;商业的本质是让人多花钱，而不是省钱&#x27;？&quot;, ref: &quot;线上化（第一阶段）的核心是省时间省钱，这条路越走越窄——因为省下的时间和金钱最终会被花掉。线下回归（第二阶段）的核心是花时间花钱追求更优质的体验——旅游代替看图片、现场音乐会代替听CD。真正大的商业机会在于满足人们&#x27;花更多钱获得更好体验&#x27;的需求。茑屋书店和特斯拉都是典型案例。&quot; },
  { q: &quot;用曼施坦因的闪电战理论解释小公司应如何与大公司竞争。&quot;, ref: &quot;曼施坦因的核心是&#x27;进攻是最好的防守&#x27;——通过快速奇袭打破常规，无需过度防御侧翼和后方。小公司应效仿：通过创造力和执行力出奇制胜（就像蒸汽船对大帆船、Google对传统搜索），而不是与大公司拼资源拼规模——那是大公司之间的消耗战。当小公司失去&#x27;进攻能力&#x27;（创新能力）转入防守时，纵有再多专利也无法挽回颓势。&quot; }

// ======== PROGRESS ========
function getProgress() {
  try { return JSON.parse(localStorage.getItem(&#x27;mks_tech_biz_progress&#x27;) || &#x27;{}&#x27;); } catch(e) { return {}; }
}
function saveProgress(p) { localStorage.setItem(&#x27;mks_tech_biz_progress&#x27;, JSON.stringify(p)); }

function updateProgress() {
  const p = getProgress();
  const learnedCards = p.learnedCards || [];
  const answeredMCQ = p.answeredMCQ || {};
  const answeredSAQ = p.answeredSAQ || {};

  document.getElementById(&#x27;cardProgress&#x27;).textContent = `${learnedCards.length}/10`;
  document.getElementById(&#x27;cardBar&#x27;).style.width = `${learnedCards.length * 10}%`;
  const mcDone = Object.keys(answeredMCQ).length;
  const saDone = Object.keys(answeredSAQ).length;
  const totalDone = mcDone + saDone;
  document.getElementById(&#x27;quizProgress&#x27;).textContent = `${totalDone}/30`;
  document.getElementById(&#x27;quizBar&#x27;).style.width = `${(totalDone / 30) * 100}%`;

  // Update learned button in card tab
  if (typeof currentCardIdx !== &#x27;undefined&#x27;) {
    updateLearnedBtn();
  }
}

// ======== TAB 1: FLIP CARDS ========
let currentCardIdx = 0;
let cardFlipped = false;

function renderCard() {
  const c = concepts[currentCardIdx];
  document.getElementById(&#x27;flipFront&#x27;).innerHTML = `
    &lt;h3 style=&quot;color:var(--accent);margin-bottom:10px;&quot;&gt;${c.name}&lt;/h3&gt;

  document.getElementById(&#x27;flipBack&#x27;).innerHTML = `

    &lt;div style=&quot;font-size:13px;&quot;&gt;
      &lt;p&gt;&lt;strong&gt;定义：&lt;/strong&gt;${c.def}&lt;/p&gt;
      &lt;p style=&quot;margin-top:8px;&quot;&gt;&lt;strong&gt;类比（商业场景）：&lt;/strong&gt;${c.analogy}&lt;/p&gt;

      &lt;p style=&quot;margin-top:8px;&quot;&gt;&lt;strong&gt;反例：&lt;/strong&gt;${c.counter}&lt;/p&gt;
    &lt;/div&gt;
  `;
  document.getElementById(&#x27;cardIndex&#x27;).textContent = `${currentCardIdx+1}/10`;
  updateLearnedBtn();
}

function flipToCard(idx) {
  currentCardIdx = idx;
  cardFlipped = false;
  document.getElementById(&#x27;flipper&#x27;).classList.remove(&#x27;flipped&#x27;);
  renderCard();
  switchTab(1);
}

function prevCard() {
  currentCardIdx = (currentCardIdx - 1 + concepts.length) % concepts.length;
  cardFlipped = false;
  document.getElementById(&#x27;flipper&#x27;).classList.remove(&#x27;flipped&#x27;);
  renderCard();
}

function nextCard() {
  currentCardIdx = (currentCardIdx + 1) % concepts.length;
  cardFlipped = false;
  document.getElementById(&#x27;flipper&#x27;).classList.remove(&#x27;flipped&#x27;);
  renderCard();
}

function updateLearnedBtn() {
  const p = getProgress();
  const learnedCards = p.learnedCards || [];
  const btn = document.getElementById(&#x27;learnedBtn&#x27;);
  if (learnedCards.includes(currentCardIdx)) {
    btn.textContent = &#x27;✓ 已学习&#x27;;
    btn.classList.add(&#x27;learned&#x27;);
  } else {
    btn.textContent = &#x27;✓ 标记已学习&#x27;;
    btn.classList.remove(&#x27;learned&#x27;);
  }
}

function toggleLearned() {
  const p = getProgress();
  if (!p.learnedCards) p.learnedCards = [];
  const idx = p.learnedCards.indexOf(currentCardIdx);
  if (idx &gt;= 0) {
    p.learnedCards.splice(idx, 1);
  } else {
    p.learnedCards.push(currentCardIdx);
  }
  saveProgress(p);
  updateLearnedBtn();
  updateProgress();
}

// Flip on click
document.addEventListener(&#x27;DOMContentLoaded&#x27;, function() {
  document.getElementById(&#x27;flipper&#x27;).addEventListener(&#x27;click&#x27;, function() {
    cardFlipped = !cardFlipped;
    this.classList.toggle(&#x27;flipped&#x27;, cardFlipped);
  });
});

// ======== TAB 2: MCQ + SAQ ========
function renderMCQ() {
  let html = &#x27;&#x27;;
  const p = getProgress();
  const answered = p.answeredMCQ || {};
  mcQuestions.forEach((q, i) =&gt; {
    html += `&lt;div class=&quot;quiz-question&quot; id=&quot;mcq${i}&quot;&gt;
      &lt;div class=&quot;q-text&quot;&gt;${i+1}. ${q.q}&lt;/div&gt;`;
    q.opts.forEach((opt, j) =&gt; {
      const isAnswered = answered[i] !== undefined;
      let cls = &#x27;option&#x27;;
      if (isAnswered) {
        if (j === q.ans) cls += &#x27; correct&#x27;;
        else if (j === answered[i]) cls += &#x27; wrong&#x27;;
      }
      html += `&lt;div class=&quot;${cls}&quot; onclick=&quot;answerMCQ(${i}, ${j})&quot; id=&quot;mcq${i}o${j}&quot;&gt;
        ${&#x27;ABCD&#x27;[j]}. ${opt}
        ${isAnswered &amp;&amp; j === q.ans ? &#x27; ✓&#x27; : &#x27;&#x27;}
        ${isAnswered &amp;&amp; j === answered[i] &amp;&amp; j !== q.ans ? &#x27; ✗&#x27; : &#x27;&#x27;}
      &lt;/div&gt;`;
    });
    html += `&lt;p style=&quot;font-size:11px;color:var(--text-light);margin-top:2px;&quot;&gt;关联概念：${q.concept}&lt;/p&gt;`;
    html += `&lt;/div&gt;`;
  });
  document.getElementById(&#x27;mcqContainer&#x27;).innerHTML = html;
}

function answerMCQ(qIdx, optIdx) {
  const p = getProgress();
  if (!p.answeredMCQ) p.answeredMCQ = {};
  if (p.answeredMCQ[qIdx] !== undefined) return; // Already answered
  p.answeredMCQ[qIdx] = optIdx;

  // Track errors
  if (optIdx !== mcQuestions[qIdx].ans) {
    if (!p.errorMCQ) p.errorMCQ = [];
    if (!p.errorMCQ.includes(qIdx)) p.errorMCQ.push(qIdx);
  }

  saveProgress(p);
  renderMCQ();
  updateProgress();
}

function resetMCQ() {
  const p = getProgress();
  p.answeredMCQ = {};
  p.errorMCQ = [];
  saveProgress(p);
  renderMCQ();
  updateProgress();
}

function renderSAQ() {
  let html = &#x27;&#x27;;
  const p = getProgress();
  const answered = p.answeredSAQ || {};
  saQuestions.forEach((q, i) =&gt; {
    html += `&lt;div class=&quot;quiz-question&quot; id=&quot;saq${i}&quot;&gt;
      &lt;div class=&quot;q-text&quot;&gt;${i+1}. ${q.q}&lt;/div&gt;`;
    if (!answered[i]) {
      html += `&lt;textarea id=&quot;saqInput${i}&quot; style=&quot;width:100%;min-height:60px;border:1px solid var(--border);border-radius:6px;padding:8px;font-family:inherit;font-size:13px;&quot; placeholder=&quot;输入你的回答...&quot;&gt;&lt;/textarea&gt;
      &lt;button class=&quot;btn btn-outline&quot; style=&quot;margin-top:6px;&quot; onclick=&quot;checkSAQ(${i})&quot;&gt;查看参考答案&lt;/button&gt;`;
    } else {
      html += `&lt;p style=&quot;font-size:12px;color:var(--text-light);margin:6px 0;&quot;&gt;&lt;strong&gt;你的回答：&lt;/strong&gt;${answered[i]}&lt;/p&gt;
      &lt;p style=&quot;font-size:12px;color:#27ae60;&quot;&gt;&lt;strong&gt;参考答案：&lt;/strong&gt;${q.ref}&lt;/p&gt;`;
    }
    html += `&lt;/div&gt;`;
  });
  document.getElementById(&#x27;saqContainer&#x27;).innerHTML = html;
}

function checkSAQ(i) {
  const input = document.getElementById(&#x27;saqInput&#x27; + i);
  if (!input || !input.value.trim()) return;
  const p = getProgress();
  if (!p.answeredSAQ) p.answeredSAQ = {};
  p.answeredSAQ[i] = input.value.trim();
  saveProgress(p);
  renderSAQ();
  updateProgress();
}

function resetSAQ() {
  const p = getProgress();
  p.answeredSAQ = {};
  saveProgress(p);
  renderSAQ();
  updateProgress();
}

// ======== TAB 3: EXAM MODE ========
let examTimerId = null;
let examSeconds = 900;
let examQuestions = [];

function resetExam() {
  document.getElementById(&#x27;examSetup&#x27;).style.display = &#x27;block&#x27;;
  document.getElementById(&#x27;examArea&#x27;).style.display = &#x27;none&#x27;;
  document.getElementById(&#x27;examResult&#x27;).style.display = &#x27;none&#x27;;
  if (examTimerId) { clearInterval(examTimerId); examTimerId = null; }
  examSeconds = 900;
}

function startExam() {
  document.getElementById(&#x27;examSetup&#x27;).style.display = &#x27;none&#x27;;
  document.getElementById(&#x27;examArea&#x27;).style.display = &#x27;block&#x27;;
  document.getElementById(&#x27;examResult&#x27;).style.display = &#x27;none&#x27;;
  document.getElementById(&#x27;examResult&#x27;).innerHTML = &#x27;&#x27;;

  // Pick 7 MC + 3 SA
  const mcIndices = shuffleArray([...Array(20).keys()]).slice(0, 7);
  const saIndices = shuffleArray([...Array(10).keys()]).slice(0, 3);
  examQuestions = { mc: mcIndices, sa: saIndices };

  let html = &#x27;&lt;h3&gt;选择题（7道）&lt;/h3&gt;&#x27;;
  mcIndices.forEach((idx, i) =&gt; {
    const q = mcQuestions[idx];
    html += `&lt;div class=&quot;quiz-question&quot;&gt;
      &lt;div class=&quot;q-text&quot;&gt;${i+1}. ${q.q}&lt;/div&gt;`;
    q.opts.forEach((opt, j) =&gt; {
      html += `&lt;div class=&quot;option&quot; onclick=&quot;selectExamMC(${i}, ${j})&quot; id=&quot;examMc${i}o${j}&quot;&gt;${&#x27;ABCD&#x27;[j]}. ${opt}&lt;/div&gt;`;
    });
    html += `&lt;/div&gt;`;
  });
  html += &#x27;&lt;h3&gt;简答题（3道）&lt;/h3&gt;&#x27;;
  saIndices.forEach((idx, i) =&gt; {
    html += `&lt;div class=&quot;quiz-question&quot;&gt;
      &lt;div class=&quot;q-text&quot;&gt;${i+1}. ${saQuestions[idx].q}&lt;/div&gt;
      &lt;textarea id=&quot;examSaInput${i}&quot; style=&quot;width:100%;min-height:50px;border:1px solid var(--border);border-radius:6px;padding:8px;font-family:inherit;font-size:13px;&quot; placeholder=&quot;输入你的回答...&quot;&gt;&lt;/textarea&gt;
    &lt;/div&gt;`;
  });
  document.getElementById(&#x27;examContent&#x27;).innerHTML = html;

  examSeconds = 900;
  updateExamTimer();
  examTimerId = setInterval(() =&gt; {
    examSeconds--;
    updateExamTimer();
    if (examSeconds &lt;= 0) { submitExam(); }
  }, 1000);
}

function updateExamTimer() {
  const m = Math.floor(examSeconds / 60);
  const s = examSeconds % 60;
  const el = document.getElementById(&#x27;examTimer&#x27;);
  el.textContent = `${m}:${String(s).padStart(2, &#x27;0&#x27;)}`;
  el.classList.toggle(&#x27;warning&#x27;, examSeconds &lt; 60);
}

let examMCAnswers = {};
function selectExamMC(qIdx, optIdx) {
  examMCAnswers[qIdx] = optIdx;
  for (let j = 0; j &lt; 4; j++) {
    document.getElementById(`examMc${qIdx}o${j}`).classList.toggle(&#x27;selected&#x27;, j === optIdx);
  }
}

function submitExam() {
  if (examTimerId) { clearInterval(examTimerId); examTimerId = null; }
  document.getElementById(&#x27;examArea&#x27;).style.display = &#x27;none&#x27;;
  document.getElementById(&#x27;examResult&#x27;).style.display = &#x27;block&#x27;;

  let score = 0;
  let mcResult = &#x27;&#x27;;
  examQuestions.mc.forEach((qIdx, i) =&gt; {
    const q = mcQuestions[qIdx];
    const userAns = examMCAnswers[i];
    const correct = userAns === q.ans;
    if (correct) score++;
    mcResult += `&lt;div style=&quot;margin-bottom:8px;&quot;&gt;
      &lt;strong&gt;${i+1}. ${q.q}&lt;/strong&gt;&lt;br&gt;
      &lt;span style=&quot;color:${correct ? &#x27;#27ae60&#x27; : &#x27;#e74c3c&#x27;}&quot;&gt;你的答案：${userAns !== undefined ? &#x27;ABCD&#x27;[userAns] : &#x27;未作答&#x27;} | 正确答案：${&#x27;ABCD&#x27;[q.ans]}&lt;/span&gt;&lt;br&gt;
      ${!correct ? `&lt;span style=&quot;font-size:12px;color:var(--text-light);&quot;&gt;解析：${q.opts[q.ans]}&lt;/span&gt;` : &#x27;&#x27;}
    &lt;/div&gt;`;
  });

  let saResult = &#x27;&#x27;;
  examQuestions.sa.forEach((idx, i) =&gt; {
    const q = saQuestions[idx];
    const userAns = document.getElementById(`examSaInput${i}`)?.value || &#x27;未作答&#x27;;
    saResult += `&lt;div style=&quot;margin-bottom:8px;&quot;&gt;
      &lt;strong&gt;${i+1}. ${q.q}&lt;/strong&gt;&lt;br&gt;
      &lt;span style=&quot;font-size:12px;color:var(--text-light);&quot;&gt;你的回答：${userAns.substring(0, 100)}...&lt;/span&gt;&lt;br&gt;
      &lt;span style=&quot;font-size:12px;color:#27ae60;&quot;&gt;参考答案：${q.ref.substring(0, 150)}...&lt;/span&gt;
    &lt;/div&gt;`;
  });

  const totalMC = examQuestions.mc.length;
  const elapsed = 900 - examSeconds;
  const elapsedM = Math.floor(elapsed / 60);
  const elapsedS = elapsed % 60;

  // Concept analysis
  const conceptErrors = {};
  examQuestions.mc.forEach((qIdx, i) =&gt; {
    if (examMCAnswers[i] !== mcQuestions[qIdx].ans) {
      const cName = mcQuestions[qIdx].concept;
      conceptErrors[cName] = (conceptErrors[cName] || 0) + 1;
    }
  });

  let weakHtml = &#x27;&#x27;;
  for (const [cname, cnt] of Object.entries(conceptErrors)) {
    weakHtml += `&lt;span style=&quot;display:inline-block;margin:4px;padding:4px 10px;background:#fdedec;border-radius:12px;font-size:12px;&quot;&gt;${cname} (错${cnt}次)&lt;/span&gt;`;
  }

  document.getElementById(&#x27;examResult&#x27;).innerHTML = `
    &lt;h2&gt;考试成绩&lt;/h2&gt;
    &lt;div style=&quot;display:flex;flex-wrap:wrap;gap:10px;margin:10px 0;&quot;&gt;
      &lt;div class=&quot;stat-box&quot;&gt;&lt;div class=&quot;num&quot;&gt;${score}/${totalMC}&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;选择题得分&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;stat-box&quot;&gt;&lt;div class=&quot;num&quot;&gt;${Math.round(score/totalMC*100)}%&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;正确率&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;stat-box&quot;&gt;&lt;div class=&quot;num&quot;&gt;${elapsedM}分${elapsedS}秒&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;用时&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;h3&gt;选择题解析&lt;/h3&gt;${mcResult}
    &lt;h3&gt;简答题参考&lt;/h3&gt;${saResult}
    &lt;h3&gt;薄弱概念&lt;/h3&gt;${weakHtml || &#x27;&lt;p&gt;全部答对，暂无薄弱概念&lt;/p&gt;&#x27;}
    &lt;button class=&quot;btn btn-primary&quot; onclick=&quot;resetExam();switchTab(3);&quot; style=&quot;margin-top:14px;&quot;&gt;重新考试&lt;/button&gt;
  `;
}

// ======== TAB 4: REVIEW MODE ========
function refreshReview() {
  const p = getProgress();
  const answeredMCQ = p.answeredMCQ || {};
  const answeredSAQ = p.answeredSAQ || {};
  const errorMCQ = p.errorMCQ || [];
  const learnedCards = p.learnedCards || [];

  // Stats
  const totalAnswered = Object.keys(answeredMCQ).length + Object.keys(answeredSAQ).length;
  const mcCorrect = Object.keys(answeredMCQ).length - errorMCQ.length;
  const mcRate = Object.keys(answeredMCQ).length &gt; 0 ? Math.round(mcCorrect / Object.keys(answeredMCQ).length * 100) : 0;

  document.getElementById(&#x27;statsArea&#x27;).innerHTML = `
    &lt;div style=&quot;display:flex;flex-wrap:wrap;gap:8px;&quot;&gt;
      &lt;div class=&quot;stat-box&quot;&gt;&lt;div class=&quot;num&quot;&gt;${totalAnswered}&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;总答题数&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;stat-box&quot;&gt;&lt;div class=&quot;num&quot;&gt;${mcRate}%&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;选择正确率&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;stat-box&quot;&gt;&lt;div class=&quot;num&quot;&gt;${learnedCards.length}&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;已学概念&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;stat-box&quot;&gt;&lt;div class=&quot;num&quot;&gt;${errorMCQ.length}&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;错题数&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  `;

  // Error book
  if (errorMCQ.length === 0) {
    document.getElementById(&#x27;errorBook&#x27;).innerHTML = &#x27;&lt;p style=&quot;color:#27ae60;&quot;&gt;暂无错题，继续保持！&lt;/p&gt;&#x27;;
  } else {
    let ehtml = &#x27;&lt;p style=&quot;margin-bottom:8px;font-size:13px;color:var(--text-light);&quot;&gt;点击错题可重新作答（清除该题记录）&lt;/p&gt;&#x27;;
    errorMCQ.forEach(qIdx =&gt; {
      const q = mcQuestions[qIdx];
      const userAns = answeredMCQ[qIdx];
      ehtml += `&lt;div style=&quot;padding:8px;margin:6px 0;background:#fef9f4;border-radius:6px;border-left:3px solid #e74c3c;cursor:pointer;&quot; onclick=&quot;retryMCQ(${qIdx})&quot;&gt;
        &lt;strong&gt;${qIdx+1}. ${q.q}&lt;/strong&gt;&lt;br&gt;
        &lt;span style=&quot;color:#e74c3c;&quot;&gt;你的答案：${&#x27;ABCD&#x27;[userAns]}&lt;/span&gt; |
        &lt;span style=&quot;color:#27ae60;&quot;&gt;正确：${&#x27;ABCD&#x27;[q.ans]}&lt;/span&gt; — ${q.opts[q.ans]}
        &lt;br&gt;&lt;span style=&quot;font-size:11px;color:var(--text-light);&quot;&gt;概念：${q.concept}&lt;/span&gt;
      &lt;/div&gt;`;
    });
    document.getElementById(&#x27;errorBook&#x27;).innerHTML = ehtml;
  }

  // Weak points
  const conceptErrors = {};
  errorMCQ.forEach(qIdx =&gt; {
    const cn = mcQuestions[qIdx].concept;
    conceptErrors[cn] = (conceptErrors[cn] || 0) + 1;
  });
  const sorted = Object.entries(conceptErrors).sort((a, b) =&gt; b[1] - a[1]);
  if (sorted.length === 0) {
    document.getElementById(&#x27;weakPoints&#x27;).innerHTML = &#x27;&lt;p&gt;暂无薄弱概念数据。&lt;/p&gt;&#x27;;
  } else {
    let whtml = &#x27;&#x27;;
    sorted.forEach(([cn, cnt]) =&gt; {
      whtml += `&lt;div style=&quot;margin-bottom:10px;&quot;&gt;
        &lt;strong&gt;${cn}&lt;/strong&gt; — 错误${cnt}次
        &lt;div class=&quot;progress-bar&quot;&gt;&lt;div class=&quot;fill&quot; style=&quot;width:${Math.max(10, 100-cnt*20)}%;background:#e74c3c;&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;`;
    });
    document.getElementById(&#x27;weakPoints&#x27;).innerHTML = whtml;
  }
}

function retryMCQ(qIdx) {
  const p = getProgress();
  delete p.answeredMCQ[qIdx];
  p.errorMCQ = (p.errorMCQ || []).filter(e =&gt; e !== qIdx);
  saveProgress(p);
  refreshReview();
  updateProgress();
}

// ======== TAB 6: SOCRATIC ========
function renderSocratic() {
  const questions = [
    {
      concept: &quot;自然垄断&quot;,
      qs: [
        { q: &quot;如果一个企业一直在降价，消费者一直在受益，为什么这也是危险的？&quot;, a: &quot;因为当降价持续到所有竞争对手都无法生存时，消费者就失去了选择权。没有选择权意味着创新停滞——垄断企业不再有动力改进产品，价格也会在消灭竞争后回升（或通过其他方式变相收费）。长期来看，社会进步速度放缓甚至停滞。&quot; },
        { q: &quot;那为什么不能用反垄断法直接拆分这些企业？&quot;, a: &quot;反垄断法的执行需要证明&#x27;消费者利益受损&#x27;——而当垄断企业一直在降价时，传统法律框架下很难认定违法。这也是为什么美国针对微软/Google的反垄断诉讼旷日持久。洛克菲勒案最终胜诉的核心论据不是&#x27;哄抬物价&#x27;，而是&#x27;利用垄断优势降价以阻碍竞争&#x27;。&quot; },
        { q: &quot;在中国，什么让自然垄断的风险比美国更大？&quot;, a: &quot;中国未严格限制跨行业经营。19世纪美国严格限制企业跨行业扩张，但中国互联网巨头可以同时进入社交、支付、电商、云计算、出行等多个领域——垄断范围更大、消除竞争的速度更快。&quot; }
      ]
    },
    {
      concept: &quot;数据驱动方法&quot;,
      qs: [
        { q: &quot;如果AI不需要模拟人脑，那&#x27;深度学习&#x27;这个名字是不是有误导？&quot;, a: &quot;是的。&#x27;神经网络&#x27;原本是受生物神经启发，但现代深度学习本质上是数学上的多层函数拟合——信息论+概率统计+优化理论的产物。这也是为什么苏德霍夫（诺贝尔奖得主）说&#x27;今天的人工智能和脑神经科学没有半毛钱关系&#x27;。&quot; },
        { q: &quot;那为什么AI在某些任务上远超人类，在某些任务上却连三岁小孩都不如？&quot;, a: &quot;因为AI擅长的是&#x27;可计算问题&#x27;——只要有足够的数据和明确的目标函数，它可以做到极致。但&#x27;不可计算问题&#x27;（情感理解、价值判断、创造性联想）超出图灵机理论范畴。三岁小孩能凭直觉理解&#x27;这个故事在讲什么&#x27;，而AI需要把问题先转化为数学问题。&quot; }
      ]
    },
    {
      concept: &quot;颠覆式创新&quot;,
      qs: [
        { q: &quot;为什么大公司看到新技术的威胁，却不能简单地复制过来？&quot;, a: &quot;两个原因：（1）既有利益冲突——大公司的利润来自现有产品，新技术会蚕食自己（如柯达发明数码相机却无法推广）；（2）组织惯性——大公司的管理体系、考核指标、人才结构都是围绕旧模式优化的，转向新模式的成本极高。这就是&#x27;创新者的窘境&#x27;。&quot; },
        { q: &quot;小公司的&#x27;杀手功能&#x27;如果很容易被复制怎么办？&quot;, a: &quot;这就需要&#x27;技术放大效应&#x27;的保护——杀手功能必须能持续受益于外部技术的进步。如果杀手功能是一项孤立的专利，巨头可以绕过去；但如果它依赖一个持续进化的外部生态（如互联网规模、移动设备普及），巨头就难以通过简单复制来超越。&quot; },
        { q: &quot;那普通创业者怎么判断一个想法是不是真正的颠覆式创新？&quot;, a: &quot;用两个问题检验：（1）这个东西有没有一个&#x27;不公平的优势&#x27;——大公司给你同样的资源你做不做得了？（2）这个优势会不会随着时间的推移越来越强，而不是越来越弱？两个都回答&#x27;是&#x27;，才有可能是颠覆式创新。&quot; }
      ]
    },
    {
      concept: &quot;合作经济&quot;,
      qs: [
        { q: &quot;&#x27;原有产业+新技术=新产业&#x27;看起来很简单，为什么还有那么多创业者失败？&quot;, a: &quot;因为这个公式的关键在&#x27;原有产业&#x27;——你必须深刻理解原有产业的真实痛点和运作逻辑。大多数技术创业者带着&#x27;技术优越感&#x27;进入传统行业，不屑于了解行业的隐性知识，结果做出来的产品解决的是&#x27;工程师以为的问题&#x27;而非&#x27;行业真正的问题&#x27;。&quot; },
        { q: &quot;这和&#x27;互联网下半场&#x27;有什么关系？&quot;, a: &quot;吴军认为&#x27;下半场&#x27;是一个伪概念——技术发展是连续的，不存在&#x27;重新开始&#x27;的可能性。在PC互联网时代没做好的公司，很难在移动互联网时代翻盘，因为技术之间存在强耦合关系。正确的路径不是等&#x27;下半场&#x27;，而是用现有技术去解决一个未被充分服务的产业需求。&quot; }
      ]
    }
  ];

  let html = &#x27;&#x27;;
  questions.forEach((group, gi) =&gt; {
    html += `&lt;h3 style=&quot;margin-top:16px;&quot;&gt;${group.concept}&lt;/h3&gt;`;
    group.qs.forEach((item, qi) =&gt; {
      html += `&lt;div class=&quot;socratic-q&quot;&gt;
        &lt;div class=&quot;question&quot; onclick=&quot;this.nextElementSibling.classList.toggle(&#x27;open&#x27;)&quot;&gt;Q: ${item.q}&lt;/div&gt;
        &lt;div class=&quot;answer&quot;&gt;A: ${item.a}&lt;/div&gt;
      &lt;/div&gt;`;
    });
  });
  document.getElementById(&#x27;socraticArea&#x27;).innerHTML = html;
}

      &lt;h3&gt;核心概念&lt;/h3&gt;
      &lt;p&gt;&lt;strong&gt;数据驱动方法：&lt;/strong&gt;AlphaGo首先用几十万盘人类棋谱做有监督学习（数据驱动），然后通过强化学习自我对弈产生海量训练数据，突破人类棋谱限制。&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;机器智能：&lt;/strong&gt;将围棋转化为分类问题——评估每个局面的胜负概率。围棋&#x27;道&#x27;的文化属性被还原为数学问题。&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;颠覆式创新：&lt;/strong&gt;DeepMind是一个小型创业团队（被Google收购时约50人），其&#x27;杀手功能&#x27;是深度强化学习算法，&#x27;技术放大效应&#x27;来自GPU/TPU算力的指数级增长。&lt;/p&gt;
    &lt;/div&gt;

    &lt;div class=&quot;card&quot; style=&quot;border-left:4px solid #d4a574;&quot;&gt;
      &lt;h3&gt;概念关系&lt;/h3&gt;
      &lt;p&gt;&lt;strong&gt;数据驱动 → 机器智能：&lt;/strong&gt;没有海量棋谱数据就没有AlphaGo的初始能力。强化学习进一步放大了数据优势——自我对弈产生无限训练数据。&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;零边际成本 → 颠覆式创新：&lt;/strong&gt;AlphaGo的&#x27;智能&#x27;一旦训练完成，复制成本为零。这意味着Google可以将同样的技术部署到医疗、能源、材料设计等任意领域。&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;技术放大 → 竞争壁垒：&lt;/strong&gt;AlphaGo 2016年版本用176个GPU，2017年改用TPU后效率提升15-30倍，硬件进步直接转化为AI能力提升——这是大公司追赶的移动靶。&lt;/p&gt;
    &lt;/div&gt;

    &lt;div class=&quot;card&quot; style=&quot;border-left:4px solid #8b7355;&quot;&gt;
      &lt;h3&gt;★ MKS核心&lt;/h3&gt;
      &lt;p&gt;&lt;strong&gt;数据驱动方法是所有AI成就的骨架：&lt;/strong&gt;AlphaGo的成功不是因为它&#x27;像人类一样思考&#x27;，恰恰相反——它用完全不同于人类的方式（蒙特卡洛树搜索+深度网络评估）解决了围棋问题。这验证了&#x27;空气动力学派&#x27;战胜&#x27;鸟飞派&#x27;的根本逻辑。&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;为什么这一条最重要？&lt;/strong&gt;因为理解这一点，你就不会对AI产生&#x27;超越人类&#x27;的恐惧，也不会对AI产生&#x27;不过如此&#x27;的轻视。你能精准地判断AI能做什么（可计算问题）和不能做什么（不可计算问题）。&lt;/p&gt;
    &lt;/div&gt;

    &lt;div class=&quot;card&quot;&gt;
      &lt;h3&gt;边界知识&lt;/h3&gt;
      &lt;table&gt;
        &lt;tr&gt;&lt;th&gt;知识点&lt;/th&gt;&lt;th&gt;只需知道&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;蒙特卡洛树搜索&lt;/td&gt;&lt;td&gt;一种通过随机采样评估决策的算法，AlphaGo用它来探索可能的走法&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;TPU张量处理器&lt;/td&gt;&lt;td&gt;Google为神经网络定制的专用芯片，比通用GPU效率高15-30倍&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;DeepMind被收购价格&lt;/td&gt;&lt;td&gt;约4亿美元（2014年），是Google在AI领域最重要的战略收购之一&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;AlphaGo Zero&lt;/td&gt;&lt;td&gt;完全摒弃人类棋谱，仅靠自我对弈38天达到超越AlphaGo水平——验证了强化学习的极致潜力&lt;/td&gt;&lt;/tr&gt;
      &lt;/table&gt;
    &lt;/div&gt;
  `;
}

// ======== TAB 8: DECISION GAME ========
function renderDecisionGame() {
  const scenarios = [
    {
      title: &quot;【第1轮】你是创业者，发现一个传统行业（如餐饮供应链）效率极低。大公司还没有进入。你的策略是？&quot;,
      options: [
        { label: &quot;A. 打造一个全栈技术平台，一步到位取代所有中间环节&quot;, feedback: &quot;&quot;, correct: false },
        { label: &quot;B. 深入行业做&#x27;脏活累活&#x27;，先帮一家中型企业解决具体问题，积累数据后再扩展&quot;, feedback: &quot;MKS分析：这是&#x27;合作经济&#x27;和&#x27;颠覆式创新&#x27;的正确路径。新技术+原有产业=新产业，前提是深入理解产业痛点（而非带着技术优越感闯入）。先做单点突破（类似华院数据模式），积累行业数据和信任后，再逐步平台化。大公司不愿意做低利润的&#x27;脏活&#x27;，这就是你的窗口期。&quot;, correct: true },
        { label: &quot;C. 大量申请专利构建壁垒，防止大公司进入后抄袭&quot;, feedback: &quot;MKS分析：专利在创新初期不是核心竞争力——曼施坦因的闪电战告诉我们，进攻（快速把产品做到极致）比防守（专利长城）更有效。等你申请完专利，大公司可能已经用其他技术路线绕过去了。&quot;, correct: false }
      ]
    },
    {
      title: &quot;【第2轮】你的AI创业公司获得了1000万融资。投资人建议你大量购买GPU来训练一个&#x27;通用大模型&#x27;，追赶ChatGPT。你怎么办？&quot;,
      options: [
        { label: &quot;A. 听从建议，all in算力，这是唯一的入场券&quot;, feedback: &quot;&quot;, correct: false },
        { label: &quot;B. 放弃AI方向，转型做传统行业数字化&quot;, feedback: &quot;&quot;, correct: false },
        { label: &quot;C. 聚焦一个垂直场景，用有限的算力和专有数据训练一个小而精的模型&quot;, feedback: &quot;MKS分析：在数据驱动方法中，数据质量比模型大小更重要。大公司有通用数据和海量算力，但你对垂直场景的专有数据是他们没有的——这就是你的&#x27;杀手功能&#x27;。遵循&#x27;第三类公司&#x27;的策略：做大公司不愿意做的具体问题，用专有数据建立壁垒。记住，机器学习方法都是开源的，真正的壁垒是独特的数据和深度的行业理解。&quot;, correct: true }
      ]
    },
    {
      title: &quot;【第3轮】你的产品上线一年，用户增长很快。某互联网巨头宣布推出几乎一样的功能，而且免费。你怎么办？&quot;,
      options: [
        { label: &quot;A. 也免费，跟巨头打价格战&quot;, feedback: &quot;&quot;, correct: false },
        { label: &quot;B. 寻找巨头覆盖不到的场景，用&#x27;带宽优势&#x27;（更精准的用户触达）而非价格优势竞争&quot;, feedback: &quot;MKS分析：这是&#x27;蚂蚁vs大象&#x27;的经典局面。巨头的优势是资源和资金，劣势是组织结构僵化和注意力分散。你的策略应该是（1）利用&#x27;毛奇外线战略&#x27;——小团队快速迭代，在巨头反应之前持续领先半步；（2）利用&#x27;带宽理论&#x27;——找到巨头信息触达不到或不愿触达的细分人群和场景；（3）如果巨头通过降价/免费来消除竞争，这是自然垄断的信号——你需要重新评估这个市场的长期可竞争性。专利防御和IPO退出也是可行选择。&quot;, correct: true },
        { label: &quot;C. 立即寻找买家，把公司卖掉&quot;, feedback: &quot;MKS分析：卖掉是一种策略，但不应该是第一反应。如果产品的&#x27;杀手功能+技术放大效应&#x27;成立，巨头的进入恰恰验证了市场价值。关键判断是：大公司的&#x27;免费&#x27;是战略投入还是真正的效率优势？如果是前者，他们迟早会因为不赚钱而放弃或降低投入。&quot;, correct: false }
      ]
    }
  ];

  let html = &#x27;&#x27;;
  scenarios.forEach((s, si) =&gt; {
    html += `&lt;div class=&quot;card&quot; style=&quot;border-left:4px solid var(--accent);&quot;&gt;
      &lt;h3&gt;${s.title}&lt;/h3&gt;`;
    s.options.forEach((opt, oi) =&gt; {
      html += `&lt;div class=&quot;decision-option&quot; id=&quot;dec${si}o${oi}&quot; onclick=&quot;selectDecision(${si}, ${oi})&quot;&gt;${opt.label}&lt;/div&gt;`;
    });
    html += `&lt;div class=&quot;decision-feedback&quot; id=&quot;decFeedback${si}&quot;&gt;
      &lt;p style=&quot;font-size:13px;&quot;&gt;&lt;/p&gt;
    &lt;/div&gt;&lt;/div&gt;`;
  });
  document.getElementById(&#x27;decisionGame&#x27;).innerHTML = html;

  // Store feedback content
  window._decisionData = scenarios;
}

function selectDecision(si, oi) {
  const data = window._decisionData[si];
  const feedbackDiv = document.getElementById(&#x27;decFeedback&#x27; + si);
  const fbContent = data.options[oi].feedback;

  // Highlight
  for (let j = 0; j &lt; data.options.length; j++) {
    const optEl = document.getElementById(&#x27;dec&#x27; + si + &#x27;o&#x27; + j);
    optEl.style.borderColor = &#x27;var(--border)&#x27;;
    optEl.style.background = &#x27;&#x27;;
  }
  document.getElementById(&#x27;dec&#x27; + si + &#x27;o&#x27; + oi).style.borderColor = &#x27;var(--accent)&#x27;;
  document.getElementById(&#x27;dec&#x27; + si + &#x27;o&#x27; + oi).style.background = &#x27;#fef5f0&#x27;;

  if (fbContent) {
    feedbackDiv.style.display = &#x27;block&#x27;;
    feedbackDiv.querySelector(&#x27;p&#x27;).textContent = fbContent;
  } else {
    feedbackDiv.style.display = &#x27;block&#x27;;
    feedbackDiv.querySelector(&#x27;p&#x27;).textContent = &#x27;这不是最优选择。请换一个选项思考——提示：回顾核心概念中的竞争策略。&#x27;;
  }
}

// ======== UTILS ========
function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i &gt; 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ======== INIT ========
function init() {
  renderDashboard();
  renderCard();
  renderMCQ();
  renderSAQ();
  renderMindTree();
  renderSocratic();
  renderCaseStudy();
  renderDecisionGame();
  updateProgress();
}

init();
&lt;/script&gt;

var CONCEPTS = [
{id:&#x27;falsify&#x27;,name:&#x27;证伪思维&#x27;,icon:&#x27;🔬&#x27;,star:true,
 def:&#x27;科学理论必须可被证明错误。不可证伪的命题（如算命、占星）不是科学，而是伪科学。这是区分科学与非科学的根本标准。&#x27;,
 analogy:&#x27;就像法庭上的&quot;无罪推定&quot;——控方必须提供可被反驳的证据，而不是让被告自证清白。科学也需要随时准备接受&quot;反证&quot;。&#x27;,
 example:&#x27;爱因斯坦的广义相对论预言光线会在引力场中弯曲——这是一个可证伪的预测。1919年日食观测证实了它。如果观测结果不符，理论就会被推翻。&#x27;,
 counter:&#x27;&quot;明天可能下雨也可能不下&quot;——这个陈述永远正确，但毫无信息量，因为它不可证伪。算命先生说&quot;你近期会有贵人相助&quot;同样无法被证明错误。&#x27;},
{id:&#x27;logic&#x27;,name:&#x27;逻辑判断&#x27;,icon:&#x27;🧠&#x27;,star:true,
 def:&#x27;运用逻辑推理筛选信息，识别论证中的矛盾、谬误和不合理假设。在信息过载时代，这是最稀缺的过滤能力。&#x27;,
 analogy:&#x27;像一个思维&quot;筛子&quot;——把信息放进去，筛掉那些逻辑不自洽的，留下经得起推敲的。好的论证像精密的瑞士手表，每个齿轮都咬合紧密。&#x27;,
 example:&#x27;面对&quot;罗斯柴尔德家族财富以6%年增长率持续200年已达几十万亿美元&quot;的说法，吴军用逻辑反驳：如果陶朱公1两银子以6%增长2500年，财富将达10^63两，远超宇宙原子总数，由此揭露指数增长在现实中的荒谬性。&#x27;,
 counter:&#x27;&quot;英国靠老处女称霸世界&quot;——猫多→老鼠少→蜜蜂多→苜蓿多→牛多→牛肉多→水手强→海军强→称霸。每步仅有微弱相关性，经多轮传递后关联近乎为零，是典型过度解读。&#x27;},
{id:&#x27;cost&#x27;,name:&#x27;成本思维&#x27;,icon:&#x27;💰&#x27;,star:false,
 def:&#x27;通过分析行为背后的投入-产出逻辑，判断动机的合理性。理解&quot;没有免费的午餐&quot;，透过表面看本质。&#x27;,
 analogy:&#x27;如同一副&quot;商业透视镜&quot;——戴上它，你看到的不再是销售人员热情的笑脸，而是他投入的时间成本和获客成本，以及这些成本最终由谁买单。&#x27;,
 example:&#x27;老年人购买保健品：销售人员投入大量时间陪伴老人（时间成本），失败推销的成本需分摊到成交客户身上（获客成本），而保健品公司&quot;出事即跑路&quot;（犯错成本极低）。三方面揭示&quot;关心&quot;背后的逐利本质。&#x27;,
 counter:&#x27;明星媒体人创业失败——原以为名气=能力，但忽略了原单位平台提供的背书价值。一旦脱离平台，维持名气的成本剧增而收益锐减。&#x27;},
{id:&#x27;cross&#x27;,name:&#x27;跨界思维&#x27;,icon:&#x27;🔄&#x27;,star:false,
 def:&#x27;跨领域融合产生创新，打破单一思维定式。真正的跨界是结果而非目的，需要扎实的原领域基础。&#x27;,
 analogy:&#x27;如同生物界的&quot;杂交优势&quot;——两种不同基因的植物杂交，往往产生更优秀的后代。但前提是每一方的基因都足够优秀和稳定。&#x27;,
 example:&#x27;贾里尼克（通信领域专家）将人工智能视为通信/数据问题而非模仿人类智能，突破传统计算机科学家的思维定式。特斯拉将IT领域的锂电池技术引入汽车行业，解决传统车企铅酸电池续航难题。&#x27;,
 counter:&#x27;跨界不是&quot;浅尝辄止&quot;。爱因斯坦的小提琴仅为爱好（水平不高），不是真正的跨界。真正的跨界如冯·诺依曼——在数学、计算机、物理、博弈论等多个领域都有深刻建树。&#x27;},
{id:&#x27;subtract&#x27;,name:&#x27;减法思维&#x27;,icon:&#x27;➖&#x27;,star:true,
 def:&#x27;生命有限，主动舍弃无关紧要的事务，聚焦核心目标。&quot;吾生也有涯，而知也无涯&quot;——以有限追无限，必败。&#x27;,
 analogy:&#x27;就像整理一个塞满杂物的房间——不是往里添置新柜子，而是果断扔掉不需要的东西。腾出的空间才是真正的收获。&#x27;,
 example:&#x27;吴军2014年底从Google辞职：常规思维是高薪工作应优先保障，但他以&quot;时间价值最大化&quot;为标准，发现占用最多时间的高薪工作恰恰是需要舍弃的对象。硅谷一家视频识别公司从长长的任务清单减到仅保留1件核心事，最终被亚马逊高价收购。&#x27;,
 counter:&#x27;同时做很多事的&quot;低水平忙碌&quot;——两倍时间仅获两倍收益。而集中时间做好一件事，两倍时间可获10倍收益。捡芝麻的人永远没有时间捡西瓜。&#x27;},
{id:&#x27;common&#x27;,name:&#x27;常识判断&#x27;,icon:&#x27;💡&#x27;,star:true,
 def:&#x27;常识优于复杂模型，简单规律胜过新奇解释。经过长期证伪筛选的常识，往往比&quot;专家&quot;的复杂理论更可靠。&#x27;,
 analogy:&#x27;就像天气预报——老祖宗看云识天气的经验（&quot;朝霞不出门，晚霞行千里&quot;）有时比复杂的数值预报模型还准。常识是千百年经验浓缩的智慧。&#x27;,
 example:&#x27;巴菲特不看《华尔街日报》、不信股评、不画K线。他通过逛百货店观察商品受欢迎程度、看店铺顾客数量来判断投资标的。2008年通过比较苹果店与微软店的顾客流量，准确预测苹果市值将超越微软。&#x27;,
 counter:&#x27;过度解读的&quot;新奇解释&quot;——如将温州个别老板跑路推导为中国经济寒冬，忽视数十万家企业中个别案例不具统计意义。常识告诉我们：个别企业破产是行业整合常态。&#x27;},
{id:&#x27;professional&#x27;,name:&#x27;专业素养&#x27;,icon:&#x27;🏆&#x27;,star:false,
 def:&#x27;稳定性 + 流程化 + 体系知识 + 持续学习。职业选手与业余选手的本质区别不在于偶尔的超常发挥，而在于持续稳定的高水平输出。&#x27;,
 analogy:&#x27;就像一个顶级钢琴家演奏简单的《小奏鸣曲》——看似平凡的曲目，却能弹出丰富的层次感和情感张力。真正的专业是在简单事物上展现极致水准。&#x27;,
 example:&#x27;吴军与职业高尔夫教练杰夫同场竞技：杰夫9洞成绩-3杆（持续稳定），而吴军+9杆（好球与坏球交替）。职业选手的稳定发挥来自于严格遵循流程、情绪控制和系统的做事方法。约翰·霍普金斯名医检查近视时先系统排查罕见风险再定位病因，而普通医生缺乏章法。&#x27;,
 counter:&#x27;业余爱好者可能偶尔打出&quot;神仙球&quot;，但无法复制。就像&quot;民间科学家&quot;可能碰巧说对一件事，但缺乏系统方法和可重复性，无法稳定输出。&#x27;},
{id:&#x27;gradual&#x27;,name:&#x27;渐进改良&#x27;,icon:&#x27;📈&#x27;,star:false,
 def:&#x27;&quot;最好是更好的敌人&quot;——过度追求完美可能导致一事无成，接受阶段性改进反而更有效。迭代优于一步到位。&#x27;,
 analogy:&#x27;就像手机系统更新——不是等一个&quot;完美版本&quot;再发布，而是每周/每月推送小更新，不断修复bug、增加功能。多次&quot;更好&quot;的累积最终超越一次&quot;最好&quot;。&#x27;,
 example:&#x27;美国禁枪法案：民主党追求全面禁枪（&quot;最好&quot;），共和党只同意背景调查（&quot;更好&quot;），双方互不让步导致法案均未通过，禁枪改革完全失败。如果接受部分改进（如对不良记录者禁枪），至少能实现有限成果。Google核心服务每周更新一次，即使部分功能未交付也按时上线。&#x27;,
 counter:&#x27;特斯拉电动车：存在做工粗糙、系统死机等问题，但通过持续迭代5年间品质提升速度远超传统车企。若追求初始完美，可能&quot;十几年造不出车&quot;。&#x27;},
{id:&#x27;expectation&#x27;,name:&#x27;期望值最大化&#x27;,icon:&#x27;📊&#x27;,star:false,
 def:&#x27;通过定义合理的收益函数驱动系统自动优化。在组织管理中，设定正确的激励机制比&quot;教育员工&quot;更有效。&#x27;,
 analogy:&#x27;就像设计一个自动导航系统——你不需要手动控制每一个操作，只需设定好目的地（收益函数），导航系统会自动计算出最优路径并不断调整方向。&#x27;,
 example:&#x27;高考政策：若体育成绩占高考50%，家长就会自动让孩子参加体育锻炼，学校会加大体育投入，全社会资源向体育倾斜——不需要任何行政命令，收益函数自然驱动。Google将专利奖励从降至1万美元/专利，专利数量立刻跃居全球前十。IBM将专利申请与绩效挂钩，成为美国专利数量冠军。&#x27;,
 counter:&#x27;只讲价值观不设计激励——很多公司天天开会&quot;教育员工&quot;要创新、要合作，但考核体系却只奖励短期业绩。员工行为会向收益函数方向优化，而非口头说教的方向。&#x27;},
{id:&#x27;tenk&#x27;,name:&#x27;一万小时定律&#x27;,icon:&#x27;⏱&#x27;,star:false,
 def:&#x27;技能精进需要有效积累而非简单重复。避免四大误区：简单重复、习惯性失败、林黛玉式困境（自我封闭）、狗熊掰棒子（无积累）。&#x27;,
 analogy:&#x27;就像运动员训练——不是每天跑同样的距离就叫训练，而是要有针对性地突破自己的极限。有效的一万小时像是雕刻家反复雕琢，无效的一万小时像是水流反复冲刷同一块石头。&#x27;,
 example:&#x27;吴军提出&quot;三板斧&quot;破解四大困境：第一板斧&quot;愿景-目标-道路&quot;避免简单重复；第二板斧&quot;从不同意见中找合理之处&quot;打破习惯性失败和林黛玉式困境；第三板斧&quot;凡事做记录&quot;解决狗熊掰棒子问题。&#x27;,
 counter:&#x27;伪工作者：每天加班到很晚，但做的都是简单重复的&quot;伪工作&quot;，遇到困难不学习不请教，十年经验相当于一年经验重复了十次。&#x27;}
];

var MCQS = [{&quot;q&quot;:&quot;关于\&quot;证伪思维\&quot;，以下哪项理解是正确的？&quot;,&quot;opts&quot;:[&quot;科学理论必须可被证明错误&quot;,&quot;科学理论必须被证明正确才能成立&quot;,&quot;不可证伪的陈述也可能是科学理论&quot;,&quot;证伪与证实是同一回事&quot;],&quot;answer&quot;:0,&quot;exp&quot;:&quot;证伪思维的核心是卡尔·波普尔提出的\&quot;可证伪性\&quot;标准：一个理论只有具备被事实证明为错误的可能性，才是科学的。例如\&quot;明天可能下雨\&quot;不可证伪（永远正确），而\&quot;水在标准大气压下100°C沸腾\&quot;可证伪。&quot;},{&quot;q&quot;:&quot;减法思维的核心哲学依据来自哪里？&quot;,&quot;opts&quot;:[&quot;庄子的\&quot;吾生也有涯，而知也无涯\&quot;&quot;,&quot;孔子的\&quot;学而不思则罔\&quot;&quot;,&quot;老子的\&quot;道可道非常道\&quot;&quot;,&quot;孟子的\&quot;鱼与熊掌不可兼得\&quot;&quot;],&quot;answer&quot;:0,&quot;exp&quot;:&quot;庄子在《养生主》中写道：\&quot;吾生也有涯，而知也无涯，以有涯随无涯，殆矣。\&quot;意为生命有限而知识/事务无限，以有限追求无限必然失败。这是减法思维的哲学根基——必须学会舍弃。&quot;},{&quot;q&quot;:&quot;为什么\&quot;最好的医生不一定是救人最多的医生\&quot;？&quot;,&quot;opts&quot;:[&quot;名医与普通好医生的差距在于治疗效果的稳定性和可预期性&quot;,&quot;名医运气更好&quot;,&quot;普通医生更努力&quot;,&quot;名医只治疗简单的病&quot;],&quot;answer&quot;:0,&quot;exp&quot;:&quot;名医与普通好医生的差异不在于能否治好绝症（绝症谁也无法），而在于治疗效果的稳定性和可预期性。专业素养体现在稳定高质量的输出，而非偶尔的超常发挥。这呼应了职业选手vs业余选手的核心差异。&quot;},{&quot;q&quot;:&quot;\&quot;以正合，以奇胜\&quot;中\&quot;奇\&quot;字的正确读法和含义是什么？&quot;,&quot;opts&quot;:[&quot;读jī，意为\&quot;多余的\&quot;、补充手段&quot;,&quot;读qí，意为出乎意料的策略&quot;,&quot;读qí，意为奇怪的战术&quot;,&quot;读jī，意为奇袭和偷袭&quot;],&quot;answer&quot;:0,&quot;exp&quot;:&quot;孙子兵法中的\&quot;奇\&quot;读jī（不是qí），指\&quot;多余的\&quot;即机动兵力或补充手段。核心理念是先掌握根本（正），再考虑补充（奇），而非本末倒置追求\&quot;出奇制胜\&quot;。唐朝名将李靖在《唐太宗李靖问对》中有权威诠释。&quot;},{&quot;q&quot;:&quot;富兰克林的成功五要素中，最核心的一条是什么？&quot;,&quot;opts&quot;:[&quot;掌握稀缺技能&quot;,&quot;不断跳槽寻找更好机会&quot;,&quot;不争功，敢于肯定他人贡献&quot;,&quot;多读书&quot;],&quot;answer&quot;:0,&quot;exp&quot;:&quot;富兰克林选择当时新大陆稀缺的印刷术并成为行业专家，通过稀缺技能获得不可替代性。吴军也凭借稀缺的自然语言处理技术进入早期Google。稀缺技能是安身立命的根本，是财务自由的起点，也是其他四要素的基础。&quot;},{&quot;q&quot;:&quot;\&quot;英国靠老处女称霸世界\&quot;这个推导最典型的逻辑谬误是什么？&quot;,&quot;opts&quot;:[&quot;循环论证&quot;,&quot;过度解读与牵强因果&quot;,&quot;以偏概全&quot;,&quot;偷换概念&quot;],&quot;answer&quot;:1,&quot;exp&quot;:&quot;推导链条\&quot;老处女多→猫多→老鼠少→蜜蜂多→苜蓿多→牛多→牛肉好→水手强→海军强\&quot;每步仅有微弱相关性，经多轮传递后关联性近乎为零。这是典型的过度解读和牵强附会，是\&quot;弱关联因果链\&quot;的逻辑谬误。&quot;},{&quot;q&quot;:&quot;巴菲特最推崇的投资智慧是什么？&quot;,&quot;opts&quot;:[&quot;精通K线技术分析&quot;,&quot;依靠常识判断&quot;,&quot;掌握复杂的数学模型&quot;,&quot;听从经济学家建议&quot;],&quot;answer&quot;:1,&quot;exp&quot;:&quot;巴菲特不看《华尔街日报》、不信股评、不画K线。他通过逛百货店观察顾客数量、看产品受欢迎程度来做投资判断。他的经验证明：常识（低买高卖、从生活中观察）比任何复杂模型都更可靠。&quot;},{&quot;q&quot;:&quot;渐进改良的核心思想\&quot;最好是更好的敌人\&quot;在禁枪法案中如何体现？&quot;,&quot;opts&quot;:[&quot;禁枪法案本就不该提出&quot;,&quot;双方互不让步导致任何法案都未通过，禁枪改革完全失败&quot;,&quot;共和党的方案更好&quot;,&quot;民主党的方案最好&quot;],&quot;answer&quot;:1,&quot;exp&quot;:&quot;民主党追求全面禁枪（\&quot;最好\&quot;），共和党只要背景调查（\&quot;更好\&quot;），双方拒绝折中，结果两个法案均未通过。若双方接受部分改进（如对不良记录者禁枪），至少能实现有限成果。\&quot;最好是更好的敌人\&quot;——追求完美可能导致一事无成。&quot;},{&quot;q&quot;:&quot;期望值最大化原理在组织管理中最重要的启示是什么？&quot;,&quot;opts&quot;:[&quot;管理者应多开会对员工进行教育&quot;,&quot;设计科学的收益函数（激励机制），系统会自动优化&quot;,&quot;给员工更高的薪水&quot;,&quot;让员工自主决定工作内容&quot;],&quot;answer&quot;:1,&quot;exp&quot;:&quot;组织设计的激励机制就是\&quot;收益函数\&quot;，员工行为会自动向最大化该函数的方向调整。与其开会\&quot;教育员工\&quot;，不如设计合理的考核标准。如IBM将专利申请与绩效挂钩→成为专利冠军；Google提高专利奖励→专利数量跃居全球前十。&quot;},{&quot;q&quot;:&quot;托勒密的地心说虽然被推翻，但它仍然被认为是科学典范，为什么？&quot;,&quot;opts&quot;:[&quot;因为它被使用了很长时间&quot;,&quot;因为它具有可证伪性，且在当时具备数学正确性和预测精度&quot;,&quot;因为它是教会的官方理论&quot;,&quot;因为它很简单&quot;],&quot;answer&quot;:1,&quot;exp&quot;:&quot;托勒密地心说构建了精妙的数学模型，每100年误差不超过1天，具备可证伪性和可验证的预测能力。虽然后来被日心说推翻，但符合科学方法的本质要求——可检验、可证伪。科学方法比结论更重要。&quot;},{&quot;q&quot;:&quot;为什么保健品销售人员的\&quot;关心\&quot;需要用成本思维来审视？&quot;,&quot;opts&quot;:[&quot;因为他们不专业&quot;,&quot;因为他们卖的产品太贵&quot;,&quot;因为他们投入大量时间陪伴老人，这些成本最终由消费者承担&quot;,&quot;因为他们不了解老人的真实需求&quot;],&quot;answer&quot;:2,&quot;exp&quot;:&quot;成本思维揭示：销售人员投入大量时间陪伴老人（时间成本）、失败推销需分摊到成交客户（获客成本）、\&quot;出事即跑路\&quot;（犯错成本极低）。三方面都说明\&quot;关心\&quot;背后是逐利驱动，而非真正关爱。&quot;},{&quot;q&quot;:&quot;职业选手与业余选手最本质的区别是什么？&quot;,&quot;opts&quot;:[&quot;职业选手更有天赋&quot;,&quot;职业选手训练时间更长&quot;,&quot;稳定性——持续稳定地高水平发挥&quot;,&quot;职业选手更年轻&quot;],&quot;answer&quot;:2,&quot;exp&quot;:&quot;以高尔夫为例：业余选手好球与坏球交替出现（如+9杆），职业选手持续稳定（-3杆）。专业素养的核心是稳定性、流程化方法、情绪控制和系统知识，而非偶尔的超常发挥。专业素养的四大支柱：工作优先、严格流程、主动求优、体系知识。&quot;},{&quot;q&quot;:&quot;一万小时定律的\&quot;三板斧\&quot;中，哪一板斧专门解决\&quot;狗熊掰棒子\&quot;问题？&quot;,&quot;opts&quot;:[&quot;愿景-目标-道路规划&quot;,&quot;从不同意见中找合理性&quot;,&quot;凡事做记录&quot;,&quot;专注一个领域不跨界&quot;],&quot;answer&quot;:2,&quot;exp&quot;:&quot;第三板斧\&quot;凡事做记录\&quot;专门破解\&quot;狗熊掰棒子\&quot;（无积累效应）。通过系统性记录实现经验积累与传承，避免同一问题反复解决。记录过程本身也是深化思考的过程，加速进步。&quot;},{&quot;q&quot;:&quot;以下哪个陈述符合\&quot;可证伪性\&quot;标准？&quot;,&quot;opts&quot;:[&quot;上帝是全能的&quot;,&quot;明天要么下雨要么不下雨&quot;,&quot;广义相对论预言光线在引力场中弯曲&quot;,&quot;心诚则灵&quot;],&quot;answer&quot;:2,&quot;exp&quot;:&quot;爱因斯坦的预言\&quot;光线会在引力场中弯曲\&quot;可被观测检验（1919年日食证实），如果观测不符理论就被推翻。而\&quot;上帝全能\&quot;\&quot;心诚则灵\&quot;等陈述无论如何都无法被证明错误，因此不是科学命题。\&quot;明天要么下雨要么不下雨\&quot;是永真命题，无实际意义。&quot;},{&quot;q&quot;:&quot;\&quot;不选择反而获得幸福\&quot;这一研究结论背后的核心机制是什么？&quot;,&quot;opts&quot;:[&quot;选择越多人越懒&quot;,&quot;不选择是因为没有能力&quot;,&quot;选择少时人们更注重经营现有的关系和工作&quot;,&quot;选择多会导致破产&quot;],&quot;answer&quot;:2,&quot;exp&quot;:&quot;奚恺元教授研究发现：印度人婚姻满意度不低于美国人，因选择少（种姓制度限制），更注重经营婚姻。同理，选择少的印度裔员工因无退路，更专注于职业发展。幸福感与成就更多是\&quot;经营\&quot;的结果，而非反复选择的结果。&quot;},{&quot;q&quot;:&quot;真正有效的跨界需要什么先决条件？&quot;,&quot;opts&quot;:[&quot;有多个领域的兴趣&quot;,&quot;认识很多不同领域的人&quot;,&quot;有跨学科的学位&quot;,&quot;在原领域具备扎实的专业素养和成功基础&quot;],&quot;answer&quot;:3,&quot;exp&quot;:&quot;吴军强调：跨界是结果而非目的，前提是在原领域具备专业素养和成功基础。如摩尔斯（画家→电报发明人）在绘画领域已成名，华盛顿（勘测员→将军）具备扎实的地形知识和数学能力。没有原领域的\&quot;正\&quot;，跨界的\&quot;奇\&quot;就失去了根基。&quot;},{&quot;q&quot;:&quot;吴军用\&quot;陶朱公1两银子增长2500年\&quot;的类比是为了反驳什么？&quot;,&quot;opts&quot;:[&quot;通货膨胀理论&quot;,&quot;中国历史上的财富积累&quot;,&quot;银子的购买力变化&quot;,&quot;罗斯柴尔德家族财富持续指数增长的说法&quot;],&quot;answer&quot;:3,&quot;exp&quot;:&quot;有人声称罗斯柴尔德家族财富以6%年增长率持续200年已达几十万亿美元。吴军以陶朱公为例证：1两银子以6%增长2500年后达10^63两，远超宇宙原子总数。现实中无任何实体可实现长期指数增长，由此揭露阴谋论的荒谬。&quot;},{&quot;q&quot;:&quot;第欧根尼的极简生活哲学对现代人的核心启示是什么？&quot;,&quot;opts&quot;:[&quot;所有人都应该住木桶&quot;,&quot;拒绝所有社交活动&quot;,&quot;不要工作只追求享乐&quot;,&quot;减少对物质的过度关注以提升精神自由&quot;],&quot;answer&quot;:3,&quot;exp&quot;:&quot;第欧根尼主张\&quot;钱财应改善生活而非增加负担\&quot;，多数物质享受\&quot;可有可无\&quot;。吴军将其发展为减法思维：舍弃\&quot;花精力却未必有价值\&quot;的事务，将有限时间集中于真正重要的事情。物质减法带来精神加法，这是\&quot;做减法\&quot;的人生哲学。&quot;},{&quot;q&quot;:&quot;莱特兄弟成功发明飞机的关键方法论是什么？&quot;,&quot;opts&quot;:[&quot;运气特别好&quot;,&quot;资金非常充足&quot;,&quot;政府的支持&quot;,&quot;充分准备、理论指导、科学方法（风洞试验）&quot;],&quot;answer&quot;:3,&quot;exp&quot;:&quot;莱特兄弟的三大方法论：1）充分准备——宁可做700-1000次滑翔试验也不仓促试飞；2）理论指导——系统学习空气动力学，修正李林塔尔升力计算误差（多算60%）；3）科学方法——通过风洞进行可重复试验，测试200多种翼形。这是专业方法论战胜\&quot;民间科学家\&quot;的经典案例。&quot;},{&quot;q&quot;:&quot;为什么\&quot;给员工少一点选择\&quot;反而能提升管理效率？&quot;,&quot;opts&quot;:[&quot;员工不喜欢选择&quot;,&quot;这样做可以节省公司成本&quot;,&quot;员工会感恩公司&quot;,&quot;选择越少，员工越专注于手头工作，满意度反而更高&quot;],&quot;answer&quot;:3,&quot;exp&quot;:&quot;腾讯旅游福利案例：提供北海道滑雪和普吉岛两个选项→员工互相羡慕后悔；改为仅保留一个目的地→满意度反而更高。幸福学原理：选择多导致\&quot;这山望着那山高\&quot;，降低满足感。限制选择反而提升管理效率，本田汽车短产品线策略同理。&quot;}];

var SHORT_ANSWERS = [
{q:&#x27;请简述证伪思维的核心要义，并举例说明一个不可证伪的命题。&#x27;,
 model:&#x27;证伪思维（Falsifiability）由卡尔·波普尔提出，核心要义是：科学理论必须可被证明错误。一个理论只有具备被事实证明为错误的可能性，才是科学的。不可证伪的命题包括：算命先生的模糊预言（&quot;你近期会有贵人相助&quot;）、永真命题（&quot;明天要么下雨要么不下雨&quot;）、诉诸神秘（&quot;心诚则灵&quot;等）。证伪思维是区分科学与伪科学的根本标准。&#x27;,
 rubric:&#x27;核心定义（40%）：准确表述&quot;可被证明错误&quot;的含义；举例（30%）：给出贴切的不可证伪案例；理解深度（30%）：说明为什么可证伪性对科学重要。&#x27;},
{q:&#x27;请用成本思维分析：为什么保健品销售人员对老人特别&quot;关心&quot;？&#x27;,
 model:&#x27;成本思维三分析：1）时间成本——销售人员投入大量时间陪伴老人（聊天、上门、送礼），这些时间成本最终需从老人消费中覆盖（类比北京保姆薪资水平）；2）获客成本——多数被推销者不会购买，失败推销的成本需分摊到成交客户身上，推高产品实际价格；3）犯错成本——医院受医德、晋升、医闹约束犯错成本高，而保健品公司&quot;出事即跑路&quot;责任风险极低。三方面揭示&quot;关心&quot;本质是商业驱动的逐利行为，而非真正关爱。&#x27;,
 rubric:&#x27;时间成本维度（30%）；获客成本维度（30%）；犯错成本维度（30%）；综合理解（10%）。&#x27;},
{q:&#x27;什么是&quot;林黛玉式困境&quot;？在一万小时训练中应如何避免？&#x27;,

{concept:&#x27;证伪思维&#x27;,qas:[
 {q:&#x27;第一层：什么是&quot;不可证伪&quot;？为什么说算命先生的预言不可证伪？&#x27;,
  a:&#x27;不可证伪意味着一个陈述无法被任何可观测的事实证明为错误。算命先生说&quot;你近期会有贵人相助&quot;——如果没遇到，他可以说&quot;贵人已经出现但你没认出来&quot;或者&quot;还没到近期&quot;。这个说法总能找到借口自圆其说，所以不可证伪。相比之下，医生说&quot;你的血压是140/90mmHg&quot;是可证伪的——换一台血压计测就能验证。&#x27;},
 {q:&#x27;第二层：可证伪性是不是要求每个科学理论都必须是&quot;错的&quot;？&#x27;,
  a:&#x27;不是。可证伪性不是要求理论必须是错的，而是要求它具备&quot;被证明为错的可能性&quot;。就像说&quot;这个箱子装着一只猫&quot;——你可以打开箱子验证，可能看到猫（证实），也可能没看到（证伪）。但如果说&quot;这个箱子里有一个看不见摸不着的精灵&quot;，就无法验证。科学理论的强大恰恰在于它敢于接受最严格的检验。爱因斯坦预言行星光线的弯曲，就是把自己的理论放在被证伪的位置上。&#x27;},
 {q:&#x27;第三层：如果科学理论最终都可能被推翻，我们为什么要学习当前的科学知识？&#x27;,
  a:&#x27;这是一个深刻的问题。科学的进步不是简单地否定过去，而是在保留已有正确内容的基础上扩展。牛顿力学在高速微观世界被相对论和量子力学修正，但在地球上的日常应用中，牛顿力学依然是精确的。科学知识的价值不在于&quot;永远正确&quot;，而在于它是目前经过最严格检验的认识。就像你使用的地图——虽然可能不完美（新路没标注），但比没有地图强一万倍，而且会不断更新。&#x27;}
]},
{concept:&#x27;逻辑判断&#x27;,qas:[
 {q:&#x27;第一层：为什么说&quot;逻辑判断&quot;是信息时代最稀缺的能力？&#x27;,
  a:&#x27;因为我们每天接收的信息量是古人一年的量。面对大量相互矛盾的观点（&quot;专家&quot;说法常对立）、精心包装的伪科学、煽动情绪的标题党，如果没有逻辑筛选能力，就像在信息洪流中没有救生圈。逻辑判断提供了一个&quot;最低成本&quot;的过滤器——不需要你是每个领域的专家，只需要你能识别论证中的矛盾、谬误和不合理假设。判断对错的难度远低于解决问题本身（就像不需要会解二次方程也能验证X=2是否成立）。&#x27;},
 {q:&#x27;第二层：如何区分&quot;相关性&quot;和&quot;因果性&quot;？为什么这个区分如此重要？&#x27;,
  a:&#x27;相关性指两件事同时发生或关联变化，因果性则是一件事导致另一件事。冰淇淋销量和溺水率高度相关——是因为夏天热，两者都增加，而不是冰淇淋导致溺水。混淆两者的后果严重：如有人发现&quot;喝红酒的人更长寿&quot;，其实是喝红酒的人往往收入更高、医疗条件更好。&quot;老处女导致英国称霸&quot;就是典型的将弱相关性当作因果关系的荒唐案例。核心原则：时间上原因在前结果在后；有合理的机制解释；排除其他可能性。&#x27;},
 {q:&#x27;第三层：当面对两个逻辑上都成立但结论相反的理论（如凯恩斯主义vs哈耶克理论），应该如何判断？&#x27;,
  a:&#x27;需要理解&quot;逻辑自洽≠绝对正确&quot;。凯恩斯主义和哈耶克理论在各自预设前提下都是逻辑严密的。判断方式：1）考察前提假设在当下的适用性（如是否是经济危机时期）；2）看实证证据（哪种政策在类似国家/时期产生过更好效果）；3）理解理论的边界条件（没有放之四海皆准的理论）。关键思维：不是非此即彼，而是在具体情境中判断哪个理论的假设更贴近现实。就像工具——锤子和螺丝刀哪个更好？取决于你要钉钉子还是拧螺丝。&#x27;}
]},
{concept:&#x27;成本思维&#x27;,qas:[
 {q:&#x27;第一层：为什么说分析行为背后的&quot;投入-产出&quot;逻辑就能判断动机？&#x27;,
  a:&#x27;因为任何理性行为都有成本。如果一个人长期投入大量时间精力做某件事，必定有相应的收益来源。保健品销售人员每天花几小时陪老人聊天、送小礼品——如果这些投入不能从老人身上赚回数倍的钱，他的行为在经济上就是不可持续的。成本思维就是透过表面的&quot;善意&quot;看穿背后的商业逻辑。当然这不是说所有善意都是假的，而是说持续的、大量的投入一定有其经济基础支撑。&#x27;},
 {q:&#x27;第二层：&quot;免费&quot;的内容为什么往往是最贵的？&#x27;,
  a:&#x27;从成本思维分析：优质内容的创作需要时间、专业知识和精力投入。如果创作者长期&quot;免费&quot;产出，他的时间成本无法覆盖，要么降低质量，要么找到其他盈利模式（广告、诱导消费等）。免费的代价往往是：1）你的注意力被卖给广告商；2）你需要花大量时间筛选劣质信息；3）你可能被诱导做出不利的消费决策。免费获取转载内容需付出&quot;筛选时间成本&quot;，与直接付费的总成本相近。这就是&quot;天下没有免费的午餐&quot;。&#x27;},
 {q:&#x27;第三层：成本思维有什么局限性？当成本和收益难以量化时怎么办？&#x27;,
  a:&#x27;成本思维的主要局限：1）非经济动机——有些行为由情感、信仰、好奇心驱动（如志愿者工作），不能单纯用经济成本解释；2）量化困难——时间成本、情感成本难以精确衡量；3）长期vs短期——短期成本高但长期收益大的行为（如学习）可能被误判。应对方法：对可量化的用成本分析（商业行为），对不可量化的辅以其他判断工具（价值观、常识、逻辑）。成本思维是一个强大的分析起点，但不是唯一的判断标准。&#x27;}
]},
{concept:&#x27;减法思维&#x27;,qas:[
 {q:&#x27;第一层：庄子说&quot;吾生也有涯，而知也无涯&quot;，这个&quot;知&quot;具体指什么？&#x27;,
  a:&#x27;庄子的&quot;知&quot;不仅指知识，更包括所有可能做的事情、想追求的目标、想拥有的东西。现代社会尤甚——好书读不完、好课上不完、社交应酬不完美、工作机会抓不完。如果试图什么都做、什么都学、什么都拥有，结果一定是每件事都做不好、学不精、得不到。庄子的洞见在于：不是鼓励我们不学习，而是提醒我们——因为生命有限，所以必须做出取舍，把有限的时间花在真正重要的事情上。&#x27;},
 {q:&#x27;第二层：&quot;做减法&quot;表面上是放弃，为什么实际上是一种积极的策略？&#x27;,
  a:&#x27;因为减法不是消极地&quot;什么都不做&quot;，而是主动地&quot;选择做什么&quot;。减法思维的核心是&quot;少做事情，做好事情&quot;。把精力从10件事分散到每件上，每件只能做到60分；集中到3件事上，每件可以做到90分。后者带来的总价值远高于前者。硅谷创业公司的案例最有说服力：从长长的任务清单一路减到只剩下1件&quot;减掉就不再是自己&quot;的核心事，最终被高价收购。放弃次要目标，才能确保核心目标的达成。&#x27;},
 {q:&#x27;第三层：在现实中，如何区分&quot;应该减掉的&quot;和&quot;应该坚持的&quot;？有没有决策框架？&#x27;,
  a:&#x27;吴军提供了关键转换：从&quot;这件事是否该做&quot;转为&quot;不做这件事是否影响核心目标&quot;。具体框架：1）明确你的核心目标——一年后、五年后你希望成为什么样的人、达成什么事；2）列出所有当前占用的时间和精力项；3）对每一项问：如果砍掉它，我的核心目标会受多大影响？4）砍掉那些&quot;不影响核心目标&quot;或&quot;影响很小&quot;的事项。另一个标准：收益非线性——在低水平上做很多事，两倍时间仅获两倍收益；集中时间做好一件事，两倍时间可获10倍收益。选择&quot;西瓜&quot;而非&quot;芝麻&quot;。&#x27;}
]},
{concept:&#x27;常识判断&#x27;,qas:[
 {q:&#x27;第一层：什么是&quot;常识&quot;？它和&quot;专业知识&quot;是什么关系？&#x27;,
  a:&#x27;常识是经过长期实践检验、被广泛认可的基本道理。它和专业知识的根本区别在于：常识是&quot;门槛级&quot;的可靠认知，不需要深入学习特定领域的理论就能理解和运用。如&quot;低买高卖赚钱&quot;是投资常识，&quot;朝霞不出门，晚霞行千里&quot;是气象常识。常识和专业不是对立关系，而是互补——常识提供基础框架，专业知识在常识基础上深化。问题是很多人连常识都不用，一味追求复杂的&quot;新奇理论&quot;。&#x27;},
 {q:&#x27;第二层：为什么吴军说&quot;常识优于复杂模型&quot;？难道科学模型不比常识更准确吗？&#x27;,
  a:&#x27;关键不在于常识比模型更&quot;准确&quot;，而在于：1）常识的适用范围更广——不会用错语境。复杂模型的前提假设一旦不成立，结论就完全错误。2）常识经过千百年证伪筛选——存活下来的常识通常经得起考验。3）常识的&quot;简洁性&quot;本身就是优势——越复杂的模型越容易过度拟合。巴菲特的例子最好说明：他通过逛百货店观察顾客来投资，比依靠复杂金融模型的投行表现更好。当然，在工程和科学前沿，专业模型不可或缺。但日常生活中，常识通常够用且更可靠。&#x27;},
 {q:&#x27;第三层：如何辨别&quot;真常识&quot;和&quot;伪常识&quot;（即那些听起来像常识但其实是偏见/谬误的说法）？&#x27;,
  a:&#x27;这是一个重要的批判性问题。辨别框架：1）可证伪性检验——这个说法能被证明错误吗？&quot;十个光头九个富&quot;怎么证伪？2）来源追溯——它是来自长期经验总结还是某个人的断言？3）逻辑检验——&quot;不吃主食能减肥&quot;在逻辑上说得通吗（短期脱水减重≠长期减脂）？4）反例搜索——有没有明显反例？批评性思维不是拒绝常识，而是对常识保持适当的审视。真正的常识经得起反复检验，伪常识一戳就破。&#x27;}
]},
{concept:&#x27;专业素养&#x27;,qas:[
 {q:&#x27;第一层：专业和业余的本质区别究竟是什么？难道不是技能水平吗？&#x27;,
  a:&#x27;技能水平只是表象。本质区别在于三点：1）稳定性——业余选手可能偶尔打出&quot;神仙球&quot;但无法复制，职业选手持续稳定发挥。2）流程化——业余者靠感觉和天赋，职业者靠系统方法论。3）情绪控制——业余被打坏球影响心态，职业不受单次结果干扰。吴军与职业高尔夫教练的对决最能说明：职业选手-3杆稳定发挥，业余+9杆大起大落。专业不是&quot;顶峰更高&quot;，而是&quot;底线更高&quot;。&#x27;},
 {q:&#x27;第二层：专业素养的四大支柱中，哪一条最容易被忽视？为什么？&#x27;,
  a:&#x27;&quot;成体系的知识&quot;最容易被忽视。人们常以为专业人士就是&quot;懂得多&quot;，但关键不是知识点的数量，而是知识之间的系统关联。业余法律爱好者只能处理见过的案例（如特定财产纠纷），专业律师能应用广博知识解决千奇百怪的新问题（如Google遇到的无先例专利纠纷）。零散知识点像一堆砖头，成体系知识才是用砖头建起的房子。这就是为什么&quot;民间科学家&quot;即使看再多科普书，也无法与正规训练的科学家相比。&#x27;},
 {q:&#x27;第三层：在快速变化的时代，&quot;专业素养&quot;会不会变成&quot;僵化的包袱&quot;？如何平衡专业与灵活？&#x27;,
  a:&#x27;这是一个深刻的问题。专业素养的第四大支柱已经给出了答案：&quot;持续学习与技术更新&quot;是专业素养的保鲜剂。吴军的斯坦福毕业牙医15年来不断学习新技术（牙根治疗、植牙等），而那些停止进步的医生被淘汰。专业素养不是固守一套方法，而是拥有&quot;持续进化的方法论&quot;。专业者与业余者的另一个关键差异：专业者知道什么时候该打破规则。真正的专业素养=扎实的根基知识+系统的学习方法+开放的更新心态。&#x27;}
]},
{concept:&#x27;渐进改良&#x27;,qas:[
 {q:&#x27;第一层：为什么说&quot;最好是更好的敌人&quot;？追求完美有什么问题？&#x27;,
  a:&#x27;问题不在于&quot;追求完美&quot;这个目标本身，而在于它在行动上导致的后果：1）因为无法一步到位而迟迟不行动，导致完全无进展；2）各方都要&quot;最好方案&quot;，拒绝折中，导致连&quot;更好&quot;也无法实现；3）把时间和资源耗尽在一两个&quot;完美&quot;细节上，忽略了整体改进。禁枪法案就是典型：民主党的&quot;全面禁枪&quot;和共和党的&quot;背景调查&quot;——双方坚持各自&quot;最好&quot;，结果什么也没通过。追求完美是好的，但别让它成为行动的敌人。&#x27;},
 {q:&#x27;第二层：信息时代与工业时代的方法论差异说明了什么？&#x27;,
  a:&#x27;工业时代产品缺陷成本高（需要召回、重做），所以追求&quot;一步到位&quot;是理性的。但信息时代产品（软件、互联网服务）可以通过快速迭代低成本修正，使得&quot;先上线再改进&quot;成为更优策略。Google每周更新一次核心服务，特斯拉5年间品质飞速提升。这说明：方法论不是绝对的，而是要适应时代的技术条件。当试错成本降低时，渐进改良的优势就超过了&quot;一步到位&quot;。核心洞察：不是&quot;哪个方法更好&quot;，而是&quot;哪个方法更适合当下的约束条件&quot;。&#x27;},
 {q:&#x27;第三层：渐进改良是否意味着放弃远大理想？它和&quot;追求卓越&quot;矛盾吗？&#x27;,
  a:&#x27;完全不矛盾。渐进改良是&quot;怎么走&quot;的问题，追求卓越解决的是&quot;往哪走&quot;的问题。远大理想是方向，渐进改良是方法。&quot;以追求卓越为目标，以渐进改良为手段&quot;——在固定时间和成本约束下，接受&quot;这次做不到100分，但要比上次好&quot;，持续迭代最终会逼近卓越。吴军的经验：20%收益的&quot;更好&quot;改进×2次（总40%）优于30%收益的&quot;最好&quot;改进（即2+2&gt;3）。这不是放弃，而是更聪明的坚持。&#x27;}
]},
{concept:&#x27;跨界思维&#x27;,qas:[
 {q:&#x27;第一层：为什么说&quot;跨界是结果而非目的&quot;？刻意追求跨界有什么风险？&#x27;,
  a:&#x27;因为真正的跨界成功者都不是为了&quot;跨界&quot;而跨界。摩尔斯因通信延迟未能见妻子最后一面，被激发出电报发明的动机——这是问题驱动而非标签驱动。刻意追求跨界的风险：在原领域缺乏专业素养就跨界的，往往是两头落空（新领域无基础，原领域技能丢失）。就像吴军警告的：若因原领域做不好而跨界，结果只会更糟。跨界的前提是在原领域已经证明了自己的专业素养和做事能力。跨界不是逃避，而是进阶。&#x27;},
 {q:&#x27;第二层：跨界创新的&quot;高势能向低势能&quot;规律是什么？为什么物理学家容易转生物/金融？&#x27;,
  a:&#x27;高势能向低势能跨界指：从更难、更具基础性的学科向相对容易、应用性强的学科迁移更容易成功。物理学需要极强的数学工具和抽象思维，这些能力可以直接迁移到生物学（如DNA结构发现者多为物理学家）和金融学（大量诺贝尔经济学奖得主有数学背景）。反过来几乎不可能（生物学家转为顶尖物理学家？极少）。因为高势能学科训练的是&quot;更底层、更抽象的思维能力&quot;，这种能力是通用的。&#x27;},
 {q:&#x27;第三层：在人工智能时代，跨界能力的价值是增加了还是减少了？个人应如何培养跨界思维？&#x27;,
  a:&#x27;AI时代跨界能力的价值大大增加了。原因：1）AI擅长单一领域的重复性工作，而创新恰恰发生在领域交界处；2）AI工具降低了进入新领域的门槛，使得跨界更可行；3）最前沿的突破（如AI+生物医药、AI+材料科学）都在跨界地带。培养跨界思维的方法：1）先在主领域建立扎实的专业素养——这是跨界的&quot;根据地&quot;；2）保持开放心态，主动关注其他领域的发展；3）系统学习新领域知识（而非&quot;看几本书&quot;的皮毛）；4）关注&quot;交界处&quot;的问题——别人解决不了的往往是因为只从一个角度看。&#x27;}
]},
{concept:&#x27;期望值最大化&#x27;,qas:[
 {q:&#x27;第一层：什么是&quot;收益函数&quot;？为什么说它是系统自动优化的核心？&#x27;,
  a:&#x27;收益函数是衡量系统输出&quot;好坏&quot;的量化标准。在数学形式中，它是一个将系统状态映射到数值的函数——数值越大表示越&quot;好&quot;。系统的自动优化，就是不断调整参数以使这个函数的值最大化。就像AlphaGo的收益函数是&quot;赢棋概率&quot;——它所有的自我对弈都是在寻找让赢棋概率最大的走法。在社会系统中，收益函数就是&quot;激励机制&quot;——员工的行为会自然朝向让奖金最大化的方向。所以，设计对的人比教导对的人更有效。&#x27;},
 {q:&#x27;第二层：为什么说&quot;创始人基因决定公司基因&quot;？收益函数如何影响公司文化？&#x27;,
  a:&#x27;因为公司早期设定的考核标准（收益函数）会决定所有员工的行为方向，这些行为长期积累就形成了公司文化。Google早期奖励优质单元测试、惩戒代码错误→形成了重视工程质量的文化。Facebook强调产品迭代速度→发展为产品驱动型公司。短视型公司以销售指标为核心KPI→组织行为聚焦短期利益。创始人设定的第一个考核标准，就像给公司植入了&quot;基因&quot;——后续的招聘、晋升、资源分配都围绕这个标准展开，最终固化为文化。所以创始人要极其慎重地设计第一个收益函数。&#x27;},
 {q:&#x27;第三层：期望值最大化原理在个人成长中如何应用？&#x27;,
  a:&#x27;应用这个原理，你可以为自己设计一个&quot;个人成长收益函数&quot;：1）明确你的长期目标（如&quot;三年内成为领域专家&quot;）；2）拆解为可量化的指标（如每年完成2个核心项目、读20本专业书、获得1项认证）；3）每天问自己：今天我做的事情是否在最大化这个&quot;收益函数&quot;？这套方法的关键在于：把抽象的目标转化为具体的、可度量的行动指标，然后让日常行为自然向这些指标靠拢。就像导航系统——你不用时刻思考&quot;我该往哪走&quot;，系统会自动指引你。设计好你的&quot;人生收益函数&quot;，行为就会自动优化。&#x27;}
]}
];

var CASE_STUDY = {
title:&#x27;纽约犯罪率下降原因分析（1990年代）&#x27;,
background:&#x27;1990年代纽约市犯罪率显著下降，从1994年开始大幅改善。对此现象有多个自洽的解释，但我们如何运用MKS四维框架（证伪思维、逻辑判断、成本思维、常识判断）来筛选真正的原因？&#x27;,
analysis:[
 {dim:&#x27;证伪思维&#x27;,content:&#x27;面对多个看似合理的解释，&quot;堕胎合法化论&quot;称70年代堕胎合法化→非婚生子女减少→犯罪率下降。但：1）美国其他城市堕胎同样合法化但犯罪率未同步下降；2）非婚生子女比例未减少，拉丁裔反而上升；3）堕胎率高峰（1980-1995）与犯罪率下降时间错位。该解释虽自洽但可证伪——通过横向比较和时序分析即可推翻。&quot;摄像头监控论&quot;也被证伪：纽约大规模安装摄像头在2001年&quot;9·11&quot;之后，晚于犯罪率下降起始点（1994年），且芝加哥安装摄像头后治安未改善。&#x27;},
 {dim:&#x27;逻辑判断&#x27;,content:&#x27;运用逻辑推理分析因果关系。&quot;朱利安尼铁腕治理论&quot;经得住逻辑检验：1）时间吻合——1994年朱利安尼上任与犯罪率大幅下降同时发生；2）空间一致性——纽约犯罪率全国排名从top3降至第16名；3）机制合理——打击轻微犯罪（强行洗车、涂鸦、妓女工会）形成威慑效应。而其他解释要么时间错位、要么缺乏空间一致性、要么因果机制不清晰。逻辑判断告诉我们：时间+空间+机制三吻合的解释最可信。&#x27;},
 {dim:&#x27;成本思维&#x27;,content:&#x27;从成本收益角度看：犯罪分子之所以选择犯罪，是基于&quot;收益&gt;成本&quot;的理性计算。朱利安尼的&quot;破窗效应&quot;策略——严厉打击轻微违法行为（如逃票、涂鸦）——增加了犯罪行为的&quot;被抓成本&quot;和&quot;惩罚成本&quot;。当违法成本显著上升，即使收益不变，理性计算也会导致犯罪率下降。这个解释符合成本思维的底层逻辑：行为受成本收益驱动。而摄像头论之所以不成立，是因为单纯监控不直接增加违法成本——除非有人现场执法。&#x27;},
 {dim:&#x27;常识判断&#x27;,content:&#x27;常识告诉我们：1）越严厉的执法→越低的犯罪率——这是最直接的因果关系，不需要复杂理论；2）犯罪率高发地区往往是执法松弛的地区；3）看不见的&quot;抓手&quot;（如堕胎）与看得见的&quot;治理&quot;相比，后者显然更可信。巴菲特式的&quot;常识判断&quot;在这里非常有效：如果你看到一个城市换了市长后犯罪率大幅下降，最直接的常识就是——这位市长的治理有效。复杂解释往往不如简单直接的解释可靠。&#x27;}
],
conclusion:&#x27;通过MKS四维分析，&quot;朱利安尼铁腕治理&quot;是纽约犯罪率下降的最合理解释。证伪思维排除了时间错位的理论；逻辑判断确定了因果关系；成本思维解释了机制；常识判断选择了最直接的归因。四维交叉验证，结论坚实。&#x27;
};

var SIMULATIONS = [
{title:&#x27;场景一：创业公司的战略聚焦&#x27;,
 context:&#x27;你是一家AI创业公司的CEO，团队20人，融资500万美元。面对三个可能的战略方向：A）开发通用AI平台（大市场但竞争激烈）；B）专注医疗影像AI诊断（细分市场但需求明确）；C）同时推进多个AI应用快速变现（现金流好但资源分散）。&#x27;,
 options:[
  {text:&#x27;选择A：开发通用AI平台——先做大再做精，瞄准最大的市场&#x27;,feedback:&#x27;通用AI平台需要大量资金、人才和数据资源，以20人团队和500万美元融资，大概率会被大公司（Google、微软等）碾压。这不是&quot;捡西瓜&quot;而是&quot;被大象踩&quot;。你的商业模式缺乏聚焦，不符合减法思维。&#x27;,mks:&#x27;减法思维：资源有限时应聚焦核心价值点；常识判断：小公司不要和大公司在同一赛道正面竞争。&#x27;},
  {text:&#x27;选择B：专注医疗影像AI诊断——聚焦单点突破，建立壁垒&#x27;,feedback:&#x27;优秀！在有限资源下选择最有可能建立壁垒的细分领域。医疗影像AI有明确的需求、付费意愿强、大公司暂时不重点关注。团队可集中所有资源打磨单一产品，符合减法思维和渐进改良的迭代策略。&#x27;,mks:&#x27;减法思维（少做事情做好事情）+ 专业素养（建立领域深度）+ 渐进改良（迭代优化）。&#x27;},
  {text:&#x27;选择C：同时推进多个AI应用——快速赚钱，维持现金流&#x27;,feedback:&#x27;多个方向同时推进等于每个方向都投入不足，结果是每个产品都是&quot;半吊子&quot;。这犯了典型的&quot;芝麻思维&quot;——看起来每个方向都有收入，但没有一个能形成核心竞争力。初创公司最忌讳资源分散。&#x27;,mks:&#x27;减法思维的反面——捡芝麻丢西瓜。一万小时定律说明：没有足够聚焦，无法形成有效积累。&#x27;}
 ]
},
{title:&#x27;场景二：个人职业发展的十字路口&#x27;,
 context:&#x27;你是一名有5年经验的软件工程师，面临三个选择：A）留在现公司等待晋升（稳定但缓慢）；B）跳槽去一家AI创业公司（高风险高回报）；C）跨界转型做技术管理（脱离一线 coding）。&#x27;,
 options:[

  tEl.textContent=&#x27;⏱ &#x27;+(m&lt;10?&#x27;0&#x27;:&#x27;&#x27;)+m+&#x27;:&#x27;+(s&lt;10?&#x27;0&#x27;:&#x27;&#x27;)+s;

function selectMCQ(qidx,oi){
 var btns=document.querySelectorAll(&#x27;#qcard-&#x27;+qidx+&#x27; .quiz-option&#x27;);
 if(btns[0].disabled)return;
 btns.forEach(function(b){b.disabled=true;});
 var correct=MCQS[qidx].ans;
 btns.forEach(function(b,bi){
  if(bi===correct)b.classList.add(&#x27;correct&#x27;);
  if(bi===oi &amp;&amp; bi!==correct)b.classList.add(&#x27;wrong&#x27;);
  if(bi===oi)b.classList.add(&#x27;selected&#x27;);
 });
 document.getElementById(&#x27;qexp-&#x27;+qidx).style.display=&#x27;block&#x27;;
 answeredCount++;
 state.stats.quiz++;
 if(oi!==correct){
  state.stats.wrong++;
  if(state.wrong.indexOf(qidx)&lt;0){
   state.wrong.push(qidx);
   if(state.wrong.length&gt;state.stats.maxWrong)state.stats.maxWrong=state.wrong.length;
  }
 }else{
  state.stats.correct++;
 }
 saveState();
 checkQuizComplete();
}

function checkQuizComplete(){
 if(answeredCount&gt;=MCQS.length){
  var total=state.stats.correct+state.stats.wrong;

 html+=&#x27;&lt;div class=&quot;mks-core&quot; style=&quot;padding:8px 12px;background:#fdf6ec;border-radius:0 8px 8px 0&quot;&gt;&lt;strong&gt;MKS 四维分析框架：&lt;/strong&gt;&lt;/div&gt;&#x27;;
 cs.analysis.forEach(function(a){

 });
 html+=&#x27;&lt;div style=&quot;margin-top:12px;padding:14px;background:#d4edda;border:1px solid #27ae60;border-radius:8px&quot;&gt;&#x27;;
 html+=&#x27;&lt;strong style=&quot;color:#27ae60&quot;&gt;结论：&lt;/strong&gt;&lt;span style=&quot;font-size:.88rem&quot;&gt;&#x27;+cs.conclusion+&#x27;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&#x27;;
 c.innerHTML=html;
}

/* ===== SIMULATIONS ===== */
function renderSimulations(){
 var c=document.getElementById(&#x27;simulationContainer&#x27;);
 var html=&#x27;&#x27;;
 SIMULATIONS.forEach(function(s,si){
  html+=&#x27;&lt;div class=&quot;card&quot; id=&quot;sim-&#x27;+si+&#x27;&quot;&gt;&#x27;;
  html+=&#x27;&lt;h3&gt;&#x27;+s.title+&#x27;&lt;/h3&gt;&#x27;;
  html+=&#x27;&lt;p style=&quot;margin-bottom:10px;font-size:.9rem&quot;&gt;&#x27;+s.context+&#x27;&lt;/p&gt;&#x27;;
  s.options.forEach(function(o,oi){
   html+=&#x27;&lt;button class=&quot;simulation-option&quot; id=&quot;sim&#x27;+si+&#x27;opt&#x27;+oi+&#x27;&quot; onclick=&quot;selectSim(&#x27;+si+&#x27;,&#x27;+oi+&#x27;)&quot;&gt;&#x27;;
   html+=String.fromCharCode(65+oi)+&#x27;. &#x27;+o.text+&#x27;&lt;/button&gt;&#x27;;
  });
  html+=&#x27;&lt;div id=&quot;sim-fb-&#x27;+si+&#x27;&quot; style=&quot;display:none&quot;&gt;&lt;/div&gt;&#x27;;
  html+=&#x27;&lt;/div&gt;&#x27;;
 });
 c.innerHTML=html;
}
function selectSim(si,oi){
 var sim=SIMULATIONS[si];
 var opt=sim.options[oi];
 var btns=document.querySelectorAll(&#x27;#sim-&#x27;+si+&#x27; .simulation-option&#x27;);
 btns.forEach(function(b,bi){
  b.disabled=true;
  if(bi===oi)b.classList.add(&#x27;selected&#x27;);
 });
 var fb=document.getElementById(&#x27;sim-fb-&#x27;+si);
 fb.style.display=&#x27;block&#x27;;
 fb.innerHTML=&#x27;&lt;div style=&quot;margin-top:10px;padding:12px;background:#fdf6ec;border-radius:8px;border-left:4px solid &#x27;+
  (oi===1?&#x27;#27ae60&#x27;:&#x27;#c0392b&#x27;)+&#x27;&quot;&gt;&#x27;+
  &#x27;&lt;p&gt;&lt;strong&gt;你的选择：&lt;/strong&gt;&#x27;+String.fromCharCode(65+oi)+&#x27;. &#x27;+opt.text+&#x27;&lt;/p&gt;&#x27;+
  &#x27;&lt;p style=&quot;margin-top:6px&quot;&gt;&lt;strong&gt;反馈：&lt;/strong&gt;&#x27;+opt.feedback+&#x27;&lt;/p&gt;&#x27;+
  &#x27;&lt;p style=&quot;margin-top:6px;color:#c0392b;font-size:.85rem&quot;&gt;&lt;strong&gt;MKS分析：&lt;/strong&gt;&#x27;+opt.mks+&#x27;&lt;/p&gt;&lt;/div&gt;&#x27;;
}

/* ===== LEARNING PATH ===== */
function renderLearningPath(){
 var c=document.getElementById(&#x27;learningPathContainer&#x27;);
 var html=&#x27;&#x27;;
 LEARNING_PATH.forEach(function(stage){
  html+=&#x27;&lt;div class=&quot;stage-card&quot;&gt;&#x27;;
  html+=&#x27;&lt;h4&gt;&lt;span class=&quot;stage-num&quot;&gt;&#x27;+stage.stage+&#x27;&lt;/span&gt;&#x27;+stage.title+&#x27;&lt;/h4&gt;&#x27;;
  html+=&#x27;&lt;div style=&quot;margin:6px 0;display:flex;flex-wrap:wrap;gap:4px&quot;&gt;&#x27;;
  stage.concepts.forEach(function(cn){
   var icon=&#x27;&#x27;;
   CONCEPTS.forEach(function(con){
    if(con.name===cn)icon=con.icon;
   });
   html+=&#x27;&lt;span class=&quot;badge&quot; style=&quot;background:#8a7a6a&quot;&gt;&#x27;+icon+&#x27; &#x27;+cn+&#x27;&lt;/span&gt;&#x27;;
  });
  html+=&#x27;&lt;/div&gt;&#x27;;
  html+=&#x27;&lt;p style=&quot;font-size:.88rem;margin:6px 0&quot;&gt;&#x27;+stage.desc+&#x27;&lt;/p&gt;&#x27;;
  html+=&#x27;&lt;div style=&quot;font-size:.83rem;color:#6b5b4b&quot;&gt;&lt;strong&gt;学习活动：&lt;/strong&gt;&lt;ul&gt;&#x27;;
  stage.activities.forEach(function(a){

  });
  html+=&#x27;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&#x27;;
 });
 c.innerHTML=html;
}

/* ===== BOUNDARY ===== */
function renderBoundary(){
 var c=document.getElementById(&#x27;boundaryContainer&#x27;);
 var html=&#x27;&#x27;;
 BOUNDARY.forEach(function(b){
  html+=&#x27;&lt;div class=&quot;boundary-item&quot;&gt;&lt;h5&gt;&#x27;+b.title+&#x27;&lt;/h5&gt;&lt;p style=&quot;font-size:.8rem;color:#666&quot;&gt;&#x27;+b.usage+&#x27;&lt;/p&gt;&lt;/div&gt;&#x27;;
 });
 c.innerHTML=html;
}

function initTabs(){
  var labels=[
    &#x27;📋 总览&#x27;,&#x27;🃏 知识卡片&#x27;,&#x27;📝 题库&#x27;,&#x27;⏱️ 考试&#x27;,

  ];
  var nav=document.getElementById(&#x27;tabNav&#x27;);
  labels.forEach(function(l,i){
    var btn=document.createElement(&#x27;button&#x27;);
    btn.textContent=l;
    btn.onclick=function(){switchTab(i)};
    if(i===0)btn.classList.add(&#x27;active&#x27;);

function switchTab(i){
  currentTab=i;
  document.querySelectorAll(&#x27;.tab-nav button&#x27;).forEach(function(b,j){b.classList.toggle(&#x27;active&#x27;,j===i)});
  document.querySelectorAll(&#x27;.tab-content&#x27;).forEach(function(c,j){c.classList.toggle(&#x27;active&#x27;,j===i)});
  if(i===4)renderReview();
  if(i===5)initMindmap();
}

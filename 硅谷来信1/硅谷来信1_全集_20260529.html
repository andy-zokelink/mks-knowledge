<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>吴军·硅谷来信 — 知识全集</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fdf6ec;--accent:#c0392b;--text:#3d2f2f;--sub:#6b5b5b;--nav-h:48px}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.7;padding-top:var(--nav-h)}
.top-nav{position:fixed;top:0;left:0;right:0;z-index:9999;background:var(--bg);border-bottom:2px solid var(--accent);display:flex;height:var(--nav-h);overflow-x:auto;-webkit-overflow-scrolling:touch;gap:2px;padding:0 4px}
.top-nav-btn{flex-shrink:0;padding:6px 12px;border:none;background:transparent;color:var(--sub);font-size:clamp(0.7rem,2vw,0.85rem);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;transition:all .2s;min-height:44px}
.top-nav-btn:hover{color:var(--accent)}
.top-nav-btn.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.hamburger{display:none;flex-shrink:0;padding:6px 12px;border:none;background:transparent;font-size:1.5rem;cursor:pointer;color:var(--accent);min-height:44px;min-width:44px}
@media(max-width:768px){.top-nav{flex-wrap:wrap;height:auto;padding:4px 0}.hamburger{display:block}.top-nav-btn:not(.active):not(.always-show){display:none}.top-nav.expanded .top-nav-btn{display:block}body{padding-top:52px}}

.iframe-panel{display:none;width:100%;height:calc(100vh - var(--nav-h));border:none;overflow:auto;-webkit-overflow-scrolling:touch}
.iframe-panel.active{display:block}
@media(max-width:768px){.iframe-panel{height:calc(100vh - 52px)}}
</style></head><body>
<nav class="top-nav" id="topNav">
<button class="hamburger" onclick="toggleNav()" aria-label="菜单">☰</button>
<button class="top-nav-btn always-show active" onclick="switchTopic(0)" data-topic="0">🏠 首页</button>
<button class="top-nav-btn  active" onclick="switchTopic(1)" data-topic="1">🔬 科技与商业</button>
<button class="top-nav-btn  active" onclick="switchTopic(2)" data-topic="2">🧠 思维方法论</button>
<button class="top-nav-btn  active" onclick="switchTopic(3)" data-topic="3">💰 投资与财富</button>
<button class="top-nav-btn  active" onclick="switchTopic(4)" data-topic="4">🏛 历史与文明</button>
<button class="top-nav-btn  active" onclick="switchTopic(5)" data-topic="5">🎨 艺术审美</button>
<button class="top-nav-btn  active" onclick="switchTopic(6)" data-topic="6">🌱 教育与成长</button>
<button class="top-nav-btn  active" onclick="switchTopic(7)" data-topic="7">🎯 职场人生</button>
</nav>
<iframe class="iframe-panel" id="topic-0" src="index.html" style="display:block" loading="lazy"></iframe>
<iframe class="iframe-panel" id="topic-1" src="1-科技与商业逻辑.html" style="display:none" loading="lazy"></iframe>
<iframe class="iframe-panel" id="topic-2" src="2-思维方法论.html" style="display:none" loading="lazy"></iframe>
<iframe class="iframe-panel" id="topic-3" src="3-投资与财富.html" style="display:none" loading="lazy"></iframe>
<iframe class="iframe-panel" id="topic-4" src="4-历史与文明对话.html" style="display:none" loading="lazy"></iframe>
<iframe class="iframe-panel" id="topic-5" src="5-艺术审美与品味.html" style="display:none" loading="lazy"></iframe>
<iframe class="iframe-panel" id="topic-6" src="6-教育与成长.html" style="display:none" loading="lazy"></iframe>
<iframe class="iframe-panel" id="topic-7" src="7-职场与人生智慧.html" style="display:none" loading="lazy"></iframe>

<script>
function switchTopic(n){
  document.querySelectorAll('.top-nav-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.iframe-panel').forEach(p=>p.style.display='none');
  var btn=document.querySelector('.top-nav-btn[data-topic="'+n+'"]');
  var panel=document.getElementById('topic-'+n);
  if(btn)btn.classList.add('active');if(btn&&n!==0)btn.classList.add('always-show');
  if(panel)panel.style.display='block';
  window.scrollTo(0,0);
  // If iframe hasn't loaded yet, trigger load
  if(panel && !panel.dataset.loaded){
    panel.dataset.loaded='1';
  }
}
function toggleNav(){document.getElementById('topNav').classList.toggle('expanded');}
</script>
</body></html>

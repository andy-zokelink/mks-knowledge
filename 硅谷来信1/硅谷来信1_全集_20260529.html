  var tPct=Math.round((cPct+qPct)/2);
  document.getElementById(&#x27;conceptPct&#x27;).textContent=cPct+&#x27;%&#x27;;
  document.getElementById(&#x27;quizPct&#x27;).textContent=qPct+&#x27;%&#x27;;
  document.getElementById(&#x27;totalPct&#x27;).textContent=tPct+&#x27;%&#x27;;
  document.getElementById(&#x27;conceptBar&#x27;).style.width=cPct+&#x27;%&#x27;;
  document.getElementById(&#x27;quizBar&#x27;).style.width=qPct+&#x27;%&#x27;;
  document.getElementById(&#x27;totalBar&#x27;).style.width=tPct+&#x27;%&#x27;;
}

// ===== TAB 2: FLIP CARDS =====
function goToCard(i){
  currentCard=i;
  cardFlipped=false;
  renderCard();
}

function renderCard(){
  var c=flipCards[currentCard];
  document.getElementById(&#x27;flipFront&#x27;).textContent=c.front;
  var back=&#x27;&lt;h4&gt;&lt;span class=&quot;tag tag-def&quot;&gt;定义&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;&#x27;+c.def+&#x27;&lt;/p&gt;&#x27;;
  back+=&#x27;&lt;h4&gt;&lt;span class=&quot;tag tag-analogy&quot;&gt;类比&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;&#x27;+c.analogy+&#x27;&lt;/p&gt;&#x27;;
  back+=&#x27;&lt;h4&gt;&lt;span class=&quot;tag tag-example&quot;&gt;示例&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;&#x27;+c.example+&#x27;&lt;/p&gt;&#x27;;
  back+=&#x27;&lt;h4&gt;&lt;span class=&quot;tag tag-counter&quot;&gt;反例&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;&#x27;+c.counter+&#x27;&lt;/p&gt;&#x27;;
  document.getElementById(&#x27;flipBack&#x27;).innerHTML=back;
  document.getElementById(&#x27;flipCounter&#x27;).textContent=(currentCard+1)+&#x27; / &#x27;+flipCards.length;
  var card=document.getElementById(&#x27;flipCard&#x27;);
  card.classList.toggle(&#x27;flipped&#x27;,cardFlipped);
  var lb=document.getElementById(&#x27;learnedBtn&#x27;);
  var isLearned=learnedCards.indexOf(currentCard)&gt;=0;
  lb.textContent=isLearned?&#x27;✔ 已学习&#x27;:&#x27;✔ 标记「已学习」&#x27;;
  lb.classList.toggle(&#x27;learned&#x27;,isLearned);
}

function flipCard(){
  cardFlipped=!cardFlipped;
  document.getElementById(&#x27;flipCard&#x27;).classList.toggle(&#x27;flipped&#x27;,cardFlipped);
}

function prevCard(){
  currentCard=(currentCard-1+flipCards.length)%flipCards.length;
  cardFlipped=false;
  renderCard();
}

function nextCard(){
  currentCard=(currentCard+1)%flipCards.length;
  cardFlipped=false;
  renderCard();
}

function markLearned(){
  var idx=learnedCards.indexOf(currentCard);
  if(idx&gt;=0){learnedCards.splice(idx,1);toast(&#x27;已取消学习标记&#x27;)}
  else{learnedCards.push(currentCard);toast(&#x27;已标记为已学习 ✓&#x27;)}
  save(&#x27;learned&#x27;,learnedCards);
  renderCard();
  updateProgress();
}

// ===== TAB 3: QUESTION BANK =====
function renderQuestionBank(){
  var mcDiv=document.getElementById(&#x27;mcQuestions&#x27;);
  mcQuestions.forEach(function(q,i){
    var card=document.createElement(&#x27;div&#x27;);
    card.className=&#x27;quiz-card&#x27;;
    card.id=&#x27;mc-&#x27;+i;
    card.innerHTML=&#x27;&lt;div class=&quot;q-num&quot;&gt;选择题 #&#x27;+(i+1)+&#x27; · &#x27;+q.concept+&#x27;&lt;/div&gt;&lt;div class=&quot;q-text&quot;&gt;&#x27;+q.q+&#x27;&lt;/div&gt;&#x27;;
    var opts=q.opts.map(function(o,j){
      return &#x27;&lt;button class=&quot;option&quot; id=&quot;mc-&#x27;+i+&#x27;-opt-&#x27;+j+&#x27;&quot;&gt;&#x27;+&#x27;ABCD&#x27;[j]+&#x27;. &#x27;+o+&#x27;&lt;/button&gt;&#x27;;
    }).join(&#x27;&#x27;);
    card.innerHTML+=opts+&#x27;&lt;div class=&quot;feedback&quot; id=&quot;mc-&#x27;+i+&#x27;-fb&quot;&gt;&lt;/div&gt;&#x27;;

    mcDiv.appendChild(card);

    // Bind after DOM
    q.opts.forEach(function(_,j){
      document.getElementById(&#x27;mc-&#x27;+i+&#x27;-opt-&#x27;+j).onclick=function(){answerMC(i,j)};
    });
  });

  // Check saved
  Object.keys(mcAnswers).forEach(function(k){
    var i=parseInt(k);
    var a=mcAnswers[k];
    var fb=document.getElementById(&#x27;mc-&#x27;+i+&#x27;-fb&#x27;);
    var correct=a===mcQuestions[i].ans;
    fb.textContent=correct?&#x27;✓ 正确！&#x27;:&#x27;✗ 错误。正确答案：&#x27;+&#x27;ABCD&#x27;[mcQuestions[i].ans]+&#x27;。&#x27;+mcQuestions[i].explain;
    fb.className=&#x27;feedback show &#x27;+(correct?&#x27;correct-msg&#x27;:&#x27;wrong-msg&#x27;);
    q.opts.forEach(function(_,j){
      var btn=document.getElementById(&#x27;mc-&#x27;+i+&#x27;-opt-&#x27;+j);
      btn.disabled=true;
      if(j===mcQuestions[i].ans)btn.classList.add(&#x27;correct&#x27;);
      if(j===a&amp;&amp;j!==mcQuestions[i].ans)btn.classList.add(&#x27;wrong&#x27;);
    });
  });

  // Short answer
  var sqDiv=document.getElementById(&#x27;shortQuestions&#x27;);
  shortQuestions.forEach(function(q,i){
    var card=document.createElement(&#x27;div&#x27;);
    card.className=&#x27;quiz-card&#x27;;
    card.id=&#x27;sq-&#x27;+i;
    card.innerHTML=&#x27;&lt;div class=&quot;q-num&quot;&gt;简答题 #&#x27;+(i+1)+&#x27;&lt;/div&gt;&lt;div class=&quot;q-text&quot;&gt;&#x27;+q.q+&#x27;&lt;/div&gt;&#x27;;
    card.innerHTML+=&#x27;&lt;textarea class=&quot;short-answer&quot; id=&quot;sq-&#x27;+i+&#x27;-input&quot; placeholder=&quot;输入你的答案...&quot;&gt;&#x27;+(shortAnswers[i]||&#x27;&#x27;)+&#x27;&lt;/textarea&gt;&#x27;;
    card.innerHTML+=&#x27;&lt;span class=&quot;show-answer&quot; id=&quot;sq-&#x27;+i+&#x27;-toggle&quot; onclick=&quot;toggleReference(&#x27;+i+&#x27;)&quot;&gt;查看参考答案&lt;/span&gt;&#x27;;
    card.innerHTML+=&#x27;&lt;div class=&quot;feedback&quot; id=&quot;sq-&#x27;+i+&#x27;-ref&quot; style=&quot;background:#fdf8f2;color:var(--text2)&quot;&gt;&#x27;+q.ref+&#x27;&lt;/div&gt;&#x27;;
    sqDiv.appendChild(card);

    document.getElementById(&#x27;sq-&#x27;+i+&#x27;-input&#x27;).oninput=function(){
      var val=this.value.trim();
      if(val){
        shortAnswers[i]=val;
        save(&#x27;short&#x27;,shortAnswers);
        updateProgress();
      }
    };
  });
}

function answerMC(i,j){
  if(mcAnswers[i]!==undefined)return;
  mcAnswers[i]=j;
  save(&#x27;mc&#x27;,mcAnswers);
  var correct=j===mcQuestions[i].ans;
  var fb=document.getElementById(&#x27;mc-&#x27;+i+&#x27;-fb&#x27;);
  fb.textContent=correct?&#x27;✓ 正确！&#x27;:&#x27;✗ 错误。正确答案：&#x27;+&#x27;ABCD&#x27;[mcQuestions[i].ans]+&#x27;。&#x27;+mcQuestions[i].explain;
  fb.className=&#x27;feedback show &#x27;+(correct?&#x27;correct-msg&#x27;:&#x27;wrong-msg&#x27;);
  mcQuestions[i].opts.forEach(function(_,k){
    var btn=document.getElementById(&#x27;mc-&#x27;+i+&#x27;-opt-&#x27;+k);
    btn.disabled=true;
    if(k===mcQuestions[i].ans)btn.classList.add(&#x27;correct&#x27;);
    if(k===j&amp;&amp;!correct)btn.classList.add(&#x27;wrong&#x27;);
  });
  if(!correct){
    errorBook.push({type:&#x27;mc&#x27;,index:i,answer:j,time:Date.now()});
    save(&#x27;errors&#x27;,errorBook);
  }
  updateProgress();
}

function toggleReference(i){
  var ref=document.getElementById(&#x27;sq-&#x27;+i+&#x27;-ref&#x27;);
  var isOpen=ref.classList.contains(&#x27;show&#x27;);
  ref.classList.toggle(&#x27;show&#x27;,!isOpen);
  document.getElementById(&#x27;sq-&#x27;+i+&#x27;-toggle&#x27;).textContent=isOpen?&#x27;查看参考答案&#x27;:&#x27;隐藏参考答案&#x27;;
}

// ===== TAB 4: EXAM =====
function startExam(){
  // Pick 7 MC + 3 short randomly
  var mcIndices=[];
  while(mcIndices.length&lt;7){
    var r=Math.floor(Math.random()*mcQuestions.length);
    if(mcIndices.indexOf(r)&lt;0)mcIndices.push(r);
  }
  var sqIndices=[];
  while(sqIndices.length&lt;3){
    var r=Math.floor(Math.random()*shortQuestions.length);
    if(sqIndices.indexOf(r)&lt;0)sqIndices.push(r);
  }

  examState={
    mcIndices:mcIndices,
    sqIndices:sqIndices,
    mcAnswers:{},
    sqAnswers:{},
    startTime:Date.now(),
    timeLimit:15*60,
    timer:null
  };

  var content=document.getElementById(&#x27;examContent&#x27;);
  content.innerHTML=&#x27;&#x27;;
  mcIndices.forEach(function(origIdx,i){
    var q=mcQuestions[origIdx];
    var card=document.createElement(&#x27;div&#x27;);
    card.className=&#x27;quiz-card&#x27;;
    card.id=&#x27;exam-mc-&#x27;+i;
    card.innerHTML=&#x27;&lt;div class=&quot;q-num&quot;&gt;选择题 #&#x27;+(i+1)+&#x27;&lt;/div&gt;&lt;div class=&quot;q-text&quot;&gt;&#x27;+q.q+&#x27;&lt;/div&gt;&#x27;;
    q.opts.forEach(function(o,j){
      card.innerHTML+=&#x27;&lt;button class=&quot;option&quot; id=&quot;exam-mc-&#x27;+i+&#x27;-opt-&#x27;+j+&#x27;&quot; onclick=&quot;examAnswerMC(&#x27;+i+&#x27;,&#x27;+j+&#x27;)&quot;&gt;&#x27;+&#x27;ABCD&#x27;[j]+&#x27;. &#x27;+o+&#x27;&lt;/button&gt;&#x27;;
    });
    content.appendChild(card);
  });

  sqIndices.forEach(function(origIdx,i){
    var q=shortQuestions[origIdx];
    var card=document.createElement(&#x27;div&#x27;);
    card.className=&#x27;quiz-card&#x27;;
    card.id=&#x27;exam-sq-&#x27;+i;
    card.innerHTML=&#x27;&lt;div class=&quot;q-num&quot;&gt;简答题 #&#x27;+(i+1)+&#x27;&lt;/div&gt;&lt;div class=&quot;q-text&quot;&gt;&#x27;+q.q+&#x27;&lt;/div&gt;&#x27;;
    card.innerHTML+=&#x27;&lt;textarea class=&quot;short-answer&quot; id=&quot;exam-sq-&#x27;+i+&#x27;-input&quot; placeholder=&quot;输入你的答案...&quot;&gt;&lt;/textarea&gt;&#x27;;
    content.appendChild(card);
  });

  document.getElementById(&#x27;examStartBtn&#x27;).style.display=&#x27;none&#x27;;
  document.getElementById(&#x27;examSubmitBtn&#x27;).style.display=&#x27;inline-block&#x27;;
  document.getElementById(&#x27;examResult&#x27;).style.display=&#x27;none&#x27;;
  document.getElementById(&#x27;examResult&#x27;).innerHTML=&#x27;&#x27;;

  var timerEl=document.getElementById(&#x27;examTimer&#x27;);
  timerEl.classList.remove(&#x27;warning&#x27;);
  var remaining=examState.timeLimit;
  updateTimer(remaining);
  examState.timer=setInterval(function(){
    remaining--;
    updateTimer(remaining);
    if(remaining&lt;=0){submitExam()}
  },1000);
}

function updateTimer(s){
  var m=Math.floor(s/60);
  var sec=s%60;
  var el=document.getElementById(&#x27;examTimer&#x27;);
  el.textContent=m+&#x27;:&#x27;+(sec&lt;10?&#x27;0&#x27;:&#x27;&#x27;)+sec;
  if(s&lt;60)el.classList.add(&#x27;warning&#x27;);
}

function examAnswerMC(i,j){
  if(examState.mcAnswers[i]!==undefined)return;
  examState.mcAnswers[i]=j;
  examState.mcIndices.forEach(function(_,k){
  });
  // Highlight selection
  mcQuestions[examState.mcIndices[i]].opts.forEach(function(_,k){
    var btn=document.getElementById(&#x27;exam-mc-&#x27;+i+&#x27;-opt-&#x27;+k);
    btn.style.background=k===j?&#x27;#fff8f0&#x27;:&#x27;&#x27;;
    btn.style.borderColor=k===j?&#x27;var(--accent2)&#x27;:&#x27;&#x27;;
  });
}

function submitExam(){
  if(examState&amp;&amp;examState.timer){clearInterval(examState.timer);examState.timer=null}
  if(!examState)return;

  // Collect short answers
  examState.sqIndices.forEach(function(_,i){
    var el=document.getElementById(&#x27;exam-sq-&#x27;+i+&#x27;-input&#x27;);
    if(el)examState.sqAnswers[i]=el.value.trim();
  });

  // Score
  var mcCorrect=0;
  var mcResults=[];
  examState.mcIndices.forEach(function(origIdx,i){
    var userAns=examState.mcAnswers[i];
    var correctAns=mcQuestions[origIdx].ans;
    var isCorrect=userAns===correctAns;
    if(isCorrect)mcCorrect++;
    mcResults.push({q:mcQuestions[origIdx],userAns:userAns,correctAns:correctAns,isCorrect:isCorrect});
    if(!isCorrect){
      errorBook.push({type:&#x27;exam_mc&#x27;,index:origIdx,answer:userAns,time:Date.now()});
    }
  });
  save(&#x27;errors&#x27;,errorBook);

  var elapsed=Math.round((Date.now()-examState.startTime)/1000);
  var m=Math.floor(elapsed/60);
  var s=elapsed%60;

  var resultDiv=document.getElementById(&#x27;examResult&#x27;);
  resultDiv.style.display=&#x27;block&#x27;;
  var html=&#x27;&lt;div class=&quot;card&quot; style=&quot;margin-top:20px&quot;&gt;&#x27;;
  html+=&#x27;&lt;h2&gt;考试结果&lt;/h2&gt;&#x27;;
  html+=&#x27;&lt;div class=&quot;stat-row&quot;&gt;&#x27;;
  html+=&#x27;&lt;div class=&quot;stat-box&quot;&gt;&lt;div class=&quot;num&quot;&gt;&#x27;+mcCorrect+&#x27;/7&lt;/div&gt;&lt;div class=&quot;tag&quot;&gt;选择题正确&lt;/div&gt;&lt;/div&gt;&#x27;;
  html+=&#x27;&lt;div class=&quot;stat-box&quot;&gt;&lt;div class=&quot;num&quot;&gt;&#x27;+(mcCorrect&gt;=5?&#x27;通过 ✓&#x27;:&#x27;需加强&#x27;)+&#x27;&lt;/div&gt;&lt;div class=&quot;tag&quot;&gt;综合评价&lt;/div&gt;&lt;/div&gt;&#x27;;
  html+=&#x27;&lt;div class=&quot;stat-box&quot;&gt;&lt;div class=&quot;num&quot;&gt;&#x27;+m+&#x27;分&#x27;+s+&#x27;秒&lt;/div&gt;&lt;div class=&quot;tag&quot;&gt;用时&lt;/div&gt;&lt;/div&gt;&#x27;;
  html+=&#x27;&lt;/div&gt;&#x27;;

  html+=&#x27;&lt;h3&gt;选择题解析&lt;/h3&gt;&#x27;;
  mcResults.forEach(function(r){
    html+=&#x27;&lt;div class=&quot;quiz-card&quot;&gt;&lt;div class=&quot;q-text&quot;&gt;&#x27;+r.q.q+&#x27;&lt;/div&gt;&#x27;;
    html+=&#x27;&lt;p style=&quot;font-size:0.85rem;color:&#x27;+(r.isCorrect?&#x27;var(--success)&#x27;:&#x27;var(--accent)&#x27;)+&#x27;&quot;&gt;&#x27;;
    if(r.isCorrect){
      html+=&#x27;✓ 你的答案：&#x27;+&#x27;ABCD&#x27;[r.userAns]+&#x27; 正确&#x27;;
    }else{
      html+=&#x27;✗ 你的答案：&#x27;+(r.userAns!==undefined?&#x27;ABCD&#x27;[r.userAns]:&#x27;未作答&#x27;)+&#x27; | 正确答案：&#x27;+&#x27;ABCD&#x27;[r.correctAns];
      html+=&#x27;&lt;br&gt;&#x27;+r.q.explain;
    }
    html+=&#x27;&lt;/p&gt;&lt;/div&gt;&#x27;;
  });

  html+=&#x27;&lt;h3&gt;简答题参考&lt;/h3&gt;&#x27;;
  examState.sqIndices.forEach(function(origIdx,i){
    var q=shortQuestions[origIdx];
    html+=&#x27;&lt;div class=&quot;quiz-card&quot;&gt;&lt;div class=&quot;q-text&quot;&gt;&#x27;+q.q+&#x27;&lt;/div&gt;&#x27;;
    html+=&#x27;&lt;p style=&quot;font-size:0.85rem&quot;&gt;&lt;strong&gt;你的答案：&lt;/strong&gt;&#x27;+(examState.sqAnswers[i]||&#x27;未作答&#x27;)+&#x27;&lt;/p&gt;&#x27;;
    html+=&#x27;&lt;p style=&quot;font-size:0.85rem;color:var(--text2);margin-top:8px&quot;&gt;&lt;strong&gt;参考答案：&lt;/strong&gt;&#x27;+q.ref+&#x27;&lt;/p&gt;&lt;/div&gt;&#x27;;
  });

  html+=&#x27;&lt;/div&gt;&#x27;;
  resultDiv.innerHTML=html;

  document.getElementById(&#x27;examSubmitBtn&#x27;).style.display=&#x27;none&#x27;;
  document.getElementById(&#x27;examStartBtn&#x27;).style.display=&#x27;inline-block&#x27;;
  document.getElementById(&#x27;examTimer&#x27;).textContent=&#x27;15:00&#x27;;
  document.getElementById(&#x27;examTimer&#x27;).classList.remove(&#x27;warning&#x27;);
  examState=null;
}

// ===== TAB 5: REVIEW =====
function renderReview(){
  // Error book
  var ebDiv=document.getElementById(&#x27;errorBook&#x27;);
  if(errorBook.length===0){
    ebDiv.innerHTML=&#x27;&lt;p style=&quot;color:var(--text2);text-align:center;padding:20px&quot;&gt;暂无错题，继续保持！&lt;/p&gt;&#x27;;
  }else{
    var html=&#x27;&#x27;;
    var unique=new Map();
    errorBook.slice().reverse().forEach(function(e){
      var key=e.type+&#x27;-&#x27;+e.index;
      if(!unique.has(key)){
        unique.set(key,e);
        var q=e.type.includes(&#x27;mc&#x27;)?mcQuestions[e.index]:null;
        if(q){
          html+=&#x27;&lt;div class=&quot;quiz-card&quot;&gt;&lt;div class=&quot;q-text&quot;&gt;&#x27;+q.q+&#x27;&lt;/div&gt;&#x27;;
          html+=&#x27;&lt;p style=&quot;font-size:0.85rem;color:var(--accent)&quot;&gt;你的答案：&#x27;+(e.answer!==undefined?&#x27;ABCD&#x27;[e.answer]:&#x27;未作答&#x27;)+&#x27; | 正确答案：&#x27;+&#x27;ABCD&#x27;[q.ans]+&#x27;&lt;/p&gt;&#x27;;
          html+=&#x27;&lt;p style=&quot;font-size:0.85rem;color:var(--text2)&quot;&gt;&#x27;+q.explain+&#x27;&lt;/p&gt;&#x27;;
          html+=&#x27;&lt;button class=&quot;btn&quot; onclick=&quot;retryError(&#x27;+e.index+&#x27;)&quot;&gt;重新作答&lt;/button&gt;&lt;/div&gt;&#x27;;
        }
      }
    });
    ebDiv.innerHTML=html;
  }

  // Weakness analysis
  var wcDiv=document.getElementById(&#x27;weaknessChart&#x27;);
  var conceptErrors={};
  concepts.forEach(function(c){conceptErrors[c.name]=0});
  errorBook.forEach(function(e){
    var q=e.type.includes(&#x27;mc&#x27;)?mcQuestions[e.index]:null;
    if(q&amp;&amp;q.concept&amp;&amp;conceptErrors[q.concept]!==undefined)conceptErrors[q.concept]++;
  });
  var sorted=Object.entries(conceptErrors).filter(function(e){return e[1]&gt;0}).sort(function(a,b){return b[1]-a[1]});
  if(sorted.length===0){
    wcDiv.innerHTML=&#x27;&lt;p style=&quot;color:var(--text2);text-align:center;padding:20px&quot;&gt;各概念掌握良好，暂无薄弱点&lt;/p&gt;&#x27;;
  }else{
    var wh=&#x27;&#x27;;
    sorted.forEach(function(e){
      var max=sorted[0][1];
      var pct=Math.round(e[1]/max*100);
      wh+=&#x27;&lt;div class=&quot;progress-wrap&quot;&gt;&lt;div class=&quot;label&quot;&gt;&lt;span&gt;&#x27;+e[0]+&#x27;&lt;/span&gt;&lt;span&gt;&#x27;+e[1]+&#x27;题&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;progress-bar&quot;&gt;&lt;div class=&quot;progress-fill&quot; style=&quot;width:&#x27;+pct+&#x27;%;background:linear-gradient(90deg,#b8860b,var(--accent))&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&#x27;;
    });
    wcDiv.innerHTML=wh;
  }

  // Stats
  var totalAnswered=Object.keys(mcAnswers).length;
  var totalShort=Object.keys(shortAnswers).length;
  var correct=0;
  Object.keys(mcAnswers).forEach(function(k){
    if(mcAnswers[k]===mcQuestions[parseInt(k)].ans)correct++;
  });
  var accuracy=totalAnswered&gt;0?Math.round(correct/totalAnswered*100):0;
  var statsDiv=document.getElementById(&#x27;statsRow&#x27;);
  statsDiv.innerHTML=&#x27;&lt;div class=&quot;stat-box&quot;&gt;&lt;div class=&quot;num&quot;&gt;&#x27;+totalAnswered+&#x27;&lt;/div&gt;&lt;div class=&quot;tag&quot;&gt;选择题完成&lt;/div&gt;&lt;/div&gt;&#x27;;
  statsDiv.innerHTML+=&#x27;&lt;div class=&quot;stat-box&quot;&gt;&lt;div class=&quot;num&quot;&gt;&#x27;+accuracy+&#x27;%&lt;/div&gt;&lt;div class=&quot;tag&quot;&gt;选择题正确率&lt;/div&gt;&lt;/div&gt;&#x27;;
  statsDiv.innerHTML+=&#x27;&lt;div class=&quot;stat-box&quot;&gt;&lt;div class=&quot;num&quot;&gt;&#x27;+totalShort+&#x27;&lt;/div&gt;&lt;div class=&quot;tag&quot;&gt;简答题作答&lt;/div&gt;&lt;/div&gt;&#x27;;
  statsDiv.innerHTML+=&#x27;&lt;div class=&quot;stat-box&quot;&gt;&lt;div class=&quot;num&quot;&gt;&#x27;+errorBook.length+&#x27;&lt;/div&gt;&lt;div class=&quot;tag&quot;&gt;累计错题&lt;/div&gt;&lt;/div&gt;&#x27;;

// ===== TAB 7: SOCRATIC =====
function renderSocratic(){
  var items=[
    {
      q:&#x27;第1层：为什么聪明人也会犯低级投资错误？&#x27;,
      a:&#x27;因为人类大脑进化出&quot;快捷方式&quot;（系统1）来处理日常决策——省能量、速度快，但遇到复杂的投资问题时，系统1的直觉经常出错（框架效应、证实偏见等）。聪明不等于理性，理性是一种需要刻意练习的思维习惯。&#x27;,
      deeper:[
        {q:&#x27;第2层：那么如何训练&quot;理性思维习惯&quot;？&#x27;,a:&#x27;卡尼曼建议：①积累基础知识（数学、逻辑、常识）——CRT测试中MIT学生也犯错，因为缺乏基本数学常识；②主动寻找反例——像科学家一样&quot;假设-验证-修正&quot;而非&quot;假设-证实-停止&quot;；③在重要决策前强制停顿——给系统2一个介入的机会。&#x27;},
        {q:&#x27;第2层：既然理性这么&quot;反人性&quot;，我们真的能做到吗？&#x27;,a:&#x27;卡尼曼自己也承认理性思维&quot;有悖于人类习惯&quot;，但他认为通过刻意练习可以转化为思维习惯。类比：开车时看后视镜最初也很&quot;反人性&quot;，但经过训练就能自动执行。查理·芒格的&quot;人类误判心理学&quot;清单，就是理性思维的训练工具。&#x27;}
      ]
    },
    {
      q:&#x27;第1层：巴菲特为什么给后代推荐指数基金，而不是&quot;继续我的投资方法&quot;？&#x27;,
      a:&#x27;因为巴菲特深知投资是&quot;艺术&quot;而非&quot;技术&quot;——像肖邦的钢琴技艺，无法通过培训班生产。他自己能获得年均22%回报，但他清楚这种能力不可遗传。指数基金是&quot;技术&quot;——规则明确、可复制的方案，适合没有艺术天赋的普通人。&#x27;,
      deeper:[
        {q:&#x27;第2层：这是否意味着普通人永远无法成为优秀的投资者？&#x27;,a:&#x27;不是&quot;永远无法&quot;，而是&quot;不需要成为&quot;。投资的目的是实现财务目标，而非&quot;成为股神&quot;。普通人通过指数定投+长期坚持，完全可以获得8%-10%的年化回报，这足以实现养老自由（30年年投2万，8%回报→136万）。把精力花在提升自己的职业收入上，回报率远高于研究股票。&#x27;},
        {q:&#x27;第2层：但总有人能&quot;战胜市场&quot;啊？&#x27;,a:&#x27;是的，但比例极低（美国仅5%的散户跑赢指数），且你无法提前识别谁会是那5%。更重要的是，短期战胜市场的人中，&quot;运气&quot;成分远高于&quot;能力&quot;——连续15年跑赢标普500的比尔·米勒，在2008年金融危机中损失惨重。巴菲特自己也说：如果能少犯错误，伯克希尔规模将远超当前。&#x27;}
      ]
    },
    {
      q:&#x27;第1层：为什么&quot;时间&quot;比&quot;时机&quot;重要？&#x27;,
      a:&#x27;因为精准择时在数学上几乎不可能——你需要连续两次做对（低点买+高点卖）。假设每次判断的正确率是70%，两次都对的概率只有49%。而长期持有的策略只需要做对一个判断（&quot;经济长期向上&quot;），这个判断的历史正确率接近100%。&#x27;,
      deeper:[
        {q:&#x27;第2层：如果我在2007年A股6000点时买入呢？那岂不是被套十几年？&#x27;,a:&#x27;这就是为什么需要&quot;资产配置&quot;和&quot;定投&quot;而非&quot;一次性全仓买入&quot;。如果你在2007年开始每月定投，你的平均成本会远低于6000点——因为你在低点买入了更多份额。这正是定投的优势：不需要预测市场，你自动&quot;低点多买、高点少买&quot;。&#x27;},
        {q:&#x27;第2层：但我听说有人极精准地抄底逃顶？&#x27;,a:&#x27;幸存者偏差。你听到的是成功者的故事——失败者不会到处说。而且，即使同一个人在上一轮做到了，下一轮大概率做不到。凯恩斯说：&quot;市场保持非理性的时间，可能比你保持偿付能力的时间更长。&quot;即使你判断对了方向，时机不对也可能破产。&#x27;}
      ]
    },
    {
      q:&#x27;第1层：&quot;不做的智慧&quot;为什么比&quot;做什么&quot;更重要？&#x27;,

      deeper:[
        {q:&#x27;第2层：那为什么这么多人仍然选择&quot;做什么&quot;而非&quot;不做什么&quot;？&#x27;,a:&#x27;①FOMO（害怕错过）——看到别人赚钱比自己亏钱更难受；②过度自信——相信自己&quot;不一样&quot;；③行动偏差——人类倾向于&quot;做点什么&quot;而非&quot;什么都不做&quot;，尤其在压力下。巴菲特的智慧恰恰在于对抗这些本能：在别人贪婪时恐惧，在别人恐惧时贪婪——而这首先需要&quot;不做&quot;的纪律。&#x27;}
      ]
    }
  ];

  var list=document.getElementById(&#x27;socraticList&#x27;);
  items.forEach(function(item){
    var div=document.createElement(&#x27;div&#x27;);
    div.className=&#x27;socratic-item&#x27;;

    var qEl=document.createElement(&#x27;div&#x27;);
    qEl.className=&#x27;socratic-q&#x27;;
    qEl.textContent=item.q;

    var aEl=document.createElement(&#x27;div&#x27;);
    aEl.className=&#x27;socratic-a&#x27;;
    aEl.innerHTML=&#x27;&lt;p&gt;&#x27;+item.a+&#x27;&lt;/p&gt;&#x27;;

    if(item.deeper){
      item.deeper.forEach(function(d){
        aEl.innerHTML+=&#x27;&lt;div class=&quot;socratic-item&quot; style=&quot;margin-top:12px&quot;&gt;&lt;div class=&quot;socratic-q&quot; style=&quot;font-size:0.9rem&quot; onclick=&quot;var n=this.nextElementSibling;n.classList.toggle(\&#x27;open\&#x27;)&quot;&gt;&#x27;+d.q+&#x27;&lt;/div&gt;&lt;div class=&quot;socratic-a&quot;&gt;&#x27;+d.a+&#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;
      });
    }

    div.appendChild(qEl);
    div.appendChild(aEl);
    list.appendChild(div);
  });
}

    &lt;p&gt;①&lt;strong&gt;远离&quot;概念股&quot;&lt;/strong&gt;：中国市场大量公司存在&quot;概念炒作&quot;+&quot;利益共同体捧场&quot;模式，与安然类似；②&lt;strong&gt;现金流检验&lt;/strong&gt;：无论公司讲什么故事，先看现金流是否来自经营而非融资或卖资产；③&lt;strong&gt;指数化投资&lt;/strong&gt;：如果你无法像巴菲特一样深度研究公司（十年只研究少数股票），&lt;strong&gt;指数基金是你最好的选择&lt;/strong&gt;——它自动排除了安然这类被退市的公司。&lt;/p&gt;&lt;/div&gt;
  `;

    {
      title:&#x27;第2轮：你持有的股票跌了30%&#x27;,
      scenario:&#x27;你买入的一只蓝筹股从买入价跌了30%。你研究了公司的财报，发现：①营收仍在增长；②现金流正常来自经营；③行业前景没有根本变化。下跌原因是整个市场在调整。你怎么做？&#x27;,
      choices:[
        {text:&#x27;立即卖出止损——跌了30%还不够吗&#x27;,result:&#x27;这是&quot;损失厌恶&quot;的典型表现。如果公司基本面没有变化，股价下跌反而是&quot;打折促销&quot;的机会。巴菲特说：&quot;在别人恐惧时贪婪。&quot;但前提是你确认基本面没问题——这正是你做功课的意义。&#x27;,rating:&#x27;bad&#x27;,mks:&#x27;损失厌恶驱动→没有区分&quot;价格波动&quot;和&quot;价值变化&quot;→错失低成本买入机会&#x27;},
        {text:&#x27;什么都不做——继续持有等待回升&#x27;,result:&#x27;可以接受。如果你确认公司基本面没问题，市场调整是暂时的，那持有等待是合理的。但这没有充分利用市场给你的机会——如果这是你资产配置中的一部分，再平衡策略会建议你用债券/现金适当补仓。&#x27;,rating:&#x27;good&#x27;,mks:&#x27;长期持有→区分噪音和信号→但未充分把握市场低迷的机会&#x27;},
        {text:&#x27;按再平衡策略，用一部分债券/现金补仓该股票&#x27;,result:&#x27;最优选择。这正是巴菲特&quot;别人恐惧时我贪婪&quot;的具体操作。但前提是：①你之前做了资产配置（有债券/现金可用）；②你确认公司基本面没问题（在能力圈内）；③你控制补仓比例（不打破资产配置的股债比例）。&#x27;,rating:&#x27;best&#x27;,mks:&#x27;再平衡→基本面分析+情绪纪律→市场恐惧时你贪婪→低价增持优质资产&#x27;}
      ]
    },
    {
      title:&#x27;第3轮：一个朋友邀请你投资他的创业项目&#x27;,
      scenario:&#x27;你的大学同学辞职创业，项目是&quot;区块链+AI+共享经济&quot;平台。他说目前天使轮估值5000万，已经有三位知名投资人确认参与。他给你一周时间考虑，投资门槛20万。你怎么做？&#x27;,
      choices:[
        {text:&#x27;拒绝——我不懂区块链也不懂AI创业，超出了我的能力圈&#x27;,result:&#x27;巴菲特的答案。记住他的三大禁忌之首：&quot;不做自己不懂的事情&quot;。即使这个项目将来大获成功，也不代表你的决策错了——你只是拒绝了一个&quot;不理解的赌局&quot;。20万对你可能是大钱，但对天使投资人来说只是一笔小赌注——你们的处境不同。&#x27;,rating:&#x27;best&#x27;,mks:&#x27;能力圈→不懂不做→拒绝FOMO→保护本金&#x27;},
        {text:&#x27;看看其他投资人的背景，如果确实知名就投&#x27;,result:&#x27;有风险。塞让诺斯（Theranos）的站台阵容包括基辛格和马克·安德森——全明星阵容不等于项目靠谱（董事会无一人有技术背景）。&quot;跟风投资&quot;本质上是把决策权交给了别人，但亏损的责任仍在你。如果亏了20万，你无法去找基辛格要回来。&#x27;,rating:&#x27;bad&#x27;,mks:&#x27;对比效应→用&quot;名人光环&quot;替代&quot;独立判断&quot;→缺乏尽职调查&#x27;},
        {text:&#x27;深入了解项目商业模式，如果逻辑自洽就投&#x27;,result:&#x27;可以但需谨慎。风险投资的不确定性极高——即使商业模式&quot;逻辑自洽&quot;，90%以上的创业公司最终失败。你需要问自己几个问题：①20万占你总资产多大比例？（应不超过5%）②你能承受全部损失吗？③你能锁定至少7年不动用这笔钱吗？（风险投资流动性极差）如果不能全部回答Yes，建议不投。&#x27;,rating:&#x27;good&#x27;,mks:&#x27;尽职调查→评估风险承受力→清醒认识风险投资的高失败率&#x27;}
      ]
    }
  ];

  var container=document.getElementById(&#x27;decisionRounds&#x27;);
  rounds.forEach(function(r,i){
    var div=document.createElement(&#x27;div&#x27;);
    div.className=&#x27;decision-round&#x27;;
    div.innerHTML=&#x27;&lt;h3&gt;&#x27;+r.title+&#x27;&lt;/h3&gt;&lt;div class=&quot;scenario&quot;&gt;&#x27;+r.scenario+&#x27;&lt;/div&gt;&#x27;;
    r.choices.forEach(function(c,j){
      div.innerHTML+=&#x27;&lt;button class=&quot;choice-btn&quot; id=&quot;dec-&#x27;+i+&#x27;-btn-&#x27;+j+&#x27;&quot; onclick=&quot;decide(&#x27;+i+&#x27;,&#x27;+j+&#x27;)&quot;&gt;&#x27;+(j+1)+&#x27;. &#x27;+c.text+&#x27;&lt;/button&gt;&#x27;;
    });
    div.innerHTML+=&#x27;&lt;div class=&quot;result-box&quot; id=&quot;dec-&#x27;+i+&#x27;-result&quot;&gt;&lt;/div&gt;&#x27;;
    container.appendChild(div);
  });

  // Store rounds data
  window._decisionRounds=rounds;
}

function decide(roundIdx,choiceIdx){
  var r=window._decisionRounds[roundIdx];
  var c=r.choices[choiceIdx];
  var resultBox=document.getElementById(&#x27;dec-&#x27;+roundIdx+&#x27;-result&#x27;);
  var bg={best:&#x27;#e8f5e9&#x27;,good:&#x27;#fff8e0&#x27;,bad:&#x27;#fde8e8&#x27;};
  var border={best:&#x27;var(--success)&#x27;,good:&#x27;var(--accent2)&#x27;,bad:&#x27;var(--accent)&#x27;};
  resultBox.innerHTML=&#x27;&lt;strong&gt;&#x27;+(choiceIdx+1)+&#x27;. &#x27;+c.text+&#x27;&lt;/strong&gt;&lt;p style=&quot;margin-top:6px&quot;&gt;&#x27;+c.result+&#x27;&lt;/p&gt;&lt;p style=&quot;margin-top:4px;font-size:0.85rem;color:var(--accent)&quot;&gt;&lt;strong&gt;MKS分析：&lt;/strong&gt;&#x27;+c.mks+&#x27;&lt;/p&gt;&#x27;;
  resultBox.style.background=bg[c.rating];
  resultBox.style.border=&#x27;1px solid &#x27;+border[c.rating];
  resultBox.classList.add(&#x27;show&#x27;);

  // Disable buttons
  for(var j=0;j&lt;3;j++){
    document.getElementById(&#x27;dec-&#x27;+roundIdx+&#x27;-btn-&#x27;+j).disabled=true;
    document.getElementById(&#x27;dec-&#x27;+roundIdx+&#x27;-btn-&#x27;+j).style.opacity=j===choiceIdx?&#x27;1&#x27;:&#x27;0.5&#x27;;
  }
}

// ===== INIT =====
function init(){
  initTabs();
  renderDashboard();
  renderCard();
  renderQuestionBank();
  renderSocratic();
  renderCaseStudy();
  renderDecisions();
  switchTab(0);
}

document.addEventListener(&#x27;DOMContentLoaded&#x27;,init);
&lt;/script&gt;

&lt;h3&gt;核心目标&lt;/h3&gt;
&lt;p style=&quot;font-size:clamp(.95rem,2vw,1.05rem);line-height:1.8&quot;&gt;通过对比不同文明的国民特性、解读历史人物的成败得失、剖析全球化的深层逻辑，&lt;strong&gt;理解世界运行的底层规律&lt;/strong&gt;——为什么不同国家的人行为模式如此不同？农业文明与商业文明的DNA如何塑造了今天的冲突？个人如何在全球化浪潮中找准自己的位置？&lt;/p&gt;

&lt;h3&gt;边界知识表（15条 · 知道存在即可）&lt;/h3&gt;
&lt;div style=&quot;overflow-x:auto&quot;&gt;
&lt;table class=&quot;boundary-table&quot;&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;知识点&lt;/th&gt;&lt;th&gt;使用场景&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;

const concepts = [
  {id:&#x27;c1&#x27;,name:&#x27;国民特性&#x27;,def:&#x27;不同国家/民族在长期历史中形成的稳定的集体行为模式与价值取向，是理解国际交往、商业合作、文化冲突的第一把钥匙。&#x27;,analogy:&#x27;如同不同操作系统（Windows/Mac/Linux）——表面功能相似，底层逻辑截然不同。做跨国生意如同在多种操作系统间做兼容开发。&#x27;,example:&#x27;德国人&quot;生活是具体的&quot;：做菜用量杯量勺；日本人&quot;宁可慢不能停&quot;：工程师Miso做项目实验穷尽所有组合；美国人&quot;爱管闲事&quot;：邻居噪音报警。&#x27;,counter:&#x27;误以为产品好=人品好。瑞士产品精良但瑞士人排外、规则至上；德国产品好且德国人开放包容。不能从产品推断国民性。&#x27;},
  {id:&#x27;c2&#x27;,name:&#x27;农业文明 vs 商业文明&#x27;,def:&#x27;世界文明的两大主线。农业文明源于古埃及/古印度/古中国，强调自给自足、中央集权、土地情结；商业文明源于美索不达米亚/古希腊，强调贸易交换、契约精神、地方自治。&#x27;,analogy:&#x27;如同两个操作系统——农业文明是&quot;单机版&quot;，自给自足、垂直整合；商业文明是&quot;联网版&quot;，依赖交换、规则、品牌。从单机切到联网需要重装整个思维系统。&#x27;,example:&#x27;贾府庄园自产自用（农业文明）；荷兰东印度公司全球贸易靠契约（商业文明）。中国公司倾向垂直整合&quot;什么都自己做&quot;，美国公司专注单一领域深耕。&#x27;,counter:&#x27;工业革命后商业文明占优，但农业文明在历史上长期领先，两者各有适用场景。日本是商业文明外壳+农业文明内核的混合体。&#x27;},
  {id:&#x27;c3&#x27;,name:&#x27;全球化此消彼长&#x27;,def:&#x27;全球化表面上共赢，实质是全球GDP份额的零和博弈。新兴国家崛起必然导致原有强国份额下降。理解这一点才能看懂贸易摩擦、产业转移、欧洲衰落的底层逻辑。&#x27;,analogy:&#x27;如同一个大池子里的水，总量固定，有人多舀一瓢就有人少一瓢。欧美中产阶级的失落不是中国人&quot;偷走&quot;了工作，而是全球产业链重构的必然结果。&#x27;,example:&#x27;中国对美出口从服装玩具升级为机电产品和IT产品；韩国汽车从被嘲笑到超越美国三大；经互会因强制分工失败证明人为安排不可持续。&#x27;,counter:&#x27;全球化不是纯零和——技术革命可以做大蛋糕。但短期（人的生命周期内）此消彼长效应占主导，不能指望&quot;最终会好&quot;来回避现实阵痛。&#x27;},
  {id:&#x27;c4&#x27;,name:&#x27;制度塑造行为&#x27;,def:&#x27;人的行为习惯主要由制度环境塑造，而非先天民族性格。同一民族在不同制度下表现截然不同，改变制度才能改变行为。&#x27;,analogy:&#x27;如同不同土壤长出不同植物——意大利人不是天生懒散，而是&quot;勤劳无奖赏、懒惰无惩罚&quot;的制度设计导致了行为选择；日本人的&quot;残忍&quot;是禅宗被改造后的文化结果。&#x27;,example:&#x27;意大利人日常懒散但足球防守滴水不漏——因为足球表现与金钱回报直接挂钩；罗马兵团曾以纪律严明著称，说明制度变量＞人性常量。&#x27;,counter:&#x27;制度不是万能的——印度&quot;修心不修身&quot;的文化价值观延续数千年，说明深层文化基因难以被短期制度改变。&#x27;},
  {id:&#x27;c5&#x27;,name:&#x27;文化基因&#x27;,def:&#x27;一个文明的底层代码——包括宗教、语言、历史记忆、价值排序——如同操作系统的内核，决定了上层应用（制度、行为、经济）的可能性边界。&#x27;,analogy:&#x27;如同一个人的&quot;出厂设置&quot;——犹太人的商业基因源于千年流散史；日本的&quot;报恩文化&quot;源于封闭岛国的互惠生存逻辑；印度的&quot;修心不修身&quot;源于婆罗门教的终极关怀。&#x27;,example:&#x27;德国人通过瓦格纳歌剧形成英雄情结→促成国家统一→但为纳粹崛起埋下思想根源；美国的&quot;反国王&quot;传统源于五月花号移民对权力的天然警惕。&#x27;,counter:&#x27;文化基因不是宿命论——美籍日裔在美国环境中成长为完全不同的行事风格，说明环境可以覆盖基因表达。&#x27;},
  {id:&#x27;c6&#x27;,name:&#x27;勇气与见识&#x27;,def:&#x27;见识决定选择空间的上限，勇气决定能否将见识转化为行动。庄子&quot;井蛙不可语海&quot;说见识局限，班超&quot;不入虎穴焉得虎子&quot;说勇气的力量。&#x27;,analogy:&#x27;见识如同地图——地图上没有标注的地方，你再努力也走不到；勇气如同引擎——有地图但不敢出发，等于没有地图。ChatGPT不会给你勇气和见识，它只是更精确的地图。&#x27;,example:&#x27;班超以36人横行西域50余国，低成本高成效；谢道韫城破时持刀杀贼保护外孙；苏轼&quot;天下有大勇者，卒然临之而不惊&quot;。&#x27;,counter:&#x27;勇气不等于鲁莽——郭嘉有识人之明但不具备曹操的实干勇气；领袖需要&quot;脑和手&quot;兼具。&#x27;},
  {id:&#x27;c7&#x27;,name:&#x27;利益与人性&#x27;,def:&#x27;利益是理解人类行为最可靠的钥匙。小人以短期小利损害长远根本利益；全球化中各国以自身利益最大化行动；理解利益格局才能穿透道德话语看到真相。&#x27;,analogy:&#x27;如同物理学的&quot;最小作用量原理&quot;——人的行为轨迹沿着利益最小阻力路径前行。道德是表面涂层，利益是底层引力。不是人坏，是引力定律使然。&#x27;,example:&#x27;孟尝君罢相后门客离散——&quot;富贵多士，贫贱寡友&quot;是利益规律不是道德问题；美国人不为交情损害自身利益——帮人前计算成本收益。&#x27;,counter:&#x27;只看利益会沦为冷血——圣方济各放弃家财服务穷人，不以自身利益计算；庄子&quot;逍遥游&quot;追求的恰是超越利益的绝对精神自由。&#x27;},
  {id:&#x27;c8&#x27;,name:&#x27;文明对话&#x27;,def:&#x27;通过比较不同文明的思维方式和行为模式，突破自身文明的无意识牢笼，建立&quot;元认知&quot;——意识到自己的文明也是一种&quot;地方性知识&quot;。&#x27;,analogy:&#x27;如同鱼最后才知道水的存在——你在农耕文明中长大，以为&quot;关系&quot;&quot;面子&quot;&quot;权威&quot;是天经地义的，直到看见商业文明中&quot;就事论事&quot;&quot;对事不对人&quot;的运作方式。&#x27;,example:&#x27;中国人&quot;讨说法&quot;vs美国人&quot;法庭见&quot;——都是解决冲突，但一个是道德逻辑一个是法律逻辑；法国人限购奢侈品不是歧视中国人，而是平等逻辑下维持中产消费。&#x27;,counter:&#x27;文明对话不是文明优劣——农业文明的&quot;人情温度&quot;恰好是商业文明所缺失的。最高境界是&quot;出入自如&quot;，而非厚此薄彼。&#x27;},
  {id:&#x27;c9&#x27;,name:&#x27;幸福的多维本质&#x27;,def:&#x27;幸福≠物质丰富。吴军提出幸福的三维度：爱情和婚姻、对未来的期望、生活的态度（从容与优雅）。18世纪的贵族物质远不如现代人，但可能更幸福。&#x27;,analogy:&#x27;如同手机参数——RAM和CPU（物质）很重要，但系统流畅度（幸福感）更取决于软件优化（婚姻质量、未来预期、生活态度）。参数拉满但系统卡顿的手机没人想要。&#x27;,example:&#x27;日本男人表面受妻子温柔照顾，实际工资全交、零花钱极少、晚年可能被离婚扫地出门；意大利经济一团糟但国民天性是欧洲最乐观的。&#x27;,counter:&#x27;物质是基础层——极度贫困下谈&quot;优雅从容&quot;是站着说话不腰疼。约翰·亚当斯说第一代解决生存，到第三代才追求艺术。&#x27;},
  {id:&#x27;c10&#x27;,name:&#x27;具体性思维&#x27;,def:&#x27;德国人&quot;生活是具体的&quot;——拒绝抽象空谈，一切评价和决策基于可量化、可比较的具体事实。这是德国制造质量、社会治理有效性的方法论根基。&#x27;,analogy:&#x27;如同做菜——中餐&quot;凭手感&quot;（少许盐、适量油），德国厨房&quot;凭量杯&quot;（盐3克、油15毫升）。前者依赖经验直觉，后者依赖标准流程。两种方式在各自领域都有优势，但可复制性和稳定性差异巨大。&#x27;,example:&#x27;徕卡镜头刻度线宽度有明确规范；德国论文呈现全流程中间结果而非仅结论；政策推行前公示具体数据让公众决策；日本代工德国镜头合格率仅20%+。&#x27;,counter:&#x27;具体性可能扼杀灵感和艺术——庄子&quot;无用之用&quot;、黛玉&quot;作诗的性格&quot;都是对过度功利的必要平衡。&quot;具体&quot;是工具不是目的。&#x27;},
];

function setCard(idx){
  currentCardIdx=idx;
  cardFlipped=false;
  const c=concepts[idx];
  document.getElementById(&#x27;flipFront&#x27;).innerHTML=`&lt;h3 style=&quot;font-size:clamp(1.1rem,2.5vw,1.5rem);color:var(--accent)&quot;&gt;${c.name}&lt;/h3&gt;&lt;p style=&quot;color:var(--text-light);margin-top:8px;font-size:clamp(.85rem,1.8vw,.95rem)&quot;&gt;点击翻转卡片查看详情&lt;/p&gt;${learnedCards.includes(c.id)?&#x27;&lt;span class=&quot;tag&quot; style=&quot;margin-top:8px&quot;&gt;✓ 已学习&lt;/span&gt;&#x27;:&#x27;&#x27;}`;
  document.getElementById(&#x27;flipBack&#x27;).innerHTML=`&lt;div style=&quot;margin-bottom:6px&quot;&gt;&lt;strong style=&quot;color:var(--accent)&quot;&gt;定义：&lt;/strong&gt;${c.def}&lt;/div&gt;&lt;div style=&quot;margin-bottom:6px&quot;&gt;&lt;strong style=&quot;color:var(--accent)&quot;&gt;类比（商业场景）：&lt;/strong&gt;${c.analogy}&lt;/div&gt;&lt;div style=&quot;margin-bottom:6px&quot;&gt;&lt;strong style=&quot;color:var(--success)&quot;&gt;示例：&lt;/strong&gt;${c.example}&lt;/div&gt;&lt;div&gt;&lt;strong style=&quot;color:var(--accent)&quot;&gt;反例/边界：&lt;/strong&gt;${c.counter}&lt;/div&gt;`;
  document.getElementById(&#x27;flipInner&#x27;).classList.remove(&#x27;flipped&#x27;);
  document.getElementById(&#x27;cardIndex&#x27;).textContent=`${idx+1} / ${concepts.length}`;
  document.getElementById(&#x27;markLearnedBtn&#x27;).textContent=learnedCards.includes(c.id)?&#x27;✓ 已学习&#x27;:&#x27;✓ 标记已学习&#x27;;
}
setCard(0);

function prevCard(){if(currentCardIdx&gt;0)setCard(currentCardIdx-1)}
function nextCard(){if(currentCardIdx&lt;concepts.length-1)setCard(currentCardIdx+1)}
function markLearned(){
  const id=concepts[currentCardIdx].id;
  if(learnedCards.includes(id)){learnedCards=learnedCards.filter(x=&gt;x!==id)}else{learnedCards.push(id)}
  save();updateProgress();setCard(currentCardIdx);
}

// ===== TAB 2: QUIZ =====
function renderChoiceQuiz(){
  const div=document.getElementById(&#x27;choiceQuiz&#x27;);
  div.innerHTML=choiceQuestions.map((q,i)=&gt;{
    const answered=quizAnswered.includes(i);
    const correct=q.a;
    let opts=q.o.map((o,j)=&gt;{
      let cls=&#x27;quiz-option&#x27;;
      if(answered){
        if(j===correct)cls+=&#x27; correct&#x27;;
        else cls+=&#x27; wrong&#x27;;
      }
      return `&lt;div class=&quot;${cls}&quot; onclick=&quot;${answered?&#x27;&#x27;:&#x27;answerChoice(&#x27;+i+&#x27;,&#x27;+j+&#x27;,this)&#x27;}&quot;&gt;${&#x27;ABCD&#x27;[j]}. ${o}${answered&amp;&amp;j===correct?&#x27; ✓&#x27;:&#x27;&#x27;}&lt;/div&gt;`;
    }).join(&#x27;&#x27;);
    return `&lt;div style=&quot;margin-bottom:14px&quot;&gt;&lt;strong style=&quot;color:var(--accent)&quot;&gt;${i+1}. ${q.q}&lt;/strong&gt;${opts}&lt;/div&gt;`;
  }).join(&#x27;&#x27;);
}
renderChoiceQuiz();

function answerChoice(qIdx,choice,el){
  if(quizAnswered.includes(qIdx))return;
  const correct=choiceQuestions[qIdx].a;
  quizAnswered.push(qIdx);
  if(choice!==correct){
    wrongAnswers.push({type:&#x27;choice&#x27;,idx:qIdx,question:choiceQuestions[qIdx].q,userAnswer:choiceQuestions[qIdx].o[choice],correctAnswer:choiceQuestions[qIdx].o[correct]});
  }
  save();
  // re-render this question
  renderChoiceQuiz();
}

function renderShortQuiz(){
  const div=document.getElementById(&#x27;shortQuiz&#x27;);
  div.innerHTML=shortQuestions.map((q,i)=&gt;{
    const revealed=shortRevealed.includes(i);
    return `&lt;div style=&quot;margin-bottom:12px;border-bottom:1px solid var(--border);padding-bottom:10px&quot;&gt;
      &lt;strong style=&quot;color:var(--accent)&quot;&gt;${i+1}. ${q.q}&lt;/strong&gt;
      ${revealed?`&lt;div style=&quot;margin-top:6px;padding:10px;background:#fef9f2;border-radius:6px;color:var(--text-light);font-size:.88rem&quot;&gt;${q.a}&lt;/div&gt;`:`&lt;button class=&quot;btn btn-outline btn-sm&quot; style=&quot;margin-top:6px&quot; onclick=&quot;revealShort(${i})&quot;&gt;查看参考思路&lt;/button&gt;`}
    &lt;/div&gt;`;
  }).join(&#x27;&#x27;);
}
renderShortQuiz();

function revealShort(i){if(!shortRevealed.includes(i)){shortRevealed.push(i);save();renderShortQuiz()}}

// ===== TAB 3: EXAM MODE =====
function startExam(){
  if(examActive)return;
  examActive=true;
  examSeconds=15*60;
  document.getElementById(&#x27;startExamBtn&#x27;).style.display=&#x27;none&#x27;;
  document.getElementById(&#x27;examResult&#x27;).style.display=&#x27;none&#x27;;
  // Select random questions: 7 choice + 3 short
  let cIdx=[],sIdx=[];
  while(cIdx.length&lt;7){let r=Math.floor(Math.random()*choiceQuestions.length);if(!cIdx.includes(r))cIdx.push(r)}
  while(sIdx.length&lt;3){let r=Math.floor(Math.random()*shortQuestions.length);if(!sIdx.includes(r))sIdx.push(r)}
  examQuestions={choice:cIdx,short:sIdx};
  examAnswers=new Array(7).fill(-1);
  renderExam();
  document.getElementById(&#x27;examArea&#x27;).style.display=&#x27;block&#x27;;
  examInterval=setInterval(updateTimer,1000);
}

function updateTimer(){
  examSeconds--;
  const m=Math.floor(examSeconds/60),s=examSeconds%60;
  document.getElementById(&#x27;examTimer&#x27;).textContent=m+&#x27;:&#x27;+(s&lt;10?&#x27;0&#x27;:&#x27;&#x27;)+s;
  if(examSeconds&lt;=0){submitExam()}
}

function renderExam(){
  const div=document.getElementById(&#x27;examArea&#x27;);
  let html=&#x27;&#x27;;
  examQuestions.choice.forEach((idx,i)=&gt;{
    const q=choiceQuestions[idx];
    let opts=q.o.map((o,j)=&gt;`&lt;div class=&quot;quiz-option&quot; onclick=&quot;selectExam(${i},${j})&quot; id=&quot;examOpt${i}_${j}&quot;&gt;${&#x27;ABCD&#x27;[j]}. ${o}&lt;/div&gt;`).join(&#x27;&#x27;);
    html+=`&lt;div style=&quot;margin-bottom:14px;text-align:left&quot;&gt;&lt;strong style=&quot;color:var(--accent)&quot;&gt;${i+1}. ${q.q}&lt;/strong&gt;${opts}&lt;/div&gt;`;
  });
  examQuestions.short.forEach((idx,i)=&gt;{
    html+=`&lt;div style=&quot;margin-bottom:14px;text-align:left&quot;&gt;&lt;strong style=&quot;color:var(--accent)&quot;&gt;${i+8}. ${shortQuestions[idx].q}&lt;/strong&gt;&lt;p style=&quot;color:var(--text-light);font-size:.82rem;margin-top:4px&quot;&gt;（简答题，请在心中作答后点击&quot;提交&quot;查看参考思路）&lt;/p&gt;&lt;/div&gt;`;
  });
  html+=`&lt;button class=&quot;btn btn-primary&quot; onclick=&quot;submitExam()&quot;&gt;提交答卷&lt;/button&gt;`;
  div.innerHTML=html;
}

function selectExam(i,j){
  examAnswers[i]=j;
  for(let k=0;k&lt;4;k++){const el=document.getElementById(&#x27;examOpt&#x27;+i+&#x27;_&#x27;+k);if(el){el.classList.remove(&#x27;selected&#x27;);if(k===j)el.classList.add(&#x27;selected&#x27;)}}
}

function submitExam(){
  clearInterval(examInterval);
  examActive=false;
  document.getElementById(&#x27;examTimer&#x27;).textContent=&#x27;00:00&#x27;;
  let score=0;
  let detail=&#x27;&#x27;;
  examQuestions.choice.forEach((idx,i)=&gt;{
    const q=choiceQuestions[idx];
    const user=examAnswers[i];
    const correct=q.a;
    const isCorrect=user===correct;
    if(isCorrect)score++;
    else{wrongAnswers.push({type:&#x27;exam&#x27;,idx,question:q.q,userAnswer:user&gt;=0?q.o[user]:&#x27;未作答&#x27;,correctAnswer:q.o[correct]})}
    detail+=`&lt;div style=&quot;margin:6px 0;padding:8px;border-radius:6px;background:${isCorrect?&#x27;#eafaf1&#x27;:&#x27;#fdecea&#x27;}&quot;&gt;&lt;strong&gt;${i+1}. ${q.q}&lt;/strong&gt;&lt;br&gt;你的答案：${user&gt;=0?q.o[user]:&#x27;未作答&#x27;} ${isCorrect?&#x27;✓&#x27;:&#x27;✗&#x27;}&lt;br&gt;正确答案：${q.o[correct]}&lt;/div&gt;`;
  });
  examQuestions.short.forEach((idx,i)=&gt;{
    const q=shortQuestions[idx];
    detail+=`&lt;div style=&quot;margin:6px 0;padding:8px;border-radius:6px;background:#fef9f2&quot;&gt;&lt;strong&gt;${i+8}. ${q.q}&lt;/strong&gt;&lt;br&gt;${q.a}&lt;/div&gt;`;
  });
  save();
  const pct=Math.round(score/7*100);
  document.getElementById(&#x27;examResult&#x27;).style.display=&#x27;block&#x27;;
  document.getElementById(&#x27;examResult&#x27;).innerHTML=`&lt;h3 style=&quot;color:${pct&gt;=70?&#x27;var(--success)&#x27;:&#x27;var(--accent)&#x27;}&quot;&gt;得分：${score}/7（${pct}%）&lt;/h3&gt;${detail}&lt;button class=&quot;btn btn-outline&quot; onclick=&quot;document.getElementById(&#x27;startExamBtn&#x27;).style.display=&#x27;inline-block&#x27;;document.getElementById(&#x27;examResult&#x27;).style.display=&#x27;none&#x27;;document.getElementById(&#x27;examArea&#x27;).style.display=&#x27;none&#x27;;document.getElementById(&#x27;examTimer&#x27;).textContent=&#x27;15:00&#x27;&quot;&gt;重新考试&lt;/button&gt;`;
  document.getElementById(&#x27;examArea&#x27;).style.display=&#x27;none&#x27;;
}

// ===== TAB 4: REVIEW =====
function renderReview(){
  const totalQ=quizAnswered.length;
  const correctQ=quizAnswered.length-wrongAnswers.filter(w=&gt;w.type===&#x27;choice&#x27;).length;
  const pct=totalQ&gt;0?Math.round(correctQ/totalQ*100):0;
  const days=Math.max(1,Math.ceil((Date.now()-new Date(&#x27;2026-05-01&#x27;).getTime())/86400000));
  document.getElementById(&#x27;statsGrid&#x27;).innerHTML=`
    &lt;div class=&quot;card stat-item&quot;&gt;&lt;div class=&quot;stat-value&quot;&gt;${totalQ}&lt;/div&gt;&lt;div class=&quot;stat-label&quot;&gt;总答题数&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card stat-item&quot;&gt;&lt;div class=&quot;stat-value&quot;&gt;${pct}%&lt;/div&gt;&lt;div class=&quot;stat-label&quot;&gt;正确率&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card stat-item&quot;&gt;&lt;div class=&quot;stat-value&quot;&gt;${days}&lt;/div&gt;&lt;div class=&quot;stat-label&quot;&gt;学习天数&lt;/div&gt;&lt;/div&gt;
  `;
  const wb=document.getElementById(&#x27;wrongBook&#x27;);
  if(wrongAnswers.length===0){wb.innerHTML=&#x27;&lt;p style=&quot;color:var(--success)&quot;&gt;暂无错题，继续保持！&lt;/p&gt;&#x27;;}
  else{wb.innerHTML=wrongAnswers.map((w,i)=&gt;`&lt;div style=&quot;margin:8px 0;padding:10px;border-left:3px solid var(--accent);background:#fef9f2;border-radius:0 6px 6px 0&quot;&gt;&lt;strong&gt;${w.question}&lt;/strong&gt;&lt;br&gt;&lt;span style=&quot;color:var(--accent)&quot;&gt;你的答案：${w.userAnswer}&lt;/span&gt;&lt;br&gt;&lt;span style=&quot;color:var(--success)&quot;&gt;正确答案：${w.correctAnswer}&lt;/span&gt;&lt;/div&gt;`).join(&#x27;&#x27;);}
  // Weak concepts
  const conceptMap={};
  wrongAnswers.forEach(w=&gt;{
    let qIdx=w.idx;
    if(choiceQuestions[qIdx]){
      const topic=choiceQuestions[qIdx].q.slice(0,8);
      conceptMap[topic]=conceptMap[topic]||{topic,count:0,questions:[]};
      conceptMap[topic].count++;
      conceptMap[topic].questions.push(w.question);
    }
  });
  const sorted=Object.values(conceptMap).sort((a,b)=&gt;b.count-a.count);
  document.getElementById(&#x27;weakConcepts&#x27;).innerHTML=sorted.length&gt;0?sorted.map(c=&gt;`&lt;div style=&quot;margin:4px 0;padding:8px;background:#fff5f0;border-radius:6px&quot;&gt;&lt;strong&gt;错${c.count}题：&lt;/strong&gt;${c.questions[0].slice(0,40)}...&lt;/div&gt;`).join(&#x27;&#x27;):&#x27;&lt;p style=&quot;color:var(--success)&quot;&gt;暂无薄弱概念&lt;/p&gt;&#x27;;
}

function buildTree(nodes){
  return nodes.map(n=&gt;{
    if(n.leaf)return `&lt;div class=&quot;tree-leaf&quot;&gt;${n.label}&lt;/div&gt;`;

  }).join(&#x27;&#x27;);
}

// ===== TAB 6: SOCRATIC DIALOGUE =====
function renderSocratic(){
  const data=[
    {q:&#x27;为什么说&quot;农业文明vs商业文明&quot;是理解一切差异的根密钥？&#x27;,a:&#x27;因为一个国家的外交风格、企业管理模式、个人行为习惯，表面千差万别，深层都可追溯到其文明起源路径。农业文明需要集权修水利→形成等级制和权威崇拜；商业文明需要跨海贸易→形成契约和平等协商。当农业文明的中国企业出海并购商业文明的欧美公司时，冲突不在管理技术层面，而在文明DNA层面。&#x27;,sub:[
      {q:&#x27;那日本呢？它明明是岛国，为什么有那么多农业文明特征？&#x27;,a:&#x27;日本虽然是海岛，但是农业立国（稻作文明），且长期锁国。它的商业精神是明治维新后嫁接上去的，底层依然是&quot;村社会&quot;逻辑：重面子、讲等级、怕失败。这正是&quot;文化基因&quot;概念的价值——表面的制度可以快速改变，深层的集体无意识需要几代人。&#x27;},
      {q:&#x27;当代互联网公司算不算&quot;商业文明&quot;？&#x27;,a:&#x27;算，而且是最彻底的形式——产品面向全球市场、依赖品牌和用户信任、通过契约（用户协议）和法律解决纠纷。但中国互联网公司仍有农业文明残余：倾向垂直整合（什么都自己做）、偏好独家控制而非开放生态、组织内部仍有强烈的&quot;老板文化&quot;。&#x27;}
    ]},
    {q:&#x27;&quot;制度塑造行为&quot;的反面——文化会不会反过来锁死制度？&#x27;,a:&#x27;这正是印度的案例。印度独立后建立了民主制度，照搬英国议会制，但婆罗门&quot;修心不修身&quot;的文化基因延续三千年，导致体育投入意愿为零、种姓制度名义废除实际仍在运行。文化是&quot;慢变量&quot;，制度是&quot;快变量&quot;。快变量可以改，但若慢变量不动，快变量会被慢慢拉回原来的轨道。&#x27;,sub:[
      {q:&#x27;那中国改革开放算不算&quot;慢变量被快变量改变&quot;？&#x27;,a:&#x27;正是。四十年市场经济实践，已经让至少两代中国人的行为模式从&quot;等分配&quot;变为&quot;自己争&quot;——这就是制度改变文化的证据。但有些深层的东西很难改：对权威的依赖、对关系的迷信、对&quot;面子&quot;的执着。这是&quot;一代人多一点&quot;vs&quot;三千年积淀&quot;的角力。&#x27;}
    ]},
    {q:&#x27;王莽的理想如果放在今天，会不会成功？&#x27;,a:&#x27;不会。因为王莽的核心问题不是&quot;时代局限&quot;，而是人性规律——强制重新分配他人的财富永远会遭到抵抗，不管用什么制度包装。北欧高福利不是因为&quot;平均主义理想&quot;，而是因为人均资源丰富+高度信任+小国寡民。忽略约束条件的&quot;好心&quot;，本质上是一种智力懒惰。&#x27;,sub:[

    ]},
    {q:&#x27;勇气和见识哪个更重要？&#x27;,a:&#x27;见识是&quot;知道往哪走&quot;，勇气是&quot;敢走&quot;。没有见识的勇气是蛮干，没有勇气的见识是纸上谈兵。班超有见识（知道西域各国的利益格局）也有勇气（36人就敢夜袭匈奴使团）；郭嘉有见识（精准识人知事）但缺乏领袖型的实干勇气。所以郭嘉是顶级谋臣，曹操才是领袖。在今天的职场——大多数人缺的不是见识（信息时代见识容易获得），而是把认知转化为行动的勇气。&#x27;}
  ];

}

  const scenarios=[
    {s:&#x27;你是一家中国公司的海外业务负责人，即将首次与日本客户谈判。对方团队提前两周发来详细议程和问题清单。你应该？&#x27;,opts:[
      {text:&#x27;按中国习惯：先用饭局拉近关系，再谈正事&#x27;,result:&#x27;日本人在商务中极度重视&quot;面子&quot;——讨价还价需在酒桌私下进行，而非正式场合。你的做法可能被理解为&quot;不尊重议程&quot;。更好的做法是：严格按议程推进，会后再安排非正式交流。&#x27;,mks:&#x27;国民特性·日本人：好面子/报恩文化。日本商务中&quot;公私分明&quot;程度甚至高于美国——正式场合只谈公事。&#x27;},
      {text:&#x27;严格按对方发来的议程逐项推进，展现专业度&#x27;,result:&#x27;这是正确选择。日本人&quot;宁可慢但不能停&quot;，他们花大量时间准备是因为要对每个细节负责。你展现出的对流程的尊重，本身就是建立信任的第一步。&#x27;,mks:&#x27;国民特性·日本人：不能容忍局部失败。在日本人看来，&quot;准备充分&quot;本身就是诚意。&#x27;},
      {text:&#x27;建议取消议程，改为工厂参观+自由交流&#x27;,result:&#x27;这会让对方感到被冒犯——他们已经花了数周准备，你直接推翻意味着&quot;你们的工作没有价值&quot;。日本人会因为&quot;失面子&quot;而在后续合作中处处设防。&#x27;,mks:&#x27;国民特性·日本人：极好面子。否定对方的前期投入等于否定对方本人。&#x27;}
    ]},
    {s:&#x27;你在德国公司工作，老板让你做一个项目评估报告。你应该怎么呈现？&#x27;,opts:[
      {text:&#x27;写一份简洁的Executive Summary，结论先行，细节放附录&#x27;,result:&#x27;这在德国公司会让人觉得&quot;不踏实&quot;。德国人的核心思维是&quot;生活是具体的&quot;——没有数据和过程的结论是不可信的。&#x27;,mks:&#x27;德国具体性思维：论文要呈现全流程中间结果，做菜要精确称量。&#x27;},
      {text:&#x27;呈现全流程数据、中间结果、比较分析、量化指标，最后得出结论&#x27;,result:&#x27;这是德国人认可的方式。即使内容较长，只要逻辑严密、数据充分，他们会认为你&quot;做足了功课&quot;。在德国公司，冗长不是缺点，不精确才是。&#x27;,mks:&#x27;德国具体性思维+制度塑造行为：德国质量管理体系要求可追溯、可复现。&#x27;},
      {text:&#x27;做一份精美的PPT，多用图表和视觉元素&#x27;,result:&#x27;图表是加分项，但不能替代数据。如果图表背后没有扎实的数据支撑，德国人会礼貌地说&quot;有趣的呈现&quot;，但心里已经打了差评。&#x27;,mks:&#x27;德国具体性思维：形式永远在内容之后。&quot;差不多&quot;在德国行不通。&#x27;}
    ]},
    {s:&#x27;你的创业团队有两位核心成员产生严重分歧：A认为应该专注单一产品做到极致，B主张多元化快速扩张分担风险。你应该？&#x27;,opts:[
      {text:&#x27;学习美国模式——专注单一领域深耕，拒绝多元化&#x27;,result:&#x27;美国反垄断传统的底层逻辑是&quot;专注&quot;。但你的具体行业和市场阶段可能不同。美国企业不是不想多元化，而是法律和资本市场不允许——这恰好是商业文明的&quot;规则约束&quot;优势。&#x27;,mks:&#x27;美国&quot;反国王&quot;传统+商业文明逻辑：规则限制了多元化冲动，迫使企业成为细分领域全球冠军。&#x27;},
      {text:&#x27;分析你的行业处于哪个阶段：成长期（聚焦）还是成熟期（多元），再做判断&#x27;,result:&#x27;这才是正确的思考框架。没有放之四海皆准的战略，只有匹配具体条件的策略。郭嘉之所以是顶级谋臣，正是因为他从来不套模板，而是具体分析每个人、每件事。&#x27;,mks:&#x27;郭嘉的识人知事+具体性思维：战略判断的本质是信息处理质量，不是模板套用。&#x27;},
      {text:&#x27;学习亚洲企业模式——垂直整合，打造生态闭环&#x27;,result:&#x27;农业文明的&quot;自给自足&quot;思维会驱动你什么都想做——就像贾府的庄园什么都自己生产。但当代互联网的生态闭环和贾府庄园有本质区别：前者建立在开放协议和用户规模之上，后者是封闭的。&#x27;,mks:&#x27;农业文明的自给自足vs商业文明的生态协作：闭环不等于封闭。&#x27;}
    ]}
  ];
  document.getElementById(&#x27;decisionSim&#x27;).innerHTML=scenarios.map((sc,i)=&gt;`
    &lt;div class=&quot;decision-scenario&quot;&gt;
      &lt;strong&gt;第${i+1}轮：&lt;/strong&gt;${sc.s}
      &lt;div class=&quot;decision-options&quot;&gt;${sc.opts.map((o,j)=&gt;`&lt;div class=&quot;decision-opt&quot; onclick=&quot;showDecision(${i},${j})&quot;&gt;${&#x27;ABC&#x27;[j]}. ${o.text.slice(0,60)}...&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;
      &lt;div class=&quot;decision-result&quot; id=&quot;decisionResult${i}&quot;&gt;
        &lt;div style=&quot;margin-bottom:6px&quot;&gt;&lt;strong&gt;反馈：&lt;/strong&gt;${sc.opts[0].result}&lt;/div&gt;
        &lt;div style=&quot;font-size:.85rem;color:var(--text-light)&quot;&gt;&lt;strong&gt;MKS分析：&lt;/strong&gt;${sc.opts[0].mks}&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  `).join(&#x27;&#x27;);
}

  .btn-outline{border:2px solid var(--accent);background:transparent;color:var(--accent)}
  .btn-sm{padding:5px 14px;font-size:12px}
  /* Path */
  .path-steps{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
  .path-step{flex:1;min-width:140px;padding:14px;background:var(--card);border-radius:var(--radius);text-align:center;box-shadow:var(--shadow);position:relative}
  .path-step .step-num{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;line-height:32px;margin:0 auto 8px;font-weight:700}
  .path-step .step-t{font-weight:700;font-size:var(--fs-sm)}
  .path-step .step-d{font-size:12px;color:var(--muted);margin-top:4px}
  /* Responsive */
  @media(max-width:640px){
    .tabs{gap:1px;padding:4px}
    .tab-btn{padding:5px 8px;font-size:11px}
    .cards{grid-template-columns:1fr}
    .flipper{height:420px}
    .path-steps{flex-direction:column}
  }
  /* Input */
  textarea{width:100%;min-height:80px;padding:10px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:var(--fs-sm);resize:vertical}
  textarea:focus{outline:none;border-color:var(--accent)}
  .inline-flex{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .hidden{display:none}
&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;header&gt;
  &lt;h1&gt;艺术审美与品味&lt;/h1&gt;
  &lt;p&gt;审美是一种可以训练的能力 —— 摄影、红酒、奢侈品、博物馆，让生活更有品质&lt;/p&gt;
  &lt;a href=&quot;index.html&quot; class=&quot;home-btn&quot; title=&quot;返回知识主板&quot;&gt;🏠 返回知识主板&lt;/a&gt;
&lt;/header&gt;

&lt;div class=&quot;tabs&quot; id=&quot;tabBar&quot;&gt;&lt;button class=&quot;tab-btn active&quot; data-tab=&quot;0&quot;&gt;📋 总览&lt;/button&gt;&lt;button class=&quot;tab-btn&quot; data-tab=&quot;1&quot;&gt;🃏 卡片&lt;/button&gt;&lt;button class=&quot;tab-btn&quot; data-tab=&quot;2&quot;&gt;📝 题库&lt;/button&gt;&lt;button class=&quot;tab-btn&quot; data-tab=&quot;3&quot;&gt;⏱️ 考试&lt;/button&gt;&lt;button class=&quot;tab-btn&quot; data-tab=&quot;4&quot;&gt;🔄 复习&lt;/button&gt;&lt;button class=&quot;tab-btn&quot; data-tab=&quot;5&quot;&gt;🧠 导图&lt;/button&gt;&lt;button class=&quot;tab-btn&quot; data-tab=&quot;6&quot;&gt;❓ 追问&lt;/button&gt;&lt;button class=&quot;tab-btn&quot; data-tab=&quot;7&quot;&gt;🔍 案例&lt;/button&gt;&lt;button class=&quot;tab-btn&quot; data-tab=&quot;8&quot;&gt;🎯 决策&lt;/button&gt;&lt;/div&gt;

&lt;div class=&quot;container&quot;&gt;

&lt;!-- ===== TAB 0: 知识总览 ===== --&gt;
&lt;div class=&quot;tab-panel active&quot; id=&quot;panel0&quot;&gt;
  &lt;div class=&quot;section&quot;&gt;
    &lt;div class=&quot;section-title&quot;&gt;&lt;span class=&quot;ico&quot;&gt;🎯&lt;/span&gt; 核心目标&lt;/div&gt;
    &lt;div class=&quot;card&quot; style=&quot;text-align:center;font-size:1.1em;padding:24px&quot;&gt;&lt;strong&gt;审美是一种可以训练的能力&lt;/strong&gt; —— 通过系统学习摄影、艺术品鉴、奢侈品认知与博物馆素养，从&quot;看&quot;到&quot;看见&quot;，在日常中提取意义，让生活更有品质。&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;section&quot;&gt;
    &lt;div class=&quot;section-title&quot;&gt;&lt;span class=&quot;ico&quot;&gt;🧩&lt;/span&gt; 10 个核心概念&lt;/div&gt;
    &lt;div class=&quot;cards&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;1. 摄影vs记录&lt;/h3&gt;&lt;p&gt;记录是保存信息，摄影是观察的艺术——重点不在所见之物，而在观察的视角和关注的重点。&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;2. 到达与视角&lt;/h3&gt;&lt;p&gt;到达是第一要素（物理突破），视角是灵魂（主观重构），两者均无法被后期弥补。&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;3. 构图法则&lt;/h3&gt;&lt;p&gt;决定画面元素的取舍与层级——把什么东西放进去，哪个唱主角，哪个唱配角。&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;4. 光线与色彩&lt;/h3&gt;&lt;p&gt;颜色要正、要有搭配对比、善用虚化。漫射自然光是专业首选。&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;5. 黑白摄影&lt;/h3&gt;&lt;p&gt;去除色彩干扰，聚焦构图/轮廓/光线。高对比度产生特殊美感与视觉力度。&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;6. 感染力&lt;/h3&gt;&lt;p&gt;真实是根基，主题突出是手段，场景吸引力是牵引，亲和力是归宿。&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;7. 奢侈品定义&lt;/h3&gt;&lt;p&gt;极致品质 + 非必需品属性（凡勃伦商品）。核心功能是炫耀性消费。&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;8. 奢侈品商业逻辑&lt;/h3&gt;&lt;p&gt;技术进步免疫力 + 二手市场流动性 + 品牌故事传播力 = 奢侈品可持续价值。&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;9. 风味审美&lt;/h3&gt;&lt;p&gt;红酒与咖啡的品鉴有客观标准——产区/品种/工艺/陈化决定风味阶梯。&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;10. 博物馆素养&lt;/h3&gt;&lt;p&gt;文物性+艺术性+稀缺性三维评估。博物馆是文明坐标中的审美教育场。&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;section&quot;&gt;
    &lt;div class=&quot;section-title&quot;&gt;&lt;span class=&quot;ico&quot;&gt;⭐&lt;/span&gt; MKS 核心（骨架中的骨架）&lt;/div&gt;
    &lt;div class=&quot;cards&quot;&gt;
      &lt;div class=&quot;card mks&quot;&gt;&lt;h3&gt;审美是可训练的能力&lt;/h3&gt;&lt;p&gt;审美不是天赋，而是可通过系统训练获得的判断力。从摄影基本功到红酒品鉴，从奢侈品价值判断到博物馆文物评估，每一步都有方法论。这是整个模块的元认知。&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card mks&quot;&gt;&lt;h3&gt;摄影创作链&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;到达 &gt; 视角 &gt; 构图 &gt; 光影 &gt; 后期&lt;/strong&gt;——这是一条不可逆的优先级链条。前两项&quot;不可修复&quot;，后三项&quot;可部分弥补&quot;。理解了这个优先级，就理解了摄影的本质。&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card mks&quot;&gt;&lt;h3&gt;奢侈品价值三要素&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;技术进步免疫力&lt;/strong&gt;（抗贬值）+ &lt;strong&gt;二手市场流动性&lt;/strong&gt;（易变现）+ &lt;strong&gt;品牌故事传播力&lt;/strong&gt;（情感溢价）。三者缺一不可，这是区分真奢侈与伪奢侈的铁三角。&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card mks&quot;&gt;&lt;h3&gt;体验深度 = 品味厚度&lt;/h3&gt;&lt;p&gt;咖啡喝的是&quot;风味&quot;不是&quot;咖啡因&quot;，红酒品的是&quot;层次&quot;不是&quot;酒精&quot;，博物馆看的是&quot;文明坐标&quot;不是&quot;打卡清单&quot;。品味的提升来自体验的深度，而非消费的广度。&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;section&quot;&gt;
    &lt;div class=&quot;section-title&quot;&gt;&lt;span class=&quot;ico&quot;&gt;📊&lt;/span&gt; 学习进度&lt;/div&gt;

  &lt;div class=&quot;section&quot;&gt;

        &lt;tr&gt;&lt;td&gt;香水前调/中调/后调&lt;/td&gt;&lt;td&gt;香水选购与品鉴&lt;/td&gt;&lt;/tr&gt;

        &lt;tr&gt;&lt;td&gt;凯尔特音乐体系 (风笛/竖琴/民歌)&lt;/td&gt;&lt;td&gt;欧洲传统音乐欣赏&lt;/td&gt;&lt;/tr&gt;

        &lt;tr&gt;&lt;td&gt;巧克力品鉴 (可可含量/产地/发酵度)&lt;/td&gt;&lt;td&gt;美食鉴赏&lt;/td&gt;&lt;/tr&gt;

      &lt;/tbody&gt;
    &lt;/table&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;section&quot;&gt;
    &lt;div class=&quot;section-title&quot;&gt;&lt;span class=&quot;ico&quot;&gt;🗺️&lt;/span&gt; 学习路径（5阶段）&lt;/div&gt;

&lt;!-- ===== TAB 7: 案例分析 ===== --&gt;
&lt;div class=&quot;tab-panel&quot; id=&quot;panel7&quot;&gt;
  &lt;div class=&quot;section&quot;&gt;
    &lt;div class=&quot;section-title&quot;&gt;&lt;span class=&quot;ico&quot;&gt;🔍&lt;/span&gt; 案例分析：哈耶克拯救瑞士钟表业&lt;/div&gt;
    &lt;div class=&quot;case-box&quot;&gt;
      &lt;h4&gt;▎背景&lt;/h4&gt;
      &lt;p&gt;1964年东京奥运会展示石英技术后，日本手表以低价冲击市场。瑞士钟表全球销售份额从90%暴跌至20%。业界认为高劳动力成本使瑞士无法与日本竞争。&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;case-box&quot;&gt;
      &lt;h4&gt;▎MKS 四维度拆解&lt;/h4&gt;
      &lt;p&gt;&lt;strong&gt;核心概念应用：&lt;/strong&gt;奢侈品的&quot;技术进步免疫力&quot;——石英表使瑞士表&quot;精准可靠&quot;的优势丧失，哈耶克重新定义消费者价值，将手表从&quot;计时工具&quot;转向&quot;身份彰显&quot;。&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;品牌定位重构：&lt;/strong&gt;欧米茄绑定探月等高端场景，宝玑关联精致生活方式，Swatch品牌覆盖年轻低端市场——防火墙策略保护高端品牌不稀释。&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;产业整合：&lt;/strong&gt;合并SSIH与ASUAG为斯沃琪集团，部件标准化+集中生产+砍产品线（欧米茄从2000款减至130款）。&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;结果验证：&lt;/strong&gt;销售额占比从20%回升至55%，平均售价600美元 vs 中国表2美元。&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;case-box&quot;&gt;
      &lt;h4&gt;▎审美洞察&lt;/h4&gt;
      &lt;p&gt;奢侈品的本质是&quot;情感价值&quot;而非&quot;功能价值&quot;。审美判断力的核心是区分&quot;我愿意为什么付费&quot;——为功能付费有上限，为情感/身份付费无上限。&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

    &lt;div class=&quot;section-title&quot;&gt;&lt;span class=&quot;ico&quot;&gt;🎯&lt;/span&gt; 审美决策模拟（3轮）&lt;/div&gt;

  &lt;/div&gt;

&lt;script&gt;
// ========== DATA ==========

const cardsData = [
  {id:&#x27;c0&#x27;,front:&#x27;摄影 vs 记录&#x27;,back:&#x27;&lt;h4&gt;定义&lt;/h4&gt;&lt;p&gt;摄影是观察的艺术，记录是保存信息。摄影重点不在&quot;所见之物&quot;，而在&quot;观察的视角和关注的重点&quot;。&lt;/p&gt;&lt;h4&gt;类比&lt;/h4&gt;&lt;p&gt;好比写日记 vs 写散文——日记记录&quot;做了什么&quot;，散文表达&quot;感受到了什么&quot;。&lt;/p&gt;&lt;h4&gt;示例&lt;/h4&gt;&lt;p&gt;同一瀑布：全景式记录 → 捕捉落地瞬间 → 长曝光如梦如幻。三级跃升就是&quot;记录→创作&quot;的光谱。&lt;/p&gt;&lt;h4&gt;反例&lt;/h4&gt;&lt;p&gt;旅游时拍&quot;到此一游&quot;照、聚会合影、明信片式日出日落——都是记录，不是摄影。&lt;/p&gt;&#x27;},
  {id:&#x27;c1&#x27;,front:&#x27;到达与视角&#x27;,back:&#x27;&lt;h4&gt;定义&lt;/h4&gt;&lt;p&gt;到达是第一要素（物理位置的突破），视角是灵魂（主观重构）。两者均无法被后期弥补。&lt;/p&gt;&lt;h4&gt;类比&lt;/h4&gt;&lt;p&gt;好比素材与剪辑——到达是获取独特素材，视角是独特的剪辑角度。后期只能调色，不能改变素材。&lt;/p&gt;&lt;h4&gt;示例&lt;/h4&gt;&lt;p&gt;8844米珠峰用手机拍 &gt; 3000米用专业设备。站在少女峰顶俯视冰川，&quot;云和群峰都在你下面&quot;的景观不可复制。&lt;/p&gt;&lt;h4&gt;反例&lt;/h4&gt;&lt;p&gt;依赖广角镜头在平地拍大教堂全景，不如退后至城门内利用拱形框架拍摄——后者才是视角创新。&lt;/p&gt;&#x27;},
  {id:&#x27;c2&#x27;,front:&#x27;构图法则&#x27;,back:&#x27;&lt;h4&gt;定义&lt;/h4&gt;&lt;p&gt;决定画面元素的取舍与层级——&quot;将什么东西放到照片里去，同时哪个在前，哪个在后，哪个唱主角，哪个唱配角&quot;。&lt;/p&gt;&lt;h4&gt;类比&lt;/h4&gt;&lt;p&gt;好比舞台调度——导演决定谁站C位、谁做背景、灯光打在哪。构图就是照片的舞台调度。&lt;/p&gt;&lt;h4&gt;示例&lt;/h4&gt;&lt;p&gt;三角形构图：强化建筑高耸感（近距广角拍小教堂）、场景自然形成三角形（斜坡房子与地面）。圆形构图：教堂作为圆心，乌云向四周发散。&lt;/p&gt;&lt;h4&gt;反例&lt;/h4&gt;&lt;p&gt;传统全景正面拍城堡——&quot;明信片水平&quot;，达标但无灵气。改为以雕像为主体侧拍，宫殿做配角，画面立刻生动。&lt;/p&gt;&#x27;},
  {id:&#x27;c3&#x27;,front:&#x27;光线与色彩&#x27;,back:&#x27;&lt;h4&gt;定义&lt;/h4&gt;&lt;p&gt;颜色要正（色彩还原准确）、要有搭配对比（互补色布局）、善用虚化（营造柔和均匀的色彩质感）。&lt;/p&gt;&lt;h4&gt;类比&lt;/h4&gt;&lt;p&gt;好比化妆——底妆要正（色温准确），眼影要有对比（红绿互补），高光要柔和（虚化过渡）。&lt;/p&gt;&lt;h4&gt;示例&lt;/h4&gt;&lt;p&gt;纽伦堡古城采用红绿颜色搭配形成视觉对比。日落前1小时光线柔和，适合拍摄普通景物。夜景小光圈让灯光呈现星线效果。&lt;/p&gt;&lt;h4&gt;反例&lt;/h4&gt;&lt;p&gt;依赖Photoshop过度调色追求&quot;打翻调色板&quot;的效果——颜色失真。避免正面强光（闪光灯直射人脸过白）。&lt;/p&gt;&#x27;},
  {id:&#x27;c4&#x27;,front:&#x27;黑白摄影&#x27;,back:&#x27;&lt;h4&gt;定义&lt;/h4&gt;&lt;p&gt;去除色彩干扰，聚焦构图/轮廓/光线三大要素。黑白像素清晰度约为彩色像素的两倍，对比度更高。&lt;/p&gt;&lt;h4&gt;类比&lt;/h4&gt;&lt;p&gt;好比读纯文本 vs 读图文混排——去掉图片后，文字的排版结构和字体本身的力度就凸显了。&lt;/p&gt;&lt;h4&gt;示例&lt;/h4&gt;&lt;p&gt;杂乱城市街头、色彩不美观的场景、需要强化线条/光影的主题——黑白处理后可&quot;化干扰为亮点&quot;。宝马博物馆扶手转化为亮丽线条。&lt;/p&gt;&lt;h4&gt;反例&lt;/h4&gt;&lt;p&gt;色彩本身为核心元素的风景照（如火山口湖的湛蓝色）——此时黑白摄影会损失核心信息。&lt;/p&gt;&#x27;},
  {id:&#x27;c5&#x27;,front:&#x27;感染力&#x27;,back:&#x27;&lt;h4&gt;定义&lt;/h4&gt;&lt;p&gt;真实是根基（拒绝过度修图），主题突出是手段（单张照片仅突出1个主题），场景吸引力是牵引（激发&quot;亲眼去看&quot;的欲望），亲和力是归宿（不哗众取宠）。&lt;/p&gt;&lt;h4&gt;类比&lt;/h4&gt;&lt;p&gt;好比讲故事——好故事不一定最华丽，但一定最真、最聚焦、最能让你产生&quot;我也想去体验&quot;的冲动。&lt;/p&gt;&lt;h4&gt;示例&lt;/h4&gt;&lt;p&gt;《时代广场的胜利日》——美感+二战胜利狂喜情绪。《地球升起》——月球荒凉与蓝色地球对比唤起环保意识。&lt;/p&gt;&lt;h4&gt;反例&lt;/h4&gt;&lt;p&gt;过度PS合成照片——失去可信度。元素堆砌无主题——观众不知道看哪里。哗众取宠的古怪题材——不知所云。&lt;/p&gt;&#x27;},
  {id:&#x27;c6&#x27;,front:&#x27;奢侈品定义&#x27;,back:&#x27;&lt;h4&gt;定义&lt;/h4&gt;&lt;p&gt;两大特征：极致品质（材料/工艺无妥协）+ 非必需品属性（凡勃伦商品，核心功能为&quot;炫耀性消费&quot;）。&lt;/p&gt;&lt;h4&gt;类比&lt;/h4&gt;&lt;p&gt;好比米其林三星 vs 快餐——都能填饱肚子，但前者满足的是对&quot;极致体验&quot;的追求而非&quot;饱腹&quot;需求。&lt;/p&gt;&lt;h4&gt;示例&lt;/h4&gt;&lt;p&gt;爱马仕铂金包（纯手工/一年等候期/价格万元美元级）。百达翡丽手表（&quot;十月怀胎&quot;制作周期/15年以上经验技师）。&lt;/p&gt;&lt;h4&gt;反例&lt;/h4&gt;&lt;p&gt;Apple Watch奢侈版（受摩尔定律影响快速贬值）、诺基亚威图手机——电子产品无法维持奢侈品的保值属性。徕卡相机普通版（功能驱动，非奢侈品）。&lt;/p&gt;&#x27;},
  {id:&#x27;c7&#x27;,front:&#x27;奢侈品商业逻辑&#x27;,back:&#x27;&lt;h4&gt;定义&lt;/h4&gt;&lt;p&gt;三要素模型：技术进步免疫力（抗贬值）+ 二手市场流动性（易变现）+ 品牌故事传播力（情感溢价）。&lt;/p&gt;&lt;h4&gt;类比&lt;/h4&gt;&lt;p&gt;好比购房——抗跌的地段（免疫力）、好转手的户型（流动性）、有故事的小区文化（故事）。三者兼具才是好资产。&lt;/p&gt;&lt;h4&gt;示例&lt;/h4&gt;&lt;p&gt;斯坦威钢琴80年二手价3万美元（新琴5-6万）。百达翡丽限量版二手超百万美元。爱马仕手袋二手流动性远高于路易威登。&lt;/p&gt;&lt;h4&gt;反例&lt;/h4&gt;&lt;p&gt;卡地亚刻字戒指（个性化过强→流动性差）。小众艺术家作品（市场认知度低→变现困难）。&lt;/p&gt;&#x27;},
  {id:&#x27;c8&#x27;,front:&#x27;风味审美&#x27;,back:&#x27;&lt;h4&gt;定义&lt;/h4&gt;&lt;p&gt;红酒与咖啡的品鉴有客观标准——产区（土壤/气候/朝向）、品种（葡萄/咖啡豆种）、工艺（发酵/烘烤/陈化）共同决定风味阶梯。&lt;/p&gt;&lt;h4&gt;类比&lt;/h4&gt;&lt;p&gt;好比茶叶品鉴——龙井vs碧螺春vs铁观音，不同产区/品种/工艺产生截然不同的风味。喝得多了，味蕾自然建立&quot;坐标系&quot;。&lt;/p&gt;&lt;h4&gt;示例&lt;/h4&gt;&lt;p&gt;波尔多五大一级庄（拉菲/拉图/玛歌/奥比昂/木桐）。阿拉比卡咖啡豆（牙买加蓝山/夏威夷科纳/埃塞俄比亚基尼卡）。&lt;/p&gt;&lt;h4&gt;反例&lt;/h4&gt;&lt;p&gt;82年拉菲已进入收藏阶段（非最佳饮用期）。星巴克用廉价咖啡豆（每磅几十美分），单杯成本不足2美分。红酒加雪碧破坏风味。&lt;/p&gt;&#x27;},
  {id:&#x27;c9&#x27;,front:&#x27;博物馆素养&#x27;,back:&#x27;&lt;h4&gt;定义&lt;/h4&gt;&lt;p&gt;文物价值三维评估：文物性（历史事件见证）+ 艺术性（里程碑意义）+ 稀缺性（时间/数量稀缺）。博物馆是文明坐标中的审美教育场。&lt;/p&gt;&lt;h4&gt;类比&lt;/h4&gt;&lt;p&gt;好比电影史课——你看的不是单部电影，而是通过电影理解一个时代的审美、技术与价值观变迁。&lt;/p&gt;&lt;h4&gt;示例&lt;/h4&gt;&lt;p&gt;大英博物馆罗赛塔石碑（文物性：古埃及文字破译关键；稀缺性：唯一多语言对照石碑）。卢浮宫汉谟拉比法典（世界最早成文法典）。&lt;/p&gt;&lt;h4&gt;反例&lt;/h4&gt;&lt;p&gt;到博物馆只拍&quot;镇馆之宝&quot;、不听讲解、不看说明——如同看电影只看海报不看正片。&lt;/p&gt;&#x27;}
];

// MCQ: 20 questions, answer index 0-3 each 5 times
// Distribution: A(0)=5, B(1)=5, C(2)=5, D(3)=5
const mcQuestions = [
  {q:&#x27;摄影与记录的本质区别是什么？&#x27;,opts:[&#x27;摄影依赖设备自动处理，记录依赖手动设定&#x27;,&#x27;摄影是观察的艺术和思想的表达，记录是客观保存信息&#x27;,&#x27;摄影只使用黑白模式，记录使用彩色模式&#x27;,&#x27;摄影必须用专业相机，记录只能用手机&#x27;],ans:1,exp:&#x27;摄影的核心是&quot;观察的视角和关注的重点&quot;，是通过静止画面表达思想。记录仅仅是客观保存场景信息。&#x27;},
  {q:&#x27;好摄影的第一要素是什么？&#x27;,opts:[&#x27;后期处理&#x27;,&#x27;光线与色彩&#x27;,&#x27;到达（在正确的时间到达正确的地点）&#x27;,&#x27;设备与技术&#x27;],ans:2,exp:&#x27;到达是第一要素，重要性远超设备和技术。《舌尖上的中国》摄影师经验：海拔高度直接决定视觉震撼力。&#x27;},
  {q:&#x27;摄影各要素的正确优先级是？&#x27;,opts:[&#x27;构图 &gt; 光线 &gt; 到达 &gt; 视角 &gt; 后期&#x27;,&#x27;后期 &gt; 光线 &gt; 构图 &gt; 视角 &gt; 到达&#x27;,&#x27;视角 &gt; 到达 &gt; 后期 &gt; 构图 &gt; 光线&#x27;,&#x27;到达 &gt; 视角 &gt; 构图 &gt; 光影 &gt; 后期&#x27;],ans:3,exp:&#x27;到达和视角&quot;不可修复&quot;，构图/光影/后期可部分弥补。这是徕卡学院训练营中反复强调的核心方法论。&#x27;},
  {q:&#x27;三角形构图的摄影效果是什么？&#x27;,opts:[&#x27;增强稳定感与高度感&#x27;,&#x27;营造梦幻模糊效果&#x27;,&#x27;减少画面元素数量&#x27;,&#x27;自动调整白平衡&#x27;],ans:0,exp:&#x27;三角形构图的核心效果是增强画面的稳定感（场景自然形成的三角形）和高度感（近距广角拍建筑形成的高耸效果）。&#x27;},
  {q:&#x27;黑白摄影相比彩色摄影的优势是？&#x27;,opts:[&#x27;色彩更丰富&#x27;,&#x27;文件体积更小&#x27;,&#x27;高对比度、去色聚焦、更高清晰度&#x27;,&#x27;更适合拍摄自然风光&#x27;],ans:2,exp:&#x27;黑白照片对比度更高、去除色彩干扰使注意力集中于图像本质、像素清晰度约为彩色两倍。&#x27;},
  {q:&#x27;照片感染力的根基是什么？&#x27;,opts:[&#x27;后期修图&#x27;,&#x27;稀缺题材&#x27;,&#x27;高像素&#x27;,&#x27;真实性&#x27;],ans:3,exp:&#x27;真实性是感染力的根基。拒绝过度修图，依赖光学记录现实。若《地球升起》为PS作品将丧失可信度。&#x27;},
  {q:&#x27;以下哪项是奢侈品的核心特征？&#x27;,opts:[&#x27;极致品质与非必需品属性&#x27;,&#x27;高价格和品牌知名度&#x27;,&#x27;手工制作和限量版&#x27;,&#x27;历史悠久和贵族传统&#x27;],ans:0,exp:&#x27;极致品质（材料/工艺无妥协）+ 非必需品属性（凡勃伦商品，炫耀性消费）。高价格是结果而非定义。&#x27;},
  {q:&#x27;奢侈品价值三要素不包括以下哪项？&#x27;,opts:[&#x27;技术进步免疫力&#x27;,&#x27;二手市场流动性&#x27;,&#x27;品牌故事传播力&#x27;,&#x27;产品功能创新力&#x27;],ans:3,exp:&#x27;三要素是技术进步免疫力（抗贬值）、二手市场流动性（易变现）、品牌故事传播力（情感溢价）。功能创新不是奢侈品的核心逻辑。&#x27;},

// ========== TAB 1: Cards ==========
function renderCard(){
  const c = cardsData[currentCard];
  document.getElementById(&#x27;flipFront&#x27;).textContent = c.front;
  document.getElementById(&#x27;flipBack&#x27;).innerHTML = c.back;
  document.getElementById(&#x27;flipper&#x27;).classList.remove(&#x27;flipped&#x27;);
  document.getElementById(&#x27;cardIdx&#x27;).textContent = (currentCard+1)+&#x27; / &#x27;+cardsData.length;
  const lb = document.getElementById(&#x27;learnedBtn&#x27;);
  if(learned.has(c.id)){ lb.textContent=&#x27;✓ 已学习&#x27;; lb.classList.add(&#x27;learned&#x27;); }
  else{ lb.textContent=&#x27;✓ 标记已学习&#x27;; lb.classList.remove(&#x27;learned&#x27;); }
}
function flipCard(){ document.getElementById(&#x27;flipper&#x27;).classList.toggle(&#x27;flipped&#x27;); }
function prevCard(){ currentCard=(currentCard-1+cardsData.length)%cardsData.length; renderCard(); }
function nextCard(){ currentCard=(currentCard+1)%cardsData.length; renderCard(); }
function markLearned(){
  const c = cardsData[currentCard];
  if(learned.has(c.id)){ learned.delete(c.id); } else { learned.add(c.id); }
  saveState(); renderCard(); updateProgress();
}

// ========== PROGRESS ==========
function updateProgress(){
  const n=learned.size, t=cardsData.length;
  document.getElementById(&#x27;progLabel&#x27;).textContent=n+&#x27; / &#x27;+t;
  document.getElementById(&#x27;progBar&#x27;).style.width=(n/t*100)+&#x27;%&#x27;;
}

// ========== TAB 2: Quiz ==========
function renderQuiz(){
  let h=&#x27;&#x27;;
  mcQuestions.forEach((q,i)=&gt;{
    const aKey=&#x27;mc_&#x27;+i;
    const chosen=quizAnswers[aKey]!==undefined?quizAnswers[aKey]:-1;
    h+=&#x27;&lt;div class=&quot;quiz-q&quot;&gt;&lt;div class=&quot;q-title&quot;&gt;&#x27;+(i+1)+&#x27;. &#x27;+q.q+&#x27;&lt;/div&gt;&#x27;;
    q.opts.forEach((o,j)=&gt;{
      let cls=&#x27;opt&#x27;;
      if(chosen&gt;=0){
        if(j===q.ans) cls+=&#x27; correct&#x27;;
        if(j===chosen&amp;&amp;j!==q.ans) cls+=&#x27; wrong&#x27;;
        if(j===chosen) cls+=&#x27; chosen&#x27;;
      }
      h+=&#x27;&lt;div class=&quot;&#x27;+cls+&#x27;&quot; onclick=&quot;pickMC(&#x27;+i+&#x27;,&#x27;+j+&#x27;,this)&quot;&gt;&#x27;+&#x27;ABCD&#x27;[j]+&#x27;. &#x27;+o+&#x27;&lt;/div&gt;&#x27;;
    });
    if(chosen&gt;=0){
      h+=&#x27;&lt;div class=&quot;quiz-feedback &#x27;+(chosen===q.ans?&#x27;correct&#x27;:&#x27;wrong&#x27;)+&#x27;&quot;&gt;&#x27;+(chosen===q.ans?&#x27;✓ 正确！&#x27;:&#x27;✗ 错误&#x27;)+&#x27; &#x27;+q.exp+&#x27;&lt;/div&gt;&#x27;;
    }
    h+=&#x27;&lt;/div&gt;&#x27;;
  });
  document.getElementById(&#x27;mcQuiz&#x27;).innerHTML=h;

  let sh=&#x27;&#x27;;
  saQuestions.forEach((q,i)=&gt;{
    const aKey=&#x27;sa_&#x27;+i;
    const val=quizAnswers[aKey]||&#x27;&#x27;;
    sh+=&#x27;&lt;div class=&quot;quiz-q&quot;&gt;&lt;div class=&quot;q-title&quot;&gt;&#x27;+(i+1)+&#x27;. &#x27;+q.q+&#x27;&lt;/div&gt;&#x27;;
    sh+=&#x27;&lt;textarea id=&quot;sa_&#x27;+i+&#x27;&quot; onchange=&quot;saveSA(&#x27;+i+&#x27;)&quot;&gt;&#x27;+val+&#x27;&lt;/textarea&gt;&#x27;;
    sh+=&#x27;&lt;button class=&quot;btn btn-sm btn-outline&quot; style=&quot;margin-top:6px&quot; onclick=&quot;showRef(&#x27;+i+&#x27;)&quot;&gt;查看参考要点&lt;/button&gt;&#x27;;
    sh+=&#x27;&lt;div id=&quot;ref_&#x27;+i+&#x27;&quot; class=&quot;quiz-feedback&quot; style=&quot;background:#fff3cd;color:#856404&quot;&gt;&lt;/div&gt;&#x27;;
    sh+=&#x27;&lt;/div&gt;&#x27;;
  });
  document.getElementById(&#x27;saQuiz&#x27;).innerHTML=sh;
}

function pickMC(i,j,el){
  const key=&#x27;mc_&#x27;+i;
  if(quizAnswers[key]!==undefined) return;
  quizAnswers[key]=j;
  const correct=j===mcQuestions[i].ans;
  recordAnswer(&#x27;mc_&#x27;+i,correct);
  if(!correct) wrongList.push({type:&#x27;mc&#x27;,idx:i,q:mcQuestions[i].q,user:mcQuestions[i].opts[j],ans:mcQuestions[i].opts[mcQuestions[i].ans],exp:mcQuestions[i].exp,time:Date.now()});
  saveState(); renderQuiz();
}

function saveSA(i){
  const key=&#x27;sa_&#x27;+i;
  const val=document.getElementById(&#x27;sa_&#x27;+i).value.trim();
  if(val) quizAnswers[key]=val; else delete quizAnswers[key];
  saveState();
}

function showRef(i){
  const ref=document.getElementById(&#x27;ref_&#x27;+i);
  ref.style.display=&#x27;block&#x27;;
  ref.innerHTML=&#x27;&lt;strong&gt;参考要点：&lt;/strong&gt;&#x27;+saQuestions[i].ref;
}

// ========== TAB 3: Exam ==========
function startExam(){
  if(examActive) return;
  examActive=true;
  document.getElementById(&#x27;examStart&#x27;).classList.add(&#x27;hidden&#x27;);
  document.getElementById(&#x27;examSubmit&#x27;).classList.remove(&#x27;hidden&#x27;);

  // Pick 7 MC + 3 SA
  const mcP=shuffle([...Array(mcQuestions.length).keys()]).slice(0,7);
  const saP=shuffle([...Array(saQuestions.length).keys()]).slice(0,3);
  examData=[...mcP.map(i=&gt;({type:&#x27;mc&#x27;,idx:i,...mcQuestions[i]})),...saP.map(i=&gt;({type:&#x27;sa&#x27;,idx:i,...saQuestions[i]}))];
  examData=shuffle(examData);

  let h=&#x27;&#x27;;
  examData.forEach((q,i)=&gt;{
    if(q.type===&#x27;mc&#x27;){
      h+=&#x27;&lt;div class=&quot;quiz-q&quot;&gt;&lt;div class=&quot;q-title&quot;&gt;&#x27;+(i+1)+&#x27;. &#x27;+q.q+&#x27;&lt;/div&gt;&#x27;;
      q.opts.forEach((o,j)=&gt;h+=&#x27;&lt;div class=&quot;opt&quot; onclick=&quot;pickExam(&#x27;+i+&#x27;,&#x27;+j+&#x27;,this)&quot;&gt;&#x27;+&#x27;ABCD&#x27;[j]+&#x27;. &#x27;+o+&#x27;&lt;/div&gt;&#x27;);
      h+=&#x27;&lt;/div&gt;&#x27;;
    }else{
      h+=&#x27;&lt;div class=&quot;quiz-q&quot;&gt;&lt;div class=&quot;q-title&quot;&gt;&#x27;+(i+1)+&#x27;. &#x27;+q.q+&#x27;&lt;/div&gt;&#x27;;
      h+=&#x27;&lt;textarea id=&quot;exam_sa_&#x27;+i+&#x27;&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;&#x27;;
    }
  });
  document.getElementById(&#x27;examContent&#x27;).innerHTML=h;
  document.getElementById(&#x27;examResult&#x27;).innerHTML=&#x27;&#x27;;

  let sec=15*60;
  document.getElementById(&#x27;examTimer&#x27;).textContent=Math.floor(sec/60)+&#x27;:&#x27;+String(sec%60).padStart(2,&#x27;0&#x27;);
  examTimerId=setInterval(()=&gt;{
    sec--;
    document.getElementById(&#x27;examTimer&#x27;).textContent=Math.floor(sec/60)+&#x27;:&#x27;+String(sec%60).padStart(2,&#x27;0&#x27;);
    if(sec&lt;=0){ clearInterval(examTimerId); submitExam(); }
  },1000);
}

let examPicks={};
function pickExam(i,j,el){
  if(examPicks[i]!==undefined) return;
  examPicks[i]=j;
  el.parentElement.querySelectorAll(&#x27;.opt&#x27;).forEach(o=&gt;o.style.pointerEvents=&#x27;none&#x27;);
  el.classList.add(&#x27;chosen&#x27;);
}

function submitExam(){
  if(!examActive) return;
  examActive=false;
  clearInterval(examTimerId);
  document.getElementById(&#x27;examSubmit&#x27;).classList.add(&#x27;hidden&#x27;);

  let score=0,total=examData.length,details=&#x27;&#x27;;
  examData.forEach((q,i)=&gt;{
    if(q.type===&#x27;mc&#x27;){
      const pick=examPicks[i];
      const correct=pick===q.ans;
      if(correct) score++;
      else wrongList.push({type:&#x27;mc&#x27;,idx:q.idx,q:q.q,user:pick!==undefined?q.opts[pick]:&#x27;未作答&#x27;,ans:q.opts[q.ans],exp:q.exp,time:Date.now()});
      recordAnswer(&#x27;exam_mc_&#x27;+q.idx,correct);
      details+=&#x27;&lt;p&gt;&#x27;+(i+1)+&#x27;. &#x27;+(correct?&#x27;✓ 正确&#x27;:&#x27;✗ 错误（选&#x27;+&#x27;ABCD&#x27;[pick||0]+&#x27;，正确为&#x27;+&#x27;ABCD&#x27;[q.ans]+&#x27;）&#x27;)+&#x27; — &#x27;+q.exp+&#x27;&lt;/p&gt;&#x27;;
    } else {
      details+=&#x27;&lt;p&gt;&#x27;+(i+1)+&#x27;. 简答题已记录。参考要点：&#x27;+q.ref.substring(0,80)+&#x27;...&lt;/p&gt;&#x27;;
    }
  });
  saveState();

  document.getElementById(&#x27;examResult&#x27;).innerHTML=&#x27;&lt;div class=&quot;card&quot; style=&quot;margin-top:16px&quot;&gt;&lt;h3&gt;考试成绩：&#x27;+score+&#x27; / &#x27;+total+&#x27;&lt;/h3&gt;&#x27;+details+&#x27;&lt;/div&gt;&#x27;;
}

function shuffle(a){ for(let i=a.length-1;i&gt;0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

// ========== TAB 4: Review ==========
function renderReview(){
  document.getElementById(&#x27;statTotal&#x27;).textContent=stats.total;
  document.getElementById(&#x27;statCorrect&#x27;).textContent=stats.total&gt;0?Math.round(stats.correct/stats.total*100)+&#x27;%&#x27;:&#x27;0%&#x27;;
  document.getElementById(&#x27;statDays&#x27;).textContent=stats.days.length;
  document.getElementById(&#x27;statCards&#x27;).textContent=learned.size;

  // Wrong book
  let wh=&#x27;&#x27;;
  if(wrongList.length===0){
    wh=&#x27;&lt;p style=&quot;color:var(--muted)&quot;&gt;暂无错题，继续保持!&lt;/p&gt;&#x27;;
  }else{
    wh=&#x27;&lt;button class=&quot;btn btn-sm&quot; onclick=&quot;clearWrong()&quot; style=&quot;margin-bottom:12px&quot;&gt;清空错题本&lt;/button&gt;&#x27;;
    wrongList.slice().reverse().forEach((w,i)=&gt;{
      wh+=&#x27;&lt;div class=&quot;quiz-q&quot;&gt;&lt;div class=&quot;q-title&quot;&gt;&#x27;+(wrongList.length-i)+&#x27;. &#x27;+w.q+&#x27;&lt;/div&gt;&#x27;;
      wh+=&#x27;&lt;p style=&quot;font-size:var(--fs-sm)&quot;&gt;你的答案：&lt;span style=&quot;color:var(--accent)&quot;&gt;&#x27;+(w.user||&#x27;未作答&#x27;)+&#x27;&lt;/span&gt;&lt;/p&gt;&#x27;;
      wh+=&#x27;&lt;p style=&quot;font-size:var(--fs-sm)&quot;&gt;正确答案：&lt;span style=&quot;color:#27ae60&quot;&gt;&#x27;+w.ans+&#x27;&lt;/span&gt;&lt;/p&gt;&#x27;;
      wh+=&#x27;&lt;p style=&quot;font-size:var(--fs-sm);color:var(--muted)&quot;&gt;&#x27;+w.exp+&#x27;&lt;/p&gt;&lt;/div&gt;&#x27;;
    });
  }
  document.getElementById(&#x27;wrongBook&#x27;).innerHTML=wh;

  // Weak concepts
  const conceptErr={};
  wrongList.forEach(w=&gt;{
    const q=w.q;
    let cat=&#x27;其他&#x27;;
    if(q.includes(&#x27;摄影&#x27;)||q.includes(&#x27;构图&#x27;)||q.includes(&#x27;照片&#x27;)||q.includes(&#x27;黑白&#x27;)||q.includes(&#x27;相机&#x27;)||q.includes(&#x27;视角&#x27;)||q.includes(&#x27;到达&#x27;)) cat=&#x27;摄影&#x27;;
    else if(q.includes(&#x27;奢侈品&#x27;)||q.includes(&#x27;路易&#x27;)||q.includes(&#x27;香奈儿&#x27;)||q.includes(&#x27;哈耶克&#x27;)||q.includes(&#x27;中国制造&#x27;)||q.includes(&#x27;定价&#x27;)) cat=&#x27;奢侈品&#x27;;
    else if(q.includes(&#x27;红酒&#x27;)||q.includes(&#x27;波尔多&#x27;)||q.includes(&#x27;香槟&#x27;)||q.includes(&#x27;咖啡&#x27;)||q.includes(&#x27;阿拉比卡&#x27;)) cat=&#x27;风味审美&#x27;;
    else if(q.includes(&#x27;绘画&#x27;)||q.includes(&#x27;毕加索&#x27;)||q.includes(&#x27;博物馆&#x27;)||q.includes(&#x27;教堂&#x27;)||q.includes(&#x27;文艺复兴&#x27;)) cat=&#x27;博物馆与艺术&#x27;;
    conceptErr[cat]=(conceptErr[cat]||0)+1;
  });
  let wch=&#x27;&#x27;;
  if(Object.keys(conceptErr).length===0){
    wch=&#x27;&lt;p style=&quot;color:var(--muted)&quot;&gt;答题数据不足，完成更多题目后显示分析。&lt;/p&gt;&#x27;;
  }else{
    const sorted=Object.entries(conceptErr).sort((a,b)=&gt;b[1]-a[1]);
    sorted.forEach(([k,v])=&gt;wch+=&#x27;&lt;div class=&quot;card&quot; style=&quot;margin:4px 0&quot;&gt;&lt;strong&gt;&#x27;+k+&#x27;&lt;/strong&gt; — 错&#x27;+v+&#x27;题 &lt;span style=&quot;color:var(--muted);font-size:12px&quot;&gt;建议重做相关题目并复习对应卡片&lt;/span&gt;&lt;/div&gt;&#x27;);
  }
  document.getElementById(&#x27;weakConcepts&#x27;).innerHTML=wch;
}

// ========== TAB 6: Socratic ==========
function renderSocratic(){
  const qs=[
    {q:&#x27;为什么说&quot;审美是可以训练的&quot;？这是否意味着审美有&quot;标准答案&quot;？&#x27;,a1:&#x27;审美可以训练，就像味觉可以训练一样——一个从未喝过红酒的人无法分辨波尔多和纳帕的区别，但经过系统品鉴后就能建立&quot;坐标系&quot;。&#x27;,a2:&#x27;但这不意味着审美有&quot;标准答案&quot;。训练提供的是&quot;判断框架&quot;而非&quot;唯一标准&quot;——你知道为什么这张照片好（到达稀缺+视角独特+构图有力），但你仍然可以主观偏好不同的风格。训练提高的是&quot;分辨力&quot;而非规定&quot;偏好&quot;。&#x27;},
    {q:&#x27;如果&quot;到达&quot;是第一要素，那没有条件去珠峰的人是不是就不可能拍出好照片？&#x27;,a1:&#x27;&quot;到达&quot;的本质不是&quot;去远方&quot;，而是&quot;比其他人多走一步&quot;——楼梯间的特殊角度、门洞后的独特框架、低角度拍摄的动感，都是&quot;到达&quot;。&#x27;,a2:&#x27;关键不是去了多远的地方，而是你有没有在&quot;正确的时间到达正确的地点&quot;。&quot;到达&quot;是可以微缩的——在自家楼下找到别人没注意到的角度，也是&quot;到达&quot;。&#x27;},
    {q:&#x27;奢侈品的高价是否就是&quot;智商税&quot;？为什么有人愿意花10万买一块机械表？&#x27;,a1:&#x27;从功能角度看，10万的机械表走时不如100元的石英表精准——这是事实。但消费者的购买动机不是&quot;计时&quot;，而是&quot;身份彰显&quot;和&quot;情感价值&quot;。&#x27;,a2:&#x27;这就像有人愿意花1000元吃米其林而不是10元吃快餐——填饱肚子的功能是一样的。关键在于你是否认可&quot;情感价值&quot;作为一种&quot;真实价值&quot;。如果你不认可，那确实不买就好。但否认这种价值的存在，是混淆了&quot;功能需求&quot;和&quot;情感需求&quot;。&#x27;},
    {q:&#x27;如果多数奢侈品都是中国制造，那&quot;法国制造&quot;&quot;意大利制造&quot;的标签是不是欺骗？&#x27;,a1:&#x27;这是一个灰色地带。行业辩护的理由是：技术和设备来自欧洲，中国工厂是&quot;专属生产&quot;而非&quot;代工&quot;，铭牌由品牌方严格管控。但消费者感受到的信息不对称是真实的。&#x27;,a2:&#x27;更深层的问题是：奢侈品的价值究竟在&quot;产地&quot;还是在&quot;品牌故事&quot;？如果香奈儿5号香水的配方、工艺、品质管控完全一样，只是生产线搬到了广东，它的价值应该变化吗？这是当代消费伦理尚未解决的核心矛盾。&#x27;},
    {q:&#x27;红酒品鉴中&quot;好喝&quot;是否完全主观？为什么有人觉得拉菲&quot;还不如超市50块的酒好喝&quot;？&#x27;,a1:&#x27;个人口味偏好当然存在——有人喜欢浓郁醇厚的纳帕赤霞珠，有人偏爱清淡优雅的勃艮第黑皮诺。这都合理。&#x27;,a2:&#x27;但&quot;好喝&quot;不完全等于&quot;品质高&quot;。品质有客观维度：葡萄的产区条件、酿造工艺的精细度、陈化时间的充足度、酒体的层次感和余味长度。你完全可以主观偏好超市50块的酒，但客观品质的判断标准依然存在。审美训练就是帮你建立这两个维度的区分。&#x27;},
    {q:&#x27;博物馆的&quot;打卡式&quot;参观和&quot;沉浸式&quot;参观究竟差在哪里？&#x27;,a1:&#x27;打卡式：看镇馆之宝→拍照→发朋友圈→离开。沉浸式：提前了解背景→带着问题去看→在作品前停留→记下感受→回去查资料→建立知识连接。&#x27;,a2:&#x27;两者的核心差异在于&quot;主动性&quot;。沉浸式参观是你带着&quot;内在问题&quot;去博物馆寻求答案——你对文艺复兴好奇，于是你在乌菲兹博物馆看到的不只是一幅画，而是一个时代的思想史。品味的厚度来自这种&quot;深度连接&quot;，而非&quot;清单勾选&quot;的数量。&#x27;}
  ];
  let h=&#x27;&#x27;;
  qs.forEach((q,i)=&gt;{
    h+=&#x27;&lt;div class=&quot;soc-item&quot; onclick=&quot;this.classList.toggle(\&#x27;open\&#x27;)&quot;&gt;&lt;div class=&quot;soc-q&quot;&gt;&lt;span&gt;&#x27;+(i+1)+&#x27;. &#x27;+q.q+&#x27;&lt;/span&gt;&lt;span style=&quot;font-size:12px&quot;&gt;▶&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;soc-a&quot;&gt;&lt;p&gt;&lt;strong&gt;第一层：&lt;/strong&gt;&#x27;+q.a1+&#x27;&lt;/p&gt;&lt;p style=&quot;margin-top:6px&quot;&gt;&lt;strong&gt;第二层：&lt;/strong&gt;&#x27;+q.a2+&#x27;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&#x27;;
  });
  document.getElementById(&#x27;socratic&#x27;).innerHTML=h;
}

// ========== TAB 8: Decisions ==========
function renderDecisions(){
  const rounds=[
    {scene:&#x27;你计划去欧洲旅行一周，预算有限。以下哪个行程组合最能提升你的审美素养？&#x27;,opts:[
      {label:&#x27;巴黎卢浮宫（半天）+ 米兰大教堂（门口拍照）+ 巴塞罗那高迪建筑（半天）+ 购物三天&#x27;,feedback:&#x27;&quot;购物三天&quot;说明你还没有真正把审美放在优先位置。卢浮宫半天和米兰大教堂门口拍照都是&quot;打卡式&quot;体验——你没有给深度一个机会。&#x27;,mks:&#x27;★ MKS核心&quot;体验深度=品味厚度&quot;：一个博物馆沉浸一天胜过十个景点打卡一周。&#x27;},
      {label:&#x27;佛罗伦萨三整天（乌菲兹博物馆/圣母百花大教堂/市政广场/圣洛伦佐教堂）+ 米兰两天（最后的晚餐/米兰大教堂/圣莫里西奥教堂）+ 可选的葡萄酒庄半日&#x27;,feedback:&#x27;这是&quot;深度优先&quot;的选择。佛罗伦萨是文艺复兴的心脏，三整天刚好建立对&quot;绘画四阶段&quot;的感性认知。米兰两天的教堂深度游将宗教/艺术/建筑融为一体。酒庄半日是&quot;风味审美&quot;的实战。&#x27;,mks:&#x27;★ 三个MKS核心全覆盖：摄影创作链（教堂构图实践）、奢侈品价值判断（意大利品牌发源地）、体验深度&gt;消费广度。&#x27;},
      {label:&#x27;巴黎卢浮宫（一天）+ 香榭丽舍奢侈品店购物（一天）+ 凡尔赛宫（半天）+ 各地米其林餐厅打卡&#x27;,feedback:&#x27;这是一个&quot;消费导向&quot;而非&quot;学习导向&quot;的行程。米其林打卡和奢侈品购物虽然也能提升品味，但它们更多是&quot;结果&quot;而非&quot;方法&quot;——你学到了如何判断一个包的价值了吗？还是仅仅消费了它？&#x27;,mks:&#x27;审美训练注重&quot;方法论&quot;而非&quot;消费清单&quot;。奢侈品购物本身不会提升审美判断力，理解其商业逻辑才会。&#x27;}
    ]},
    {scene:&#x27;你想开始学习品鉴红酒，预算约3000元。以下哪种投入方式最合理？&#x27;,opts:[
      {label:&#x27;买一瓶拉菲副牌（小拉菲）或同价位名庄酒，体验&quot;顶级红酒&quot;的味道&#x27;,feedback:&#x27;小拉菲本质是用30年以下嫩藤葡萄酿造，品质仅相当于普通酒庄水平。中国市场炒作使其价格涨至原价的3-4倍。你花3000元买到的不是&quot;顶级体验&quot;，而是&quot;品牌溢价&quot;和一个可能让你对红酒产生误解的样本。&#x27;,mks:&#x27;★ MKS核心&quot;奢侈品价值三要素&quot;的反面案例：品牌故事很强，但产品本身的技术进步免疫力和二手流动性不足。&#x27;},
      {label:&#x27;买3-4瓶中档价位的不同产区/品种红酒（如波尔多五级庄+加州纳帕+智利佳美娜+澳洲西拉），同时购买一本入门品鉴指南&#x27;,feedback:&#x27;这是&quot;建立坐标系&quot;的正确方法。不同产区/品种的对比是最快的品鉴学习路径。一本书帮你建立&quot;观色/闻香/品味&quot;的方法论框架。3000元刚好覆盖4瓶品质不错的酒+一本专业入门书。&#x27;,mks:&#x27;★ MKS核心&quot;风味审美&quot;：品鉴能力来自&quot;比较&quot;而非&quot;单点体验&quot;。4个产区=4个坐标点，帮你建立味觉参照系。&#x27;},
      {label:&#x27;参加一个红酒品鉴课程（通常含多款酒样），花全部预算在&quot;知识&quot;上&#x27;,feedback:&#x27;这也是非常好的选择。品鉴课程提供的是&quot;引导式对比品鉴&quot;——在老师带领下同时品尝多款酒，快速建立判断标准。缺点是缺少&quot;自己的酒&quot;可以后续练习和回顾。&#x27;,mks:&#x27;如果预算允许，最佳策略是&quot;课程+自购2瓶练习&quot;的组合。但纯课程投入也远优于买一瓶名酒。&#x27;}
    ]},
    {scene:&#x27;你看到朋友圈有人买了最新款的徕卡相机（3万+），拍的照片还不如你的手机。你觉得问题出在哪？&#x27;,opts:[
      {label:&#x27;他买到了假货或低端型号，性能不行&#x27;,feedback:&#x27;徕卡的品质是世界顶级的——问题基本不可能在设备上。这恰好符合&quot;器材党&quot;现象的描述：高端设备但停留在&quot;记录&quot;思维。&#x27;,mks:&#x27;本模块反复强调的核心认知：摄影的第一要素不是设备，是&quot;到达&quot;和&quot;视角&quot;。8844米用手机&gt;3000米用专业设备。&#x27;},
      {label:&#x27;他没有掌握摄影的基本功——端平、对焦、曝光、构图、主题&#x27;,feedback:&#x27;这是最可能的诊断。没有基本功，再贵的设备也是浪费。好照片需要客观技术基础（端平/清晰/曝光/构图/主题/光线/色彩）+ 主观审美。&#x27;,mks:&#x27;★ MKS核心&quot;摄影创作链&quot;：到达&gt;视角&gt;构图&gt;光影&gt;后期。设备甚至不在这个链条里——它是&quot;辅助&quot;而非&quot;要素&quot;。&#x27;},
      {label:&#x27;他的审美不行——没有&quot;摄影眼&quot;，拍不出好照片是性格问题&#x27;,feedback:&#x27;&quot;审美&quot;确实是可以训练的能力，不是天生&quot;有&quot;或&quot;没有&quot;。问题不在于&quot;性格&quot;而在于&quot;方法论&quot;。他没有停下来思考：我的主题是什么？我的视角在哪里？哪些元素应该舍弃？&#x27;,mks:&#x27;★ 最核心的MKS元认知：审美是可以训练的能力。不是&quot;他审美不行所以拍不好&quot;，而是&quot;他没有接受训练所以还没建立审美判断框架&quot;。&#x27;}
    ]}
  ];

  let h=&#x27;&#x27;;
  rounds.forEach((r,i)=&gt;{
    h+=&#x27;&lt;div class=&quot;decision-round&quot; id=&quot;dr_&#x27;+i+&#x27;&quot;&gt;&lt;h4&gt;第&#x27;+(i+1)+&#x27;轮：&#x27;+r.scene+&#x27;&lt;/h4&gt;&#x27;;
    r.opts.forEach((o,j)=&gt;{
      h+=&#x27;&lt;button class=&quot;opt-btn&quot; onclick=&quot;pickDecision(&#x27;+i+&#x27;,&#x27;+j+&#x27;,\&#x27;&#x27;+o.feedback.replace(/&#x27;/g,&quot;\\&#x27;&quot;)+&#x27;\&#x27;,\&#x27;&#x27;+o.mks.replace(/&#x27;/g,&quot;\\&#x27;&quot;)+&#x27;\&#x27;)&quot;&gt;&#x27;+(j===0?&#x27;A&#x27;:j===1?&#x27;B&#x27;:&#x27;C&#x27;)+&#x27;. &#x27;+o.label+&#x27;&lt;/button&gt;&#x27;;
    });
    h+=&#x27;&lt;div id=&quot;dfb_&#x27;+i+&#x27;&quot; style=&quot;display:none;margin-top:12px;padding:12px;border-radius:8px&quot;&gt;&lt;/div&gt;&lt;/div&gt;&#x27;;
  });
  document.getElementById(&#x27;decisionSim&#x27;).innerHTML=h;
}

function pickDecision(roundIdx,optIdx,feedback,mks){
  const fb=document.getElementById(&#x27;dfb_&#x27;+roundIdx);
  const btns=document.querySelectorAll(&#x27;#dr_&#x27;+roundIdx+&#x27; .opt-btn&#x27;);
  btns.forEach((b,j)=&gt;{ b.classList.remove(&#x27;selected&#x27;); if(j===optIdx) b.classList.add(&#x27;selected&#x27;); b.style.pointerEvents=&#x27;none&#x27;; });
  fb.style.display=&#x27;block&#x27;;
  fb.style.background=optIdx===1?&#x27;#d4edda&#x27;:&#x27;#fdf6ec&#x27;;
  fb.style.border=optIdx===1?&#x27;1px solid #27ae60&#x27;:&#x27;1px solid var(--border)&#x27;;

 example:&#x27;爱因斯坦的广义相对论预言光线会在引力场中弯曲——这是一个可证伪的预测。1919年日食观测证实了它。如果观测结果不符，理论就会被推翻。&#x27;,
 counter:&#x27;&quot;明天可能下雨也可能不下&quot;——这个陈述永远正确，但毫无信息量，因为它不可证伪。算命先生说&quot;你近期会有贵人相助&quot;同样无法被证明错误。&#x27;},
{id:&#x27;logic&#x27;,name:&#x27;逻辑判断&#x27;,icon:&#x27;🧠&#x27;,star:true,
 def:&#x27;运用逻辑推理筛选信息，识别论证中的矛盾、谬误和不合理假设。在信息过载时代，这是最稀缺的过滤能力。&#x27;,
 analogy:&#x27;像一个思维&quot;筛子&quot;——把信息放进去，筛掉那些逻辑不自洽的，留下经得起推敲的。好的论证像精密的瑞士手表，每个齿轮都咬合紧密。&#x27;,
 example:&#x27;面对&quot;罗斯柴尔德家族财富以6%年增长率持续200年已达几十万亿美元&quot;的说法，吴军用逻辑反驳：如果陶朱公1两银子以6%增长2500年，财富将达10^63两，远超宇宙原子总数，由此揭露指数增长在现实中的荒谬性。&#x27;,
 counter:&#x27;&quot;英国靠老处女称霸世界&quot;——猫多→老鼠少→蜜蜂多→苜蓿多→牛多→牛肉多→水手强→海军强→称霸。每步仅有微弱相关性，经多轮传递后关联近乎为零，是典型过度解读。&#x27;},
{id:&#x27;cost&#x27;,name:&#x27;大学之道：在二流大学接受一流教育&#x27;,icon:&#x27;💰&#x27;,star:false,
 def:&#x27;通过分析行为背后的投入-产出逻辑，判断动机的合理性。理解&quot;没有免费的午餐&quot;，透过表面看本质。&#x27;,
 analogy:&#x27;如同一副&quot;商业透视镜&quot;——戴上它，你看到的不再是销售人员热情的笑脸，而是他投入的时间成本和获客成本，以及这些成本最终由谁买单。&#x27;,
 example:&#x27;老年人购买保健品：销售人员投入大量时间陪伴老人（时间成本），失败推销的成本需分摊到成交客户身上（获客成本），而保健品公司&quot;出事即跑路&quot;（犯错成本极低）。三方面揭示&quot;关心&quot;背后的逐利本质。&#x27;,
 counter:&#x27;明星媒体人创业失败——原以为名气=能力，但忽略了原单位平台提供的背书价值。一旦脱离平台，维持名气的成本剧增而收益锐减。&#x27;},
{id:&#x27;cross&#x27;,name:&#x27;阅读的价值：怡情·养性·长智&#x27;,icon:&#x27;🔄&#x27;,star:false,
 def:&#x27;跨领域融合产生创新，打破单一思维定式。真正的跨界是结果而非目的，需要扎实的原领域基础。&#x27;,
 analogy:&#x27;如同生物界的&quot;杂交优势&quot;——两种不同基因的植物杂交，往往产生更优秀的后代。但前提是每一方的基因都足够优秀和稳定。&#x27;,
 example:&#x27;贾里尼克（通信领域专家）将人工智能视为通信/数据问题而非模仿人类智能，突破传统计算机科学家的思维定式。特斯拉将IT领域的锂电池技术引入汽车行业，解决传统车企铅酸电池续航难题。&#x27;,
 counter:&#x27;跨界不是&quot;浅尝辄止&quot;。爱因斯坦的小提琴仅为爱好（水平不高），不是真正的跨界。真正的跨界如冯·诺依曼——在数学、计算机、物理、博弈论等多个领域都有深刻建树。&#x27;},
{id:&#x27;subtract&#x27;,name:&#x27;减法思维&#x27;,icon:&#x27;➖&#x27;,star:true,
 def:&#x27;生命有限，主动舍弃无关紧要的事务，聚焦核心目标。&quot;吾生也有涯，而知也无涯&quot;——以有限追无限，必败。&#x27;,
 analogy:&#x27;就像整理一个塞满杂物的房间——不是往里添置新柜子，而是果断扔掉不需要的东西。腾出的空间才是真正的收获。&#x27;,
 example:&#x27;吴军2014年底从Google辞职：常规思维是高薪工作应优先保障，但他以&quot;时间价值最大化&quot;为标准，发现占用最多时间的高薪工作恰恰是需要舍弃的对象。硅谷一家视频识别公司从长长的任务清单减到仅保留1件核心事，最终被亚马逊高价收购。&#x27;,
 counter:&#x27;同时做很多事的&quot;低水平忙碌&quot;——两倍时间仅获两倍收益。而集中时间做好一件事，两倍时间可获10倍收益。捡芝麻的人永远没有时间捡西瓜。&#x27;},
{id:&#x27;common&#x27;,name:&#x27;常识判断&#x27;,icon:&#x27;💡&#x27;,star:true,
 def:&#x27;常识优于复杂模型，简单规律胜过新奇解释。经过长期证伪筛选的常识，往往比&quot;专家&quot;的复杂理论更可靠。&#x27;,
 analogy:&#x27;就像天气预报——老祖宗看云识天气的经验（&quot;朝霞不出门，晚霞行千里&quot;）有时比复杂的数值预报模型还准。常识是千百年经验浓缩的智慧。&#x27;,
 example:&#x27;巴菲特不看《华尔街日报》、不信股评、不画K线。他通过逛百货店观察商品受欢迎程度、看店铺顾客数量来判断投资标的。2008年通过比较苹果店与微软店的顾客流量，准确预测苹果市值将超越微软。&#x27;,
 counter:&#x27;过度解读的&quot;新奇解释&quot;——如将温州个别老板跑路推导为中国经济寒冬，忽视数十万家企业中个别案例不具统计意义。常识告诉我们：个别企业破产是行业整合常态。&#x27;},
{id:&#x27;professional&#x27;,name:&#x27;专业素养&#x27;,icon:&#x27;🏆&#x27;,star:false,
 def:&#x27;稳定性 + 流程化 + 体系知识 + 持续学习。职业选手与业余选手的本质区别不在于偶尔的超常发挥，而在于持续稳定的高水平输出。&#x27;,
 analogy:&#x27;就像一个顶级钢琴家演奏简单的《小奏鸣曲》——看似平凡的曲目，却能弹出丰富的层次感和情感张力。真正的专业是在简单事物上展现极致水准。&#x27;,
 example:&#x27;吴军与职业高尔夫教练杰夫同场竞技：杰夫9洞成绩-3杆（持续稳定），而吴军+9杆（好球与坏球交替）。职业选手的稳定发挥来自于严格遵循流程、情绪控制和系统的做事方法。约翰·霍普金斯名医检查近视时先系统排查罕见风险再定位病因，而普通医生缺乏章法。&#x27;,
 counter:&#x27;业余爱好者可能偶尔打出&quot;神仙球&quot;，但无法复制。就像&quot;民间科学家&quot;可能碰巧说对一件事，但缺乏系统方法和可重复性，无法稳定输出。&#x27;},
{id:&#x27;gradual&#x27;,name:&#x27;渐进改良&#x27;,icon:&#x27;📈&#x27;,star:false,
 def:&#x27;&quot;最好是更好的敌人&quot;——过度追求完美可能导致一事无成，接受阶段性改进反而更有效。迭代优于一步到位。&#x27;,
 analogy:&#x27;就像手机系统更新——不是等一个&quot;完美版本&quot;再发布，而是每周/每月推送小更新，不断修复bug、增加功能。多次&quot;更好&quot;的累积最终超越一次&quot;最好&quot;。&#x27;,
 example:&#x27;美国禁枪法案：民主党追求全面禁枪（&quot;最好&quot;），共和党只同意背景调查（&quot;更好&quot;），双方互不让步导致法案均未通过，禁枪改革完全失败。如果接受部分改进（如对不良记录者禁枪），至少能实现有限成果。Google核心服务每周更新一次，即使部分功能未交付也按时上线。&#x27;,
 counter:&#x27;特斯拉电动车：存在做工粗糙、系统死机等问题，但通过持续迭代5年间品质提升速度远超传统车企。若追求初始完美，可能&quot;十几年造不出车&quot;。&#x27;},
{id:&#x27;expectation&#x27;,name:&#x27;哈佛艾略特的教育改革&#x27;,icon:&#x27;📊&#x27;,star:false,
 def:&#x27;通过定义合理的收益函数驱动系统自动优化。在组织管理中，设定正确的激励机制比&quot;教育员工&quot;更有效。&#x27;,
 analogy:&#x27;就像设计一个自动导航系统——你不需要手动控制每一个操作，只需设定好目的地（收益函数），导航系统会自动计算出最优路径并不断调整方向。&#x27;,
 example:&#x27;高考政策：若体育成绩占高考50%，家长就会自动让孩子参加体育锻炼，学校会加大体育投入，全社会资源向体育倾斜——不需要任何行政命令，收益函数自然驱动。Google将专利奖励从降至1万美元/专利，专利数量立刻跃居全球前十。IBM将专利申请与绩效挂钩，成为美国专利数量冠军。&#x27;,
 counter:&#x27;只讲价值观不设计激励——很多公司天天开会&quot;教育员工&quot;要创新、要合作，但考核体系却只奖励短期业绩。员工行为会向收益函数方向优化，而非口头说教的方向。&#x27;},
{id:&#x27;tenk&#x27;,name:&#x27;一万小时定律&#x27;,icon:&#x27;⏱&#x27;,star:false,
 def:&#x27;技能精进需要有效积累而非简单重复。避免四大误区：简单重复、习惯性失败、林黛玉式困境（自我封闭）、狗熊掰棒子（无积累）。&#x27;,
 analogy:&#x27;就像运动员训练——不是每天跑同样的距离就叫训练，而是要有针对性地突破自己的极限。有效的一万小时像是雕刻家反复雕琢，无效的一万小时像是水流反复冲刷同一块石头。&#x27;,
 example:&#x27;吴军提出&quot;三板斧&quot;破解四大困境：第一板斧&quot;愿景-目标-道路&quot;避免简单重复；第二板斧&quot;从不同意见中找合理之处&quot;打破习惯性失败和林黛玉式困境；第三板斧&quot;凡事做记录&quot;解决狗熊掰棒子问题。&#x27;,
 counter:&#x27;伪工作者：每天加班到很晚，但做的都是简单重复的&quot;伪工作&quot;，遇到困难不学习不请教，十年经验相当于一年经验重复了十次。&#x27;}
];

var MCQS = [{&quot;q&quot;:&quot;关于\&quot;证伪思维\&quot;，以下哪项理解是正确的？&quot;,&quot;opts&quot;:[&quot;科学理论必须可被证明错误&quot;,&quot;科学理论必须被证明正确才能成立&quot;,&quot;不可证伪的陈述也可能是科学理论&quot;,&quot;证伪与证实是同一回事&quot;],&quot;answer&quot;:0,&quot;exp&quot;:&quot;证伪思维的核心是卡尔·波普尔提出的\&quot;可证伪性\&quot;标准：一个理论只有具备被事实证明为错误的可能性，才是科学的。例如\&quot;明天可能下雨\&quot;不可证伪（永远正确），而\&quot;水在标准大气压下100°C沸腾\&quot;可证伪。&quot;},{&quot;q&quot;:&quot;减法思维的核心哲学依据来自哪里？&quot;,&quot;opts&quot;:[&quot;庄子的\&quot;吾生也有涯，而知也无涯\&quot;&quot;,&quot;孔子的\&quot;学而不思则罔\&quot;&quot;,&quot;老子的\&quot;道可道非常道\&quot;&quot;,&quot;孟子的\&quot;鱼与熊掌不可兼得\&quot;&quot;],&quot;answer&quot;:0,&quot;exp&quot;:&quot;庄子在《养生主》中写道：\&quot;吾生也有涯，而知也无涯，以有涯随无涯，殆矣。\&quot;意为生命有限而知识/事务无限，以有限追求无限必然失败。这是减法思维的哲学根基——必须学会舍弃。&quot;},{&quot;q&quot;:&quot;为什么\&quot;最好的医生不一定是救人最多的医生\&quot;？&quot;,&quot;opts&quot;:[&quot;名医与普通好医生的差距在于治疗效果的稳定性和可预期性&quot;,&quot;名医运气更好&quot;,&quot;普通医生更努力&quot;,&quot;名医只治疗简单的病&quot;],&quot;answer&quot;:0,&quot;exp&quot;:&quot;名医与普通好医生的差异不在于能否治好绝症（绝症谁也无法），而在于治疗效果的稳定性和可预期性。专业素养体现在稳定高质量的输出，而非偶尔的超常发挥。这呼应了职业选手vs业余选手的核心差异。&quot;},{&quot;q&quot;:&quot;\&quot;以正合，以奇胜\&quot;中\&quot;奇\&quot;字的正确读法和含义是什么？&quot;,&quot;opts&quot;:[&quot;读jī，意为\&quot;多余的\&quot;、补充手段&quot;,&quot;读qí，意为出乎意料的策略&quot;,&quot;读qí，意为奇怪的战术&quot;,&quot;读jī，意为奇袭和偷袭&quot;],&quot;answer&quot;:0,&quot;exp&quot;:&quot;孙子兵法中的\&quot;奇\&quot;读jī（不是qí），指\&quot;多余的\&quot;即机动兵力或补充手段。核心理念是先掌握根本（正），再考虑补充（奇），而非本末倒置追求\&quot;出奇制胜\&quot;。唐朝名将李靖在《唐太宗李靖问对》中有权威诠释。&quot;},{&quot;q&quot;:&quot;富兰克林的成功五要素中，最核心的一条是什么？&quot;,&quot;opts&quot;:[&quot;掌握稀缺技能&quot;,&quot;不断跳槽寻找更好机会&quot;,&quot;不争功，敢于肯定他人贡献&quot;,&quot;多读书&quot;],&quot;answer&quot;:0,&quot;exp&quot;:&quot;富兰克林选择当时新大陆稀缺的印刷术并成为行业专家，通过稀缺技能获得不可替代性。吴军也凭借稀缺的自然语言处理技术进入早期Google。稀缺技能是安身立命的根本，是财务自由的起点，也是其他四要素的基础。&quot;},{&quot;q&quot;:&quot;\&quot;英国靠老处女称霸世界\&quot;这个推导最典型的逻辑谬误是什么？&quot;,&quot;opts&quot;:[&quot;循环论证&quot;,&quot;过度解读与牵强因果&quot;,&quot;以偏概全&quot;,&quot;偷换概念&quot;],&quot;answer&quot;:1,&quot;exp&quot;:&quot;推导链条\&quot;老处女多→猫多→老鼠少→蜜蜂多→苜蓿多→牛多→牛肉好→水手强→海军强\&quot;每步仅有微弱相关性，经多轮传递后关联性近乎为零。这是典型的过度解读和牵强附会，是\&quot;弱关联因果链\&quot;的逻辑谬误。&quot;},{&quot;q&quot;:&quot;巴菲特最推崇的投资智慧是什么？&quot;,&quot;opts&quot;:[&quot;精通K线技术分析&quot;,&quot;依靠常识判断&quot;,&quot;掌握复杂的数学模型&quot;,&quot;听从经济学家建议&quot;],&quot;answer&quot;:1,&quot;exp&quot;:&quot;巴菲特不看《华尔街日报》、不信股评、不画K线。他通过逛百货店观察顾客数量、看产品受欢迎程度来做投资判断。他的经验证明：常识（低买高卖、从生活中观察）比任何复杂模型都更可靠。&quot;},{&quot;q&quot;:&quot;渐进改良的核心思想\&quot;最好是更好的敌人\&quot;在禁枪法案中如何体现？&quot;,&quot;opts&quot;:[&quot;禁枪法案本就不该提出&quot;,&quot;双方互不让步导致任何法案都未通过，禁枪改革完全失败&quot;,&quot;共和党的方案更好&quot;,&quot;民主党的方案最好&quot;],&quot;answer&quot;:1,&quot;exp&quot;:&quot;民主党追求全面禁枪（\&quot;最好\&quot;），共和党只要背景调查（\&quot;更好\&quot;），双方拒绝折中，结果两个法案均未通过。若双方接受部分改进（如对不良记录者禁枪），至少能实现有限成果。\&quot;最好是更好的敌人\&quot;——追求完美可能导致一事无成。&quot;},{&quot;q&quot;:&quot;哈佛艾略特的教育改革原理在组织管理中最重要的启示是什么？&quot;,&quot;opts&quot;:[&quot;管理者应多开会对员工进行教育&quot;,&quot;设计科学的收益函数（激励机制），系统会自动优化&quot;,&quot;给员工更高的薪水&quot;,&quot;让员工自主决定工作内容&quot;],&quot;answer&quot;:1,&quot;exp&quot;:&quot;组织设计的激励机制就是\&quot;收益函数\&quot;，员工行为会自动向最大化该函数的方向调整。与其开会\&quot;教育员工\&quot;，不如设计合理的考核标准。如IBM将专利申请与绩效挂钩→成为专利冠军；Google提高专利奖励→专利数量跃居全球前十。&quot;},{&quot;q&quot;:&quot;托勒密的地心说虽然被推翻，但它仍然被认为是科学典范，为什么？&quot;,&quot;opts&quot;:[&quot;因为它被使用了很长时间&quot;,&quot;因为它具有可证伪性，且在当时具备数学正确性和预测精度&quot;,&quot;因为它是教会的官方理论&quot;,&quot;因为它很简单&quot;],&quot;answer&quot;:1,&quot;exp&quot;:&quot;托勒密地心说构建了精妙的数学模型，每100年误差不超过1天，具备可证伪性和可验证的预测能力。虽然后来被日心说推翻，但符合科学方法的本质要求——可检验、可证伪。科学方法比结论更重要。&quot;},{&quot;q&quot;:&quot;为什么保健品销售人员的\&quot;关心\&quot;需要用大学之道：在二流大学接受一流教育来审视？&quot;,&quot;opts&quot;:[&quot;因为他们不专业&quot;,&quot;因为他们卖的产品太贵&quot;,&quot;因为他们投入大量时间陪伴老人，这些成本最终由消费者承担&quot;,&quot;因为他们不了解老人的真实需求&quot;],&quot;answer&quot;:2,&quot;exp&quot;:&quot;大学之道：在二流大学接受一流教育揭示：销售人员投入大量时间陪伴老人（时间成本）、失败推销需分摊到成交客户（获客成本）、\&quot;出事即跑路\&quot;（犯错成本极低）。三方面都说明\&quot;关心\&quot;背后是逐利驱动，而非真正关爱。&quot;},{&quot;q&quot;:&quot;职业选手与业余选手最本质的区别是什么？&quot;,&quot;opts&quot;:[&quot;职业选手更有天赋&quot;,&quot;职业选手训练时间更长&quot;,&quot;稳定性——持续稳定地高水平发挥&quot;,&quot;职业选手更年轻&quot;],&quot;answer&quot;:2,&quot;exp&quot;:&quot;以高尔夫为例：业余选手好球与坏球交替出现（如+9杆），职业选手持续稳定（-3杆）。专业素养的核心是稳定性、流程化方法、情绪控制和系统知识，而非偶尔的超常发挥。专业素养的四大支柱：工作优先、严格流程、主动求优、体系知识。&quot;},{&quot;q&quot;:&quot;一万小时定律的\&quot;三板斧\&quot;中，哪一板斧专门解决\&quot;狗熊掰棒子\&quot;问题？&quot;,&quot;opts&quot;:[&quot;愿景-目标-道路规划&quot;,&quot;从不同意见中找合理性&quot;,&quot;凡事做记录&quot;,&quot;专注一个领域不跨界&quot;],&quot;answer&quot;:2,&quot;exp&quot;:&quot;第三板斧\&quot;凡事做记录\&quot;专门破解\&quot;狗熊掰棒子\&quot;（无积累效应）。通过系统性记录实现经验积累与传承，避免同一问题反复解决。记录过程本身也是深化思考的过程，加速进步。&quot;},{&quot;q&quot;:&quot;以下哪个陈述符合\&quot;可证伪性\&quot;标准？&quot;,&quot;opts&quot;:[&quot;上帝是全能的&quot;,&quot;明天要么下雨要么不下雨&quot;,&quot;广义相对论预言光线在引力场中弯曲&quot;,&quot;心诚则灵&quot;],&quot;answer&quot;:2,&quot;exp&quot;:&quot;爱因斯坦的预言\&quot;光线会在引力场中弯曲\&quot;可被观测检验（1919年日食证实），如果观测不符理论就被推翻。而\&quot;上帝全能\&quot;\&quot;心诚则灵\&quot;等陈述无论如何都无法被证明错误，因此不是科学命题。\&quot;明天要么下雨要么不下雨\&quot;是永真命题，无实际意义。&quot;},{&quot;q&quot;:&quot;\&quot;不选择反而获得幸福\&quot;这一研究结论背后的核心机制是什么？&quot;,&quot;opts&quot;:[&quot;选择越多人越懒&quot;,&quot;不选择是因为没有能力&quot;,&quot;选择少时人们更注重经营现有的关系和工作&quot;,&quot;选择多会导致破产&quot;],&quot;answer&quot;:2,&quot;exp&quot;:&quot;奚恺元教授研究发现：印度人婚姻满意度不低于美国人，因选择少（种姓制度限制），更注重经营婚姻。同理，选择少的印度裔员工因无退路，更专注于职业发展。幸福感与成就更多是\&quot;经营\&quot;的结果，而非反复选择的结果。&quot;},{&quot;q&quot;:&quot;真正有效的跨界需要什么先决条件？&quot;,&quot;opts&quot;:[&quot;有多个领域的兴趣&quot;,&quot;认识很多不同领域的人&quot;,&quot;有跨学科的学位&quot;,&quot;在原领域具备扎实的专业素养和成功基础&quot;],&quot;answer&quot;:3,&quot;exp&quot;:&quot;吴军强调：跨界是结果而非目的，前提是在原领域具备专业素养和成功基础。如摩尔斯（画家→电报发明人）在绘画领域已成名，华盛顿（勘测员→将军）具备扎实的地形知识和数学能力。没有原领域的\&quot;正\&quot;，跨界的\&quot;奇\&quot;就失去了根基。&quot;},{&quot;q&quot;:&quot;吴军用\&quot;陶朱公1两银子增长2500年\&quot;的类比是为了反驳什么？&quot;,&quot;opts&quot;:[&quot;通货膨胀理论&quot;,&quot;中国历史上的财富积累&quot;,&quot;银子的购买力变化&quot;,&quot;罗斯柴尔德家族财富持续指数增长的说法&quot;],&quot;answer&quot;:3,&quot;exp&quot;:&quot;有人声称罗斯柴尔德家族财富以6%年增长率持续200年已达几十万亿美元。吴军以陶朱公为例证：1两银子以6%增长2500年后达10^63两，远超宇宙原子总数。现实中无任何实体可实现长期指数增长，由此揭露阴谋论的荒谬。&quot;},{&quot;q&quot;:&quot;第欧根尼的极简生活哲学对现代人的核心启示是什么？&quot;,&quot;opts&quot;:[&quot;所有人都应该住木桶&quot;,&quot;拒绝所有社交活动&quot;,&quot;不要工作只追求享乐&quot;,&quot;减少对物质的过度关注以提升精神自由&quot;],&quot;answer&quot;:3,&quot;exp&quot;:&quot;第欧根尼主张\&quot;钱财应改善生活而非增加负担\&quot;，多数物质享受\&quot;可有可无\&quot;。吴军将其发展为减法思维：舍弃\&quot;花精力却未必有价值\&quot;的事务，将有限时间集中于真正重要的事情。物质减法带来精神加法，这是\&quot;做减法\&quot;的人生哲学。&quot;},{&quot;q&quot;:&quot;莱特兄弟成功发明飞机的关键方法论是什么？&quot;,&quot;opts&quot;:[&quot;运气特别好&quot;,&quot;资金非常充足&quot;,&quot;政府的支持&quot;,&quot;充分准备、理论指导、科学方法（风洞试验）&quot;],&quot;answer&quot;:3,&quot;exp&quot;:&quot;莱特兄弟的三大方法论：1）充分准备——宁可做700-1000次滑翔试验也不仓促试飞；2）理论指导——系统学习空气动力学，修正李林塔尔升力计算误差（多算60%）；3）科学方法——通过风洞进行可重复试验，测试200多种翼形。这是专业方法论战胜\&quot;民间科学家\&quot;的经典案例。&quot;},{&quot;q&quot;:&quot;为什么\&quot;给员工少一点选择\&quot;反而能提升管理效率？&quot;,&quot;opts&quot;:[&quot;员工不喜欢选择&quot;,&quot;这样做可以节省公司成本&quot;,&quot;员工会感恩公司&quot;,&quot;选择越少，员工越专注于手头工作，满意度反而更高&quot;],&quot;answer&quot;:3,&quot;exp&quot;:&quot;腾讯旅游福利案例：提供北海道滑雪和普吉岛两个选项→员工互相羡慕后悔；改为仅保留一个目的地→满意度反而更高。幸福学原理：选择多导致\&quot;这山望着那山高\&quot;，降低满足感。限制选择反而提升管理效率，本田汽车短产品线策略同理。&quot;}];

{concept:&#x27;证伪思维&#x27;,qas:[
 {q:&#x27;第一层：什么是&quot;不可证伪&quot;？为什么说算命先生的预言不可证伪？&#x27;,
  a:&#x27;不可证伪意味着一个陈述无法被任何可观测的事实证明为错误。算命先生说&quot;你近期会有贵人相助&quot;——如果没遇到，他可以说&quot;贵人已经出现但你没认出来&quot;或者&quot;还没到近期&quot;。这个说法总能找到借口自圆其说，所以不可证伪。相比之下，医生说&quot;你的血压是140/90mmHg&quot;是可证伪的——换一台血压计测就能验证。&#x27;},
 {q:&#x27;第二层：可证伪性是不是要求每个科学理论都必须是&quot;错的&quot;？&#x27;,
  a:&#x27;不是。可证伪性不是要求理论必须是错的，而是要求它具备&quot;被证明为错的可能性&quot;。就像说&quot;这个箱子装着一只猫&quot;——你可以打开箱子验证，可能看到猫（证实），也可能没看到（证伪）。但如果说&quot;这个箱子里有一个看不见摸不着的精灵&quot;，就无法验证。科学理论的强大恰恰在于它敢于接受最严格的检验。爱因斯坦预言行星光线的弯曲，就是把自己的理论放在被证伪的位置上。&#x27;},
 {q:&#x27;第三层：如果科学理论最终都可能被推翻，我们为什么要学习当前的科学知识？&#x27;,
  a:&#x27;这是一个深刻的问题。科学的进步不是简单地否定过去，而是在保留已有正确内容的基础上扩展。牛顿力学在高速微观世界被相对论和量子力学修正，但在地球上的日常应用中，牛顿力学依然是精确的。科学知识的价值不在于&quot;永远正确&quot;，而在于它是目前经过最严格检验的认识。就像你使用的地图——虽然可能不完美（新路没标注），但比没有地图强一万倍，而且会不断更新。&#x27;}
]},
{concept:&#x27;逻辑判断&#x27;,qas:[
 {q:&#x27;第一层：为什么说&quot;逻辑判断&quot;是信息时代最稀缺的能力？&#x27;,
  a:&#x27;因为我们每天接收的信息量是古人一年的量。面对大量相互矛盾的观点（&quot;专家&quot;说法常对立）、精心包装的伪科学、煽动情绪的标题党，如果没有逻辑筛选能力，就像在信息洪流中没有救生圈。逻辑判断提供了一个&quot;最低成本&quot;的过滤器——不需要你是每个领域的专家，只需要你能识别论证中的矛盾、谬误和不合理假设。判断对错的难度远低于解决问题本身（就像不需要会解二次方程也能验证X=2是否成立）。&#x27;},
 {q:&#x27;第二层：如何区分&quot;相关性&quot;和&quot;因果性&quot;？为什么这个区分如此重要？&#x27;,
  a:&#x27;相关性指两件事同时发生或关联变化，因果性则是一件事导致另一件事。冰淇淋销量和溺水率高度相关——是因为夏天热，两者都增加，而不是冰淇淋导致溺水。混淆两者的后果严重：如有人发现&quot;喝红酒的人更长寿&quot;，其实是喝红酒的人往往收入更高、医疗条件更好。&quot;老处女导致英国称霸&quot;就是典型的将弱相关性当作因果关系的荒唐案例。核心原则：时间上原因在前结果在后；有合理的机制解释；排除其他可能性。&#x27;},
 {q:&#x27;第三层：当面对两个逻辑上都成立但结论相反的理论（如凯恩斯主义vs哈耶克理论），应该如何判断？&#x27;,
  a:&#x27;需要理解&quot;逻辑自洽≠绝对正确&quot;。凯恩斯主义和哈耶克理论在各自预设前提下都是逻辑严密的。判断方式：1）考察前提假设在当下的适用性（如是否是经济危机时期）；2）看实证证据（哪种政策在类似国家/时期产生过更好效果）；3）理解理论的边界条件（没有放之四海皆准的理论）。关键思维：不是非此即彼，而是在具体情境中判断哪个理论的假设更贴近现实。就像工具——锤子和螺丝刀哪个更好？取决于你要钉钉子还是拧螺丝。&#x27;}
]},
{concept:&#x27;大学之道：在二流大学接受一流教育&#x27;,qas:[
 {q:&#x27;第一层：为什么说分析行为背后的&quot;投入-产出&quot;逻辑就能判断动机？&#x27;,
  a:&#x27;因为任何理性行为都有成本。如果一个人长期投入大量时间精力做某件事，必定有相应的收益来源。保健品销售人员每天花几小时陪老人聊天、送小礼品——如果这些投入不能从老人身上赚回数倍的钱，他的行为在经济上就是不可持续的。大学之道：在二流大学接受一流教育就是透过表面的&quot;善意&quot;看穿背后的商业逻辑。当然这不是说所有善意都是假的，而是说持续的、大量的投入一定有其经济基础支撑。&#x27;},
 {q:&#x27;第二层：&quot;免费&quot;的内容为什么往往是最贵的？&#x27;,
  a:&#x27;从大学之道：在二流大学接受一流教育分析：优质内容的创作需要时间、专业知识和精力投入。如果创作者长期&quot;免费&quot;产出，他的时间成本无法覆盖，要么降低质量，要么找到其他盈利模式（广告、诱导消费等）。免费的代价往往是：1）你的注意力被卖给广告商；2）你需要花大量时间筛选劣质信息；3）你可能被诱导做出不利的消费决策。免费获取转载内容需付出&quot;筛选时间成本&quot;，与直接付费的总成本相近。这就是&quot;天下没有免费的午餐&quot;。&#x27;},
 {q:&#x27;第三层：大学之道：在二流大学接受一流教育有什么局限性？当成本和收益难以量化时怎么办？&#x27;,
  a:&#x27;大学之道：在二流大学接受一流教育的主要局限：1）非经济动机——有些行为由情感、信仰、好奇心驱动（如志愿者工作），不能单纯用经济成本解释；2）量化困难——时间成本、情感成本难以精确衡量；3）长期vs短期——短期成本高但长期收益大的行为（如学习）可能被误判。应对方法：对可量化的用成本分析（商业行为），对不可量化的辅以其他判断工具（价值观、常识、逻辑）。大学之道：在二流大学接受一流教育是一个强大的分析起点，但不是唯一的判断标准。&#x27;}
]},
{concept:&#x27;减法思维&#x27;,qas:[
 {q:&#x27;第一层：庄子说&quot;吾生也有涯，而知也无涯&quot;，这个&quot;知&quot;具体指什么？&#x27;,
  a:&#x27;庄子的&quot;知&quot;不仅指知识，更包括所有可能做的事情、想追求的目标、想拥有的东西。现代社会尤甚——好书读不完、好课上不完、社交应酬不完美、工作机会抓不完。如果试图什么都做、什么都学、什么都拥有，结果一定是每件事都做不好、学不精、得不到。庄子的洞见在于：不是鼓励我们不学习，而是提醒我们——因为生命有限，所以必须做出取舍，把有限的时间花在真正重要的事情上。&#x27;},
 {q:&#x27;第二层：&quot;做减法&quot;表面上是放弃，为什么实际上是一种积极的策略？&#x27;,
  a:&#x27;因为减法不是消极地&quot;什么都不做&quot;，而是主动地&quot;选择做什么&quot;。减法思维的核心是&quot;少做事情，做好事情&quot;。把精力从10件事分散到每件上，每件只能做到60分；集中到3件事上，每件可以做到90分。后者带来的总价值远高于前者。硅谷创业公司的案例最有说服力：从长长的任务清单一路减到只剩下1件&quot;减掉就不再是自己&quot;的核心事，最终被高价收购。放弃次要目标，才能确保核心目标的达成。&#x27;},
 {q:&#x27;第三层：在现实中，如何区分&quot;应该减掉的&quot;和&quot;应该坚持的&quot;？有没有决策框架？&#x27;,
  a:&#x27;吴军提供了关键转换：从&quot;这件事是否该做&quot;转为&quot;不做这件事是否影响核心目标&quot;。具体框架：1）明确你的核心目标——一年后、五年后你希望成为什么样的人、达成什么事；2）列出所有当前占用的时间和精力项；3）对每一项问：如果砍掉它，我的核心目标会受多大影响？4）砍掉那些&quot;不影响核心目标&quot;或&quot;影响很小&quot;的事项。另一个标准：收益非线性——在低水平上做很多事，两倍时间仅获两倍收益；集中时间做好一件事，两倍时间可获10倍收益。选择&quot;西瓜&quot;而非&quot;芝麻&quot;。&#x27;}
]},
{concept:&#x27;常识判断&#x27;,qas:[
 {q:&#x27;第一层：什么是&quot;常识&quot;？它和&quot;专业知识&quot;是什么关系？&#x27;,
  a:&#x27;常识是经过长期实践检验、被广泛认可的基本道理。它和专业知识的根本区别在于：常识是&quot;门槛级&quot;的可靠认知，不需要深入学习特定领域的理论就能理解和运用。如&quot;低买高卖赚钱&quot;是投资常识，&quot;朝霞不出门，晚霞行千里&quot;是气象常识。常识和专业不是对立关系，而是互补——常识提供基础框架，专业知识在常识基础上深化。问题是很多人连常识都不用，一味追求复杂的&quot;新奇理论&quot;。&#x27;},
 {q:&#x27;第二层：为什么吴军说&quot;常识优于复杂模型&quot;？难道科学模型不比常识更准确吗？&#x27;,
  a:&#x27;关键不在于常识比模型更&quot;准确&quot;，而在于：1）常识的适用范围更广——不会用错语境。复杂模型的前提假设一旦不成立，结论就完全错误。2）常识经过千百年证伪筛选——存活下来的常识通常经得起考验。3）常识的&quot;简洁性&quot;本身就是优势——越复杂的模型越容易过度拟合。巴菲特的例子最好说明：他通过逛百货店观察顾客来投资，比依靠复杂金融模型的投行表现更好。当然，在工程和科学前沿，专业模型不可或缺。但日常生活中，常识通常够用且更可靠。&#x27;},
 {q:&#x27;第三层：如何辨别&quot;真常识&quot;和&quot;伪常识&quot;（即那些听起来像常识但其实是偏见/谬误的说法）？&#x27;,
  a:&#x27;这是一个重要的批判性问题。辨别框架：1）可证伪性检验——这个说法能被证明错误吗？&quot;十个光头九个富&quot;怎么证伪？2）来源追溯——它是来自长期经验总结还是某个人的断言？3）逻辑检验——&quot;不吃主食能减肥&quot;在逻辑上说得通吗（短期脱水减重≠长期减脂）？4）反例搜索——有没有明显反例？批评性思维不是拒绝常识，而是对常识保持适当的审视。真正的常识经得起反复检验，伪常识一戳就破。&#x27;}
]},
{concept:&#x27;专业素养&#x27;,qas:[
 {q:&#x27;第一层：专业和业余的本质区别究竟是什么？难道不是技能水平吗？&#x27;,
  a:&#x27;技能水平只是表象。本质区别在于三点：1）稳定性——业余选手可能偶尔打出&quot;神仙球&quot;但无法复制，职业选手持续稳定发挥。2）流程化——业余者靠感觉和天赋，职业者靠系统方法论。3）情绪控制——业余被打坏球影响心态，职业不受单次结果干扰。吴军与职业高尔夫教练的对决最能说明：职业选手-3杆稳定发挥，业余+9杆大起大落。专业不是&quot;顶峰更高&quot;，而是&quot;底线更高&quot;。&#x27;},
 {q:&#x27;第二层：专业素养的四大支柱中，哪一条最容易被忽视？为什么？&#x27;,
  a:&#x27;&quot;成体系的知识&quot;最容易被忽视。人们常以为专业人士就是&quot;懂得多&quot;，但关键不是知识点的数量，而是知识之间的系统关联。业余法律爱好者只能处理见过的案例（如特定财产纠纷），专业律师能应用广博知识解决千奇百怪的新问题（如Google遇到的无先例专利纠纷）。零散知识点像一堆砖头，成体系知识才是用砖头建起的房子。这就是为什么&quot;民间科学家&quot;即使看再多科普书，也无法与正规训练的科学家相比。&#x27;},
 {q:&#x27;第三层：在快速变化的时代，&quot;专业素养&quot;会不会变成&quot;僵化的包袱&quot;？如何平衡专业与灵活？&#x27;,
  a:&#x27;这是一个深刻的问题。专业素养的第四大支柱已经给出了答案：&quot;持续学习与技术更新&quot;是专业素养的保鲜剂。吴军的斯坦福毕业牙医15年来不断学习新技术（牙根治疗、植牙等），而那些停止进步的医生被淘汰。专业素养不是固守一套方法，而是拥有&quot;持续进化的方法论&quot;。专业者与业余者的另一个关键差异：专业者知道什么时候该打破规则。真正的专业素养=扎实的根基知识+系统的学习方法+开放的更新心态。&#x27;}
]},
{concept:&#x27;渐进改良&#x27;,qas:[
 {q:&#x27;第一层：为什么说&quot;最好是更好的敌人&quot;？追求完美有什么问题？&#x27;,
  a:&#x27;问题不在于&quot;追求完美&quot;这个目标本身，而在于它在行动上导致的后果：1）因为无法一步到位而迟迟不行动，导致完全无进展；2）各方都要&quot;最好方案&quot;，拒绝折中，导致连&quot;更好&quot;也无法实现；3）把时间和资源耗尽在一两个&quot;完美&quot;细节上，忽略了整体改进。禁枪法案就是典型：民主党的&quot;全面禁枪&quot;和共和党的&quot;背景调查&quot;——双方坚持各自&quot;最好&quot;，结果什么也没通过。追求完美是好的，但别让它成为行动的敌人。&#x27;},
 {q:&#x27;第二层：信息时代与工业时代的方法论差异说明了什么？&#x27;,
  a:&#x27;工业时代产品缺陷成本高（需要召回、重做），所以追求&quot;一步到位&quot;是理性的。但信息时代产品（软件、互联网服务）可以通过快速迭代低成本修正，使得&quot;先上线再改进&quot;成为更优策略。Google每周更新一次核心服务，特斯拉5年间品质飞速提升。这说明：方法论不是绝对的，而是要适应时代的技术条件。当试错成本降低时，渐进改良的优势就超过了&quot;一步到位&quot;。核心洞察：不是&quot;哪个方法更好&quot;，而是&quot;哪个方法更适合当下的约束条件&quot;。&#x27;},
 {q:&#x27;第三层：渐进改良是否意味着放弃远大理想？它和&quot;追求卓越&quot;矛盾吗？&#x27;,
  a:&#x27;完全不矛盾。渐进改良是&quot;怎么走&quot;的问题，追求卓越解决的是&quot;往哪走&quot;的问题。远大理想是方向，渐进改良是方法。&quot;以追求卓越为目标，以渐进改良为手段&quot;——在固定时间和成本约束下，接受&quot;这次做不到100分，但要比上次好&quot;，持续迭代最终会逼近卓越。吴军的经验：20%收益的&quot;更好&quot;改进×2次（总40%）优于30%收益的&quot;最好&quot;改进（即2+2&gt;3）。这不是放弃，而是更聪明的坚持。&#x27;}
]},
{concept:&#x27;阅读的价值：怡情·养性·长智&#x27;,qas:[
 {q:&#x27;第一层：为什么说&quot;跨界是结果而非目的&quot;？刻意追求跨界有什么风险？&#x27;,
  a:&#x27;因为真正的跨界成功者都不是为了&quot;跨界&quot;而跨界。摩尔斯因通信延迟未能见妻子最后一面，被激发出电报发明的动机——这是问题驱动而非标签驱动。刻意追求跨界的风险：在原领域缺乏专业素养就跨界的，往往是两头落空（新领域无基础，原领域技能丢失）。就像吴军警告的：若因原领域做不好而跨界，结果只会更糟。跨界的前提是在原领域已经证明了自己的专业素养和做事能力。跨界不是逃避，而是进阶。&#x27;},
 {q:&#x27;第二层：跨界创新的&quot;高势能向低势能&quot;规律是什么？为什么物理学家容易转生物/金融？&#x27;,
  a:&#x27;高势能向低势能跨界指：从更难、更具基础性的学科向相对容易、应用性强的学科迁移更容易成功。物理学需要极强的数学工具和抽象思维，这些能力可以直接迁移到生物学（如DNA结构发现者多为物理学家）和金融学（大量诺贝尔经济学奖得主有数学背景）。反过来几乎不可能（生物学家转为顶尖物理学家？极少）。因为高势能学科训练的是&quot;更底层、更抽象的思维能力&quot;，这种能力是通用的。&#x27;},
 {q:&#x27;第三层：在人工智能时代，跨界能力的价值是增加了还是减少了？个人应如何培养阅读的价值：怡情·养性·长智？&#x27;,
  a:&#x27;AI时代跨界能力的价值大大增加了。原因：1）AI擅长单一领域的重复性工作，而创新恰恰发生在领域交界处；2）AI工具降低了进入新领域的门槛，使得跨界更可行；3）最前沿的突破（如AI+生物医药、AI+材料科学）都在跨界地带。培养阅读的价值：怡情·养性·长智的方法：1）先在主领域建立扎实的专业素养——这是跨界的&quot;根据地&quot;；2）保持开放心态，主动关注其他领域的发展；3）系统学习新领域知识（而非&quot;看几本书&quot;的皮毛）；4）关注&quot;交界处&quot;的问题——别人解决不了的往往是因为只从一个角度看。&#x27;}
]},
{concept:&#x27;哈佛艾略特的教育改革&#x27;,qas:[
 {q:&#x27;第一层：什么是&quot;收益函数&quot;？为什么说它是系统自动优化的核心？&#x27;,
  a:&#x27;收益函数是衡量系统输出&quot;好坏&quot;的量化标准。在数学形式中，它是一个将系统状态映射到数值的函数——数值越大表示越&quot;好&quot;。系统的自动优化，就是不断调整参数以使这个函数的值最大化。就像AlphaGo的收益函数是&quot;赢棋概率&quot;——它所有的自我对弈都是在寻找让赢棋概率最大的走法。在社会系统中，收益函数就是&quot;激励机制&quot;——员工的行为会自然朝向让奖金最大化的方向。所以，设计对的人比教导对的人更有效。&#x27;},
 {q:&#x27;第二层：为什么说&quot;创始人基因决定公司基因&quot;？收益函数如何影响公司文化？&#x27;,
  a:&#x27;因为公司早期设定的考核标准（收益函数）会决定所有员工的行为方向，这些行为长期积累就形成了公司文化。Google早期奖励优质单元测试、惩戒代码错误→形成了重视工程质量的文化。Facebook强调产品迭代速度→发展为产品驱动型公司。短视型公司以销售指标为核心KPI→组织行为聚焦短期利益。创始人设定的第一个考核标准，就像给公司植入了&quot;基因&quot;——后续的招聘、晋升、资源分配都围绕这个标准展开，最终固化为文化。所以创始人要极其慎重地设计第一个收益函数。&#x27;},
 {q:&#x27;第三层：哈佛艾略特的教育改革原理在个人成长中如何应用？&#x27;,
  a:&#x27;应用这个原理，你可以为自己设计一个&quot;个人成长收益函数&quot;：1）明确你的长期目标（如&quot;三年内成为领域专家&quot;）；2）拆解为可量化的指标（如每年完成2个核心项目、读20本专业书、获得1项认证）；3）每天问自己：今天我做的事情是否在最大化这个&quot;收益函数&quot;？这套方法的关键在于：把抽象的目标转化为具体的、可度量的行动指标，然后让日常行为自然向这些指标靠拢。就像导航系统——你不用时刻思考&quot;我该往哪走&quot;，系统会自动指引你。设计好你的&quot;人生收益函数&quot;，行为就会自动优化。&#x27;}
]}
];

var CASE_STUDY = {
title:&#x27;纽约犯罪率下降原因分析（1990年代）&#x27;,
background:&#x27;1990年代纽约市犯罪率显著下降，从1994年开始大幅改善。对此现象有多个自洽的解释，但我们如何运用MKS四维框架（证伪思维、逻辑判断、大学之道：在二流大学接受一流教育、常识判断）来筛选真正的原因？&#x27;,
analysis:[
 {dim:&#x27;证伪思维&#x27;,content:&#x27;面对多个看似合理的解释，&quot;堕胎合法化论&quot;称70年代堕胎合法化→非婚生子女减少→犯罪率下降。但：1）美国其他城市堕胎同样合法化但犯罪率未同步下降；2）非婚生子女比例未减少，拉丁裔反而上升；3）堕胎率高峰（1980-1995）与犯罪率下降时间错位。该解释虽自洽但可证伪——通过横向比较和时序分析即可推翻。&quot;摄像头监控论&quot;也被证伪：纽约大规模安装摄像头在2001年&quot;9·11&quot;之后，晚于犯罪率下降起始点（1994年），且芝加哥安装摄像头后治安未改善。&#x27;},
 {dim:&#x27;逻辑判断&#x27;,content:&#x27;运用逻辑推理分析因果关系。&quot;朱利安尼铁腕治理论&quot;经得住逻辑检验：1）时间吻合——1994年朱利安尼上任与犯罪率大幅下降同时发生；2）空间一致性——纽约犯罪率全国排名从top3降至第16名；3）机制合理——打击轻微犯罪（强行洗车、涂鸦、妓女工会）形成威慑效应。而其他解释要么时间错位、要么缺乏空间一致性、要么因果机制不清晰。逻辑判断告诉我们：时间+空间+机制三吻合的解释最可信。&#x27;},
 {dim:&#x27;大学之道：在二流大学接受一流教育&#x27;,content:&#x27;从成本收益角度看：犯罪分子之所以选择犯罪，是基于&quot;收益&gt;成本&quot;的理性计算。朱利安尼的&quot;破窗效应&quot;策略——严厉打击轻微违法行为（如逃票、涂鸦）——增加了犯罪行为的&quot;被抓成本&quot;和&quot;惩罚成本&quot;。当违法成本显著上升，即使收益不变，理性计算也会导致犯罪率下降。这个解释符合大学之道：在二流大学接受一流教育的底层逻辑：行为受成本收益驱动。而摄像头论之所以不成立，是因为单纯监控不直接增加违法成本——除非有人现场执法。&#x27;},
 {dim:&#x27;常识判断&#x27;,content:&#x27;常识告诉我们：1）越严厉的执法→越低的犯罪率——这是最直接的因果关系，不需要复杂理论；2）犯罪率高发地区往往是执法松弛的地区；3）看不见的&quot;抓手&quot;（如堕胎）与看得见的&quot;治理&quot;相比，后者显然更可信。巴菲特式的&quot;常识判断&quot;在这里非常有效：如果你看到一个城市换了市长后犯罪率大幅下降，最直接的常识就是——这位市长的治理有效。复杂解释往往不如简单直接的解释可靠。&#x27;}
],
conclusion:&#x27;通过MKS四维分析，&quot;朱利安尼铁腕治理&quot;是纽约犯罪率下降的最合理解释。证伪思维排除了时间错位的理论；逻辑判断确定了因果关系；大学之道：在二流大学接受一流教育解释了机制；常识判断选择了最直接的归因。四维交叉验证，结论坚实。&#x27;
};

function shuffleArray(arr){
 for(var i=arr.length-1;i&gt;0;i--){var j=Math.floor(Math.random()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}
 return arr;
}

  html+=&#x27;&lt;div class=&quot;flip-card-back&quot;&gt;&#x27;;

function handleFlip(idx){
 var card=document.querySelectorAll(&#x27;.flip-card&#x27;)[idx];
 if(card)card.classList.toggle(&#x27;flipped&#x27;);
}
function toggleLearned(idx){
 var con=CONCEPTS[idx];
 var pos=state.learned.indexOf(con.id);
 if(pos&gt;=0)state.learned.splice(pos,1);
 else state.learned.push(con.id);
 saveState();
 renderFlashcards();
}
function updateProgress(){
 var pct=Math.round(state.learned.length/CONCEPTS.length*100);
 document.getElementById(&#x27;learnedCount&#x27;).textContent=state.learned.length;
 document.getElementById(&#x27;progressPercent&#x27;).textContent=pct+&#x27;%&#x27;;

}
document.getElementById(&#x27;resetLearned&#x27;).addEventListener(&#x27;click&#x27;,function(){

  state.learned=[];

});

 });

function startTimer(){
 if(quizStarted)return;
 quizStarted=true;
 document.getElementById(&#x27;startQuiz&#x27;).textContent=&#x27;计时中...&#x27;;
 document.getElementById(&#x27;startQuiz&#x27;).disabled=true;
 var tEl=document.getElementById(&#x27;timerDisplay&#x27;);
 var fill=document.getElementById(&#x27;timerFill&#x27;);
 var sec=0;
 fill.style.width=&#x27;100%&#x27;;
 var interval=setInterval(function(){
  sec++;
  var m=Math.floor(sec/60);
  var s=sec%60;
  tEl.textContent=&#x27;⏱ &#x27;+(m&lt;10?&#x27;0&#x27;:&#x27;&#x27;)+m+&#x27;:&#x27;+(s&lt;10?&#x27;0&#x27;:&#x27;&#x27;)+s;
  var remaining=Math.max(0,1-sec/900);
  fill.style.width=(remaining*100)+&#x27;%&#x27;;
  if(sec&gt;=900){clearInterval(interval);fill.style.width=&#x27;0%&#x27;;}
 },1000);
 window.quizTimer=interval;
 window.quizSeconds=function(){return sec;};
}

document.getElementById(&#x27;startQuiz&#x27;).addEventListener(&#x27;click&#x27;,function(){
 var allOptions=document.querySelectorAll(&#x27;#questionContainer .quiz-option&#x27;);
 allOptions.forEach(function(o){o.disabled=false;});
 startTimer();
});

function selectMCQ(qidx,oi){
 var btns=document.querySelectorAll(&#x27;#qcard-&#x27;+qidx+&#x27; .quiz-option&#x27;);
 if(btns[0].disabled)return;
 btns.forEach(function(b){b.disabled=true;});
 var correct=MCQS[qidx].ans;
 btns.forEach(function(b,bi){
  if(bi===correct)b.classList.add(&#x27;correct&#x27;);
  if(bi===oi &amp;&amp; bi!==correct)b.classList.add(&#x27;wrong&#x27;);
  if(bi===oi)b.classList.add(&#x27;selected&#x27;);
 });
 document.getElementById(&#x27;qexp-&#x27;+qidx).style.display=&#x27;block&#x27;;
 answeredCount++;
 state.stats.quiz++;
 if(oi!==correct){
  state.stats.wrong++;
  if(state.wrong.indexOf(qidx)&lt;0){
   state.wrong.push(qidx);
   if(state.wrong.length&gt;state.stats.maxWrong)state.stats.maxWrong=state.wrong.length;
  }
 }else{
  state.stats.correct++;
 }
 saveState();
 checkQuizComplete();
}

function checkQuizComplete(){
 if(answeredCount&gt;=MCQS.length){
  var total=state.stats.correct+state.stats.wrong;
  var pct=total&gt;0?Math.round(state.stats.correct/total*100):0;
  var resultEl=document.getElementById(&#x27;quizResult&#x27;);
  var wrongStats=document.getElementById(&#x27;wrongStats&#x27;);
  resultEl.style.display=&#x27;block&#x27;;
  resultEl.innerHTML=&#x27;&lt;div class=&quot;score-display&quot;&gt;&lt;div class=&quot;num&quot;&gt;&#x27;+state.stats.correct+&#x27;/&#x27;+total+&#x27;&lt;/div&gt;&lt;div&gt;正确率 &#x27;+pct+&#x27;%&lt;/div&gt;&lt;div style=&quot;font-size:.8rem;color:#8a7a6a;margin-top:4px&quot;&gt;错题数: &#x27;+state.stats.wrong+&#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;
  if(state.stats.wrong&gt;0){
   wrongStats.style.display=&#x27;grid&#x27;;
   document.getElementById(&#x27;wrongCount&#x27;).textContent=state.stats.wrong;
  }
  if(window.quizTimer)clearInterval(window.quizTimer);
 }
}

document.getElementById(&#x27;resetQuiz&#x27;).addEventListener(&#x27;click&#x27;,function(){
 if(confirm(&#x27;确定重置所有答题状态？重新答题前将清除之前的记录。&#x27;)){
  answeredCount=0;
  state.stats.quiz=0;state.stats.correct=0;state.stats.wrong=0;
  state.wrong=[];
  saveState();
  renderMCQs();
  document.getElementById(&#x27;quizResult&#x27;).style.display=&#x27;none&#x27;;
  document.getElementById(&#x27;wrongStats&#x27;).style.display=&#x27;none&#x27;;
  document.getElementById(&#x27;startQuiz&#x27;).disabled=false;
  document.getElementById(&#x27;startQuiz&#x27;).textContent=&#x27;开始计时&#x27;;
  document.getElementById(&#x27;timerDisplay&#x27;).textContent=&#x27;&#x27;;
  if(window.quizTimer)clearInterval(window.quizTimer);
  quizStarted=false;

  html+=&#x27;&lt;/div&gt;&#x27;;
 });
 c.innerHTML=html;
}
function selectSim(si,oi){
 var sim=SIMULATIONS[si];
 var opt=sim.options[oi];
 var btns=document.querySelectorAll(&#x27;#sim-&#x27;+si+&#x27; .simulation-option&#x27;);
 btns.forEach(function(b,bi){
  b.disabled=true;
  if(bi===oi)b.classList.add(&#x27;selected&#x27;);
 });
 var fb=document.getElementById(&#x27;sim-fb-&#x27;+si);
 fb.style.display=&#x27;block&#x27;;
 fb.innerHTML=&#x27;&lt;div style=&quot;margin-top:10px;padding:12px;background:#fdf6ec;border-radius:8px;border-left:4px solid &#x27;+
  (oi===1?&#x27;#27ae60&#x27;:&#x27;#c0392b&#x27;)+&#x27;&quot;&gt;&#x27;+
  &#x27;&lt;p&gt;&lt;strong&gt;你的选择：&lt;/strong&gt;&#x27;+String.fromCharCode(65+oi)+&#x27;. &#x27;+opt.text+&#x27;&lt;/p&gt;&#x27;+
  &#x27;&lt;p style=&quot;margin-top:6px&quot;&gt;&lt;strong&gt;反馈：&lt;/strong&gt;&#x27;+opt.feedback+&#x27;&lt;/p&gt;&#x27;+
  &#x27;&lt;p style=&quot;margin-top:6px;color:#c0392b;font-size:.85rem&quot;&gt;&lt;strong&gt;MKS分析：&lt;/strong&gt;&#x27;+opt.mks+&#x27;&lt;/p&gt;&lt;/div&gt;&#x27;;
}

/* ===== LEARNING PATH ===== */
function renderLearningPath(){
 var c=document.getElementById(&#x27;learningPathContainer&#x27;);
 var html=&#x27;&#x27;;
 LEARNING_PATH.forEach(function(stage){
  html+=&#x27;&lt;div class=&quot;stage-card&quot;&gt;&#x27;;
  html+=&#x27;&lt;h4&gt;&lt;span class=&quot;stage-num&quot;&gt;&#x27;+stage.stage+&#x27;&lt;/span&gt;&#x27;+stage.title+&#x27;&lt;/h4&gt;&#x27;;
  html+=&#x27;&lt;div style=&quot;margin:6px 0;display:flex;flex-wrap:wrap;gap:4px&quot;&gt;&#x27;;
  stage.concepts.forEach(function(cn){
   var icon=&#x27;&#x27;;
   CONCEPTS.forEach(function(con){
    if(con.name===cn)icon=con.icon;
   });
   html+=&#x27;&lt;span class=&quot;badge&quot; style=&quot;background:#8a7a6a&quot;&gt;&#x27;+icon+&#x27; &#x27;+cn+&#x27;&lt;/span&gt;&#x27;;
  });
  html+=&#x27;&lt;/div&gt;&#x27;;
  html+=&#x27;&lt;p style=&quot;font-size:.88rem;margin:6px 0&quot;&gt;&#x27;+stage.desc+&#x27;&lt;/p&gt;&#x27;;

  });
  html+=&#x27;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&#x27;;
 });
 c.innerHTML=html;
}

 BOUNDARY.forEach(function(b){

// ========== STATE ==========
const LS = {
  get(k,d){try{const v=localStorage.getItem(&#x27;wj_mks_&#x27;+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(&#x27;wj_mks_&#x27;+k,JSON.stringify(v))}catch(e){}}
};
let state = {
  learnedCards: LS.get(&#x27;cards&#x27;,[]),
  wrongBook: LS.get(&#x27;wrong&#x27;,[]),
  quizHistory: LS.get(&#x27;history&#x27;,[]),
  studyDays: LS.get(&#x27;days&#x27;,0),
  currentCard: 0,
  quizMode: false,
  examActive: false,
  simRound: 0
};

// ========== INIT ==========
document.addEventListener(&#x27;DOMContentLoaded&#x27;,()=&gt;{
  initTabs();
  initDashboard();
  initFlipCards();
  initMindmap();
  initSocratic();
  initCaseStudy();
  initSimulation();
  updateReviewStats();
  recordStudyDay();
});

function recordStudyDay(){
  const today = new Date().toISOString().slice(0,10);
  const last = LS.get(&#x27;lastStudy&#x27;,&#x27;&#x27;);
  if(last !== today){
    state.studyDays = LS.get(&#x27;days&#x27;,0)+1;
    LS.set(&#x27;days&#x27;,state.studyDays);
    LS.set(&#x27;lastStudy&#x27;,today);
  }
}

// ========== TABS ==========
function initTabs(){
  document.querySelectorAll(&#x27;.tab-btn&#x27;).forEach(btn=&gt;{
    btn.addEventListener(&#x27;click&#x27;,()=&gt;{
      document.querySelectorAll(&#x27;.tab-btn&#x27;).forEach(b=&gt;b.classList.remove(&#x27;active&#x27;));
      document.querySelectorAll(&#x27;.tab-content&#x27;).forEach(c=&gt;c.classList.remove(&#x27;active&#x27;));
      btn.classList.add(&#x27;active&#x27;);
      const idx = btn.dataset.tab;
      document.querySelector(&#x27;[data-tab=&quot;&#x27;+idx+&#x27;&quot;].tab-content&#x27;).classList.add(&#x27;active&#x27;);
      if(idx===&#x27;4&#x27;) updateReviewStats();
    });
  });
}

function initDashboard(){
  // Concept grid
  const grid = document.getElementById(&#x27;conceptGrid&#x27;);
  concepts.forEach(c=&gt;{
    const cls = c.star ? &#x27;concept-card star&#x27; : &#x27;concept-card&#x27;;
    grid.innerHTML += `&lt;div class=&quot;${cls}&quot;&gt;&lt;div class=&quot;icon&quot;&gt;${c.icon}&lt;/div&gt;&lt;h4&gt;${c.name}&lt;/h4&gt;&lt;p&gt;${c.desc}&lt;/p&gt;${c.star?&#x27;&lt;span class=&quot;badge badge-star&quot;&gt;★ MKS核心&lt;/span&gt;&#x27;:&#x27;&#x27;}&lt;/div&gt;`;
  });

  // MKS core grid
  const mksGrid = document.getElementById(&#x27;mksGrid&#x27;);
  concepts.filter(c=&gt;c.star).forEach(c=&gt;{
    mksGrid.innerHTML += `&lt;div class=&quot;concept-card star&quot;&gt;&lt;div class=&quot;icon&quot;&gt;${c.icon}&lt;/div&gt;&lt;h4&gt;⭐ ${c.name}&lt;/h4&gt;&lt;p&gt;${c.desc}&lt;/p&gt;&lt;p style=&quot;margin-top:4px;font-size:.75rem;color:var(--gold)&quot;&gt;骨架中的骨架——理解了这个，其余概念自然串联&lt;/p&gt;&lt;/div&gt;`;
  });

  // SVG diagram
  document.getElementById(&#x27;svgContainer&#x27;).innerHTML = buildSVG();

  // Boundary table
  const bt = document.getElementById(&#x27;boundaryTable&#x27;);
  bt.innerHTML = &#x27;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;知识点&lt;/th&gt;&lt;th&gt;使用场景&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&#x27;+boundary.map(b=&gt;`&lt;tr&gt;&lt;td&gt;${b.name}&lt;/td&gt;&lt;td&gt;${b.scene}&lt;/td&gt;&lt;/tr&gt;`).join(&#x27;&#x27;)+&#x27;&lt;/tbody&gt;&#x27;;

  // Learning path
  const lp = document.getElementById(&#x27;learningPath&#x27;);
  learningPath.forEach(s=&gt;{
    lp.innerHTML += `&lt;div class=&quot;path-step&quot;&gt;&lt;div class=&quot;path-num&quot;&gt;${s.step}&lt;/div&gt;&lt;div class=&quot;path-info&quot;&gt;&lt;h4&gt;${s.title}&lt;/h4&gt;&lt;p&gt;${s.desc}&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;`;
  });

  updateProgress();
}

function initFlipCards(){
  state.currentCard = LS.get(&#x27;cardIdx&#x27;,0);
  renderFlipCard();
}

function renderFlipCard(){
  const i = state.currentCard;
  const c = conceptDetails[i];
  const isLearned = state.learnedCards.includes(concepts[i].id);
  document.getElementById(&#x27;flipTitle&#x27;).textContent = concepts[i].icon+&#x27; &#x27;+concepts[i].name;
  document.getElementById(&#x27;flipBack&#x27;).innerHTML = `
    &lt;h4&gt;📖 定义&lt;/h4&gt;&lt;p&gt;${c.define}&lt;/p&gt;
    &lt;h4&gt;💼 商业类比&lt;/h4&gt;&lt;p&gt;${c.analog}&lt;/p&gt;
    &lt;h4&gt;✅ 示例&lt;/h4&gt;&lt;p&gt;${c.example}&lt;/p&gt;
    &lt;h4&gt;❌ 反例&lt;/h4&gt;&lt;p&gt;${c.counter}&lt;/p&gt;
  `;
  document.getElementById(&#x27;cardIdx&#x27;).textContent = (i+1)+&#x27; / &#x27;+conceptDetails.length;
  const btn = document.getElementById(&#x27;learnBtn&#x27;);
  if(isLearned){ btn.textContent=&#x27;✔ 已学习&#x27;; btn.classList.add(&#x27;done&#x27;); }
  else { btn.textContent=&#x27;✔ 标记已学习&#x27;; btn.classList.remove(&#x27;done&#x27;); }
  const card = document.getElementById(&#x27;flipCard&#x27;);
  card.classList.remove(&#x27;flipped&#x27;);
}

function flipCard(){
  document.getElementById(&#x27;flipCard&#x27;).classList.toggle(&#x27;flipped&#x27;);
}

function prevCard(){
  state.currentCard = (state.currentCard-1+conceptDetails.length)%conceptDetails.length;
  LS.set(&#x27;cardIdx&#x27;,state.currentCard);
  renderFlipCard();
}

function nextCard(){
  state.currentCard = (state.currentCard+1)%conceptDetails.length;
  LS.set(&#x27;cardIdx&#x27;,state.currentCard);
  renderFlipCard();
}

function markLearned(){
  const id = concepts[state.currentCard].id;
  if(!state.learnedCards.includes(id)){
    state.learnedCards.push(id);
    LS.set(&#x27;cards&#x27;,state.learnedCards);
  }else{
    state.learnedCards = state.learnedCards.filter(x=&gt;x!==id);
    LS.set(&#x27;cards&#x27;,state.learnedCards);
  }
  updateProgress();
  renderFlipCard();
}

let currentQuestions = [];
let quizTimerInterval = null;
let quizTimeLeft = 0;
let userAnswers = {};

function startQuiz(){
  // Shuffle and pick 10 choice + 3 essay
  const shuffled = [...quizData].sort(()=&gt;Math.random()-0.5);
  const essayShuffled = [...essayData].sort(()=&gt;Math.random()-0.5);
  currentQuestions = [...shuffled.slice(0,10), ...essayShuffled.slice(0,3)];
  userAnswers = {};
  state.quizMode = true;
  quizTimeLeft = 900; // 15 min
  document.getElementById(&#x27;quizScore&#x27;).textContent = &#x27;&#x27;;
  renderQuiz();
  startQuizTimer(&#x27;quizTimer&#x27;);
}

function startQuizTimer(elemId){
  quizTimeLeft = 900;
  clearInterval(quizTimerInterval);
  document.getElementById(elemId).style.display = &#x27;block&#x27;;
  updateTimerDisplay(elemId);
  quizTimerInterval = setInterval(()=&gt;{
    quizTimeLeft--;
    updateTimerDisplay(elemId);
    if(quizTimeLeft&lt;=0){
      clearInterval(quizTimerInterval);
      if(state.examActive) submitExam();
    }
  },1000);
}

function updateTimerDisplay(elemId){
  const m = Math.floor(quizTimeLeft/60);
  const s = quizTimeLeft%60;
  document.getElementById(elemId).textContent = &#x27;⏱ &#x27;+m+&#x27;:&#x27;+(s&lt;10?&#x27;0&#x27;:&#x27;&#x27;)+s;
}

function renderQuiz(){
  const container = document.getElementById(&#x27;quizContainer&#x27;);
  let html = &#x27;&#x27;;
  currentQuestions.forEach((q,i)=&gt;{
    if(q.type===&#x27;choice&#x27;){
      html += `&lt;div class=&quot;quiz-card&quot; id=&quot;qcard${i}&quot;&gt;
        &lt;div class=&quot;q-num&quot;&gt;选择题 ${i+1}&lt;/div&gt;
        &lt;div class=&quot;q-text&quot;&gt;${q.q}&lt;/div&gt;`;
      q.opts.forEach((o,j)=&gt;{
        const sel = userAnswers[i]===j ? &#x27; selected&#x27; : &#x27;&#x27;;
        const dis = userAnswers[i]!==undefined ? &#x27;disabled&#x27; : &#x27;&#x27;;
        html += `&lt;div class=&quot;option${sel}&quot; onclick=&quot;selectChoice(${i},${j})&quot; id=&quot;opt${i}_${j}&quot;&gt;${&#x27;ABCD&#x27;[j]}. ${o}&lt;/div&gt;`;
      });
      html += `&lt;div id=&quot;fb${i}&quot;&gt;&lt;/div&gt;&lt;/div&gt;`;
    }else{
      html += `&lt;div class=&quot;quiz-card&quot;&gt;
        &lt;div class=&quot;q-num&quot;&gt;简答题 ${i+1} &lt;span class=&quot;badge badge-star&quot;&gt;${q.ref}&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;q-text&quot;&gt;${q.q}&lt;/div&gt;
        &lt;textarea class=&quot;essay-area&quot; id=&quot;essay${i}&quot; placeholder=&quot;输入你的回答...&quot;&gt;${userAnswers[i]||&#x27;&#x27;}&lt;/textarea&gt;
      &lt;/div&gt;`;
    }
  });
  html += &#x27;&lt;button class=&quot;btn&quot; onclick=&quot;submitQuiz()&quot;&gt;📩 提交答案&lt;/button&gt;&#x27;;
  container.innerHTML = html;
}

function selectChoice(qIdx,optIdx){
  if(userAnswers[qIdx]!==undefined) return;
  userAnswers[qIdx] = optIdx;
  const q = currentQuestions[qIdx];
  const isCorrect = optIdx === q.ans;
  // Highlight
  const allOpts = document.querySelectorAll(&#x27;#qcard&#x27;+qIdx+&#x27; .option&#x27;);
  allOpts.forEach((el,j)=&gt;{
    el.classList.add(j===q.ans?&#x27;correct&#x27;:(j===optIdx&amp;&amp;!isCorrect?&#x27;wrong&#x27;:&#x27;&#x27;));
    el.style.pointerEvents = &#x27;none&#x27;;
  });
  // Feedback
  const fb = document.getElementById(&#x27;fb&#x27;+qIdx);
  fb.className = &#x27;feedback &#x27;+(isCorrect?&#x27;correct&#x27;:&#x27;wrong&#x27;);
  fb.textContent = isCorrect ? &#x27;✓ 正确！&#x27; : &#x27;✗ 错误。&#x27;;
  fb.textContent += &#x27; &#x27;+q.explain;

  // Record
  const rec = {qIdx, correct: isCorrect, concept: concepts.find(c=&gt;c.desc.includes(q.explain.slice(0,8)))?.name||&#x27;&#x27;};
  state.quizHistory.push(rec);
  LS.set(&#x27;history&#x27;,state.quizHistory);
  if(!isCorrect){
    state.wrongBook.push({...q, userAns: optIdx, time: new Date().toISOString()});
    LS.set(&#x27;wrong&#x27;,state.wrongBook);
  }

  const correctCount = Object.values(userAnswers).filter((v,i)=&gt;currentQuestions[i]?.type===&#x27;choice&#x27;&amp;&amp;v===currentQuestions[i].ans).length;
  const totalChoice = currentQuestions.filter(q=&gt;q.type===&#x27;choice&#x27;).length;
  document.getElementById(&#x27;quizScore&#x27;).textContent = &#x27;得分: &#x27;+correctCount+&#x27;/&#x27;+totalChoice;
}

function submitQuiz(){
  const correctCount = Object.values(userAnswers).filter((v,i)=&gt;currentQuestions[i]?.type===&#x27;choice&#x27;&amp;&amp;v===currentQuestions[i].ans).length;
  const totalChoice = currentQuestions.filter(q=&gt;q.type===&#x27;choice&#x27;).length;
  alert(&#x27;选择题得分: &#x27;+correctCount+&#x27;/&#x27;+totalChoice+&#x27;\n简答题已保存（自我对照参考答案中的ref概念）&#x27;);
  clearInterval(quizTimerInterval);
  state.quizMode = false;
}

function resetQuiz(){
  currentQuestions = [];

  clearInterval(quizTimerInterval);
  document.getElementById(&#x27;quizContainer&#x27;).innerHTML = &#x27;&#x27;;
  document.getElementById(&#x27;quizScore&#x27;).textContent = &#x27;&#x27;;

function selectExamChoice(qIdx,optIdx){
  if(userAnswers[qIdx]!==undefined) return;
  userAnswers[qIdx] = optIdx;
  const q = currentQuestions[qIdx];
  const isCorrect = optIdx === q.ans;
  const allOpts = document.querySelectorAll(&#x27;#ecard&#x27;+qIdx+&#x27; .option&#x27;);
  allOpts.forEach((el,j)=&gt;{
    el.classList.add(j===q.ans?&#x27;correct&#x27;:(j===optIdx&amp;&amp;!isCorrect?&#x27;wrong&#x27;:&#x27;&#x27;));

  });
  const fb = document.getElementById(&#x27;efb&#x27;+qIdx);

function submitExam(){
  clearInterval(quizTimerInterval);
  const correctCount = Object.values(userAnswers).filter((v,i)=&gt;currentQuestions[i]?.type===&#x27;choice&#x27;&amp;&amp;v===currentQuestions[i].ans).length;
  const totalChoice = currentQuestions.filter(q=&gt;q.type===&#x27;choice&#x27;).length;
  const pct = totalChoice&gt;0 ? Math.round(correctCount/totalChoice*100) : 0;
  const weakConcepts = {};
  state.wrongBook.forEach(w=&gt;{if(w.concept){weakConcepts[w.concept]=(weakConcepts[w.concept]||0)+1;}});
  const weakList = Object.entries(weakConcepts).sort((a,b)=&gt;b[1]-a[1]).slice(0,3).map(([k,v])=&gt;k+&#x27;(&#x27;+v+&#x27;题)&#x27;).join(&#x27;、&#x27;)||&#x27;暂无&#x27;;
  document.getElementById(&#x27;examContainer&#x27;).innerHTML += `
    &lt;div class=&quot;card&quot; style=&quot;margin-top:14px&quot;&gt;
      &lt;h3&gt;📊 考试结果&lt;/h3&gt;

    &lt;/div&gt;`;
  document.getElementById(&#x27;examTimer&#x27;).style.display = &#x27;none&#x27;;
  document.getElementById(&#x27;startExamBtn&#x27;).style.display = &#x27;inline-block&#x27;;
  state.examActive = false;
}

// ========== TAB 4: REVIEW ==========
function updateReviewStats(){
  const history = LS.get(&#x27;history&#x27;,[]);
  const total = history.length;
  const correct = history.filter(h=&gt;h.correct).length;
  const rate = total&gt;0 ? Math.round(correct/total*100) : 0;
  document.getElementById(&#x27;statTotal&#x27;).textContent = total;
  document.getElementById(&#x27;statCorrect&#x27;).textContent = correct;
  document.getElementById(&#x27;statRate&#x27;).textContent = rate+&#x27;%&#x27;;
  document.getElementById(&#x27;statDays&#x27;).textContent = LS.get(&#x27;days&#x27;,0);

  // Wrong book
  const wrong = LS.get(&#x27;wrong&#x27;,[]);
  const wb = document.getElementById(&#x27;wrongBook&#x27;);
  if(wrong.length===0){
    wb.innerHTML = &#x27;&lt;p style=&quot;color:var(--sub);font-size:.85rem&quot;&gt;暂无错题记录 🎉&lt;/p&gt;&#x27;;
  }else{
    wb.innerHTML = wrong.map((w,i)=&gt;{
      const correctOpt = w.opts ? w.opts[w.ans] : &#x27;&#x27;;
      const userOpt = w.opts ? w.opts[w.userAns] : &#x27;&#x27;;
      return `&lt;div class=&quot;quiz-card&quot;&gt;
        &lt;div class=&quot;q-num&quot;&gt;错题 ${i+1}&lt;/div&gt;
        &lt;div class=&quot;q-text&quot;&gt;${w.q}&lt;/div&gt;
        &lt;p style=&quot;color:var(--accent);font-size:.85rem&quot;&gt;你的答案: ${userOpt||&#x27;未选&#x27;}&lt;/p&gt;
        &lt;p style=&quot;color:var(--success);font-size:.85rem&quot;&gt;正确答案: ${correctOpt}&lt;/p&gt;
        &lt;p style=&quot;font-size:.82rem;color:var(--sub)&quot;&gt;${w.explain||&#x27;&#x27;}&lt;/p&gt;
      &lt;/div&gt;`;
    }).join(&#x27;&#x27;);
    wb.innerHTML += &#x27;&lt;button class=&quot;btn btn-outline btn-sm&quot; onclick=&quot;clearWrongBook()&quot; style=&quot;margin-top:8px&quot;&gt;清空错题本&lt;/button&gt;&#x27;;
  }

  // Weak analysis
  const wa = document.getElementById(&#x27;weakAnalysis&#x27;);
  const conceptErrors = {};
  wrong.forEach(w=&gt;{
    // Try to match concept from question text
    for(const c of concepts){
      if(w.q.includes(c.name.slice(0,2)) || (w.explain||&#x27;&#x27;).includes(c.name.slice(0,2))){
        conceptErrors[c.name] = (conceptErrors[c.name]||0)+1;
        break;
      }
    }
  });
  const sorted = Object.entries(conceptErrors).sort((a,b)=&gt;b[1]-a[1]);
  if(sorted.length===0){
    wa.innerHTML = &#x27;&lt;p style=&quot;color:var(--sub);font-size:.85rem&quot;&gt;暂无答题数据，开始做题后自动分析&lt;/p&gt;&#x27;;
  }else{
    wa.innerHTML = &#x27;&lt;div class=&quot;card&quot;&gt;&lt;ul style=&quot;padding-left:20px&quot;&gt;&#x27;+sorted.map(([k,v])=&gt;`&lt;li&gt;&lt;b&gt;${k}&lt;/b&gt;: ${v}道错题 ${v&gt;=3?&#x27;⚠️ 重点关注&#x27;:&#x27;&#x27;}&lt;/li&gt;`).join(&#x27;&#x27;)+&#x27;&lt;/ul&gt;&lt;/div&gt;&#x27;;
  }
}

function clearWrongBook(){
  if(confirm(&#x27;确定清空所有错题记录？&#x27;)){
    LS.set(&#x27;wrong&#x27;,[]);
    state.wrongBook = [];
    updateReviewStats();
  }
}

function initSimulation(){
  state.simRound = LS.get(&#x27;simRound&#x27;,0);
  renderSim();
}

function renderSim(){
  const container = document.getElementById(&#x27;simContainer&#x27;);
  if(state.simRound &gt;= simData.length){
    container.innerHTML = `&lt;div class=&quot;card&quot;&gt;&lt;h3&gt;🎉 三轮决策模拟完成！&lt;/h3&gt;&lt;p style=&quot;color:var(--sub)&quot;&gt;回顾你在每轮的选择，思考这些决策背后的MKS原理：&lt;br&gt;1. 你的选择偏主动还是被动？&lt;br&gt;2. 你是否考虑了长期成长vs短期利益？&lt;br&gt;3. 你如何看待规则与创新的关系？&lt;/p&gt;&lt;button class=&quot;btn&quot; onclick=&quot;resetSim()&quot;&gt;重新开始&lt;/button&gt;&lt;/div&gt;`;
    return;
  }
  const s = simData[state.simRound];
  container.innerHTML = `&lt;div class=&quot;sim-scenario&quot;&gt;
    &lt;h4&gt;🎯 ${s.scenario}&lt;/h4&gt;
    ${s.choices.map((c,i)=&gt;`&lt;button class=&quot;sim-choice&quot; onclick=&quot;chooseSim(${i})&quot;&gt;${&#x27;🔹🔸🔷&#x27;[i]} ${c.text}&lt;/button&gt;`).join(&#x27;&#x27;)}
    &lt;div id=&quot;simFeedback&quot; style=&quot;margin-top:12px&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;`;
}

function chooseSim(idx){
  const s = simData[state.simRound];
  const c = s.choices[idx];
  const fb = document.getElementById(&#x27;simFeedback&#x27;);
  fb.innerHTML = `&lt;div class=&quot;card&quot;&gt;
    &lt;h4&gt;${c.feedback}&lt;/h4&gt;
    &lt;p style=&quot;font-size:.82rem;color:var(--accent);margin-top:4px&quot;&gt;📊 MKS分析：${c.analysis}&lt;/p&gt;
    &lt;button class=&quot;btn btn-sm&quot; onclick=&quot;nextSimRound()&quot; style=&quot;margin-top:8px&quot;&gt;下一轮 ▶&lt;/button&gt;
  &lt;/div&gt;`;
  document.querySelectorAll(&#x27;.sim-choice&#x27;).forEach(el=&gt;el.disabled=true);
  document.querySelectorAll(&#x27;.sim-choice&#x27;)[idx].classList.add(&#x27;chosen&#x27;);
}

function nextSimRound(){
  state.simRound++;
  LS.set(&#x27;simRound&#x27;,state.simRound);
  renderSim();
}

function resetSim(){
  state.simRound = 0;
  LS.set(&#x27;simRound&#x27;,0);
  renderSim();
}
&lt;/script&gt;

<script>
function switchTopic(n){
  document.querySelectorAll('.top-nav-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.iframe-panel').forEach(p=>p.style.display='none');
  var btn=document.querySelector('.top-nav-btn[data-topic="'+n+'"]');
  var panel=document.getElementById('topic-'+n);
  if(btn)btn.classList.add('active');if(btn&&n!==0)btn.classList.add('always-show');
  if(panel)panel.style.display='block';
  window.scrollTo(0,0);
}
function toggleNav(){document.getElementById('topNav').classList.toggle('expanded');}
</script>

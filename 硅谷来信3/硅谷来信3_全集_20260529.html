&lt;style&gt;
:root{--bg:#fdf6ec;--card:#fffaf2;--accent:#c0392b;--accent2:#e67e22;--accent3:#8b4513;--text:#3d2f2f;--muted:#8b7355;--border:#e8d5c4;--shadow:0 2px 12px rgba(60,20,0,.08);--radius:10px;--fs:clamp(15px,2vw,17px);--fs-sm:clamp(13px,1.5vw,14px);--fs-lg:clamp(20px,3vw,26px);--fs-xl:clamp(26px,4vw,36px);--maxw:960px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:&#x27;Segoe UI&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Noto Sans SC&#x27;,sans-serif;background:var(--bg);color:var(--text);font-size:var(--fs);line-height:1.7;min-height:100vh}
.container{max-width:var(--maxw);margin:0 auto;padding:0 16px}
header{text-align:center;padding:32px 16px 20px;background:linear-gradient(135deg,#3d1f0a 0%,#6b2f1a 40%,#c0392b 100%);color:#fff;margin-bottom:0}
header h1{font-size:var(--fs-xl);font-weight:700;margin-bottom:6px;letter-spacing:.02em}
header p{font-size:var(--fs-sm);opacity:.9;max-width:700px;margin:0 auto}
.home-btn{display:inline-block;margin-top:10px;padding:5px 16px;border:1px solid rgba(255,255,255,.5);border-radius:20px;color:#fff;font-size:var(--fs-sm);text-decoration:none;transition:all .2s}
.home-btn:hover{background:rgba(255,255,255,.15)}
.tabs{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:2px solid var(--border);display:flex;flex-wrap:wrap;gap:2px;padding:6px 8px 0;justify-content:center;box-shadow:0 1px 6px rgba(0,0,0,.04)}
.tab-btn{padding:7px 12px;border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:var(--fs-sm);border-radius:8px 8px 0 0;transition:all .2s;white-space:nowrap}
.tab-btn:hover{color:var(--accent);background:rgba(192,57,43,.05)}
.tab-btn.active{color:var(--accent);background:var(--card);font-weight:700;border:1px solid var(--border);border-bottom:2px solid var(--card);margin-bottom:-2px}
.tab-panel{display:none;animation:fadeIn .35s ease}
.tab-panel.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.section{margin:24px 0}
.section-title{font-size:var(--fs-lg);font-weight:700;color:var(--accent);margin-bottom:12px;padding-bottom:6px;border-bottom:2px solid var(--accent);display:flex;align-items:center;gap:8px}
.section-title .ico{font-size:1.2em}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);border:1px solid var(--border);transition:all .2s}
.card:hover{box-shadow:0 4px 18px rgba(60,20,0,.12);transform:translateY(-2px)}
.card h3{font-size:1.05em;color:var(--accent);margin-bottom:8px}
.card p{font-size:var(--fs-sm);color:var(--muted)}
.card.mks{border-left:4px solid var(--accent);background:linear-gradient(135deg,#fff8f0,#fffaf2)}
.card.mks h3::before{content:&#x27;★ &#x27;;color:#e67e22}
.mks-badge{display:inline-block;background:var(--accent);color:#fff;font-size:11px;padding:2px 8px;border-radius:10px;margin-left:6px;vertical-align:middle}
.progress-wrap{margin:16px 0}
.progress-label{display:flex;justify-content:space-between;font-size:var(--fs-sm);margin-bottom:4px}
.progress-bar{height:14px;background:var(--border);border-radius:7px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:7px;transition:width .5s}
.svg-wrap{overflow-x:auto;margin:16px 0;background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.svg-wrap svg{display:block;margin:0 auto;min-width:700px;max-width:100%;height:auto}
.tbl-wrap{overflow-x:auto;margin:12px 0}
table{width:100%;border-collapse:collapse;font-size:var(--fs-sm);background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
th{background:var(--accent);color:#fff;padding:10px 12px;text-align:left;font-weight:600}
td{padding:8px 12px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
tr:nth-child(even){background:rgba(192,57,43,.03)}
/* Flip card */
.flip-container{perspective:1000px;margin:0 auto;max-width:500px}
.flipper{position:relative;width:100%;height:420px;transition:transform .6s;transform-style:preserve-3d;cursor:pointer}
.flipper.flipped{transform:rotateY(180deg)}
.flip-front,.flip-back{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:var(--radius);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;box-shadow:var(--shadow);border:1px solid var(--border)}
.flip-front{background:linear-gradient(135deg,#6b2f1a,#c0392b);color:#fff;font-size:1.3em;font-weight:700;text-align:center}
.flip-back{background:var(--card);color:var(--text);transform:rotateY(180deg);text-align:left;overflow-y:auto;justify-content:flex-start;font-size:var(--fs-sm)}
.flip-back h4{color:var(--accent);margin:6px 0 3px}
.flip-back p{margin:2px 0;line-height:1.5}
.flip-nav{display:flex;justify-content:center;gap:12px;align-items:center;margin-top:12px;flex-wrap:wrap}
.flip-nav button{padding:8px 20px;border:none;border-radius:20px;cursor:pointer;font-size:var(--fs-sm);transition:all .2s;background:var(--accent);color:#fff}
.flip-nav button:hover{opacity:.85}
.flip-nav button.learned-btn{background:var(--accent2)}
.flip-nav button.learned-btn.learned{background:#27ae60}
/* Quiz */
.quiz-card{margin:20px 0;padding:18px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border)}
.quiz-card .q-title{font-weight:700;margin-bottom:8px}
.q-option{display:block;padding:8px 14px;margin:4px 0;border-radius:6px;cursor:pointer;transition:all .15s;border:1px solid var(--border)}
.q-option:hover{background:rgba(192,57,43,.06)}
.q-option.correct{background:#d4edda;border-color:#27ae60}
.q-option.wrong{background:#f8d7da;border-color:var(--accent)}
.q-option.chosen{font-weight:700}
.q-feedback{margin-top:8px;padding:8px 12px;border-radius:6px;font-size:var(--fs-sm);display:none}
.q-feedback.correct{display:block;background:#d4edda;color:#155724}
.q-feedback.wrong{display:block;background:#f8d7da;color:#721c24}
/* Socratic */
.soc-item{margin:12px 0;padding:14px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border)}
.soc-item .soc-q{font-weight:700;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.soc-item .soc-a{display:none;margin-top:8px;padding:8px 12px;background:#f9f3ea;border-radius:6px;font-size:var(--fs-sm);line-height:1.6}
.soc-item.open .soc-a{display:block}
/* Case */
.case-box{margin:16px 0;padding:18px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border)}
.case-box h4{color:var(--accent);margin-bottom:8px}
/* Decision */
.decision-round{padding:20px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin:16px 0;border:1px solid var(--border)}
.decision-round .opt-btn{display:block;width:100%;text-align:left;padding:12px 16px;margin:6px 0;border:2px solid var(--border);border-radius:8px;background:#fff;cursor:pointer;transition:all .2s;font-size:var(--fs-sm)}
.decision-round .opt-btn:hover{border-color:var(--accent);background:rgba(192,57,43,.03)}
.decision-round .opt-btn.selected{border-color:var(--accent);background:rgba(192,57,43,.08)}
/* Mind map */
.mind-tree{margin:16px 0}
.mind-tree .node{padding:4px 0 4px 20px;border-left:2px solid var(--border);margin-left:8px;position:relative}
.mind-tree .node::before{content:&#x27;&#x27;;position:absolute;left:-2px;top:16px;width:14px;height:2px;background:var(--border)}
.mind-tree .node .label{cursor:pointer;font-weight:600;color:var(--accent);user-select:none}
.mind-tree .node .label .arrow{margin-right:6px;font-size:10px;display:inline-block;transition:transform .2s;width:12px}
.mind-tree .node .tree-children{display:none}
.mind-tree .node .tree-children.show,.mind-tree .node .tree-children.open{display:block;padding-left:8px}
.mind-tree .leaf{color:var(--text);font-size:var(--fs-sm);padding:3px 0}
/* Stats */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat-card{text-align:center;padding:16px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow)}
.stat-card .num{font-size:2em;font-weight:700;color:var(--accent)}
.stat-card .lbl{font-size:var(--fs-sm);color:var(--muted)}
/* Exam */
.exam-timer{text-align:center;font-size:1.5em;font-weight:700;color:var(--accent);margin:12px 0}
/* Btn */
.btn{padding:10px 22px;border:none;border-radius:22px;cursor:pointer;font-size:var(--fs-sm);background:var(--accent);color:#fff;transition:all .2s;font-weight:600}
.btn:hover{opacity:.85}
.btn-outline{border:2px solid var(--accent);background:transparent;color:var(--accent)}
.btn-sm{padding:5px 14px;font-size:12px}
/* Path */
.path-steps{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.path-step{flex:1;min-width:140px;padding:14px;background:var(--card);border-radius:var(--radius);text-align:center;box-shadow:var(--shadow);position:relative}
.path-step .step-num{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;line-height:32px;margin:0 auto 8px;font-weight:700}
.path-step .step-t{font-weight:700;font-size:var(--fs-sm)}
.path-step .step-d{font-size:12px;color:var(--muted);margin-top:4px}
/* Responsive */
@media(max-width:640px){
  .tabs{gap:1px;padding:4px}
  .tab-btn{padding:5px 8px;font-size:11px}
  .cards{grid-template-columns:1fr}
  .flipper{height:420px}
  .path-steps{flex-direction:column}
}
textarea{width:100%;min-height:80px;padding:10px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:var(--fs-sm);resize:vertical}
textarea:focus{outline:none;border-color:var(--accent)}
.inline-flex{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.hidden{display:none}
&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;header&gt;
  &lt;h1&gt;文学与艺术 · 最小知识集&lt;/h1&gt;
  &lt;p&gt;硅谷来信3的审美殿堂模块 — 从莎士比亚到但丁，从威尔第到村上春树，穿行经典文学艺术的永恒之美&lt;/p&gt;
  &lt;a href=&quot;index.html&quot; class=&quot;home-btn&quot; title=&quot;返回知识主板&quot;&gt;← 返回知识主板&lt;/a&gt;
&lt;/header&gt;

&lt;div class=&quot;tabs&quot; id=&quot;tabBar&quot;&gt;&lt;button class=&quot;tab-btn active&quot; data-tab=&quot;0&quot;&gt;知识集总览&lt;/button&gt;&lt;button class=&quot;tab-btn&quot; data-tab=&quot;1&quot;&gt;知识卡片&lt;/button&gt;&lt;button class=&quot;tab-btn&quot; data-tab=&quot;2&quot;&gt;题库系统&lt;/button&gt;&lt;button class=&quot;tab-btn&quot; data-tab=&quot;3&quot;&gt;考试模式&lt;/button&gt;&lt;button class=&quot;tab-btn&quot; data-tab=&quot;4&quot;&gt;复习模式&lt;/button&gt;&lt;button class=&quot;tab-btn&quot; data-tab=&quot;5&quot;&gt;思维导图&lt;/button&gt;&lt;button class=&quot;tab-btn&quot; data-tab=&quot;6&quot;&gt;深度追问&lt;/button&gt;&lt;button class=&quot;tab-btn&quot; data-tab=&quot;7&quot;&gt;案例分析&lt;/button&gt;&lt;button class=&quot;tab-btn&quot; data-tab=&quot;8&quot;&gt;实战决策&lt;/button&gt;&lt;/div&gt;

&lt;div class=&quot;container&quot;&gt;

&lt;!-- ===== TAB 0 ===== --&gt;
&lt;div class=&quot;tab-panel active&quot; id=&quot;panel0&quot;&gt;
  &lt;div class=&quot;section&quot;&gt;
    &lt;div class=&quot;section-title&quot;&gt;&lt;span class=&quot;ico&quot;&gt;🎯&lt;/span&gt; 核心目标&lt;/div&gt;
    &lt;div class=&quot;card&quot; style=&quot;text-align:center;font-size:1.1em;padding:24px&quot;&gt;&lt;strong&gt;穿行经典文学艺术的永恒之美&lt;/strong&gt; — 从莎士比亚到但丁、从威尔第到村上春树，通过36篇笔记系统理解悲剧净化、天才密码、语言共生与现实主义本质，在经典中照见人性的永恒坐标。&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;section&quot;&gt;
    &lt;div class=&quot;section-title&quot;&gt;&lt;span class=&quot;ico&quot;&gt;🧩&lt;/span&gt; 10 个核心概念&lt;/div&gt;
    &lt;div class=&quot;cards&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;1. 悲剧净化力量&lt;/h3&gt;&lt;p&gt;莎士比亚《李尔王》《罗朱》揭示悲剧如何通过怜悯与恐惧实现情感净化——亲情算计、家族仇恨、权力误判的永恒警示。&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;2. 文学的永恒人性&lt;/h3&gt;&lt;p&gt;从李尔王对&quot;嘴甜&quot;子女的偏爱到寇蒂莉亚的无条件之爱——四百年过去了，人性的基本矛盾从未改变。&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;3. 文学与历史互文&lt;/h3&gt;&lt;p&gt;莎翁《亨利六世》串起红白玫瑰战争，但丁《神曲》以地狱天堂评判历史人物——文学既记录历史，更审判历史。&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;4. 诗歌的情感书写&lt;/h3&gt;&lt;p&gt;庄姜《燕燕》开创送别诗范式，杜牧《张好好诗》以书法承载遗憾——诗歌是情感最浓缩、最精确的载体。&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;5. 天才的持续卓越&lt;/h3&gt;&lt;p&gt;霍洛维茨&quot;一辈子保持卓越&quot;，威尔第兼收德奥精华——天才是持续超越而非昙花一现，核心是不断求变。&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;6. 艺术的形式突破&lt;/h3&gt;&lt;p&gt;克里姆特从古典功底出发创立维也纳分离派——走正路才能创风格，创新需在扎实传统基础上完成蜕变。&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;7. 歌剧传承与创新&lt;/h3&gt;&lt;p&gt;威尔第融合德奥音乐恢弘气势与意大利美声精美——开放吸收+传统传承=有机创新。&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;8. 语言的文明承载&lt;/h3&gt;&lt;p&gt;世界语因缺乏文化根基而失败，希伯来语因民族记忆而复活——语言不仅是工具，更是文化基因的容器。&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;9. 哲学与真理辨识&lt;/h3&gt;&lt;p&gt;维特根斯坦实践验证法 + 逻辑分析法——区分有哲理的故事和无用的鸡汤，警惕&quot;智商税&quot;陷阱。&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;10. 文学的现实主义本质&lt;/h3&gt;&lt;p&gt;村上春树《1Q84》映射奥姆真理教与社会问题——《西游记》紧箍咒映射个体规训——任何文学作品归根结底是现实主义作品。&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;section&quot;&gt;
    &lt;div class=&quot;section-title&quot;&gt;&lt;span class=&quot;ico&quot;&gt;⭐&lt;/span&gt; MKS 核心（骨架中的骨架）&lt;/div&gt;
    &lt;div class=&quot;cards&quot;&gt;
      &lt;div class=&quot;card mks&quot;&gt;&lt;h3&gt;经典映照永恒人性&lt;/h3&gt;&lt;p&gt;李尔王对阿谀奉承的偏爱、朱丽叶对家族仇恨的超越、庄姜对命运不公的书写——经典之所以为经典，是因为它捕捉了超越时代的人性基本面。理解了这个，就理解了为什么四百年后我们仍然读莎士比亚。&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card mks&quot;&gt;&lt;h3&gt;悲剧净化与情感教育&lt;/h3&gt;&lt;p&gt;亚里士多德的&quot;卡塔西斯&quot;概念在莎翁手中达到巅峰：我们通过观看他人的苦难，释放并净化自己的恐惧与怜悯。《李尔王》教我们识破&quot;嘴甜&quot;表象，《罗朱》教我们仇恨如何摧毁美好。悲剧是最好的情感课堂。&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card mks&quot;&gt;&lt;h3&gt;天才 = 持续卓越而非昙花一现&lt;/h3&gt;&lt;p&gt;霍洛维茨拒绝听自己的唱片、每次演奏挖掘新内涵；威尔第融合德奥精华而不失意大利美声传统；克里姆特在古典功底之上完成分离派突破。真正的天才不是一次比赛夺冠，而是&lt;b&gt;一辈子拒绝自我重复&lt;/b&gt;。&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card mks&quot;&gt;&lt;h3&gt;语言是文明基因的载体&lt;/h3&gt;&lt;p&gt;世界语因缺乏文化承载而沦为小众爱好，古希伯来语因承载犹太民族的集体记忆而唯一复活。楔形文字通过专有名词锚定被破译。语言不只是沟通工具——它是族群的生活环境、价值观与历史记忆的编码。&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;section&quot;&gt;
    &lt;div class=&quot;section-title&quot;&gt;&lt;span class=&quot;ico&quot;&gt;📊&lt;/span&gt; 学习进度&lt;/div&gt;
    &lt;div class=&quot;progress-wrap&quot;&gt;
      &lt;div class=&quot;progress-label&quot;&gt;&lt;span&gt;知识卡片学习&lt;/span&gt;&lt;span id=&quot;progLabel&quot;&gt;0 / 10&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;progress-bar&quot;&gt;&lt;div class=&quot;progress-fill&quot; id=&quot;progBar&quot; style=&quot;width:0%&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;section&quot;&gt;
    &lt;div class=&quot;section-title&quot;&gt;&lt;span class=&quot;ico&quot;&gt;🔗&lt;/span&gt; 概念关系图&lt;/div&gt;
    &lt;div class=&quot;svg-wrap&quot; id=&quot;svgMap&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;section&quot;&gt;
    &lt;div class=&quot;section-title&quot;&gt;&lt;span class=&quot;ico&quot;&gt;📌&lt;/span&gt; 边界知识（15条）&lt;/div&gt;
    &lt;div class=&quot;tbl-wrap&quot;&gt;
    &lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;知识点&lt;/th&gt;&lt;th&gt;使用场景&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;《神曲》地狱九层结构（Limbo→背叛者）&lt;/td&gt;&lt;td&gt;理解但丁的历史人物评判体系&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;莎士比亚四大悲剧（哈姆雷特/奥赛罗/李尔王/麦克白）&lt;/td&gt;&lt;td&gt;西方文学核心书单&lt;/td&gt;&lt;/tr&gt;

    &lt;div class=&quot;section-title&quot;&gt;&lt;span class=&quot;ico&quot;&gt;🔍&lt;/span&gt; 案例分析：莎士比亚《李尔王》的当代回响&lt;/div&gt;
    &lt;div class=&quot;case-box&quot;&gt;
      &lt;h4&gt;▎背景&lt;/h4&gt;
      &lt;p&gt;李尔王年事已高，决定通过&quot;爱的告白&quot;测试分配国土。大女儿高纳里尔、二女儿里根以阿谀奉承获封国土；小女儿寇蒂莉亚因拒绝虚伪表达被剥夺继承权。最终李尔王被两个女儿背弃，小女儿率军救父失败被杀，李尔王在绝望中死去。这个故事距今约400年，但其中的亲情困境至今仍在无数家庭上演。&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;case-box&quot;&gt;
      &lt;h4&gt;▎MKS 四维度拆解&lt;/h4&gt;
      &lt;p&gt;&lt;strong&gt;悲剧净化：&lt;/strong&gt;李尔王的遭遇让观众/读者体验恐惧与怜悯——恐惧自己也会像李尔王一样被&quot;嘴甜&quot;迷惑，怜悯一位父亲被至亲背叛的痛苦。这种情感体验实现了亚里士多德所说的&quot;卡塔西斯&quot;（净化）。&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;永恒人性：&lt;/strong&gt;李尔王偏爱&quot;会来事&quot;的子女、忽视&quot;行动派&quot;的子女——这种情感认知偏差在任何时代都存在。莎士比亚捕捉的不是一个国王的故事，而是人类亲子关系中的普遍困境。&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;现实映射：&lt;/strong&gt;现代家庭中的遗产分配矛盾、赡养义务不均衡——信托律师基于20年实务观察得出结论：&quot;平等分配是最有效的公平原则&quot;。简单规则比复杂设计更能避免矛盾。&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;文学价值：&lt;/strong&gt;经典不是因为它&quot;古老&quot;而是因为它&quot;准确&quot;——400年后的读者仍然能在李尔王的错误中看见自己的影子。这就是经典的现实意义：&quot;帮助避免重复前人的弯路和死路&quot;。&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;case-box&quot;&gt;
      &lt;h4&gt;▎跨时代洞察&lt;/h4&gt;
      &lt;p&gt;&lt;strong&gt;莎翁名言映照：&quot;爱情里面要是掺杂了和它本身无关的算计，那就不是真的爱情。&quot;&lt;/strong&gt;——这一原则同样适用于亲情。李尔王对寇蒂莉亚的爱掺杂了权威诉求（要求&quot;孝心+服从&quot;），当预期未满足时转化为愤怒。纯粹的爱不应有条件。&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

var cardsData = [
  {id:&#x27;c0&#x27;,front:&#x27;悲剧的净化力量&#x27;,back:&#x27;&lt;h4&gt;定义&lt;/h4&gt;&lt;p&gt;亚里士多德提出的&quot;卡塔西斯&quot;——通过观看他人苦难，释放并净化自己的恐惧与怜悯。莎士比亚将这一机制发挥到极致。&lt;/p&gt;&lt;h4&gt;类比&lt;/h4&gt;&lt;p&gt;好比看一部催泪电影后感到&quot;心里轻松了&quot;——你没有被悲剧压垮，反而被它治愈了。&lt;/p&gt;&lt;h4&gt;示例&lt;/h4&gt;&lt;p&gt;《李尔王》：观众恐惧自己也会被&quot;嘴甜&quot;蒙蔽，怜悯一位父亲被至亲背叛——这种共情体验让人更清醒。&lt;/p&gt;&lt;h4&gt;反例&lt;/h4&gt;&lt;p&gt;纯爽文/玛丽苏——没有真实苦难，只有虚假圆满。看完没有任何情感净化，只是短暂的快感。&#x27;},
  {id:&#x27;c1&#x27;,front:&#x27;文学的永恒人性&#x27;,back:&#x27;&lt;h4&gt;定义&lt;/h4&gt;&lt;p&gt;经典文学的核心价值在于捕捉超越时代的人性基本面——亲情、爱情、权力、嫉妒、背叛——这些在四百年间从未改变。&lt;/p&gt;&lt;h4&gt;类比&lt;/h4&gt;&lt;p&gt;好比生物学中的DNA——外表千变万化，但基因序列基本稳定。文学经典就是人性的DNA图谱。&lt;/p&gt;&lt;h4&gt;示例&lt;/h4&gt;&lt;p&gt;李尔王偏爱&quot;嘴甜&quot;的子女→现代家长偏爱&quot;会来事&quot;的孩子。形式变了，人性没变。&lt;/p&gt;&lt;h4&gt;反例&lt;/h4&gt;&lt;p&gt;流行网文中&quot;霸道总裁爱上我&quot;——渲染的是特定时代的消费幻想而非永恒人性，十年后就会过时。&#x27;},
  {id:&#x27;c2&#x27;,front:&#x27;文学与历史互文&#x27;,back:&#x27;&lt;h4&gt;定义&lt;/h4&gt;&lt;p&gt;文学作品既记录历史事件，更通过人物塑造和情节设计对历史进行评判——文学是&quot;历史的二审法庭&quot;。&lt;/p&gt;&lt;h4&gt;类比&lt;/h4&gt;&lt;p&gt;好比纪录片vs剧情片——纪录片陈述事实，剧情片让观众&quot;感受&quot;历史。《亨利六世》让读者感受玫瑰战争的残酷，而非只记年代。&lt;/p&gt;&lt;h4&gt;示例&lt;/h4&gt;&lt;p&gt;但丁《神曲》将腐败教皇倒栽葱插入地狱第八层——这不是客观历史，而是文学对历史的审判。&lt;/p&gt;&lt;h4&gt;反例&lt;/h4&gt;&lt;p&gt;纯粹的历史年表——&quot;1455年玫瑰战争爆发&quot;只传递信息，没有情感体验和道德评判。&#x27;},
  {id:&#x27;c3&#x27;,front:&#x27;诗歌的情感书写&#x27;,back:&#x27;&lt;h4&gt;定义&lt;/h4&gt;&lt;p&gt;诗歌以最浓缩的语言承载最深层的情感——庄姜《燕燕》开创送别诗范式，杜牧《张好好诗》以书法承载一生的遗憾。&lt;/p&gt;&lt;h4&gt;类比&lt;/h4&gt;&lt;p&gt;好比香水——一滴浓缩了成千上万朵花的精华。一首诗就是一滴情感的浓缩液。&lt;/p&gt;&lt;h4&gt;示例&lt;/h4&gt;&lt;p&gt;&quot;瞻望弗及，泣涕如雨&quot;——八个字写尽送别之痛。李白&quot;孤帆远影碧空尽&quot;直接受益于此。&lt;/p&gt;&lt;h4&gt;反例&lt;/h4&gt;&lt;p&gt;朋友圈长文诉苦——情感未经提炼和形式约束，虽真实但缺乏艺术浓缩的美感与普适性。&#x27;},
  {id:&#x27;c4&#x27;,front:&#x27;天才的持续卓越&#x27;,back:&#x27;&lt;h4&gt;定义&lt;/h4&gt;&lt;p&gt;真正的天才不是一次比赛的冠军，而是一辈子拒绝自我重复的人——霍洛维茨从不听自己的唱片，每次演奏都挖掘新内涵。&lt;/p&gt;&lt;h4&gt;类比&lt;/h4&gt;&lt;p&gt;好比赛车手——不是在某场比赛拿第一，而是职业生涯二十年后仍在领奖台上。持续比峰值更重要。&lt;/p&gt;&lt;h4&gt;示例&lt;/h4&gt;&lt;p&gt;霍洛维茨协助拉赫玛尼诺夫改写自己作品的版本——作曲家本人听后表示&quot;不好意思再弹这部曲子&quot;。&lt;/p&gt;&lt;h4&gt;反例&lt;/h4&gt;&lt;p&gt;肖邦比赛冠军因过度商业活动疏于练琴最终退出顶级行列——昙花一现不是天才，持续超越才是。&#x27;},
  {id:&#x27;c5&#x27;,front:&#x27;艺术的形式突破&#x27;,back:&#x27;&lt;h4&gt;定义&lt;/h4&gt;&lt;p&gt;克里姆特的启示：创新突破必须在扎实传统功底之上完成——&quot;走正路才能创风格&quot;，标新立异的捷径不是真正的创新。&lt;/p&gt;&lt;h4&gt;类比&lt;/h4&gt;&lt;p&gt;好比建筑——必须先学会结构力学和材料学，才能设计出颠覆性的建筑。没学过基本功的&quot;创新&quot;只会坍塌。&lt;/p&gt;&lt;h4&gt;示例&lt;/h4&gt;&lt;p&gt;克里姆特14岁起接受十余年古典绘画训练，26岁获皇帝颁发金质勋章，此后才创立维也纳分离派。&lt;/p&gt;&lt;h4&gt;反例&lt;/h4&gt;&lt;p&gt;没有任何基本功的&quot;当代艺术&quot;——把颜料泼在画布上声称是&quot;解构&quot;。克里姆特告诉你：先画出《坐姿少女》级别的古典肖像，再谈突破。&#x27;},
  {id:&#x27;c6&#x27;,front:&#x27;歌剧传承与创新&#x27;,back:&#x27;&lt;h4&gt;定义&lt;/h4&gt;&lt;p&gt;威尔第的成功公式：开放吸收德奥精华（恢弘气势）+ 保留意大利美声传统（精美咏叹调）= 有机创新。&lt;/p&gt;&lt;h4&gt;类比&lt;/h4&gt;&lt;p&gt;好比烹饪fusion——不是把不相干的食材混在一起，而是在深刻理解两种菜系精髓后做有机融合。&lt;/p&gt;&lt;h4&gt;示例&lt;/h4&gt;&lt;p&gt;威尔第在米兰求学期间接触德奥音乐，将莫扎特式的宏大结构融入意大利歌剧的歌唱传统，形成了超越单一流派的风格。&lt;/p&gt;&lt;h4&gt;反例&lt;/h4&gt;&lt;p&gt;表面&quot;融合&quot;——比如在一部歌剧中强行插入流行唱法，既没有理解歌剧传统也不尊重流行音乐的特性。&#x27;},
  {id:&#x27;c7&#x27;,front:&#x27;语言的文明承载&#x27;,back:&#x27;&lt;h4&gt;定义&lt;/h4&gt;&lt;p&gt;语言的两大功能缺一不可：信息传递 + 文化承载。世界语失败的根本原因不是学的人少，而是它没有文化根基。&lt;/p&gt;&lt;h4&gt;类比&lt;/h4&gt;&lt;p&gt;好比房子——信息传递是&quot;遮风挡雨&quot;（基础功能），文化承载是&quot;家的感觉&quot;（情感归属）。毛坯房能住但不想住。&lt;/p&gt;&lt;h4&gt;示例&lt;/h4&gt;&lt;p&gt;因纽特语有上百个描述白色的词汇——这不是效率问题，而是这个民族在冰雪环境中积累的感知智慧的编码。&lt;/p&gt;&lt;h4&gt;反例&lt;/h4&gt;&lt;p&gt;世界语——语法完美、逻辑清晰，但没有任何一个民族的童年记忆、祖先传说是用世界语讲述的。&#x27;},
  {id:&#x27;c8&#x27;,front:&#x27;哲学与真理辨识&#x27;,back:&#x27;&lt;h4&gt;定义&lt;/h4&gt;&lt;p&gt;维特根斯坦的实践验证法：将道理还原为行动工具在真实情境中检验。&quot;你若盛开蝴蝶自来&quot;（可验证）vs&quot;种草吸引骏马&quot;（不可验证）。&lt;/p&gt;&lt;h4&gt;类比&lt;/h4&gt;&lt;p&gt;好比验钞——不是看印刷是否精美（听起来是否漂亮），而是看是否有防伪特征（在现实中是否可操作）。&lt;/p&gt;&lt;h4&gt;示例&lt;/h4&gt;&lt;p&gt;&quot;磨刀不误砍柴工&quot;成立——磨刀是直接提升效率的工具且需要实际行动；&quot;种草吸引骏马&quot;不成立——存在不可控环节。&lt;/p&gt;&lt;h4&gt;反例&lt;/h4&gt;&lt;p&gt;毒鸡汤&quot;五句话改变你一生&quot;——只讲理论不提供实践路径，回避关键环节，迎合即时慰藉需求。&#x27;},
  {id:&#x27;c9&#x27;,front:&#x27;文学的现实主义本质&#x27;,back:&#x27;&lt;h4&gt;定义&lt;/h4&gt;&lt;p&gt;&quot;任何文学作品归根结底都是现实主义的作品&quot;——虚构情节服务于对现实的深刻体察。《1Q84》映射邪教问题，《西游记》紧箍咒映射个体规训。&lt;/p&gt;&lt;h4&gt;类比&lt;/h4&gt;&lt;p&gt;好比梦境——梦的内容荒诞离奇，但梦中的焦虑、渴望、恐惧都是真实的。小说就是作家的&quot;白日梦&quot;。&lt;/p&gt;&lt;h4&gt;示例&lt;/h4&gt;&lt;p&gt;孙悟空从反抗紧箍咒到享受其带来的&quot;体制化认证&quot;——这正是现实中个体从抗拒规则到内化规则的过程。&lt;/p&gt;&lt;h4&gt;反例&lt;/h4&gt;&lt;p&gt;纯架空玄幻——如果完全脱离现实社会逻辑和人性基本法则，再华丽的世界观也只是空中楼阁。&#x27;}
];

function renderCard(){
  var c = cardsData[cardIdx];
  document.getElementById(&#x27;flipFront&#x27;).textContent = c.front;
  document.getElementById(&#x27;flipBack&#x27;).innerHTML = c.back;
  document.getElementById(&#x27;cardIdx&#x27;).textContent = (cardIdx+1) + &#x27; / 10&#x27;;
  var f = document.getElementById(&#x27;flipCard&#x27;);
  if(f.classList.contains(&#x27;flipped&#x27;)) f.classList.remove(&#x27;flipped&#x27;);
  var lb = document.getElementById(&#x27;learnedBtn&#x27;);
  if(learned.has(c.id)){ lb.textContent = &#x27;✓ 已学习&#x27;; lb.classList.add(&#x27;learned&#x27;); }
  else { lb.textContent = &#x27;✓ 标记已学习&#x27;; lb.classList.remove(&#x27;learned&#x27;); }
}

function flipCard(){
  document.getElementById(&#x27;flipCard&#x27;).classList.toggle(&#x27;flipped&#x27;);
}

function prevCard(){ cardIdx = (cardIdx-1+cardsData.length) % cardsData.length; renderCard(); }
function nextCard(){ cardIdx = (cardIdx+1) % cardsData.length; renderCard(); }

function markLearned(){
  var c = cardsData[cardIdx];
  if(learned.has(c.id)){ learned.delete(c.id); }
  else { learned.add(c.id); }
  saveState();
  renderCard();
  updateProgress();
}

var mcQuestions = [
  {q:&#x27;莎士比亚《李尔王》中大女儿和二女儿获得国土的方式是什么？&#x27;,opts:[&#x27;阿谀奉承的虚假表白&#x27;,&#x27;展示真实的孝心&#x27;,&#x27;通过武力威胁&#x27;,&#x27;李尔王随机分配&#x27;],&quot;answer&quot;:0,exp:&#x27;高纳里尔和里根以甜言蜜语、过度吹捧的方式通过李尔王的&quot;爱的告白&quot;测试，而寇蒂莉亚因拒绝虚伪表达被剥夺继承权。这是整个悲剧的起点。&#x27;},
  {q:&#x27;但丁《神曲》中引导但丁进入天堂的人物是谁？&#x27;,opts:[&#x27;古罗马诗人维吉尔&#x27;,&#x27;但丁的永恒爱人贝雅特丽齐&#x27;,&#x27;古希腊诗人荷马&#x27;,&#x27;圣徒哲学家阿奎纳&#x27;],&quot;answer&quot;:1,exp:&#x27;维吉尔只引导但丁穿越地狱和炼狱，到达天堂边界后由贝雅特丽齐接手。她象征至善至美，是但丁9岁一见钟情的精神引路者。&#x27;},
  {q:&#x27;霍洛维茨克服手型偏小缺陷的核心策略是什么？&#x27;,opts:[&#x27;放弃演奏难度大的曲目&#x27;,&#x27;只演奏现代作曲家作品&#x27;,&#x27;技术优化（定制琴键）+细节把控&#x27;,&#x27;每天增加额外练习时间&#x27;],&quot;answer&quot;:2,exp:&#x27;霍洛维茨通过定制轻琴键、窄琴键钢琴、对音准和钢琴摆放的极致把控来弥补手小的生理局限，而非简单地增加练习量。&#x27;},
  {q:&#x27;莎士比亚历史剧占其戏剧作品总量的比例是多少？&#x27;,opts:[&#x27;10%&#x27;,&#x27;50%&#x27;,&#x27;15%&#x27;,&#x27;30%&#x27;],&quot;answer&quot;:3,exp:&#x27;莎士比亚共创作10部英国历史剧，包括《亨利六世》上中下和《理查三世》等，占其戏剧总量的30%，多为早期作品。&#x27;},
  {q:&#x27;威尔第的成名作是哪部歌剧？&#x27;,opts:[&#x27;《纳布科》（1842年）&#x27;,&#x27;《阿依达》（1871年）&#x27;,&#x27;《茶花女》（1853年）&#x27;,&#x27;《弄臣》（1851年）&#x27;],&quot;answer&quot;:0,exp:&#x27;《纳布科》是威尔第的成名作，其中合唱《飞吧，思想，乘著金色的翅膀》被誉为意大利&quot;第二国歌&quot;，在意大利复兴运动中曾被提议作为国歌。&#x27;},
  {q:&#x27;村上春树《1Q84》中&quot;先驱&quot;教团的现实原型是什么？&#x27;,opts:[&#x27;基督教科学派&#x27;,&#x27;奥姆真理教&#x27;,&#x27;统一教&#x27;,&#x27;大卫教派&#x27;],&quot;answer&quot;:1,exp:&#x27;奥姆真理教1984年成立，1995年制造东京地铁沙林毒气事件。村上采访了60多名毒气受害者和8名教众，将调查融入《1Q84》的&quot;先驱&quot;教团设定。&#x27;},
  {q:&#x27;克里姆特成熟风格的标志性代表作品是哪一幅？&#x27;,opts:[&#x27;《贝多芬长卷》（1901年）&#x27;,&#x27;《坐姿少女》（1894年）&#x27;,&#x27;《吻》（1908年）&#x27;,&#x27;《水蛇》&#x27;],&quot;answer&quot;:2,exp:&#x27;《吻》使用真金箔拼贴、非对称构图、男性黑白矩形（象征知识力量）与女性彩色圆形（象征温柔美）交融，是克里姆特金色时期的巅峰之作。&#x27;},
  {q:&#x27;《神曲》中但丁描写的地狱形态是什么？&#x27;,opts:[&#x27;层层盘旋的高山&#x27;,&#x27;九层同心圆环&#x27;,&#x27;火焰深渊&#x27;,&#x27;螺旋向下的大漏斗&#x27;],&quot;answer&quot;:3,exp:&#x27;地狱呈螺旋向下的大漏斗形状，越向下空间越小、罪孽越深重。第九层是地心，由魔王撒旦掌控，惩罚背叛者（该隐、犹大）。&#x27;},
  {q:&#x27;庄姜在《诗经》中创作了被称为什么的作品？&#x27;,opts:[&#x27;中国最早的送别诗《燕燕》&#x27;,&#x27;中国最早的爱情诗《关雎》&#x27;,&#x27;中国最早的战争诗《击鼓》&#x27;,&#x27;中国最早的田园诗《十亩之间》&#x27;],&quot;answer&quot;:0,exp:&#x27;明代王士祯评价《燕燕》为&quot;万古送别诗之祖&quot;。&quot;瞻望弗及，泣涕如雨&quot;的反复咏叹奠定了中国送别诗的抒情范式。&#x27;},
  {q:&#x27;楔形文字破译者罗林森的核心职业身份是什么？&#x27;,opts:[&#x27;大学考古学教授&#x27;,&#x27;英国军人兼外交家&#x27;,&#x27;全职古文字学家&#x27;,&#x27;基督教传教士&#x27;],&quot;answer&quot;:1,exp:&#x27;罗林森17岁从军，23岁被派往波斯，25岁发现贝希斯敦铭文。他利用业余时间完成破译，开创亚述学，说明专业不在于职业而在投入程度。&#x27;},
  {q:&#x27;杜牧《张好好诗》书法的核心风格特征是什么？&#x27;,opts:[&#x27;狂草奔放不拘一格&#x27;,&#x27;楷书端正严谨&#x27;,&#x27;深得&quot;晋韵&quot;（二王行草风格）&#x27;,&#x27;魏碑雄健有力&#x27;],&quot;answer&quot;:2,exp:&#x27;故宫博物院藏《张好好诗并序》深得王羲之、王献之二王行草书的&quot;晋韵&quot;——自然流畅、结体舒朗、字形随字而安、不作刻意修饰。&#x27;},
  {q:&#x27;肖邦国际钢琴比赛在正常年份的举办周期是多久？&#x27;,opts:[&#x27;每年一次&#x27;,&#x27;每两年一次&#x27;,&#x27;每三年一次&#x27;,&#x27;每五年一次&#x27;],&quot;answer&quot;:3,exp:&#x27;除最初四届外，肖邦比赛每五年举办一次（逢五逢十正年头）。若参赛者绝对水平不足，第一名可空缺（如1985年和1990年两届）。&#x27;},
  {q:&#x27;世界语（Esperanto）的创造者是谁？&#x27;,opts:[&#x27;柴门霍夫&#x27;,&#x27;莱布尼茨&#x27;,&#x27;索绪尔&#x27;,&#x27;维特根斯坦&#x27;],&quot;answer&quot;:0,exp:&#x27;1887年波兰眼科医生柴门霍夫目睹族群间因语言隔阂产生的偏见与仇恨，创造世界语。但全球通晓者不足200万人，未能实现&quot;世界通用语&quot;目标。&#x27;},
  {q:&#x27;本-耶胡达复兴希伯来语时将多少个辅音字母转化为元音字母？&#x27;,opts:[&#x27;2个&#x27;,&#x27;4个&#x27;,&#x27;6个&#x27;,&#x27;8个&#x27;],&quot;answer&quot;:1,exp:&#x27;他将alef/a、yod/i、waw/u/o、he/e四个辅音字母转化为元音字母，解决了古希伯来语仅有辅音字母导致发音模糊的问题，为口语化奠定基础。&#x27;},
  {q:&#x27;但丁创作《神曲》使用的语言是什么？&#x27;,opts:[&#x27;拉丁语&#x27;,&#x27;古希腊语&#x27;,&#x27;托斯卡纳地区方言&#x27;,&#x27;法语&#x27;],&quot;answer&quot;:2,exp:&#x27;但丁采用托斯卡纳地区方言并加入拉丁语语法结构进行创作，直接推动了意大利语的书面化进程。《神曲》因此成为意大利语的奠基文本之一。&#x27;},
  {q:&#x27;维特根斯坦的核心哲学命题是什么？&#x27;,opts:[&#x27;我思故我在&#x27;,&#x27;存在先于本质&#x27;,&#x27;知识就是力量&#x27;,&#x27;语言的极限即世界的极限&#x27;],&quot;answer&quot;:3,exp:&#x27;维特根斯坦认为传统哲学难题源于语言理解差异：&quot;凡是能够言说的都能说清楚，对于不可言说之物必须保持沉默&quot;。他带来了现代哲学的&quot;语言学转向&quot;。&#x27;},

function renderQuiz(){
  // MCQ
  var mcHTML = &#x27;&#x27;;
  mcQuestions.forEach(function(q, i){
    mcHTML += &#x27;&lt;div class=&quot;quiz-card&quot; id=&quot;mcq&#x27;+i+&#x27;&quot;&gt;&lt;div class=&quot;q-title&quot;&gt;&#x27;+(i+1)+&#x27;. &#x27;+q.q+&#x27;&lt;/div&gt;&#x27;;
    q.opts.forEach(function(o, j){
      mcHTML += &#x27;&lt;div class=&quot;q-option&quot; data-mc=&quot;&#x27;+i+&#x27;&quot; data-oi=&quot;&#x27;+j+&#x27;&quot; onclick=&quot;checkMCQ(&#x27;+i+&#x27;,&#x27;+j+&#x27;)&quot;&gt;&#x27;+[&#x27;A&#x27;,&#x27;B&#x27;,&#x27;C&#x27;,&#x27;D&#x27;][j]+&#x27;. &#x27;+o+&#x27;&lt;/div&gt;&#x27;;
    });
    mcHTML += &#x27;&lt;div class=&quot;q-feedback&quot; id=&quot;mcfb&#x27;+i+&#x27;&quot;&gt;&lt;/div&gt;&lt;/div&gt;&#x27;;
  });
  document.getElementById(&#x27;mcQuiz&#x27;).innerHTML = mcHTML;
  // Restore answers
  Object.keys(quizAnswers).forEach(function(k){
    if(quizAnswers[k].type === &#x27;mc&#x27;){
      var ans = quizAnswers[k].answer;
      var opts = document.querySelectorAll(&#x27;#mcq&#x27;+k+&#x27; .q-option&#x27;);
      opts.forEach(function(o){
        if(parseInt(o.dataset.oi) === ans) o.classList.add(&#x27;chosen&#x27;);
      });
      // Show feedback
      var fb = document.getElementById(&#x27;mcfb&#x27;+k);
      var correct = mcQuestions[parseInt(k)].answer;
      if(ans === correct){
        opts[correct].classList.add(&#x27;correct&#x27;);
        fb.className = &#x27;q-feedback correct&#x27;;
        fb.textContent = &#x27;✓ 正确！&#x27; + (mcQuestions[parseInt(k)].exp || &#x27;&#x27;);
      } else {
        opts[ans].classList.add(&#x27;wrong&#x27;);
        opts[correct].classList.add(&#x27;correct&#x27;);
        fb.className = &#x27;q-feedback wrong&#x27;;
        fb.textContent = &#x27;✗ 正确答案是 &#x27; + [&#x27;A&#x27;,&#x27;B&#x27;,&#x27;C&#x27;,&#x27;D&#x27;][correct] + &#x27;。&#x27; + (mcQuestions[parseInt(k)].exp || &#x27;&#x27;);
      }
    }
  });
  // SA
  var saHTML = &#x27;&#x27;;
  saQuestions.forEach(function(q, i){
    saHTML += &#x27;&lt;div class=&quot;quiz-card&quot;&gt;&lt;div class=&quot;q-title&quot;&gt;&#x27;+(i+1)+&#x27;. &#x27;+q.q+&#x27;&lt;/div&gt;&#x27;;
    saHTML += &#x27;&lt;textarea id=&quot;sa&#x27;+i+&#x27;&quot; placeholder=&quot;请输入你的回答...&quot; onchange=&quot;saveSA(&#x27;+i+&#x27;)&quot;&gt;&#x27;+(quizAnswers[&#x27;sa&#x27;+i] ? quizAnswers[&#x27;sa&#x27;+i].answer : &#x27;&#x27;)+&#x27;&lt;/textarea&gt;&#x27;;
    saHTML += &#x27;&lt;button class=&quot;btn btn-sm&quot; style=&quot;margin-top:8px&quot; onclick=&quot;showSARef(&#x27;+i+&#x27;)&quot;&gt;查看参考要点&lt;/button&gt;&#x27;;
    saHTML += &#x27;&lt;div class=&quot;q-feedback&quot; id=&quot;safb&#x27;+i+&#x27;&quot;&gt;&lt;/div&gt;&lt;/div&gt;&#x27;;
  });
  document.getElementById(&#x27;saQuiz&#x27;).innerHTML = saHTML;

function checkMCQ(qi, oi){
  if(quizAnswers[qi+&#x27;_mc&#x27;]) return; // Already answered
  var q = mcQuestions[qi];
  var correct = q.answer;
  var opts = document.querySelectorAll(&#x27;#mcq&#x27;+qi+&#x27; .q-option&#x27;);
  opts.forEach(function(o){ o.style.pointerEvents = &#x27;none&#x27;; });
  opts[oi].classList.add(&#x27;chosen&#x27;);
  var fb = document.getElementById(&#x27;mcfb&#x27;+qi);
  if(oi === correct){
    opts[oi].classList.add(&#x27;correct&#x27;);
    fb.className = &#x27;q-feedback correct&#x27;;
    fb.textContent = &#x27;✓ 正确！&#x27; + (q.exp || &#x27;&#x27;);
    quizAnswers[qi+&#x27;_mc&#x27;] = {type:&#x27;mc&#x27;,answer:oi,correct:true};
    if(stats){ stats.total++; stats.correct++; }
  } else {
    opts[oi].classList.add(&#x27;wrong&#x27;);
    opts[correct].classList.add(&#x27;correct&#x27;);
    fb.className = &#x27;q-feedback wrong&#x27;;
    fb.textContent = &#x27;✗ 正确答案是 &#x27; + [&#x27;A&#x27;,&#x27;B&#x27;,&#x27;C&#x27;,&#x27;D&#x27;][correct] + &#x27;。&#x27; + (q.exp || &#x27;&#x27;);
    quizAnswers[qi+&#x27;_mc&#x27;] = {type:&#x27;mc&#x27;,answer:oi,correct:false};
    if(stats){ stats.total++; }
    wrongList.push({q:q.q, your: [&#x27;A&#x27;,&#x27;B&#x27;,&#x27;C&#x27;,&#x27;D&#x27;][oi], correct: [&#x27;A&#x27;,&#x27;B&#x27;,&#x27;C&#x27;,&#x27;D&#x27;][correct], exp: q.exp, time: new Date().toISOString()});
  }
  var today = new Date().toDateString();
  if(stats &amp;&amp; !stats.days.includes(today)) stats.days.push(today);
  saveState();
}

function saveSA(i){
  var val = document.getElementById(&#x27;sa&#x27;+i).value;
  if(val.trim()){
    quizAnswers[&#x27;sa&#x27;+i] = {type:&#x27;sa&#x27;,answer:val};
    saveState();
  }
}

function showSARef(i){
  var fb = document.getElementById(&#x27;safb&#x27;+i);
  fb.className = &#x27;q-feedback correct&#x27;;
  fb.textContent = &#x27;参考要点：&#x27; + saQuestions[i].ref;
}

function startExam(){
  if(examActive) return;
  examActive = true;
  // Shuffle and pick
  var mcPool = [].slice.call(mcQuestions).sort(function(){return Math.random()-0.5}).slice(0,7);
  var saPool = [].slice.call(saQuestions).sort(function(){return Math.random()-0.5}).slice(0,3);
  examData = mcPool.concat(saPool);
  var html = &#x27;&#x27;;
  examData.forEach(function(q, i){
    if(q.opts){ // MCQ
      html += &#x27;&lt;div class=&quot;quiz-card&quot;&gt;&lt;div class=&quot;q-title&quot;&gt;&#x27;+(i+1)+&#x27;. [选择] &#x27;+q.q+&#x27;&lt;/div&gt;&#x27;;
      q.opts.forEach(function(o, j){
        html += &#x27;&lt;div class=&quot;q-option&quot; data-ex=&quot;&#x27;+i+&#x27;&quot; data-oi=&quot;&#x27;+j+&#x27;&quot; onclick=&quot;chooseExam(&#x27;+i+&#x27;,&#x27;+j+&#x27;)&quot;&gt;&#x27;+[&#x27;A&#x27;,&#x27;B&#x27;,&#x27;C&#x27;,&#x27;D&#x27;][j]+&#x27;. &#x27;+o+&#x27;&lt;/div&gt;&#x27;;
      });
      html += &#x27;&lt;/div&gt;&#x27;;
    } else { // SA
      html += &#x27;&lt;div class=&quot;quiz-card&quot;&gt;&lt;div class=&quot;q-title&quot;&gt;&#x27;+(i+1)+&#x27;. [简答] &#x27;+q.q+&#x27;&lt;/div&gt;&#x27;;
      html += &#x27;&lt;textarea id=&quot;exsa&#x27;+i+&#x27;&quot; placeholder=&quot;请输入你的回答...&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;&#x27;;
    }
  });
  document.getElementById(&#x27;examContent&#x27;).innerHTML = html;
  document.getElementById(&#x27;examStart&#x27;).classList.add(&#x27;hidden&#x27;);
  document.getElementById(&#x27;examSubmit&#x27;).classList.remove(&#x27;hidden&#x27;);
  // Timer
  var sec = 900;
  var timer = document.getElementById(&#x27;examTimer&#x27;);
  function tick(){
    if(!examActive){ clearInterval(examTimerId); return; }
    sec--;
    if(sec &lt;= 0){ submitExam(); return; }
    var m = Math.floor(sec/60), s = sec%60;
    timer.textContent = m+&#x27;:&#x27;+(s&lt;10?&#x27;0&#x27;:&#x27;&#x27;)+s;
    if(sec &lt; 60) timer.style.color = &#x27;#e74c3c&#x27;;
  }
  tick();
  examTimerId = setInterval(tick, 1000);
}

var examChoices = {};
function chooseExam(i, oi){
  // Deselect others
  var allOpts = document.querySelectorAll(&#x27;[data-ex=&quot;&#x27;+i+&#x27;&quot;]&#x27;);
  allOpts.forEach(function(o){ o.classList.remove(&#x27;selected&#x27;); });
  var chosen = document.querySelector(&#x27;[data-ex=&quot;&#x27;+i+&#x27;&quot;][data-oi=&quot;&#x27;+oi+&#x27;&quot;]&#x27;);
  if(chosen) chosen.classList.add(&#x27;selected&#x27;);
  examChoices[i] = oi;
}

function submitExam(){
  if(!examActive) return;
  examActive = false;
  clearInterval(examTimerId);
  document.getElementById(&#x27;examSubmit&#x27;).classList.add(&#x27;hidden&#x27;);
  var score = 0, total = examData.length;
  var mcTotal = 0, mcCorrect = 0;
  var resultHTML = &#x27;&lt;div class=&quot;section&quot;&gt;&lt;div class=&quot;section-title&quot;&gt;&lt;span class=&quot;ico&quot;&gt;📋&lt;/span&gt; 考试结果&lt;/div&gt;&#x27;;
  examData.forEach(function(q, i){
    if(q.opts){ // MCQ
      mcTotal++;
      var correct = mcQuestions.indexOf(q) &gt;= 0 ? mcQuestions[mcQuestions.indexOf(q)].answer : q.answer;
      // Find original q in mcQuestions to get correct answer
      var found = mcQuestions.filter(function(x){return x.q === q.q})[0];
      if(!found) return;
      correct = found.answer;
      var your = examChoices[i];
      if(your === correct){ score++; mcCorrect++; }
      resultHTML += &#x27;&lt;div class=&quot;quiz-card&quot;&gt;&lt;div class=&quot;q-title&quot;&gt;&#x27;+(i+1)+&#x27;. &#x27;+q.q+&#x27;&lt;/div&gt;&#x27;;
      resultHTML += &#x27;&lt;p style=&quot;color:&#x27;+(your===correct?&#x27;#27ae60&#x27;:&#x27;#c0392b&#x27;)+&#x27;&quot;&gt;你的答案：&#x27;+(your!==undefined?[&#x27;A&#x27;,&#x27;B&#x27;,&#x27;C&#x27;,&#x27;D&#x27;][your]:&#x27;未作答&#x27;)+&#x27; | 正确答案：&#x27;+[&#x27;A&#x27;,&#x27;B&#x27;,&#x27;C&#x27;,&#x27;D&#x27;][correct]+&#x27;&lt;/p&gt;&#x27;;
      resultHTML += &#x27;&lt;p style=&quot;font-size:var(--fs-sm);color:var(--muted)&quot;&gt;&#x27;+found.exp+&#x27;&lt;/p&gt;&lt;/div&gt;&#x27;;
      if(your !== correct &amp;&amp; your !== undefined){
        stats.total++; stats.correct--;
        wrongList.push({q:q.q, your:[&#x27;A&#x27;,&#x27;B&#x27;,&#x27;C&#x27;,&#x27;D&#x27;][your], correct:[&#x27;A&#x27;,&#x27;B&#x27;,&#x27;C&#x27;,&#x27;D&#x27;][correct], exp:found.exp, time:new Date().toISOString()});
      } else if(your === correct){
        stats.total++; stats.correct++;
      }
    } else { // SA
      resultHTML += &#x27;&lt;div class=&quot;quiz-card&quot;&gt;&lt;div class=&quot;q-title&quot;&gt;&#x27;+(i+1)+&#x27;. &#x27;+q.q+&#x27;&lt;/div&gt;&#x27;;
      resultHTML += &#x27;&lt;p style=&quot;font-size:var(--fs-sm);color:var(--muted)&quot;&gt;你的回答已记录。参考要点：&lt;/p&gt;&#x27;;
      resultHTML += &#x27;&lt;p style=&quot;font-size:var(--fs-sm)&quot;&gt;&#x27;+q.ref+&#x27;&lt;/p&gt;&lt;/div&gt;&#x27;;
    }
  });
  resultHTML += &#x27;&lt;div class=&quot;card&quot; style=&quot;text-align:center;margin-top:16px&quot;&gt;&lt;h3&gt;得分：&#x27;+score+&#x27; / &#x27;+mcTotal+&#x27;（选择题部分）&lt;/h3&gt;&#x27;;
  resultHTML += &#x27;&lt;p style=&quot;color:var(--muted)&quot;&gt;简答题请对照参考要点自我评估。薄弱概念提示：&lt;/p&gt;&#x27;;
  if(mcCorrect &lt; mcTotal){
    resultHTML += &#x27;&lt;p&gt;建议复习方向：悲剧净化、天才持续卓越、语言文明承载、维特根斯坦实践验证法&lt;/p&gt;&#x27;;
  }

// ========== TAB 4: Review Mode ==========
function renderReview(){
  document.getElementById(&#x27;statTotal&#x27;).textContent = stats.total || 0;
  var rate = stats.total &gt; 0 ? Math.round(stats.correct/Math.max(stats.total,1)*100) : 0;
  document.getElementById(&#x27;statCorrect&#x27;).textContent = rate + &#x27;%&#x27;;
  document.getElementById(&#x27;statDays&#x27;).textContent = (stats.days||[]).length;
  document.getElementById(&#x27;statCards&#x27;).textContent = learned.size;
  // Wrong book
  var wb = document.getElementById(&#x27;wrongBook&#x27;);
  if(wrongList.length === 0){
    wb.innerHTML = &#x27;&lt;p style=&quot;color:var(--muted)&quot;&gt;暂无错题，继续保持！&lt;/p&gt;&#x27;;
  } else {
    var wh = &#x27;&lt;div style=&quot;max-height:500px;overflow-y:auto&quot;&gt;&#x27;;
    wrongList.slice().reverse().forEach(function(w, i){
      wh += &#x27;&lt;div class=&quot;quiz-card&quot;&gt;&lt;div class=&quot;q-title&quot;&gt;&#x27;+(i+1)+&#x27;. &#x27;+w.q+&#x27;&lt;/div&gt;&#x27;;
      wh += &#x27;&lt;p style=&quot;color:#c0392b&quot;&gt;你的答案：&#x27;+w.your+&#x27; | 正确答案：&#x27;+w.correct+&#x27;&lt;/p&gt;&#x27;;
      wh += &#x27;&lt;p style=&quot;font-size:var(--fs-sm);color:var(--muted)&quot;&gt;&#x27;+w.exp+&#x27;&lt;/p&gt;&#x27;;
      wh += &#x27;&lt;p style=&quot;font-size:11px;color:var(--muted)&quot;&gt;&#x27;+new Date(w.time).toLocaleString()+&#x27;&lt;/p&gt;&lt;/div&gt;&#x27;;
    });
    wh += &#x27;&lt;button class=&quot;btn btn-sm&quot; onclick=&quot;clearWrong()&quot;&gt;清空错题本&lt;/button&gt;&lt;/div&gt;&#x27;;
    wb.innerHTML = wh;
  }
  // Weak concepts
  var wc = document.getElementById(&#x27;weakConcepts&#x27;);
  if(stats.total &lt; 10){
    wc.innerHTML = &#x27;&lt;p style=&quot;color:var(--muted)&quot;&gt;答题数据不足（需10题以上），完成更多题目后显示分析。&lt;/p&gt;&#x27;;
  } else {
    wc.innerHTML = &#x27;&lt;p&gt;基于错题数据，建议重点复习：&lt;/p&gt;&lt;ul style=&quot;padding-left:20px&quot;&gt;&lt;li&gt;悲剧净化力量的机制&lt;/li&gt;&lt;li&gt;天才持续卓越 vs 昙花一现&lt;/li&gt;&lt;li&gt;语言的文化承载功能&lt;/li&gt;&lt;li&gt;维特根斯坦实践验证法&lt;/li&gt;&lt;li&gt;文学的现实主义本质&lt;/li&gt;&lt;/ul&gt;&#x27;;
  }
}

function clearWrong(){
  if(confirm(&#x27;确定清空所有错题记录？&#x27;)){
    wrongList = [];
    saveState();
    renderReview();
  }
}

    if(fb){
      fb.style.display = &#x27;block&#x27;;
      fb.innerHTML = &#x27;&lt;div class=&quot;quiz-card&quot; style=&quot;background:#f9f3ea&quot;&gt;&lt;p&gt;&lt;strong&gt;你的选择：&#x27;+[&#x27;A&#x27;,&#x27;B&#x27;,&#x27;C&#x27;][s.choice]+&#x27;&lt;/strong&gt;&lt;/p&gt;&lt;p style=&quot;margin-top:8px&quot;&gt;&#x27;+r.feedbacks[s.choice]+&#x27;&lt;/p&gt;&lt;/div&gt;&#x27;;
    }
    // Disable all buttons in this round
    r.opts.forEach(function(_, oi){
      var b2 = document.getElementById(&#x27;dbtn&#x27;+k+&#x27;_&#x27;+oi);
      if(b2) b2.style.pointerEvents = &#x27;none&#x27;;
    });
  });
}

function makeDecision(ri, oi){
  if(decisionState[ri] !== undefined) return;
  decisionState[ri] = {choice: oi};
  var r = decisionRounds[ri];
  // Disable all buttons
  r.opts.forEach(function(_, j){
    var btn = document.getElementById(&#x27;dbtn&#x27;+ri+&#x27;_&#x27;+j);
    if(btn) btn.style.pointerEvents = &#x27;none&#x27;;
  });
  var btn = document.getElementById(&#x27;dbtn&#x27;+ri+&#x27;_&#x27;+oi);
  if(btn) btn.classList.add(&#x27;selected&#x27;);
  var fb = document.getElementById(&#x27;dfb&#x27;+ri);
  fb.style.display = &#x27;block&#x27;;
  fb.innerHTML = &#x27;&lt;div class=&quot;quiz-card&quot; style=&quot;background:#f9f3ea&quot;&gt;&lt;p&gt;&lt;strong&gt;你的选择：&#x27;+[&#x27;A&#x27;,&#x27;B&#x27;,&#x27;C&#x27;][oi]+&#x27;&lt;/strong&gt;&lt;/p&gt;&lt;p style=&quot;margin-top:8px&quot;&gt;&#x27;+r.feedbacks[oi]+&#x27;&lt;/p&gt;&lt;/div&gt;&#x27;;
}

// ========== INIT ==========
(function init(){
  renderCard();
  updateProgress();
  renderSVG();
})();
&lt;/script&gt;

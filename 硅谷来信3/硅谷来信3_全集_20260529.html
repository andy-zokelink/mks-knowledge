{front:&#x27;四因说分析框架&#x27;,back:&#x27;&lt;span class=&quot;dim-label&quot;&gt;定义&lt;/span&gt;质料因(构成材质/内在)←→形式因(本质定位/外在)；动力因(实现手段)←→目的因(核心目标)。四因共同作用才是成功的充分条件。&lt;br&gt;&lt;span class=&quot;dim-label&quot;&gt;类比&lt;/span&gt;如同做菜：质料=食材，形式=菜系定位，动力=烹饪技术，目的=宴客还是果腹。&lt;br&gt;&lt;span class=&quot;dim-label&quot;&gt;示例&lt;/span&gt;瓦特+博尔顿蒸汽机公司：质料(技术+管理+执行互补)、形式(工业设备公司)、动力(专利+制造)、目的(服务工业革命)。&lt;br&gt;&lt;span class=&quot;dim-label&quot;&gt;反例&lt;/span&gt;三个设计师创业：质料因同质化(无人懂财务/销售)，必然失败。&#x27;},
{front:&#x27;斯多葛理性主义&#x27;,back:&#x27;&lt;span class=&quot;dim-label&quot;&gt;定义&lt;/span&gt;奥勒留主张：理性是人性延伸，遵循本性即遵循自然规律。&quot;以出世的态度做入世的事情&quot;——淡泊名利但履行社会责任。&lt;br&gt;&lt;span class=&quot;dim-label&quot;&gt;类比&lt;/span&gt;如同开源社区维护者——不计较个人名利，但每天认真写代码、回Issue、做Code Review。&lt;br&gt;&lt;span class=&quot;dim-label&quot;&gt;示例&lt;/span&gt;奥勒留在位19年，多数时间在边疆军营度过，夜以继日处理政务，死于外地——真正的&quot;入世&quot;。&lt;br&gt;&lt;span class=&quot;dim-label&quot;&gt;反例&lt;/span&gt;&quot;躺平&quot;——消极避世不等于出世，斯多葛强调的是积极行动+内心淡泊。&#x27;},

{q:&#x27;拉姆斯菲尔德风险分类中，最危险且最难防范的风险类型是什么？&#x27;,opts:[&#x27;已知的已知——已掌握的知识和确定的风险&#x27;,&#x27;已知的未知——知道存在但不了解的领域&#x27;,&#x27;意识不到已知——逻辑矛盾的认知状态&#x27;,&#x27;未知的未知——完全未察觉的知识盲区&#x27;],&quot;answer&quot;:3,exp:&#x27;最危险是&quot;未知的未知&quot;——完全未察觉的盲区，因无防范机制可能导致灭顶之灾。转化路径：无知→通识教育缩小盲区；信息受限→拓展可靠信息源；手段缺失→发展检测技术。&#x27;},
{q:&#x27;阿德勒认为心理最健康、最具适应性的性格类型是什么？&#x27;,opts:[&#x27;统治型——支配欲强，通过控制他人获得满足&#x27;,&#x27;依赖型——缺乏主动性，习惯依赖他人安排&#x27;,&#x27;回避型——恐惧失败，以&quot;不感兴趣&quot;为借口拒绝参与&#x27;,&#x27;社会利益型——合作导向，热心肠、善交往、为他人考虑&#x27;],&quot;answer&quot;:3,exp:&#x27;阿德勒四分法：统治型(支配欲强)、依赖型(缺乏主动性)、回避型(恐惧失败)、社会利益型(合作导向)。社会利益型心理最健康，形成于被理解与尊重的和谐家庭环境，是人格改变的理想目标。&#x27;},
{q:&#x27;以下哪项正确描述了斯宾诺莎的&quot;上帝&quot;与传统宗教上帝的差异？&#x27;,opts:[&#x27;斯宾诺莎否认任何形式的上帝存在&#x27;,&#x27;传统上帝是可通过理性完全认知的&#x27;,&#x27;两者没有实质差异，只是术语不同&#x27;,&#x27;斯宾诺莎的上帝内在于世界，是自然规律的总集，可通过理性认知&#x27;],&quot;answer&quot;:3,exp:&#x27;斯宾诺莎主张&quot;内在性&quot;(Immanence)：上帝=自然界一切事物和自然规律的总集，渗透于物质与精神世界。传统上帝是&quot;超越性&quot;(Transcendence)的——存在于世界之外，凡人无法理解。爱因斯坦等科学家的&quot;上帝&quot;信仰更接近斯宾诺莎式。&#x27;},
{q:&#x27;吴军建议如何对待&quot;强词夺理的自圆其说&quot;(如末日预言家在预言失败后继续辩解)？&#x27;,opts:[&#x27;据理力争，用逻辑驳倒对方&#x27;,&#x27;完全忽视，不与这类人产生任何交集&#x27;,&#x27;赞同对方以维持表面和谐&#x27;,&#x27;保持距离观察，仅在对方行为损害自身利益时采取行动&#x27;],&quot;answer&quot;:3,exp:&#x27;三大建议：①避免直接争辩(参考奥勒留——保持距离观察)②维护自身利益——仅在对方行为损害你时采取行动③接受认知差异——不同生活环境造就不同认知体系，改变他人几乎不可能。&#x27;},
];

{q:&#x27;吴军为什么说&quot;通识教育是将未知的未知转化为已知的未知的关键工具&quot;？&#x27;,hint:&#x27;通识教育提供跨学科常识，让个人意识到自身知识盲区的存在(意识到未知)。无知是未知未知的第一根源，通识教育直接缩小无知范围。一旦&quot;知道不知道什么&quot;，就可以针对性学习。&#x27;},
{q:&#x27;阿德勒认为自卑感与优越感如何共同驱动个人发展？健康自卑与自卑情结的区别是什么？&#x27;,hint:&#x27;自卑感驱使人摆脱现状，优越感驱使人追求更高目标，二者构成发展的基本动力。健康自卑=正常心理反应(促进努力)，自卑情结=因持续挫折逃避问题、限制活动范围(成为障碍)。关键在补偿方向是否正确。&#x27;},

function renderConceptGrid(){
document.getElementById(&#x27;conceptGrid&#x27;).innerHTML = concepts.map(c=&gt;`
&lt;div class=&quot;concept-card${c.mks?&#x27; mks&#x27;:&#x27;&#x27;}&quot;&gt;
&lt;h4&gt;${c.name}&lt;/h4&gt;
&lt;p&gt;${c.desc}&lt;/p&gt;
&lt;/div&gt;`).join(&#x27;&#x27;);
}

function renderMKSGrid(){
document.getElementById(&#x27;mksGrid&#x27;).innerHTML = concepts.filter(c=&gt;c.mks).map(c=&gt;`
&lt;div class=&quot;concept-card mks&quot;&gt;
&lt;h4&gt;${c.name}&lt;/h4&gt;
&lt;p&gt;${c.desc}&lt;/p&gt;
&lt;span class=&quot;badge badge-mks&quot;&gt;骨架概念&lt;/span&gt;
&lt;/div&gt;`).join(&#x27;&#x27;);
}

function renderBoundaryTable(){

`).join(&#x27;&#x27;);

function renderLearningPath(){

}

// ============ FLIP CARDS ============
var flipIdx = 0;
var learnedCards = LS.learnedCards || [];
function renderFlipCard(){
var c = flipCards[flipIdx];
document.getElementById(&#x27;flipFront&#x27;).textContent = c.front;
document.getElementById(&#x27;flipBack&#x27;).innerHTML = c.back;
document.getElementById(&#x27;flipProgress&#x27;).textContent = (flipIdx+1)+&#x27;/&#x27;+flipCards.length;
if(learnedCards.indexOf(flipIdx)&gt;=0){
document.getElementById(&#x27;learnedBtn&#x27;).classList.add(&#x27;learned&#x27;);
document.getElementById(&#x27;learnedBtn&#x27;).textContent = &#x27;✓ 已学习&#x27;;
} else {
document.getElementById(&#x27;learnedBtn&#x27;).classList.remove(&#x27;learned&#x27;);
document.getElementById(&#x27;learnedBtn&#x27;).textContent = &#x27;✓ 已学习&#x27;;
}
}
function flipPrev(){ flipIdx = (flipIdx-1+flipCards.length)%flipCards.length; resetFlip(); renderFlipCard(); }
function flipNext(){ flipIdx = (flipIdx+1)%flipCards.length; resetFlip(); renderFlipCard(); }
function resetFlip(){ document.getElementById(&#x27;flipInner&#x27;).classList.remove(&#x27;flipped&#x27;); }
function markLearned(){
if(learnedCards.indexOf(flipIdx)&lt;0) learnedCards.push(flipIdx);
else learnedCards = learnedCards.filter(function(i){return i!==flipIdx;});
LS.learnedCards = learnedCards; saveLS();
renderFlipCard(); updateProgress();
}

// ============ MCQ &amp; SAQ ============
var mcqAnswered = LS.mcqAnswered || {};
var saqAnswered = LS.saqAnswered || {};
function renderMCQ(){
var h=&#x27;&#x27;;
mcQuestions.forEach(function(q,i){
h+=&#x27;&lt;div class=&quot;quiz-card&quot; id=&quot;mcq&#x27;+i+&#x27;&quot;&gt;&lt;span class=&quot;q-tag q-mc&quot;&gt;选择题 #&#x27;+(i+1)+&#x27;&lt;/span&gt;&lt;div class=&quot;q-text&quot;&gt;&#x27;+q.q+&#x27;&lt;/div&gt;&#x27;;
q.opts.forEach(function(o,j){
h+=&#x27;&lt;div class=&quot;q-option&quot; onclick=&quot;selectMC(&#x27;+i+&#x27;,&#x27;+j+&#x27;,this)&quot; id=&quot;mcq&#x27;+i+&#x27;o&#x27;+j+&#x27;&quot;&gt;&#x27;+&#x27;ABCD&#x27;[j]+&#x27;. &#x27;+o+&#x27;&lt;/div&gt;&#x27;;
});
h+=&#x27;&lt;div class=&quot;q-feedback&quot; id=&quot;mcq&#x27;+i+&#x27;fb&quot;&gt;&lt;/div&gt;&lt;/div&gt;&#x27;;
});
document.getElementById(&#x27;mcqContainer&#x27;).innerHTML = h;
// Restore answered
Object.keys(mcqAnswered).forEach(function(k){
var a = mcqAnswered[k];
var q = mcQuestions[k];
var fb = document.getElementById(&#x27;mcq&#x27;+k+&#x27;fb&#x27;);
fb.className = &#x27;q-feedback show &#x27;+(a==q[&quot;answer&quot;]?&#x27;right&#x27;:&#x27;wrong-msg&#x27;);
fb.textContent = q.exp;
var opts = document.querySelectorAll(&#x27;#mcq&#x27;+k+&#x27; .q-option&#x27;);
opts.forEach(function(o,oi){
o.style.pointerEvents = &#x27;none&#x27;;
if(oi==q[&quot;answer&quot;]) o.classList.add(&#x27;correct&#x27;);
if(oi==a &amp;&amp; a!=q[&quot;answer&quot;]) o.classList.add(&#x27;wrong&#x27;);
});
});
}
function selectMC(qi,oi,el){
if(mcqAnswered[qi]!==undefined) return;
mcqAnswered[qi] = oi;
var q = mcQuestions[qi];
var fb = document.getElementById(&#x27;mcq&#x27;+qi+&#x27;fb&#x27;);

});
h+=&#x27;&lt;/div&gt;&#x27;;
});
saIdx.forEach(function(qi,i){
h+=&#x27;&lt;div class=&quot;quiz-card&quot;&gt;&lt;span class=&quot;q-tag q-sa&quot;&gt;简答 #&#x27;+(i+1)+&#x27;&lt;/span&gt;&lt;div class=&quot;q-text&quot;&gt;&#x27;+saQuestions[qi].q+&#x27;&lt;/div&gt;&#x27;;
h+=&#x27;&lt;textarea class=&quot;sa-input&quot; id=&quot;exsa&#x27;+qi+&#x27;&quot; placeholder=&quot;输入你的答案...&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;&#x27;;
});
h+=&#x27;&lt;button class=&quot;btn&quot; onclick=&quot;submitExam()&quot; style=&quot;margin-top:16px&quot;&gt;提交答卷&lt;/button&gt;&#x27;;
area.innerHTML = h;

function updateExamTimer(){

var s = examTimeLeft%60;
var el = document.getElementById(&#x27;examTimer&#x27;);
el.textContent = m+&#x27;:&#x27;+(s&lt;10?&#x27;0&#x27;:&#x27;&#x27;)+s;
if(examTimeLeft&lt;120) el.classList.add(&#x27;warning&#x27;);
else el.classList.remove(&#x27;warning&#x27;);

function examSelectMC(qi,oi,el){
examData.answers[&#x27;mc_&#x27;+qi] = oi;
var opts = document.querySelectorAll(&#x27;#exmco&#x27;+qi+&#x27;o0,#exmco&#x27;+qi+&#x27;o1,#exmco&#x27;+qi+&#x27;o2,#exmco&#x27;+qi+&#x27;o3&#x27;);

}
function submitExam(){
clearInterval(examTimerId);
var score = 0, total = 7, results = [];
examData.mc.forEach(function(qi){
var a = examData.answers[&#x27;mc_&#x27;+qi];
var q = mcQuestions[qi];
if(a === q[&quot;answer&quot;]) score++;
results.push({q:q.q, correct:a===q[&quot;answer&quot;], exp:q.exp, userAns:a!==undefined?&#x27;ABCD&#x27;[a]:&#x27;未作答&#x27;, correctAns:&#x27;ABCD&#x27;[q[&quot;answer&quot;]]});
});
// Grade SA (lenient: just check if answered)
examData.sa.forEach(function(qi){
var a = document.getElementById(&#x27;exsa&#x27;+qi);

});
var totalSA = 3;
var res = document.getElementById(&#x27;examResult&#x27;);
res.style.display = &#x27;block&#x27;;
var pct = Math.round(score/(total+totalSA)*100);
var level = pct&gt;=80?&#x27;优秀&#x27;:pct&gt;=60?&#x27;良好&#x27;:pct&gt;=40?&#x27;及格&#x27;:&#x27;需加强&#x27;;
res.innerHTML = &#x27;&lt;h2 style=&quot;text-align:center;color:var(--accent)&quot;&gt;考试得分: &#x27;+score+&#x27;/&#x27;+(total+totalSA)+&#x27; (&#x27;+pct+&#x27;%)&lt;/h2&gt;&#x27;;
res.innerHTML += &#x27;&lt;p style=&quot;text-align:center;font-size:1.1rem&quot;&gt;评级: &lt;strong&gt;&#x27;+level+&#x27;&lt;/strong&gt;&lt;/p&gt;&#x27;;
res.innerHTML += &#x27;&lt;h3 style=&quot;margin-top:16px&quot;&gt;选择题详情&lt;/h3&gt;&#x27;;
results.forEach(function(r,i){
res.innerHTML += &#x27;&lt;div class=&quot;quiz-card&quot;&gt;&lt;div class=&quot;q-text&quot;&gt;&#x27;+(i+1)+&#x27;. &#x27;+r.q+&#x27;&lt;/div&gt;&#x27;;
res.innerHTML += &#x27;&lt;p style=&quot;font-size:.82rem&quot;&gt;你的答案: &lt;span style=&quot;color:&#x27;+(r.correct?&#x27;#2e7d32&#x27;:&#x27;var(--accent)&#x27;)+&#x27;&quot;&gt;&#x27;+r.userAns+&#x27;&lt;/span&gt; | 正确答案: &lt;span style=&quot;color:#2e7d32&quot;&gt;&#x27;+r.correctAns+&#x27;&lt;/span&gt;&lt;/p&gt;&#x27;;
if(!r.correct) res.innerHTML += &#x27;&lt;p style=&quot;font-size:.8rem;color:var(--text2)&quot;&gt;&#x27;+r.exp+&#x27;&lt;/p&gt;&#x27;;
res.innerHTML += &#x27;&lt;/div&gt;&#x27;;
});
// Store exam record
if(!LS.examHistory) LS.examHistory = [];
LS.examHistory.push({score:score,total:total+totalSA,date:new Date().toLocaleDateString()});
saveLS();
}

// ============ SOCRATIC ============
function renderSocratic(){
var items = [
{q:&#x27;为什么&quot;知识就是力量&quot;却不足以过好这一生？&#x27;,a:&#x27;培根的名言只说了知识的力量，但未触及智慧的维度。知识是&quot;术&quot;(技能)，智慧是&quot;道&quot;(规律)。一个人可能精通投资理论(知识)，但缺乏风险控制与财富观(智慧)，依然会在市场中迷失。元智慧的作用是将知识转化为在未知世界中的生产力。追问：你拥有的知识中，哪些停留在了&quot;知道&quot;层面，哪些真正转化为了&quot;智慧&quot;？&#x27;},
{q:&#x27;尼采说&quot;上帝死了&quot;，那我们靠什么活下去？&#x27;,a:&#x27;尼采的&quot;上帝&quot;不是宗教意义上的神，而是传统权威、信仰和道德规范的总和。当这些失效后，尼采提出三条路：①意识到真相(传统价值是人为构建的)②重估一切价值(打破对绝对对错的执念)③积极的虚无主义(自己赋予生活意义)。核心是培养&quot;主人道德&quot;——不依赖外部权威，从自身出发定义什么是有价值的生活。你再追问一层：你现在追求的&quot;成功&quot;标准，是主人道德还是奴隶道德？&#x27;},
{q:&#x27;维特根斯坦为什么说&quot;语言的极限就是世界的极限&quot;？&#x27;,a:&#x27;语言是思维的媒介。如果某个想法无法用语言清晰表达，它就无法被他人理解，甚至无法被自己清晰思考。这不像&quot;心里明白说不出来&quot;——真正&quot;心里明白&quot;的东西一定能说出来。维特根斯坦区分了&quot;可说的&quot;(可用语言描述的)和&quot;不可说的&quot;(只能&quot;显示&quot;的)，后者包括伦理、美学、宗教体验。行动层面：与其争论&quot;爱是什么&quot;，不如去爱；与其讨论&quot;正义的定义&quot;，不如做正义的事。追问：你最近一次&quot;说不清楚但感受到了&quot;是什么？&#x27;},
{q:&#x27;亚里士多德四因说：为什么单一原因不足以解释成功？&#x27;,a:&#x27;成功至少需要四因同时满足：质料因(你有什么资源/能力)、形式因(你定位成什么角色)、动力因(你用什么方法/路径)、目的因(你的终极目标是什么)。多数人只关注动力因(怎么做的)，忽略了自己是否适合(质料因)以及到底想要什么(目的因)。三个设计师合伙创业——质料因同质化(都只会设计)，即使动力因再强也难成功。追问：用四因说审视你当前最重要的一个目标，哪一因最薄弱？&#x27;},
{q:&#x27;斯多葛哲学&quot;出世态度入世事&quot;在今天如何实践？&#x27;,a:&#x27;核心公式：淡泊名利(出世)+埋头苦干(入世)。不是&quot;躺平&quot;——奥勒留身为皇帝夜以继日工作到死在军营；也不是&quot;内卷&quot;——他同时看淡财富、地位和他人评价。现代实践：认真工作创造价值(入世)，但不让职级、KPI、同事评价定义你的自我价值(出世)。追问：你最近因为什么事情焦虑？这件事在你的&quot;力量范围之内&quot;还是&quot;之外&quot;？&#x27;},
{q:&#x27;哈耶克为什么反对&quot;结果平等&quot;？&#x27;,a:&#x27;哈耶克认为法律平等(人人受同样规则约束)和现实平等(人人得到同样结果)不可兼得。追求结果平等需要制定歧视性法律(如按种族/地区比例分配资源)。发展不均衡是进步的本质——新知识/机会先在小范围诞生，再向多数人传递。但这不意味着不帮助弱势群体：基于博爱的补偿(如为贫困地区保留少数名额)≠改变系统规则实现平均。追问：你支持&quot;机会平等&quot;还是&quot;结果平等&quot;？二者在什么情况下冲突？&#x27;}
];

&#x27;&lt;p&gt;&lt;strong&gt;MKS分析：&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;质料因：逻辑思维强→与架构师角色高度匹配。形式因：专家定位明确。动力因：技术深耕有清晰的成长路径。目的因：追求技术深度和行业影响力。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;建议：&lt;/strong&gt;斯多葛哲学提醒——做你本性(优势)所要求的事情。不是每个人都必须走管理路线。技术专家在市场中的稀缺性和议价能力同样很高。&lt;/p&gt;&#x27;,
&#x27;&lt;p&gt;&lt;strong&gt;MKS分析：&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;质料因：技术能力扎实但创业需要营销/融资/管理等多元能力(单一质料因)。形式因：创业者vs雇员的角色转换巨大。风险认知：创业属于&quot;未知的未知&quot;风险——你无法预见所有挑战。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;建议：&lt;/strong&gt;埃里森模式——先在IT领域赚到钱(养活自己)，用业余时间探索创业方向，而非一步到位。&lt;/p&gt;&#x27;],
[&#x27;&lt;p&gt;&lt;strong&gt;MKS分析：&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;判断力：考虑老板的反应——老板可能视你为&quot;制造麻烦的人&quot;而非&quot;解决问题的人&quot;。诉诸权威谬误警示——老板不一定能公正处理。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;建议：&lt;/strong&gt;带上&quot;解决方案&quot;而非仅有&quot;投诉&quot;。斯多葛哲学：专注于你能控制的(保护自己的贡献记录)，接纳你不能控制的(他人行为)。&lt;/p&gt;&#x27;,
&#x27;&lt;p&gt;&lt;strong&gt;MKS分析：&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;情商实践：展现同理心(理解对方可能出于职业焦虑)，同时保护自身边界。亚里士多德伦理学：论迹不论心——关注行为而非动机。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;建议：&lt;/strong&gt;私下沟通是&quot;给台阶&quot;，但如果对方继续，则需升级处理以保护群体利益。保留证据是关键。&lt;/p&gt;&#x27;,
&#x27;&lt;p&gt;&lt;strong&gt;MKS分析：&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;逻辑谬误：这是&quot;诉诸怜悯&quot;的自我版本——用&quot;相信最终公平&quot;替代主动行动。现实中，信息不对称往往让沉默者吃亏。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;建议：&lt;/strong&gt;尼采主人道德要求主动而非被动。通过更可视化地记录自己的贡献来建立&quot;贡献档案&quot;。&lt;/p&gt;&#x27;],
[&#x27;&lt;p&gt;&lt;strong&gt;MKS分析：&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;埃里森案例警示：活在别人的梦里而非自己的梦里。但父母的担忧也有合理性——哈耶克的风险观：区分&quot;已知的未知&quot;和&quot;未知的未知&quot;。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;建议：&lt;/strong&gt;四因说自查——质料因(多元能力?)、目的因(自由还是财富?)、动力因(18个月够验证MVP?)、形式因(创业者还是副业?)。&lt;/p&gt;&#x27;,
&#x27;&lt;p&gt;&lt;strong&gt;MKS分析：&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;风险认知最佳实践：将&quot;未知的未知&quot;转化为&quot;已知的未知&quot;(用MVP数据判断产品市场匹配)。莱布尼茨充分性推理：积累足够的必要条件再做跳转决策。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;建议：&lt;/strong&gt;这是最理性的路径。埃里森也是先通过IT赚钱再追求航海梦想。不赌赛道，基于验证过的需求做决策。&lt;/p&gt;&#x27;,
&#x27;&lt;p&gt;&lt;strong&gt;MKS分析：&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&quot;不给自己留退路&quot;听起来很热血，但逻辑谬误警示：这是假两难——将&quot;立即全身心投入&quot;和&quot;不投入&quot;对立，忽视了渐进验证的中间路径。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;建议：&lt;/strong&gt;吴军删除&quot;多快好省&quot;——好产品需要时间。先验证核心假设(用户会付费吗?)再跳转，是尊重现实而非缺乏勇气。&lt;/p&gt;&#x27;]
];
allResults.innerHTML = scenarioTexts[ri][oi];
allResults.classList.add(&#x27;show&#x27;);
}

// ============ PROGRESS ============
function updateProgress(){
var total = concepts.length;
var learned = (learnedCards||[]).length;
var mcqDone = Object.keys(mcqAnswered||{}).length;
var saqDone = Object.keys(saqAnswered||{}).filter(function(k){return saqAnswered[k]&amp;&amp;saqAnswered[k].trim().length&gt;0;}).length;
var pct = Math.round((learned+mcqDone*0.5+saqDone*0.3)/(total+20*0.5+10*0.3)*100);
document.getElementById(&#x27;overallProgress&#x27;).style.width = Math.min(pct,100)+&#x27;%&#x27;;
document.getElementById(&#x27;progressLabel&#x27;).textContent = &#x27;已学习 &#x27;+learned+&#x27;/&#x27;+total+&#x27; 个概念 | 选择题 &#x27;+mcqDone+&#x27;/20 | 简答题 &#x27;+saqDone+&#x27;/10&#x27;;
}

// ============ TAB SWITCH ============
function switchTab(n){
document.querySelectorAll(&#x27;.tab-btn&#x27;).forEach(function(b,i){b.classList.toggle(&#x27;active&#x27;,i===n);});
document.querySelectorAll(&#x27;.tab-content&#x27;).forEach(function(t,i){t.classList.toggle(&#x27;active&#x27;,i===n);});
if(n===4) renderStats();
window.scrollTo(0,0);
}

// ============ INIT ============
renderConceptGrid();
renderMKSGrid();
renderBoundaryTable();
renderLearningPath();
renderSVG();
renderFlipCard();
renderMCQ();
renderSAQ();
renderMindmap();
renderSocratic();
renderCases();
renderDecision();
updateProgress();

// Restore learned state
if(LS.learnedCards) learnedCards = LS.learnedCards;
if(LS.mcqAnswered) mcqAnswered = LS.mcqAnswered;
if(LS.saqAnswered) saqAnswered = LS.saqAnswered;
renderFlipCard();
renderMCQ();

&lt;/script&gt;

  { name: &#x27;自然教育&#x27;, sub: &#x27;卢梭《爱弥儿》&#x27;, def: &#x27;教育应当遵循自然的秩序和节奏，人为的教育必须以自然的教育为基准。&#x27;, analogy: &#x27;像园丁培育植物——顺应植物天性，而非强行扭曲。不同季节做不同的事，春天播种而非冬天催芽。&#x27;, example: &#x27;蒙特梭利教育法让幼儿自由选择学习材料；12岁前不强行教授抽象几何，而是通过直观感受建立认知基础。&#x27;, counter: &#x27;反例：两岁背唐诗——婴儿处于感知运动阶段，需要的是触摸不同物体、听不同声音，而非符号记忆。&#x27; },

  { name: &#x27;教育即成长&#x27;, sub: &#x27;杜威《民主与教育》&#x27;, def: &#x27;教育不是为未来生活做准备，教育本身就是生活的过程。成长是生活的特征，教育的本质是持续生长。&#x27;, analogy: &#x27;像一棵树的生长——不是某一天突然长成参天大树，而是每一天都在默默扩展根系和枝叶。树干上的每一圈年轮都是成长的印记。&#x27;, example: &#x27;让孩子参与家务劳动——不是&quot;为将来当家做准备&quot;，而是在当下的实践中学习责任与合作。制止超市占便宜的老人，是保护儿童当下的成长环境。&#x27;, counter: &#x27;反例：对孩子说&quot;等你长大了就懂了&quot;——这等于放弃了当下的教育机会。成长是连续的，无法跳跃式完成。&#x27; },

    { q: &#x27;&quot;保暖型知识&quot;和&quot;炫耀型知识&quot;的划分会不会太功利了？&#x27;, a: &#x27;斯宾塞不是否定炫耀型知识的存在价值，而是强调优先级。人生有限——&quot;吾生也有涯，而知也无涯&quot;——必须做取舍。他的框架帮助我们避免&quot;花边有了但布料没有&quot;的尴尬。一个连基本谋生能力都没有的人去学高尔夫，就像在冬天先买花边衬衫而不是棉袄。但如果棉袄已经足够，添几件花边衬衫完全合理。&#x27; },
    { q: &#x27;为什么当代教育最欠缺的是&quot;为人父母知识&quot;和&quot;社会公民知识&quot;？&#x27;, a: &#x27;因为现代学校体系主要传授的是&quot;直接/间接自我保全知识&quot;（谋生技能），但对如何抚养下一代、如何做一个合格公民几乎没有系统教学。这在传统社会由家族和社区代际传递，但在现代社会出现断裂。导致的结果是：人们在职场很专业，但做父母、做公民时只能凭直觉或模仿。&#x27; }
  ]}
];

// ===== INIT =====
function init() {
  renderConceptGrid();
  renderSVG();
  renderCard(0);
  renderMindmap();
  renderQuiz();
  renderSocratic();
  renderCases();
  renderDecision();
  updateProgress();
  updateReview();
}

// ===== Concept Grid =====
function renderConceptGrid() {
  var grid = document.getElementById(&#x27;conceptGrid&#x27;);
  var html = &#x27;&#x27;;
  concepts.forEach(function(c) {
    html += &#x27;&lt;div class=&quot;concept-card&#x27; + (c.star ? &#x27; star&#x27; : &#x27;&#x27;) + &#x27;&quot; onclick=&quot;jumpToCard(\&#x27;&#x27; + c.id + &#x27;\&#x27;)&quot;&gt;&#x27;;
    html += &#x27;&lt;div class=&quot;c-name&quot;&gt;&#x27; + (c.star ? &#x27;&lt;span class=&quot;c-star&quot;&gt;★&lt;/span&gt; &#x27; : &#x27;&#x27;) + c.name + &#x27;&lt;/div&gt;&#x27;;
    html += &#x27;&lt;div class=&quot;c-desc&quot;&gt;&#x27; + c.desc + &#x27;&lt;/div&gt;&#x27;;
    html += &#x27;&lt;/div&gt;&#x27;;
  });
  grid.innerHTML = html;
}

function jumpToCard(id) {
  var idx = concepts.findIndex(function(c) { return c.id === id; });
  if (idx &gt;= 0) { currentCardIdx = idx; renderCard(idx); switchTab(1); }
}

// ===== Knowledge Cards =====
function renderCard(idx) {
  var d = cardDetails[idx];
  document.getElementById(&#x27;fcName&#x27;).textContent = d.name;
  document.getElementById(&#x27;fcSub&#x27;).textContent = d.sub;
  document.getElementById(&#x27;flipBack&#x27;).innerHTML = &#x27;&lt;h4&gt;📖 定义&lt;/h4&gt;&lt;p&gt;&#x27; + d.def + &#x27;&lt;/p&gt;&lt;h4&gt;🔮 类比&lt;/h4&gt;&lt;p&gt;&#x27; + d.analogy + &#x27;&lt;/p&gt;&lt;h4&gt;✅ 示例&lt;/h4&gt;&lt;p&gt;&#x27; + d.example + &#x27;&lt;/p&gt;&lt;h4&gt;❌ 反例&lt;/h4&gt;&lt;p&gt;&#x27; + d.counter + &#x27;&lt;/p&gt;&#x27;;
  document.getElementById(&#x27;flipCard&#x27;).classList.remove(&#x27;flipped&#x27;);
  document.getElementById(&#x27;cardCounter&#x27;).textContent = (idx + 1) + &#x27; / &#x27; + cardDetails.length;
  updateMarkBtn();
}

function prevCard() { currentCardIdx = (currentCardIdx - 1 + cardDetails.length) % cardDetails.length; renderCard(currentCardIdx); }
function nextCard() { currentCardIdx = (currentCardIdx + 1) % cardDetails.length; renderCard(currentCardIdx); }
function toggleFlip() { document.getElementById(&#x27;flipCard&#x27;).classList.toggle(&#x27;flipped&#x27;); }
function markLearned() {
  var id = concepts[currentCardIdx].id;
  LS.learned[id] = !LS.learned[id];
  saveLS(); updateMarkBtn(); updateProgress();
}
function updateMarkBtn() {
  var btn = document.getElementById(&#x27;markLearnedBtn&#x27;);
  var id = concepts[currentCardIdx].id;
  btn.textContent = LS.learned[id] ? &#x27;✓ 已学习&#x27; : &#x27;✓ 已学习&#x27;;
  btn.style.opacity = LS.learned[id] ? &#x27;1&#x27; : &#x27;0.5&#x27;;
}
function updateProgress() {
  var learned = Object.keys(LS.learned).filter(function(k) { return LS.learned[k]; }).length;
  var pct = Math.round(learned / concepts.length * 100);
  document.getElementById(&#x27;progressFill&#x27;).style.width = pct + &#x27;%&#x27;;
  document.getElementById(&#x27;progressText&#x27;).textContent = &#x27;学习进度: &#x27; + learned + &#x27; / &#x27; + concepts.length + &#x27; (&#x27; + pct + &#x27;%)&#x27;;
}

function buildTreeNode(label, type, expanded, children) {
  var hasChildren = children &amp;&amp; children.length &gt; 0;
  var cls = type === &#x27;root&#x27; ? &#x27;root&#x27; : (type === &#x27;t1&#x27; ? &#x27;tier1&#x27; : &#x27;&#x27;);
  var html = &#x27;&lt;div class=&quot;tree-node&quot;&gt;&lt;span class=&quot;tree-label &#x27; + cls + &#x27;&quot; onclick=&quot;toggleTreeNode(this)&quot;&gt;&#x27;;
  if (hasChildren) html += &#x27;&lt;span class=&quot;tree-toggle&#x27; + (expanded ? &#x27; open&#x27; : &#x27;&#x27;) + &#x27;&quot;&gt;▶&lt;/span&gt;&#x27;;
  html += label + &#x27;&lt;/span&gt;&#x27;;
  if (hasChildren) {
    html += &#x27;&lt;div class=&quot;tree-children&#x27; + (expanded ? &#x27; show&#x27; : &#x27;&#x27;) + &#x27;&quot;&gt;&#x27;;
    children.forEach(function(c) { html += c; });
    html += &#x27;&lt;/div&gt;&#x27;;
  }
  html += &#x27;&lt;/div&gt;&#x27;;
  return html;
}

function toggleTreeNode(el) {
  var toggle = el.querySelector(&#x27;.tree-toggle&#x27;);
  if (toggle) toggle.classList.toggle(&#x27;open&#x27;);
  var children = el.parentElement.querySelector(&#x27;.tree-children&#x27;);
  if (children) children.classList.toggle(&#x27;show&#x27;);
}

// ===== Quiz =====
function renderQuiz() {
  var container = document.getElementById(&#x27;quizContainer&#x27;);
  currentQuizSet = mcqData.slice();
  var html = &#x27;&#x27;;
  currentQuizSet.forEach(function(q, i) {
    html += &#x27;&lt;div class=&quot;quiz-card&quot; id=&quot;qcard-&#x27; + i + &#x27;&quot;&gt;&lt;div class=&quot;q-question&quot;&gt;&#x27; + (i + 1) + &#x27;. &#x27; + q.q + &#x27;&lt;/div&gt;&#x27;;
    html += &#x27;&lt;div class=&quot;q-options&quot;&gt;&#x27;;
    var labels = [&#x27;A&#x27;, &#x27;B&#x27;, &#x27;C&#x27;, &#x27;D&#x27;];
    q.opts.forEach(function(opt, j) {
      html += &#x27;&lt;div class=&quot;q-option&quot; data-q=&quot;&#x27; + i + &#x27;&quot; data-o=&quot;&#x27; + j + &#x27;&quot; onclick=&quot;selectOption(this)&quot;&gt;&#x27; + labels[j] + &#x27;. &#x27; + opt + &#x27;&lt;/div&gt;&#x27;;
    });
    html += &#x27;&lt;/div&gt;&lt;div class=&quot;q-feedback&quot; id=&quot;qfb-&#x27; + i + &#x27;&quot;&gt;&lt;/div&gt;&lt;/div&gt;&#x27;;
  });
  container.innerHTML = html;
  quizState = {};
}

function selectOption(el) {
  var qi = parseInt(el.getAttribute(&#x27;data-q&#x27;));
  var oi = parseInt(el.getAttribute(&#x27;data-o&#x27;));
  if (quizState[qi] !== undefined) return;
  quizState[qi] = { chosen: oi, correct: currentQuizSet[qi].answer };
  var correct = oi === currentQuizSet[qi].answer;
  LS.quizDone++;
  if (correct) LS.quizCorrect++;
  if (!correct) {
    LS.wrong.push({ q: currentQuizSet[qi].q, opts: currentQuizSet[qi].opts, &quot;answer&quot;: currentQuizSet[qi].answer, chosen: oi, time: Date.now() });
  }
  saveLS();

  var opts = el.parentElement.querySelectorAll(&#x27;.q-option&#x27;);
  opts.forEach(function(o, j) {
    if (j === currentQuizSet[qi].answer) o.classList.add(&#x27;correct&#x27;);
    else if (j === oi &amp;&amp; !correct) o.classList.add(&#x27;wrong&#x27;);
    o.style.pointerEvents = &#x27;none&#x27;;
  });
  el.classList.add(&#x27;selected&#x27;);

  var fb = document.getElementById(&#x27;qfb-&#x27; + qi);
  fb.textContent = correct ? &#x27;✅ 正确！&#x27; : &#x27;❌ 错误！正确答案是 &#x27; + [&#x27;A&#x27;,&#x27;B&#x27;,&#x27;C&#x27;,&#x27;D&#x27;][currentQuizSet[qi].answer] + &#x27;. &#x27; + currentQuizSet[qi].opts[currentQuizSet[qi].answer];
  fb.className = &#x27;q-feedback show &#x27; + (correct ? &#x27;correct&#x27; : &#x27;wrong&#x27;);
}

function shuffleQuiz() {
  currentQuizSet = mcqData.slice().sort(function() { return Math.random() - 0.5; });
  var container = document.getElementById(&#x27;quizContainer&#x27;);
  var html = &#x27;&#x27;;
  currentQuizSet.forEach(function(q, i) {
    html += &#x27;&lt;div class=&quot;quiz-card&quot; id=&quot;qcard-&#x27; + i + &#x27;&quot;&gt;&lt;div class=&quot;q-question&quot;&gt;&#x27; + (i + 1) + &#x27;. &#x27; + q.q + &#x27;&lt;/div&gt;&lt;div class=&quot;q-options&quot;&gt;&#x27;;
    var labels = [&#x27;A&#x27;, &#x27;B&#x27;, &#x27;C&#x27;, &#x27;D&#x27;];
    q.opts.forEach(function(opt, j) {
      html += &#x27;&lt;div class=&quot;q-option&quot; data-q=&quot;&#x27; + i + &#x27;&quot; data-o=&quot;&#x27; + j + &#x27;&quot; onclick=&quot;selectOption(this)&quot;&gt;&#x27; + labels[j] + &#x27;. &#x27; + opt + &#x27;&lt;/div&gt;&#x27;;
    });
    html += &#x27;&lt;/div&gt;&lt;div class=&quot;q-feedback&quot; id=&quot;qfb-&#x27; + i + &#x27;&quot;&gt;&lt;/div&gt;&lt;/div&gt;&#x27;;
  });
  container.innerHTML = html;
  quizState = {};
}

function resetQuiz() { LS.quizDone = 0; LS.quizCorrect = 0; LS.wrong = []; saveLS(); currentQuizSet = mcqData.slice(); renderQuiz(); document.getElementById(&#x27;quizSummary&#x27;).style.display = &#x27;none&#x27;; updateReview(); }

function showQuizSummary() {
  var done = Object.keys(quizState).length;
  var correct = 0;
  Object.values(quizState).forEach(function(s) { if (s.chosen === s.correct) correct++; });
  var sum = document.getElementById(&#x27;quizSummary&#x27;);
  sum.style.display = &#x27;block&#x27;;
  sum.innerHTML = &#x27;&lt;div class=&quot;quiz-card&quot; style=&quot;text-align:center;&quot;&gt;&lt;h4&gt;本轮成绩&lt;/h4&gt;&lt;p&gt;已完成: &#x27; + done + &#x27; / 20&lt;/p&gt;&lt;p&gt;正确: &#x27; + correct + &#x27; / &#x27; + done + &#x27; (&#x27; + (done ? Math.round(correct / done * 100) : 0) + &#x27;%)&lt;/p&gt;&lt;/div&gt;&#x27;;
}

// ===== Exam =====
function startExam() {

  updateExamTimer();

  var html = &#x27;&lt;h4 class=&quot;subsection-title&quot;&gt;选择题（7题）&lt;/h4&gt;&#x27;;
  examQuestions.forEach(function(q, i) {
    html += &#x27;&lt;div class=&quot;quiz-card&quot;&gt;&lt;div class=&quot;q-question&quot;&gt;&#x27; + (i + 1) + &#x27;. &#x27; + q.q + &#x27;&lt;/div&gt;&lt;div class=&quot;q-options&quot;&gt;&#x27;;

    });
    html += &#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;
  });
  html += &#x27;&lt;h4 class=&quot;subsection-title&quot;&gt;简答题（3题）&lt;/h4&gt;&#x27;;
  html += &#x27;&lt;div class=&quot;quiz-card&quot;&gt;&lt;p&gt;1. 请简述卢梭&quot;自然教育&quot;的核心原则及其对当代家长的启示。&lt;/p&gt;&lt;textarea rows=&quot;3&quot; style=&quot;width:100%;border:1px solid var(--border);border-radius:6px;padding:8px;font-family:inherit;&quot; id=&quot;sa1&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;&#x27;;
  html += &#x27;&lt;div class=&quot;quiz-card&quot;&gt;&lt;p&gt;2. 皮亚杰的认知发展阶段理论对&quot;提前教育&quot;提出了怎样的批评？请结合具体阶段说明。&lt;/p&gt;&lt;textarea rows=&quot;3&quot; style=&quot;width:100%;border:1px solid var(--border);border-radius:6px;padding:8px;font-family:inherit;&quot; id=&quot;sa2&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;&#x27;;
  html += &#x27;&lt;div class=&quot;quiz-card&quot;&gt;&lt;p&gt;3. 杜威&quot;教育即成长&quot;与朗格朗&quot;终身教育&quot;之间有何内在联系？&lt;/p&gt;&lt;textarea rows=&quot;3&quot; style=&quot;width:100%;border:1px solid var(--border);border-radius:6px;padding:8px;font-family:inherit;&quot; id=&quot;sa3&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;&#x27;;
  document.getElementById(&#x27;examContainer&#x27;).innerHTML = html;
  document.getElementById(&#x27;examResult&#x27;).style.display = &#x27;none&#x27;;

  examTimerId = setInterval(function() {
    examTimeLeft--;
    updateExamTimer();
    if (examTimeLeft &lt;= 0) submitExam();
  }, 1000);
}

function updateExamTimer() {
  var m = Math.floor(examTimeLeft / 60);
  var s = examTimeLeft % 60;
  document.getElementById(&#x27;examTimer&#x27;).textContent = &#x27;剩余: &#x27; + m + &#x27;:&#x27; + (s &lt; 10 ? &#x27;0&#x27; : &#x27;&#x27;) + s;
}

function selectExamOption(el) {
  var qi = parseInt(el.getAttribute(&#x27;data-exam&#x27;));
  var oi = parseInt(el.getAttribute(&#x27;data-o&#x27;));
  examAnswers[qi] = oi;
  var opts = el.parentElement.querySelectorAll(&#x27;.q-option&#x27;);
  opts.forEach(function(o) { o.classList.remove(&#x27;selected&#x27;); });
  el.classList.add(&#x27;selected&#x27;);
}

function submitExam() {
  clearInterval(examTimerId);
  examActive = false;
  var score = 0;
  examQuestions.forEach(function(q, i) {
    if (examAnswers[i] === q.answer) score++;
  });
  LS.examHistory.push({ date: Date.now(), score: score, total: 7 });
  saveLS();

  var html = &#x27;&lt;h4&gt;考试结果&lt;/h4&gt;&lt;div class=&quot;exam-score&quot;&gt;&#x27; + score + &#x27; / 7&lt;/div&gt;&#x27;;
  html += &#x27;&lt;p&gt;选择题得分: &#x27; + score + &#x27; / 7 (&#x27; + Math.round(score / 7 * 100) + &#x27;%)&lt;/p&gt;&#x27;;
  html += &#x27;&lt;p style=&quot;margin-top:10px;&quot;&gt;简答题请自行对照以下要点：&lt;/p&gt;&#x27;;
  html += &#x27;&lt;p style=&quot;font-size:0.85em;color:var(--sub);&quot;&gt;1. 核心原则：遵循自然，人为教育必须适应自然教育。启示：不超前灌输，尊重发育节奏，培养学习方法而非追求知识量。&lt;/p&gt;&#x27;;
  html += &#x27;&lt;p style=&quot;font-size:0.85em;color:var(--sub);&quot;&gt;2. 提前教育的问题：每个阶段有特定认知能力上限，0-2岁需感知世界而非背诗，7岁前缺乏逻辑理解能力，12岁前缺乏演绎推理能力。超阶段灌输是&quot;摧残而非教育&quot;。&lt;/p&gt;&#x27;;
  html += &#x27;&lt;p style=&quot;font-size:0.85em;color:var(--sub);&quot;&gt;3. 内在联系：杜威提供目的论（成长是生活的特征），朗格朗提供方法论（五大驱动力+四大方法）。终身教育是实现终身成长的具体路径，二者构成目的与手段的统一。&lt;/p&gt;&#x27;;
  if (score &lt; 4) html += &#x27;&lt;p style=&quot;color:#e74c3c;margin-top:12px;&quot;&gt;⚠️ 薄弱概念提示：自然教育、认知发展阶段、教育即成长、终身教育——建议回到知识卡片和追问模块深入学习。&lt;/p&gt;&#x27;;

  document.getElementById(&#x27;examResult&#x27;).innerHTML = html;
  document.getElementById(&#x27;examResult&#x27;).style.display = &#x27;block&#x27;;
  document.getElementById(&#x27;examSubmitBtn&#x27;).style.display = &#x27;none&#x27;;
  document.getElementById(&#x27;examStartBtn&#x27;).style.display = &#x27;inline-block&#x27;;
  document.getElementById(&#x27;examStartBtn&#x27;).textContent = &#x27;重新考试&#x27;;
  updateReview();
}

// ===== Review =====
function updateReview() {
  var stats = document.getElementById(&#x27;reviewStats&#x27;);
  stats.innerHTML = &#x27;&lt;div class=&quot;stat-card&quot;&gt;&lt;div class=&quot;s-val&quot;&gt;&#x27; + Object.keys(LS.learned).filter(function(k) { return LS.learned[k]; }).length + &#x27;&lt;/div&gt;&lt;div class=&quot;s-label&quot;&gt;已学概念&lt;/div&gt;&lt;/div&gt;&#x27;;
  stats.innerHTML += &#x27;&lt;div class=&quot;stat-card&quot;&gt;&lt;div class=&quot;s-val&quot;&gt;&#x27; + LS.quizDone + &#x27;&lt;/div&gt;&lt;div class=&quot;s-label&quot;&gt;总答题数&lt;/div&gt;&lt;/div&gt;&#x27;;
  stats.innerHTML += &#x27;&lt;div class=&quot;stat-card&quot;&gt;&lt;div class=&quot;s-val&quot;&gt;&#x27; + (LS.quizDone ? Math.round(LS.quizCorrect / LS.quizDone * 100) : 0) + &#x27;%&lt;/div&gt;&lt;div class=&quot;s-label&quot;&gt;正确率&lt;/div&gt;&lt;/div&gt;&#x27;;
  stats.innerHTML += &#x27;&lt;div class=&quot;stat-card&quot;&gt;&lt;div class=&quot;s-val&quot;&gt;&#x27; + LS.wrong.length + &#x27;&lt;/div&gt;&lt;div class=&quot;s-label&quot;&gt;错题数&lt;/div&gt;&lt;/div&gt;&#x27;;

  var wb = document.getElementById(&#x27;wrongBook&#x27;);
  if (LS.wrong.length === 0) {
    wb.innerHTML = &#x27;&lt;p style=&quot;color:var(--sub);padding:16px;&quot;&gt;暂无错题，继续加油！&lt;/p&gt;&#x27;;
  } else {
    var wh = &#x27;&lt;div style=&quot;max-height:400px;overflow-y:auto;&quot;&gt;&#x27;;
    LS.wrong.slice().reverse().forEach(function(w, i) {
      wh += &#x27;&lt;div class=&quot;wrong-item&quot;&gt;&lt;p&gt;&lt;strong&gt;题目:&lt;/strong&gt; &#x27; + w.q + &#x27;&lt;/p&gt;&#x27;;
      wh += &#x27;&lt;p style=&quot;color:#e74c3c;&quot;&gt;你的答案: &#x27; + [&#x27;A&#x27;,&#x27;B&#x27;,&#x27;C&#x27;,&#x27;D&#x27;][w.chosen] + &#x27;. &#x27; + w.opts[w.chosen] + &#x27;&lt;/p&gt;&#x27;;
      wh += &#x27;&lt;p style=&quot;color:#27ae60;&quot;&gt;正确答案: &#x27; + [&#x27;A&#x27;,&#x27;B&#x27;,&#x27;C&#x27;,&#x27;D&#x27;][w.answer] + &#x27;. &#x27; + w.opts[w.answer] + &#x27;&lt;/p&gt;&#x27;;
      wh += &#x27;&lt;button class=&quot;retry-btn&quot; onclick=&quot;retryWrong(&#x27; + i + &#x27;)&quot;&gt;重做此题&lt;/button&gt;&lt;/div&gt;&#x27;;
    });
    wh += &#x27;&lt;/div&gt;&#x27;;
    wb.innerHTML = wh;
  }

  var wc = document.getElementById(&#x27;weakConcepts&#x27;);
  var conceptMap = {
    &#x27;自然教育&#x27;: 0, &#x27;认知发展阶段&#x27;: 1, &#x27;教育即成长&#x27;: 2, &#x27;终身教育&#x27;: 3,
    &#x27;多元智力&#x27;: 4, &#x27;知识价值分层&#x27;: 5, &#x27;科学教育学&#x27;: 6, &#x27;教师培养标准&#x27;: 7,
    &#x27;教育公平与兼容&#x27;: 8, &#x27;自我驱动学习&#x27;: 9
  };
  var wrongConcepts = {};
  LS.wrong.forEach(function(w) {
    var qText = w.q;
    Object.keys(conceptMap).forEach(function(cn) {
      if (qText.indexOf(cn) &gt;= 0 || qText.indexOf(cn.substring(0, 2)) &gt;= 0) {
        wrongConcepts[cn] = (wrongConcepts[cn] || 0) + 1;
      }
    });
  });
  if (Object.keys(wrongConcepts).length === 0) {
    wc.innerHTML = &#x27;&lt;p style=&quot;color:var(--sub);padding:16px;&quot;&gt;暂无薄弱概念数据&lt;/p&gt;&#x27;;
  } else {
    var sorted = Object.entries(wrongConcepts).sort(function(a, b) { return b[1] - a[1]; });
    wc.innerHTML = &#x27;&lt;div style=&quot;display:flex;flex-wrap:wrap;gap:8px;&quot;&gt;&#x27; + sorted.map(function(e) {
      return &#x27;&lt;span style=&quot;background:#fdedec;color:#e74c3c;padding:6px 12px;border-radius:16px;font-size:0.9em;&quot;&gt;&#x27; + e[0] + &#x27; (&#x27; + e[1] + &#x27;题)&lt;/span&gt;&#x27;;
    }).join(&#x27;&#x27;) + &#x27;&lt;/div&gt;&#x27;;
  }
}

function retryWrong(idx) {
  switchTab(3);
  var w = LS.wrong[LS.wrong.length - 1 - idx];
  var qi = mcqData.findIndex(function(q) { return q.q === w.q; });
  if (qi &gt;= 0) {
    currentQuizSet = mcqData.slice();
    renderQuiz();
    setTimeout(function() {
      var target = document.getElementById(&#x27;qcard-&#x27; + qi);
      if (target) target.scrollIntoView({ behavior: &#x27;smooth&#x27;, block: &#x27;center&#x27; });
    }, 200);
  }
}

// ===== Decision Sim =====
function renderDecision() {
  var container = document.getElementById(&#x27;decisionSim&#x27;);
  var rounds = [
    {
      scenario: &#x27;你的孩子（8岁）数学成绩中等，同学家长都在报奥数班。你是否也给孩子报奥数？&#x27;,
      options: [
        { text: &#x27;立即报奥数班，不能输在起跑线上&#x27;, feedback: &#x27;⚠️ 注意&quot;单一化思维陷阱&quot;！奥数成绩不等于数学能力，更不等于未来成功。皮亚杰告诉我们，8岁儿童处于具体运算阶段，抽象逻辑思维能力有限。关键是解释逻辑原理而非题海战术。而且斯宾塞提醒：奥数属于&quot;炫耀型知识&quot;，优先确保基础通识知识达标。&#x27;, mks: &#x27;皮亚杰认知阶段 + 斯宾塞知识分层 + 自然教育&#x27; },
        { text: &#x27;先了解孩子的兴趣和困难点，根据实际情况决定&#x27;, feedback: &#x27;✅ 明智的选择！这符合赫尔巴特&quot;通过观察发现孩子特长&quot;的原则，也体现了卢梭&quot;把孩子当孩子&quot;的教育理念。家长需要的是&quot;判断力&quot;而非&quot;跟风力&quot;。先诊断问题（是兴趣问题还是方法问题），再对症下药。&#x27;, mks: &#x27;赫尔巴特观察法 + 卢梭自然教育 + 教育即成长&#x27; },
        { text: &#x27;不报任何辅导班，让孩子自由发展&#x27;, feedback: &#x27;⚠️ 需谨慎。卢梭反对&quot;放任自流&quot;等同于&quot;自由发展不等于放纵&quot;。8岁是具体运算阶段的关键期，需要适当的引导和逻辑训练。完全放手可能错失词汇积累和归纳推理能力的培养黄金期。建议提供资源但不强求成果。&#x27;, mks: &#x27;卢梭自由≠放纵 + 皮亚杰关键期 + 杜威成长引导&#x27; }
      ]
    },
    {
      scenario: &#x27;你是一名35岁的程序员，AI编程工具让你的工作效率提升了3倍，但也让你担心自己的职业前景。你该如何应对？&#x27;,
      options: [
        { text: &#x27;加班加点写更多代码，证明自己的价值不可替代&#x27;, feedback: &#x27;⚠️ 朗格朗会提醒你：死守单一职业技能将面临&quot;产业被替代&quot;的风险。量变无法应对质变。关键不是写更多代码，而是升级你的知识框架——从&quot;写代码的人&quot;变成&quot;解决复杂问题的人&quot;。&#x27;, mks: &#x27;朗格朗终身教育 + 广度vs深度辩证 + 关键路径选择&#x27; },
        { text: &#x27;利用AI工具节省的时间学习新领域知识，拓展能力边界&#x27;, feedback: &#x27;✅ 这正是朗格朗&quot;终身学习&quot;的实践！自我驱动+边做边学。利用AI作为杠杆，将时间投入到系统架构设计、产品思维、团队管理等AI难以替代的领域。加德纳会告诉你：你的&quot;智力三原色&quot;组合可以通过调整配比形成新的竞争优势。&#x27;, mks: &#x27;朗格朗四大方法 + 加德纳多元智力 + 20h入门法则&#x27; },

      ]
    },
    {
      scenario: &#x27;你发现孩子的学校采用&quot;快乐教育&quot;，几乎没有作业和考试。作为家长，你该怎么办？&#x27;,
      options: [
        { text: &#x27;太好了，让孩子享受快乐童年，不要任何压力&#x27;, feedback: &#x27;⚠️ 吴军在&quot;如果没有了考试&quot;中通过三个真实案例证明：完全取消考试后，自觉性仅少数人能维持，十年后差距从0分化到100。考试虽有负担，但能避免群体掉队。关键是找到&quot;适度压力和快乐学习&quot;的平衡点。&#x27;, mks: &#x27;考试价值 + 罗森塔尔效应局限 + 自我驱动学习&#x27; },

      ]
    }
  ];

  var html = &#x27;&#x27;;
  rounds.forEach(function(r, ri) {
    html += &#x27;&lt;div class=&quot;decision-round&quot; id=&quot;dround-&#x27; + ri + &#x27;&quot;&gt;&lt;h4&gt;第&#x27; + (ri + 1) + &#x27;轮: &#x27; + r.scenario + &#x27;&lt;/h4&gt;&lt;div class=&quot;decision-options&quot;&gt;&#x27;;
    r.options.forEach(function(opt, oi) {
      html += &#x27;&lt;div class=&quot;decision-opt&quot; data-round=&quot;&#x27; + ri + &#x27;&quot; data-opt=&quot;&#x27; + oi + &#x27;&quot; onclick=&quot;chooseDecision(this)&quot;&gt;&#x27; + [&#x27;A&#x27;,&#x27;B&#x27;,&#x27;C&#x27;][oi] + &#x27;. &#x27; + opt.text + &#x27;&lt;/div&gt;&#x27;;
    });
    html += &#x27;&lt;/div&gt;&lt;div class=&quot;decision-feedback&quot; id=&quot;dfb-&#x27; + ri + &#x27;&quot;&gt;&lt;/div&gt;&lt;/div&gt;&#x27;;
  });
  container.innerHTML = html;
}

function switchTab(idx) {
  document.querySelectorAll(&#x27;.tab-btn&#x27;).forEach(function(b) { b.classList.remove(&#x27;active&#x27;); });
  document.querySelector(&#x27;.tab-btn[data-tab=&quot;&#x27; + idx + &#x27;&quot;]&#x27;).classList.add(&#x27;active&#x27;);
  document.querySelectorAll(&#x27;.tab-panel&#x27;).forEach(function(p) { p.classList.remove(&#x27;active&#x27;); });
  var panel = document.querySelector(&#x27;.tab-panel[data-panel=&quot;&#x27; + idx + &#x27;&quot;]&#x27;);
  if (panel) panel.classList.add(&#x27;active&#x27;);
  if (idx === 5) updateReview();
  if (window.innerWidth &lt; 960) document.getElementById(&#x27;navTabs&#x27;).classList.remove(&#x27;show&#x27;);
}

document.querySelectorAll(&#x27;.tab-btn&#x27;).forEach(function(b) {

});

<iframe class="iframe-panel" id="topic-3" srcdoc="&lt;!DOCTYPE html&gt;
&lt;html lang=&quot;zh-CN&quot;&gt;
&lt;head&gt;
&lt;meta charset=&quot;UTF-8&quot;&gt;
&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;
&lt;title&gt;文明与制度 · 最小知识集&lt;/title&gt;
&lt;style&gt;
:root {
  --bg: #fdf6ec;
  --card: #fffaf2;
  --accent: #c0392b;
  --accent2: #d4a574;
  --text: #3d2f2f;
  --text2: #6b5555;
  --border: #e8d5c0;
  --gold: #b8860b;
  --shadow: 0 2px 12px rgba(60,30,20,.08);
  --radius: 12px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:&quot;PingFang SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,sans-serif;
  font-size:clamp(14px,1.2vw,17px);
  line-height:1.7;
  color:var(--text);
  background:var(--bg);
  padding-top:0;min-height:100vh;
}
.container{max-width:960px;margin:0 auto;padding:0 clamp(12px,3vw,24px)}

/* Header */
header{text-align:center;padding:clamp(16px,4vw,28px) 0 clamp(8px,2vw,16px)}
header h1{font-size:clamp(1.5rem,3.5vw,2rem);color:var(--accent);margin-bottom:8px}
.sub{font-size:clamp(.85rem,1.5vw,.95rem);color:var(--text2);margin-bottom:10px}
.home-link{display:inline-block;font-size:.88rem;color:var(--accent);text-decoration:none;border:2px solid var(--accent);border-radius:20px;padding:6px 20px;margin-top:6px;transition:all .2s}
.home-link:hover{background:var(--accent);color:#fff}

/* Tab bar */
.tab-bar{position:sticky;top:0;z-index:100;display:flex;flex-wrap:wrap;gap:4px;padding:8px clamp(4px,1vw,12px);background:rgba(253,246,236,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);justify-content:center}
.tab-btn{padding:7px 14px;border:none;border-radius:18px;background:var(--card);color:var(--text2);font-size:.8rem;cursor:pointer;border:1px solid transparent;transition:all .2s}
.tab-btn:hover{border-color:var(--accent2);color:var(--accent)}
.tab-btn.active{background:var(--accent);color:#fff}
.tab-panel{display:none;animation:fadeIn .35s ease}
.tab-panel.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Cards &amp; grids */
.card{background:var(--card);border-radius:var(--radius);padding:clamp(14px,3vw,20px);box-shadow:var(--shadow);margin-bottom:14px}
.concept-card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border-left:4px solid var(--accent);transition:transform .2s}
.concept-card:hover{transform:translateY(-2px)}
.concept-card.mks{border-left-color:var(--gold);position:relative}
.concept-card.mks::after{content:&#x27;\2605&#x27;;position:absolute;top:8px;right:12px;color:var(--gold);font-size:1.2rem}
.concept-card h4{font-size:.95rem;color:var(--accent);margin-bottom:6px}
.concept-card p{font-size:.82rem;color:var(--text2);line-height:1.5}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}

/* Progress */
.progress-wrap{margin:16px 0}
.progress-bar{height:10px;border-radius:5px;background:var(--border);overflow:hidden}
.progress-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .5s}
.progress-label{font-size:.78rem;color:var(--text2);margin-top:4px}

/* Flip card */
.flip-container{perspective:1000px;width:100%;max-width:500px;margin:20px auto}
.flip-inner{position:relative;width:100%;min-height:420px;height:auto;transition:transform .6s;transform-style:preserve-3d;cursor:pointer}
.flip-inner.flipped{transform:rotateY(180deg)}
.flip-front,.flip-back{position:absolute;width:100%;min-height:420px;height:100%;backface-visibility:hidden;border-radius:var(--radius);display:flex;flex-direction:column;padding:24px;box-shadow:var(--shadow)}
.flip-front{background:linear-gradient(135deg,var(--accent),#a93226);color:#fff;font-size:1.3rem;font-weight:700;align-items:center;justify-content:center;text-align:center}
.flip-back{background:var(--card);color:var(--text);transform:rotateY(180deg);align-items:flex-start;text-align:left;overflow-y:auto;font-size:.85rem;line-height:1.6}
.flip-back .dim-label{font-weight:700;color:var(--accent);font-size:.8rem;margin-top:10px}
.flip-back p{margin-bottom:4px}
.flip-nav{display:flex;justify-content:center;gap:16px;margin-top:12px;flex-wrap:wrap}
.flip-nav button{padding:8px 20px;border-radius:20px;border:2px solid var(--accent);background:var(--card);color:var(--accent);cursor:pointer;font-size:.85rem;transition:all .2s}
.flip-nav button:hover{background:var(--accent);color:#fff}
.flip-nav button.learned{background:#e8f5e9;border-color:#4caf50;color:#2e7d32}
.flip-counter{text-align:center;font-size:.85rem;color:var(--text2);margin-top:6px}

/* Quiz */
.quiz-card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:14px}
.q-tag{font-size:.75rem;padding:3px 10px;border-radius:8px;display:inline-block;margin-bottom:8px}
.q-mc{background:#fde8e8;color:var(--accent)}
.q-sa{background:#e8f0fe;color:#3a6ea5}
.q-text{font-weight:700;margin-bottom:12px}
.q-option{padding:8px 14px;margin:4px 0;border-radius:8px;cursor:pointer;border:1px solid var(--border);font-size:.85rem;transition:all .2s}
.q-option:hover{border-color:var(--accent2);background:#fef9f4}
.q-option.selected{border-color:var(--accent);background:#fde8e8}
.q-option.correct{border-color:#4caf50;background:#e8f5e9}
.q-option.wrong{border-color:var(--accent);background:#ffebee}
.q-feedback{margin-top:8px;font-size:.82rem;padding:8px;border-radius:8px;display:none}
.q-feedback.show{display:block}
.q-feedback.right{background:#e8f5e9;color:#2e7d32}
.q-feedback.wrong-msg{background:#ffebee;color:var(--accent)}

/* Short answer */
.sa-input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);font-family:inherit;font-size:.85rem;resize:vertical;min-height:80px;background:#fff}
.sa-reveal{margin-top:8px;padding:10px;background:#fef9f4;border-radius:8px;font-size:.82rem;display:none}
.sa-reveal.show{display:block}

/* Timer &amp; stats */
.timer{font-size:1.3rem;font-weight:700;color:var(--accent);text-align:center;padding:10px}
.timer.warning{animation:pulse .5s infinite alternate}
@keyframes pulse{from{opacity:1}to{opacity:.5}}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat-card{text-align:center;padding:16px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow)}
.stat-card .num{font-size:2rem;font-weight:700;color:var(--accent)}
.stat-card .lbl{font-size:.78rem;color:var(--text2);margin-top:4px}

/* Tree / mindmap */
.tree-node{margin-left:20px;border-left:2px solid var(--border);padding-left:12px}
.tree-toggle{cursor:pointer;user-select:none;font-weight:600;color:var(--accent);padding:4px 0;display:flex;align-items:center;gap:6px}
.tree-toggle::before{content:&quot;\25b8&quot;;display:inline-block;transition:transform .2s;font-size:.7rem}
.tree-children{display:none}
.tree-children.show,.tree-children.open{display:block}
.tree-leaf{padding:3px 0 3px 20px;color:var(--text2);font-size:.85rem}

/* Socratic */
.socratic-item{margin-bottom:12px}
.socratic-q{cursor:pointer;padding:12px 16px;border-radius:var(--radius);background:var(--card);border:1px solid var(--border);font-weight:700;transition:all .2s}
.socratic-q:hover{border-color:var(--accent2)}
.socratic-q::before{content:&#x27;\2753 &#x27;}
.socratic-a{display:none;padding:12px 16px;background:#fef9f4;border-radius:0 0 var(--radius) var(--radius);font-size:.85rem;color:var(--text2)}

/* Decision */
.decision-round{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.decision-round .scenario{font-weight:700;margin-bottom:12px;color:var(--accent)}
.d-option{padding:10px 14px;margin:6px 0;border-radius:8px;cursor:pointer;border:1px solid var(--border);transition:all .2s}
.d-option:hover{border-color:var(--accent2);background:#fef9f4}
.d-option.chosen{border-color:var(--accent);background:#fde8e8}
.d-result{display:none;margin-top:12px;padding:14px;border-radius:8px;background:#fef9f4;font-size:.85rem}
.d-result.show{display:block}

/* Buttons */
.btn{padding:10px 24px;border-radius:20px;border:2px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;font-size:.88rem;font-weight:700;transition:all .2s}
.btn:hover{background:#a93226;border-color:#a93226}
.btn-outline{background:transparent;color:var(--accent)}
.btn-outline:hover{background:var(--accent);color:#fff}
.btn-sm{padding:6px 14px;font-size:.78rem}
button:disabled{opacity:.5;cursor:not-allowed}

/* Tables */
.tbl{width:100%;border-collapse:collapse;font-size:clamp(.78rem,1.6vw,.88rem);margin:8px 0}
.tbl th{background:var(--accent);color:#fff;padding:8px 10px;text-align:left}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--border)}
.tbl tr:nth-child(even){background:#fef9f2}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* SVG wrapper */
.svg-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:12px 0;border:1px solid var(--border);border-radius:var(--radius);background:#fffefb;padding:8px}
.svg-wrap svg{min-width:700px;display:block;margin:0 auto}
.legend{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-bottom:10px;font-size:.78rem;color:var(--text2)}
.legend span{display:flex;align-items:center;gap:4px}
.legend .dot{width:12px;height:12px;border-radius:3px;display:inline-block}

/* Path steps */
.path-steps{display:flex;flex-direction:column;gap:10px}
.path-step{display:flex;gap:12px;align-items:flex-start;padding:10px 14px;background:var(--card);border-radius:var(--radius);border-left:4px solid var(--accent2)}
.path-step .step-num{font-size:1.6rem;font-weight:700;color:var(--accent);min-width:36px;text-align:center}
.path-step .step-content h4{color:var(--accent);font-size:.9rem}
.path-step .step-content p{color:var(--text2);font-size:.8rem}

/* Case study */
.case-block{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:14px;border-left:4px solid var(--accent2);box-shadow:var(--shadow)}
.case-block h3{color:var(--accent);margin-bottom:8px}
.case-dim{margin-top:8px;font-size:.83rem}
.case-dim strong{color:var(--accent)}

@media(max-width:640px){
  .tab-bar{gap:2px;padding:6px 2px}
  .tab-btn{padding:5px 8px;font-size:.7rem;border-radius:14px}
  .grid2,.grid3,.grid4{grid-template-columns:1fr}
  .flip-inner,.flip-front,.flip-back{min-height:320px}
  .flip-front{font-size:1.1rem}
  .flip-nav{flex-wrap:wrap;gap:8px}
  .quiz-card{padding:14px}
  .path-step{flex-direction:column}
}
&lt;/style&gt;

&lt;header&gt;
  &lt;h1&gt;吴军·硅谷来信3 — 文明与制度&lt;/h1&gt;
  &lt;div class=&quot;sub&quot;&gt;最小知识集 · 48篇笔记提炼 | 穿越罗马兴衰、启蒙运动、美国建国与犹太文明，洞察历史规律与制度演进&lt;/div&gt;
  &lt;a href=&quot;index.html&quot; class=&quot;home-link&quot;&gt;← 返回知识主板&lt;/a&gt;
&lt;/header&gt;

&lt;div class=&quot;tab-bar&quot; id=&quot;tabBar&quot;&gt;
  &lt;button class=&quot;tab-btn active&quot; data-tab=&quot;0&quot;&gt;知识集总览&lt;/button&gt;

&lt;div class=&quot;container&quot;&gt;

&lt;!-- ===== Tab 0: 知识集总览 ===== --&gt;
&lt;div class=&quot;tab-panel active&quot; data-panel=&quot;0&quot;&gt;

&lt;h2 style=&quot;color:var(--accent);margin:14px 0 6px&quot;&gt;核心目标&lt;/h2&gt;
&lt;div class=&quot;card&quot;&gt;
  &lt;p&gt;穿越罗马兴衰、启蒙运动、美国建国与犹太文明，洞察历史规律与制度演进——用四力模型、八维度法等分析框架，理解文明如何在制度构建、思想启蒙与历史选择中迭代进步，培养个体的现代文明素养。&lt;/p&gt;
&lt;/div&gt;

&lt;h2 style=&quot;color:var(--accent);margin:18px 0 8px&quot;&gt;10 个核心概念&lt;/h2&gt;
&lt;div class=&quot;grid2&quot;&gt;
  &lt;div class=&quot;concept-card mks&quot;&gt;&lt;h4&gt;制度演进与权力制衡&lt;/h4&gt;&lt;p&gt;罗马同心圆管理、美国三权分立与司法审查——制度是文明秩序的骨架&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;concept-card mks&quot;&gt;&lt;h4&gt;四力分析模型&lt;/h4&gt;&lt;p&gt;控制力+向心力 &gt; 破坏力+离心力——政权存续的核心不等式&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;concept-card mks&quot;&gt;&lt;h4&gt;苏格兰启蒙运动&lt;/h4&gt;&lt;p&gt;经验主义、公民社会、商业文明——现代社会的思想起点&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;concept-card mks&quot;&gt;&lt;h4&gt;文明素养六维框架&lt;/h4&gt;&lt;p&gt;平等、尊重、自由、诚信、契约、弱势关怀——个体文明的行为准则&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;concept-card&quot;&gt;&lt;h4&gt;美国身份认同演变&lt;/h4&gt;&lt;p&gt;熔炉→番茄汤→色拉——从同化到多元的文化变迁&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;concept-card&quot;&gt;&lt;h4&gt;不平等形态迭代&lt;/h4&gt;&lt;p&gt;出身→经济→才干——人类社会通过不平等形态迭代实现进步&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;concept-card&quot;&gt;&lt;h4&gt;惩罚性赔偿逻辑&lt;/h4&gt;&lt;p&gt;用经济惩戒驱动系统性改进——西方民事制度的底层逻辑&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;concept-card&quot;&gt;&lt;h4&gt;犹太文明韧性&lt;/h4&gt;&lt;p&gt;一神教起源、马萨达精神、复国运动——文明存续的极端案例&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;concept-card&quot;&gt;&lt;h4&gt;八维度历史分析法&lt;/h4&gt;&lt;p&gt;民族/经济/地理/人口/政治/国际/地域/社会——结构化理解历史&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;concept-card&quot;&gt;&lt;h4&gt;战略战术博弈论&lt;/h4&gt;&lt;p&gt;技术匹配原则、N+1创新、以正合以奇胜——战争中的理性计算&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h2 style=&quot;color:var(--accent);margin:18px 0 8px&quot;&gt;最小知识集（★ 核心骨架）&lt;/h2&gt;
&lt;div class=&quot;grid2&quot;&gt;
  &lt;div class=&quot;concept-card mks&quot;&gt;&lt;h4&gt;★ 四力模型&lt;/h4&gt;&lt;p&gt;控制力+向心力 vs 破坏力+离心力。这是分析任何政权/组织兴衰的通用框架，从罗马帝国到初创企业均可迁移。理解了这个不等式，你就掌握了历史分析的&quot;牛顿定律&quot;。&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;concept-card mks&quot;&gt;&lt;h4&gt;★ 苏格兰启蒙 vs 法国启蒙&lt;/h4&gt;&lt;p&gt;经验主义渐进改良 vs 理性主义破立并举。前者塑造了英美普通法系和商业社会，后者催生了大陆法系和现代政治理论。这是理解现代世界两大文明路径的钥匙。&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;concept-card mks&quot;&gt;&lt;h4&gt;★ 不平等形态迭代论&lt;/h4&gt;&lt;p&gt;出身不平等→经济不平等→智力不平等。每次&quot;进步&quot;只是用一种不平等替代另一种，但可改变性逐级提升——这是理解社会进步本质的核心洞见。&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;concept-card mks&quot;&gt;&lt;h4&gt;★ 文明素养个体性&lt;/h4&gt;&lt;p&gt;&quot;一个族群的文明水平通过每一个个体的行为表达&quot;。制度再好，个体不文明则文明虚设。平等、尊重、自由、诚信、契约、弱势关怀——六维框架是每个现代人的必修课。&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h2 style=&quot;color:var(--accent);margin:18px 0 8px&quot;&gt;概念关系图&lt;/h2&gt;
&lt;div class=&quot;legend&quot;&gt;
  &lt;span&gt;&lt;span class=&quot;dot&quot; style=&quot;background:#c0392b&quot;&gt;&lt;/span&gt; 根节点（核心张力）&lt;/span&gt;
  &lt;span&gt;&lt;span class=&quot;dot&quot; style=&quot;background:#d4a574&quot;&gt;&lt;/span&gt; 四大支柱&lt;/span&gt;
  &lt;span&gt;&lt;span class=&quot;dot&quot; style=&quot;background:#fffaf2;border:1px solid #5a3e3e&quot;&gt;&lt;/span&gt; 子领域&lt;/span&gt;
  &lt;span&gt;&lt;span class=&quot;dot&quot; style=&quot;background:#fdf6ec;border:1px solid #8b7355&quot;&gt;&lt;/span&gt; 终极产出&lt;/span&gt;
&lt;/div&gt;
&lt;div class=&quot;svg-wrap&quot; id=&quot;svgContainer&quot;&gt;&lt;/div&gt;

&lt;h2 style=&quot;color:var(--accent);margin:18px 0 8px&quot;&gt;边界知识表（15条）&lt;/h2&gt;
&lt;div class=&quot;tbl-wrap&quot;&gt;
&lt;table class=&quot;tbl&quot;&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;知识点&lt;/th&gt;&lt;th&gt;应用场景&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;八旗制度真相（镶黄旗为八旗之首）&lt;/td&gt;&lt;td&gt;理解身份建构与历史攀附现象&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;腓尼基字母系统（22字母→希腊/拉丁/阿拉伯）&lt;/td&gt;&lt;td&gt;追溯西方文字的共同源头&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;佛教分裂史（上座部/大众部/大乘）&lt;/td&gt;&lt;td&gt;分析文化传播的入乡随俗 vs 保持传统&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&quot;中等收入陷阱&quot;概念缺陷&lt;/td&gt;&lt;td&gt;识别经济学伪命题，训练逻辑判断力&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;树木年轮气候分析法&lt;/td&gt;&lt;td&gt;跨学科验证历史假说（蒙古崛起/罗马衰落）&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;马斯洛需求层次与印度文化&lt;/td&gt;&lt;td&gt;理解吠陀文明&quot;向内心寻求答案&quot;的认知方式&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;萨古鲁五层面理论（肉身→喜乐体）&lt;/td&gt;&lt;td&gt;探索自我认知与包容的哲学基础&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;弗洛伊德《摩西与一神教》跨界方法论&lt;/td&gt;&lt;td&gt;跨界研究的四个关键启示&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;400mm/800mm等降水线与长城&lt;/td&gt;&lt;td&gt;地理环境决定农耕-游牧文明分野&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;奥斯曼帝国&quot;维持现状&quot;敕令&lt;/td&gt;&lt;td&gt;多宗教共存的政治制度创新&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;英国《航海法案》的双刃剑效应&lt;/td&gt;&lt;td&gt;贸易保护主义短期利己、长期催生竞争对手&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;轧棉机发明的历史偶然性&lt;/td&gt;&lt;td&gt;技术发明如何意外改变历史进程（奴隶制巩固）&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;明治维新&quot;习惯改良而非文化革命&quot;&lt;/td&gt;&lt;td&gt;区分习惯与文化的改革策略&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;金斯伯格大法官退休时机争议&lt;/td&gt;&lt;td&gt;理解终身制法官对政治格局的长期影响&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;文理科生比例与经济发展无关&lt;/td&gt;&lt;td&gt;识别&quot;相关≠因果&quot;的逻辑陷阱&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;
&lt;/div&gt;

&lt;h2 style=&quot;color:var(--accent);margin:18px 0 8px&quot;&gt;学习路径（5阶段）&lt;/h2&gt;
&lt;div class=&quot;path-steps&quot;&gt;
  &lt;div class=&quot;path-step&quot;&gt;&lt;div class=&quot;step-num&quot;&gt;1&lt;/div&gt;&lt;div class=&quot;step-content&quot;&gt;&lt;h4&gt;先搭骨架：掌握四力模型+八维度法&lt;/h4&gt;&lt;p&gt;这是分析一切历史事件和现实组织的通用框架，约2小时建立基本理解。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;path-step&quot;&gt;&lt;div class=&quot;step-num&quot;&gt;2&lt;/div&gt;&lt;div class=&quot;step-content&quot;&gt;&lt;h4&gt;案例穿线：罗马兴衰→美国建国→犹太文明&lt;/h4&gt;&lt;p&gt;用四力模型串联三大文明案例，约3小时。理解制度如何在不同条件下演化。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;

  {name:&#x27;文明素养六维框架&#x27;, def:&#x27;平等(机会平等)、尊重(尊严与利益)、自由(有限自由)、诚信(做人之本)、契约原则(社会基石)、弱势群体关怀(文明温度)&#x27;, analogy:&#x27;如同一个人的六项基本礼仪——缺少任何一项，都会让&quot;文明人&quot;的形象大打折扣&#x27;, example:&#x27;Expedia调查：全球酒店经理对&quot;文明行为&quot;的判断高度一致——礼貌整洁、体贴安静&#x27;, counter:&#x27;将&quot;粗鄙当豪爽&quot;&quot;无知当朴素&quot;&quot;没礼貌当率真&quot;——这些错位的自我认知正是文明的对立面&#x27;},
  {name:&#x27;美国身份认同演变&#x27;, def:&#x27;熔炉(殖民-20世纪末, WASP同化)→番茄汤(二战后, 主流文化+亚文化并存)→色拉(当代, 各族裔共存不融)&#x27;, analogy:&#x27;熔炉是铁矿石炼成钢(融合)，番茄汤是番茄汁里飘着蔬菜块(主次分明)，色拉是各种菜叶拌在一起但各是各的&#x27;, example:&#x27;1998年美墨足球赛：洛杉矶主场观众为墨西哥队加油，殴打挥美国国旗的观众&#x27;, counter:&#x27;亚裔移民：虽初始条件差，但因价值观契合(WASP核心)，平均收入已居各族裔首位&#x27;},
  {name:&#x27;不平等形态迭代论&#x27;, def:&#x27;人类社会通过不平等形态的迭代实现进步：出身不平等→经济不平等→智力/才干不平等，每次迭代提升命运可改变性&#x27;, analogy:&#x27;如同操作系统升级——每次更新不能消除所有bug，但能修复最致命的安全漏洞&#x27;, example:&#x27;法国大革命后，《拿破仑法典》确立民事平等，用经济差异取代出身决定论，爱马仕等品牌诞生于新秩序&#x27;, counter:&#x27;出身不平等下的魏晋南北朝：琅琊王氏子弟&quot;不问马&quot;仍可任大司马，寒门永无晋升可能&#x27;},

  {name:&#x27;八维度历史分析法&#x27;, def:&#x27;美国大学标准分析框架：民族/国家认同、经济贸易科技、地理环境、人口流动、政治权力、国际位置、地域文化差异、社会结构&#x27;, analogy:&#x27;如同医生看病的八个检查维度——只看一个指标会误诊，八维并查才能看清全貌&#x27;, example:&#x27;用八维度法分析企业：员工认同→商业模式→区位优势→业务扩展→管理决策→行业地位→团队文化→治理结构&#x27;, counter:&#x27;传统史书仅聚焦政治权力维度(如《春秋》)，将王朝兴衰简单归因于明君/昏君&#x27;},

function renderCard(i){
  var cd = cardData[i];
  document.getElementById(&#x27;flipFront&#x27;).textContent = cd.name;
  var backHtml = &#x27;&lt;div class=&quot;dim-label&quot;&gt;定义&lt;/div&gt;&lt;p&gt;&#x27;+cd.def+&#x27;&lt;/p&gt;&#x27;;
  backHtml += &#x27;&lt;div class=&quot;dim-label&quot;&gt;类比&lt;/div&gt;&lt;p&gt;&#x27;+cd.analogy+&#x27;&lt;/p&gt;&#x27;;
  backHtml += &#x27;&lt;div class=&quot;dim-label&quot;&gt;示例&lt;/div&gt;&lt;p&gt;&#x27;+cd.example+&#x27;&lt;/p&gt;&#x27;;
  backHtml += &#x27;&lt;div class=&quot;dim-label&quot;&gt;反例&lt;/div&gt;&lt;p&gt;&#x27;+cd.counter+&#x27;&lt;/p&gt;&#x27;;
  document.getElementById(&#x27;flipBack&#x27;).innerHTML = backHtml;
  document.getElementById(&#x27;flipCard&#x27;).classList.remove(&#x27;flipped&#x27;);
  document.getElementById(&#x27;flipCounter&#x27;).textContent = (i+1) + &#x27; / 10&#x27;;
  var btn = document.getElementById(&#x27;learnedBtn&#x27;);
  if(learnedCards.indexOf(i) &gt;= 0){ btn.classList.add(&#x27;learned&#x27;); btn.textContent = &#x27;✓ 已掌握&#x27;; }
  else { btn.classList.remove(&#x27;learned&#x27;); btn.textContent = &#x27;✓ 已掌握&#x27;; }
}

function prevCard(){ currentCard = (currentCard - 1 + 10) % 10; renderCard(currentCard); }
function nextCard(){ currentCard = (currentCard + 1) % 10; renderCard(currentCard); }

function markLearned(){
  var idx = learnedCards.indexOf(currentCard);
  if(idx &gt;= 0){ learnedCards.splice(idx,1); }
  else { learnedCards.push(currentCard); }
  LS.set(&#x27;learnedCards&#x27;, learnedCards);
  renderCard(currentCard);
  updateOverview();
  updateStats();
}

  {q:&#x27;法国大革命用哪种不平等形态取代了&quot;出身不平等&quot;？&#x27;, opts:[&#x27;智力/才干不平等&#x27;,&#x27;经济不平等&#x27;,&#x27;种族不平等&#x27;,&#x27;性别不平等&#x27;], &quot;answer&quot;:1, exp:&#x27;法国大革命通过《拿破仑法典》确立民事平等，用经济地位差异取代了出身决定论——爱马仕、路易威登等品牌正是在新秩序中诞生。关键进步：经济不平等虽受先天因素影响，但后天努力仍可改变命运。&#x27;},

function renderMCQ(){
  var html = &#x27;&#x27;;
  mcqData.forEach(function(q, i){
    html += &#x27;&lt;div class=&quot;quiz-card&quot; id=&quot;mcq_&#x27;+i+&#x27;&quot;&gt;&lt;span class=&quot;q-tag q-mc&quot;&gt;选择题 #&#x27;+(i+1)+&#x27;&lt;/span&gt;&lt;div class=&quot;q-text&quot;&gt;&#x27;+q.q+&#x27;&lt;/div&gt;&#x27;;
    var labels = [&#x27;A&#x27;,&#x27;B&#x27;,&#x27;C&#x27;,&#x27;D&#x27;];
    q.opts.forEach(function(o, j){
      html += &#x27;&lt;div class=&quot;q-option&quot; onclick=&quot;answerMCQ(&#x27;+i+&#x27;,&#x27;+j+&#x27;,this)&quot; id=&quot;mcq_opt_&#x27;+i+&#x27;_&#x27;+j+&#x27;&quot;&gt;&#x27;+labels[j]+&#x27;. &#x27;+o+&#x27;&lt;/div&gt;&#x27;;
    });
    html += &#x27;&lt;div class=&quot;q-feedback&quot; id=&quot;mcq_fb_&#x27;+i+&#x27;&quot;&gt;&lt;/div&gt;&lt;/div&gt;&#x27;;
  });
  document.getElementById(&#x27;mcqContainer&#x27;).innerHTML = html;
}

var mcqAnswered = {};
function answerMCQ(qi, chosen, el){
  if(mcqAnswered[qi]) return;
  mcqAnswered[qi] = true;
  var q = mcqData[qi], correct = q.answer;
  // Disable all options
  for(var j=0;j&lt;4;j++){
    var opt = document.getElementById(&#x27;mcq_opt_&#x27;+qi+&#x27;_&#x27;+j);
    opt.style.pointerEvents = &#x27;none&#x27;;
    if(j === correct) opt.classList.add(&#x27;correct&#x27;);
    if(j === chosen &amp;&amp; j !== correct) opt.classList.add(&#x27;wrong&#x27;);
    if(j === chosen) opt.classList.add(&#x27;selected&#x27;);
  }
  var fb = document.getElementById(&#x27;mcq_fb_&#x27;+qi);
  if(chosen === correct){
    fb.className = &#x27;q-feedback right show&#x27;;
    fb.textContent = &#x27;✅ 正确！&#x27; + q.exp;
    stats.correct++;
  } else {
    fb.className = &#x27;q-feedback wrong-msg show&#x27;;
    fb.textContent = &#x27;❌ 错误。正确答案是 &#x27; + [&#x27;A&#x27;,&#x27;B&#x27;,&#x27;C&#x27;,&#x27;D&#x27;][correct] + &#x27;。&#x27; + q.exp;
    wrongAnswers.push({type:&#x27;mcq&#x27;, q:q.q, chosen:chosen, correct:correct, exp:q.exp});
  }
  stats.total++;
  LS.set(&#x27;stats&#x27;, stats);
  LS.set(&#x27;wrongAnswers&#x27;, wrongAnswers);
  updateStats();
}

function checkSA(i){

function examPickMC(idx, j, el){
  if(examQuestions.mcDone[idx]) return;
  examQuestions.mcAns[idx] = j;
  examQuestions.mcDone[idx] = true;
  for(var k=0;k&lt;4;k++){
    var opt = document.getElementById(&#x27;exam_mc_&#x27;+idx+&#x27;_&#x27;+k);
    opt.style.pointerEvents = &#x27;none&#x27;;
    if(k === j) opt.classList.add(&#x27;selected&#x27;);
  }
}

function updateExamTimer(){
  var m = Math.floor(examSec/60), s = examSec % 60;
  var timer = document.getElementById(&#x27;examTimer&#x27;);
  timer.textContent = m + &#x27;:&#x27; + (s&lt;10?&#x27;0&#x27;:&#x27;&#x27;) + s;
  if(examSec &lt; 120) timer.classList.add(&#x27;warning&#x27;); else timer.classList.remove(&#x27;warning&#x27;);
}

    resultHtml += &#x27;&lt;p style=&quot;font-size:.85rem;margin:4px 0&quot;&gt;&#x27;+(idx+1)+&#x27;. &#x27;+(chosen===q.answer?&#x27;✅&#x27;:&#x27;❌&#x27;)+&#x27; &#x27;+q.q.substring(0,40)+&#x27;...&lt;/p&gt;&#x27;;
  });
  examQuestions.sa.forEach(function(qi, idx){
    var ans = document.getElementById(&#x27;exam_sa_&#x27;+idx).value.trim();
    resultHtml += &#x27;&lt;p style=&quot;font-size:.85rem;margin:4px 0&quot;&gt;简答&#x27;+(idx+1)+&#x27;. &#x27;+(ans?&#x27;✅ 已作答&#x27;:&#x27;⚠ 未作答&#x27;)+&#x27;&lt;/p&gt;&#x27;;
  });
  resultHtml += &#x27;&lt;p style=&quot;margin-top:10px;font-weight:700;color:var(--accent)&quot;&gt;选择题得分: &#x27;+score+&#x27;/&#x27;+totalMc+&#x27; (&#x27;+Math.round(score/totalMc*100)+&#x27;%)&lt;/p&gt;&#x27;;
  resultHtml += &#x27;&lt;p style=&quot;font-size:.82rem;color:var(--text2)&quot;&gt;(简答题不计分，请自行对照参考答案)&lt;/p&gt;&#x27;;

  var weakConcepts = [];
  if(score &lt; 5) weakConcepts.push(&#x27;核心概念掌握不足，建议回到知识卡片系统学习&#x27;);
  if(score &lt; 3) weakConcepts.push(&#x27;四力模型和启蒙运动对比是本专题的骨架概念，建议优先强化&#x27;);
  if(weakConcepts.length &gt; 0) resultHtml += &#x27;&lt;p style=&quot;margin-top:8px;color:var(--accent);font-size:.85rem&quot;&gt;⚠ &#x27;+weakConcepts.join(&#x27;；&#x27;)+&#x27;&lt;/p&gt;&#x27;;

  stats.total += totalMc;
  stats.correct += score;
  LS.set(&#x27;stats&#x27;, stats);
  LS.set(&#x27;wrongAnswers&#x27;, wrongAnswers);
  document.getElementById(&#x27;examResult&#x27;).innerHTML = resultHtml;
  document.getElementById(&#x27;examContent&#x27;).innerHTML = &#x27;&#x27;;
  updateStats();
}

function updateStats(){
  var s = LS.get(&#x27;stats&#x27;, {total:0, correct:0});

  document.getElementById(&#x27;statCorrect&#x27;).textContent = s.correct;
  document.getElementById(&#x27;statRate&#x27;).textContent = s.total &gt; 0 ? Math.round(s.correct/s.total*100)+&#x27;%&#x27; : &#x27;0%&#x27;;
  document.getElementById(&#x27;statConcepts&#x27;).textContent = learnedCards.length;
}

function resetAllData(){
  if(confirm(&#x27;确定要清除全部学习数据（进度、错题、统计）？此操作不可恢复。&#x27;)){

}

// ===== TAB 6: SOCRATIC =====
function renderSocratic(){
  var questions = [
    {q:&#x27;如果四力模型中&quot;控制力+向心力&quot;持续大于&quot;破坏力+离心力&quot;，政权就永远不会衰亡吗？&#x27;,
     a:&#x27;不是。问题在于这四种力量都是动态变化的。同一政策在不同阶段效果可能相反——卡拉卡拉皇帝扩大公民权本想增强向心力，结果反而削弱了核心群体的认同。更重要的是，控制力的提升手段(如加强监控)可能同时增加离心力。四力模型的真正价值不是预测&quot;是否灭亡&quot;，而是提供分析框架识别&quot;哪里正在失衡&quot;。&#x27;},
    {q:&#x27;苏格兰启蒙的&quot;渐进改良&quot;在今天是否就意味着保守和妥协？&#x27;,
     a:&#x27;不是。苏格兰启蒙的核心不是&quot;不改变&quot;，而是&quot;在尊重历史和传统的基础上改变&quot;。它承认理性的边界——我们不能一次性设计完美社会，因为人类的理性不足以预测所有后果(充分性推理原则)。这不是保守，而是对复杂性的敬畏。法国的&quot;破立并举&quot;导致了近百年动荡，而苏格兰路径塑造了持续稳定的制度演进。但这不意味着激进变革永远错误——当现有制度完全僵死时，法国模式也有其历史必然性。&#x27;},
    {q:&#x27;如果说&quot;历史总是用一种不平等取代另一种不平等&quot;，那追求平等还有意义吗？&#x27;,
     a:&#x27;有意义，因为不同不平等形态的&quot;可改变性&quot;不同。出身不平等是先天决定、不可改变的(你无法选择父母)；经济不平等虽有先天因素，但后天努力可以改变(你可以创业致富)；智力/才干不平等虽然也存在先天差异，但教育和训练可以缩小差距。社会进步的本质不是消灭不平等(这不可能),而是不断提升命运的&quot;可改变性&quot;——让更多人有通过努力改变命运的机会。柯立芝的洞见在此：通过增加社会总财富而非再分配来解决贫困。&#x27;},
    {q:&#x27;犹太文明流散两千年未被同化，靠的是宗教戒律还是民族韧性？&#x27;,
     a:&#x27;两者相互强化。戒律(如安息日、饮食规定、成人礼)提供了行为层面的&quot;边界墙&quot;——即使日常使用当地语言，这些行为习惯仍持续标记&quot;我是犹太人&quot;。但更深层的是&quot;马萨达精神&quot;——绝境中为自由抗争、拒绝屈服——这种叙事赋予戒律以意义。以色列建国后的实践进一步证明：既有笃定的信仰(传统)，又能身段柔软(现代高科技产业)才是真正的韧性。&#x27;}
  ];

  var html = &#x27;&#x27;;
  questions.forEach(function(item, i){
    html += &#x27;&lt;div class=&quot;socratic-item&quot;&gt;&lt;div class=&quot;socratic-q&quot; onclick=&quot;toggleSocratic(this)&quot;&gt;&#x27;+item.q+&#x27;&lt;/div&gt;&lt;div class=&quot;socratic-a&quot; id=&quot;soc_a_&#x27;+i+&#x27;&quot;&gt;&#x27;+item.a+&#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;
  });
  document.getElementById(&#x27;socraticContainer&#x27;).innerHTML = html;
}

function toggleSocratic(el){
  var a = el.nextElementSibling;
  if(a &amp;&amp; a.classList.contains(&#x27;socratic-a&#x27;)) a.style.display = a.style.display === &#x27;block&#x27; ? &#x27;none&#x27; : &#x27;block&#x27;;
}

       {text:&#x27;全力增援汉尼拔，变战术胜利为战略胜利&#x27;, result:&#x27;✅ 最佳选择。坎尼会战后罗马60%-80%兵员战死，正是决战时刻。但历史中迦太基选择了&quot;观望&quot;——商人政府计算成本后拒绝增援，导致汉尼拔孤军奋战直至被召回。MKS分析：商业文明的短视(控制力过度制衡)导致无法把握战略窗口。&#x27;, best:true},
       {text:&#x27;谈判求和，趁胜争取最有利的和平条款&#x27;, result:&#x27;⚠ 次优但现实。罗马在坎尼惨败后拒绝谈判——这正体现了农耕文明的韧性(向心力强)。迦太基的短视在于：以为&quot;用钱换和平&quot;可行，忽视了罗马&quot;宁可战死也不投降&quot;的文化差异。&#x27;, best:false},

     ]},

&lt;style&gt;
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{

}
html{font-size:clamp(14px,1.2vw,17px);scroll-behavior:smooth}
body{font-family:&quot;PingFang SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;min-height:100vh;padding-top:50px}
.container{max-width:960px;margin:0 auto;padding:0 clamp(12px,3vw,24px)}

header{text-align:center;padding:clamp(24px,5vh,48px) 0 clamp(16px,3vh,32px)}

header .home-link{display:inline-block;margin-top:12px;padding:6px 20px;border:2px solid var(--accent);border-radius:20px;color:var(--accent);text-decoration:none;font-size:.88rem;transition:all .25s}
header .home-link:hover{background:var(--accent);color:#fff}

.tab-bar{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;flex-wrap:wrap;gap:4px;padding:8px clamp(4px,1vw,12px);background:rgba(253,246,236,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);justify-content:center}
.tab-btn{padding:7px 14px;border:none;border-radius:18px;background:var(--card);color:var(--text2);font-size:.8rem;cursor:pointer;transition:all .2s;white-space:nowrap;border:1px solid transparent}
.tab-btn:hover{border-color:var(--accent2);color:var(--accent)}
.tab-btn.active{background:var(--accent);color:#fff}

.tab-content{display:none;animation:fadeIn .35s ease}
.tab-content.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

h2{font-size:clamp(1.2rem,2vw,1.5rem);color:var(--accent);margin:20px 0 12px;padding-bottom:6px;border-bottom:2px solid var(--accent2)}

&lt;div class=&quot;card&quot;&gt;
&lt;h2&gt;核心目标&lt;/h2&gt;
&lt;p style=&quot;font-size:1.05rem&quot;&gt;理解&lt;strong&gt;前沿科技的发展规律与商业转化逻辑&lt;/strong&gt;：掌握碳中和、储能、AI、6G、脑机接口、mRNA等关键技术的底层原理和产业趋势；学会用「动力-条件-空间」模型评估技术前景；认知科技发展的系统性约束（物理极限、经济成本、制度设计），成为能&lt;strong&gt;理性判断科技趋势、做出明智产业决策&lt;/strong&gt;的前沿观察者。&lt;/p&gt;

&lt;h2&gt;★ 4个MKS核心骨架&lt;/h2&gt;
&lt;div class=&quot;grid2&quot; id=&quot;mksGrid&quot;&gt;&lt;div class=&quot;concept-card mks&quot;&gt;&lt;h4&gt;★ 碳中和系统&lt;/h4&gt;&lt;p&gt;企业分三阶段实现碳中和：运营碳中和→业务全链条碳中和→供应链碳中和，碳配额交易成为新商业形态。CCS技术将CO2注入玄武岩矿化，2年内95%转化为矿物质。...&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;concept-card mks&quot;&gt;&lt;h4&gt;★ 储能技术&lt;/h4&gt;&lt;p&gt;电池无摩尔定律，单位容量年降仅3%，能量密度提升空间≤1倍。锂空气电池理论可提升5-15倍。磷酸铁锂用于大规模储能（更安全），三元锂用于移动设备（高密度）。...&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;concept-card mks&quot;&gt;&lt;h4&gt;★ AI三波发展&lt;/h4&gt;&lt;p&gt;第一波基于规则（专家系统），第二波基于统计模型和机器学习（当前接近尾声），第三波实现人类推理能力（DARPA「AI Next」计划2年投20亿美元突破）。...&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;concept-card mks&quot;&gt;&lt;h4&gt;★ 脑机接口&lt;/h4&gt;&lt;p&gt;实现大脑与外部设备间信息传递。单向输出（意念控制打字），单向输入（电子眼帮色盲患者听到颜色）。双向实现闭环控制（智能假肢同时接收运动指令和触觉反馈）。...&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h2&gt;边界知识表（15条）&lt;/h2&gt;
&lt;div style=&quot;overflow-x:auto&quot;&gt;
&lt;table class=&quot;tbl&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;知识点&lt;/th&gt;&lt;th&gt;使用场景&lt;/th&gt;&lt;th&gt;只需知道&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;&lt;strong&gt;卡尔达肖夫指数&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;评估文明等级的框架&lt;/td&gt;&lt;td&gt;人类尚未达到第一型文明，对自然能量的利用能力仍有限&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;RKP精确定位&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;自动驾驶和地理测绘&lt;/td&gt;&lt;td&gt;依赖地面基站，精度10厘米级，乡村和军事场景成本高&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;PPP精确定位&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;全球范围GNSS应用&lt;/td&gt;&lt;td&gt;厘米级，但无法突破原子震荡导致的物理极限&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;激光冷却技术&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;毫米级定位的未来方向&lt;/td&gt;&lt;td&gt;朱棣文研究成果，已应用于太空空间站建设&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;数据信托&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;隐私保护和数据权益分配&lt;/td&gt;&lt;td&gt;三方契约结构：用户→信托→企业，类似工会角色&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;信使RNA非疫苗应用&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;制药行业技术平台&lt;/td&gt;&lt;td&gt;不仅可制造疫苗，还能助力其他药品研发&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;人造光合作用&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;大气温室气体减排&lt;/td&gt;&lt;td&gt;纳米材料催化，将CO2转化为有用物质&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;端到端AI&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;6G时代的个人设备&lt;/td&gt;&lt;td&gt;减少云端依赖，实现本地智能处理和安全认证&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;香农第二定律&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;通信系统的物理极限&lt;/td&gt;&lt;td&gt;传递更多信息需更高带宽，存在物理极限&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;增强型归因系统&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;网络安全和威胁追踪&lt;/td&gt;&lt;td&gt;DARPA开发，实时识别跟踪恶意网络用户&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;锂空气电池&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;下一代储能技术&lt;/td&gt;&lt;td&gt;理论能量密度可提升5-15倍，目前处于实验室阶段&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;细胞Pro申诉案&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;科研成果权益司法实践&lt;/td&gt;&lt;td&gt;确立政府不介入专利授权裁决的先例&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;视察者悖论&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;统计偏差的认知陷阱&lt;/td&gt;&lt;td&gt;通过统计得到的结果与实际情况系统性不符&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;贝叶斯分类法&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;模式识别和错误率权衡&lt;/td&gt;&lt;td&gt;P1和P2不可同时为零，需根据损失不对称性选择最优策略&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;休谟的叉子&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;知识分类和认知方法选择&lt;/td&gt;&lt;td&gt;区分观念知识（理性主导）和经验知识（经验主导）&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;

&lt;section class=&quot;tab-content&quot; id=&quot;tab6&quot;&gt;
&lt;div id=&quot;socraticContainer&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;h3&gt;碳中和真的可能实现吗？&lt;/h3&gt;&lt;div class=&quot;socratic-item&quot;&gt;&lt;div class=&quot;socratic-q&quot; onclick=&quot;this.nextElementSibling.classList.toggle(&#x27;show&#x27;);this.classList.toggle(&#x27;open&#x27;)&quot;&gt;如果碳中和如此困难，为什么各国还要承诺？&lt;/div&gt;&lt;div class=&quot;socratic-a&quot;&gt;国际承诺既是政治表态也是经济博弈——承诺不代表能轻松实现。据崔屹教授观点，国内媒体对碳中和多持乐观态度，但实际难度远超普遍预期。2030年是关键评估节点。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;socratic-item&quot;&gt;&lt;div class=&quot;socratic-q&quot; onclick=&quot;this.nextElementSibling.classList.toggle(&#x27;show&#x27;);this.classList.toggle(&#x27;open&#x27;)&quot;&gt;如果没有碳中和约束，市场会自行解决能源问题吗？&lt;/div&gt;&lt;div class=&quot;socratic-a&quot;&gt;市场会追求最便宜的能源而非最清洁的能源。当前太阳能发电成本已接近煤电，但输电、储能和入网率才是真正瓶颈。没有政策推动，储能技术投资不足，市场不会自发完成能源转型。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;socratic-item&quot;&gt;&lt;div class=&quot;socratic-q&quot; onclick=&quot;this.nextElementSibling.classList.toggle(&#x27;show&#x27;);this.classList.toggle(&#x27;open&#x27;)&quot;&gt;碳中和的本质是技术问题还是政治经济问题？&lt;/div&gt;&lt;div class=&quot;socratic-a&quot;&gt;三者皆有。技术上有解决方案（CCS、绿色氢、储能），但经济成本巨大（电价可能翻倍），政治上涉及国际博弈和国内利益分配。本质上是人类能否用系统工程思维解决一个全球公共品难题的考验。&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h3&gt;AI会不会统治人类？&lt;/h3&gt;&lt;div class=&quot;socratic-item&quot;&gt;&lt;div class=&quot;socratic-q&quot; onclick=&quot;this.nextElementSibling.classList.toggle(&#x27;show&#x27;);this.classList.toggle(&#x27;open&#x27;)&quot;&gt;GPT-3这么强，为什么说AI离人类智能还很远？&lt;/div&gt;&lt;div class=&quot;socratic-a&quot;&gt;GPT-3的本质是自回归语言模型——它只知其然不知其所以然。问它「脚有多少眼睛」会回答「两只眼睛」，说明它没有常识推理。当前所有AI都是单一功能系统，整体智力远低于人类。人类眼睛分辨率不及老鹰十分之一却不会被老鹰统治——单一优势不等于整体优势。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;socratic-item&quot;&gt;&lt;div class=&quot;socratic-q&quot; onclick=&quot;this.nextElementSibling.classList.toggle(&#x27;show&#x27;);this.classList.toggle(&#x27;open&#x27;)&quot;&gt;那为什么34%的科学家认为「少数人通过超级智能统治多数人」是很大问题？&lt;/div&gt;&lt;div class=&quot;socratic-a&quot;&gt;风险不在于AI本身，而在于掌握AI的人。算法推荐系统已证明少数工程师可以通过算法影响数十亿用户的信息获取和行为选择。权力集中是真实威胁，但它是人的问题而非机器的问题。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;socratic-item&quot;&gt;&lt;div class=&quot;socratic-q&quot; onclick=&quot;this.nextElementSibling.classList.toggle(&#x27;show&#x27;);this.classList.toggle(&#x27;open&#x27;)&quot;&gt;我们该如何平衡AI发展与安全？&lt;/div&gt;&lt;div class=&quot;socratic-a&quot;&gt;DARPA的路径值得参考：在推进AI能力的同时，发展增强型归因系统等安全技术，确保AI为多数人福祉服务而非少数人控制工具。关键是保持技术发展的同时，构建制衡机制。&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h3&gt;脑机接口会让人类变成「半机械人」吗？&lt;/h3&gt;&lt;div class=&quot;socratic-item&quot;&gt;&lt;div class=&quot;socratic-q&quot; onclick=&quot;this.nextElementSibling.classList.toggle(&#x27;show&#x27;);this.classList.toggle(&#x27;open&#x27;)&quot;&gt;现在的脑机接口技术到底达到什么水平？&lt;/div&gt;&lt;div class=&quot;socratic-a&quot;&gt;已从科幻走向实验验证阶段。斯坦福实现了意念控制键盘打字（单向输出），欧洲电子眼帮助色盲患者「听到颜色」（单向输入）。双向接口（如智能假肢）仍在实验室阶段，核心难点是信号噪音过滤和动作控制精度。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;socratic-item&quot;&gt;&lt;div class=&quot;socratic-q&quot; onclick=&quot;this.nextElementSibling.classList.toggle(&#x27;show&#x27;);this.classList.toggle(&#x27;open&#x27;)&quot;&gt;马斯克的公司在这个领域有多大贡献？&lt;/div&gt;&lt;div class=&quot;socratic-a&quot;&gt;宣传价值大于实际意义。IEEE 2020年研讨会的学术报告才是核心技术进展的来源。脑机接口的基础研究主要由大学和学术机构推动。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;socratic-item&quot;&gt;&lt;div class=&quot;socratic-q&quot; onclick=&quot;this.nextElementSibling.classList.toggle(&#x27;show&#x27;);this.classList.toggle(&#x27;open&#x27;)&quot;&gt;这项技术最可能率先在哪落地？&lt;/div&gt;&lt;div class=&quot;socratic-a&quot;&gt;医疗康复领域——帮助瘫痪患者恢复运动功能、修复神经系统损伤。但要达到「人机结合体」的科幻水平，时间节点无人能准确预测。&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h3&gt;科技发展真的让社会更公平吗？&lt;/h3&gt;&lt;div class=&quot;socratic-item&quot;&gt;&lt;div class=&quot;socratic-q&quot; onclick=&quot;this.nextElementSibling.classList.toggle(&#x27;show&#x27;);this.classList.toggle(&#x27;open&#x27;)&quot;&gt;数据上看，技术进步与不平等是什么关系？&lt;/div&gt;&lt;div class=&quot;socratic-a&quot;&gt;技术进步增加了人类总体福祉，但加剧了社会不公平。全球仅51.4%的人口能接触互联网；美国CEO与普通员工薪酬比320:1；招行0.06%的私人银行客户掌握31%的个人客户资产。知识和财富从源头向下传递，离源头越近越受益。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;socratic-item&quot;&gt;&lt;div class=&quot;socratic-q&quot; onclick=&quot;this.nextElementSibling.classList.toggle(&#x27;show&#x27;);this.classList.toggle(&#x27;open&#x27;)&quot;&gt;既然加剧不平等，我们应该放慢技术进步吗？&lt;/div&gt;&lt;div class=&quot;socratic-a&quot;&gt;技术倒退或减速不是答案。专家六大建议中的核心是：创造更多机会（不仅是高端岗位）、营造公平环境、加强团队合作。要确保技术围绕人的需求发展，而非单纯追求效率或利润。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;socratic-item&quot;&gt;&lt;div class=&quot;socratic-q&quot; onclick=&quot;this.nextElementSibling.classList.toggle(&#x27;show&#x27;);this.classList.toggle(&#x27;open&#x27;)&quot;&gt;个人如何在这种趋势下不被落下？&lt;/div&gt;&lt;div class=&quot;socratic-a&quot;&gt;核心原则：尽量靠近信息、创新、财富、教育的源头。正确理解「机会」——不是只指一夜暴富，任何能改善自身处境的机会都值得认真对待。同时建立自己的「基本盘」，实现进可攻退可守。&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ========== TAB 7 ========== --&gt;
&lt;section class=&quot;tab-content&quot; id=&quot;tab7&quot;&gt;
&lt;div id=&quot;caseContainer&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;h3&gt;案例1：Netflix：从DVD邮寄到万亿市值的进化&lt;/h3&gt;
&lt;p style=&quot;font-size:.85rem;color:var(--text2);margin-bottom:12px&quot;&gt;Netflix从90年代末的线上DVD租赁起步，经历两次关键转型：2008年推出在线观看（市值增长近10倍），2013年转型内容自制（《纸牌屋》全球爆红，2019年销售额超200亿美元）。&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;color:var(--accent)&quot;&gt;概念&lt;/h4&gt;&lt;p style=&quot;font-size:.82rem&quot;&gt;持续创新的互联网基因+差异化竞争+杠杆化优势&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;color:var(--accent2)&quot;&gt;类比&lt;/h4&gt;&lt;p style=&quot;font-size:.82rem&quot;&gt;一个租碟小店如何打败9000家门店的巨头百视达——不是靠更低价格，而是靠更匹配新时代的商业模式&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;color:#3a6ea5&quot;&gt;示例&lt;/h4&gt;&lt;p style=&quot;font-size:.82rem&quot;&gt;百视达拒绝以5000万美元收购Netflix，最终Netflix市值达2000亿美元（40个百视达巅峰）；自制内容占比不足千分之一却成为核心竞争壁垒&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;color:#8b7355&quot;&gt;边界&lt;/h4&gt;&lt;p style=&quot;font-size:.82rem&quot;&gt;互联网基因的五大特征（自下而上驱动、高工资无绩效奖金、灵活休假、松耦合协作、精英人才策略）是转型基础，简单模仿难以复制&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h3&gt;案例2：DARPA：美国科技霸权的制度发动机&lt;/h3&gt;
&lt;p style=&quot;font-size:.85rem;color:var(--text2);margin-bottom:12px&quot;&gt;DARPA前身ARPA创建了互联网，后续支持了AI（语音识别/机器学习）、VR技术等重大突破。其运作模式由万尼瓦尔·布什设计：仅负责确定研究方向和分配经费，具体研究由大学和私营机构完成。&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;color:var(--accent)&quot;&gt;概念&lt;/h4&gt;&lt;p style=&quot;font-size:.82rem&quot;&gt;政府投资基础研究而不参与市场竞争——「上帝的归上帝，凯撒的归凯撒」&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;color:var(--accent2)&quot;&gt;类比&lt;/h4&gt;&lt;p style=&quot;font-size:.82rem&quot;&gt;像一个只负责播种和浇水的园丁，绝不自己去抢占阳光——种出来的果实归研究人员和企业&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;color:#3a6ea5&quot;&gt;示例&lt;/h4&gt;&lt;p style=&quot;font-size:.82rem&quot;&gt;DARPA的「AI Next」计划2年投20亿美元支持44个项目（26个大学、10个小公司），定位为「高风险、高回报」；互联网从军事目的转化为民用和商业网络的整个过程&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;color:#8b7355&quot;&gt;边界&lt;/h4&gt;&lt;p style=&quot;font-size:.82rem&quot;&gt;敏感项目仅限美国公民参与；大学和企业长期存在对外籍人士的信息访问限制&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ========== TAB 8 ========== --&gt;
&lt;section class=&quot;tab-content&quot; id=&quot;tab8&quot;&gt;
&lt;div id=&quot;decisionContainer&quot;&gt;&lt;div class=&quot;decision-round&quot; id=&quot;round0&quot;&gt;&lt;div class=&quot;scenario&quot;&gt;第1轮：你是一家传统制造企业的CTO，董事会要求5年内实现碳中和。当前年碳排放500万吨，利润仅3亿美元。你的第一个决策是什么？&lt;/div&gt;&lt;div class=&quot;d-option&quot; onclick=&quot;chooseDecision(0,0,this,&#x27;✓ 很好的选择！这是技术路径中最直接的方式。但需注意CCS会多消耗10-40%燃料，运营成本将大幅增加。冰岛的经验表明2年内可实现95%转化率，是可行的参考路径。&#x27;,&#x27;MKS分析：碳中和是系统性工程——CCS处理排放端（治标），但长远看需要配合能源结构转型（治本）。第一阶段应优先解决最大排放源。&#x27;)&quot;&gt;A. 优先投资CCS碳捕获设备，直接从排放端解决问题&lt;/div&gt;
&lt;div class=&quot;d-option&quot; onclick=&quot;chooseDecision(0,1,this,&#x27;⚠ 短期可行但风险大。碳中和第三阶段要求供应链也达到碳中和，外包只是把问题推迟。就像劳动法规收紧时转移用工模式，最终仍需承担连带责任。&#x27;,&#x27;MKS分析：碳中和对商业模式的影响——企业所有权范围决定碳中和责任边界。外包不是最终解，未来碳配额交易市场将重塑产业格局。&#x27;)&quot;&gt;B. 外包高排放生产环节给供应商，通过转移碳责任达标&lt;/div&gt;
&lt;div class=&quot;d-option&quot; onclick=&quot;chooseDecision(0,2,this,&#x27;⚠ 方向正确但节奏激进。储能技术目前成本高且物理极限明显（电池能量密度提升空间≤1倍），5年内完成能源切换几乎不可能。建议CCS（短期）+能源转型（长期）双轨并行。&#x27;,&#x27;MKS分析：储能技术无摩尔定律，单位容量年降仅3%。系统工程思维——环保需经济基础支撑，激进脱碳可能导致企业破产，反而丧失环保投入能力。&#x27;)&quot;&gt;C. 从零建设太阳能+储能体系，彻底替换化石能源&lt;/div&gt;
&lt;div class=&quot;d-result&quot; id=&quot;result0&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;decision-round&quot; id=&quot;round1&quot;&gt;&lt;div class=&quot;scenario&quot;&gt;第2轮：你是一家VC合伙人，需在以下三个方向中选一个作为未来10年的重仓方向：&lt;/div&gt;&lt;div class=&quot;d-option&quot; onclick=&quot;chooseDecision(1,0,this,&#x27;✓ 有远见的选择！脑机接口技术已从科幻走向实验，但大规模临床应用时间未知。核心风险是基础研究周期长，投资回报可能需要20年以上。建议重点关注电极材料和AI信号处理方向。&#x27;,&#x27;MKS分析：科技预测三要素评估——重要性极高（医疗价值巨大），技术条件部分成熟（电极和AI已有基础），发展空间广阔但时间窗口不确定。属于高回报但长周期的「深科技」投资。&#x27;)&quot;&gt;A. 脑机接口——押注人机融合的未来&lt;/div&gt;

  var learned = getLearned();

function flipPrev() {

function markLearned() {
  var learned = getLearned();
  var cid = CONCEPTS[currentFlip].id;
  if (learned.indexOf(cid) === -1) learned.push(cid);
  else learned = learned.filter(function(x) { return x !== cid; });
  setLearned(learned);
  updateLearnedBtn();
}

  var btn = document.getElementById(&#x27;learnedBtn&#x27;);

  var learned = getLearned();

  btn.textContent = isL ? &#x27;✓ 已学习&#x27; : &#x27;✓ 已学习&#x27;;

function renderMCQ() {
  var container = document.getElementById(&#x27;mcqContainer&#x27;);
  if (!container) return;
  var html = &#x27;&#x27;;
  for (var i = 0; i &lt; MCQS.length; i++) {

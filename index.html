<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MKS 知识总纲</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: #06090f;
  color: #d8dce6;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  text-align: center;
  padding: 24px;
}
.card {
  background: rgba(17,24,39,0.5);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 18px;
  padding: 48px 36px;
  max-width: 480px;
  width: 100%;
}
.card h1 {
  font-size: clamp(1.5rem, 4vw, 2rem);
  font-weight: 800;
  letter-spacing: 0.04em;
  color: #d4a854;
  margin-bottom: 12px;
}
.card p {
  font-size: 0.88rem;
  color: #94a0b8;
  margin-bottom: 24px;
  line-height: 1.6;
}
.card a {
  display: inline-block;
  padding: 10px 28px;
  border-radius: 24px;
  border: 1px solid rgba(212,168,84,0.3);
  color: #d4a854;
  text-decoration: none;
  font-weight: 600;
  font-size: 0.9rem;
  letter-spacing: 0.06em;
  transition: all 0.3s;
}
.card a:hover {
  background: rgba(212,168,84,0.12);
  border-color: rgba(212,168,84,0.5);
}
</style>
</head>
<body>
<div class="card">
  <h1>MKS 知识总纲</h1>
